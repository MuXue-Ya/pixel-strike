  /* 暂停按钮布局：主操作"继续作战"独占一行，两个次要操作（成就 / 设置）横排一行。
     之前五个等大长方形一字排开 —— 那是"功能列表"不是"暂停菜单"，玩家要花时间找"继续"。
     现在主次分层，手指自然落在主按钮上。

     出口决策（重开 / 返回主菜单）不再占按钮位，而是收到面板外的「结束本局 ›」
     文字链里，点开后由独立确认弹窗承载 —— 理由是这两个出口需要"确认"，
     不该和"快速回去"混在同一排抢视觉权重。

     空间不足时压缩按钮高度与间距（下限 20 / 6），同时保证战术面板有最小高度 92px。 */
  const PX = 16, PW = W - 32;
  const botPad = 10;                  // 出口行到底部的留白
  const PANEL_MIN = 92;               // 战术面板最小高度（8 格战况数据的安身之处）
  let mh = 26, MH = 32, gp = 12, eh = 26;

  /* 从底部往上排：出口行（重开/返回）→ 次要行（成就/设置）→ 主按钮（继续作战）。
     出口行放最底部：它是"离开"的语义，离主操作越远越不容易误触。
     抽成函数是因为压缩循环要反复重排 —— 四个尺寸变量每次都在变，
     手写成一串赋值就得在循环里再抄一遍，抄漏一处就是命中区和绘制错位。 */
  function placePauseButtons() {
    const halfW = (PW - gp) / 2;
    const exitY = H - botPad - eh;
    const minorY = exitY - gp - mh;
    const resumeY = minorY - gp - MH;

    PAUSE_BUTTONS.restart.x = PX;                   PAUSE_BUTTONS.restart.y = exitY;
    PAUSE_BUTTONS.restart.w = halfW;                PAUSE_BUTTONS.restart.h = eh;
    PAUSE_BUTTONS.home.x = PX + halfW + gp;         PAUSE_BUTTONS.home.y = exitY;
    PAUSE_BUTTONS.home.w = halfW;                   PAUSE_BUTTONS.home.h = eh;

    PAUSE_BUTTONS.ach.x = PX;                       PAUSE_BUTTONS.ach.y = minorY;
    PAUSE_BUTTONS.ach.w = halfW;                    PAUSE_BUTTONS.ach.h = mh;
    PAUSE_BUTTONS.settings.x = PX + halfW + gp;     PAUSE_BUTTONS.settings.y = minorY;
    PAUSE_BUTTONS.settings.w = halfW;               PAUSE_BUTTONS.settings.h = mh;

    const mw = PW * 0.76;
    PAUSE_BUTTONS.resume.x = PX + (PW - mw) / 2;
    PAUSE_BUTTONS.resume.y = resumeY;
    PAUSE_BUTTONS.resume.w = mw;                    PAUSE_BUTTONS.resume.h = MH;
    return resumeY;
  }

  /* 空间不足时逐级让：先收间距 → 再压次要行/出口行高度 → 最后才压主按钮。
     收敛条件必须覆盖**所有**可变项，否则某一项触底后其余继续减会变成死循环。 */
  while (placePauseButtons() - 12 - 52 < PANEL_MIN &&
         (gp > 6 || mh > 20 || eh > 20 || MH > 24)) {
    if (gp > 6) gp -= 1;
    else if (mh > 20) mh -= 1;
    else if (eh > 20) eh -= 1;
    else MH = Math.max(24, MH - 1);
  }
  placePauseButtons();

  // 可用垂直区间：标题区分隔线下方 → 版权行上方
  // 可用垂直区间：标题区分隔线下方 → 版权行上方
  const L = MENU_LAYOUT;
  /* 下界 H-30 → H-24：版权行画在 H-13（label 档，占 8px），
     原来 botY 与版权行之间白留 17px，而内容区却差 5px 装不下第二行。 */
  const topY = L.topY, botY = H - 24;
  const avail = botY - topY;
  /* 三块性质不同，能牺牲的顺序也不同：
       内容区 stH —— 已按"内容最小高"给预算，再压就丢行（丢的是价格）
       页脚 footH —— 全是文字，压到比字矮就叠字
       动作行 aH —— 可以压，但下限是触摸目标 LAYOUT.control()，不是比例
     所以让位顺序固定为 ① 上下留白 → ② 区块间隙 → ③ 动作行高，然后停手。
     旧写法是一个 scale 全体等比：既把动作行压到 26px（低于下限 32），
     又让内容区跌破双行下限 —— 该保的没保住，不该压的压了。 */
  const footH = menuFootBlockH();
  const stH = statsBlockH();
  const gapMin = DENSE ? 8 : L.gapMin;
  let aH = L.actionH;
  let gap = Math.max(gapMin, Math.min(L.gapMax, (avail - stH - footH - aH) / 2));
  let padTop = L.padTop, padBot = L.padBot;
  let need = stH + aH + footH + gap * 2;
  if (need + padTop + padBot > avail) {
    padTop = padBot = Math.max(0, (avail - need) / 2);              // ① 留白先让
    if (need > avail) {
      gap = Math.max(gapMin, gap - (need - avail) / 2);             // ② 间隙再让
      need = stH + aH + footH + gap * 2;
      if (need > avail) {
        padTop = padBot = 0;
        aH = Math.max(LAYOUT.control(), aH - (need - avail));       // ③ 让到触摸下限为止
        need = stH + aH + footH + gap * 2;
      }
    }
  }
  /* 竖向余量的分配顺序：① 内容块 ② 区块间隙 ③ 底部留白。
     成长树与监护仪的行高都是"给定高度均分"，所以把余量交给内容是零成本的正确答案；
     居中不是 —— 它只是把空档集中到 app bar 下面。 */
  const GAP_ABS = 48;                       // 间隙再放宽的上限：超过就不是节奏而是断裂
  const slack = Math.max(0, avail - padTop - padBot - need);
  const stUse = Math.min(statsBlockH(menuNodeMaxH()), stH + slack);
  let gapUse = gap;
  let rest = slack - (stUse - stH);
  const grow = Math.min(rest, Math.max(0, GAP_ABS - gap) * 2);
  if (grow > 0) { gapUse = gap + grow / 2; rest -= grow; }
  L.gap = gapUse;
  L._stH = stUse;

  let y = topY + padTop;

  MENU_STATS_AREA.x = 22; MENU_STATS_AREA.w = W - 44;
  MENU_STATS_AREA.y = y;
  MENU_STATS_AREA.h = stUse;                  y += stUse + gapUse;

  /* 动作行：开始游戏（左，主操作）+ 图鉴/说明（右，次要）并排各占一半。
     同 y、同 h，只在 x 与宽度上分左右。 */
  const actW = (W - 44 - L.actGap) / 2;
  MENU_START_BTN.x = 22;                      MENU_START_BTN.y = y;
  MENU_START_BTN.w = actW;                    MENU_START_BTN.h = aH;
  MENU_FUNC_BTN[0].x = 22 + actW + L.actGap;  MENU_FUNC_BTN[0].y = y;
  MENU_FUNC_BTN[0].w = actW;                  MENU_FUNC_BTN[0].h = aH;
  y += aH + gapUse;

  MENU_VOL_CTRL.x = 22; MENU_VOL_CTRL.w = W - 44; MENU_VOL_CTRL.h = 22;
  MENU_VOL_CTRL.y = H - 40;   // 音量仍保留，但只在设置页显示

  // 标题区左右两枚胶囊：用户（左）/ 设置（右）。
  // 同宽同高同 y，中间让给居中的"像素突击"副标题（x 101~139）
  MENU_COMMANDER_BTN.w = MENU_CAP_W; MENU_COMMANDER_BTN.h = MENU_CAP_H;
  MENU_COMMANDER_BTN.x = 22;
  MENU_COMMANDER_BTN.y = 88;

  MENU_SETTINGS_BTN.w = MENU_CAP_W; MENU_SETTINGS_BTN.h = MENU_CAP_H;
  MENU_SETTINGS_BTN.x = W - 22 - MENU_CAP_W;
  MENU_SETTINGS_BTN.y = 88;

  MENU_FUNC_BTN[1].w = 0; MENU_FUNC_BTN[1].h = 0;    // 废弃，防误命中
  MENU_FUNC_BTN[2].w = 0; MENU_FUNC_BTN[2].h = 0;
  /* 页脚块的三个 y 全部在这里定，绘制端只读不算。
     旧做法是布局给一个 footY、绘制端自己 -14 / +12 ——
     标题带和进度条因此从没进过预算。 */
  L.footTop = y;
  L.footY = Math.round(y + mdType('titleSm') + 4);
  L.footBarY = L.footY + 12;
  L.footH = footH;

  // 图鉴页两个 tab（横排，位于标题下方）
  const tw = (W - 44 - 8) / 2;
  for (let i = 0; i < 2; i++) {
    CODEX_TAB_BTN[i].x = 22 + i * (tw + 8);
    CODEX_TAB_BTN[i].y = 44;
    CODEX_TAB_BTN[i].w = tw;
    CODEX_TAB_BTN[i].h = 24;
  }

  /* 成就页页签带：与图鉴页签同一条 y/h（44 / 24），两屏来回切页签不会跳位。
     宽度整条通铺（三等分由 mdTabs 自己做），不像图鉴那样留 8px 缝。 */
  ACH_TAB.x = 22; ACH_TAB.y = 44; ACH_TAB.w = W - 44; ACH_TAB.h = 24;

  // 设置页控件
  SET_BTN.mute.x = 22; SET_BTN.mute.w = W - 44; SET_BTN.mute.y = 112; SET_BTN.mute.h = 24;
  /* 设置页分区高度自适应。
     横屏 800x400 → 逻辑高仅 320，四个分区自然高度加起来 300+ 会顶穿返回按钮。
     所以先算自然高度，再按可用空间等比压缩（下限 0.6），
     和主菜单的压缩思路一致：空间不够就压内容，而不是牺牲留白或溢出屏幕。 */
  SET_BTN.back.w = 110; SET_BTN.back.h = 26;
  SET_BTN.back.x = (W - 110) / 2; SET_BTN.back.y = H - 36;
  setLayoutSettings();
}

/* 设置页分区排布：左栏「本机数据」+ 右栏「控件行 + 主题色」。
   原来是音效/画面/主题/数据四区平铺——四个分区等长一栏下来，是"设置列表"
   不是"设置页"；且"数据"是只读统计，和"开关/滑块"混在同一列很别扭。
   现在：
     · 左栏只占顶段：4 张累计统计卡（只读），和主菜单战绩卡同源
     · 右栏续接：静音 / 音量 / FPS 三个统一控件行 + 主题六色
     · 危险操作（清除存档）单独成行，远离其他控件
   横屏（逻辑高仅 320）时整体等比压缩，下限 0.6。 */
let SET_ZONES = [];
/* 右栏三个控件行的 y 与行高单独存放，不塞进 SET_ZONES：
   绘制端拿到的是由 SET_ZONES 重建的 key→zone 映射（drawSettingsPage 里现搭的），
   挂在 z 上的自定义字段会被这一层映射丢掉，绘制只能退回兜底值 ——
   兜底一旦生效，布局就算白算了。独立对象才能原样传到绘制端。 */
let SET_RIGHT = { rows: [], rowH: 0 };
function setLayoutSettings() {
  const C = SET_CTRL;
  const top = 52;
  const bot = SET_BTN.back.y - 10;

  /* ===== 右栏（控件行 + 主题色 + 清除存档）=====
     之前右栏是"自然高度随便长"：色块高度写死 24、主题区高写死 30，
     长出来的部分不管不问。实测结果是两处越界，且**所有分辨率都越界**：
       · 主题色块第二行底部超出主题面板约 46px（色块掉到面板外面）
       · H<=384 时「清除存档」行压住「返回」按钮，H=320 甚至超出屏幕 17px

     现在改为：先算右栏自然总高，再按可用空间整体等比压缩（下限 0.6）——
     与主菜单一致的思路：空间不够就压"内容本身"，而不是让它溢出。
     压缩因子 scale 同时作用于行高、间距、色块高，三者同步缩小，不会互相错位。 */
  const RESET_H = 26;
  // 主题区自然高度 = 标题栏 20 + 两行色块 24×2 + 行距 4 + 底部留白 6。
  // 原代码这里写 30，而内容需要 72 —— 面板天生比内容小一半，色块必然溢出。
  const THEME_NAT = 20 + 24 * 2 + 4 + 6;
  /* ⚠️ 行数是**空间预算的分母**，加行必须同步改这里。
     用户名行加入后是 5 行，而这里还按 4 行算自然总高 ——
     预算少算了一整行（约 23px），scale 因此偏大、压缩不足，
     H=320 下主题面板被挤到压住最后一行控件（实测重叠 5px）。
     这不是"新行挤到了旧布局"，而是预算本身没跟着长。 */
  const SET_ROW_N = 5;                       // 控件行数：用户名 / 静音 / 音量 / FPS / 画质
  const NATURAL = C.ROW_H * SET_ROW_N + 4 * (SET_ROW_N + 1) + 12 + 16 + THEME_NAT + 10 + RESET_H;

  /* 左栏占比自适应：极矮屏（H=320）右栏连 0.6 压缩都放不下时，
     让"本机数据"区让出纵向空间，而不是让右栏溢出或压住返回按钮。
     从 42% 逐步下调到 22% 为止。 */
  let statShare = 0.42, y1 = top, colTop = top, scale = 1;
  for (;;) {
    y1 = top + Math.round((bot - top) * statShare);
    colTop = y1 + 8;
    scale = Math.min(1, (bot - colTop) / NATURAL);
    if (scale >= 0.62 || statShare <= 0.22) break;
    statShare -= 0.04;
  }
  scale = Math.max(0.6, Math.min(1, scale));

  const statH = y1 - top;
  const z = { stat: { key: 'stat', y: top, h: statH } };

  const rowH = Math.round(C.ROW_H * scale);
  const rowGap = Math.round(4 * scale);
  const themePad = Math.round(16 * scale);        // 行区与主题区之间的间隔
  const resetH = Math.round(RESET_H * scale);
  const dataGap = Math.round(10 * scale);

  /* 五个控件行：用户名 / 静音 / 音量 / FPS / 画质。行 y 记进 z.rows，绘制端直接取用，
     不再自己另算一遍累加（排布只应有一个真相来源）。
     用户名行挪进设置页：主菜单左上角胶囊改为纯展示，
     改名入口唯一化 —— 两个入口做同一件事，玩家分不清哪个才是"正式"的，
     且胶囊在标题区高频注视区，误触改名会弹出输入框打断浏览。
     画质是最后一行，所以"下方多留一行"的间距跟在第 5 行之后。 */
  const rows = [];
  let y = colTop;
  for (let i = 0; i < 5; i++) {
    rows.push(y);
    y += rowH + rowGap;
    if (i === 4) y += Math.round(12 * scale);     // 末行下方多留一行，与主题区间隔
  }
  z.rows = rows;
  z.rowH = rowH;
  SET_RIGHT.rows = rows;
  SET_RIGHT.rowH = rowH;

  /* 清除存档行钉在返回按钮上方 —— 两个危险出口绝不能叠在一起，
     叠了就是"误触清档"的直通车。它是硬约束，不参与压缩计算。 */
  const resetY = SET_BTN.back.y - resetH - 6;
  const themeTop = y + themePad;
  /* 页脚（版权行）也占预算：它钉在清除行上方，主题区必须让出这段高度，
     否则主题面板底会压到页脚文字上。 */
  const FOOTER_H = 14;
  const themeBottom = resetY - dataGap - FOOTER_H;

  /* 主题区高度由**剩余空间反推**，而不是写死一个值再让内容去挤。
     色块高度是最后一步的因变量：先定面板能有多大，再决定色块多大，
     这样"色块掉出面板"在数学上就不可能发生。 */
  /* 标题栏不能压到比 label 字号还矮：压了之后标题的墨迹直接盖在第一行色块上
     （横屏实测 -1px）。下限由字号给，不由比例给。 */
  const headerPad = Math.max(mdType('label') + 6, Math.round(20 * scale));
  SET_RIGHT.themeHeaderPad = headerPad;
  const swGap = Math.round(4 * scale);
  const themeBotPad = Math.round(6 * scale);
  let swH = Math.round(24 * scale);
  let themeH = headerPad + swH * 2 + swGap + themeBotPad;
  if (themeTop + themeH > themeBottom) {
    const inner = themeBottom - themeTop - headerPad - swGap - themeBotPad;
    swH = Math.max(mdType('label') + 4, Math.floor(inner / 2));
    themeH = headerPad + swH * 2 + swGap + themeBotPad;
  }
  // 压缩到下限仍放不下（极端比例）：面板上提，但绝不越过右栏起点
  const themeY = Math.min(themeTop, Math.max(colTop, themeBottom - themeH));
  z.theme = { key: 'theme', y: themeY, h: themeH };
  z.data = { key: 'data', y: resetY, h: resetH };
  SET_ZONES = [z.stat, z.theme, z.data];

  /* 画质分段按钮：四个（自动 / 低 / 中 / 高）横排在末行右侧。
     位置在布局里算好并写回 SET_BTN.qseg —— 与主题色块同一套做法：
     绘制端和命中端读同一个矩形，绝不各算一遍。 */
  {
    const qy = rows[4];            // 画质是第 5 行（用户名插入后顺延）
    const n = QUALITY_MODES.length;
    const segH = Math.max(12, Math.min(18, rowH - 4));
    // 右端与开关行对齐：末行右侧留 14，宽度按可用空间均分
    const right = 22 + (W - 44) - 8;
    const left = 22 + C.LABEL.pad + 30;           // 标签「画质」之后起排
    const totalW = right - left;
    /* 段间无缝：MD3 分段按钮是一整条共用外框的控件，段与段只隔 1px 竖线。
       布局若按带间距算，写回的矩形就会与画出来的那条对不上。 */
    const segW = Math.max(18, totalW / n);
    const segY = qy + (rowH - segH) / 2;
    for (let i = 0; i < n; i++) {
      SET_BTN.qseg[i].x = left + i * segW;
      SET_BTN.qseg[i].y = segY;
      SET_BTN.qseg[i].w = segW;
      SET_BTN.qseg[i].h = segH;
    }
  }

  // 主题色块：两行三列，位置由面板高度反推得出
  const sw = Math.round(((W - 44) - 2 * 6) / 3);
  const swatchTop = themeY + headerPad;
  for (let i = 0; i < 6; i++) {
    const col = i % 3, row = (i / 3) | 0;
    SET_BTN.theme[i].x = 22 + col * (sw + 6);
    SET_BTN.theme[i].y = swatchTop + row * (swH + swGap);
    SET_BTN.theme[i].w = sw; SET_BTN.theme[i].h = swH;
  }
  SET_BTN.reset.x = 22; SET_BTN.reset.w = W - 44; SET_BTN.reset.h = resetH;
  SET_BTN.reset.y = resetY;

  /* 三个控件行的命中矩形必须跟着真实行位置走。
     之前 mute.y 写死 112、fps.y 从未赋值（恒为 0）——
     行是画在 rows[] 上的，命中区却在另一个坐标：
       · FPS 开关的命中区落在 y 0~24（屏幕最顶上），点设置页顶部会误触它
       · 静音行的命中区固定在 112，而实际行在 y1+8，两者根本不重合
     这就是"设置页点了没反应 / 点错地方"的来源。
     现在统一由布局写入：画在哪，就点哪。 */
  SET_BTN.name.y = rows[0]; SET_BTN.name.h = rowH;
  SET_BTN.mute.y = rows[1]; SET_BTN.mute.h = rowH;
  SET_BTN.vol.y = rows[2];  SET_BTN.vol.h = rowH;
  SET_BTN.fps.y = rows[3];  SET_BTN.fps.h = rowH;
  SET_BTN.name.x = 22; SET_BTN.name.w = W - 44;
  SET_BTN.mute.x = 22; SET_BTN.mute.w = W - 44;
  SET_BTN.vol.x = 22;  SET_BTN.vol.w = W - 44;
  SET_BTN.fps.x = 22;  SET_BTN.fps.w = W - 44;
}

/* 主菜单点击分发（抽成函数，避免逻辑埋在事件回调里难以复用与验证）。
   子页面优先：各自控件先处理，点空白则返回主菜单。
   返回 'drag' 表示命中音量滑块，需要后续 pointermove 继续拖动。 */
/* 设置页点击处理（主菜单与暂停态共用）。
   抽成独立函数是因为设置页有**两个入口**：主菜单右上角胶囊、暂停面板的「设置」按钮。
   原先只有 handleMenuTap 里写了这套逻辑，暂停态的 handleButtonPress 直接一句
   "设置页打开就 uiCloseTop()" —— 结果暂停中打开设置页后，
   **任何点击都只是把页面关掉**，静音开关/音量条/FPS/主题色块/清除存档全部点不动。

   返回值语义（调用方据此决定后续动作）：
     'drag' → 命中音量滑块，需要后续 pointermove 继续拖动
     true   → 命中了某个控件，本次点击已消费
     false  → 未命中任何控件（视为点空白，由调用方决定是否关闭页面） */
function handleSettingsTap(x, y, fromPause) {
  if (hitSetVolumeArea(x, y)) { setVolDragging = true; setVolumeFromPointer(x); return 'drag'; }
  if (hitTest(SET_BTN.name, x, y)) { Audio.ui(900); uiOpen('name'); return true; }
  if (hitTest(SET_BTN.mute, x, y)) { Audio.toggleMute(); Audio.ui(700); return true; }
  if (hitTest(SET_BTN.fps, x, y)) { toggleFps(); return true; }
  // 画质：点某一档直接切换；点行内空白不做任何事（避免误触改档）
  if (hitTest({ x: 22, y: SET_RIGHT.rows[4], w: W - 44, h: SET_RIGHT.rowH }, x, y)) {
    for (let i = 0; i < SET_BTN.qseg.length; i++) {
      if (hitTest(SET_BTN.qseg[i], x, y)) { setQualityMode(i); Audio.ui(820 + i * 70); return true; }
    }
    return true;   // 命中行但没命中分段：消费掉，别穿透关页面
  }
  // 主题色块：即时生效，不用确认按钮。色块自身就是预览
  for (let i = 0; i < SET_BTN.theme.length; i++) {
    if (hitTest(SET_BTN.theme[i], x, y)) { if (setTheme(i)) Audio.ui(900 + i * 90); return true; }
  }
  if (hitTest(SET_BTN.reset, x, y)) {
    // 二次确认：清除存档不可撤销，防误触
    if (resetConfirm) { clearAllData(); resetConfirm = false; Audio.ui(300); }
    else { resetConfirm = true; Audio.ui(500); }
    return true;
  }
  // 点空白：只关设置页，绝不穿透到下层（暂停态下尤其危险 —— 不能顺手把游戏继续了）
  uiCloseTop();
  if (fromPause) Audio.play(600, 0.07, 'square', 0.03, 900);
  else Audio.ui(600);
  return true;
}

function handleMenuTap(x, y) {
  // 图鉴页：先判 tab，其余位置一律返回主菜单（与设置页一致的交互）
  if (codexPage.active) {
  // 武器选择条：点格子切换选中武器（切 tab 之外的新交互）
  if (codexPage.active && codexPage.tab === 1) {
    for (let i = 0; i < CODEX_WEAPON_TABS.length; i++) {
      const tb = CODEX_WEAPON_TABS[i];
      if (tb && hitTest(tb, x, y)) {
        if (codexPage.weaponSel !== i) { codexPage.weaponSel = i; Audio.ui(1000); }
        return true;
      }
    }
  }
    if (hitTest(CODEX_TAB_BTN[0], x, y)) { codexPage.tab = 0; Audio.ui(800); return true; }
    if (hitTest(CODEX_TAB_BTN[1], x, y)) { codexPage.tab = 1; Audio.ui(800); return true; }
    // 点空白关闭：交给栈顶处理（栈决定关谁，不用在这里写死）
    uiCloseTop(); Audio.ui(600); return true;
  }
  if (settingsPageActive) return handleSettingsTap(x, y, false);
  if (hitTest(MENU_SETTINGS_BTN, x, y)) { uiOpen('settings'); Audio.ui(1000); return true; }
  if (hitTest(MENU_FUNC_BTN[0], x, y)) { uiOpen('codex'); Audio.ui(1000); return true; }

  /* 标签切换：真实状态 menuPage 立刻变，视觉偏移交给补间。
     不等动画播完再切 —— 那样连点会丢输入，且状态与显示脱节。 */
  for (let i = 0; i < menuTabRect.length; i++) {
    if (hitTest(menuTabRect[i], x, y)) {
      if (menuPage !== i) {
        menuPage = i;
        Anim.add(menuPageX, { v: i }, 0.25, EASE.out);
        Audio.ui(700 + i * 100);
      }
      return true;
    }
  }

  /* 成长树节点：点节点是"买这一级"，不是开始游戏 ——
     必须在这里 return，否则会掉到下面的 startGame() 直接开局。 */
  if (menuPage === 0) {
    for (let i = 0; i < menuNodeRect.length; i++) {
      if (!hitTest(menuNodeRect[i], x, y)) continue;
      const u = TREE_UPGRADES[i];
      if (buyTreeUpgrade(u.id)) {
        nodeFlashT[u.id] = uiTime;
        Audio.ui(880 + upgLevel(u.id) * 60);
        pushToast(u.name, '提升至 Lv.' + upgLevel(u.id), u.color);
      } else {
        // 买不起 / 已满级：给一声低音，不做惩罚性提示（避免频繁弹窗烦人）
        Audio.ui(300);
      }
      return true;
    }
  }

  /* ⚠️ 点空白**不再**直接开局。
     这是单页菜单时代的"点任意处快速开始"设计，但现在主菜单有成长树和 Tab：
     点两个节点之间的 5px 缝隙、点标题、点底部空白都会直接开局 ——
     是最严重的误触源（想买升级，手指一偏，游戏开了）。

     开局改为只能点"开始游戏"按钮（160×42，足够大且视觉最突出）。
     其余空白一律消费掉但不做任何事，避免穿透到下层。 */
  /* 开始游戏现在与图鉴并排在同一行（两页共用），所以**两页都可点**。
     原来它单独在成长页、战绩页不显示 —— 那个限制是为了防"看数据时误触开局"，
     但当时真正的元凶是"点任意空白都能开局"（已单独修复）。
     现在它是明确的按钮，与图鉴同类，没必要在战绩页隐藏：
     隐藏会让左半格空着（布局虽不跳动但看着像缺块），且切换页时按钮凭空消失很突兀。 */
  if (hitTest(MENU_START_BTN, x, y)) { startGame(); return true; }
  return true;
}

function hitTest(btn, x, y) { return x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h; }
/* 设置页音量控件行的可拖动区：右端 78px 宽的轨道。
   与旧版独立滑块不同——音量现在嵌在控件行里（和静音开关同一行高），
   拖动区只是该行右侧的条带，点一下就跳到对应比例，拖着走可连续调节。 */
function hitSetVolumeArea(x, y) {
  const tx = W - 22 - 86;
  if (x < tx - 6 || x > tx + 72 || Audio.isMuted) return false;
  /* 命中区直接读 SET_BTN.vol —— 它的 y/h 由 setLayoutSettings 同步成真实行位置。
     原来这里用"mute.y + h + 4"现算下一行，而 mute.y 本身是写死的 112，
     算出来的位置和实际绘制的音量行差了一截，拖动条根本点不中。 */
  const v = SET_BTN.vol;
  if (y >= v.y - 2 && y <= v.y + v.h + 2) { setVolRowY = v.y; return true; }
  return false;
}
let setVolRowY = 0;
let setVolDragging = false;
function setVolumeFromPointer(px) {
  const tx = W - 22 - 86;
  const ratio = Math.max(0, Math.min(1, (px - (tx - 6)) / 62));
  Audio.setVolume(ratio);
}

function updateVolumeFromX(x) {
  const trackX = 46, trackW = W - 92;
  const ratio = Math.max(0, Math.min(1, (x - trackX) / trackW));
  Audio.setVolume(ratio);
}

let weaponGlow = 0;   // 武器切换流光计时
function selectWeapon(i) {
  if (i < 0 || i >= WEAPON_COUNT) return;
  // 放在越界检查之后：无效索引不该计入战况统计
  if (i !== player.weapon) { runSwitches++; weaponGlow = 0.5; Audio.ui(1050); }
  player.weapon = i;
  if (!weaponUsed[i]) { weaponUsed[i] = true; checkAllWeapons(); }
}

function handleButtonPress(x, y) {
  /* 主菜单垮掉期间吞掉所有点击：此时菜单还在往下掉，
     但状态已经是 MODE_PLAY —— 不挡的话玩家点一下就会命中下面的暂停按钮或道具栏，
     在"菜单还没走完"的时候触发游戏内操作，观感很割裂。 */
  if (menuFall < 1) return true;
  /* 结算页：按钮出现（goAnim > 3.2）前吞掉所有点击，出现后**只认两个按钮**。
     原来这里无分支，落到 8769 行的"点任意处重开"—— 右边加了"返回菜单"之后，
     想返回的人点偏一点就会直接重开，且不可逆。
     空格键快速重开仍保留（键盘路径不受影响）。 */
  if (state.mode === MODE_OVER) {
    if (goAnim > 3.2) {
      if (hitTest(OVER_BTN.retry, x, y)) { Audio.play(660, 0.08, 'square', 0.03, 900); startGame(); return true; }
      if (hitTest(OVER_BTN.home, x, y)) { Audio.play(400, 0.1, 'square', 0.03, 300); uiCloseAll(); returnToMenu(); return true; }
    }
    return true;      // 其余一律吞掉：结算页不该有点空白就触发的动作
  }
  if (paused && state.mode === MODE_PLAY) {
    // 暂停时点击右上角暂停按钮同样可以恢复
    if (hitTest(BUTTONS.pause, x, y)) { resumeGame(); return true; }
    /* 设置页打开时：走与主菜单**同一套**控件处理，不能一律当"点空白关页面"。
       原来这里无条件 uiCloseTop()，导致暂停中打开设置页后所有控件都点不动
       （静音/音量/FPS/主题色块/清除存档全部失效，只有关闭页面这一个效果）。
       'drag' 需向上传递，让 pointermove 能继续拖动音量滑块。 */
    if (settingsPageActive) return handleSettingsTap(x, y, true);
    // 成就页打开时：页签先判命中（读 drawAchPage 写回的 ACH_TAB_BTN），其余点击返回主暂停面板
    if (achPageActive) {
      for (let i = 0; i < ACH_TAB_BTN.length; i++) {
        if (hitTest(ACH_TAB_BTN[i], x, y)) {
          if (achFilter !== i) { achFilter = i; Audio.ui(800); }
          return true;
        }
      }
      uiCloseTop(); Audio.play(600, 0.07, 'square', 0.03, 900);
      return true;
    }
    /* 折线图指标切换：三个 tab 画在面板内、命中区由绘制端写回，
       点选后不关闭面板（暂停态的点击应停留在这块数据板上）。 */
    for (let i = 0; i < PAUSE_TREND_TABS.length; i++) {
      if (hitTest(PAUSE_TREND_TABS[i], x, y)) {
        if (trendMetric !== i) { trendMetric = i; Audio.play(760 + i * 90, 0.06, 'square', 0.03, 900); }
        return true;
      }
    }
    if (hitTest(PAUSE_BUTTONS.resume, x, y)) { resumeGame(); return true; }
    if (hitTest(PAUSE_BUTTONS.ach, x, y)) {
      uiOpen('ach'); Audio.play(700, 0.08, 'square', 0.03, 1100);
      return true;
    }
    if (hitTest(PAUSE_BUTTONS.settings, x, y)) {
      uiOpen('settings'); Audio.play(700, 0.08, 'square', 0.03, 1000);
      return true;
    }
    /* 出口一级化：重开 / 返回主菜单都在面板上直接生效，不再走二次确认弹窗。
       返回主菜单原先藏在「结束本局 ›」文字链 → 弹窗的二级路径里，
       玩家在暂停面板上根本看不到入口 —— 这才是"返回缺失"的真正原因。 */
    if (hitTest(PAUSE_BUTTONS.restart, x, y)) {
      Audio.play(500, 0.1, 'square', 0.03, 400);
      paused = false; startGame();
      return true;
    }
    if (hitTest(PAUSE_BUTTONS.home, x, y)) {
      Audio.play(400, 0.1, 'square', 0.03, 300);
      uiCloseAll(); returnToMenu();
      return true;
    }
    return true;
  }
  // 道具栏优先于暂停按钮之外的所有判定：它占的是可玩区，点它不该顺带移动飞机
  if (state.mode === MODE_PLAY && !paused) {
    for (let i = 0; i < ITEM_N; i++) {
      if (hitTest(itemRect(i), x, y)) { useItem(i); return true; }
    }
  }
  if (hitTest(BUTTONS.pause, x, y)) {
    if (state.mode === MODE_PLAY) {
      paused = !paused; Audio.play(500, 0.06, 'square', 0.02, 700);
      if (paused) Audio.stopBGM(); else Audio.startBGM();
    }
    return true;
  }
  if (paused) return false;
  if (state.mode !== MODE_PLAY) return false;
  if (upgradePanel.active) return false;
  for (let i = 0; i < WEAPON_COUNT; i++) {
    if (hitTest(BUTTONS.weapon[i], x, y)) { selectWeapon(i); Audio.play(600, 0.04, 'square', 0.02, 800); return true; }
  }
  return false;
}

const UP_PANEL = { x: 20, w: W - 40, y0: 110, h: 48, gap: 8 };
// 跳过按钮：三张卡下方。位置由卡数推导（卡池可能不足 3 张）
const UP_SKIP_BTN = { x: 20, w: W - 40, y: 0, h: 26 };

/* 升级面板布局：卡片高度与起始 y 按屏幕高度自适应。
   原写死 y0=110 / h=48 / gap=8，在横屏（H=320）下**必然重叠**：
     第三张卡占 222~270，而「剩余 N 秒」画在 H-60=260 —— 压在卡片上；
     跳过按钮 282~308，「点击卡片购买」画在 H-42=278 —— 又压一次。
   现在改为按可用区间反推：先算能分多少高度，再决定卡片多高、从哪开始。

   两个副作用是**有意为之**：
     · 卡片高度不够 58 时不显示 tip（矮屏优先保证名字/数字/价格可读）
     · 高屏上卡片区垂直居中，不再全堆在顶部留一大片空 */
let upShowTip = true;
function upLayout() {
  const n = Math.max(1, upgradePanel.options.length || 3);
  const top = HUD_H + 52;                 // 标题 + 金币行之下
  /* 底部提示画在 H-30，文字高约 7px —— 再留 10px 间隙，
     否则跳过按钮底会正好贴在提示文字顶上（H=320 时两者都是 290，紧贴无呼吸）。 */
  const botLimit = H - 30 - 10;
  let gap = 8; const skipH = 26, skipGap = 4;   // gap 会在矮屏被压缩，不能是 const
  const avail = botLimit - skipH - skipGap - top;
  /* 每张卡高度：带 tip 需 58+，纯数字下限 46（再矮图标和两行文字就打架了）。
     上限 62 —— 再高只会让卡片之间空得像分隔线，不增加信息。 */
  let h = Math.floor((avail - gap * (n - 1)) / n);
  h = Math.max(46, Math.min(62, h));
  /* 矮屏三级收缩：卡高触底后先收**间距**，仍放不下才允许降到硬下限 42。
     只有第一级（压卡高）时 H=320 会溢出约 10px，跳过按钮底正好贴到底部提示。
     顺序不能反：先压卡高会让三张卡都变得难读，而间距从 8 收到 4 视觉代价小得多。 */
  let blockH = n * h + gap * (n - 1);
  while (blockH > avail && gap > 4) { gap -= 1; blockH = n * h + gap * (n - 1); }
  if (blockH > avail) {
    h = Math.max(42, Math.floor((avail - gap * (n - 1)) / n));
    blockH = n * h + gap * (n - 1);
  }
  upShowTip = h >= 58;
  UP_PANEL.h = h;
  UP_PANEL.gap = gap;
  UP_PANEL.y0 = Math.round(top + Math.max(0, (avail - blockH) / 2));
}
function upSkipY() {
  const n = upgradePanel.options.length;
  /* 原式 n*(h+gap) 比卡片区实际底部多算了一个 gap（最后一张卡后面没有间隙），
     把跳过按钮白白往下推 8px —— 矮屏上这点余量正好被提示文字吃掉。 */
  return UP_PANEL.y0 + n * UP_PANEL.h + (n - 1) * UP_PANEL.gap + 4;
}
/* 道具槽矩形。绘制与命中判定共用同一份 ——
   HUD 那次"命中区写死、绘制算出来"导致全屏点不动的教训不能再犯。 */
function itemRect(i) {
  const top = HUD_H + 6, bot = H - WB_H - 6;
  const y0 = Math.round((top + bot) / 2 - ITEM_TOTAL / 2);
  return { x: ITEM_X, y: y0 + i * (ITEM_S + ITEM_GAP), w: ITEM_S, h: ITEM_S };
}

// 拾取道具入栏。返回是否收下（满则丢弃并提示，不让掉落白费）
function addItem(k) {
  const idx = ITEM_SLOTS.findIndex(t => t.k === k);
  if (idx < 0) return false;
  /* 上限已取消（见 ITEM_MAX = Infinity）：不再有"满格丢弃"这条分支。
     此前这里会 pushToast('xx已满') 并 return false —— 打得好反而丢道具。
     仍走一次 itemCap 判断（恒不触发），好处是如果将来要恢复上限，
     改一个常量即可，UI 的满格提示也会跟着回来，不用重新接线。 */
  if (itemCounts[idx] >= itemCap(idx)) {
    pushToast(ITEM_SLOTS[idx].name + '已满', '上限 ' + itemCap(idx), ITEM_SLOTS[idx].color);
    return false;
  }
  itemCounts[idx]++;
  return true;
}

function useItem(i) {
  if (i < 0 || i >= ITEM_SLOTS.length) return;
  if (state.mode !== MODE_PLAY || paused || upgradePanel.active || !player.alive) return;
  if (itemCounts[i] <= 0) { Audio.play(180, 0.08, 'square', 0.02, 120); return; }
  const it = ITEM_SLOTS[i];
  itemCounts[i]--;
  Audio.ui(760);
  switch (it.k) {
    case 'bomb': bombBlast(); break;
    case 'slow':
      slowT = SLOW_TIME;
      flashScreen = Math.max(flashScreen, 0.2); flashColor = '#7be9ff';
      pushToast('时间缓速', SLOW_TIME + ' 秒', '#7be9ff');
      break;
    case 'repair': {
      const before = state.hp;
      state.hp = Math.min(state.maxHp, state.hp + REPAIR_HEAL);
      pushToast('应急维修', '+' + Math.round(state.hp - before) + ' 生命', '#4ade80');
      explode(player.x, player.y, '#4ade80', 10, 70);
      break;
    }
    case 'collect': {
      /* 逐个 applyPowerup 而不是直接给分：掉落的可能是道具也可能是增益，
         走同一条结算路径才不会漏掉"满栏折算""成就触发"这些副作用。 */
      const n = powerups.length;
      const list = powerups.slice();
      powerups.length = 0;
      for (const p of list) { applyPowerup(p.type, p.x, p.y); explode(p.x, p.y, '#ff7be9', 5, 50); }
      pushToast('磁力吸引', n > 0 ? '吸取 ' + n + ' 个' : '场上无掉落', '#ff7be9');
      break;
    }
    case 'barrier': {
      const before = player.shield;
      player.shield = Math.min(SHIELD_MAX, player.shield + SHIELD_ITEM_AMT);
      pushToast('护盾发生器', '+' + Math.round(player.shield - before) + ' 点', '#7be9ff');
      explode(player.x, player.y, '#7be9ff', 10, 70);
      break;
    }
  }
}

function handleUpgradeTap(x, y) {
  for (let i = 0; i < upgradePanel.options.length; i++) {
    const oy = UP_PANEL.y0 + i * (UP_PANEL.h + UP_PANEL.gap);
    if (x >= UP_PANEL.x && x <= UP_PANEL.x + UP_PANEL.w && y >= oy && y <= oy + UP_PANEL.h) { buyUpgrade(i); return; }
  }
  // 跳过按钮优先于"点空白关闭"：明确的入口不该被空白点击抢走
  const sk = UP_SKIP_BTN; sk.y = upSkipY();
  if (x >= sk.x && x <= sk.x + sk.w && y >= sk.y && y <= sk.y + sk.h) { closeUpgradePanel(); return; }
  closeUpgradePanel();
}

/* ==================================================================
   星空 & 敌人
   ================================================================== */
/* ==================================================================
   太空背景：星区配色 / 气辉 / 星云 / 5 层视差星场 / 天体锚点
   原则：全部生成式绘制 + 离屏缓存，运行时只做位移，不进热路径重算
   ================================================================== */

// 星区主题：随波次推进，色相缓慢漂移，让"旅程在前进"被感觉到
/* 星区扩到 8 个（原 4 个，第 16 波后永远卡在"赤色深空"）。
   后 4 个带 hazard（环境规则）：地带从"换壁纸"变成"换规则"。

   hazard.m 是**属性乘数**，键与乘数函数对应：
     rate 射速 / taken 受伤 / drop 掉落 / move 移速
   全部为纯属性修正，不引入新机制（热量条、惯性滑行这类要新系统 + 新 HUD，
   且会和现有 8 种拾取状态叠成两套规则，玩家学不会）。

   难度递进：前 4 个无惩罚 → 5~8 逐步加码，
   让"打到第几波"有了除敌人数量之外的第二个压力维度。 */
const STAR_ZONES = [
  { name:'猎户边境', top:'#070b1a', bot:'#0b1228', neb:['#2a4d8f', '#3a7bd5', '#1c3f7a'], nebA:0.15 },
  { name:'玫瑰星云', top:'#0d0818', bot:'#1a0a26', neb:['#8b2f6f', '#5a1f5e', '#c04a8a'], nebA:0.19 },
  { name:'麒麟暗域', top:'#04120f', bot:'#071a18', neb:['#1f6f5c', '#2a8f70', '#12463f'], nebA:0.15 },
  { name:'赤色深空', top:'#12060c', bot:'#1e0810', neb:['#8f2436', '#c03a2f', '#5c1a26'], nebA:0.20 },
  { name:'冰封环带', top:'#061420', bot:'#0a2436', neb:['#4a90c4', '#7ec8e8', '#28607f'], nebA:0.17,
    hazard:{ id:'cold',  name:'寒冷', desc:'移速 -22% · 射速 -18%', color:'#7be9ff', m:{ move:0.78, rate:0.82 } } },
  { name:'恒星熔炉', top:'#1a0a04', bot:'#2e1006', neb:['#e8722a', '#ffa040', '#a03c14'], nebA:0.22,
    hazard:{ id:'heat',  name:'过热', desc:'受伤 +35%',              color:'#ff7043', m:{ taken:1.35 } } },
  { name:'磁暴涡旋', top:'#0a0618', bot:'#160a2c', neb:['#9a6bd8', '#c89aff', '#5c3a94'], nebA:0.20,
    hazard:{ id:'storm', name:'磁暴', desc:'掉落减半 · 射速 -12%',   color:'#b06bff', m:{ drop:0.5, rate:0.88 } } },
  { name:'虚空洞穴', top:'#050510', bot:'#0a0a1c', neb:['#3a4a6f', '#5a6a94', '#1a2036'], nebA:0.14,
    hazard:{ id:'void',  name:'虚空', desc:'移速 -15% · 受伤 +25%',  color:'#8ab4d8', m:{ move:0.85, taken:1.25 } } }
];
function zoneIndexForWave(wave) { return Math.min(STAR_ZONES.length - 1, Math.max(0, Math.floor((wave - 1) / 5))); }
/* 上一次所处的地带索引：只在**跨地带**时提示环境效果，
   否则每波都弹一次 toast，第 6~10 波连弹 5 次同样的"冰封环带"就是噪音。 */
let lastZoneIdx = 0;

// 确定性随机：星云/行星必须每次生成同一结果，方便缓存与复用
function makeRnd(seed) {
  let s = (seed >>> 0) || 1;
  return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

// 星云：多个径向渐变团块叠加成不规则云团（比噪声实现更快，且不依赖 ImageData）
function makeNebula(size, seed, colors) {
  const rnd = makeRnd(seed);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 34; i++) {
    const cx = rnd() * size, cy = rnd() * size;
    const r = size * (0.10 + rnd() * 0.26);
    const col = colors[Math.floor(rnd() * colors.length)];
    const grad = g.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, hexA(col, 0.5));
    grad.addColorStop(1, hexA(col, 0));
    g.fillStyle = grad;
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  }
  return c;
}
// 行星：统一光照（光来自左上 45°），右下自动变暗，建立可信光源逻辑
function makePlanet(r, colors) {
  const c = document.createElement('canvas'); c.width = c.height = r * 2;
  const g = c.getContext('2d');
  const lx = r * 0.62, ly = r * 0.62;
  const grad = g.createRadialGradient(lx, ly, r * 0.08, r, r, r);
  grad.addColorStop(0, colors[1]);
  grad.addColorStop(0.5, colors[0]);
  grad.addColorStop(1, '#05070f');
  g.fillStyle = grad; g.beginPath(); g.arc(r, r, r - 1, 0, Math.PI * 2); g.fill();
  g.globalCompositeOperation = 'lighter';
  g.strokeStyle = hexA(colors[2], 0.5); g.lineWidth = 1.5;   // 大气散射 rim light
  g.beginPath(); g.arc(r, r, r - 1.5, 0, Math.PI * 2); g.stroke();
  g.globalAlpha = 0.25; g.fillStyle = colors[2];
  g.beginPath(); g.arc(r, r, r - 1, -Math.PI * 0.9, -Math.PI * 0.1); g.fill();  // 晨昏线高光
  return c;
}

let NEBULA_CACHE = [];      // 每星区一张预渲染星云
let PLANET_CACHE = [];      // 行星离屏图缓存
const PLANET_COLORS = [
  ['#3a5f8f', '#8ab4d8', '#3ad1ff'],
  ['#6f4a8a', '#c9a7e8', '#e879f9'],
  ['#8f5a3a', '#e8b48a', '#ff9f43'],
  ['#3a7f6a', '#8ae8c9', '#4ade80']
];

// 5 层视差：速度比 1 : 0.6 : 0.35 : 0.18 : 0.08
// 原版三层"同向同速、只有大小不同"等于没做视差，速度感完全缺失
const STAR_LAYERS = [
  { px: 0.08, v: 6,  s: 1, c: '#3f5872', n: 22 },  // 最远：银河背景辐射，几乎不动
  { px: 0.18, v: 13, s: 1, c: '#5b7fa3', n: 20 },
  { px: 0.35, v: 27, s: 1, c: '#8ab4d8', n: 18 },
  { px: 0.60, v: 47, s: 1, c: '#cfe6ff', n: 14 },
  { px: 1.00, v: 78, s: 2, c: '#ffffff', n: 8  }   // 最近
];

const stars = [];
let bgT = 0;
/* 动态环境元素：流星与尘埃带。
   这两个是"稀有但高辨识度"的元素 —— 出现频率必须低，
   否则会干扰弹幕可读性；但完全没有的话太空就少了生气。 */
let meteors = [];
let meteorTimer = 6 + Math.random() * 8;
let dustBand = null;      // 斜向尘埃带，缓慢扫过
let dustTimer = 20 + Math.random() * 20;

function spawnMeteor() {
  // 从上方/侧上方进入，斜向高速掠过，带拖尾
  const fromLeft = Math.random() < 0.5;
  const speed = 180 + Math.random() * 140;
  const ang = (fromLeft ? 0.35 : -0.35) + (Math.random() - 0.5) * 0.2;
  meteors.push({
    x: fromLeft ? -10 : W + 10,
    y: Math.random() * H * 0.55,
    vx: Math.cos(ang) * speed * (fromLeft ? 1 : -1),
    vy: Math.sin(ang) * speed + 60,
    len: 14 + Math.random() * 22,
    life: 0,
    c: Math.random() < 0.3 ? '#ffd166' : (Math.random() < 0.5 ? '#7be9ff' : '#eafcff')
  });
}
function spawnDustBand() {
  dustBand = {
    y: H * (0.15 + Math.random() * 0.6),
    h: 18 + Math.random() * 26,
    tilt: (Math.random() - 0.5) * 0.35,
    life: 0,
    dur: 14 + Math.random() * 10,
    c: Math.random() < 0.5 ? '#3ad1ff' : '#b06bff'
  };
}
function updateEnvironment(dt) {
  // 低端档位关闭流星，保证弱机帧率
  meteorTimer -= dt;
  if (meteorTimer <= 0 && quality >= 0.7) {
    spawnMeteor();
    meteorTimer = (state.mode === MODE_PLAY ? 5 : 3) + Math.random() * 8;
  }
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.x += m.vx * dt; m.y += m.vy * dt; m.life += dt;
    if (m.x < -60 || m.x > W + 60 || m.y > H + 40) { i === meteors.length - 1 ? meteors.pop() : meteors.splice(i, 1); }
  }
  if (dustBand) {
    dustBand.life += dt;
    dustBand.y -= dt * 6;                       // 缓慢上移，制造穿越感
    if (dustBand.life > dustBand.dur) { dustBand = null; dustTimer = 18 + Math.random() * 22; }
  } else {
    dustTimer -= dt;
    if (dustTimer <= 0 && quality >= 0.7) spawnDustBand();
  }
}
let planet = null;          // 当前天体锚点
let auraSprite = null;      // 气辉噪声纹理

function makeAura(size, seed) {
  const rnd = makeRnd(seed);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 14; i++) {
    const cx = rnd() * size, cy = rnd() * size, r = size * (0.2 + rnd() * 0.35);
    const col = rnd() < 0.5 ? '#1b3a5c' : '#2a2050';
    const grad = g.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, hexA(col, 0.35)); grad.addColorStop(1, hexA(col, 0));
    g.fillStyle = grad; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  }
  return c;
}

function initStars() {
  stars.length = 0;
  const nScale = 0.55 + quality * 0.45;   // 低端设备减少星数
  for (const L of STAR_LAYERS) {
    const n = Math.max(4, Math.round(L.n * nScale));
    for (let i = 0; i < n; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H, s: L.s, c: L.c, v: L.v * (0.85 + Math.random() * 0.3), px: L.px });
    }
  }
  stars.sort((a, b) => (a.c < b.c ? -1 : a.c > b.c ? 1 : 0)); // 同色相邻，绘制时少切换 fillStyle
}

function initBackground() {
  NEBULA_CACHE = STAR_ZONES.map((z, i) => makeNebula(160, 1000 + i * 137, z.neb));
  PLANET_CACHE = PLANET_COLORS.map((c, i) => makePlanet(48, c));
  auraSprite = makeAura(160, 77);
}
initBackground();
initStars();

function spawnPlanet(wave) {
  const idx = (wave + Math.floor(Math.random() * 3)) % PLANET_CACHE.length;
  const sprite = PLANET_CACHE[idx];
  const r = sprite.width / 2;
  planet = {
    sprite, r,
    x: (Math.random() < 0.5 ? -1 : 1) * 30 + W / 2 + (Math.random() - 0.5) * W * 0.5,
    y: HUD_H + 30 + Math.random() * (H * 0.35),
    vx: (Math.random() < 0.5 ? -1 : 1) * (5 + Math.random() * 7),
    depth: 0.22
  };
}

function drawBackground() {
  const zone = STAR_ZONES[zoneIndexForWave(state.wave)];

  // --- 第 1 层：深空气辉（替换纯黑底，色相随星区漂移）---
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, zone.top);
  grad.addColorStop(1, zone.bot);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  if (auraSprite) {
    const as = W * 1.6;
    const ox = -(bgT * 3) % as, oy = -(bgT * 2) % as;
    ctx.globalAlpha = 0.5;
    ctx.drawImage(auraSprite, ox, oy, as, as);
    ctx.drawImage(auraSprite, ox + as, oy, as, as);
    ctx.globalAlpha = 1;
  }

  // --- 第 2 层：星云（lighter 叠加，双图不同速横向滚动）---
  const neb = NEBULA_CACHE[zoneIndexForWave(state.wave)];
  if (neb) {
    const nw = W * 1.4;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = zone.nebA * quality;
    const ox1 = -(bgT * 4) % nw;
    ctx.drawImage(neb, ox1, -H * 0.1, nw, H * 1.2);
    ctx.drawImage(neb, ox1 + nw, -H * 0.1, nw, H * 1.2);
    ctx.restore();
  }

  // --- 第 4 层：天体锚点（行星），放在星场之前，确立景深 ---
  if (planet) {
    const px = planet.x + (player.x - W / 2) * -planet.depth * 0.4;
    const py = planet.y + bgT * 1.5;
    ctx.globalAlpha = 0.85;
    ctx.drawImage(planet.sprite, Math.round(px - planet.r), Math.round(py - planet.r));
    ctx.globalAlpha = 1;
  }

  // --- 第 3 层：5 层视差星场 ---
  // 速度感来源：纵向恒定下落 + 横向随玩家移动产生视差偏移
  const parX = (player.x - W / 2);
  const stretch = ultActive > 0;   // 超载时星星拉成线，经典超光速视觉语言
  let lastC = '';
  for (const s of stars) {
    if (s.c !== lastC) { ctx.fillStyle = s.c; lastC = s.c; }
    const x = s.x - parX * s.px * 0.35;
    const xi = ((x % W) + W) % W;
    if (stretch) ctx.fillRect(xi | 0, s.y | 0, s.s, s.s * 4);
    else ctx.fillRect(xi | 0, s.y | 0, s.s, s.s);
  }

  // --- 第 5 层：尘埃带（极淡的斜向光带，只在穿过时可见）---
  if (dustBand) {
    const d = dustBand;
    const fade = Math.min(1, Math.min(d.life, d.dur - d.life) / 2.5);   // 两端淡入淡出
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.13 * fade * quality;
    const g = ctx.createLinearGradient(0, d.y - d.h / 2, 0, d.y + d.h / 2);
    g.addColorStop(0, hexA(d.c, 0)); g.addColorStop(0.5, d.c); g.addColorStop(1, hexA(d.c, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, d.y - d.h / 2 + W * d.tilt);
    ctx.lineTo(W, d.y - d.h / 2);
    ctx.lineTo(W, d.y + d.h / 2);
    ctx.lineTo(0, d.y + d.h / 2 + W * d.tilt);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // --- 第 6 层：流星（高速掠过 + 拖尾，稀有出现）---
  if (meteors.length) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const m of meteors) {
      const nx = m.vx, ny = m.vy;
      const nl = Math.hypot(nx, ny) || 1;
      const tx = (nx / nl) * m.len, ty = (ny / nl) * m.len;
      const g = ctx.createLinearGradient(m.x, m.y, m.x - tx, m.y - ty);
      g.addColorStop(0, m.c); g.addColorStop(1, hexA(m.c, 0));
      ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - tx, m.y - ty); ctx.stroke();
      ctx.fillStyle = m.c; ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.arc(m.x, m.y, 1.1, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
}

function spawnEnemy(type) {

  const x = 16 + Math.random() * (W - 32);
  enemies.push({
    id: enemyIdCounter++, type, x, bx: x, y: -12, w: d.w, h: d.h,

// 难度曲线：基础小怪权重随波次衰减，高级怪逐步接管，
// 避免打到十几波还是满屏 1 血小怪、难度曲线走平
function pickEnemyType(wave) {
  /* 长度从 ENEMY_DEFS 派生，不写死 6。
     原本数组初始化、total 累加、抽样循环三处各自硬编码 6，
     而 ENEMY_DEFS 恰好也是 6 条 —— 现在能跑纯属巧合。
     加第 7 种怪时这三处不会跟着长，新怪权重永远是 0、永远刷不出来，
     而且不报错不崩溃，只会表现为"新怪从来没出现过"，极难定位。
     ⚠️ 每个下标仍是按 type 逐个赋值的：新增敌人类型必须在这里补一行权重，
     否则它权重为 0（能靠本函数安全忽略，但等于白加）。 */
  const w = new Array(ENEMY_DEFS.length).fill(0);
  w[0] = Math.max(10, 46 - wave * 3.5);
  if (wave >= 2) w[1] = 18 + Math.min(16, wave * 1.2);
  if (wave >= 2) w[2] = 14 + Math.min(22, wave * 1.6);
  if (wave >= 3) w[3] = 12 + Math.min(16, wave * 1.1);
  if (wave >= 4) w[4] = 10 + Math.min(24, wave * 1.8);
  if (wave >= 3) w[5] = 10 + Math.min(14, wave * 0.9);
  let total = 0;
  for (let i = 0; i < w.length; i++) total += w[i];
  let x = Math.random() * total;
  for (let i = 0; i < w.length; i++) if ((x -= w[i]) < 0) return i;
  return 0;
}

function randomPowerupType() {
  const r = Math.random();
  let t;
  /* 概率分配（合计 100%）：即时增益 65% / 入栏道具 35%。
     五个道具槽各 7% —— 均分而不是给某几个更高权重，
     因为它们的价值都取决于"什么时候用"，没有谁天然更值得掉。
     ⚠️ 新增道具必须同时改这里 + applyPowerup 的 switch + ITEM_SLOTS，
     三处缺一就会掉出来却捡不到（collect/barrier 就漏过一次）。 */
  if (r < 0.15) t = 'power'; else if (r < 0.27) t = 'heal'; else if (r < 0.38) t = 'shield';
  else if (r < 0.45) t = 'bomb'; else if (r < 0.52) t = 'slow'; else if (r < 0.59) t = 'repair';
  else if (r < 0.66) t = 'collect'; else if (r < 0.73) t = 'barrier';
  else if (r < 0.83) t = 'spread'; else if (r < 0.91) t = 'magnet'; else t = 'drone';
  // 满血时不让血包浪费（溢出只转 3 秒盾，收益太低），改为掉落即时战力道具
  if (t === 'heal' && state.hp >= state.maxHp) t = Math.random() < 0.5 ? 'shield' : 'spread';
  if (t === 'drone' && drones.length >= MAX_DRONES) t = 'power';
  return t;
}

/* ==================================================================
   波次 & Boss
   ================================================================== */
function startWave(n) {
  state.wave = n; waveClock = 0; waveQueue = []; state.waveDelay = 2.2;
  if (n % 5 === 0) { state.waveDelay = 3.6; spawnBoss(n); waveTotal = 0; return; }
  /* 敌人数：线性（5+n×3）→ 对数（5 + n^0.72 × 3）。
     原公式下第 10 波 35 个、第 20 波 65 个、第 30 波 95 个，
     而玩家输出上限几乎不变（伤害卡封顶 +10%）——
     到 15 波后屏幕密度必然超出清场能力，不是技术问题而是数值决定的。
     对数增长后：第 10 波 20 个、第 20 波 30 个、第 30 波 39 个，
     增长放缓但总量仍在爬升，配合成长树正好对冲。 */
  const count = 5 + Math.floor(Math.pow(n, 0.72) * 3);
  waveTotal = count;
  /* 芯片保底：第 2 波起每波开局直接给 1 枚。
     纯 20% 概率下，连续十几个怪不掉是完全可能的（约 1.1% 概率整波 0 枚），
     那种"打完一波什么都没有"的挫败感远大于概率本身的收益。 */
  if (n >= 2) { addChips(1); }
  const gap = Math.max(0.14, 0.55 - n * 0.032);
  for (let i = 0; i < count; i++) waveQueue.push({ t: i * gap, type: pickEnemyType(n) });
  if (n % 5 === 0) planet = null;
  if (n >= 2 && !planet && Math.random() < 0.55) spawnPlanet(n);
  banner.text = '第 ' + n + ' 波'; banner.sub = n === 1 ? '准备迎战' : (STAR_ZONES[zoneIndexForWave(n)].name); banner.t = 1.8; banner.color = '#3ad1ff';
  /* 跨地带时提示环境效果：让玩家知道"接下来这片区域的规则变了"。
     副文案写明"离开本地带失效" —— 否则玩家会以为这是永久 debuff 而放弃，
     实际上熬过这 5 波就恢复了。 */
  const zi = zoneIndexForWave(n);
  if (zi !== lastZoneIdx) {
    lastZoneIdx = zi;
    const hz = STAR_ZONES[zi].hazard;
    if (hz) pushToast('环境 · ' + hz.name, hz.desc + ' · 离开本地带失效', hz.color);
  }
  // 第 3 波起 20% 概率触发随机事件（放在波次开始，让玩家提前知道这波的变数）
  if (n >= 3 && Math.random() < 0.20) triggerEvent();
  if (n === 10) checkAchievement('wave_10');
  Audio.play(520, 0.09, 'square', 0.03, 780);
  setTimeout(() => Audio.play(700, 0.12, 'square', 0.03, 980), 110);
}

function spawnBoss(wave) {
  const typeIndex = Math.floor((wave - 1) / 5) % BOSS_TYPES.length;
  const type = BOSS_TYPES[typeIndex];
  const spr = BOSS_SPRITES[typeIndex];
  /* Boss 血量系数 42 → 35（修改清单第 6 条的真实结论）。
     ⚠️ 原报告第 6 条写的是"给 Boss 加减伤 40%，防止散射 DPS 爆表秒 Boss"——
     实测把这条的**前提推翻了**：火力上限是 4 不是 10，散射满级 Boss TTK
     在第 30 波是 35.2 秒，一点都不快。此时加 40% 减伤会把它推到 59 秒，
     是帮倒忙。所以**不加减伤**，改为按报告批准的目标（第 30 波 ≤30 秒）
     反推血量系数：
       散射满级 DPS = 6 弹 × 1 伤 × dmgOf(1.2) / cool 0.11 ≈ 65.5
       目标 30 秒 → HP ≈ 1965 → (180 + 30c) × 1.6 = 1965 → c ≈ 35
     ⚠️ 这个系数只把"中位武器"压到目标线，**没有**动武器间的差距：
     电弧/脉冲仍然是 65~78 秒量级。那是设计意图（它们是清屏武器，
     打 Boss 本就该换武器），不是 bug —— 见 power_dead_level_test 的 TTK 表。 */
  const hp = Math.round((180 + wave * 35) * type.hpMul);
  boss = {
    typeIndex, x: W / 2, y: -40, w: type.w, h: type.h, hp, maxhp: hp, vx: 0, vy: 0, t: 0,
    entering: true, targetY: HUD_H + 30, flash: 0, attackTimer: 1.6, atkMul: type.atkMul,
    sprite: spr.sprite, white: spr.white, color: type.color, accent: type.accent, name: type.name
  };
  banner.text = '首领'; banner.sub = type.name; banner.color = type.color; banner.t = 2.4;
  Audio.play(120, 0.6, 'sawtooth', 0.06, 60);
  setTimeout(() => Audio.play(80, 0.8, 'square', 0.05, 40), 200);
}

function bossAttack(b) {
  const hpRatio = b.hp / b.maxhp;
  const extra = hpRatio < 0.4 ? 1 : 0;
  const pat = Math.floor(Math.random() * 3);
  if (pat === 0) {
    const n = Math.round((4 + extra) * b.atkMul);
    const spread = 0.9;
    for (let i = 0; i < n; i++) {
      const a = Math.PI / 2 + (i - (n - 1) / 2) * (spread / n);
      ebullets.push({ x: b.x, y: b.y + b.h / 2, vx: Math.cos(a) * 130, vy: Math.sin(a) * 130, boss: true, color: b.accent });
    }
    Audio.play(180, 0.12, 'square', 0.025, 100);
  } else if (pat === 1) {
    if (player.alive) {
      const dx = player.x - b.x, dy = player.y - (b.y + b.h / 2);
      const base = Math.atan2(dy, dx);
      const n = Math.round((3 + extra) * b.atkMul);
      for (let i = 0; i < n; i++) {
        const a = base + (i - (n - 1) / 2) * 0.2;
        ebullets.push({ x: b.x, y: b.y + b.h / 2, vx: Math.cos(a) * 190, vy: Math.sin(a) * 190, boss: true, color: b.accent });
      }
      Audio.play(250, 0.08, 'square', 0.02, 160);
    }
  } else {
    const n = Math.round((6 + extra * 2) * b.atkMul);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + b.t * 2.2;
      ebullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * 105, vy: Math.sin(a) * 105, boss: true, color: b.accent });
    }
    Audio.play(300, 0.1, 'triangle', 0.02, 150);
  }
}

function updateBoss(rawDt) {
  const dt = enemyDt(rawDt);   // Boss 与敌弹同步减速
  if (!boss) return; const b = boss; b.t += dt; if (b.flash > 0) b.flash -= dt;
  const MIN_X = 26, MAX_X = W - 26, MIN_Y = HUD_H + 20, MAX_Y = H - WB_H - 14;
  if (b.entering) {
    b.y += 58 * dt;
    if (b.y >= b.targetY) {
      b.y = b.targetY; b.entering = false;
      b.vx = (Math.random() < 0.5 ? -1 : 1) * (42 + Math.random() * 24);
      b.vy = (Math.random() < 0.5 ? -1 : 1) * (26 + Math.random() * 20);
    }
    return;
  }
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  if (b.x < MIN_X) { b.x = MIN_X; b.vx = Math.abs(b.vx); }
  if (b.x > MAX_X) { b.x = MAX_X; b.vx = -Math.abs(b.vx); }
  if (b.y < MIN_Y) { b.y = MIN_Y; b.vy = Math.abs(b.vy); }
  if (b.y > MAX_Y) { b.y = MAX_Y; b.vy = -Math.abs(b.vy); }
  if (Math.random() < dt * 0.5) {
    b.vx += (Math.random() - 0.5) * 60;
    b.vy += (Math.random() - 0.5) * 50;
    if (Math.abs(b.vx) < 30) b.vx = Math.sign(b.vx || 1) * 30;
    if (Math.abs(b.vx) > 90) b.vx = Math.sign(b.vx) * 90;
    if (Math.abs(b.vy) < 18) b.vy = Math.sign(b.vy || 1) * 18;
    if (Math.abs(b.vy) > 60) b.vy = Math.sign(b.vy) * 60;
  }
  if (!b.entering && particles.length < particleCap() && Math.random() < dt * 2.5) {
    spawnParticle({
      x: b.x + (Math.random() - 0.5) * b.w,
      y: b.y + (Math.random() - 0.5) * b.h,
      vx: (Math.random() - 0.5) * 16,
      vy: (Math.random() - 0.5) * 16,
      life: 0.3 + Math.random() * 0.2, max: 0.5,
      color: b.accent, size: 2, glow: true
    });
  }
  b.attackTimer -= dt;
  if (b.attackTimer <= 0) {
    addShockwave(b.x, b.y, b.accent, 6, 70);
    bossAttack(b);
    const base = Math.max(0.6, 1.3 - state.wave * 0.03);
    b.attackTimer = base / b.atkMul;
  }
}

/* 内爆：从四周向中心塌缩的粒子，表现"能量被抽走"。
   首领死亡要先向内塌陷 0.2s 再爆开 —— 直接炸开是"碎了"，
   先塌陷再炸开才是"被抽干后崩解"，仪式感完全不同。 */
function addImplosion(x, y, color, count = 14) {
  const cap = particleCap();
  for (let i = 0; i < count && particles.length < cap; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 34 + Math.random() * 30;      // 从远处出发
    const sp = 90 + Math.random() * 60;     // 朝中心飞（速度反向）
    spawnParticle({
      x: x + Math.cos(a) * r, y: y + Math.sin(a) * r,
      px: x + Math.cos(a) * r, py: y + Math.sin(a) * r,
      vx: -Math.cos(a) * sp, vy: -Math.sin(a) * sp,
      life: 0.2, max: 0.2, color, size: 1, glow: true
    });
  }
  addShockwave(x, y, color, 20, 30);        // 一道快速内收的细环
}

function killBoss() {
  if (!boss) return;
  /* Boss 必掉芯片：Boss 是一场硬仗的固定奖励，
     不给随机 —— 打完 Boss 什么都拿不到会让人怀疑值不值。 */
  addChips(CHIP_BOSS_DROP); const bx = boss.x, by = boss.y, bColor = boss.color, bAccent = boss.accent; boss = null;
  /* 首领死亡仪式：塌陷 0.2s → 爆开。
     时间缓动让这一下"被看见"：0.3s 内全局 0.4 倍速，配合塌陷与爆开。 */
  addImplosion(bx, by, bColor, 16);
  addImplosion(bx, by, '#ffffff', 6);
  slowmo = 0.3;
  for (let i = 0; i < 7; i++) {
    scheduleAfter((i * 85 + 200) / 1000, () => {
      if (state.mode !== MODE_PLAY) return;
      const ox = bx + (Math.random() - 0.5) * 34, oy = by + (Math.random() - 0.5) * 26;
      explode(ox, oy, '#ff9f43', 18, 145); explode(ox, oy, '#ffffff', 8, 90);
      state.shake = Math.max(state.shake, 8);
    });      // +200ms：等塌陷演完再开始爆
  }
  const bonus = 300 + state.wave * 50;
  state.score += bonus;
  state.coins += 35 + state.wave * 3;
  state.shake = 6;    // 塌陷阶段只轻微震动，主爆的强震延后到 +200ms
  for (const b of ebullets) explode(b.x, b.y, bAccent, 3, 40);
  ebullets.length = 0;
  const drops = ['power', 'medkitBig', 'heal', 'drone'];
  if (drones.length >= MAX_DRONES) drops[3] = 'spread';
  for (let i = 0; i < 4; i++) powerups.push({ x: bx + (i - 1.5) * 22, y: by, vy: 58, t: 0, type: drops[i] });
  banner.text = '首领击破'; banner.sub = '+' + bonus; banner.color = '#ffd166'; banner.t = 2.4;
  checkAchievement('boss_1');
  Audio.play(90, 0.9, 'sawtooth', 0.07, 30);
  scheduleAfter(0.15, () => Audio.play(140, 0.5, 'square', 0.05, 40));
  scheduleAfter(0.32, () => Audio.play(200, 0.4, 'triangle', 0.04, 60));
  /* 主爆延后到 +200ms：塌陷演完才炸开。
     之前主爆是**立即**执行的，和塌陷同帧发生 —— 于是"先塌陷再爆开"
     这个仪式根本没演出来，玩家只看到一团东西同时出现。 */
  scheduleAfter(0.2, () => {
    if (state.mode !== MODE_PLAY) return;
    explode(bx, by, bColor, 22, 130);
    addNova(bx, by, bColor, 9, 44);
    addChroma(0.5);
    state.shake = Math.max(state.shake, 16);
    flashScreen = 0.45; flashColor = '#ffd166';
  });
}

/* ==================================================================
   成就 / 爆炸 / 飘字
   ================================================================== */
function checkAchievement(id) {
  if (achievements[id]) return;
  achievements[id] = true; localStorage.setItem('pixelraider_ach', JSON.stringify(achievements));
  const ach = ACHIEVEMENTS.find(a => a.id === id);
  if (ach) { achPopup.text = ach.name; achPopup.t = 2.5; Audio.play(800, 0.15, 'triangle', 0.04, 1400); }
}
// 倒序遍历时使用：把末位元素搬到 i 再 pop，O(1) 删除，避免 splice 的整体搬移
function swapRemove(arr, i) {
  const last = arr.length - 1;
  if (i !== last) arr[i] = arr[last];
  arr.pop();
}
/* 爆炸分三档，越大的爆炸层次越多：
     小 (<8)   仅粒子
     中 (8-15) 粒子 + 闪核 + 单环 + 少量碎片
     大 (>=16) 粒子 + 闪核 + 双环(副环延迟) + 余烬 + 更多碎片
   这样小击杀不会满屏特效糊视线，Boss 死亡才给足仪式感。 */
/* ==================================================================
   结构化爆炸层
   ==================================================================
   旧的爆炸只有一个形态：随机方向撒一把粒子 + 一圈光。
   小怪死亡和 Boss 死亡看起来只是"大一点"，没有层级 ——
   玩家无法从特效判断"这一下打中了什么级别的东西"。

   现在按规模分三级，每级**结构不同**（不只是半径不同）：
     L1 小爆：中心闪白 → 少量碎片          普通子弹命中
     L2 中爆：外扩环 + 碎片 + 中心光晕收缩   导弹/炸弹命中
     L3 大爆：三层环 + 碎片雨 + 地面残留光    Boss 死亡 / 清屏

   环用 stroke arc、光晕用径向渐变、残留用半透明圆点 ——
   三种绘制方式混用才撑得起"层级感"，全用圆点会糊成一团。 */
const blasts = [];
const BLAST_CAP = 18;          // 同屏结构化层数上限，防止连锁爆炸拖垮帧率

function blastLevel(count) { return count >= 16 ? 3 : (count >= 8 ? 2 : 1); }

function addBlast(x, y, color, level) {
  if (blasts.length >= BLAST_CAP) blasts.shift();

  if (level >= 1) {
    // 中心闪白：爆炸的"第一帧"必须是最亮的一下，否则没有打击感
    blasts.push({ type: 'glow', x, y, color: '#ffffff', r: 3, r0: 3, r1: level >= 3 ? 26 : 14,
      life: 0.09, max: 0.09, alpha: 0.9 });
  }
  if (level >= 2) {
    // 外扩环：慢而大，定义爆炸的"范围"
    blasts.push({ type: 'ring', x, y, color, r: 2, r0: 2, r1: level >= 3 ? 46 : 24,
      life: 0.34, max: 0.34, alpha: 0.55, lw: 2 });
    // 中心光晕收缩：与外扩环反向运动，形成"炸开又收回"的层次
    blasts.push({ type: 'glow', x, y, color, r: level >= 3 ? 22 : 12, r0: level >= 3 ? 22 : 12,
      r1: 1, life: 0.22, max: 0.22, alpha: 0.5, shrink: true });
  }
  if (level >= 3) {
    // 三层环：最外层慢、最内层快 —— 三层速度不同才像"冲击波"而不是三个同心圆
    blasts.push({ type: 'ring', x, y, color: '#ffffff', r: 4, r0: 4, r1: 62, life: 0.5, max: 0.5, alpha: 0.4, lw: 1.5 });
    blasts.push({ type: 'ring', x, y, color, r: 2, r0: 2, r1: 34, life: 0.28, max: 0.28, alpha: 0.6, lw: 2.5 });
    // 地面残留光：爆炸后原地留几团慢慢上浮的余烬，给"这里刚炸过"的记忆
    for (let i = 0; i < 4; i++) {
      blasts.push({ type: 'ground', x: x + (Math.random() - 0.5) * 22, y: y + (Math.random() - 0.5) * 14,
        color, r: 2 + Math.random() * 2, r0: 3, r1: 1, life: 0.5 + Math.random() * 0.4,
        max: 0.9, alpha: 0.5, vy: -12 - Math.random() * 10 });
    }
  }
}

function updateBlasts(dt) {
  for (let i = blasts.length - 1; i >= 0; i--) {
    const b = blasts[i];
    b.life -= dt;
    if (b.life <= 0) { blasts.splice(i, 1); continue; }
    const k = 1 - b.life / b.max;
    // 环/光晕：半径插值（shrink 的反向）
    b.r = b.r0 + (b.r1 - b.r0) * k;
    if (b.type === 'ground' && b.vy) b.y += b.vy * dt;
  }
}

function drawBlasts() {
  for (const b of blasts) {
    const k = b.life / b.max;
    const a = b.alpha * (b.type === 'ground' ? k : (1 - k * 0.55));
    if (a <= 0.01) continue;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    if (b.type === 'ring') {
      ctx.globalAlpha = a;
      ctx.strokeStyle = b.color; ctx.lineWidth = b.lw || 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    } else if (b.type === 'glow') {
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, Math.max(1, b.r));
      g.addColorStop(0, hexA(b.color, a));
      g.addColorStop(1, hexA(b.color, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, Math.max(1, b.r), 0, Math.PI * 2); ctx.fill();
    } else if (b.type === 'ground') {
      ctx.globalAlpha = a * 0.8;
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

function explode(x, y, color, count = 12, speed = 90) {
  const big = count >= 16, mid = count >= 8;
  /* 结构化层：按规模生成环/光晕/残留。
     粒子仍保留（碎片需要随机方向的离散感），
     但"层级"由结构化层表达 —— 两者分工，不再靠粒子数量硬堆。 */
  addBlast(x, y, color, blastLevel(count));

  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, sp = speed * (0.25 + Math.random());
    spawnParticle({
      x, y, px: x, py: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.28 + Math.random() * 0.45, max: 0.73,
      color: Math.random() < 0.35 ? '#ffffff' : color, size: Math.random() < 0.28 ? 2 : 1,
      glow: true
    });
  }

  if (mid) {
    addFlash(x, y, color, big ? 12 : 7);
    addShockwave(x, y, color, count, speed);
    if (big) {
      // 副环：延迟出发、更快更细，形成"双层冲击"的层次
      addShockwave(x, y, '#ffffff', count * 0.6, speed * 1.35, 0.06);
      addEmbers(x, y, color, Math.min(8, Math.round(count * 0.35)));
      // 新星光条 + 整屏色差：大爆炸的"重击感"来源
      addNova(x, y, color, 9, 26 + Math.min(30, count * 0.9));
      addChroma(0.35 + Math.min(0.3, count * 0.012));
    }
  }
  const pCap = particleCap();
  if (particles.length > pCap) particles.splice(0, particles.length - pCap);

  // 逐个检查 + 收尾裁剪：批量生成时只在开头判一次会撑破上限
  const dCap = debrisCap();
  const debrisCount = Math.min(count, big ? 12 : 8);
  for (let i = 0; i < debrisCount && debris.length < dCap; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = speed * (0.3 + Math.random() * 0.8);
    debris.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.5 + Math.random() * 0.5, max: 1.0,
      color: Math.random() < 0.3 ? '#ffffff' : color,
      size: 2 + Math.random() * 3,
      rot: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 10
    });
  }
  if (debris.length > dCap) debris.splice(0, debris.length - dCap);
}
/* 闪核：爆炸瞬间的高亮核心。
   没有它的话爆炸只是"一堆往外飞的点"，缺少"炸开的那一下"的重量感。 */
function addFlash(x, y, color, size) {
  if (flashes.length >= flashCap()) return;
  flashes.push({ x, y, color, r: size || 8, life: 0.12, max: 0.12 });
}
/* 新星放射光条：从爆点向外射出的长条光束。
   冲击波是"环"、粒子是"点"、新星是"线" —— 三种形态叠加才有炸裂感，
   只有线能表达"往外炸开"的方向性。仅大爆炸触发，避免糊屏。 */
function addNova(x, y, color, rays = 8, len = 40) {
  /* 同屏限额：nova 是最抢眼的一层，15 波敌机密集时全铺开会糊住视线。
     限额放在这里（而不是调用方）是因为它是 nova 自身的属性 ——
     任何调用点都必须遵守，包括 explode() 内部的 big 分支。 */
  const lim = Math.min(2, novaCap());
  if (novas.length >= lim) return;
  const off = Math.random() * Math.PI;
  novas.push({ x, y, color, rays, len, off, life: 0.28, max: 0.28 });
}
function updateNovas(dt) {
  for (let i = novas.length - 1; i >= 0; i--) {
    const n = novas[i]; n.life -= dt;
    if (n.life <= 0) swapRemove(novas, i);
  }
}
function drawNovas() {
  if (!novas.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const n of novas) {
    const p = 1 - n.life / n.max;
    const a = Math.max(0, 1 - p);
    const grow = Math.sin(Math.min(1, p * 1.3) * Math.PI * 0.5);
    const L = n.len * grow;
    ctx.globalAlpha = a * 0.85;
    ctx.strokeStyle = n.color;
    for (let i = 0; i < n.rays; i++) {
      const ang = n.off + (Math.PI * 2 / n.rays) * i;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const l = L * (i % 2 === 0 ? 1 : 0.62);
      ctx.lineWidth = (i % 2 === 0 ? 2.2 : 1.2) * (1 - p * 0.5);
      ctx.beginPath();
      ctx.moveTo(n.x + ca * L * 0.12, n.y + sa * L * 0.12);
      ctx.lineTo(n.x + ca * l, n.y + sa * l);
      ctx.stroke();
    }
    ctx.globalAlpha = a * a;
    const gw = getGlowSprite('#ffffff', 'spark'), d = n.len * 0.5 * (1 - p * 0.6);
    ctx.drawImage(gw, n.x - d / 2, n.y - d / 2, d, d);
  }
  ctx.restore();
}

/* 击中火花：子弹命中敌人时的六芒星。
   弹幕游戏里命中反馈必须"脆"，玩家靠这个确认自己打中了。
   六芒星（3 条主轴双向）比原来两条线更像"迸溅"，且带一层微环收束。 */
function addSpark(x, y, color, scale = 1) {
  if (sparks.length >= sparkCap()) return;
  const a = Math.random() * Math.PI;
  const s = SPARK_POOL.pop() || {};
  s.x = x; s.y = y; s.color = color;
  s.len = (6 + Math.random() * 5) * scale; s.ang = a;
  s.life = 0.12; s.max = 0.12;
  sparks.push(s);
}
/* 余烬：爆炸后缓慢飘散的暗色碎光。
   寿命比粒子长 3 倍，让爆炸不是"啪一下就没了"，而是有余味。 */
function addEmbers(x, y, color, count = 4) {
  for (let i = 0; i < count; i++) {
    // 逐个检查：批量生成时只在函数开头判一次会撑破上限
    if (embers.length >= emberCap()) return;
    const a = Math.random() * Math.PI * 2, sp = 12 + Math.random() * 26;
    embers.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 10,
      life: 0.7 + Math.random() * 0.7, max: 1.4,
      color, size: 1 + Math.random() * 1.5,
      seed: Math.random() * 6.28
    });
  }
}
function updateFlashes(dt) {
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i]; f.life -= dt;
    if (f.life <= 0) swapRemove(flashes, i);
  }
}
function updateSparks(dt) {
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.life -= dt;
    if (s.life <= 0) {
      if (SPARK_POOL.length < SPARK_POOL_MAX) SPARK_POOL.push(s);
      swapRemove(sparks, i);
    }
  }
}
function updateEmbers(dt) {
  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i]; e.life -= dt;
    if (e.life <= 0) { swapRemove(embers, i); continue; }
    e.x += e.vx * dt; e.y += e.vy * dt;
    e.vx *= 0.97; e.vy *= 0.97; e.vy += 8 * dt;   // 几乎无重力，缓慢飘
  }
}
function drawFlashes() {
  if (!flashes.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const f of flashes) {
    const p = 1 - f.life / f.max;                  // 0→1
    const a = Math.max(0, 1 - p);                  // 快速衰减
    const d = f.r * (0.5 + p * 1.8);               // 同时膨胀
    ctx.globalAlpha = a * 0.9;
    const gs = getGlowSprite(f.color, 'spark'), dd = d * 2;
    ctx.drawImage(gs, f.x - dd / 2, f.y - dd / 2, dd, dd);
    ctx.globalAlpha = a;                           // 中心白核
    const gw = getGlowSprite('#ffffff'), dw = d * 0.9;
    ctx.drawImage(gw, f.x - dw / 2, f.y - dw / 2, dw, dw);
    // 色差双环：红/青各偏移 1~2px 描一圈，是"高级感"最廉价的做法。
    // 只在膨胀中段（p 0.35~0.9）画，出现得太早或太晚都看不出来
    if (p > 0.3 && p < 0.95 && d > 4) {
      const off = 1 + (1 - p) * 1.8;
      ctx.globalAlpha = a * 0.55;
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = '#ff2060';
      ctx.beginPath(); ctx.arc(f.x - off, f.y, d, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#20e0ff';
      ctx.beginPath(); ctx.arc(f.x + off, f.y, d, 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.restore();
}
function drawSparks() {
  if (!sparks.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const s of sparks) {
    const a = Math.max(0, s.life / s.max);
    const L = s.len * (0.4 + a * 0.6);             // 收缩
    ctx.globalAlpha = a;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 1 + a * 0.8;
    // 六芒星：3 条主轴双向辐射，比两条线的十字更像迸溅
    ctx.lineWidth = 1.2 + a * 1.2;
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const ang = s.ang + (Math.PI / 3) * i;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      // 三条主轴长度不等，避免过于规整像雪花
      const l = L * (i === 0 ? 1 : (i === 1 ? 0.8 : 0.6));
      ctx.moveTo(s.x - ca * l, s.y - sa * l);
      ctx.lineTo(s.x + ca * l, s.y + sa * l);
    }
    ctx.stroke();
    // 微环：一圈快速收缩的细环，给星芒一个"收束"的尾巴
    const rr = L * (1 - a) * 0.9 + 1;
    ctx.globalAlpha = a * 0.6;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(s.x, s.y, rr, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}
function drawEmbers() {
  if (!embers.length) return;
  ctx.save();
  for (const e of embers) {
    const a = Math.max(0, e.life / e.max);
    // 余烬不发光，只是暗色余味；加一点点闪烁模拟火星明灭，
    // 后期渐隐到几乎透明（用 e.seed 让每颗闪的相位不同，避免同步闪烁）
    const tw = 0.72 + Math.sin(state.time * 9 + e.seed) * 0.28;
    ctx.globalAlpha = a * a * 0.55 * tw;
    ctx.fillStyle = e.color;
    const s = Math.max(1, Math.round(e.size));
    ctx.fillRect(Math.round(e.x), Math.round(e.y), s, s);
  }
  ctx.restore();
}

// kind: 'score' 普通得分 / 'crit' 暴击 / 'kill' 击杀
function addFloatText(x, y, text, color, scale = 1, kind = 'score') {
  if (floatTexts.length > 40) floatTexts.shift();
  floatTexts.push({ x, y, text: String(text), color, scale, kind, life: 0.6, max: 0.6, vy: -42 });
}
// delay：延迟出发（副环用）；椭圆略扁模拟透视，比正圆更有空间感
function addShockwave(x, y, color, power = 1, speed = 90, delay = 0) {
  if (shockwaves.length > 40) return;
  shockwaves.push({
    x, y, color, r: 3, delay: delay || 0,
    maxR: 14 + Math.min(44, power * 0.5 + speed * 0.08),
    life: 0.35 + (delay || 0), max: 0.35 + (delay || 0),
    spin: Math.random() * Math.PI * 2
  });
}
function updateShockwaves(dt) {
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const s = shockwaves[i]; s.life -= dt;
    if (s.life <= 0) { swapRemove(shockwaves, i); continue; }
    const p = 1 - Math.max(0, s.life - s.delay) / s.max;
    s.r = s.maxR * (1 - Math.pow(1 - Math.max(0, p), 3));
  }
}
function drawShockwaves() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const s of shockwaves) {
    if (s.life - s.delay <= 0) continue;             // 延迟未到，不画
    const a = Math.max(0, (s.life - s.delay) / s.max) * 0.8;
    const rx = Math.round(s.r), ry = Math.round(s.r * 0.82);   // 略扁
    if (rx <= 0) continue;
    ctx.globalAlpha = a;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2 + a * 2;
    ctx.beginPath(); ctx.ellipse(Math.round(s.x), Math.round(s.y), rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
    // 外沿亮边：让环有"厚度"，而不是一根细线
    ctx.globalAlpha = a * 0.5;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(Math.round(s.x), Math.round(s.y), Math.max(1, rx - 1), Math.max(1, ry - 1), 0, 0, Math.PI * 2); ctx.stroke();
    // 辐条：环上长出几根短刺 + 整体缓慢自转，环不再是一根"光秃秃的线"。
    // 只在环够大时画（小爆炸省掉，避免弹幕密集时满屏刺）
    if (rx > 16) {
      const spokes = 8;
      const rot = s.spin + rx * 0.012;
      ctx.globalAlpha = a * 0.4;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < spokes; i++) {
        const ang = rot + (Math.PI * 2 / spokes) * i;
        const ca = Math.cos(ang), sa = Math.sin(ang);
        const r0 = rx * 0.94, r1 = rx * 1.14;
        ctx.moveTo(s.x + ca * r0, s.y + sa * r0 * 0.82);
        ctx.lineTo(s.x + ca * r1, s.y + sa * r1 * 0.82);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = Math.max(0, a * 0.25);
    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.ellipse(Math.round(s.x), Math.round(s.y), Math.max(1, Math.round(s.r * 0.85)), Math.max(1, Math.round(s.r * 0.85 * 0.82)), 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

/* ==================================================================
   射击
   ================================================================== */
function shoot() {
  runShots++;          // 命中率分母：发射一发计数一次（散射按实际弹丸数更准，见下）
  if (player.cool > 0) return;
  const w = WEAPONS[player.weapon];
  /* 攻速：冷却除以倍率（倍率越大 → 冷却越短 → 射得越快）。
     状态倍率（狂热 1.3 / 迟滞 0.75）与成长树加成叠乘，互不覆盖。 */
  player.cool = w.cool / (rateMul() * rateUpgMul());
  const x = player.x, y = player.y - 5, lv = player.power;
  /* ⚠️ 火力死等级（修改清单第 23 条的真实形态）：
     报告写"Lv4 = 7 发是负收益"是按幻影代码说的，代码里没有 baseDmg 表。
     真实问题是 **lv→效果的映射在某些等级上不单调**，买了火力卡却毫无变化：
       散射 3+min(2,lv-1) → 5,5（lv4 死）
       导弹 1+min(1,⌊(lv-1)/2⌋) → 1,1 / 2,2（lv2、lv4 死）
       电弧 1+⌊lv/2⌋ → 2,2（lv3 死）
       回旋 完全不看 lv —— **四次火力提升全死**
     这类 bug 不报错不崩溃，玩家只会觉得"这把武器怎么升都不变强"。
     修法是让每条映射在 lv1~4 上**逐級变化**（不要求等量，要求每级都有反馈）。 */
  if (particles.length < particleCap()) {
    for (let i = 0; i < 2; i++) {
      spawnParticle({
        x: x + (Math.random() - 0.5) * 3, y: y - 2,
        vx: (Math.random() - 0.5) * 26, vy: -36 - Math.random() * 42,
        life: 0.1 + Math.random() * 0.12, max: 0.22,
        color: w.color || '#7be9ff', size: 2, glow: true
      });
    }
  }
  /* 枪口闪光放在武器分支**之前**统一触发：六种武器都需要，
     写进各自 case 会重复六遍且容易漏。位置在机头 ——
     与子弹出生点同一处，视觉上才对得上"从这里打出去"。 */
  if (quality >= 0.5) spawnMuzzle(x, y - 2, w.color || '#7be9ff', 1);

  switch (player.weapon) {
    case 0: {
      const crit = Math.random() < critRate(0.15);
      const push = (dx, dy) => bullets.push({ x: x + dx, y: y + dy, vx: 0, vy: -355, dmg: 1, crit });
      if (lv === 1) push(0, 0); else if (lv === 2) { push(-3, 0); push(3, 0); }
      else if (lv === 3) { push(0, -3); push(-4, 1); push(4, 1); }
      else { push(-4, -1); push(-1.5, -3); push(1.5, -3); push(4, -1); }
      Audio.play(760 + lv * 40, 0.045, 'square', 0.018, 420, 'player'); break;
    }
    case 1:
      /* ⚠️ 激光此前是**唯一零成长的武器**：dmg 写死 6，lv 完全没参与，
         升满火力等级（4 级）后伤害与 lv1 一模一样 —— 花 30 金币升火力，
         用激光时毫无变化。其余五把都有成长：脉冲/散射/导弹/电弧靠 lv，
         回旋靠 boomCount（独立卡，1→5）。
         补上线性成长 6 + (lv-1)×2：lv1=6 / lv2=8 / lv3=10 / lv4=12。
         刻意不给弹数成长 —— 激光是穿透单体，加弹数会变成清屏武器，
         与散射定位重复；只抬伤害才守住"单体高伤"这条线。 */
      bullets.push({ x, y, vx: 0, vy: -430, dmg: 6 + (lv - 1) * 2, pierce: true, laser: true, hitIds: new Set(), crit: Math.random() < critRate(0.20) });
      Audio.play(320, 0.08, 'sawtooth', 0.025, 180, 'player'); break;
    case 2: {
      /* 弹匣扩容（成长树 mag）叠加在等级弹数之上。
         ⚠️ 与"火力提升卡"的 lv 成长是**两条独立通道**，不能合并：
         lv 是局内商店买的（上限 4），mag 是局外芯片点的（上限 10 级），
         合并后玩家分不清自己变强来自哪一条线，也不好各自调平衡。
      ⚠️ 扇形**总跨度固定**为 SPREAD_ARC，而不是按弹数乘固定角步长：
      原来每发 0.25rad，弹数一多扇形就张到 150 度以上，两侧子弹直接飞出屏幕 ——
      加了弹数却打不到东西，是最容易误判为"没生效"的一类 bug。
      固定跨度后，弹数增加表现为**弧线更密**（命中更稳），而非覆盖更宽。 */
      const crit = Math.random() < critRate(0.22);
      /* 2+lv：lv1=3 与原来持平，lv2=4 / lv3=5 / lv4=6 逐级递增。
         原来的 3+min(2,lv-1) 在 lv3、lv4 都是 5 —— 买满火力最后一级没反应。 */
      const n = Math.min(12, 2 + lv + magUpgExtra());
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (n <= 1 ? 0 : (i / (n - 1) - 0.5) * SPREAD_ARC);
        bullets.push({ x, y, vx: Math.cos(a) * 300, vy: Math.sin(a) * 300, dmg: 1, crit, scatter: true });
      }
      Audio.play(500, 0.04, 'square', 0.014, 300, 'player'); break;
    }
    case 3: {
      /* n = lv：1→2→3→4 逐级递增。原来 lv2 与 lv1 同为 1、lv4 与 lv3 同为 2，
         两次升级打水漂。追踪弹本身有 life 2.6 且速度慢，4 发不会失控。 */
      const n = lv;
      for (let i = 0; i < n; i++) {
        const off = n === 1 ? 0 : (i - 0.5) * 10;
        bullets.push({ x: x + off, y, vx: off * 3, vy: -150, dmg: 5, homing: true, target: null, life: 2.6, crit: false });
      }
      Audio.play(300, 0.1, 'triangle', 0.026, 520, 'player'); break;
    }
    /* 跳跃数 = lv：1→2→3→4 逐级递增（原来 lv2/lv3 同为 2）。
       电弧每次跳跃伤害递减 0.6，多一跳的边际收益本来就小，加满也不会失控。 */
    case 4: fireArc(x, y, lv, 2); Audio.play(880, 0.06, 'sawtooth', 0.03, 400, 'player'); break;
    case 5: {
      for (let i = 0; i < player.boomCount; i++) {
        const crit = Math.random() < critRate(0.18);
        const off = player.boomCount === 1 ? 0 : (i - (player.boomCount - 1) / 2) * 8;
        /* 回旋镖此前**完全不看 lv** —— 火力提升四次买满，用回旋时伤害恒为 5，
           等于这张卡对回旋无效。补 5+(lv-1)：5→6→7→8，与激光同级处理。
           幅度刻意取 +1/级（激光是 +2）：回旋靠 boomCount 叠数量，
           再抬单发会双重放大。 */
        bullets.push({ x: x + off, y, vx: off * 2, vy: -320, dmg: 5 + (lv - 1), boomerang: true, t: 0, phase: 'out', hitIds: new Set(), crit });
      }
      Audio.play(420, 0.12, 'triangle', 0.03, 720, 'player'); break;
    }
  }
  // 散射道具：额外发射两发偏角弹（独立于当前武器）
  if (player.spread > 0) {
    for (const a of [-0.24, 0.24]) {
      bullets.push({
        x, y,
        vx: Math.sin(a) * 300,
        vy: -Math.cos(a) * 300,
        dmg: 1, crit: false, spreadShot: true
      });
    }
  }
}

function fireArc(sx, sy, maxJumps, baseDmg) {
  const hit = new Set(); let cx = sx, cy = sy; const pts = [{ x: cx, y: cy }];
  /* 电弧不走子弹，直接扣血，所以是独立于 checkCollisions 的第三条结算路径。
     倍率必须在这里也接一次，否则电弧武器永远吃不到伤害卡和技能树攻击。 */
  let dmg = dmgOf(baseDmg);
  for (let j = 0; j <= maxJumps; j++) {
    let best = null, bd = Infinity;
    for (const e of enemies) {
      if (hit.has(e.id)) continue;
      const d = (e.x - cx) ** 2 + (e.y - cy) ** 2;
      if (d < bd) { bd = d; best = e; }
    }
    let isBoss = false;
    if (boss && !boss.entering && !hit.has('boss')) {
      const d = (boss.x - cx) ** 2 + (boss.y - cy) ** 2;
      if (d < bd) { bd = d; best = boss; isBoss = true; }
    }
    if (!best || bd > 130 * 130) break;
    hit.add(isBoss ? 'boss' : best.id); pts.push({ x: best.x, y: best.y - 2 }); cx = best.x; cy = best.y;
    if (isBoss) {
      boss.hp -= dmg; boss.flash = 0.1; explode(best.x, best.y, '#7be9ff', 5, 70);
    // 二阶段：血量首次过半时触发一次闪烁（boss.phase2 标记只做一次）
    if (!boss.phase2 && boss.hp <= boss.maxhp * 0.5) { boss.phase2 = true; boss.phaseFlash = 0.3; }
      if (boss.hp <= 0) { killBoss(); break; }
    } else {
      /* 电弧不走子弹，必须**单独**接护盾减伤（接线遗漏重灾区：
         只接子弹就会出现"子弹打护盾有减伤、电弧没有"这类只对一半的 bug）。 */
      best.hp -= dmg * enemyTakenMul(best, cx); best.flash = 0.1;
      if (best.hp <= 0) { const idx = enemies.indexOf(best); if (idx >= 0) killEnemy(best, idx); }
      else explode(best.x, best.y, '#7be9ff', 5, 70);
    }
    dmg = Math.max(1, dmg - 0.6);
  }
  if (pts.length > 1) arcs.push({ pts, life: 0.16, max: 0.16 });
}

/* ==================================================================
   玩家 / 受伤
   ================================================================== */

/* 锁定标记的维持：射击时刷新，不射击则自然消退。
   放在 update 里而不是 draw 里 —— 绘制函数不该改状态。 */
function updateLockMark(dt) {
  if (lockT > 0) lockT -= dt;
  if (state.mode === MODE_PLAY && player.alive && !paused) {
    const t = findNearestEnemy(player.x, player.y);
    if (t) { lockTarget = t; lockT = LOCK_HOLD; }
  }
}

function updatePlayer(dt) {
  if (!player.alive) {
    player.respawn -= dt;
    if (player.respawn <= 0) {
      player.alive = true; player.inv = 2.2; player.x = W / 2; player.cool = 0.2;
      Audio.play(400, 0.12, 'triangle', 0.03, 800);
      // 复活后位置被重置，必须同步基准点，否则下一帧会算出巨大位移导致朝向乱转
      pxPrev = player.x; pyPrev = player.y; playerFace = -Math.PI / 2;
    }
    return;
  }
  if (player.inv > 0) player.inv -= dt;
  if (player.spread > 0) player.spread -= dt;

  let dx = 0, dy = 0;
  if (keys['arrowleft'] || keys['a']) dx -= 1;
  if (keys['arrowright'] || keys['d']) dx += 1;
  if (keys['arrowup'] || keys['w']) dy -= 1;
  if (keys['arrowdown'] || keys['s']) dy += 1;

  if (pointer.active) {
    const speed = isTouch ? 36 : 22;
    player.x += (pointer.x - player.x) * Math.min(1, speed * dt);
    player.y += (pointer.y - player.y) * Math.min(1, speed * dt);
    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      player.x += dx / len * 130 * dt * moveMul();
      player.y += dy / len * 130 * dt * moveMul();
    }
  } else if (dx !== 0 || dy !== 0) {
    const len = Math.hypot(dx, dy);
    player.x += dx / len * 155 * dt * moveMul();
    player.y += dy / len * 155 * dt * moveMul();
  }

  /* ⚠️ 先钳 y 再钳 x，顺序不能反：x 的上限依赖 y（见 playerMaxX）。
     用上一帧的 y 去算 x 上限，飞机在道具栏高度的上下边界横向滑动时会来回跳 ——
     本帧以为"不在道具栏那一行"放它贴到 238，下一帧 y 更新了又弹回 209。
     ⚠️ menuFall 检查保持在钳制之后：菜单垮掉期间仍要夹住坐标，
     否则玩家位置会随菜单一起掉出屏幕。 */
  player.y = Math.max(HUD_H + 12, Math.min(H - WB_H - 6, player.y));
  player.x = Math.max(9, Math.min(playerMaxX(player.y), player.x));

  /* 「引力井」：持续把玩家拉向屏幕中心。
     放在**钳制之后**：先让玩家自己的操作生效、再叠加吸力，
     玩家是在"抵抗"而不是"被覆盖"——放在钳制前的话，
     吸力会被后面的钳制吃掉一部分，靠近边缘时表现为"拉不动"。
     ⚠️ 用**速度**（× dt）而不是加速度（× dt²）：
       加速度在本帧 dt≈0.0167 下只有约 0.013px 的位移，
       实测玩家完全感觉不到——写成"加速度"听起来更物理，实际等于没做。
     强度取玩家键盘速度的约 1/6（155px/s 对 26px/s）：
     松手会被明显拖走，按住方向仍能抵抗——这才叫"有对抗感"。 */
  if (gravityT > 0) {
    const cx = W / 2, cy = (HUD_H + 12 + (H - WB_H - 6)) / 2;
    const gdx = cx - player.x, gdy = cy - player.y;
    const glen = Math.hypot(gdx, gdy);
    if (glen > 1) {
      const pull = GRAVITY_PULL * dt;
      player.x += gdx / glen * pull;
      player.y += gdy / glen * pull;
      // 二次钳制：吸力可能把玩家推出边界（尤其是往上吸时越过 HUD）
      player.y = Math.max(HUD_H + 12, Math.min(H - WB_H - 6, player.y));
      player.x = Math.max(9, Math.min(playerMaxX(player.y), player.x));
    }
  }
  // 主菜单垮掉期间锁住操作：菜单还在往下掉，此时让玩家动会很割裂
  if (menuFall < 1) return;

  /* 机头朝向：位移超过阈值才更新，静止时保持上一朝向（否则会抖）。
     平滑插值而非直接跳变 —— 直接赋值会显得生硬。 */
  {
    const mdx = player.x - pxPrev, mdy = player.y - pyPrev;
    if (Math.hypot(mdx, mdy) > 0.25) {
      const target = Math.atan2(mdy, mdx);
      let d = target - playerFace;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      playerFace += d * Math.min(1, dt * 14);
    }
  }
  pxPrev = player.x; pyPrev = player.y;

  if (particles.length < particleCap() && Math.random() < 0.55) {
    const engineColors = ['#3ad1ff', '#ff9f43', '#ffffff'];
    spawnParticle({
      x: player.x + (Math.random() < 0.5 ? -3 : 3) + (Math.random() - 0.5) * 2,
      y: player.y + 5 + Math.random() * 2,
      vx: (Math.random() - 0.5) * 14,
      vy: 35 + Math.random() * 30,
      life: 0.22 + Math.random() * 0.2, max: 0.42,
      color: engineColors[Math.floor(Math.random() * engineColors.length)],
      size: Math.random() < 0.3 ? 2 : 1, glow: true
    });
  }

  player.cool -= dt;
  /* 转场期间不开火。不能只靠钳制 player.cool —— 它是每帧递减的，
     钳到 0.06 只是延后一帧，下一帧照样归零触发 shoot()。
     必须在开火点直接判断。 */
  if (player.cool <= 0 && menuFall >= 1) shoot();
}

function hurtPlayer(dmg) {
  // 第一次挨打才提示超载 —— 没挨过打时玩家不在乎"怎么反击"
  showTutorial('ult', '冷却结束后可释放超载，全屏清场',
    isTouch ? '双击屏幕' : '按 X 键', 3.6);
  if (!player.alive || player.inv > 0) return;
  if (!(dmg > 0)) dmg = DMG.ENEMY_BULLET;   // 缺省按小怪子弹计
  /* ⚠️ 真 bug 修复：takenMul() **此前从未被调用** ——
     它只定义在 1265 行，全文件找不到调用点。
     结果是"铁壁（受伤 -30%）/ 脆化（受伤 +40%）"两个状态只显示图标和描述，
     实际完全不影响伤害，玩家吃了铁壁该掉多少血还是多少。
     在伤害进入护盾/血量结算前统一乘：
     环境层（过热 +35%、虚空 +25%）也在此生效，与拾取层相乘。 */
  dmg = dmg * takenMul();
  /* 闪避护盾：概率完全免疫这一次伤害。
     放在 takenMul 之后、护盾结算之前 ——
     放在护盾之后就变成"护盾先被扣、再判免伤"，玩家会觉得盾白掉了。
     内置 0.8 秒冷却：没有冷却的话，弹幕密集时会连续触发多次免伤，
     25% 的期望值在密集弹幕下会表现出接近"长时间无敌"的效果。 */
  if (dodgeTry()) return;
  combo = 0; comboTimer = 0;
  /* 护盾点数制：先扣护盾，扣不完的部分才进血。
     原实现是"有盾就完全免疫这一次伤害并清零" —— 那等于 1 点护盾也能挡下 Boss 的一发重击，
     且与"100 点护盾"的数值完全脱节：玩家看着满格盾，实际只挡一下。
     破碎只在护盾真正归零时触发，并给 0.5s 短无敌作为"盾没了"的反馈。 */
  if (player.shield > 0) {
    const absorbed = Math.min(player.shield, dmg);
    player.shield -= absorbed;
    dmg -= absorbed;
    state.shake = Math.max(state.shake, 4);
    explode(player.x, player.y, '#7be9ff', 14, 90);
    Audio.play(520, 0.14, 'triangle', 0.035, 160, 'player');
    if (player.shield <= 0.001) {
      player.shield = 0; player.inv = Math.max(player.inv, 0.5);
      explode(player.x, player.y, '#ffffff', 10, 80);
      pushToast('护盾破碎', '', '#ff4d6d');
      Audio.play(420, 0.25, 'triangle', 0.045, 140, 'player');
    }
    if (dmg <= 0.001) return;      // 完全被护盾吸收
  }
  dmg = Math.round(dmg);
  state.hp -= dmg; state.hpFlash = 0.25;

  if (state.hp <= 0) {
    // 血空：才真正倒下，火力/散射在此重置（原版每掉一命就清零，现改为终局才清）
    state.hp = 0;
    /* respawn 用 Infinity：这是"本局终结、不再复活"的哨兵值。
       原来写 9999 是个魔法数字 —— 读代码的人无法判断它表示"很久"还是"永远"。
       updatePlayer 的复活判定是 respawn <= 0，Infinity 明确表达"永不触发"。 */
    player.alive = false; player.respawn = Infinity; player.power = 1; player.spread = 0;
    explode(player.x, player.y, '#3ad1ff', 26, 135); explode(player.x, player.y, '#ffffff', 10, 70);
    state.shake = 11; flashScreen = 0.25; flashColor = '#ff4d6d';
    Audio.play(150, 0.45, 'sawtooth', 0.055, 38);
    setTimeout(() => Audio.play(90, 0.35, 'square', 0.04, 30), 60);
    setTimeout(() => Audio.play(70, 0.5, 'sawtooth', 0.05, 30), 120);
    gameOver();
  } else {
    // 未死：只扣血 + 短无敌，玩家继续可控
    player.inv = Math.max(player.inv, HURT_INV);
    const heavy = dmg >= 25;                 // 重击：更大的爆炸、更强的震屏
    explode(player.x, player.y, '#3ad1ff', heavy ? 20 : 10, heavy ? 120 : 80);
    state.shake = Math.max(state.shake, heavy ? 10 : 6);
    /* hit-stop 只在玩家自己挨打时触发，且时长随伤害规模递增。
       撞机（50%）定格最久，子弹（12~20）几乎不定格 ——
       满屏都在定格等于没有定格，只有"大事"才配用。 */
    addHitstop(dmg >= 30 ? 0.05 : (dmg >= 15 ? 0.035 : 0));
    flashScreen = Math.max(flashScreen, heavy ? 0.22 : 0.12); flashColor = '#ff4d6d';
    addFloatText(player.x, player.y - 12, '-' + dmg, '#ff4d6d', heavy ? 1.5 : 1.1, 'dmg');
    Audio.play(heavy ? 180 : 230, heavy ? 0.14 : 0.1, 'square', heavy ? 0.04 : 0.03, heavy ? 90 : 110);
  }
}

/* ==================================================================
   僚机 / 道具 / 超载
   ================================================================== */
/* 僚机锁定目标：两架僚机**共用一个目标**，而不是各找最近的。
   各找最近的话两架会四散打不同敌人，看着像散兵不像护卫；
   锁同一个目标，弹道才是收拢的。
   取"玩家正前方最近"而非"离僚机最近"：僚机是护卫，
   它该打的是挡在主人前面那个，而不是自己身边那个。 */
let droneTarget = null;
function updateDroneTarget() {
  if (boss && !boss.entering) { droneTarget = boss; return; }
  let best = null, bd = Infinity;
  for (const e of enemies) {
    if (e.y > player.y) continue;                 // 只打玩家上方（前方）的
    const dx = Math.abs(e.x - player.x), dy = player.y - e.y;
    const d = dx * 1.6 + dy;                      // 横向权重更高：优先正前方
    if (d < bd) { bd = d; best = e; }
  }
  droneTarget = best;
}

function updateDrones(dt) {
  /* 目标每帧重算：目标死了、或更靠前的敌人出现，都能立刻改锁。
     若只在开火瞬间选一次，子弹会追着一个已经不存在的目标飞到底。 */
  if (player.alive) updateDroneTarget();
  for (const d of drones) {
    d.cool -= dt;
    if (d.cool <= 0 && player.alive) {
      d.cool = 0.30;
      bullets.push({
        x: player.x + d.offX, y: player.y + d.offY - 3,
        vx: 0, vy: -330, dmg: 1, drone: true,
        /* 追踪复用导弹那套 homing：逐帧把速度往目标方向插值。
           转向率 12 比导弹的 9 更灵敏 —— 僚机弹初速更快，
           转向慢了会绕着目标转圈而不是咬上去。 */
        homing: true, life: 2.6, target: droneTarget
      });
    }
  }
}

/* 僚机三连引爆：敌人被僚机弹打中 3 下后炸开。
   计数记在**敌人身上**而不是子弹上 —— 子弹命中即消失，记不住；
   而"这只已经被打了两下"本来就是敌人的状态。
   ⚠️ 必须在敌人死亡时清标记：对象池可能复用同一对象，
   留着脏标记会让新敌人一出场就带着 2 层，第一下就炸。 */
/* 僚机引爆：改**全局命中计数**（原为按敌人记数 e.dMark）。
   为什么必须改：僚机弹伤害 1，而敌人血量只有 1~3（e0=1, e1/e3/e5=2, e2=3），
   旧的 e.dMark 要求"敌人挨满 3 下还活着"才引爆 —— 血量为 1~3 的怪
   根本扛不到第 3 下就被 killEnemy 移除，标记永远差最后一下，
   **这个机制几乎永远触发不了**（只有 4 血的 e4 能炸）。
   改为全局计数后，僚机弹每命中一次就 +1，满 3 次在命中点引爆，
   与敌人血量无关，打小怪也能稳定看到爆炸和连锁。 */
const DRONE_MARK_MAX = 3;
/* 激光刃长（半高）与穿透上限。
   ⚠️ 判定与绘制必须读**同一个常量**：此前刃身画成 17px 高，
   碰撞却把子弹当成一个点（只放宽 e.h/2+3）去和敌人做 AABB ——
   结果是"画出来的刃很长、真正能命中的只有中间一小段"，
   表现就是玩家反馈的"激光判定范围短"。
   半高 12（全长 24）比原来的 17 更长，但也别给太长：
   激光是穿透单体，刃身再长下去会变成竖着扫一排、与散射定位重复。 */
const LASER_HALF = 12;
/* 穿透上限 3：此前 pierce:true 只靠 hitIds 去重，**等于无限穿透**。
   判定框从"点"改成"整条刃"之后，无限穿透 + 纵向全覆盖 = 一根激光清半屏，
   那是 bug 级别的过强，必须封顶。3 个目标守住"单体高伤"而非"清屏"。 */
const LASER_PIERCE_MAX = 3;
let droneHitCount = 0;          // 僚机弹累计命中数（全局，不随敌人死亡清零）
const DRONE_BLAST_R = 26;
const DRONE_BLAST_DMG = 2;
function droneBlast(x, y) {
  explode(x, y, '#4ade80', 12, 95);
  addShockwave(x, y, '#4ade80', 10, 80);
  state.shake = Math.min(7, state.shake + 1.8);
  Audio.play(300, 0.1, 'sawtooth', 0.03, 90);
  for (let k = enemies.length - 1; k >= 0; k--) {
    const o = enemies[k];
    if (Math.abs(o.x - x) > DRONE_BLAST_R || Math.abs(o.y - y) > DRONE_BLAST_R) continue;
    o.hp -= DRONE_BLAST_DMG; o.flash = 0.12;
    if (o.hp <= 0) killEnemy(o, k);
  }
  if (boss && !boss.entering) {
    const d = Math.max(Math.abs(boss.x - x), Math.abs(boss.y - y));
    if (d < DRONE_BLAST_R) { boss.hp -= DRONE_BLAST_DMG; boss.flash = 0.14; if (boss.hp <= 0) killBoss(); }
  }
}

function bombBlast() {
  for (const b of ebullets) explode(b.x, b.y, '#ff4d6d', 3, 45);
  ebullets.length = 0;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i]; e.hp -= 3; e.flash = 0.12;
    // 受伤只出火花，死亡才出爆炸 —— 之前两套共用 explode，
    // 同一次命中两种反馈叠在一起是浪费，也让"击杀"失去了辨识度
    if (e.hp <= 0) killEnemy(e, i); else addSpark(e.x, e.y, e.color, 0.8);
  }
  if (boss && !boss.entering) {
    boss.hp -= 25; boss.flash = 0.18; explode(boss.x, boss.y, '#ffffff', 12, 100);
    if (boss.hp <= 0) killBoss();
  }
  state.shake = 12; flashScreen = 0.4; flashColor = '#ffd166';
  Audio.playNoise(0.4, 0.1);
  Audio.play(110, 0.5, 'sawtooth', 0.06, 35);
}

function triggerUlt() {
  if (ultCd > 0 || state.mode !== MODE_PLAY || paused || upgradePanel.active || !player.alive) return;
  ultCd = ULT_CD; ultActive = 2.0; ultScanY = H; flashScreen = 0.35; flashColor = '#7be9ff';
  pushToast('超载释放', '冷却 ' + ULT_CD + ' 秒', '#7be9ff');
  ultUses++;
  state.shake = 12;
  checkAchievement('ult_1'); explode(player.x, player.y, '#7be9ff', 18, 110);
  Audio.play(280, 0.7, 'sawtooth', 0.06, 45);
  setTimeout(() => Audio.play(420, 0.5, 'square', 0.04, 60), 140);
}

function applyPowerup(type, x, y) {
  runPowerups++;       // 战况面板"吃道具数"
  // 自然提示：第一次拿到道具时才说"还能切换武器"—— 在这之前说等于白说
  showTutorial('weapon', isTouch ? '点下方图标切换武器' : '按 1-6 切换武器（六种各有特点）',
    '', 3.6);
  const col = POWERUP_COLORS[type] || '#3ad1ff';
  explode(x, y, col, 12, 80); flashScreen = Math.max(flashScreen, 0.12); flashColor = col;
  switch (type) {
    case 'power':
      if (player.power < 4) { player.power++; pushToast('火力提升', '等级 ' + player.power, '#3ad1ff'); }
      else { state.score += 100; pushToast('火力已满', '+100 分', '#ffd166'); }
      Audio.play(600, 0.08, 'square', 0.03, 1100); setTimeout(() => Audio.play(900, 0.1, 'square', 0.028, 1400), 70); break;
    case 'heal': {
      const healAmt = MEDKIT_HEAL;
      const before = state.hp;
      state.hp = Math.min(state.maxHp, state.hp + healAmt);
      const over = healAmt - (state.hp - before);
      // 溢出不浪费：超出上限的部分转为护盾，让"接近满血时吃血包"也有价值
      if (over > 0) {
