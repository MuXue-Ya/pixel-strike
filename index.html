   折线图移除后，锚点直接用 `ITEM_X - 4` —— 不再经过"面板宽"中转。
   旧写法 gx + FPS_GRAPH_W 依赖面板尺寸，一改尺寸数字就跑（实测左移 28px）。 */
const FPS_LABEL_H = FPS_ROW_H;   // 兼容旧引用（两行文本的行高）
/* 数值标签的字档：原来是裸 6px 并显式绕过 fontStr 的 8px 下限 —— 那是"调试信息
   不需要守正文可读性"的旧说法，代价是 TYPE 档位表之外凭空多出一个没人管的字号
   （而且它绕过的正是 mdType 唯一的下限保护）。
   现在回到最小的 label 档：矮屏由 mdType 自己 ×0.88 且不低于 8，绘制走 mdText。 */
const FPS_LABEL_ROLE = 'label';
/* fps 纵轴上限 120 → **60**：
   取 60 才能让 0/30/60 三档刻度**均匀铺满全高**（底/中/顶）——
   上限 120 时刻度全挤在下半截，等于没有刻度。
   高刷屏（120fps）曲线会贴顶：mapY 已钳制 0~1 不会画到图外，
   且 60 以上对体感无差别，真正要看的是"有没有掉到 30 以下"。
   实际帧数仍由左侧数值标签如实显示，不因贴顶丢信息。 */
/* FPS_AXIS_MAX / MS_AXIS_MAX / FPS_TICKS / FPS_GRAPH_RECT 随折线图一并删除：
   它们只服务于曲线映射（值→y 坐标）与框定位，纯文本面板不需要。 */
/* fps 刻度：0 / 30 / 60 —— 60 是目标、30 是可玩下限、0 是底，
   这三档正是"要不要降画质"的决策线，比均匀刻度有用。
   ms 图**不加刻度**：毫秒是连续量、没有公认档位，
   在 15px 高里标三档只会挤成一团（ms 图靠 16.7ms 参考线就够读）。 */
/* 两个曲线框的真实矩形与标签锚点，由 drawFps 每帧写回。
   测试**必须读这里**而不是自己重算公式 —— 重算就是自证恒等式：
   面板加了标签行后公式变了，重算的测试全部误报（实测 4 项假失败）。 */

function fpsValColor(v) {
  /* 为什么：MD3.chip 是"钉死 #ffd166 的资源识别色"（H6 明令不随主题），
     拿它表达"FPS 40-55 = 有点吃紧"语义完全错 —— 玩家对金色的反应是"金币"，不是"警告"。
     换成 warning 档：语义对了，而且它随主题走，chip 那份"永远不动"就此消失。 */
  return v >= 55 ? MD3.secondary : (v >= 40 ? MD3.warning : MD3.error);
}
function msValColor(v)  { return v <= 20 ? MD3.secondary : (v <= 35 ? MD3.chip : MD3.error); }

/* 小号右对齐标签：帧数面板专用。
   为什么不用 drawText：它走 fontStr，而 fontStr 有 Math.max(8, …) 下限，
   scale 再小也只能是 8px。帧数是调试信息、不是正文，不需要守正文的可读性下限。
   baseline 用 middle，纵向与各自曲线框的中心对齐 ——
   用 top 的话文字会贴着框顶，两个图拉开后更明显。 */
function drawFpsLabel(text, rightX, cy, color) {
  /* 为什么：裸 ctx.font + 6px 是绕过 TYPE 档位的第二个入口（见 FPS_LABEL_ROLE）。
     mdText 的 y 是"字阶盒子上沿"，内部按 em 中心落笔 —— 与原来的 textBaseline='middle'
     同一个中心线，所以 cy 的语义没变；右对齐仍按 rightX 收边。
     原来结尾手动把 textAlign/textBaseline 拨回 left/top 是给自己擦漏，
     mdText 用 save/restore 包住，不再污染 ctx。 */
  const fs = mdType(FPS_LABEL_ROLE);
  mdText(String(text), Math.round(rightX), Math.round(cy - fs / 2), FPS_LABEL_ROLE, color,
    { align: 'right', weight: 700 });
}

function drawFps() {
  /* 层级：本函数由 render() 在**最后**调用（所有 UI 之上）。
     原来排在 drawBossHealth 之前，Boss 血条会把面板整块盖掉 ——
     而 Boss 战恰恰是最需要看帧率的时刻（满屏弹幕最容易掉帧）。
     ⚠️ 但仍让位给**模态面板**（暂停 / 升级）：那两层是全屏遮罩，
     调试信息浮在它们之上没有意义，还会挡住面板内容。 */
  if (!showFps || state.mode !== MODE_PLAY) return;
  if (paused || upgradePanel.active) return;
  const fps = sampleFps(lastDtMs);
  if (!fps) return;
  const avgDt = fpsSamples.reduce((a, b) => a + b, 0) / fpsSamples.length;
  const ms = avgDt;                     // 与 fps 同源（1000/avgDt），保证两个数不自相矛盾

  /* ===== 位置：**右上角**（暂停按钮下方、状态行下方）=====
     折线图移除后只留两行文本，占位从 104×54 缩到约 40×16。
     移到右上角（用户："放倒右上角啊"）—— 右下角是弹幕密集区，
     且道具栏纵贯大半屏，同列根本放不下东西。

     右上角的三条约束，位置由它们唯一确定：
       · 右边贴**暂停按钮右边界**（BUTTONS.pause.x + w = 232）：
         与暂停按钮右对齐成一列，视觉上是"右上角一组"
       · 上边在**状态行 Z4 下方**（Z4 占 y 22~34，取 38）：
         Z4 是右对齐到 215 的状态胶囊行，贴着它放会压住状态图标
       · 下边留到 Boss 血条之上（血条占 y 62~85，面板底 54）
     ⚠️ 锚点用 W - 8 直接算，不要经过"面板宽"中转：
     旧代码是 gx + FPS_GRAPH_W，面板一改尺寸数字就跟着跑（实测左移 28px）。 */
  const RIGHT = W - 8;                        // = 暂停按钮右边界 232
  const y1 = STATUS_CHIP_BOTTOM + 4;          // 第一行（FPS）顶：Z4 下方
  const y2 = y1 + FPS_ROW_H;                  // 第二行（MS）顶

  /* 数值必须带**单位标签**：光两个数并排摆着，不看代码根本分不清哪条是 fps
     哪条是 ms（两者"越大越好 / 越小越好"恰好相反，认错会得出相反结论）。
     单位写在数值后、与各自颜色一致，绑定关系一眼可见。 */
  /* [v1.7k] 按用户样例定稿：两行两列 ——
       帧数:60    ms:16
       内存:9      实体:100
     中文标签、数值取整（ms/内存不再带小数）；固定位置：Boss 出现时
     也待在原地（两行总高 18px，底 y56 远在血条 y74 之上，本就无需避让 ——
     [v1.7j] 的 Boss 让位是为五行容器面板设计的，随面板一起退役）。
     左列右对齐到分界线、右列右对齐 RIGHT：两列各自右缘整齐。 */
  sampleDiag(lastDtMs);
  const memTxt = diag.ok ? String(Math.round(diag.used / 1048576)) : '—';
  const ent = enemies.length + bullets.length + ebullets.length + particles.length;
  const cy = y1 + 4, cy2 = y1 + 4 + 9;
  const leftCol = RIGHT - 56;
  drawFpsLabel('帧数:' + fps, leftCol, cy, fpsValColor(fps));
  drawFpsLabel('ms:' + Math.round(ms), RIGHT, cy, msValColor(ms));
  drawFpsLabel('内存:' + memTxt, leftCol, cy2, MD3.onSurfaceVariant);
  drawFpsLabel('实体:' + ent, RIGHT, cy2, MD3.onSurfaceVariant);
}
function toggleFps() { showFps = !showFps; Audio.ui(showFps ? 760 : 520); }

/* 主菜单功能分区：一个「图鉴 / 说明」按钮 + 右上角齿轮（设置）。
   操作说明和武器图鉴原本是两个并列按钮，占两格且视觉上黏在一起；
   现在合并成一个入口，进页后用顶部两个 tab 切换 —— 入口更少，内容不丢。 */
const MENU_FUNC_BTN = [
  { x: 0, y: 0, w: 0, h: 26 },   // 0 图鉴 / 说明（唯一的功能入口）
  { x: 0, y: 0, w: 0, h: 26 },   // 1 废弃（保留占位，w=0 防误命中）
  { x: 0, y: 0, w: 0, h: 26 }    // 2 废弃
];
/* 图鉴页：tab 0 = 操作说明，tab 1 = 武器图鉴 */
const codexPage = { active: false, tab: 0, weaponSel: 0 };   // weaponSel：图鉴页当前选中的武器
const CODEX_TABS = [
  { text: '操作说明' },
  { text: '武器图鉴' }
];
const CODEX_TAB_BTN = [
  { x: 0, y: 0, w: 0, h: 24 },
  { x: 0, y: 0, w: 0, h: 24 }
];
let settingsPageActive = false;  // 设置页
let resetConfirm = false;        // 清除存档二次确认（防误触）
const SET_BTN = {
  name:  { x: 22, y: 0, w: W - 44, h: 24 },   // 用户名行（点击改名）
  mute:  { x: 22, y: 0, w: W - 44, h: 24 },
  vol:   { x: 22, y: 0, w: W - 44, h: 24 },   // 音量行（可拖动，命中区由布局同步）
  fps:   { x: 22, y: 0, w: W - 44, h: 24 },   // FPS 显示开关（画面区）
  qseg: [],                                    // 画质分段按钮（自动/低/中/高）
  theme: [],                                   // 主题色块（6 个，两行三列）
  reset: { x: 22, y: 0, w: W - 44, h: 26 },
  back:  { x: 0, y: 0, w: 110, h: 26 }
};
/* 结算页底部按钮：重试（左，主操作）/ 返回菜单（右，离开）。
   原来只有一个全宽 150×36 的"点击屏幕重试"，且**点屏幕任意处都能重开** ——
   现在右边多了"返回菜单"，若仍保留全屏重开，想返回的人点偏一点就会直接重开，
   这是最难受的一类误触（不可逆、且丢掉整局结算信息）。
   所以改为：按钮出现前吞掉所有点击，出现后只有命中按钮才响应。 */
const OVER_BTN = { retry: { x: 0, y: 0, w: 0, h: 0 }, home: { x: 0, y: 0, w: 0, h: 0 } };
function layoutOverButtons() {
  /* 并排各半、同 y 同高：两个并排的按钮一高一矮会显得错位。
     高度 30（原 36）：按钮变小后不再占据结算页视觉中心，
     "本局分数 / 评级 / 对比上局"才是这页的主角。 */
  const w = (W - 44 - 8) / 2, h = 30, y = H - 60;
  OVER_BTN.retry.x = 22;             OVER_BTN.retry.y = y; OVER_BTN.retry.w = w; OVER_BTN.retry.h = h;
  OVER_BTN.home.x = 22 + w + 8;      OVER_BTN.home.y = y;  OVER_BTN.home.w = w;  OVER_BTN.home.h = h;
}

for (let i = 0; i < 6; i++) SET_BTN.theme.push({ x: 0, y: 0, w: 0, h: 0 });
for (let i = 0; i < 4; i++) SET_BTN.qseg.push({ x: 0, y: 0, w: 0, h: 0 });
// 武器图鉴：在 WEAPONS 的简短 desc 之上补一句特性说明，并展示射速与按键
const WEAPON_INFO = [
  { trait: '均衡起手，射速最快',     key: '1' },
  { trait: '一束贯穿整排敌人',       key: '2' },
  { trait: '扇形覆盖，清小怪群',     key: '3' },
  { trait: '自动锁定最近目标',       key: '4' },
  { trait: '在敌人之间跳跃传导',     key: '5' },
  { trait: '飞出后折返，可二次命中', key: '6' }
];

function layoutButtons() {
  for (let i = 0; i < WEAPON_COUNT; i++) BUTTONS.weapon[i].y = H - WB_H + 8;

  /* 暂停按钮布局：主操作"继续作战"独占一行，两个次要操作（成就 / 设置）横排一行。
     之前五个等大长方形一字排开 —— 那是"功能列表"不是"暂停菜单"，玩家要花时间找"继续"。
     现在主次分层，手指自然落在主按钮上。

     出口决策（重开 / 返回主菜单）不再占按钮位，而是收到面板外的「结束本局 ›」
     文字链里，点开后由独立确认弹窗承载 —— 理由是这两个出口需要"确认"，
     不该和"快速回去"混在同一排抢视觉权重。

     空间不足时压缩按钮高度与间距（下限 20 / 6），同时保证战术面板有最小高度 92px。 */
  const PX = 16, PW = W - 32;
  const botPad = 10;                  // 出口行到底部的留白
  const PANEL_MIN = 92;               // 战术面板最小高度（8 格战况数据的安身之处）
  let mh = 26, MH = 32, gp = 12, eh = 26;

  /* 从底部往上排：出口行（重开/返回）→ 次要行（成就/设置）→ 主按钮（继续作战）。
     出口行放最底部：它是"离开"的语义，离主操作越远越不容易误触。
     抽成函数是因为压缩循环要反复重排 —— 四个尺寸变量每次都在变，
     手写成一串赋值就得在循环里再抄一遍，抄漏一处就是命中区和绘制错位。 */
  function placePauseButtons() {
    const halfW = (PW - gp) / 2;
    const exitY = H - botPad - eh;
    const minorY = exitY - gp - mh;
    const rebirthY = minorY - gp - mh;             // [v1.7p] 重生行（全宽）
    const resumeY = rebirthY - gp - MH;

    PAUSE_BUTTONS.restart.x = PX;                   PAUSE_BUTTONS.restart.y = exitY;
    PAUSE_BUTTONS.restart.w = halfW;                PAUSE_BUTTONS.restart.h = eh;
    PAUSE_BUTTONS.home.x = PX + halfW + gp;         PAUSE_BUTTONS.home.y = exitY;
    PAUSE_BUTTONS.home.w = halfW;                   PAUSE_BUTTONS.home.h = eh;

    PAUSE_BUTTONS.rebirth.x = PX;                  PAUSE_BUTTONS.rebirth.y = rebirthY;
    PAUSE_BUTTONS.rebirth.w = PW;                  PAUSE_BUTTONS.rebirth.h = mh;
    PAUSE_BUTTONS.ach.x = PX;                       PAUSE_BUTTONS.ach.y = minorY;
    PAUSE_BUTTONS.ach.w = halfW;                    PAUSE_BUTTONS.ach.h = mh;
    PAUSE_BUTTONS.settings.x = PX + halfW + gp;     PAUSE_BUTTONS.settings.y = minorY;
    PAUSE_BUTTONS.settings.w = halfW;               PAUSE_BUTTONS.settings.h = mh;

    /* [v1.7] 继续作战全宽：它是暂停面板上唯一的主操作，
       76% 宽是当年"给两颗次要按钮让视觉"的折中 —— 主次已经用
       filled/tonal/outlined 分层表达过了，宽度不该再承担层级语义。 */
    const mw = PW;
    PAUSE_BUTTONS.resume.x = PX + (PW - mw) / 2;
    PAUSE_BUTTONS.resume.y = resumeY;
    PAUSE_BUTTONS.resume.w = mw;                    PAUSE_BUTTONS.resume.h = MH;
    return resumeY;
  }

  /* 空间不足时逐级让：先收间距 → 再压次要行/出口行高度 → 最后才压主按钮。
     收敛条件必须覆盖**所有**可变项，否则某一项触底后其余继续减会变成死循环。 */
  while (placePauseButtons() - 12 - 52 < PANEL_MIN &&
         (gp > 6 || mh > 20 || eh > 20 || MH > 24)) {
    if (gp > 6) gp -= 1;
    else if (mh > 20) mh -= 1;
    else if (eh > 20) eh -= 1;
    else MH = Math.max(24, MH - 1);
  }
  placePauseButtons();

  // 可用垂直区间：标题区分隔线下方 → 版权行上方
  // 可用垂直区间：标题区分隔线下方 → 版权行上方
  const L = MENU_LAYOUT;
  /* 下界 H-30 → H-24：版权行画在 H-13（label 档，占 8px），
     原来 botY 与版权行之间白留 17px，而内容区却差 5px 装不下第二行。 */
  const topY = L.topY, botY = H - 24;
  const avail = botY - topY;
  /* 三块性质不同，能牺牲的顺序也不同：
       内容区 stH —— 已按"内容最小高"给预算，再压就丢行（丢的是价格）
       页脚 footH —— 全是文字，压到比字矮就叠字
       动作行 aH —— 可以压，但下限是触摸目标 LAYOUT.control()，不是比例
     所以让位顺序固定为 ① 上下留白 → ② 区块间隙 → ③ 动作行高，然后停手。
     旧写法是一个 scale 全体等比：既把动作行压到 26px（低于下限 32），
     又让内容区跌破双行下限 —— 该保的没保住，不该压的压了。 */
  const footH = menuFootBlockH();
  const stH = statsBlockH();
  const gapMin = DENSE ? 8 : L.gapMin;
  let aH = L.actionH;
  let gap = Math.max(gapMin, Math.min(L.gapMax, (avail - stH - footH - aH) / 2));
  let padTop = L.padTop, padBot = L.padBot;
  let need = stH + aH + footH + gap * 2;
  if (need + padTop + padBot > avail) {
    padTop = padBot = Math.max(0, (avail - need) / 2);              // ① 留白先让
    if (need > avail) {
      gap = Math.max(gapMin, gap - (need - avail) / 2);             // ② 间隙再让
      need = stH + aH + footH + gap * 2;
      if (need > avail) {
        padTop = padBot = 0;
        aH = Math.max(LAYOUT.control(), aH - (need - avail));       // ③ 让到触摸下限为止
        need = stH + aH + footH + gap * 2;
      }
    }
  }
  /* 竖向余量的分配顺序：① 内容块 ② 区块间隙 ③ 底部留白。
     成长树与监护仪的行高都是"给定高度均分"，所以把余量交给内容是零成本的正确答案；
     居中不是 —— 它只是把空档集中到 app bar 下面。 */
  const GAP_ABS = 48;                       // 间隙再放宽的上限：超过就不是节奏而是断裂
  const slack = Math.max(0, avail - padTop - padBot - need);
  const stUse = Math.min(statsBlockH(menuNodeMaxH()), stH + slack);
  let gapUse = gap;
  let rest = slack - (stUse - stH);
  const grow = Math.min(rest, Math.max(0, GAP_ABS - gap) * 2);
  if (grow > 0) { gapUse = gap + grow / 2; rest -= grow; }
  L.gap = gapUse;
  L._stH = stUse;

  let y = topY + padTop;

  MENU_STATS_AREA.x = 22; MENU_STATS_AREA.w = W - 44;
  MENU_STATS_AREA.y = y;
  MENU_STATS_AREA.h = stUse;                  y += stUse + gapUse;

  /* [v1.7] 动作行单按钮化：开始游戏全宽独占（图鉴已升入顶栏图标位）。
     MENU_FUNC_BTN[0]（图鉴）随之退役，点击端读 MENU_CODEX_BTN。 */
  MENU_START_BTN.x = 22;                      MENU_START_BTN.y = y;
  MENU_START_BTN.w = W - 44;                  MENU_START_BTN.h = aH;
  MENU_FUNC_BTN[0].w = 0; MENU_FUNC_BTN[0].h = 0;   // 退役，防误命中
  y += aH + gapUse;

  MENU_VOL_CTRL.x = 22; MENU_VOL_CTRL.w = W - 44; MENU_VOL_CTRL.h = 22;
  MENU_VOL_CTRL.y = H - 40;   // 音量仍保留，但只在设置页显示

  /* [v1.7] 顶栏两枚图标按钮：图鉴（book）+ 设置（tune），30×30 垂直居中于 48px app bar。
     命中矩形即可见区域 —— mdIconButton 的"命中比可见大"是给暂停键那类
     独立控件用的；顶栏两颗紧挨着品牌字与屏幕边缘，扩命中会把点图鉴变成点空白。 */
  MENU_SETTINGS_BTN.x = W - 22 - 30; MENU_SETTINGS_BTN.y = 9;
  MENU_SETTINGS_BTN.w = 30; MENU_SETTINGS_BTN.h = 30;
  MENU_CODEX_BTN.x = W - 22 - 30 - 4 - 30; MENU_CODEX_BTN.y = 9;
  MENU_CODEX_BTN.w = 30; MENU_CODEX_BTN.h = 30;

  MENU_FUNC_BTN[1].w = 0; MENU_FUNC_BTN[1].h = 0;    // 废弃，防误命中
  MENU_FUNC_BTN[2].w = 0; MENU_FUNC_BTN[2].h = 0;
  /* 页脚块的三个 y 全部在这里定，绘制端只读不算。
     旧做法是布局给一个 footY、绘制端自己 -14 / +12 ——
     标题带和进度条因此从没进过预算。 */
  L.footTop = y;
  L.footY = Math.round(y + mdType('titleSm') + 4);
  L.footBarY = L.footY + 12;
  L.footH = footH;

  // 图鉴页两个 tab（横排，位于统一页签带 PAGE_TAB_Y 上）
  const tw = (W - 44 - 8) / 2;
  for (let i = 0; i < 2; i++) {
    CODEX_TAB_BTN[i].x = 22 + i * (tw + 8);
    CODEX_TAB_BTN[i].y = PAGE_TAB_Y;
    CODEX_TAB_BTN[i].w = tw;
    CODEX_TAB_BTN[i].h = 24;
  }

  /* 成就页页签带：与图鉴页签同一条 PAGE_TAB_Y —— [v1.7] 起两屏页签恒在同一水平线。
     宽度整条通铺（三等分由 mdTabs 自己做），不像图鉴那样留 8px 缝。 */
  ACH_TAB.x = 22; ACH_TAB.y = PAGE_TAB_Y; ACH_TAB.w = W - 44; ACH_TAB.h = 24;

  // 设置页控件
  SET_BTN.mute.x = 22; SET_BTN.mute.w = W - 44; SET_BTN.mute.y = 112; SET_BTN.mute.h = 24;
  /* 设置页分区高度自适应。
     横屏 800x400 → 逻辑高仅 320，四个分区自然高度加起来 300+ 会顶穿返回按钮。
     所以先算自然高度，再按可用空间等比压缩（下限 0.6），
     和主菜单的压缩思路一致：空间不够就压内容，而不是牺牲留白或溢出屏幕。 */
  SET_BTN.back.w = 110; SET_BTN.back.h = 26;
  SET_BTN.back.x = (W - 110) / 2; SET_BTN.back.y = H - 36;
  setLayoutSettings();
}

/* 设置页分区排布：左栏「本机数据」+ 右栏「控件行 + 主题色」。
   原来是音效/画面/主题/数据四区平铺——四个分区等长一栏下来，是"设置列表"
   不是"设置页"；且"数据"是只读统计，和"开关/滑块"混在同一列很别扭。
   现在：
     · 左栏只占顶段：4 张累计统计卡（只读），和主菜单战绩卡同源
     · 右栏续接：静音 / 音量 / FPS 三个统一控件行 + 主题六色
     · 危险操作（清除存档）单独成行，远离其他控件
   横屏（逻辑高仅 320）时整体等比压缩，下限 0.6。 */
let SET_ZONES = [];
/* 右栏三个控件行的 y 与行高单独存放，不塞进 SET_ZONES：
   绘制端拿到的是由 SET_ZONES 重建的 key→zone 映射（drawSettingsPage 里现搭的），
   挂在 z 上的自定义字段会被这一层映射丢掉，绘制只能退回兜底值 ——
   兜底一旦生效，布局就算白算了。独立对象才能原样传到绘制端。 */
let SET_RIGHT = { rows: [], rowH: 0 };
function setLayoutSettings() {
  /* [v1.7] 设置页改为四分区纵向流：个性化（用户名+主题色）/ 音效 / 画面 / 本机数据，
     每区 = mdSection 标题 + 一张卡。旧版是"上栏统计卡 + 下栏控件行"两段式：
     只读统计占着页首黄金位置，五个控件行没有分组标题，"静音"和"画质"
     看起来像同一类东西。分区流让类别由标题明说，可调项置顶、只读数据沉底。
     ⚠️ 命中对象名全部保留：SET_BTN.name/mute/vol/fps/qseg/theme/reset 与
     SET_RIGHT.rows（0=用户名 1=静音 2=音量 3=FPS 4=画质），点击端零改动。 */
  const C = SET_CTRL;
  const top = PAGE_TOP_H + 6;
  const bot = SET_BTN.back.y - 8;            // 返回按钮上留 8px 呼吸
  const RESET_H = 26;
  /* DENSE（H<400）降级路径：挤掉的是"结构装饰"而不是功能 ——
     分区标题与本机数据区退场（数据在主菜单战绩页/暂停面板都有），
     主题色收成单行六格。 */
  const dense = DENSE;
  const showStat = !dense, showHeads = !dense, themeRows = dense ? 1 : 2;
  const SEC_HEAD = mdType('titleSm') + 4;    // mdSection 标题带
  const SEC_LBL = mdType('label') + 4;       // 卡内小标签带（主题色）
  const CARD_PAD = 3;

  /* 布局是收缩因子 s 的纯函数：行高/色块/统计格/间距同步缩，不会互相错位。
     s 只管收缩；余量另走"撑缝"通道，块高一律不虚胖（与主菜单同一哲学）。 */
  const lay = (s, gapBoost) => {
    const rowH = Math.round(C.ROW_H * s);
    const swH = Math.max(SEC_LBL, Math.round(24 * s));
    const statCell = Math.max(18, Math.round(26 * s));
    const secGap = Math.round(8 * s) + (gapBoost || 0);
    const rowInGap = Math.max(3, Math.round(4 * s));
    const swGap = Math.round(4 * s);
    const z = {};
    let y = top;
    const head = showHeads ? SEC_HEAD : 0;
    y += head;                                          // 「个性化」
    z.pers = { key: 'pers', y: y,
      h: CARD_PAD + rowH + rowInGap + SEC_LBL + swH * themeRows + swGap * (themeRows - 1) + CARD_PAD };
    y += z.pers.h + secGap;
    y += head;                                          // 「音效」
    z.snd = { key: 'snd', y: y, h: CARD_PAD * 2 + rowH * 2 + rowInGap };
    y += z.snd.h + secGap;
    y += head;                                          // 「画面」
    z.disp = { key: 'disp', y: y, h: CARD_PAD * 2 + rowH * 2 + rowInGap };
    y += z.disp.h + secGap;
    if (showStat) {
      y += head;                                       // 「本机数据」
      z.stat = { key: 'stat', y: y, h: CARD_PAD * 2 + statCell * 2 + rowInGap };
      y += z.stat.h + secGap;
    } else {
      z.stat = { key: 'stat', y: y, h: 0 };
    }
    z.data = { key: 'data', y: y, h: RESET_H };         // 清除存档（危险区，不参与压缩）
    y += RESET_H + 4;
    const footY = y + mdType('label');                  // AGPL 页脚
    return { rowH: rowH, swH: swH, statCell: statCell, secGap: secGap,
      rowInGap: rowInGap, swGap: swGap, z: z, footY: footY, total: footY + 6 - top };
  };

  let s = 1, L = lay(1, 0);
  while (L.total > bot - top && s > 0.6) { s -= 0.05; L = lay(s, 0); }
  /* 余量撑缝不撑块：四个分区间隙均摊，每条最多 +10 —— 超过就是断裂不是节奏。 */
  const slack = (bot - top) - L.total;
  if (slack > 2) L = lay(s, Math.min(10, Math.floor(slack / 4)));

  SET_RIGHT.rows = [
    L.z.pers.y + CARD_PAD,                                  // 0 用户名（个性化卡内）
    L.z.snd.y + CARD_PAD,                                   // 1 静音（音效卡内）
    L.z.snd.y + CARD_PAD + L.rowH + L.rowInGap,             // 2 音量
    L.z.disp.y + CARD_PAD,                                  // 3 FPS（画面卡内）
    L.z.disp.y + CARD_PAD + L.rowH + L.rowInGap             // 4 画质
  ];
  SET_RIGHT.rowH = L.rowH;
  SET_RIGHT.footY = L.footY;
  SET_RIGHT.statCell = L.statCell;                          // 统计格高（绘制端 2×2 用）
  /* 卡内「主题色」小标签带：色块区起点由它给出。 */
  SET_RIGHT.themeLblY = SET_RIGHT.rows[0] + L.rowH + L.rowInGap;

  /* 主题色块：个性化卡内、用户名行之下。位置由布局写回 SET_BTN.theme，
     绘制端与命中端读同一份（画质分段/图鉴页签都踩过"两份真相"的坑）。 */
  {
    const swTop = SET_RIGHT.themeLblY + SEC_LBL;
    const cols = themeRows === 1 ? 6 : 3;
    const sw = Math.round(((W - 44) - (cols - 1) * 6) / cols);
    for (let i = 0; i < 6; i++) {
      const col = i % cols, row = (i / cols) | 0;
      SET_BTN.theme[i].x = 22 + col * (sw + 6);
      SET_BTN.theme[i].y = swTop + row * (L.swH + L.swGap);
      SET_BTN.theme[i].w = sw; SET_BTN.theme[i].h = L.swH;
    }
  }

  /* 画质分段按钮（几何口径同旧版：标签之后起排、右端对齐、段间无缝）。 */
  {
    const qy = SET_RIGHT.rows[4];
    const n = QUALITY_MODES.length;
    const segH = Math.max(12, Math.min(18, L.rowH - 4));
    const right = 22 + (W - 44) - 8;
    const left = 22 + C.LABEL.pad + 30;
    const totalW = right - left;
    const segW = Math.max(18, totalW / n);
    const segY = qy + (L.rowH - segH) / 2;
    for (let i = 0; i < n; i++) {
      SET_BTN.qseg[i].x = left + i * segW;
      SET_BTN.qseg[i].y = segY;
      SET_BTN.qseg[i].w = segW;
      SET_BTN.qseg[i].h = segH;
    }
  }

  /* 五个控件行的命中矩形：画在哪，就点哪。 */
  SET_BTN.name.y = SET_RIGHT.rows[0]; SET_BTN.name.h = L.rowH;
  SET_BTN.mute.y = SET_RIGHT.rows[1]; SET_BTN.mute.h = L.rowH;
  SET_BTN.vol.y = SET_RIGHT.rows[2];  SET_BTN.vol.h = L.rowH;
  SET_BTN.fps.y = SET_RIGHT.rows[3];  SET_BTN.fps.h = L.rowH;
  SET_BTN.name.x = 22; SET_BTN.name.w = W - 44;
  SET_BTN.mute.x = 22; SET_BTN.mute.w = W - 44;
  SET_BTN.vol.x = 22;  SET_BTN.vol.w = W - 44;
  SET_BTN.fps.x = 22;  SET_BTN.fps.w = W - 44;
  SET_BTN.reset.x = 22; SET_BTN.reset.w = W - 44; SET_BTN.reset.h = RESET_H;
  SET_BTN.reset.y = L.z.data.y;

  SET_ZONES = [L.z.pers, L.z.snd, L.z.disp, L.z.stat, L.z.data];
}

/* 主菜单点击分发（抽成函数，避免逻辑埋在事件回调里难以复用与验证）。
   子页面优先：各自控件先处理，点空白则返回主菜单。
   返回 'drag' 表示命中音量滑块，需要后续 pointermove 继续拖动。 */
/* 设置页点击处理（主菜单与暂停态共用）。
   抽成独立函数是因为设置页有**两个入口**：主菜单右上角胶囊、暂停面板的「设置」按钮。
   原先只有 handleMenuTap 里写了这套逻辑，暂停态的 handleButtonPress 直接一句
   "设置页打开就 uiCloseTop()" —— 结果暂停中打开设置页后，
   **任何点击都只是把页面关掉**，静音开关/音量条/FPS/主题色块/清除存档全部点不动。

   返回值语义（调用方据此决定后续动作）：
     'drag' → 命中音量滑块，需要后续 pointermove 继续拖动
     true   → 命中了某个控件，本次点击已消费
     false  → 未命中任何控件（视为点空白，由调用方决定是否关闭页面） */
function handleSettingsTap(x, y, fromPause) {
  if (hitSetVolumeArea(x, y)) { setVolDragging = true; setVolumeFromPointer(x); return 'drag'; }
  if (hitTest(SET_BTN.name, x, y)) { Audio.ui(900); uiOpen('name'); return true; }
  if (hitTest(SET_BTN.mute, x, y)) { Audio.toggleMute(); Audio.ui(700); return true; }
  if (hitTest(SET_BTN.fps, x, y)) { toggleFps(); return true; }
  // 画质：点某一档直接切换；点行内空白不做任何事（避免误触改档）
  if (hitTest({ x: 22, y: SET_RIGHT.rows[4], w: W - 44, h: SET_RIGHT.rowH }, x, y)) {
    for (let i = 0; i < SET_BTN.qseg.length; i++) {
      if (hitTest(SET_BTN.qseg[i], x, y)) { setQualityMode(i); Audio.ui(820 + i * 70); return true; }
    }
    return true;   // 命中行但没命中分段：消费掉，别穿透关页面
  }
  // 主题色块：即时生效，不用确认按钮。色块自身就是预览
  for (let i = 0; i < SET_BTN.theme.length; i++) {
    if (hitTest(SET_BTN.theme[i], x, y)) { if (setTheme(i)) Audio.ui(900 + i * 90); return true; }
  }
  if (hitTest(SET_BTN.reset, x, y)) {
    // 二次确认：清除存档不可撤销，防误触
    if (resetConfirm) { clearAllData(); resetConfirm = false; Audio.ui(300); }
    else { resetConfirm = true; Audio.ui(500); }
    return true;
  }
  // 点空白：只关设置页，绝不穿透到下层（暂停态下尤其危险 —— 不能顺手把游戏继续了）
  uiCloseTop();
  if (fromPause) Audio.play(600, 0.07, 'square', 0.03, 900);
  else Audio.ui(600);
  return true;
}

function handleMenuTap(x, y) {
  // 图鉴页：先判 tab，其余位置一律返回主菜单（与设置页一致的交互）
  if (codexPage.active) {
  // 武器选择条：点格子切换选中武器（切 tab 之外的新交互）
  if (codexPage.active && codexPage.tab === 1) {
    for (let i = 0; i < CODEX_WEAPON_TABS.length; i++) {
      const tb = CODEX_WEAPON_TABS[i];
      if (tb && hitTest(tb, x, y)) {
        if (codexPage.weaponSel !== i) { codexPage.weaponSel = i; Audio.ui(1000); }
        return true;
      }
    }
  }
    if (hitTest(CODEX_TAB_BTN[0], x, y)) { codexPage.tab = 0; Audio.ui(800); return true; }
    if (hitTest(CODEX_TAB_BTN[1], x, y)) { codexPage.tab = 1; Audio.ui(800); return true; }
    // 点空白关闭：交给栈顶处理（栈决定关谁，不用在这里写死）
    uiCloseTop(); Audio.ui(600); return true;
  }
  if (settingsPageActive) return handleSettingsTap(x, y, false);
  if (hitTest(MENU_SETTINGS_BTN, x, y)) { uiOpen('settings'); Audio.ui(1000); return true; }
  if (hitTest(MENU_CODEX_BTN, x, y)) { uiOpen('codex'); Audio.ui(1000); return true; }

  /* 标签切换：真实状态 menuPage 立刻变，视觉偏移交给补间。
     不等动画播完再切 —— 那样连点会丢输入，且状态与显示脱节。 */
  for (let i = 0; i < menuTabRect.length; i++) {
    if (hitTest(menuTabRect[i], x, y)) {
      if (menuPage !== i) {
        menuPage = i;
        Anim.add(menuPageX, { v: i }, 0.25, EASE.out);
        Audio.ui(700 + i * 100);
      }
      return true;
    }
  }

  /* 成长树节点：点节点是"买这一级"，不是开始游戏 ——
     必须在这里 return，否则会掉到下面的 startGame() 直接开局。 */
  if (menuPage === 0) {
    for (let i = 0; i < menuNodeRect.length; i++) {
      if (!hitTest(menuNodeRect[i], x, y)) continue;
      const u = TREE_UPGRADES[i];
      if (buyTreeUpgrade(u.id)) {
        nodeFlashT[u.id] = uiTime;
        Audio.ui(880 + upgLevel(u.id) * 60);
        pushToast(u.name, '提升至 Lv.' + upgLevel(u.id), u.color);
      } else {
        // 买不起 / 已满级：给一声低音，不做惩罚性提示（避免频繁弹窗烦人）
        Audio.ui(300);
      }
      return true;
    }
  }

  /* ⚠️ 点空白**不再**直接开局。
     这是单页菜单时代的"点任意处快速开始"设计，但现在主菜单有成长树和 Tab：
     点两个节点之间的 5px 缝隙、点标题、点底部空白都会直接开局 ——
     是最严重的误触源（想买升级，手指一偏，游戏开了）。

     开局改为只能点"开始游戏"按钮（160×42，足够大且视觉最突出）。
     其余空白一律消费掉但不做任何事，避免穿透到下层。 */
  /* 开始游戏现在与图鉴并排在同一行（两页共用），所以**两页都可点**。
     原来它单独在成长页、战绩页不显示 —— 那个限制是为了防"看数据时误触开局"，
     但当时真正的元凶是"点任意空白都能开局"（已单独修复）。
     现在它是明确的按钮，与图鉴同类，没必要在战绩页隐藏：
     隐藏会让左半格空着（布局虽不跳动但看着像缺块），且切换页时按钮凭空消失很突兀。 */
  if (hitTest(MENU_START_BTN, x, y)) { startGame(); return true; }
  return true;
}

function hitTest(btn, x, y) { return x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h; }
/* 设置页音量控件行的可拖动区：右端 78px 宽的轨道。
   与旧版独立滑块不同——音量现在嵌在控件行里（和静音开关同一行高），
   拖动区只是该行右侧的条带，点一下就跳到对应比例，拖着走可连续调节。 */
function hitSetVolumeArea(x, y) {
  /* 为什么整行都是命中区：旧实现只认右端 `tx-6 ~ tx+72` 这一条手绘带（tx=W-22-86），
     于是"音量"两个字（占整行左半）与滑块右端全部判不中，一路落到 uiCloseTop ——
     点一下"音量"标签就把设置页关掉；Audio.isMuted 时更狠，整行一律 return false。
     现在只读一份矩形（SET_BTN.vol，由 setLayoutSettings 与 drawSetRow 共同维护），
     四个裸数字 86/6/72/62 全部删掉；禁用态改由 setVolumeFromPointer 表达
     （消费点击但不改值），不再靠"点不到"来表达"不能调"。 */
  const v = SET_BTN.vol;
  if (!hitTest(v, x, y)) return false;
  setVolRowY = v.y;
  return true;
}
let setVolRowY = 0;
let setVolDragging = false;
function setVolumeFromPointer(px) {
  /* 值映射用绘制端写回的轨道矩形（SET_BTN.vol.track），极端情况（页面刚打开、
     一帧都还没画）退回同一个函数 setVolTrack() 现算 —— 退回的是同一份公式，
     不是第二份。静音时轨道画的是禁用态：消费点击但不改值，
     这样拖动也不会出现"数值跟着手指走但滑块不动"的假象。
     为什么还要判一次轨道带：命中区按契约 §6.2 扩成了整行（点左半不再关页），
     但旧实现真正会改值的只有右端那条手绘带。不加这一道，点"音量"两个字
     会把滑块钳到 0 —— 修好一个误触又造出一个更响的误触。 */
  if (Audio.isMuted) return;
  const t = SET_BTN.vol.track || setVolTrack();
  const pad = 10;                        /* 滑块半径 7 + 3px 容差，轨道两端算够得着 */
  if (px < t.x - pad || px > t.x + t.w + pad) return;
  Audio.setVolume(mdClamp((px - t.x) / t.w, 0, 1));
}

function updateVolumeFromX(x) {
  const trackX = 46, trackW = W - 92;
  const ratio = Math.max(0, Math.min(1, (x - trackX) / trackW));
  Audio.setVolume(ratio);
}

let weaponGlow = 0;   // 武器切换流光计时
function selectWeapon(i) {
  if (i < 0 || i >= WEAPON_COUNT) return;
  // 放在越界检查之后：无效索引不该计入战况统计
  if (i !== player.weapon) { runSwitches++; weaponGlow = 0.5; Audio.ui(1050); }
  player.weapon = i;
  if (!weaponUsed[i]) { weaponUsed[i] = true; checkAllWeapons(); }
}

function handleButtonPress(x, y) {
  /* 主菜单垮掉期间吞掉所有点击：此时菜单还在往下掉，
     但状态已经是 MODE_PLAY —— 不挡的话玩家点一下就会命中下面的暂停按钮或道具栏，
     在"菜单还没走完"的时候触发游戏内操作，观感很割裂。 */
  if (menuFall < 1) return true;
  /* 结算页：按钮出现（goAnim > 2.6）前吞掉所有点击，出现后**只认两个按钮**。
     原来这里无分支，落到 8769 行的"点任意处重开"—— 右边加了"返回菜单"之后，
     想返回的人点偏一点就会直接重开，且不可逆。
     空格键快速重开仍保留（键盘路径不受影响）。 */
  if (state.mode === MODE_OVER) {
    if (goAnim > 2.6) {
      if (hitTest(OVER_BTN.retry, x, y)) { Audio.play(660, 0.08, 'square', 0.03, 900); startGame(); return true; }
      if (hitTest(OVER_BTN.home, x, y)) { Audio.play(400, 0.1, 'square', 0.03, 300); uiCloseAll(); returnToMenu(); return true; }
    }
    return true;      // 其余一律吞掉：结算页不该有点空白就触发的动作
  }
  if (paused && state.mode === MODE_PLAY) {
    // 暂停时点击右上角暂停按钮同样可以恢复
    if (hitTest(BUTTONS.pause, x, y)) { resumeGame(); return true; }
    /* 设置页打开时：走与主菜单**同一套**控件处理，不能一律当"点空白关页面"。
       原来这里无条件 uiCloseTop()，导致暂停中打开设置页后所有控件都点不动
       （静音/音量/FPS/主题色块/清除存档全部失效，只有关闭页面这一个效果）。
       'drag' 需向上传递，让 pointermove 能继续拖动音量滑块。 */
    if (settingsPageActive) return handleSettingsTap(x, y, true);
    // 成就页打开时：页签先判命中（读 drawAchPage 写回的 ACH_TAB_BTN），其余点击返回主暂停面板
    if (achPageActive) {
      for (let i = 0; i < ACH_TAB_BTN.length; i++) {
        if (hitTest(ACH_TAB_BTN[i], x, y)) {
          if (achFilter !== i) { achFilter = i; Audio.ui(800); }
          return true;
        }
      }
      uiCloseTop(); Audio.play(600, 0.07, 'square', 0.03, 900);
      return true;
    }
    /* 折线图指标切换：三个 tab 画在面板内、命中区由绘制端写回，
       点选后不关闭面板（暂停态的点击应停留在这块数据板上）。 */
    for (let i = 0; i < PAUSE_TREND_TABS.length; i++) {
      if (hitTest(PAUSE_TREND_TABS[i], x, y)) {
        if (trendMetric !== i) { trendMetric = i; Audio.play(760 + i * 90, 0.06, 'square', 0.03, 900); }
        return true;
      }
    }
    if (hitTest(PAUSE_BUTTONS.resume, x, y)) { resumeGame(); return true; }
    if (hitTest(PAUSE_BUTTONS.ach, x, y)) {
      uiOpen('ach'); Audio.play(700, 0.08, 'square', 0.03, 1100);
      return true;
    }
    if (hitTest(PAUSE_BUTTONS.settings, x, y)) {
      uiOpen('settings'); Audio.play(700, 0.08, 'square', 0.03, 1000);
      return true;
    }
    /* 出口一级化：重开 / 返回主菜单都在面板上直接生效，不再走二次确认弹窗。
       返回主菜单原先藏在「结束本局 ›」文字链 → 弹窗的二级路径里，
       玩家在暂停面板上根本看不到入口 —— 这才是"返回缺失"的真正原因。 */
    if (hitTest(PAUSE_BUTTONS.rebirth, x, y)) { doRebirth(); return true; }   // [v1.7p]
    if (hitTest(PAUSE_BUTTONS.restart, x, y)) {
      Audio.play(500, 0.1, 'square', 0.03, 400);
      paused = false; startGame();
      return true;
    }
    if (hitTest(PAUSE_BUTTONS.home, x, y)) {
      Audio.play(400, 0.1, 'square', 0.03, 300);
      uiCloseAll(); returnToMenu();
      return true;
    }
    return true;
  }
  // 道具栏优先于暂停按钮之外的所有判定：它占的是可玩区，点它不该顺带移动飞机
  if (state.mode === MODE_PLAY && !paused) {
    for (let i = 0; i < ITEM_N; i++) {
      if (hitTest(itemRect(i), x, y)) { useItem(i); return true; }
    }
  }
  if (hitTest(BUTTONS.pause, x, y)) {
    if (state.mode === MODE_PLAY) {
      paused = !paused; Audio.play(500, 0.06, 'square', 0.02, 700);
      if (paused) Audio.stopBGM(); else Audio.startBGM();
    }
    return true;
  }
  if (paused) return false;
  if (state.mode !== MODE_PLAY) return false;
  if (upgradePanel.active) return false;
  for (let i = 0; i < WEAPON_COUNT; i++) {
    if (hitTest(BUTTONS.weapon[i], x, y)) { selectWeapon(i); Audio.play(600, 0.04, 'square', 0.02, 800); return true; }
  }
  return false;
}

const UP_PANEL = { x: 20, w: W - 40, y0: 110, h: 48, gap: 8, rest: 0, slide: 0, intro: 1 };
/* 入场位移（逻辑像素）与它的时间曲线。为什么住在这里：位移原来只加在
   drawUpgradePanel 的绘制表达式上（+ (1-intro)*22），而 handleUpgradeTap 读的是
   未位移的 y0 + i*(h+gap) —— 前 0.28s 里点第 1 张卡的视觉位置会命中第 2 张，
   横屏还会把第三张卡画进跳过按钮的命中区（实测见报告）。
   现在位移由 upLayout 产出并写进 y0 本身：绘制与命中重新成为同一份数据的两个读者，
   也保住 H9「命中矩形只在 layout 阶段产出」。UP_INTRO.total 与 showUpgradePanel 里
   的 timer=9 是同一件事的两端，只读，不改它的语义。 */
const UP_INTRO = { total: 9, dur: 0.28, max: 22 };
/* 遮罩档位：modal(.66) 单独压不住还在动的战场。实测（work/probe-upgrade-still.js，
   390×844，隔 30 帧逐像素比）：.66×1.2=.792 时纯遮罩带最大单通道差 51 级，
   而改造前那层 rgba(4,8,14,0.9) 同位置只有 25 级 —— 换成 mdScrim 反而漏了一倍。
   所以第二参数取 1.364：.66×1.364=.90024，正好落在 mdScrim 自带的 0.9 钳制上，
   既对齐改造前的浓度、又不可能比它更黑。绝不回去手写 rgba。 */
const UP_SCRIM_SCALE = 1.364;
// 跳过按钮：三张卡下方。位置由卡数推导（卡池可能不足 3 张）
const UP_SKIP_BTN = { x: 20, w: W - 40, y: 0, h: 26 };

/* 升级面板布局：卡片高度与起始 y 按屏幕高度自适应。
   原写死 y0=110 / h=48 / gap=8，在横屏（H=320）下**必然重叠**：
     第三张卡占 222~270，而「剩余 N 秒」画在 H-60=260 —— 压在卡片上；
     跳过按钮 282~308，「点击卡片购买」画在 H-42=278 —— 又压一次。
   现在改为按可用区间反推：先算能分多少高度，再决定卡片多高、从哪开始。

   两个副作用是**有意为之**：
     · 卡片高度不够 58 时不显示 tip（矮屏优先保证名字/数字/价格可读）
     · 高屏上卡片区垂直居中，不再全堆在顶部留一大片空 */
let upShowTip = true;
function upLayout() {
  /* 为什么换整个函数而不是只在末尾加一行：静止位的算法必须逐字保留（那是命中矩形
     本身），而位移只有从"绘制时的临时量"变成"layout 产出的矩形"才可能与命中同源。 */
  const n = Math.max(1, upgradePanel.options.length || 3);
  const top = HUD_H + 52;                 // 标题 + 金币行之下
  /* 底部提示画在 H-30，文字高约 7px —— 再留 10px 间隙，
     否则跳过按钮底会正好贴在提示文字顶上（H=320 时两者都是 290，紧贴无呼吸）。 */
  const botLimit = H - 30 - 10;
  let gap = 8; const skipH = UP_SKIP_BTN.h, skipGap = 4;   // gap 会在矮屏被压缩，不能是 const
  const avail = botLimit - skipH - skipGap - top;
  /* 每张卡高度：带 tip 需 58+，纯数字下限 46（再矮图标和两行文字就打架了）。
     上限 62 —— 再高只会让卡片之间空得像分隔线，不增加信息。 */
  let h = Math.floor((avail - gap * (n - 1)) / n);
  h = Math.max(46, Math.min(62, h));
  /* 矮屏三级收缩：卡高触底后先收**间距**，仍放不下才允许降到硬下限 42。
     只有第一级（压卡高）时 H=320 会溢出约 10px，跳过按钮底正好贴到底部提示。
     顺序不能反：先压卡高会让三张卡都变得难读，而间距从 8 收到 4 视觉代价小得多。 */
  let blockH = n * h + gap * (n - 1);
  while (blockH > avail && gap > 4) { gap -= 1; blockH = n * h + gap * (n - 1); }
  if (blockH > avail) {
    h = Math.max(42, Math.floor((avail - gap * (n - 1)) / n));
    blockH = n * h + gap * (n - 1);
  }
  upShowTip = h >= 58;
  UP_PANEL.h = h;
  UP_PANEL.gap = gap;
  /* 静止位：与改造前同一个表达式，一个字符都没动（命中矩形不许挪）。 */
  const restY = Math.round(top + Math.max(0, (avail - blockH) / 2));
  UP_PANEL.rest = restY;
  /* 入场进度：挂在 upgradePanel.timer 上的一次性计时器，不是 sin 常态呼吸 ——
     timer 走完后 intro 恒为 1，静止帧之间不再有差。 */
  const introRaw = Math.min(1, (UP_INTRO.total - upgradePanel.timer) / UP_INTRO.dur);
  UP_PANEL.intro = mdClamp(1 - Math.pow(1 - introRaw, 3), 0, 1);
  /* 位移预算 = 跳过按钮底到 botLimit 之间**真实剩下**的空间（上限 22）。
     实测：竖屏 519 高时余量 65 → 照给 22；横屏 320 高时余量 0（卡区 116~250 +
     跳过 254~280 正好顶格）→ 入场只做淡入。硬推 22 就会把第三张卡画进
     跳过按钮的命中区，那正是本条要修的 bug，而不是"把 22 调小"能了事的。 */
  UP_PANEL.slide = Math.max(0, Math.min(UP_INTRO.max, botLimit - (restY + blockH + skipGap + skipH)));
  UP_PANEL.y0 = restY + Math.round((1 - UP_PANEL.intro) * UP_PANEL.slide);
}
function upSkipY() {
  const n = upgradePanel.options.length;
  /* 原式 n*(h+gap) 比卡片区实际底部多算了一个 gap（最后一张卡后面没有间隙），
     把跳过按钮白白往下推 8px —— 矮屏上这点余量正好被提示文字吃掉。 */
  return UP_PANEL.y0 + n * UP_PANEL.h + (n - 1) * UP_PANEL.gap + 4;
}
/* 道具槽矩形。绘制与命中判定共用同一份 ——
   HUD 那次"命中区写死、绘制算出来"导致全屏点不动的教训不能再犯。 */
function itemRect(i) {
  const top = HUD_H + 6, bot = H - WB_H - 6;
  const y0 = Math.round((top + bot) / 2 - ITEM_TOTAL / 2);
  return { x: ITEM_X, y: y0 + i * (ITEM_S + ITEM_GAP), w: ITEM_S, h: ITEM_S };
}

// 拾取道具入栏。返回是否收下（满则丢弃并提示，不让掉落白费）
function addItem(k) {
  const idx = ITEM_SLOTS.findIndex(t => t.k === k);
  if (idx < 0) return false;
  /* 上限已取消（见 ITEM_MAX = Infinity）：不再有"满格丢弃"这条分支。
     此前这里会 pushToast('xx已满') 并 return false —— 打得好反而丢道具。
     仍走一次 itemCap 判断（恒不触发），好处是如果将来要恢复上限，
     改一个常量即可，UI 的满格提示也会跟着回来，不用重新接线。 */
  if (itemCounts[idx] >= itemCap(idx)) {
    pushToast(ITEM_SLOTS[idx].name + '已满', '上限 ' + itemCap(idx), ITEM_SLOTS[idx].color);
    return false;
  }
  itemCounts[idx]++;
  return true;
}

function useItem(i) {
  if (i < 0 || i >= ITEM_SLOTS.length) return;
  if (state.mode !== MODE_PLAY || paused || upgradePanel.active || !player.alive) return;
  if (itemCounts[i] <= 0) { Audio.play(180, 0.08, 'square', 0.02, 120); return; }
  const it = ITEM_SLOTS[i];
  itemCounts[i]--;
  Audio.ui(760);
  switch (it.k) {
    case 'bomb': bombBlast(); break;
    case 'slow':
      slowT = SLOW_TIME;
      flashScreen = Math.max(flashScreen, 0.2); flashColor = 'secondary';
      pushToast('时间缓速', SLOW_TIME + ' 秒', POWERUP_COLORS.slow);
      break;
    case 'repair': {
      const before = state.hp;
      state.hp = Math.min(state.maxHp, state.hp + REPAIR_HEAL);
      pushToast('应急维修', '+' + Math.round(state.hp - before) + ' 生命', POWERUP_COLORS.repair);
      explode(player.x, player.y, POWERUP_COLORS.repair, 10, 70);
      break;
    }
    case 'collect': {
      /* 逐个 applyPowerup 而不是直接给分：掉落的可能是道具也可能是增益，
         走同一条结算路径才不会漏掉"满栏折算""成就触发"这些副作用。 */
      const n = powerups.length;
      const list = powerups.slice();
      powerups.length = 0;
      for (const p of list) { applyPowerup(p.type, p.x, p.y); explode(p.x, p.y, POWERUP_COLORS.collect, 5, 50); }
      pushToast('磁力吸引', n > 0 ? '吸取 ' + n + ' 个' : '场上无掉落', POWERUP_COLORS.collect);
      break;
    }
    case 'barrier': {
      const before = player.shield;
      gainShield(SHIELD_ITEM_AMT);
      pushToast('护盾发生器', '+' + Math.round(player.shield - before) + ' 点', POWERUP_COLORS.shield);
      explode(player.x, player.y, POWERUP_COLORS.shield, 10, 70);
      break;
    }
  }
}

function handleUpgradeTap(x, y) {
  for (let i = 0; i < upgradePanel.options.length; i++) {
    const oy = UP_PANEL.y0 + i * (UP_PANEL.h + UP_PANEL.gap);
    if (x >= UP_PANEL.x && x <= UP_PANEL.x + UP_PANEL.w && y >= oy && y <= oy + UP_PANEL.h) { buyUpgrade(i); return; }
  }
  // 跳过按钮优先于"点空白关闭"：明确的入口不该被空白点击抢走
  const sk = UP_SKIP_BTN; sk.y = upSkipY();
  if (x >= sk.x && x <= sk.x + sk.w && y >= sk.y && y <= sk.y + sk.h) { closeUpgradePanel(); return; }
  closeUpgradePanel();
}

/* ==================================================================
   星空 & 敌人
   ================================================================== */
/* ==================================================================
   太空背景：星区配色 / 气辉 / 星云 / 5 层视差星场 / 天体锚点
   原则：全部生成式绘制 + 离屏缓存，运行时只做位移，不进热路径重算
   ================================================================== */

// 星区主题：随波次推进，色相缓慢漂移，让"旅程在前进"被感觉到
/* 星区扩到 8 个（原 4 个，第 16 波后永远卡在"赤色深空"）。
   后 4 个带 hazard（环境规则）：地带从"换壁纸"变成"换规则"。

   hazard.m 是**属性乘数**，键与乘数函数对应：
     rate 射速 / taken 受伤 / drop 掉落 / move 移速
   全部为纯属性修正，不引入新机制（热量条、惯性滑行这类要新系统 + 新 HUD，
   且会和现有 8 种拾取状态叠成两套规则，玩家学不会）。

   难度递进：前 4 个无惩罚 → 5~8 逐步加码，
   让"打到第几波"有了除敌人数量之外的第二个压力维度。 */
const STAR_ZONES = [
  { name:'猎户边境', top:'#070b1a', bot:'#0b1228', neb:['#2a4d8f', '#3a7bd5', '#1c3f7a'], nebA:0.15 },
  { name:'玫瑰星云', top:'#0d0818', bot:'#1a0a26', neb:['#8b2f6f', '#5a1f5e', '#c04a8a'], nebA:0.19 },
  { name:'麒麟暗域', top:'#04120f', bot:'#071a18', neb:['#1f6f5c', '#2a8f70', '#12463f'], nebA:0.15 },
  { name:'赤色深空', top:'#12060c', bot:'#1e0810', neb:['#8f2436', '#c03a2f', '#5c1a26'], nebA:0.20 },
  { name:'冰封环带', top:'#061420', bot:'#0a2436', neb:['#4a90c4', '#7ec8e8', '#28607f'], nebA:0.17,
    hazard:{ id:'cold',  name:'寒冷', desc:'移速 -22% · 射速 -18%', color:'#7be9ff', m:{ move:0.78, rate:0.82 } } },
  { name:'恒星熔炉', top:'#1a0a04', bot:'#2e1006', neb:['#e8722a', '#ffa040', '#a03c14'], nebA:0.22,
    hazard:{ id:'heat',  name:'过热', desc:'受伤 +35%',              color:'#ff7043', m:{ taken:1.35 } } },
  { name:'磁暴涡旋', top:'#0a0618', bot:'#160a2c', neb:['#9a6bd8', '#c89aff', '#5c3a94'], nebA:0.20,
    hazard:{ id:'storm', name:'磁暴', desc:'掉落减半 · 射速 -12%',   color:'#b06bff', m:{ drop:0.5, rate:0.88 } } },
  { name:'虚空洞穴', top:'#050510', bot:'#0a0a1c', neb:['#3a4a6f', '#5a6a94', '#1a2036'], nebA:0.14,
    hazard:{ id:'void',  name:'虚空', desc:'移速 -15% · 受伤 +25%',  color:'#8ab4d8', m:{ move:0.85, taken:1.25 } } }
];
function zoneIndexForWave(wave) { return Math.min(STAR_ZONES.length - 1, Math.max(0, Math.floor((wave - 1) / 5))); }
/* 上一次所处的地带索引：只在**跨地带**时提示环境效果，
   否则每波都弹一次 toast，第 6~10 波连弹 5 次同样的"冰封环带"就是噪音。 */
let lastZoneIdx = 0;

// 确定性随机：星云/行星必须每次生成同一结果，方便缓存与复用
function makeRnd(seed) {
  let s = (seed >>> 0) || 1;
  return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

// 星云：多个径向渐变团块叠加成不规则云团（比噪声实现更快，且不依赖 ImageData）
function makeNebula(size, seed, colors) {
  const rnd = makeRnd(seed);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 34; i++) {
    const cx = rnd() * size, cy = rnd() * size;
    const r = size * (0.10 + rnd() * 0.26);
    const col = colors[Math.floor(rnd() * colors.length)];
    const grad = g.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, hexA(col, 0.5));
    grad.addColorStop(1, hexA(col, 0));
    g.fillStyle = grad;
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  }
  return c;
}
// 行星：统一光照（光来自左上 45°），右下自动变暗，建立可信光源逻辑
function makePlanet(r, colors) {
  const c = document.createElement('canvas'); c.width = c.height = r * 2;
  const g = c.getContext('2d');
  const lx = r * 0.62, ly = r * 0.62;
  const grad = g.createRadialGradient(lx, ly, r * 0.08, r, r, r);
  grad.addColorStop(0, colors[1]);
  grad.addColorStop(0.5, colors[0]);
  grad.addColorStop(1, mdRole('surfaceContainerLowest'));   // 夜面 = 主题中性面，不是钉死的 #05070f
  g.fillStyle = grad; g.beginPath(); g.arc(r, r, r - 1, 0, Math.PI * 2); g.fill();
  g.globalCompositeOperation = 'lighter';

function updateEnvironment(dt) {

    y: HUD_H + 30 + Math.random() * (H * 0.35),

function drawBackground() {
  const zone = STAR_ZONES[zoneIndexForWave(state.wave)];

  // --- 第 1 层：深空气辉（替换纯黑底，色相随星区漂移）---
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, zone.top);
  grad.addColorStop(1, zone.bot);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  if (auraSprite) {
    const as = W * 1.6;
    const ox = -(bgT * 3) % as, oy = -(bgT * 2) % as;
    ctx.globalAlpha = 0.5;
    ctx.drawImage(auraSprite, ox, oy, as, as);
    ctx.drawImage(auraSprite, ox + as, oy, as, as);
    ctx.globalAlpha = 1;
  }

  // --- 第 2 层：星云（lighter 叠加，双图不同速横向滚动）---
  const neb = NEBULA_CACHE[zoneIndexForWave(state.wave)];
  if (neb) {
    const nw = W * 1.4;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = zone.nebA * quality;
    const ox1 = -(bgT * 4) % nw;
    ctx.drawImage(neb, ox1, -H * 0.1, nw, H * 1.2);
    ctx.drawImage(neb, ox1 + nw, -H * 0.1, nw, H * 1.2);

  }

  // --- 第 4 层：天体锚点（行星），放在星场之前，确立景深 ---
  if (planet) {
    const px = planet.x + (player.x - W / 2) * -planet.depth * 0.4;
    const py = planet.y + bgT * 1.5;
    ctx.globalAlpha = 0.85;
    ctx.drawImage(planet.sprite, Math.round(px - planet.r), Math.round(py - planet.r));
    ctx.globalAlpha = 1;
  }

  // --- 第 3 层：5 层视差星场 ---
  // 速度感来源：纵向恒定下落 + 横向随玩家移动产生视差偏移
  const parX = (player.x - W / 2);
  const stretch = ultActive > 0;   // 超载时星星拉成线，经典超光速视觉语言
  let lastC = '';
  for (const s of stars) {
    if (s.c !== lastC) { ctx.fillStyle = s.c; lastC = s.c; }
    const x = s.x - parX * s.px * 0.35;

    if (stretch) ctx.fillRect(xi | 0, s.y | 0, s.s, s.s * 4);
    else ctx.fillRect(xi | 0, s.y | 0, s.s, s.s);

    g.addColorStop(0, hexA(d.c, 0)); g.addColorStop(0.5, d.c); g.addColorStop(1, hexA(d.c, 0));
