    for (let k = 0; k < 6; k++) {
      const a = (Math.PI / 3) * k + e.ph;
      ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 95, vy: Math.sin(a) * 95 });
    }
  } else {
    for (let k = 0; k < 3; k++) ebullets.push({ x: e.x, y: e.y + k * 6, vx: 0, vy: 130 });
  }
  Audio.play(220, 0.06, 'square', 0.016, 160);
}

function spawnEnemy(type) {
  const d = ENEMY_DEFS[type];
  const x = 16 + Math.random() * (W - 32);
  /* [v1.7m] 精英怪：现有型的强化变体（不新画精灵 —— 用"底光 + 虚线外环"
     标识，与重绘语言统一；命中矩形不变）。
     出现：wave>=4 起线性起概率，12 波封顶 18% —— 前期零出现保新手期；
     自爆机（type 5）不参与 —— 它的价值在"引信博弈"，血量翻三倍会把
     博弈变成"打不动只能躲"，与设计意图相反。
     强化：hp×3（含波次加成后再乘）、分数×3、开火间隔×0.7（射速+43%）、
     掉落必 1 芯片 + 道具概率翻倍 —— "这只能打"必须物有所值。 */
  const elite = type !== 5 &&
    state.wave >= 4 && Math.random() < Math.min(0.18, 0.02 * (state.wave - 3));
  /* [v1.7o] 波次成长提速（用户："改成每回合加一滴血量"）：
     2.5 波 +1 → 每波 +1（自第 2 波起，wave-1）。
     type>=2 的分界保持 —— 杂兵/飞碟刻意不成长（"数量多威胁小"的
     定位，养肥会毁掉前期节奏），成长面不在本次指令范围内。
     maxhp 字段仍存基础值 d.hp：killFx 的光环判定依赖"天生基础血"，
     不能跟着波次膨胀。 */
  const baseHp = d.hp + (type >= 2 ? (state.wave - 1) : 0);
  enemies.push({
    id: enemyIdCounter++, type, x, bx: x, y: -12, w: d.w, h: d.h,
    hp: elite ? baseHp * 3 : baseHp, maxhp: elite ? baseHp * 3 : d.hp,
    vy: d.vy + state.wave * 2.0 + Math.random() * 8,
    score: elite ? d.score * 3 : d.score, color: d.color,
    sprite: d.sprite, white: d.white, t: 0, ph: Math.random() * Math.PI * 2,
    flash: 0, fire: 1.0 + Math.random() * 1.5,
    elite: elite || undefined
  });
  if (elite) enemies[enemies.length - 1].fire *= 0.7;
}

// 难度曲线：基础小怪权重随波次衰减，高级怪逐步接管，
// 避免打到十几波还是满屏 1 血小怪、难度曲线走平
function pickEnemyType(wave) {
  /* 长度从 ENEMY_DEFS 派生，不写死 6。
     原本数组初始化、total 累加、抽样循环三处各自硬编码 6，
     而 ENEMY_DEFS 恰好也是 6 条 —— 现在能跑纯属巧合。
     加第 7 种怪时这三处不会跟着长，新怪权重永远是 0、永远刷不出来，
     而且不报错不崩溃，只会表现为"新怪从来没出现过"，极难定位。
     ⚠️ 每个下标仍是按 type 逐个赋值的：新增敌人类型必须在这里补一行权重，
     否则它权重为 0（能靠本函数安全忽略，但等于白加）。 */
  const w = new Array(ENEMY_DEFS.length).fill(0);
  w[0] = Math.max(10, 46 - wave * 3.5);
  if (wave >= 2) w[1] = 18 + Math.min(16, wave * 1.2);
  if (wave >= 2) w[2] = 14 + Math.min(22, wave * 1.6);
  if (wave >= 3) w[3] = 12 + Math.min(16, wave * 1.1);
  if (wave >= 4) w[4] = 10 + Math.min(24, wave * 1.8);
  if (wave >= 3) w[5] = 10 + Math.min(14, wave * 0.9);
  let total = 0;
  for (let i = 0; i < w.length; i++) total += w[i];
  let x = Math.random() * total;
  for (let i = 0; i < w.length; i++) if ((x -= w[i]) < 0) return i;
  return 0;
}

function randomPowerupType() {
  const r = Math.random();
  let t;
  /* 概率分配（合计 100%）：即时增益 65% / 入栏道具 35%。
     五个道具槽各 7% —— 均分而不是给某几个更高权重，
     因为它们的价值都取决于"什么时候用"，没有谁天然更值得掉。
     ⚠️ 新增道具必须同时改这里 + applyPowerup 的 switch + ITEM_SLOTS，
     三处缺一就会掉出来却捡不到（collect/barrier 就漏过一次）。 */
  if (r < 0.15) t = 'power'; else if (r < 0.27) t = 'heal'; else if (r < 0.38) t = 'shield';
  else if (r < 0.45) t = 'bomb'; else if (r < 0.52) t = 'slow'; else if (r < 0.59) t = 'repair';
  else if (r < 0.66) t = 'collect'; else if (r < 0.73) t = 'barrier';
  else if (r < 0.83) t = 'spread'; else if (r < 0.91) t = 'magnet'; else t = 'drone';
  // 满血时不让血包浪费（溢出只转 3 秒盾，收益太低），改为掉落即时战力道具
  if (t === 'heal' && state.hp >= state.maxHp) t = Math.random() < 0.5 ? 'shield' : 'spread';
  if (t === 'drone' && drones.length >= MAX_DRONES) t = 'power';
  return t;
}

/* ==================================================================
   波次 & Boss
   ================================================================== */
function startWave(n) {
  state.wave = n; waveClock = 0; waveQueue = []; state.waveDelay = 2.2;
  if (n % 5 === 0) { state.waveDelay = 3.6; spawnBoss(n); waveTotal = 0; return; }
  /* 敌人数：线性（5+n×3）→ 对数（5 + n^0.72 × 3）。
     原公式下第 10 波 35 个、第 20 波 65 个、第 30 波 95 个，
     而玩家输出上限几乎不变（伤害卡封顶 +10%）——
     到 15 波后屏幕密度必然超出清场能力，不是技术问题而是数值决定的。
     对数增长后：第 10 波 20 个、第 20 波 30 个、第 30 波 39 个，
     增长放缓但总量仍在爬升，配合成长树正好对冲。 */
  const count = 5 + Math.floor(Math.pow(n, 0.72) * 3);
  waveTotal = count;
  /* 芯片保底：第 2 波起每波开局直接给 1 枚。
     纯 20% 概率下，连续十几个怪不掉是完全可能的（约 1.1% 概率整波 0 枚），
     那种"打完一波什么都没有"的挫败感远大于概率本身的收益。 */
  if (n >= 2) { addChips(1); }
  const gap = Math.max(0.14, 0.55 - n * 0.032);
  for (let i = 0; i < count; i++) waveQueue.push({ t: i * gap, type: pickEnemyType(n) });
  if (n % 5 === 0) planet = null;
  if (n >= 2 && !planet && Math.random() < 0.55) spawnPlanet(n);
  banner.text = '第 ' + n + ' 波'; banner.sub = n === 1 ? '准备迎战' : (STAR_ZONES[zoneIndexForWave(n)].name); banner.t = 1.8; banner.color = 'ult';
  /* 跨地带时提示环境效果：让玩家知道"接下来这片区域的规则变了"。
     副文案写明"离开本地带失效" —— 否则玩家会以为这是永久 debuff 而放弃，
     实际上熬过这 5 波就恢复了。 */
  const zi = zoneIndexForWave(n);
  if (zi !== lastZoneIdx) {
    lastZoneIdx = zi;
    const hz = STAR_ZONES[zi].hazard;
    if (hz) pushToast('环境 · ' + hz.name, hz.desc + ' · 离开本地带失效', hz.color);
  }
  // 第 3 波起 20% 概率触发随机事件（放在波次开始，让玩家提前知道这波的变数）
  if (n >= 3 && Math.random() < 0.20) triggerEvent();
  if (n === 10) checkAchievement('wave_10');
  Audio.play(520, 0.09, 'square', 0.03, 780);
  setTimeout(() => Audio.play(700, 0.12, 'square', 0.03, 980), 110);
}

function spawnBoss(wave) {
  const typeIndex = Math.floor((wave - 1) / 5) % BOSS_TYPES.length;
  const type = BOSS_TYPES[typeIndex];
  const spr = BOSS_SPRITES[typeIndex];
  /* Boss 血量系数 42 → 35（修改清单第 6 条的真实结论）。
     ⚠️ 原报告第 6 条写的是"给 Boss 加减伤 40%，防止散射 DPS 爆表秒 Boss"——
     实测把这条的**前提推翻了**：火力上限是 4 不是 10，散射满级 Boss TTK
     在第 30 波是 35.2 秒，一点都不快。此时加 40% 减伤会把它推到 59 秒，
     是帮倒忙。所以**不加减伤**，改为按报告批准的目标（第 30 波 ≤30 秒）
     反推血量系数：
       散射满级 DPS = 6 弹 × 1 伤 × dmgOf(1.2) / cool 0.11 ≈ 65.5
       目标 30 秒 → HP ≈ 1965 → (180 + 30c) × 1.6 = 1965 → c ≈ 35
     ⚠️ 这个系数只把"中位武器"压到目标线，**没有**动武器间的差距：
     电弧/脉冲仍然是 65~78 秒量级。那是设计意图（它们是清屏武器，
     打 Boss 本就该换武器），不是 bug —— 见 power_dead_level_test 的 TTK 表。 */
  const hp = Math.round((180 + wave * 35) * type.hpMul);
  boss = {
    typeIndex, x: W / 2, y: -40, w: type.w, h: type.h, hp, maxhp: hp, vx: 0, vy: 0, t: 0,
    entering: true, targetY: HUD_H + 30, flash: 0, attackTimer: 1.6, atkMul: type.atkMul,
    sprite: spr.sprite, white: spr.white, color: type.color, accent: type.accent, name: type.name
  };
  banner.text = '首领'; banner.sub = type.name; banner.color = type.color; banner.t = 2.4;
  Audio.play(120, 0.6, 'sawtooth', 0.06, 60);
  setTimeout(() => Audio.play(80, 0.8, 'square', 0.05, 40), 200);
}

function bossAttack(b) {
  const hpRatio = b.hp / b.maxhp;
  const extra = hpRatio < 0.4 ? 1 : 0;
  const pat = Math.floor(Math.random() * 3);
  if (pat === 0) {
    const n = Math.round((4 + extra) * b.atkMul);
    const spread = 0.9;
    for (let i = 0; i < n; i++) {
      const a = Math.PI / 2 + (i - (n - 1) / 2) * (spread / n);
      ebullets.push({ x: b.x, y: b.y + b.h / 2, vx: Math.cos(a) * 130, vy: Math.sin(a) * 130, boss: true, color: b.accent });
    }
    Audio.play(180, 0.12, 'square', 0.025, 100);
  } else if (pat === 1) {
    if (player.alive) {
      const dx = player.x - b.x, dy = player.y - (b.y + b.h / 2);
      const base = Math.atan2(dy, dx);
      const n = Math.round((3 + extra) * b.atkMul);
      for (let i = 0; i < n; i++) {
        const a = base + (i - (n - 1) / 2) * 0.2;
        ebullets.push({ x: b.x, y: b.y + b.h / 2, vx: Math.cos(a) * 190, vy: Math.sin(a) * 190, boss: true, color: b.accent });
      }
      Audio.play(250, 0.08, 'square', 0.02, 160);
    }
  } else {
    const n = Math.round((6 + extra * 2) * b.atkMul);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + b.t * 2.2;
      ebullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * 105, vy: Math.sin(a) * 105, boss: true, color: b.accent });
    }
    Audio.play(300, 0.1, 'triangle', 0.02, 150);
  }
}

function updateBoss(rawDt) {
  const dt = enemyDt(rawDt);   // Boss 与敌弹同步减速
  if (!boss) return; const b = boss; b.t += dt; if (b.flash > 0) b.flash -= dt;
  const MIN_X = 26, MAX_X = W - 26, MIN_Y = HUD_H + 20, MAX_Y = H - WB_H - 14;
  if (b.entering) {
    b.y += 58 * dt;
    if (b.y >= b.targetY) {
      b.y = b.targetY; b.entering = false;
      b.vx = (Math.random() < 0.5 ? -1 : 1) * (42 + Math.random() * 24);
      b.vy = (Math.random() < 0.5 ? -1 : 1) * (26 + Math.random() * 20);
    }
    return;
  }
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  if (b.x < MIN_X) { b.x = MIN_X; b.vx = Math.abs(b.vx); }
  if (b.x > MAX_X) { b.x = MAX_X; b.vx = -Math.abs(b.vx); }
  if (b.y < MIN_Y) { b.y = MIN_Y; b.vy = Math.abs(b.vy); }
  if (b.y > MAX_Y) { b.y = MAX_Y; b.vy = -Math.abs(b.vy); }
  if (Math.random() < dt * 0.5) {
    b.vx += (Math.random() - 0.5) * 60;
    b.vy += (Math.random() - 0.5) * 50;
    if (Math.abs(b.vx) < 30) b.vx = Math.sign(b.vx || 1) * 30;
    if (Math.abs(b.vx) > 90) b.vx = Math.sign(b.vx) * 90;
    if (Math.abs(b.vy) < 18) b.vy = Math.sign(b.vy || 1) * 18;
    if (Math.abs(b.vy) > 60) b.vy = Math.sign(b.vy) * 60;
  }
  if (!b.entering && particles.length < particleCap() && Math.random() < dt * 2.5) {
    spawnParticle({
      x: b.x + (Math.random() - 0.5) * b.w,
      y: b.y + (Math.random() - 0.5) * b.h,
      vx: (Math.random() - 0.5) * 16,
      vy: (Math.random() - 0.5) * 16,
      life: 0.3 + Math.random() * 0.2, max: 0.5,
      color: b.accent, size: 2, glow: true
    });
  }
  b.attackTimer -= dt;
  if (b.attackTimer <= 0) {
    addShockwave(b.x, b.y, b.accent, 6, 70);
    bossAttack(b);
    const base = Math.max(0.6, 1.3 - state.wave * 0.03);
    b.attackTimer = base / b.atkMul;
  }
}

/* 内爆：从四周向中心塌缩的粒子，表现"能量被抽走"。
   首领死亡要先向内塌陷 0.2s 再爆开 —— 直接炸开是"碎了"，
   先塌陷再炸开才是"被抽干后崩解"，仪式感完全不同。 */
function addImplosion(x, y, color, count = 14) {
  const cap = particleCap();
  for (let i = 0; i < count && particles.length < cap; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 34 + Math.random() * 30;      // 从远处出发
    const sp = 90 + Math.random() * 60;     // 朝中心飞（速度反向）
    spawnParticle({
      x: x + Math.cos(a) * r, y: y + Math.sin(a) * r,
      px: x + Math.cos(a) * r, py: y + Math.sin(a) * r,
      vx: -Math.cos(a) * sp, vy: -Math.sin(a) * sp,
      life: 0.2, max: 0.2, color, size: 1, glow: true
    });
  }
  addShockwave(x, y, color, 20, 30);        // 一道快速内收的细环
}

function killBoss() {
  if (!boss) return;
  /* Boss 必掉芯片：Boss 是一场硬仗的固定奖励，
     不给随机 —— 打完 Boss 什么都拿不到会让人怀疑值不值。 */
  addChips(CHIP_BOSS_DROP); const bx = boss.x, by = boss.y, bColor = boss.color, bAccent = boss.accent; boss = null;
  /* 首领死亡仪式：塌陷 0.2s → 爆开。
     时间缓动让这一下"被看见"：0.3s 内全局 0.4 倍速，配合塌陷与爆开。 */
  addImplosion(bx, by, bColor, 16);
  addImplosion(bx, by, MD3.matHot, 6);
  slowmo = 0.3;
  for (let i = 0; i < 7; i++) {
    scheduleAfter((i * 85 + 200) / 1000, () => {
      if (state.mode !== MODE_PLAY) return;
      const ox = bx + (Math.random() - 0.5) * 34, oy = by + (Math.random() - 0.5) * 26;
      explode(ox, oy, MD3.matEmber, 18, 145); explode(ox, oy, MD3.matHot, 8, 90);
      state.shake = Math.max(state.shake, 8);
    });      // +200ms：等塌陷演完再开始爆
  }
  const bonus = 300 + state.wave * 50;
  state.score += bonus;
  state.coins += 35 + state.wave * 3;
  state.shake = 6;    // 塌陷阶段只轻微震动，主爆的强震延后到 +200ms
  for (const b of ebullets) explode(b.x, b.y, bAccent, 3, 40);
  ebullets.length = 0;
  const drops = ['power', 'medkitBig', 'heal', 'drone'];
  if (drones.length >= MAX_DRONES) drops[3] = 'spread';
  for (let i = 0; i < 4; i++) powerups.push({ x: bx + (i - 1.5) * 22, y: by, vy: 58, t: 0, type: drops[i] });
  banner.text = '首领击破'; banner.sub = '+' + bonus; banner.color = 'coin'; banner.t = 2.4;
  checkAchievement('boss_1');
  Audio.play(90, 0.9, 'sawtooth', 0.07, 30);
  scheduleAfter(0.15, () => Audio.play(140, 0.5, 'square', 0.05, 40));
  scheduleAfter(0.32, () => Audio.play(200, 0.4, 'triangle', 0.04, 60));
  /* 主爆延后到 +200ms：塌陷演完才炸开。
     之前主爆是**立即**执行的，和塌陷同帧发生 —— 于是"先塌陷再爆开"
     这个仪式根本没演出来，玩家只看到一团东西同时出现。 */
  scheduleAfter(0.2, () => {
    if (state.mode !== MODE_PLAY) return;
    explode(bx, by, bColor, 22, 130);
    addNova(bx, by, bColor, 9, 44);
    addChroma(0.5);
    state.shake = Math.max(state.shake, 16);
    flashScreen = 0.45; flashColor = 'coin';
  });
}

/* ==================================================================
   成就 / 爆炸 / 飘字
   ================================================================== */
function checkAchievement(id) {
  if (achievements[id]) return;
  /* [hotfix C3] 走 safeSet：解锁瞬间抛错会中断整个解锁流程
     （成就标记已经在内存里置了，但写不进存档 = 下次打开又没有了）。 */
  achievements[id] = true; safeSet('pixelraider_ach', JSON.stringify(achievements));
  const ach = ACHIEVEMENTS.find(a => a.id === id);
  if (ach) { achPopup.text = ach.name; achPopup.t = 2.5; Audio.play(800, 0.15, 'triangle', 0.04, 1400); }
}
// 倒序遍历时使用：把末位元素搬到 i 再 pop，O(1) 删除，避免 splice 的整体搬移
function swapRemove(arr, i) {
  const last = arr.length - 1;
  if (i !== last) arr[i] = arr[last];
  arr.pop();
}
/* 爆炸分三档，越大的爆炸层次越多：
     小 (<8)   仅粒子
     中 (8-15) 粒子 + 闪核 + 单环 + 少量碎片
     大 (>=16) 粒子 + 闪核 + 双环(副环延迟) + 余烬 + 更多碎片
   这样小击杀不会满屏特效糊视线，Boss 死亡才给足仪式感。 */
/* ==================================================================
   结构化爆炸层
   ==================================================================
   旧的爆炸只有一个形态：随机方向撒一把粒子 + 一圈光。
   小怪死亡和 Boss 死亡看起来只是"大一点"，没有层级 ——
   玩家无法从特效判断"这一下打中了什么级别的东西"。

   现在按规模分三级，每级**结构不同**（不只是半径不同）：
     L1 小爆：中心闪白 → 少量碎片          普通子弹命中
     L2 中爆：外扩环 + 碎片 + 中心光晕收缩   导弹/炸弹命中
     L3 大爆：三层环 + 碎片雨 + 地面残留光    Boss 死亡 / 清屏

   环用 stroke arc、光晕用径向渐变、残留用半透明圆点 ——
   三种绘制方式混用才撑得起"层级感"，全用圆点会糊成一团。 */
const blasts = [];
const BLAST_CAP = 18;          // 同屏结构化层数上限，防止连锁爆炸拖垮帧率

/* [v1.7h] 像素特效四助手（pxLine/pxDiamond/pxGlow/pxCross）退役：
   特效按用户拍板改回全量 MD3 矢量形制后零消费。它们是像素形制的
   全部词汇，撤销形制即撤销词汇 —— 删除定义不留死代码。
   历史 changelog 中的提及保留为记录。 */
function blastLevel(count) { return count >= 16 ? 3 : (count >= 8 ? 2 : 1); }

function addBlast(x, y, color, level) {
  if (blasts.length >= BLAST_CAP) blasts.shift();
  /* 四条层共用同一份派生色：在入口收一次，而不是每条 push 各包一遍。 */
  color = mdSeed(color);

  if (level >= 1) {
    // 中心闪白：爆炸的"第一帧"必须是最亮的一下，否则没有打击感
    blasts.push({ type: 'glow', x, y, color: MD3.matHot, r: 3, r0: 3, r1: level >= 3 ? 26 : 14,
      life: 0.09, max: 0.09, alpha: 0.9 });
  }
  if (level >= 2) {
    // 外扩环：慢而大，定义爆炸的"范围"
    blasts.push({ type: 'ring', x, y, color, r: 2, r0: 2, r1: level >= 3 ? 46 : 24,
      life: 0.34, max: 0.34, alpha: 0.55, lw: 2 });
    // 中心光晕收缩：与外扩环反向运动，形成"炸开又收回"的层次
    blasts.push({ type: 'glow', x, y, color, r: level >= 3 ? 22 : 12, r0: level >= 3 ? 22 : 12,
      r1: 1, life: 0.22, max: 0.22, alpha: 0.5, shrink: true });
  }
  if (level >= 3) {
    // 三层环：最外层慢、最内层快 —— 三层速度不同才像"冲击波"而不是三个同心圆
    blasts.push({ type: 'ring', x, y, color: MD3.matHot, r: 4, r0: 4, r1: 62, life: 0.5, max: 0.5, alpha: 0.4, lw: 1.5 });
    blasts.push({ type: 'ring', x, y, color, r: 2, r0: 2, r1: 34, life: 0.28, max: 0.28, alpha: 0.6, lw: 2.5 });
    // 地面残留光：爆炸后原地留几团慢慢上浮的余烬，给"这里刚炸过"的记忆
    for (let i = 0; i < 4; i++) {
      blasts.push({ type: 'ground', x: x + (Math.random() - 0.5) * 22, y: y + (Math.random() - 0.5) * 14,
        color, r: 2 + Math.random() * 2, r0: 3, r1: 1, life: 0.5 + Math.random() * 0.4,
        max: 0.9, alpha: 0.5, vy: -12 - Math.random() * 10 });
    }
  }
}

function updateBlasts(dt) {
  for (let i = blasts.length - 1; i >= 0; i--) {
    const b = blasts[i];
    b.life -= dt;
    if (b.life <= 0) { blasts.splice(i, 1); continue; }
    const k = 1 - b.life / b.max;
    // 环/光晕：半径插值（shrink 的反向）
    b.r = b.r0 + (b.r1 - b.r0) * k;
    if (b.type === 'ground' && b.vy) b.y += b.vy * dt;
  }
}

/* 爆炸光晕的离散色阶（由外向内：半径系数 / 浓度）。与 TRAIL_STEPS 同一条规矩：
   先画大的淡的、再叠小的浓的，顺序反了浓的会被盖住变灰。 */
const BLAST_GLOW_STEPS = [[1, 0.10], [0.62, 0.22], [0.30, 0.45]];
function drawBlasts() {
  /* [v1.7h] 全量 MD3 矢量形制（用户拍板）：环=stroke 圆、光晕=三档同心圆
     （BLAST_GLOW_STEPS 由外向内、先大淡后小浓）、地面残留=圆点。 */
  for (const b of blasts) {
    const k = b.life / b.max;
    const a = b.alpha * (b.type === 'ground' ? k : (1 - k * 0.55));
    if (a <= 0.01) continue;
    ctx.save();
    if (b.type === 'ring') {
      ctx.globalAlpha = a;
      ctx.strokeStyle = b.color; ctx.lineWidth = b.lw || 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    } else if (b.type === 'glow') {
      const rr = Math.max(1, b.r);
      for (let i = 0; i < BLAST_GLOW_STEPS.length; i++) {
        ctx.globalAlpha = a * BLAST_GLOW_STEPS[i][1];
        ctx.fillStyle = b.color;
        ctx.beginPath(); ctx.arc(b.x, b.y, rr * BLAST_GLOW_STEPS[i][0], 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    } else if (b.type === 'ground') {
      ctx.globalAlpha = a * 0.8;
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

function explode(x, y, color, count = 12, speed = 90) {
  const big = count >= 16, mid = count >= 8;
  /* 结构化层：按规模生成环/光晕/残留。
     粒子仍保留（碎片需要随机方向的离散感），
     但"层级"由结构化层表达 —— 两者分工，不再靠粒子数量硬堆。 */
  addBlast(x, y, color, blastLevel(count));

  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, sp = speed * (0.25 + Math.random());
    spawnParticle({
      x, y, px: x, py: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.28 + Math.random() * 0.45, max: 0.73,
      color: Math.random() < 0.35 ? MD3.matHot : color, size: Math.random() < 0.28 ? 2 : 1,
      glow: true
    });
  }

  if (mid) {
    addFlash(x, y, color, big ? 12 : 7);
    addShockwave(x, y, color, count, speed);
    if (big) {
      // 副环：延迟出发、更快更细，形成"双层冲击"的层次
      addShockwave(x, y, MD3.matHot, count * 0.6, speed * 1.35, 0.06);
      addEmbers(x, y, color, Math.min(8, Math.round(count * 0.35)));
      // 新星光条 + 整屏色差：大爆炸的"重击感"来源
      addNova(x, y, color, 9, 26 + Math.min(30, count * 0.9));
      addChroma(0.35 + Math.min(0.3, count * 0.012));
    }
  }
  const pCap = particleCap();
  if (particles.length > pCap) particles.splice(0, particles.length - pCap);

  // 逐个检查 + 收尾裁剪：批量生成时只在开头判一次会撑破上限
  const dCap = debrisCap();
  const debrisCount = Math.min(count, big ? 12 : 8);
  for (let i = 0; i < debrisCount && debris.length < dCap; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = speed * (0.3 + Math.random() * 0.8);
    debris.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.5 + Math.random() * 0.5, max: 1.0,
      color: Math.random() < 0.3 ? MD3.matHot : mdSeed(color),
      size: 2 + Math.random() * 3,
      rot: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 10
    });
  }
  if (debris.length > dCap) debris.splice(0, debris.length - dCap);
}
/* 闪核：爆炸瞬间的高亮核心。
   没有它的话爆炸只是"一堆往外飞的点"，缺少"炸开的那一下"的重量感。 */
function addFlash(x, y, color, size) {
  if (flashes.length >= flashCap()) return;
  flashes.push({ x, y, color: mdSeed(color), r: size || 8, life: 0.12, max: 0.12 });
}
/* 新星放射光条：从爆点向外射出的长条光束。
   冲击波是"环"、粒子是"点"、新星是"线" —— 三种形态叠加才有炸裂感，
   只有线能表达"往外炸开"的方向性。仅大爆炸触发，避免糊屏。 */
function addNova(x, y, color, rays = 8, len = 40) {
  /* 同屏限额：nova 是最抢眼的一层，15 波敌机密集时全铺开会糊住视线。
     限额放在这里（而不是调用方）是因为它是 nova 自身的属性 ——
     任何调用点都必须遵守，包括 explode() 内部的 big 分支。 */
  const lim = Math.min(2, novaCap());
  if (novas.length >= lim) return;
  const off = Math.random() * Math.PI;
  novas.push({ x, y, color: mdSeed(color), rays, len, off, life: 0.28, max: 0.28 });
}
function updateNovas(dt) {
  for (let i = novas.length - 1; i >= 0; i--) {
    const n = novas[i]; n.life -= dt;
    if (n.life <= 0) swapRemove(novas, i);
  }
}
function drawNovas() {
  if (!novas.length) return;
  /* [v1.7h] MD3 矢量放射：线芒（长短/宽窄相间）+ 中心白核光晕。 */
  ctx.save();
  ctx.lineCap = 'round';
  for (const n of novas) {
    const p = 1 - n.life / n.max;
    const a = Math.max(0, 1 - p);
    const grow = Math.sin(Math.min(1, p * 1.3) * Math.PI * 0.5);
    const L = n.len * grow;
    ctx.globalAlpha = a * 0.85;
    ctx.strokeStyle = n.color;
    for (let i = 0; i < n.rays; i++) {
      const ang = n.off + (Math.PI * 2 / n.rays) * i;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const l = L * (i % 2 === 0 ? 1 : 0.62);
      ctx.lineWidth = (i % 2 === 0 ? 2.2 : 1.2) * (1 - p * 0.5);
      ctx.beginPath();
      ctx.moveTo(n.x + ca * L * 0.12, n.y + sa * L * 0.12);
      ctx.lineTo(n.x + ca * l, n.y + sa * l);
      ctx.stroke();
    }
    ctx.globalAlpha = a * a;
    const gw = getGlowSprite(MD3.matHot, 'spark'), d = n.len * 0.5 * (1 - p * 0.6);
    ctx.drawImage(gw, n.x - d / 2, n.y - d / 2, d, d);
  }
  ctx.restore();
}

/* 击中火花：子弹命中敌人时的六芒星。
   弹幕游戏里命中反馈必须"脆"，玩家靠这个确认自己打中了。
   六芒星（3 条主轴双向）比原来两条线更像"迸溅"，且带一层微环收束。 */
function addSpark(x, y, color, scale = 1) {
  if (sparks.length >= sparkCap()) return;
  const a = Math.random() * Math.PI;
  const s = SPARK_POOL.pop() || {};
  s.x = x; s.y = y; s.color = mdSeed(color);
  s.len = (6 + Math.random() * 5) * scale; s.ang = a;
  s.life = 0.12; s.max = 0.12;
  sparks.push(s);
}
/* 余烬：爆炸后缓慢飘散的暗色碎光。
   寿命比粒子长 3 倍，让爆炸不是"啪一下就没了"，而是有余味。 */
function addEmbers(x, y, color, count = 4) {
  for (let i = 0; i < count; i++) {
    // 逐个检查：批量生成时只在函数开头判一次会撑破上限
    if (embers.length >= emberCap()) return;
    const a = Math.random() * Math.PI * 2, sp = 12 + Math.random() * 26;
    embers.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 10,
      life: 0.7 + Math.random() * 0.7, max: 1.4,
      color: mdSeed(color), size: 1 + Math.random() * 1.5,
      seed: Math.random() * 6.28
    });
  }
}
function updateFlashes(dt) {
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i]; f.life -= dt;
    if (f.life <= 0) swapRemove(flashes, i);
  }
}
function updateSparks(dt) {
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.life -= dt;
    if (s.life <= 0) {
      if (SPARK_POOL.length < SPARK_POOL_MAX) SPARK_POOL.push(s);
      swapRemove(sparks, i);
    }
  }
}
function updateEmbers(dt) {
  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i]; e.life -= dt;
    if (e.life <= 0) { swapRemove(embers, i); continue; }
    e.x += e.vx * dt; e.y += e.vy * dt;
    e.vx *= 0.97; e.vy *= 0.97; e.vy += 8 * dt;   // 几乎无重力，缓慢飘
  }
}
function drawFlashes() {
  if (!flashes.length) return;
  /* [v1.7h] MD3 矢量闪核：色光晕 + matHot 白核（位图缓存的同心圆分层）。
     色差双环（matWarm/matCool 偏移 arc）保持删除 —— 非 MD3 杂质不回潮。 */
  for (const f of flashes) {
    const p = 1 - f.life / f.max;                  // 0→1
    const a = Math.max(0, 1 - p);                  // 快速衰减
    const d = f.r * (0.5 + p * 1.8);               // 同时膨胀
    ctx.globalAlpha = a * 0.9;
    const gs = getGlowSprite(f.color, 'spark'), dd = d * 2;
    ctx.drawImage(gs, f.x - dd / 2, f.y - dd / 2, dd, dd);
    ctx.globalAlpha = a;
    const gw = getGlowSprite(MD3.matHot), dw = d * 0.9;
    ctx.drawImage(gw, f.x - dw / 2, f.y - dw / 2, dw, dw);
  }
  ctx.globalAlpha = 1;
}
/* [v1.7l] 命中反馈重构（用户："击打敌人特效还没变，重构"）。
   侦察结论：命中反馈的主体从未动过 —— 白闪是硬开关（全白替换 0.09s
   后瞬间跳回），且每发命中走的 explode(count 3) 只是 blast level 1 的
   中心闪白，完全淹没在白闪里 —— 所以形制改了几轮，"打中"看起来都一样。
   重构原则：**打 ≠ 炸** —— 命中是"笃"（环 + 白闪衰减），死亡才是爆炸。
   命中环：0.14s 一次性的小扩张环（2px → 7px，暴击 11px）+ 中心白点，
   比 blast 更小更快更脆 —— 它要说的是"这一下发进了"，不是"这里炸了"。 */
const hitRings = [];
function addHitRing(x, y, color, big) {
  if (hitRings.length >= 24) hitRings.shift();
  hitRings.push({ x, y, color: mdSeed(color), r1: big ? 11 : 7, life: 0.14, max: 0.14 });
}
function updateHitRings(dt) {
  for (let i = hitRings.length - 1; i >= 0; i--) {
    const h = hitRings[i]; h.life -= dt;
    if (h.life <= 0) { swapRemove(hitRings, i); }
  }
}
function drawHitRings() {
  for (const h of hitRings) {
    const k = h.life / h.max;                        // 1 → 0
    const r = 2 + (h.r1 - 2) * (1 - k);
    ctx.globalAlpha = k * 0.9;
    ctx.strokeStyle = h.color; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(h.x, h.y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = k;
    ctx.fillStyle = MD3.matHot;
    ctx.fillRect(Math.round(h.x) - 1, Math.round(h.y) - 1, 2, 2);
  }
  ctx.globalAlpha = 1;
}

function drawSparks() {
  if (!sparks.length) return;
  /* [v1.7h] MD3 矢量迸溅：三主轴双向线芒（不等长，不是雪花）+ 收束微环
     —— 命中反馈仍要"脆"。 */
  ctx.save();
  ctx.lineCap = 'round';
  for (const s of sparks) {
    const a = Math.max(0, s.life / s.max);
    const L = s.len * (0.4 + a * 0.6);             // 收缩
    ctx.globalAlpha = a;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 1.2 + a * 1.2;
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const ang = s.ang + (Math.PI / 3) * i;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const l = L * (i === 0 ? 1 : (i === 1 ? 0.8 : 0.6));
      ctx.moveTo(s.x - ca * l, s.y - sa * l);
      ctx.lineTo(s.x + ca * l, s.y + sa * l);
    }
    ctx.stroke();
    const rr = L * (1 - a) * 0.9 + 1;
    ctx.globalAlpha = a * 0.6;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(s.x, s.y, rr, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}
function drawEmbers() {
  if (!embers.length) return;
  ctx.save();
  for (const e of embers) {
    const a = Math.max(0, e.life / e.max);
    // 余烬不发光，只是暗色余味；加一点点闪烁模拟火星明灭，
    // 后期渐隐到几乎透明（用 e.seed 让每颗闪的相位不同，避免同步闪烁）
    const tw = 0.72 + Math.sin(state.time * 9 + e.seed) * 0.28;
    ctx.globalAlpha = a * a * 0.55 * tw;
    ctx.fillStyle = e.color;
    const s = Math.max(1, Math.round(e.size));
    ctx.fillRect(Math.round(e.x), Math.round(e.y), s, s);
  }
  ctx.restore();
}

// kind: 'score' 普通得分 / 'crit' 暴击 / 'kill' 击杀
function addFloatText(x, y, text, color, scale = 1, kind = 'score') {
  if (floatTexts.length > 40) floatTexts.shift();
  floatTexts.push({ x, y, text: String(text), color, scale, kind, life: 0.6, max: 0.6, vy: -42 });
}
// delay：延迟出发（副环用）；椭圆略扁模拟透视，比正圆更有空间感
function addShockwave(x, y, color, power = 1, speed = 90, delay = 0) {
  if (shockwaves.length > 40) return;
  shockwaves.push({
    x, y, color: mdSeed(color), r: 3, delay: delay || 0,
    maxR: 14 + Math.min(44, power * 0.5 + speed * 0.08),
    life: 0.35 + (delay || 0), max: 0.35 + (delay || 0),
    spin: Math.random() * Math.PI * 2
  });
}
function updateShockwaves(dt) {
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const s = shockwaves[i]; s.life -= dt;
    if (s.life <= 0) { swapRemove(shockwaves, i); continue; }
    const p = 1 - Math.max(0, s.life - s.delay) / s.max;
    s.r = s.maxR * (1 - Math.pow(1 - Math.max(0, p), 3));
  }
}
function drawShockwaves() {
  /* [v1.7h] MD3 矢量冲击波：ellipse 主环（透视压扁保留）+ 内沿亮边 + 中心淡填充。
     辐条 + 自转保持删除 —— 装饰性旋转不是 MD3 的语言。 */
  ctx.save();
  for (const s of shockwaves) {
    if (s.life - s.delay <= 0) continue;             // 延迟未到，不画
    const a = Math.max(0, (s.life - s.delay) / s.max) * 0.8;
    const rx = Math.round(s.r), ry = Math.round(s.r * 0.82);
    if (rx <= 0) continue;
    ctx.globalAlpha = a;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2 + a * 2;
    ctx.beginPath(); ctx.ellipse(Math.round(s.x), Math.round(s.y), rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = a * 0.5;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(Math.round(s.x), Math.round(s.y), Math.max(1, rx - 1), Math.max(1, ry - 1), 0, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = Math.max(0, a * 0.25);
    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.ellipse(Math.round(s.x), Math.round(s.y), Math.max(1, Math.round(s.r * 0.85)), Math.max(1, Math.round(s.r * 0.85 * 0.82)), 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

/* ==================================================================
   射击
   ================================================================== */
function shoot() {
  runShots++;          // 命中率分母：发射一发计数一次（散射按实际弹丸数更准，见下）
  if (player.cool > 0) return;
  const w = WEAPONS[player.weapon];
  /* 攻速：冷却除以倍率（倍率越大 → 冷却越短 → 射得越快）。
     状态倍率（狂热 1.3 / 迟滞 0.75）与成长树加成叠乘，互不覆盖。 */
  player.cool = w.cool / (rateMul() * rateUpgMul());
  const x = player.x, y = player.y - 5, lv = player.power;
  /* ⚠️ 火力死等级（修改清单第 23 条的真实形态）：
     报告写"Lv4 = 7 发是负收益"是按幻影代码说的，代码里没有 baseDmg 表。
     真实问题是 **lv→效果的映射在某些等级上不单调**，买了火力卡却毫无变化：
       散射 3+min(2,lv-1) → 5,5（lv4 死）
       导弹 1+min(1,⌊(lv-1)/2⌋) → 1,1 / 2,2（lv2、lv4 死）
       电弧 1+⌊lv/2⌋ → 2,2（lv3 死）
       回旋 完全不看 lv —— **四次火力提升全死**
     这类 bug 不报错不崩溃，玩家只会觉得"这把武器怎么升都不变强"。
     修法是让每条映射在 lv1~4 上**逐級变化**（不要求等量，要求每级都有反馈）。 */
  if (particles.length < particleCap()) {
    for (let i = 0; i < 2; i++) {
      spawnParticle({
        x: x + (Math.random() - 0.5) * 3, y: y - 2,
        vx: (Math.random() - 0.5) * 26, vy: -36 - Math.random() * 42,
        life: 0.1 + Math.random() * 0.12, max: 0.22,
        color: w.color, size: 2, glow: true
      });
    }
  }
  /* 枪口闪光放在武器分支**之前**统一触发：六种武器都需要，
     写进各自 case 会重复六遍且容易漏。位置在机头 ——
     与子弹出生点同一处，视觉上才对得上"从这里打出去"。 */
  if (quality >= 0.5) spawnMuzzle(x, y - 2, w.color, 1);

  switch (player.weapon) {
    case 0: {
      const crit = Math.random() < critRate(0.15);
      const push = (dx, dy) => bullets.push({ x: x + dx, y: y + dy, vx: 0, vy: -355, dmg: 1, crit, wc: w.color });
      if (lv === 1) push(0, 0); else if (lv === 2) { push(-3, 0); push(3, 0); }
      else if (lv === 3) { push(0, -3); push(-4, 1); push(4, 1); }
      else { push(-4, -1); push(-1.5, -3); push(1.5, -3); push(4, -1); }
      Audio.play(760 + lv * 40, 0.045, 'square', 0.018, 420, 'player'); break;
    }
    case 1:
      /* ⚠️ 激光此前是**唯一零成长的武器**：dmg 写死 6，lv 完全没参与，
         升满火力等级（4 级）后伤害与 lv1 一模一样 —— 花 30 金币升火力，
         用激光时毫无变化。其余五把都有成长：脉冲/散射/导弹/电弧靠 lv，
         回旋靠 boomCount（独立卡，1→5）。
         补上线性成长 6 + (lv-1)×2：lv1=6 / lv2=8 / lv3=10 / lv4=12。
         刻意不给弹数成长 —— 激光是穿透单体，加弹数会变成清屏武器，
         与散射定位重复；只抬伤害才守住"单体高伤"这条线。 */
      bullets.push({ x, y, vx: 0, vy: -430, dmg: 6 + (lv - 1) * 2, pierce: true, laser: true, wc: w.color, hitIds: new Set(), crit: Math.random() < critRate(0.20) });
      Audio.play(320, 0.08, 'sawtooth', 0.025, 180, 'player'); break;
    case 2: {
      /* 弹匣扩容（成长树 mag）叠加在等级弹数之上。
         ⚠️ 与"火力提升卡"的 lv 成长是**两条独立通道**，不能合并：
         lv 是局内商店买的（上限 4），mag 是局外芯片点的（上限 10 级），
         合并后玩家分不清自己变强来自哪一条线，也不好各自调平衡。
      ⚠️ 扇形**总跨度固定**为 SPREAD_ARC，而不是按弹数乘固定角步长：
      原来每发 0.25rad，弹数一多扇形就张到 150 度以上，两侧子弹直接飞出屏幕 ——
      加了弹数却打不到东西，是最容易误判为"没生效"的一类 bug。
      固定跨度后，弹数增加表现为**弧线更密**（命中更稳），而非覆盖更宽。 */
      const crit = Math.random() < critRate(0.22);
      /* 2+lv：lv1=3 与原来持平，lv2=4 / lv3=5 / lv4=6 逐级递增。
         原来的 3+min(2,lv-1) 在 lv3、lv4 都是 5 —— 买满火力最后一级没反应。 */
      const n = Math.min(12, 2 + lv + magUpgExtra());
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (n <= 1 ? 0 : (i / (n - 1) - 0.5) * SPREAD_ARC);
        bullets.push({ x, y, vx: Math.cos(a) * 300, vy: Math.sin(a) * 300, dmg: 1, crit, scatter: true, wc: WPN_SPREAD_COLOR });
      }
      Audio.play(500, 0.04, 'square', 0.014, 300, 'player'); break;
    }
    case 3: {
      /* n = lv：1→2→3→4 逐级递增。原来 lv2 与 lv1 同为 1、lv4 与 lv3 同为 2，
         两次升级打水漂。追踪弹本身有 life 2.6 且速度慢，4 发不会失控。 */
      const n = lv;
      for (let i = 0; i < n; i++) {
        const off = n === 1 ? 0 : (i - 0.5) * 10;
        bullets.push({ x: x + off, y, vx: off * 3, vy: -150, dmg: 5, homing: true, wc: w.color, target: null, life: 2.6, crit: false });
      }
      Audio.play(300, 0.1, 'triangle', 0.026, 520, 'player'); break;
    }
    /* 跳跃数 = lv：1→2→3→4 逐级递增（原来 lv2/lv3 同为 2）。
       电弧每次跳跃伤害递减 0.6，多一跳的边际收益本来就小，加满也不会失控。 */
    case 4: fireArc(x, y, lv, 2); Audio.play(880, 0.06, 'sawtooth', 0.03, 400, 'player'); break;
    case 5: {
      for (let i = 0; i < player.boomCount; i++) {
        const crit = Math.random() < critRate(0.18);
        const off = player.boomCount === 1 ? 0 : (i - (player.boomCount - 1) / 2) * 8;
        /* 回旋镖此前**完全不看 lv** —— 火力提升四次买满，用回旋时伤害恒为 5，
           等于这张卡对回旋无效。补 5+(lv-1)：5→6→7→8，与激光同级处理。
           幅度刻意取 +1/级（激光是 +2）：回旋靠 boomCount 叠数量，
           再抬单发会双重放大。 */
        bullets.push({ x: x + off, y, vx: off * 2, vy: -320, dmg: 5 + (lv - 1), boomerang: true, wc: w.color, t: 0, phase: 'out', hitIds: new Set(), crit });
      }
      Audio.play(420, 0.12, 'triangle', 0.03, 720, 'player'); break;
    }
  }
  // 散射道具：额外发射两发偏角弹（独立于当前武器）
  if (player.spread > 0) {
    for (const a of [-0.24, 0.24]) {
      bullets.push({
        x, y,
        vx: Math.sin(a) * 300,
        vy: -Math.cos(a) * 300,
        dmg: 1, crit: false, spreadShot: true, wc: WPN_SPREAD_COLOR
      });
    }
  }
}

function fireArc(sx, sy, maxJumps, baseDmg) {
  const hit = new Set(); let cx = sx, cy = sy; const pts = [{ x: cx, y: cy }];
  /* 电弧不走子弹，直接扣血，所以是独立于 checkCollisions 的第三条结算路径。
     倍率必须在这里也接一次，否则电弧武器永远吃不到伤害卡和技能树攻击。 */
  let dmg = dmgOf(baseDmg);
  for (let j = 0; j <= maxJumps; j++) {
    let best = null, bd = Infinity;
    for (const e of enemies) {
      if (hit.has(e.id)) continue;
      const d = (e.x - cx) ** 2 + (e.y - cy) ** 2;
      if (d < bd) { bd = d; best = e; }
    }
    let isBoss = false;
    if (boss && !boss.entering && !hit.has('boss')) {
      const d = (boss.x - cx) ** 2 + (boss.y - cy) ** 2;
      if (d < bd) { bd = d; best = boss; isBoss = true; }
    }
    if (!best || bd > 130 * 130) break;
    hit.add(isBoss ? 'boss' : best.id); pts.push({ x: best.x, y: best.y - 2 }); cx = best.x; cy = best.y;
    if (isBoss) {
      boss.hp -= dmg; boss.flash = 0.1; explode(best.x, best.y, WPN_ARC_COLOR, 5, 70);
    // 二阶段：血量首次过半时触发一次闪烁（boss.phase2 标记只做一次）
    if (!boss.phase2 && boss.hp <= boss.maxhp * 0.5) { boss.phase2 = true; boss.phaseFlash = 0.3; }
      if (boss.hp <= 0) { killBoss(); break; }
    } else {
      /* 电弧不走子弹，必须**单独**接护盾减伤（接线遗漏重灾区：
         只接子弹就会出现"子弹打护盾有减伤、电弧没有"这类只对一半的 bug）。 */
      best.hp -= dmg * enemyTakenMul(best, cx); best.flash = 0.1;
      if (best.hp <= 0) { const idx = enemies.indexOf(best); if (idx >= 0) killEnemy(best, idx); }
      else explode(best.x, best.y, WPN_ARC_COLOR, 5, 70);
    }
    dmg = Math.max(1, dmg - 0.6);
  }
  if (pts.length > 1) arcs.push({ pts, life: 0.16, max: 0.16, wc: WPN_ARC_COLOR });
}

/* ==================================================================
   玩家 / 受伤
   ================================================================== */

/* 锁定标记的维持：射击时刷新，不射击则自然消退。
   放在 update 里而不是 draw 里 —— 绘制函数不该改状态。 */
function updateLockMark(dt) {
  if (lockT > 0) lockT -= dt;
  if (state.mode === MODE_PLAY && player.alive && !paused) {
    const t = findNearestEnemy(player.x, player.y);
    if (t) { lockTarget = t; lockT = LOCK_HOLD; }
  }
}

function updatePlayer(dt) {
  if (!player.alive) {
    player.respawn -= dt;
    if (player.respawn <= 0) {
      player.alive = true; player.inv = 2.2; player.x = W / 2; player.cool = 0.2;
      Audio.play(400, 0.12, 'triangle', 0.03, 800);
      // 复活后位置被重置，必须同步基准点，否则下一帧会算出巨大位移导致朝向乱转
      pxPrev = player.x; pyPrev = player.y; playerFace = -Math.PI / 2;
    }
    return;
  }
  if (player.inv > 0) player.inv -= dt;
  if (player.spread > 0) player.spread -= dt;

  let dx = 0, dy = 0;
  if (keys['arrowleft'] || keys['a']) dx -= 1;
  if (keys['arrowright'] || keys['d']) dx += 1;
  if (keys['arrowup'] || keys['w']) dy -= 1;
  if (keys['arrowdown'] || keys['s']) dy += 1;

  if (pointer.active) {
    const speed = isTouch ? 36 : 22;
    player.x += (pointer.x - player.x) * Math.min(1, speed * dt);
    player.y += (pointer.y - player.y) * Math.min(1, speed * dt);
    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      player.x += dx / len * 130 * dt * moveMul();
      player.y += dy / len * 130 * dt * moveMul();
    }
  } else if (dx !== 0 || dy !== 0) {
    const len = Math.hypot(dx, dy);
    player.x += dx / len * 155 * dt * moveMul();
    player.y += dy / len * 155 * dt * moveMul();
  }

  /* ⚠️ 先钳 y 再钳 x，顺序不能反：x 的上限依赖 y（见 playerMaxX）。
     用上一帧的 y 去算 x 上限，飞机在道具栏高度的上下边界横向滑动时会来回跳 ——
     本帧以为"不在道具栏那一行"放它贴到 238，下一帧 y 更新了又弹回 209。
     ⚠️ menuFall 检查保持在钳制之后：菜单垮掉期间仍要夹住坐标，
     否则玩家位置会随菜单一起掉出屏幕。 */
  player.y = Math.max(HUD_H + 12, Math.min(H - WB_H - 6, player.y));
  player.x = Math.max(9, Math.min(playerMaxX(player.y), player.x));

  /* 「引力井」：持续把玩家拉向屏幕中心。
     放在**钳制之后**：先让玩家自己的操作生效、再叠加吸力，
     玩家是在"抵抗"而不是"被覆盖"——放在钳制前的话，
     吸力会被后面的钳制吃掉一部分，靠近边缘时表现为"拉不动"。
     ⚠️ 用**速度**（× dt）而不是加速度（× dt²）：
       加速度在本帧 dt≈0.0167 下只有约 0.013px 的位移，
       实测玩家完全感觉不到——写成"加速度"听起来更物理，实际等于没做。
     强度取玩家键盘速度的约 1/6（155px/s 对 26px/s）：
     松手会被明显拖走，按住方向仍能抵抗——这才叫"有对抗感"。 */
  if (gravityT > 0) {
    const cx = W / 2, cy = (HUD_H + 12 + (H - WB_H - 6)) / 2;
    const gdx = cx - player.x, gdy = cy - player.y;
    const glen = Math.hypot(gdx, gdy);
    if (glen > 1) {
      const pull = GRAVITY_PULL * dt;
      player.x += gdx / glen * pull;
      player.y += gdy / glen * pull;
      // 二次钳制：吸力可能把玩家推出边界（尤其是往上吸时越过 HUD）
      player.y = Math.max(HUD_H + 12, Math.min(H - WB_H - 6, player.y));
      player.x = Math.max(9, Math.min(playerMaxX(player.y), player.x));
    }
  }
  // 主菜单垮掉期间锁住操作：菜单还在往下掉，此时让玩家动会很割裂
  if (menuFall < 1) return;

  /* 机头朝向：位移超过阈值才更新，静止时保持上一朝向（否则会抖）。
     平滑插值而非直接跳变 —— 直接赋值会显得生硬。 */
  {
    const mdx = player.x - pxPrev, mdy = player.y - pyPrev;
    if (Math.hypot(mdx, mdy) > 0.25) {
      const target = Math.atan2(mdy, mdx);
      let d = target - playerFace;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      playerFace += d * Math.min(1, dt * 14);
    }
  }
  pxPrev = player.x; pyPrev = player.y;

  if (particles.length < particleCap() && Math.random() < 0.55) {
    const engineColors = ['ult', MD3.matEmber, MD3.matHot];
    spawnParticle({
      x: player.x + (Math.random() < 0.5 ? -3 : 3) + (Math.random() - 0.5) * 2,
      y: player.y + 5 + Math.random() * 2,
      vx: (Math.random() - 0.5) * 14,
      vy: 35 + Math.random() * 30,
      life: 0.22 + Math.random() * 0.2, max: 0.42,
      color: engineColors[Math.floor(Math.random() * engineColors.length)],
      size: Math.random() < 0.3 ? 2 : 1, glow: true
    });
  }

  player.cool -= dt;
  /* 转场期间不开火。不能只靠钳制 player.cool —— 它是每帧递减的，
     钳到 0.06 只是延后一帧，下一帧照样归零触发 shoot()。
     必须在开火点直接判断。 */
  if (player.cool <= 0 && menuFall >= 1) shoot();
}

function hurtPlayer(dmg) {
  // 第一次挨打才提示超载 —— 没挨过打时玩家不在乎"怎么反击"
  showTutorial('ult', '冷却结束后可释放超载，全屏清场',
    isTouch ? '双击屏幕' : '按 X 键', 3.6);
  if (!player.alive || player.inv > 0) return;
  if (!(dmg > 0)) dmg = DMG.ENEMY_BULLET;   // 缺省按小怪子弹计
  /* ⚠️ 真 bug 修复：takenMul() **此前从未被调用** ——
     它只定义在 1265 行，全文件找不到调用点。
     结果是"铁壁（受伤 -30%）/ 脆化（受伤 +40%）"两个状态只显示图标和描述，
     实际完全不影响伤害，玩家吃了铁壁该掉多少血还是多少。
     在伤害进入护盾/血量结算前统一乘：
     环境层（过热 +35%、虚空 +25%）也在此生效，与拾取层相乘。 */
  dmg = dmg * takenMul();
  /* [v1.7q] 重建期：受伤减半 —— 升级清空后的白板期不该被高波次当场打死。 */
  if (rebirthGrace > 0) dmg = Math.max(1, Math.ceil(dmg / 2));
  /* 闪避护盾：概率完全免疫这一次伤害。
     放在 takenMul 之后、护盾结算之前 ——
     放在护盾之后就变成"护盾先被扣、再判免伤"，玩家会觉得盾白掉了。
     内置 0.8 秒冷却：没有冷却的话，弹幕密集时会连续触发多次免伤，
     25% 的期望值在密集弹幕下会表现出接近"长时间无敌"的效果。 */
  if (dodgeTry()) return;
  combo = 0; comboTimer = 0;
  /* 护盾点数制：先扣护盾，扣不完的部分才进血。
     原实现是"有盾就完全免疫这一次伤害并清零" —— 那等于 1 点护盾也能挡下 Boss 的一发重击，
     且与"100 点护盾"的数值完全脱节：玩家看着满格盾，实际只挡一下。
     破碎只在护盾真正归零时触发，并给 0.5s 短无敌作为"盾没了"的反馈。 */
  if (player.shield > 0) {
    const absorbed = Math.min(player.shield, dmg);
    player.shield -= absorbed;
    dmg -= absorbed;
    state.shake = Math.max(state.shake, 4);
    explode(player.x, player.y, POWERUP_COLORS.shield, 14, 90);
    Audio.play(520, 0.14, 'triangle', 0.035, 160, 'player');
    if (player.shield <= 0.001) {
      player.shield = 0; player.shieldBreak = SHIELD_BREAK_DUR; player.inv = Math.max(player.inv, 0.5);
      explode(player.x, player.y, MD3.matHot, 10, 80);
      pushToast('护盾破碎', '', 'error');
      Audio.play(420, 0.25, 'triangle', 0.045, 140, 'player');
    }
    if (dmg <= 0.001) return;      // 完全被护盾吸收
  }
  dmg = Math.round(dmg);
  state.hp -= dmg; state.hpFlash = 0.25;

  if (state.hp <= 0) {
    // 血空：才真正倒下，火力/散射在此重置（原版每掉一命就清零，现改为终局才清）
    state.hp = 0;
    /* respawn 用 Infinity：这是"本局终结、不再复活"的哨兵值。
       原来写 9999 是个魔法数字 —— 读代码的人无法判断它表示"很久"还是"永远"。
       updatePlayer 的复活判定是 respawn <= 0，Infinity 明确表达"永不触发"。 */
    player.alive = false; player.respawn = Infinity; player.power = 1; player.spread = 0;
    explode(player.x, player.y, 'ult', 26, 135); explode(player.x, player.y, MD3.matHot, 10, 70);
    state.shake = 11; flashScreen = 0.25; flashColor = 'error';
    Audio.play(150, 0.45, 'sawtooth', 0.055, 38);
    setTimeout(() => Audio.play(90, 0.35, 'square', 0.04, 30), 60);
    setTimeout(() => Audio.play(70, 0.5, 'sawtooth', 0.05, 30), 120);
    gameOver();
  } else {
    // 未死：只扣血 + 短无敌，玩家继续可控
    player.inv = Math.max(player.inv, HURT_INV);
    const heavy = dmg >= 25;                 // 重击：更大的爆炸、更强的震屏
    explode(player.x, player.y, 'ult', heavy ? 20 : 10, heavy ? 120 : 80);
    state.shake = Math.max(state.shake, heavy ? 10 : 6);
    /* hit-stop 只在玩家自己挨打时触发，且时长随伤害规模递增。
       撞机（50%）定格最久，子弹（12~20）几乎不定格 ——
       满屏都在定格等于没有定格，只有"大事"才配用。 */
    addHitstop(dmg >= 30 ? 0.05 : (dmg >= 15 ? 0.035 : 0));
    flashScreen = Math.max(flashScreen, heavy ? 0.22 : 0.12); flashColor = 'error';
    addFloatText(player.x, player.y - 12, '-' + dmg, 'hpLow', heavy ? 1.5 : 1.1, 'dmg');
    Audio.play(heavy ? 180 : 230, heavy ? 0.14 : 0.1, 'square', heavy ? 0.04 : 0.03, heavy ? 90 : 110);
  }
}

/* ==================================================================
   僚机 / 道具 / 超载
   ================================================================== */
/* 僚机锁定目标：两架僚机**共用一个目标**，而不是各找最近的。
   各找最近的话两架会四散打不同敌人，看着像散兵不像护卫；
   锁同一个目标，弹道才是收拢的。
   取"玩家正前方最近"而非"离僚机最近"：僚机是护卫，
   它该打的是挡在主人前面那个，而不是自己身边那个。 */
let droneTarget = null;
function updateDroneTarget() {
  if (boss && !boss.entering) { droneTarget = boss; return; }
  let best = null, bd = Infinity;
  for (const e of enemies) {
    if (e.y > player.y) continue;                 // 只打玩家上方（前方）的
    const dx = Math.abs(e.x - player.x), dy = player.y - e.y;
    const d = dx * 1.6 + dy;                      // 横向权重更高：优先正前方
    if (d < bd) { bd = d; best = e; }
  }
  droneTarget = best;
}

function updateDrones(dt) {
  /* 目标每帧重算：目标死了、或更靠前的敌人出现，都能立刻改锁。
     若只在开火瞬间选一次，子弹会追着一个已经不存在的目标飞到底。 */
  if (player.alive) updateDroneTarget();
  for (const d of drones) {
    d.cool -= dt;
    if (d.cool <= 0 && player.alive) {
      d.cool = 0.30;
      bullets.push({
        x: player.x + d.offX, y: player.y + d.offY - 3,
        vx: 0, vy: -330, dmg: 1, drone: true, wc: POWERUP_COLORS.drone,
        /* 追踪复用导弹那套 homing：逐帧把速度往目标方向插值。
           转向率 12 比导弹的 9 更灵敏 —— 僚机弹初速更快，
           转向慢了会绕着目标转圈而不是咬上去。 */
        homing: true, life: 2.6, target: droneTarget
      });
    }
  }
}

/* 僚机三连引爆：敌人被僚机弹打中 3 下后炸开。
   计数记在**敌人身上**而不是子弹上 —— 子弹命中即消失，记不住；
   而"这只已经被打了两下"本来就是敌人的状态。
   ⚠️ 必须在敌人死亡时清标记：对象池可能复用同一对象，
   留着脏标记会让新敌人一出场就带着 2 层，第一下就炸。 */
/* 僚机引爆：改**全局命中计数**（原为按敌人记数 e.dMark）。
   为什么必须改：僚机弹伤害 1，而敌人血量只有 1~3（e0=1, e1/e3/e5=2, e2=3），
   旧的 e.dMark 要求"敌人挨满 3 下还活着"才引爆 —— 血量为 1~3 的怪
   根本扛不到第 3 下就被 killEnemy 移除，标记永远差最后一下，
   **这个机制几乎永远触发不了**（只有 4 血的 e4 能炸）。
   改为全局计数后，僚机弹每命中一次就 +1，满 3 次在命中点引爆，
   与敌人血量无关，打小怪也能稳定看到爆炸和连锁。 */
const DRONE_MARK_MAX = 3;
/* 激光刃长（半高）与穿透上限。
   ⚠️ 判定与绘制必须读**同一个常量**：此前刃身画成 17px 高，
   碰撞却把子弹当成一个点（只放宽 e.h/2+3）去和敌人做 AABB ——
   结果是"画出来的刃很长、真正能命中的只有中间一小段"，
   表现就是玩家反馈的"激光判定范围短"。
   半高 12（全长 24）比原来的 17 更长，但也别给太长：
   激光是穿透单体，刃身再长下去会变成竖着扫一排、与散射定位重复。 */
const LASER_HALF = 12;
/* 穿透上限 3：此前 pierce:true 只靠 hitIds 去重，**等于无限穿透**。
   判定框从"点"改成"整条刃"之后，无限穿透 + 纵向全覆盖 = 一根激光清半屏，
   那是 bug 级别的过强，必须封顶。3 个目标守住"单体高伤"而非"清屏"。 */
const LASER_PIERCE_MAX = 3;
let droneHitCount = 0;          // 僚机弹累计命中数（全局，不随敌人死亡清零）
const DRONE_BLAST_R = 26;
const DRONE_BLAST_DMG = 2;
function droneBlast(x, y) {
  explode(x, y, POWERUP_COLORS.drone, 12, 95);
  addShockwave(x, y, POWERUP_COLORS.drone, 10, 80);
  state.shake = Math.min(7, state.shake + 1.8);
  Audio.play(300, 0.1, 'sawtooth', 0.03, 90);
  for (let k = enemies.length - 1; k >= 0; k--) {
    const o = enemies[k];
    if (Math.abs(o.x - x) > DRONE_BLAST_R || Math.abs(o.y - y) > DRONE_BLAST_R) continue;
    o.hp -= DRONE_BLAST_DMG; o.flash = 0.12;
    if (o.hp <= 0) killEnemy(o, k);
  }
  if (boss && !boss.entering) {
    const d = Math.max(Math.abs(boss.x - x), Math.abs(boss.y - y));
    if (d < DRONE_BLAST_R) { boss.hp -= DRONE_BLAST_DMG; boss.flash = 0.14; if (boss.hp <= 0) killBoss(); }
  }
}

function bombBlast() {
  for (const b of ebullets) explode(b.x, b.y, 'enemy', 3, 45);
  ebullets.length = 0;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i]; e.hp -= 3; e.flash = 0.12;
    // 受伤只出火花，死亡才出爆炸 —— 之前两套共用 explode，
    // 同一次命中两种反馈叠在一起是浪费，也让"击杀"失去了辨识度
    if (e.hp <= 0) killEnemy(e, i); else addSpark(e.x, e.y, e.color, 0.8);
  }
  if (boss && !boss.entering) {
    boss.hp -= 25; boss.flash = 0.18; explode(boss.x, boss.y, MD3.matHot, 12, 100);
    if (boss.hp <= 0) killBoss();
  }
  state.shake = 12; flashScreen = 0.4; flashColor = 'coin';
  Audio.playNoise(0.4, 0.1);
  Audio.play(110, 0.5, 'sawtooth', 0.06, 35);
}

function triggerUlt() {
  if (ultCd > 0 || state.mode !== MODE_PLAY || paused || upgradePanel.active || !player.alive) return;
  ultCd = ULT_CD; ultActive = 2.0; ultScanY = H; flashScreen = 0.35; flashColor = 'secondary';
  pushToast('超载释放', '冷却 ' + ULT_CD + ' 秒', 'ult');

  Audio.play(280, 0.7, 'sawtooth', 0.06, 45);
