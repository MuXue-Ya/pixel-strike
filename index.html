        player.shield = Math.min(SHIELD_MAX, player.shield + 25);
        pushToast('生命 +' + (state.hp - before), '溢出转护盾', '#ff4d6d');
      } else {
        pushToast('生命 +' + healAmt, '', '#ff4d6d');
      }
      Audio.play(700, 0.09, 'triangle', 0.035, 1200); setTimeout(() => Audio.play(950, 0.1, 'triangle', 0.03, 1500), 70); break;
    }
    case 'medkitBig':
      const shB2 = player.shield;
      state.hp = state.maxHp; player.shield = Math.min(SHIELD_MAX, player.shield + 50);
      pushToast('生命全满', '护盾 +' + Math.round(player.shield - shB2), '#ffd166');
      Audio.play(600, 0.12, 'triangle', 0.04, 1000); setTimeout(() => Audio.play(900, 0.14, 'triangle', 0.035, 1500), 90);
      setTimeout(() => Audio.play(1200, 0.16, 'sine', 0.03, 1800), 180); break;
    case 'shield':
      /* 先记增量再显示：护盾接近上限时会被截断，
         写死 '+35' 会在只加了 12 点时仍显示 +35，与 HUD 条对不上。 */
      const shBefore = player.shield;
      player.shield = Math.min(SHIELD_MAX, player.shield + 35);
      pushToast('护盾', '+' + Math.round(player.shield - shBefore) + ' 点', '#7be9ff');
      Audio.play(500, 0.1, 'sine', 0.04, 900); setTimeout(() => Audio.play(750, 0.14, 'sine', 0.035, 1100), 80); break;
    case 'spread':
      player.spread = 10; pushToast('散射', '10 秒', '#ffd166');
      Audio.play(650, 0.07, 'square', 0.03, 950); setTimeout(() => Audio.play(820, 0.09, 'square', 0.028, 1200), 70); break;
    case 'slow':
      // 满栏时折成分数，不做静默丢弃 —— 掉落白费玩家会以为是 bug
      if (addItem('slow')) pushToast('拾取 时间缓速', '点击右侧使用', '#7be9ff');
      else { state.score += 60; pushToast('缓速已满', '+60 分', '#7be9ff'); }
      break;
    case 'repair':
      if (addItem('repair')) pushToast('拾取 应急维修', '点击右侧使用', '#4ade80');
      else { state.hp = Math.min(state.maxHp, state.hp + 15); pushToast('维修已满', '+15 生命', '#4ade80'); }
      break;
    case 'collect':
      if (addItem('collect')) pushToast('拾取 磁力吸引', '点击右侧使用', '#ff7be9');
      else { state.score += 60; pushToast('磁力已满', '+60 分', '#ff7be9'); }
      break;
    case 'barrier':
      if (addItem('barrier')) pushToast('拾取 护盾发生器', '点击右侧使用', '#7be9ff');
      else { player.shield = Math.min(SHIELD_MAX, player.shield + 20); pushToast('护盾已满', '+20 点', '#7be9ff'); }
      break;
    case 'magnet':
      magnet = 8; magnetPickups++; checkAchievement('magnet_1');
      pushToast('磁力场', '8 秒', '#ff7be9');
      Audio.play(640, 0.09, 'sine', 0.04, 1050); setTimeout(() => Audio.play(840, 0.1, 'sine', 0.035, 1300), 80); break;
    case 'drone':
      if (drones.length < MAX_DRONES) {
        drones.push({ offX: drones.length === 0 ? -13 : 13, offY: 4, cool: 0 });
        pushToast('僚机上线', drones.length + ' / ' + MAX_DRONES, '#4ade80');
        if (drones.length >= 2) checkAchievement('drones_2');
      } else { state.score += 200; pushToast('僚机已满', '+200 分', '#4ade80'); }
      Audio.play(560, 0.1, 'triangle', 0.035, 1000); setTimeout(() => Audio.play(840, 0.12, 'triangle', 0.03, 1300), 90); break;
    /* 炸弹不再拾取即炸：改为入道具栏，由玩家决定何时放。
       拾取即炸的话，只剩一两只杂兵时也会被白白用掉。 */
    case 'bomb': if (addItem('bomb')) pushToast('拾取 战术炸弹', '点击右侧使用', '#ff4d4d'); break;
  }
}

/* ==================================================================
   敌人 / 子弹 / 碰撞
   ================================================================== */
function updateEnemies(rawDt) {
  /* 缓速只作用于敌人与敌弹。这里整体用 edt 取代 dt，
     因为 updateEnemies 内部全部是敌人自身的位移与开火计时 —— 都该被减速。 */
  const dt = enemyDt(rawDt);
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i]; e.t += dt; if (e.flash > 0) e.flash -= dt;
    if (e.type === 0) { e.y += e.vy * dt; e.x += Math.sin(e.t * 3.2 + e.ph) * 46 * dt; }
    else if (e.type === 1) { e.y += e.vy * dt; e.x = e.bx + Math.sin(e.t * 2.1 + e.ph) * 38; }
    else if (e.type === 2) {
      e.y += e.vy * dt; e.x = e.bx + Math.sin(e.t * 0.9 + e.ph) * 14; e.fire -= dt;
      /* 护盾左右翻转。初始化放在这里而不是 spawnEnemy：
         spawnEnemy 里加字段也要加，但生成路径不止一条（Boss 召唤、分裂），
         在这里懒初始化能覆盖所有来源，不依赖生成处是否记得加。 */
      if (e.shieldSide == null) { e.shieldSide = Math.random() < 0.5 ? -1 : 1; e.shieldT = 0; }
      e.shieldT += dt;
      if (e.shieldT >= SHIELD_FLIP_T) { e.shieldT = 0; e.shieldSide = -e.shieldSide; e.shieldFlip = 0.18; }
      if (e.shieldFlip > 0) e.shieldFlip -= dt;
      if (e.fire <= 0 && e.y > 8 && e.y < H - 60) {
        e.fire = 1.2 + Math.random() * 1.0 - Math.min(0.7, state.wave * 0.05);
        if (state.wave >= 3 && Math.random() < 0.5) { for (let k = -1; k <= 1; k++) ebullets.push({ x: e.x, y: e.y + 4, vx: k * 60, vy: 115 }); }
        else ebullets.push({ x: e.x, y: e.y + 4, vx: 0, vy: 130 });
        Audio.play(220, 0.05, 'square', 0.014, 150);
      }
    } else if (e.type === 3) {
      e.y += e.vy * dt;
      /* 蛇形：每 0.6 秒换一次横向偏移方向。
         ⚠️ 蛇形偏移**必须独立于追击**（用 zigOff 叠加在追击基准 bx 上）：
         第一版写成"追击之后 e.x += zigDir*40*dt"，结果追击的
         "else e.x = player.x"（已对齐玩家时直接赋值）会在下一帧把它抹平 ——
         玩家静止时摆动完全失效，等于没做。这类 bug 不报错，只是机制静默失效。
         振幅钳 ±18px：超过玩家半个机身宽就变成"完全无法预判"，
         那不是难度而是随机性 —— 玩家会觉得是被系统坑了而非自己没走好。
         原来的 sin(t*9)*0.7 振幅不到 1px，等同直线冲刺，往旁边挪一下就躲开。 */
      if (e.zigT == null) { e.zigT = 0; e.zigDir = Math.random() < 0.5 ? -1 : 1; e.zigOff = 0; }
      e.zigT += dt;
      if (e.zigT >= 0.6) { e.zigT = 0; e.zigDir = -e.zigDir; }
      e.zigOff = Math.max(-18, Math.min(18, (e.zigOff || 0) + e.zigDir * 40 * dt));
      // 追击作用在**基准**上，摆动作为叠加偏移
      if (player.alive) {
        const dx = player.x - e.bx, step = 82 * dt;
        if (Math.abs(dx) > step) e.bx += Math.sign(dx) * step; else e.bx = player.x;
      }
      e.x = e.bx + e.zigOff;
    } else if (e.type === 4) { e.y += e.vy * dt; e.x = e.bx + Math.sin(e.t * 1.2 + e.ph) * 22; }
    else if (e.type === 5) {
      e.y += e.vy * dt; e.x += Math.sin(e.t * 6 + e.ph) * 22 * dt;
      /* 引信取代接触即炸：见 SUICIDE_FUSE 的说明。
         ⚠️ 引信一旦点燃就**不再解除**（哪怕玩家跑出去）——
         否则玩家被打退后它会自己熄火，等于没威胁。
         真正可规避的是"在引信烧完前打死它"，而不是"跑开"。 */
      if (e.fuse == null) {
        if (player.alive && Math.hypot(player.x - e.x, player.y - e.y) < SUICIDE_RANGE) {
          e.fuse = SUICIDE_FUSE;
          Audio.play(300, 0.12, 'square', 0.03, 90);
        }
      } else {
        e.fuse -= dt;
        if (e.fuse <= 0) {
          explode(e.x, e.y, '#ff3355', 24, 135); explode(e.x, e.y, '#ffd166', 10, 80);
          state.shake = Math.max(state.shake, 9); Audio.play(200, 0.25, 'sawtooth', 0.05, 50);
          swapRemove(enemies, i); hurtPlayer(dmgSuicide()); continue;
        }
      }
    }
    e.x = Math.max(8, Math.min(W - 8, e.x));
    if (e.y > H + 14) swapRemove(enemies, i);
  }
}

/* ===== 击杀特效分级 =====
   之前所有击杀都走 explode(count=14)，而 explode 的"大爆炸"分支要求 count>=16，
   于是 nova 光条 / 整屏色差 / 余烬 / 副环**一次都没触发过** ——
   玩家看到的永远是"粒子 + 一个向外扩散的环"，也就是那个椭圆扩散。

   现在按"因果形态"分三级，每级一套独立仪式，不能叠加也不能打折：
   · 杂兵 —— 不给光环。只给极短火花 + 向下方抛射的物质（它是"掉下去的"）
   · 精英 —— nova 光条 + 辐条环 + 整屏色差（它是"被轰开的"）
   · 首领 —— 先向内塌陷（能量被抽走）再爆开，见 killBoss()

   稀缺性是这一改的核心：杂兵不给光环，精英/首领的爆炸才有冲击力。
   之前满屏都在扩散椭圆，等于没有爆炸。 */
function killFx(e) {
  const elite = !e.small && (e.maxhp >= 3 || e.type === 4);
  if (!elite) {
    /* 杂兵：只给火花 + 向下抛射的物质碎片，**不给光环**。
       这是最重要的一条 —— 杂兵再炫，等于没有爆炸。 */
    addSpark(e.x, e.y, e.color, 1);
    const cap = particleCap();
    for (let i = 0; i < 7 && particles.length < cap; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 30 + Math.random() * 55;
      // 向下偏置：它是"掉下去的"，不是"炸开的"
      spawnParticle({
        x: e.x, y: e.y, px: e.x, py: e.y,
        vx: Math.cos(a) * sp * 0.6, vy: Math.abs(Math.sin(a) * sp) + 40,
        life: 0.16 + Math.random() * 0.2, max: 0.36,
        color: Math.random() < 0.3 ? '#ffffff' : e.color,
        size: 1, glow: true
      });
    }
    return;
  }
  /* 精英：nova 光条 + 辐条环 + 整屏色差。
     同屏 nova 限 2 个 —— 15 波敌机密集时全铺开会糊住视线，
     超出则降级为普通爆炸（不给 nova，但物质和环照给）。 */
  /* explode(count>=16) 自带 nova。这里只在它**真的给出** nova 时才配色差 ——
     否则降级时也叠色差，会出现"没有光条却整屏抖动"的割裂感。
     之前 killFx 自己再 addNova 一次，导致同点叠两条光条，白白翻倍亮度。 */
  const nBefore = novas.length;
  explode(e.x, e.y, e.color, 16, 105);      // count>=16 才进 big 分支
  if (novas.length > nBefore) addChroma(0.3);
  else addShockwave(e.x, e.y, e.color, 12, 95);   // 降级：补一个环
  addEmbers(e.x, e.y, e.color, 4);
  state.shake = Math.min(7, state.shake + 3.2);
}

function killEnemy(e, index) {
  /* dMark 已废弃：僚机引爆改为全局 droneHitCount，不再把标记记在敌人身上
     （记在敌人身上时，敌人死亡即清零，弱怪永远凑不满 3 下）。
     这里保留清零以兼容存量对象，避免脏字段残留。 */
  if (e.dMark) e.dMark = 0;
  enemies.splice(index, 1); combo++; comboTimer = COMBO_WINDOW;
  if (combo > maxCombo) maxCombo = combo;
  if (combo >= 10) checkAchievement('combo_10');
  if (combo >= 25) checkAchievement('combo_25');
  checkAchievement('first_kill');
  const waveBonus = 1 + Math.floor((state.wave - 1) / 4);
  const gained = Math.round(e.score * waveBonus * comboMult());
  state.score += gained;
  addFloatText(e.x, e.y - 6, '+' + gained, '#ffd166', 1);
  if (!e.noDrop) state.coins += 2 + Math.floor(state.wave / 3);
  killFx(e);
  state.shake = Math.min(7, state.shake + (e.small ? 0.8 : 2.2));
  Audio.play(180, 0.16, 'sawtooth', 0.038, 55);
  stats.totalKills++; runKills++;
  runHits++;           // 命中率分子
  /* 芯片掉落：概率掉 1 枚，状态倍率（幸运×2 / 贫瘠×0.5）直接作用于概率。
     不用"保底每波 1 枚" —— 那会让掉率变成伪随机、且和这里的状态倍率打架。
     改为每波至少 1 枚的保底放在波次结算处，与概率掉落互不干扰。 */
  if (!e.noDrop && Math.random() < CHIP_DROP_RATE * dropMul()) {
    addChips(1);
    addFloatText(e.x, e.y - 14, '+1 芯片', MD3.chip, 0.8);
  }
  if (e.type === 5) { suicideKills++; if (suicideKills >= 5) checkAchievement('suicide_5'); }
  if (e.type === 4 && !e.small) {
    for (let k = 0; k < 2; k++) {
      const sx = e.x + (k === 0 ? -9 : 9);
      enemies.push({ id: enemyIdCounter++, type: 0, x: sx, bx: sx, y: e.y, w: 7, h: 6, hp: 1, maxhp: 1, vy: 55, score: 5, color: '#e879f9', sprite: SPR.e0, white: SPR.e0w, t: 0, ph: Math.random() * Math.PI * 2, flash: 0, fire: 999, noDrop: true, small: true });
    }
    Audio.play(420, 0.1, 'square', 0.02, 260);
  }
  if (e.noDrop) return;
  const dropChance = e.type === 2 ? 0.28 : e.type === 4 ? 0.42 : e.type === 3 ? 0.16 : e.type === 1 ? 0.14 : 0.08;
  if (Math.random() < dropChance) powerups.push({ x: e.x, y: e.y, vy: 55, t: 0, type: randomPowerupType() });
}

/* ===== 锁定标记 =====
   弹幕游戏最缺的是"目标感" —— 之前打谁都一样，玩家只是往上方倾泻火力。
   现在瞄准最近目标时，目标身上出现方框 + 四角刻度，持续 0.4s。

   四角刻度而不是实心框：实心框会盖住敌人本体（敌人只有 7~10px），
   四角刻度把"框住"和"看见"分开了。 */
let lockTarget = null, lockT = 0;
const LOCK_HOLD = 0.4;
/* ===== 威胁提示 =====
   弹幕游戏最怕"突然死" —— 从屏幕外/视野边缘飞来的子弹看不见就中弹。
   现在屏幕外的敌弹在**对应边缘**画一个红色箭头指向它。

   为什么是箭头而不是把子弹画出来：子弹在屏外，画出来等于凭空多一个点，
   玩家不知道它从哪来；箭头钉在边缘，方向即来源。
   红色不跟主题走（见 NEVER_THEME）—— 危险色是全局约定。 */
function drawThreatArrows() {
  if (state.mode !== MODE_PLAY || !player.alive) return;
  const M = 6;                      // 距边缘的判定余量
  const shown = [];
  for (const b of ebullets) {
    // 只提示"正在接近玩家"的：远离的子弹不构成威胁
    if (b.vy < 0 && b.y < player.y) continue;
    let ex = null, ey = null, ang = 0;
    if (b.y < HUD_H + M) {                       // 从上边缘进入
      ex = Math.max(10, Math.min(W - 10, b.x)); ey = HUD_H + 3; ang = Math.PI / 2;
    } else if (b.x < M) { ex = 5; ey = Math.max(HUD_H + 10, Math.min(H - WB_H - 10, b.y)); ang = 0; }
    else if (b.x > W - M) { ex = W - 5; ey = Math.max(HUD_H + 10, Math.min(H - WB_H - 10, b.y)); ang = Math.PI; }
    if (ex === null) continue;
    if (shown.length >= 4) break;                // 同屏最多 4 个，多了就是噪音
    shown.push({ ex, ey, ang });
  }
  if (!shown.length) return;
  const k = 0.55 + Math.sin(state.time * 8) * 0.25;
  ctx.save();
  ctx.globalAlpha = k;
  ctx.fillStyle = '#ff4d6d';
  for (const s of shown) {
    ctx.save();
    ctx.translate(s.ex, s.ey);
    ctx.rotate(s.ang);                           // 三角默认尖端朝右（+1,0）
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(-2.5, -3); ctx.lineTo(-2.5, 3); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawLockMark() {
  if (!lockTarget || lockT <= 0) return;
  const e = lockTarget;
  if (e.hp !== undefined && e.hp <= 0) { lockT = 0; return; }
  const k = Math.min(1, lockT / LOCK_HOLD);
  const r = (e.w || 8) / 2 + 5, ry = (e.h || 7) / 2 + 4;
  const cx = Math.round(e.x) + 0.5, cy = Math.round(e.y) + 0.5;
  ctx.save();
  ctx.globalAlpha = k * 0.9;
  ctx.strokeStyle = TH(); ctx.lineWidth = 1;
  // 四角 L 形刻度
  const L = Math.max(2.5, r * 0.42);
  const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
  for (const [sx, sy] of corners) {
    ctx.beginPath();
    ctx.moveTo(cx + sx * r, cy + sy * ry - sy * L);
    ctx.lineTo(cx + sx * r, cy + sy * ry);
    ctx.lineTo(cx + sx * r - sx * L, cy + sy * ry);
    ctx.stroke();
  }
  ctx.restore();
}

function findNearestEnemy(x, y) {
  let best = null, bd = Infinity;
  for (const e of enemies) { const d = (e.x - x) ** 2 + (e.y - y) ** 2; if (d < bd) { bd = d; best = e; } }
  if (boss && !boss.entering) { const d = (boss.x - x) ** 2 + (boss.y - y) ** 2; if (d < bd) { bd = d; best = boss; } }
  return best;
}

/* 子弹上限：后期弹幕 + 僚机 + 散射会让同屏子弹数失控，
   而碰撞是 O(子弹 × 敌人)，数量一翻倍开销就翻两番。
   超限时优先淘汰**最早的非追踪子弹**：
   追踪弹（导弹/僚机）是玩家的主动投资，淘汰它们等于凭空没收；
   普通子弹是最老的那批，多半已经飞出有效区。 */
const BULLET_CAP = 80;
function trimBullets() {
  if (bullets.length <= BULLET_CAP) return;
  for (let i = 0; i < bullets.length && bullets.length > BULLET_CAP; i++) {
    if (!bullets[i].homing && !bullets[i].drone) { swapRemove(bullets, i); i--; }
  }
}

function updateBullets(dt) {
  trimBullets();
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.homing) {
      b.life -= dt; if (b.life <= 0) { swapRemove(bullets, i); continue; }
      if (!b.target || b.target.hp <= 0 || (b.target !== boss && enemies.indexOf(b.target) < 0)) b.target = findNearestEnemy(b.x, b.y);
      const speed = b.drone ? 330 : 250;
      // 转向率：僚机 12（弹速快，转慢了会绕圈），导弹 9
      const turn = b.drone ? 12 : 9;
      if (b.target) {
        const dx = b.target.x - b.x, dy = b.target.y - b.y, d = Math.hypot(dx, dy) || 1;
        b.vx += (dx / d * speed - b.vx) * Math.min(1, turn * dt); b.vy += (dy / d * speed - b.vy) * Math.min(1, turn * dt);
      } else b.vy -= 260 * dt;
      /* 拖尾粒子：僚机弹一局里能打出上百发，概率降到 0.18 且用绿色，
         否则满屏橙色残迹会盖住弹幕，反而看不清该躲什么。 */
      if (!b.drone && Math.random() < 0.5) spawnParticle({ x: b.x, y: b.y + 3, vx: (Math.random() - 0.5) * 18, vy: 26, life: 0.24, max: 0.24, color: '#ff9f43', size: 1 });
      else if (b.drone && Math.random() < 0.18) spawnParticle({ x: b.x, y: b.y + 2, vx: (Math.random() - 0.5) * 12, vy: 20, life: 0.18, max: 0.18, color: '#4ade80', size: 1 });
    } else if (b.boomerang) {
      b.t += dt;
      if (b.phase === 'out' && b.t > 0.42) { b.phase = 'back'; b.hitIds.clear(); }
      if (b.phase === 'back' && player.alive) {
        const dx = player.x - b.x, dy = player.y - b.y, d = Math.hypot(dx, dy) || 1, sp = 360;
        b.vx = dx / d * sp; b.vy = dy / d * sp;
        if (d < 12) { swapRemove(bullets, i); continue; }
      } else if (b.phase === 'back' && !player.alive) b.vy = 200;
      if (Math.random() < 0.4) spawnParticle({ x: b.x, y: b.y, vx: (Math.random() - 0.5) * 26, vy: (Math.random() - 0.5) * 26, life: 0.2, max: 0.2, color: '#b06bff', size: 1 });
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.laser && Math.random() < 0.5) {
      spawnParticle({
        x: b.x, y: b.y + 3,
        vx: (Math.random() - 0.5) * 10, vy: 22 + Math.random() * 12,
        life: 0.14 + Math.random() * 0.08, max: 0.22,
        color: '#ff4d6d', size: 2, glow: true
      });
    }
    if (b.y < -18 || b.y > H + 18 || b.x < -18 || b.x > W + 18) swapRemove(bullets, i);
  }
  const edt = enemyDt(dt);   // 缓速只影响敌人与敌弹，玩家与自机弹幕照常
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i]; b.x += b.vx * edt; b.y += b.vy * edt;
    if (b.y > H + 10 || b.y < -10 || b.x < -10 || b.x > W + 10) swapRemove(ebullets, i);
  }
}

function updateArcs(dt) { for (let i = arcs.length - 1; i >= 0; i--) { arcs[i].life -= dt; if (arcs[i].life <= 0) swapRemove(arcs, i); } }

function updatePowerups(dt) {
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i]; p.t += dt; p.y += p.vy * dt; p.x += Math.sin(p.t * 4) * 22 * dt;
    if (magnet > 0 && player.alive) {
      const dx = player.x - p.x, dy = player.y - p.y, d = Math.sqrt(dx * dx + dy * dy);
      if (d > 0.5) { p.x += dx / d * 165 * dt; p.y += dy / d * 165 * dt; }
    }
    if (p.y > H + 12) { swapRemove(powerups, i); continue; }
    if (player.alive && Math.abs(p.x - player.x) < 11 && Math.abs(p.y - player.y) < 11) { applyPowerup(p.type, p.x, p.y); swapRemove(powerups, i); }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt;
    if (p.life <= 0) {
      if (PARTICLE_POOL.length < PARTICLE_POOL_MAX) PARTICLE_POOL.push(p);   // 归还复用
      swapRemove(particles, i); continue;
    }
    p.px = p.x; p.py = p.y;                       // 记录上一帧位置，供拖尾绘制
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.vy += 30 * dt;
  }
}
function updateFloatTexts(dt) {
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const t = floatTexts[i]; t.life -= dt; t.y += t.vy * dt; t.vy *= 0.92;
    if (t.life <= 0) swapRemove(floatTexts, i);
  }
}

function updateDebris(dt) {
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i]; d.life -= dt;
    if (d.life <= 0) { swapRemove(debris, i); continue; }
    d.x += d.vx * dt; d.y += d.vy * dt;
    d.vy += 180 * dt; d.rot += d.rotSpeed * dt;
  }
}
function drawDebris() {
  for (const d of debris) {
    const t = Math.max(0, d.life / d.max);
    ctx.globalAlpha = t;
    // 白热：刚抛出时接近白色，随寿命衰减回本色 —— 碎片的"余温"
    ctx.fillStyle = t > 0.75 ? '#ffffff' : d.color;
    const sp = Math.hypot(d.vx, d.vy);
    ctx.save(); ctx.translate(Math.round(d.x), Math.round(d.y));
    if (sp > 40) {
      // 运动拉伸：高速时沿速度方向拉成条，像真实的抛射碎片
      const ang = Math.atan2(d.vy, d.vx);
      ctx.rotate(ang);
      const stretch = Math.min(4.5, 1 + sp / 62);
      ctx.fillRect(-d.size * stretch / 2, -d.size / 2, d.size * stretch, d.size);
      // 拖影：再画一段半透明的"前一段"，比单条矩形更像有速度
      ctx.globalAlpha = t * 0.35;
      ctx.fillRect(-d.size * stretch * 0.9, -d.size * 0.35, d.size * stretch * 0.8, d.size * 0.7);
    } else {
      ctx.rotate(d.rot);
      ctx.fillRect(-d.size/2, -d.size/2, d.size, d.size);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ==================================================================
   空间网格：子弹 × 敌人的碰撞从 O(n×m) 降到近似 O(n)
   ------------------------------------------------------------------
   原来每颗子弹都要遍历全部敌人（80 子弹 × 30 敌人 = 2400 次检测/帧）。
   改成每帧把所有敌人按位置分桶，子弹只查自己所在格 + 相邻 8 格。

   格子 48px 的依据：命中判定范围是 |dy| <= e.h/2+3、|dx| <= e.w/2+2，
   最大约 18px。3×3 邻域覆盖 ±48px，**必定**包含所有可能命中的敌人 ——
   这是"不会漏判"的保证，不是拍脑袋取的整数。

   分辨率变化（横竖屏切换）时网格尺寸跟着重建，写死会在新尺寸下越界。
   ================================================================== */
const GRID = { cell: 48, w: 0, h: 0, buckets: [] };
function gridBuild() {
  const nw = Math.ceil(W / GRID.cell) + 2, nh = Math.ceil(H / GRID.cell) + 2;
  if (nw !== GRID.w || nh !== GRID.h) {
    GRID.w = nw; GRID.h = nh; GRID.buckets = [];
    for (let i = 0; i < nw * nh; i++) GRID.buckets.push([]);
  } else {
    for (let i = 0; i < GRID.buckets.length; i++) GRID.buckets[i].length = 0;   // 复用桶数组，不重新分配
  }
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    const gx = Math.max(0, Math.min(GRID.w - 1, (e.x / GRID.cell) | 0));
    const gy = Math.max(0, Math.min(GRID.h - 1, (e.y / GRID.cell) | 0));
    GRID.buckets[gy * GRID.w + gx].push(e);
  }
}
/* 查询子弹附近的候选敌人（3×3 格）。out 复用同一个数组，避免每次分配。 */
const gridOut = [];
function gridQuery(x, y) {
  gridOut.length = 0;
  const cx = Math.max(0, Math.min(GRID.w - 1, (x / GRID.cell) | 0));
  const cy = Math.max(0, Math.min(GRID.h - 1, (y / GRID.cell) | 0));
  for (let gy = cy - 1; gy <= cy + 1; gy++) {
    if (gy < 0 || gy >= GRID.h) continue;
    for (let gx = cx - 1; gx <= cx + 1; gx++) {
      if (gx < 0 || gx >= GRID.w) continue;
      const bk = GRID.buckets[gy * GRID.w + gx];
      for (let i = 0; i < bk.length; i++) gridOut.push(bk[i]);
    }
  }
  return gridOut;
}

function checkCollisions() {
  gridBuild();
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i]; let removed = false;
    const cands = gridQuery(b.x, b.y);
    for (let ci = 0; ci < cands.length; ci++) {
      const e = cands[ci];
      /* 本帧可能已被前面的子弹打死：网格存的是引用，敌人从 enemies 移除后
         引用仍在，不判就会打到"尸体"上重复结算。

         ⚠️ 只用 hp 判断，**不要**在这里写 enemies.indexOf(e) < 0：
         indexOf 是 O(敌人总数)，而这是每个候选都跑一次的高频路径 ——
         加上它后总开销变成 子弹数 × 候选数 × 敌人数，比原来的
         全量双重循环**更慢**，网格优化等于白做（甚至倒退）。
         用 hp 判断已经够：击杀时必然先扣血到 hp<=0 才调 killEnemy，
         所以死掉的敌人 hp 一定是 <= 0 的。 */
      if (e.hp <= 0) continue;
      /* 激光：独立的"竖直线段 vs 敌人包围盒"判定，不走下面的点式 AABB。
         通用判定把子弹当成**一个点**（只按 e.h/2+3 放宽），
         对一条 24px 长的竖直光刃来说，真正能命中的只有中心那一小段 ——
         玩家看到刃明明扫过敌人却没伤害，即"判定范围短"。
         改成纵向用**刃身自己的区间**与敌人做重叠测试，横向仍按刃宽。 */
      if (b.laser) {
        const cdx = b.x - e.x;
        if (cdx > e.w / 2 + 2 || cdx < -e.w / 2 - 2) continue;
        const beamTop = b.y - LASER_HALF, beamBot = b.y + LASER_HALF;
        const eTop = e.y - e.h / 2, eBot = e.y + e.h / 2;
        if (eBot < beamTop || eTop > beamBot) continue;
      } else {
        const cdy = b.y - e.y; if (cdy > e.h / 2 + 3 || cdy < -e.h / 2 - 3) continue;
        const cdx = b.x - e.x; if (cdx > e.w / 2 + 2 || cdx < -e.w / 2 - 2) continue;
      }
      {
        /* ⚠️ 伤害倍率必须在这里接：局内伤害卡（dmgMul，上限 +20%）与
           技能树攻击强化（atkUpgMul，满级 +15%）此前**完全没生效** ——
           dmgOf/bd 定义了却从未被调用，玩家全程在用裸基础伤害打。
           这是"升级提升小""卡片加的数值太低""刮痧"的真正根因：
           不是数值给少了，是压根没接线。暴击在倍率之后结算（先乘成长再爆击）。 */
        let dmg = dmgOf(b.dmg || 1);
        // 命中火花：每次命中都给一次"脆"反馈，暴击时更大
        addSpark(b.x, b.y, b.crit ? '#ffd166' : (b.color || '#3ad1ff'), b.crit ? 1.5 : 1);
        if (b.crit) { dmg = Math.round(dmg * CRIT_DMG_MUL); critCount++; if (critCount >= 50) checkAchievement('crit_50'); addFloatText(e.x, e.y - 8, dmg + '!', '#ffd166', 1.3, 'crit'); }
        /* 护盾机（type 2）正面减伤：见 enemyTakenMul 的说明。
           放在暴击之后 —— 先算完这一发的完整伤害再打折，
           否则"暴击打护盾"会变成暴击倍率被减伤稀释两次，手感很闷。 */
        dmg = dmg * enemyTakenMul(e, b.x);
        /* ⚠️ 激光穿透封顶：pierce:true 此前只靠 hitIds 去重（每个敌人一次），
           等于**无限穿透**。判定框从"点"改成"整条刃"之后这会被放大成
           一根激光清半屏，所以必须显式封顶。
           同时这也是激光的唯一主动销毁路径 —— 见下方说明。 */
        if (b.pierce || b.boomerang) {
          if (b.hitIds.has(e.id)) continue;
          b.hitIds.add(e.id);
          if (b.laser && b.hitIds.size >= LASER_PIERCE_MAX) { swapRemove(bullets, i); removed = true; }
        }
        /* 穿透强化（成长树 pierce）：普弹也能穿透，此前只有激光/回旋有。
           hitIds 懒创建 —— 普通子弹在 shoot 里不带这个字段（只有 pierce 类才带），
           在高频碰撞路径里给每颗子弹都预建 Set 是白花钱。
           ⚠️ 判据是 size < budget 而不是 <= ：budget=1 表示"多穿 1 个"，
           即总共命中 2 个目标；写成 <= 会变成命中 3 个，与描述不符。
           ⚠️ 命中后**不销毁**，所以必须同时把它计入 hitIds，否则同一敌人会被反复穿透。 */
        else {
          const budget = pierceUpgExtra();
          if (!b.hitIds) b.hitIds = new Set();
          if (b.hitIds.has(e.id)) continue;
          if (b.hitIds.size < budget) { b.hitIds.add(e.id); }
          else { swapRemove(bullets, i); removed = true; }
        }
        if (b.homing && !b.drone) {
          explode(b.x, b.y, '#ff9f43', 10, 90);
          for (let k = enemies.length - 1; k >= 0; k--) {
            const o = enemies[k]; if (o === e) continue;
            if (Math.abs(o.x - e.x) < 14 && Math.abs(o.y - e.y) < 14) { o.hp -= 1; o.flash = 0.1; if (o.hp <= 0) killEnemy(o, k); }
          }
        }
        e.hp -= dmg; e.flash = 0.09;
        /* 僚机弹命中计数（全局）：满 3 次在**命中点**引爆。

           放在扣血之后、死亡判定之前：顺序反了会被打死的敌人再触发一次爆炸。
           不再检查 e.hp > 0 —— 那个守卫本意是"不给尸体记数"，但它同时
           要求敌人扛住 3 下还活着；血量 1~3 的怪做不到，标记永远锁死。
           全局计数与敌人存亡无关，死掉的这一下同样算数（子弹确实打中了）。 */
        if (b.drone) {
          droneHitCount++;
          /* 充能反馈：没满时在命中点飘一个极小的计数点，
             让玩家知道"僚机在攒、还差几下爆"。
             原来攒的过程完全不可见 —— 玩家只看到偶尔炸一下，
             不知道它是随机触发还是自己打出来的，学不会主动用僚机。 */
          if (droneHitCount < DRONE_MARK_MAX) {
            addFloatText(b.x, b.y - 4, '·'.repeat(droneHitCount), '#4ade80', 0.6, '');
          }
          if (droneHitCount >= DRONE_MARK_MAX) { droneHitCount = 0; droneBlast(b.x, b.y); }
        }
        if (b.laser) {
          explode(b.x, b.y, b.crit ? '#ffd166' : '#ff4d6d', b.crit ? 10 : 5, b.crit ? 120 : 70);
          for (let k = 0; k < 4; k++) {
            spawnParticle({
              x: b.x, y: b.y,
              vx: (Math.random() - 0.5) * 180, vy: (Math.random() - 0.5) * 180,
              life: 0.2, max: 0.2,
              color: b.crit ? '#ffffff' : '#ff4d6d', size: 2, glow: true
            });
          }
        } else if (!b.homing || b.drone) {
          explode(b.x, b.y - 2, b.crit ? '#ffd166' : '#8ab4d8', b.crit ? 6 : 3, b.crit ? 70 : 45);
        }
        if (e.hp <= 0) killEnemy(e, enemies.indexOf(e)); else if (!b.homing || b.drone) Audio.play(340, 0.035, 'square', 0.018, 240);
        if (removed) break;
      }
    }
    if (removed) continue;
    if (boss && !boss.entering) {
      if (Math.abs(b.x - boss.x) < boss.w / 2 - 2 && Math.abs(b.y - boss.y) < boss.h / 2 - 2) {
        /* 与普通敌人那处同理：伤害卡 + 技能树攻击必须在 Boss 这里也接上，
           否则"打小怪有加成、打 Boss 没有"，而 Boss 恰恰是最需要成长感的地方。 */
        let dmg = dmgOf(b.dmg || 1);
        // Boss 命中同样给火花
        addSpark(b.x, b.y, b.crit ? '#ffd166' : (b.color || '#3ad1ff'), b.crit ? 1.6 : 1.1);
        /* 暴击倍率：这里是 Boss 专属结算，与上面普通敌人那处是两份独立代码。
           两处必须共用 CRIT_DMG_MUL —— 只改一处会造成"打小怪和打 Boss 暴击倍率不同"
           的隐性不一致，且这种 bug 不会报错，只会在实战中表现为手感割裂。 */
        if (b.crit) { dmg = Math.round(dmg * CRIT_DMG_MUL); critCount++; if (critCount >= 50) checkAchievement('crit_50'); addFloatText(b.x, b.y - 6, dmg + '!', '#ffd166', 1.3, 'crit'); }
        if (b.pierce || b.boomerang) { if (b.hitIds.has('boss')) continue; b.hitIds.add('boss'); }
        else swapRemove(bullets, i);
        if (b.homing) explode(b.x, b.y, '#ff9f43', 10, 90);
        boss.hp -= dmg; boss.flash = 0.08;
        if (!b.homing) explode(b.x, b.y, '#ffd166', 3, 45);
        if (boss.hp <= 0) killBoss(); else if (!b.homing) Audio.play(380, 0.03, 'square', 0.014, 260);
      }
    }
  }
  if (!player.alive || player.inv > 0) return;
  for (let j = enemies.length - 1; j >= 0; j--) {
    const e = enemies[j];
    if (Math.abs(e.x - player.x) < (e.w + player.w) / 2 - 2 && Math.abs(e.y - player.y) < (e.h + player.h) / 2 - 2) { killEnemy(e, j); hurtPlayer(dmgBody()); return; }
  }
  if (boss && !boss.entering) { if (Math.abs(boss.x - player.x) < boss.w / 2 + 3 && Math.abs(boss.y - player.y) < boss.h / 2 + 3) { hurtPlayer(dmgBossBody()); return; } }
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    if (Math.abs(b.x - player.x) < 5.5 && Math.abs(b.y - player.y) < 6) {
      swapRemove(ebullets, i);
      hurtPlayer(b.boss ? DMG.BOSS_BULLET : DMG.ENEMY_BULLET);
      return;
    }
  }
}

/* ==================================================================
   升级面板 & 波次
   ================================================================== */
function showUpgradePanel() {
  const pool = UPGRADES.filter(u => {
    if (u.id === 'drone' && drones.length >= MAX_DRONES) return false;
    if (u.id === 'power' && player.power >= 4) return false;
    if (u.id === 'life' && state.maxHp >= MAX_HP_CAP) return false;
    if (u.id === 'boom_count' && player.boomCount >= 5) return false;
    if (u.id === 'heal' && state.hp >= state.maxHp) return false;        // 满血时不浪费卡位
    if (u.id === 'spread' && player.spread > 6) return false;
    if (u.id === 'magnet' && magnet > 6) return false;
    if (u.id === 'ult_core' && ultCd <= 0) return false;                 // 冷却已好则不出现
    if (u.id === 'dmg' && dmgMul >= DMG_CAP - 1e-9) return false;        // 已到上限（DMG_CAP，+20%）
    return true;
  });
  if (pool.length === 0) { startWave(state.wave + 1); return; }
  /* 排序：按"当前最缺什么"排，而不是纯随机。
     快死了却抽到三张长线养成卡，玩家会觉得系统在为难他。
     做法是先按 prio 降序分档，档内再随机 —— 保证最需要的在前，
     又不至于每次顺序完全固定而失去变化。 */
  const scored = pool.map(u => {
    let p = 0;
    try { p = typeof u.prio === 'function' ? u.prio() : 0; } catch (e) { p = 0; }
    return { u: u, p: p, r: Math.random() };
  });
  scored.sort((a, b) => (b.p - a.p) || (a.r - b.r));
  upgradePanel.options = scored.slice(0, Math.min(3, scored.length)).map(s => s.u);
  upgradePanel.active = true; upgradePanel.timer = 9; Audio.ui(760);
  banner.text = '升级商店'; banner.sub = isTouch ? '点击购买' : '按 1-3'; banner.color = '#ffd166'; banner.t = 1.5;
}
function closeUpgradePanel() { upgradePanel.active = false; upgradePanel.options = []; Audio.ui(520); startWave(state.wave + 1); }
function buyUpgrade(index) {
  const opt = upgradePanel.options[index]; if (!opt) return;
  /* ⚠️ 必须走 upgCostOf：伤害卡的 cost 是函数，直接读会拿函数当数字用。 */
  const price = upgCostOf(opt);
  if (state.coins < price) { Audio.play(180, 0.1, 'square', 0.02, 120); return; }
  state.coins -= price;
  switch (opt.id) {
    case 'power': if (player.power < 4) player.power++; else state.score += 200; break;
    case 'life': state.maxHp = Math.min(MAX_HP_CAP, state.maxHp + 25); state.hp = state.maxHp; break;
    case 'drone': if (drones.length < MAX_DRONES) { drones.push({ offX: drones.length === 0 ? -13 : 13, offY: 4, cool: 0 }); if (drones.length >= 2) checkAchievement('drones_2'); } else state.score += 300; break;
    case 'shield': player.shield = Math.min(SHIELD_MAX, player.shield + 50); break;
    case 'boom_count': if (player.boomCount < 5) player.boomCount++; else state.score += 200; break;
    case 'heal': state.hp = Math.min(state.maxHp, state.hp + 50); break;
    case 'spread': player.spread = Math.max(player.spread, 10); break;
    case 'magnet': magnet = Math.max(magnet, 10); break;
    /* 给 3 个炸弹而非立即清屏：商店出现时场上常常没敌人（波次刚清完），
       立即清屏等于花 55 金币炸了个寂寞。持有才能真正"留到弹幕密集时再用"。 */
    case 'bomb':
      for (let i = 0; i < 3; i++) addItem('bomb');
      break;
    case 'ult_core': ultCd = 0; break;
    case 'dmg': dmgMul = Math.min(DMG_CAP, dmgMul + DMG_STEP); break;
  }
  Audio.play(600, 0.1, 'square', 0.03, 1100); explode(W / 2, H / 2, opt.color, 14, 90);
  upgradePanel.options.splice(index, 1); if (upgradePanel.options.length === 0) closeUpgradePanel();
}
function updateWave(dt) {
  if (boss) return; if (upgradePanel.active) return;
  waveClock += dt;
  while (waveQueue.length && waveQueue[0].t <= waveClock) spawnEnemy(waveQueue.shift().type);
  if (waveQueue.length === 0 && enemies.length === 0) { state.waveDelay -= dt; if (state.waveDelay <= 0) showUpgradePanel(); }
}

/* ==================================================================
   主更新
   ================================================================== */
/* ==================================================================
   统一特效系统（FX_LAYERS）
   ------------------------------------------------------------------
   之前 11 类特效散在 11 个独立数组里，各自 update、各自 draw：
     muzzles / arcs / shockwaves / novas / flashes / particles /
     embers / debris / sparks / blasts / floatTexts
   新增一类要同时改三处（定义、更新、绘制），漏一处不会报错、
   只会**静默失效**（这项目已经因此出过好几次"加了没反应"）。

   这里改成统一注册：新增特效只需在下面加一行，
   图层顺序成为**显式声明**（order 字段），而不是散落在 render() 里
   靠调用先后顺序隐式表达的 —— 后者谁都不敢动，一动就改变画面层次。

   tier 分两层：
     entity：与子弹/敌人同批（枪口要压在机体上，电弧属于弹道层）
     fx：    在所有实体之上（爆炸、飘字等）
   ================================================================== */
const FX_LAYERS = [
  { id: 'muzzles',    tier: 'entity', order: 0, update: (dt) => updateMuzzles(dt),    draw: () => drawMuzzles(),    arr: () => muzzles },
  { id: 'arcs',       tier: 'entity', order: 1, update: (dt) => updateArcs(dt),       draw: () => drawArcs(),       arr: () => arcs },
  { id: 'shockwaves', tier: 'fx',     order: 0, update: (dt) => updateShockwaves(dt), draw: () => drawShockwaves(), arr: () => shockwaves },
  { id: 'novas',      tier: 'fx',     order: 1, update: (dt) => updateNovas(dt),      draw: () => drawNovas(),      arr: () => novas },
  { id: 'flashes',    tier: 'fx',     order: 2, update: (dt) => updateFlashes(dt),    draw: () => drawFlashes(),    arr: () => flashes },
  { id: 'particles',  tier: 'fx',     order: 3, update: (dt) => updateParticles(dt),  draw: () => drawParticles(),  arr: () => particles },
  { id: 'embers',     tier: 'fx',     order: 4, update: (dt) => updateEmbers(dt),     draw: () => drawEmbers(),     arr: () => embers },
  { id: 'debris',     tier: 'fx',     order: 5, update: (dt) => updateDebris(dt),     draw: () => drawDebris(),     arr: () => debris },
  { id: 'sparks',     tier: 'fx',     order: 6, update: (dt) => updateSparks(dt),     draw: () => drawSparks(),     arr: () => sparks },
  { id: 'blasts',     tier: 'fx',     order: 7, update: (dt) => updateBlasts(dt),     draw: () => drawBlasts(),     arr: () => blasts },
  { id: 'floatTexts', tier: 'fx',     order: 8, update: (dt) => updateFloatTexts(dt), draw: () => drawFloatTexts(), arr: () => floatTexts },
  /* 「视野干扰」挂 fx 层而不是 HUD 层：
     fx 在 drawHUD **之前**绘制（见 10320 附近），所以遮罩盖住战场、
     但不动 HUD —— 血条、波次、道具栏这些必须一直可读，
     把玩家要用来决策的信息一起糊掉就不是"干扰视野"，是"惩罚看屏幕"。
     渐变每帧新建：半径随剩余时间变化，缓存反而要处理失效。 */
  { id: 'blackout',   tier: 'fx',     order: 9, update: () => {}, draw: () => drawBlackout(), arr: () => [] }
];

function drawBlackout() {
  if (blackoutT <= 0) return;
  const k = Math.min(1, blackoutT / 0.6);        // 最后 0.6 秒淡出，避免突然消失
  const cx = W / 2, cy = H / 2;
  const outer = Math.hypot(W, H) * 0.62;
  const inner = outer * (0.34 - 0.10 * (1 - k)); // 越接近结束可视区越大
  const g = ctx.createRadialGradient(cx, cy, Math.max(1, inner), cx, cy, outer);
  g.addColorStop(0, 'rgba(4, 8, 16, 0)');
  g.addColorStop(1, 'rgba(4, 8, 16, ' + (0.88 * k).toFixed(3) + ')');
  ctx.save();
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* 按注册表统一推进。顺序即注册顺序（与原分散调用等价），
   但"哪些特效需要更新"从 render 里挪到了这里 —— 只有一处真相。 */
function updateFX(dt) { for (let i = 0; i < FX_LAYERS.length; i++) FX_LAYERS[i].update(dt); }
/* 分层绘制：entity 层随实体画，fx 层压在所有实体之上。 */
function drawFXEntity() { for (let i = 0; i < FX_LAYERS.length; i++) if (FX_LAYERS[i].tier === 'entity') FX_LAYERS[i].draw(); }
function drawFX()       { for (let i = 0; i < FX_LAYERS.length; i++) if (FX_LAYERS[i].tier === 'fx')     FX_LAYERS[i].draw(); }
/* 活跃特效总数：性能诊断 + 测试用。 */
function fxCount() { let n = 0; for (let i = 0; i < FX_LAYERS.length; i++) n += FX_LAYERS[i].arr().length; return n; }

function update(dt) {
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 42);
  if (banner.t > 0) banner.t -= dt; if (achPopup.t > 0) achPopup.t -= dt;
  if (flashScreen > 0) flashScreen = Math.max(0, flashScreen - dt * 2.5);
  if (state.hpFlash > 0) state.hpFlash = Math.max(0, state.hpFlash - dt);
  if (boss && boss.phaseFlash > 0) boss.phaseFlash = Math.max(0, boss.phaseFlash - dt);
  if (weaponGlow > 0) weaponGlow = Math.max(0, weaponGlow - dt);
  if (deathT > 0) deathT = Math.max(0, deathT - dt);
  if (state.mode === MODE_OVER) goAnim += dt;
  // 用 <= 而非 <：血量正好等于阈值时（撞一次后 hp=50%），下一次撞击就会死，必须警告
  state.lowHp = state.mode === MODE_PLAY && state.hp > 0 && (state.hp / state.maxHp) <= LOW_HP_RATIO;
  if (magnet > 0) magnet -= dt;
  if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }
  bgT += dt;
  updateEnvironment(dt);
  for (const s of stars) { s.y += s.v * dt; if (s.y > H) { s.y = -2; s.x = Math.random() * W; } }
  if (planet) { planet.x += planet.vx * dt; if (planet.x < -80 || planet.x > W + 80) planet = null; }
  updateFX(dt);
  updateHpGhost(dt);
  animUpdate(dt); rollUpdate(dt); tutUpdate(dt);
  updateGameTimers(dt);
  updateLockMark(dt);
  // 出场动画播完 → 真正关闭。中途再次打开则取消关闭（可打断）
  uiSyncClose();
  if (chroma > 0) chroma = Math.max(0, chroma - dt * 2.6);   // 约 0.38s 衰减完

  if (state.mode === MODE_PLAY && !upgradePanel.active) {
    updatePlayer(dt); updateDrones(dt); updateEnemies(dt); updateBoss(dt); updateBullets(dt); updatePowerups(dt); checkCollisions(); updateWave(dt);
    if (ultActive > 0) {
      ultActive -= dt; ultScanY -= 230 * dt;
      if (ultScanY > -10 && ultScanY < H) {
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          /* 超载伤害接成长树 ult（超载强化）。此前这里写死 2 点，
             成长树里也根本没有"超载"这一栏 —— 玩家点了别的项却期待大招变强。
             ⚠️ 不取整：2 点基数太小，取整会把 +4% 那一档直接吃掉。 */
          if (Math.abs(e.y - ultScanY) < 8) { e.hp -= ultBeamDmg() * enemyTakenMul(e, e.x); e.flash = 0.12; if (e.hp <= 0) killEnemy(e, i); else addSpark(e.x, e.y, e.color, 0.6); }
        }
        if (boss && !boss.entering && Math.abs(boss.y - ultScanY) < boss.h / 2) { boss.hp -= ultBeamDmg(); boss.flash = 0.12; if (boss.hp <= 0) killBoss(); }
      }
      if (ultScanY < -12) ultScanY = H;
    }
  }
  /* 超载冷却：递减到 0 时弹"就绪"提示。
     必须在这里检测"刚跨过 0"而不是每帧判断 ultCd <= 0 ——
     后者会在冷却结束后每帧都弹一次，把左下角刷爆。 */
  if (ultCd > 0) {
    ultCd -= dt * (ultJamT > 0 ? 0.5 : 1);
    if (ultCd <= 0) { ultCd = 0; pushToast('超载就绪', isTouch ? '双击屏幕释放' : '按 X 释放', '#ffd166'); }
  }
  if (slowT > 0) slowT = Math.max(0, slowT - dt);
  if (statusT > 0) { statusT -= dt; if (statusT <= 0) { statusT = 0; statusId = null; } }

  /* ===== 事件计时器递减 =====
     放在这里（update 尾部）而不是各事件自己的作用点：
     计时器必须**每帧只递减一次**，散在多个作用点会漏或重复。
     ⚠️ 陨石雨在这里生成而不是靠 spawnEnemy 的波次逻辑：
     它是**事件期间的持续流**，不属于任何一波——
     混进波次会让"清完这波"的判定一直不满足，波次永远结束不了。 */
  if (feverT    > 0) feverT    = Math.max(0, feverT    - dt);
  if (stasisT   > 0) stasisT   = Math.max(0, stasisT   - dt);
  if (ultJamT   > 0) ultJamT   = Math.max(0, ultJamT   - dt);
  if (gravityT  > 0) gravityT  = Math.max(0, gravityT  - dt);
  if (blackoutT > 0) blackoutT = Math.max(0, blackoutT - dt);
  if (meteorT   > 0) {
    meteorT = Math.max(0, meteorT - dt);
    meteorClock += dt;
    /* 生成自爆体（type 5）：它自带**引信 + 可打断**机制，
       天降后还要冲向玩家再引爆——有反应时间，不是"掉下来就炸"。
       复用已有类型而不是新增：新增类型要动权重表、碰撞盒、精灵，
       而这批事件要的是"有威胁但可躲"，e5 正好就是这个定位。 */
    while (meteorClock >= METEOR_INTERVAL) {
      meteorClock -= METEOR_INTERVAL;
      if (enemies.length < 90) spawnEnemy(5);
    }
  }
  if (menuFall < 1) menuFall = Math.min(1, menuFall + dt / FALL_DUR);
  if (restartFade < 1) restartFade = Math.min(1, restartFade + dt / 0.45);
  updateToasts(dt);
  if (upgradePanel.active) { upgradePanel.timer -= dt; if (upgradePanel.timer <= 0) closeUpgradePanel(); }
}

/* ==================================================================
   渲染
   ================================================================== */
function drawStars() {
  let lastC = '';
  for (const s of stars) {
    if (s.c !== lastC) { ctx.fillStyle = s.c; lastC = s.c; }
    ctx.fillRect(s.x | 0, s.y | 0, s.s, s.s);
  }
}

function drawPlayer() {
  if (!player.alive) return;
  if (player.inv > 0 && Math.floor(player.inv * 14) % 2 === 0) return;
  const px = Math.round(player.x) - 4, py = Math.round(player.y) - 4;
  const fx = Math.round(player.x), fy = py + 8, fh = 2 + Math.random() * 3.5;
  ctx.fillStyle = '#ff9f43'; ctx.fillRect(fx - 4, fy, 2, fh); ctx.fillRect(fx + 2, fy, 2, fh);
  ctx.fillStyle = '#fff3b0'; ctx.fillRect(fx - 4, fy, 2, fh * 0.45); ctx.fillRect(fx + 2, fy, 2, fh * 0.45);
  ctx.drawImage(SPR.player, px, py);
  if (player.shield > 0) {
    const r = 10 + Math.sin(state.time * 9) * 1.6;
    const blink = player.shield / SHIELD_MAX < 0.25 ? (Math.floor(state.time * 10) % 2 === 0) : true;
    if (blink) {
      ctx.globalAlpha = 0.40 + Math.sin(state.time * 11) * 0.18;
      ctx.strokeStyle = '#7be9ff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(Math.round(player.x) + 0.5, Math.round(player.y) + 0.5, r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 0.14; ctx.fillStyle = '#7be9ff';
      ctx.beginPath(); ctx.arc(Math.round(player.x) + 0.5, Math.round(player.y) + 0.5, r - 1, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}
function drawDrones() {
  if (!player.alive) return;
  for (const d of drones) {
    const x = Math.round(player.x + d.offX) - 2, y = Math.round(player.y + d.offY) - 2, bob = Math.sin(state.time * 8 + d.offX) * 1;
    /* ⚠️ 必须显式指定目标尺寸：SPR.drone 本体是 16×16 精细网格（与道具栏图标同源），
       这里 3 参数 drawImage 会按原尺寸画成 16px —— 僚机比玩家（9×8）还大一圈。
       僚机是"挂在玩家两侧的小飞机"，画到 7×7 才对；光晕随之扩到 9×9。 */
    ctx.globalAlpha = 0.28 + Math.sin(state.time * 6) * 0.10; ctx.fillStyle = '#4ade80'; ctx.fillRect(x - 1, y - 1 + bob, 9, 9);
    ctx.globalAlpha = 1; ctx.drawImage(SPR.drone, x, Math.round(y + bob), 7, 7);
  }
}
function drawEnemies() {
  for (const e of enemies) {
    const x = Math.round(e.x - e.w / 2), y = Math.round(e.y - e.h / 2);
    if (e.flash > 0) ctx.drawImage(e.white, x, y); else ctx.drawImage(e.sprite, x, y);

    /* 护盾机的护盾弧：画在**有护盾的那一侧**，玩家要看一眼就知道该往哪边绕。
       ⚠️ 减伤是隐形的 —— 不画出来的话，玩家只会觉得"这只怪特别肉"，
       学不到"绕到另一边"这个操作，机制等于没做。
       翻转瞬间加亮（shieldFlip > 0），让"护盾换边了"这件事被看见。 */
    if (e.type === 2 && e.shieldSide != null) {
      const sx = e.x + e.shieldSide * (e.w / 2 + 2);
      const hot = e.shieldFlip > 0;
      ctx.save();
      ctx.globalAlpha = hot ? 1 : 0.75;
      ctx.strokeStyle = hot ? '#ffffff' : '#7be9ff';
      ctx.lineWidth = hot ? 2.2 : 1.6;
      ctx.beginPath();
      ctx.arc(sx, e.y, e.h / 2 + 2, -Math.PI / 2, Math.PI / 2, e.shieldSide < 0);
      ctx.stroke();
      ctx.restore();
    }

    /* 自爆机引信预警：最后 0.4 秒红色闪烁 + 收缩环。
       闪烁频率随时间加快（越接近爆炸闪得越快），这是通用的危险语义，
       不用教学玩家也能懂"它要炸了、快打死它"。 */
    if (e.type === 5 && e.fuse != null && e.fuse > 0 && e.fuse < SUICIDE_WARN) {
      const k = 1 - e.fuse / SUICIDE_WARN;            // 0 → 1
      const blink = Math.sin(state.time * (12 + k * 26)) > 0;
      if (blink) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.35 + k * 0.45;
        ctx.strokeStyle = '#ff3355'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.w / 2 + 5 + (1 - k) * 7, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
    }
  }
}
function drawBoss() {
  if (!boss) return; const b = boss;
  const x = Math.round(b.x - b.w / 2), y = Math.round(b.y - b.h / 2);
  ctx.globalAlpha = 0.18 + Math.sin(b.t * 6) * 0.07; ctx.fillStyle = b.color; ctx.fillRect(x - 4, y - 4, b.w + 8, b.h + 8); ctx.globalAlpha = 1;
  if (b.flash > 0) ctx.drawImage(b.white, x, y, b.w, b.h); else ctx.drawImage(b.sprite, x, y, b.w, b.h);
}
/* 电弧：三层叠加（外辉光 / 主弧 / 白芯）+ 分叉。
   旧版只有一条抖动的青色线 —— 在弹幕里几乎看不见，
   而电弧是"链式闪电"，视觉上必须比子弹更抢眼才能体现它的跳跃感。

   抖动是**沿线段法线方向**的，不是随机偏移圆心：
   沿法线抖才像电流在导体间窜动，随机偏移看着像画歪了。 */
function drawArcs() {
  const useGlow = glowOn();
  for (const a of arcs) {
    const alpha = Math.max(0, a.life / a.max);
    const pts = [];
    for (let i = 0; i < a.pts.length; i++) {
      const p = a.pts[i];
      if (i === 0) { pts.push({ x: p.x, y: p.y }); continue; }
      const prev = a.pts[i - 1];
      const dx = p.x - prev.x, dy = p.y - prev.y, d = Math.hypot(dx, dy) || 1;
      const nx = -dy / d, ny = dx / d;                       // 法线
      const j = (Math.random() - 0.5) * 5;
      pts.push({ x: p.x + nx * j, y: p.y + ny * j });
    }
    const path = () => {
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    };
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (useGlow) {                       // ① 外辉光：宽而软
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = hexA('#7be9ff', 0.30); ctx.lineWidth = 7; path(); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = '#7be9ff'; ctx.lineWidth = 2.5; path(); ctx.stroke();   // ② 主弧
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; path(); ctx.stroke();      // ③ 白芯
    // ④ 分叉：从每个节点甩出一小段，表现"链式"的分支
    if (useGlow && pts.length > 1) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = hexA('#7be9ff', 0.45); ctx.lineWidth = 1.2;
      for (let i = 1; i < pts.length; i++) {
        const ang = Math.random() * Math.PI * 2, len = 3 + Math.random() * 5;
        ctx.beginPath();
        ctx.moveTo(pts[i].x, pts[i].y);
        ctx.lineTo(pts[i].x + Math.cos(ang) * len, pts[i].y + Math.sin(ang) * len);
        ctx.stroke();
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}
/* ==================================================================
   武器弹幕特效
   ==================================================================
   旧实现的根本问题：六种武器**都是"一个竖着的彩色矩形"**，只差颜色和尺寸。
   弹幕游戏里同屏几十发在飞，玩家没有余裕去分辨颜色 —— 形态必须先于颜色被识别。

   重改的三条原则：
     ① **形态区分**：每种武器有独立轮廓（尖锥 / 长刃 / 扇形粒 / 带翼弹头 / 十字刃）
        不看颜色也能立刻认出"这是我当前那把枪在打"
     ② **运动拖尾**：按速度矢量把弹体向后拉伸。子弹速度 300~430px/s，
        画成静态贴纸就没有速度感 —— 而速度感是这个类型的核心手感
     ③ **发光分层**：复用现有 GLOW_KINDS 材质。暗色太空里发光才是"醒目"，
        实心色块会被背景吃掉

   ⚠️ 性能：拖尾与发光都过 quality 门限（见 trailOn / glowOn），
   低画质档退化为实心弹体。弹幕密集时同屏上百发，全特效会拖垮低端机。 */
function trailOn() { return quality >= 0.7; }     // 拖尾：低画质关闭
function glowOn()  { return quality >= 0.5; }     // 辉光：最低画质才关

/* 拖尾：沿速度反方向拉出一条渐隐的楔形。
   用 fillRect 拉伸而不是画多段残影 —— 后者在 100+ 子弹时是几十倍开销。 */
function drawTrail(x, y, vx, vy, len, w, color) {
  const sp = Math.hypot(vx, vy) || 1;
  const ux = -vx / sp, uy = -vy / sp;             // 单位反方向
  const ex = x + ux * len, ey = y + uy * len;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createLinearGradient(x, y, ex, ey);
  g.addColorStop(0, hexA(color, 0.55));
  g.addColorStop(0.55, hexA(color, 0.18));
  g.addColorStop(1, hexA(color, 0));
  ctx.fillStyle = g;
  /* 楔形而非矩形：根部宽、尾端尖。
     矩形拖尾看着像"后面贴了张纸"，楔形才有被拉长的速度感。 */
  ctx.beginPath();
  ctx.moveTo(x - uy * w, y + ux * w);
  ctx.lineTo(x + uy * w, y - ux * w);
  ctx.lineTo(ex, ey);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ===== 枪口闪光 =====
   发射瞬间在机头闪一下。
   旧版完全没有发射反馈 —— 听得到声音、看得到子弹出现，
   但"枪响了"这个瞬间在画面上没有落点，打击感因此弱一截。
   容量 12：连射武器射速 0.11s、闪光只活 0.1s，十来个足够覆盖。 */
const MUZZLE_CAP = 12;
let muzzles = [];
function spawnMuzzle(x, y, color, scale) {
  if (muzzles.length >= MUZZLE_CAP) muzzles.shift();
  muzzles.push({ x, y, color, life: 0.1, max: 0.1, scale: scale || 1 });
}
function updateMuzzles(dt) {
  for (let i = muzzles.length - 1; i >= 0; i--) {
    muzzles[i].life -= dt;
    if (muzzles[i].life <= 0) muzzles.splice(i, 1);
  }
}
function drawMuzzles() {
  if (!muzzles.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const m of muzzles) {
    const k = m.life / m.max;                 // 1 → 0
    const r = (3 + m.scale * 2.5) * (1.4 - k * 0.4);
    ctx.globalAlpha = k;
    ctx.drawImage(getGlowSprite(m.color, 'spark'), m.x - r, m.y - r, r * 2, r * 2);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawBullets() {
  const useTrail = trailOn(), useGlow = glowOn();
  for (const b of bullets) {
    const x = Math.round(b.x), y = Math.round(b.y);
    const crit = b.crit;

    if (b.laser) {
      /* 激光：细长刃 + 强拖尾。它是最快的（430px/s），
         拖尾要给足长度才对得上"穿透高伤"的定位。 */
      const col = crit ? '#ffffff' : '#ff4d6d';
      if (useTrail) drawTrail(x, y, b.vx, b.vy, 26, crit ? 3.4 : 2.6, col);
      if (useGlow) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.drawImage(getGlowSprite(col, 'spark'), x - 7, y - 8, 14, 16);
        ctx.restore();
      }
      /* ⚠️ 刃身长度必须读 LASER_HALF，不能写死 8/17：
         写过 HEAD 那次"命中区写死、绘制算出来"导致全屏点不动的教训 ——
         判定与绘制各写一份数字，改一处漏一处就会出现
         "看着扫过去了却没伤害"。这里全长 = LASER_HALF*2 = 24。 */
      ctx.fillStyle = col; ctx.fillRect(x - (crit ? 2 : 1.5), y - LASER_HALF, crit ? 4 : 3, LASER_HALF * 2);
      ctx.fillStyle = '#ffd166'; ctx.fillRect(x - 1, y - 6, 2, 13);

   现在拆成四种材质，用同一套光但不同的衰减曲线与尺寸：
     halo   光晕：大、软、低频。中心都不实，用于面板环境光/背景氛围
     spark  锐光：小、硬、高频。中心实心、衰减陡，用于火花与关键指示
     volume 体积光：介于两者，靠多层叠加产生"厚度"，用于主按钮/能量槽
     sheen  流光：不是径向！方向性线性光带，用于进度条流动与边框能量

   不是为了让更多东西发光。 */
const GLOW_KINDS = {

  halo:   [16, [[0, 0.40], [0.35, 0.17], [0.70, 0.05], [1, 0]]],
  spark:  [8,  [[0, 1], [0.20, 0.72], [0.45, 0.28], [0.75, 0.06], [1, 0]]],
  volume: [12, [[0, 0.90], [0.25, 0.46], [0.55, 0.13], [1, 0]]]

    const g = c.getContext('2d');

    for (const [stop, a] of def[1]) grad.addColorStop(stop, hexA(color, a));

/* 圆角矩形周长上的点：把周长参数 s 映射到四边 + 四角圆弧。

function perimeterPoint(x, y, w, h, r, s) {
  const rr = Math.min(r, w / 2, h / 2);
  const straightW = w - 2 * rr, straightH = h - 2 * rr;
  const arcQ = (Math.PI * rr) / 2;              // 每个圆角弧长
  const segs = [straightW, arcQ, straightH, arcQ, straightW, arcQ, straightH, arcQ];
  let acc = 0, idx = 0;
  for (let i = 0; i < segs.length; i++) {
    if (s <= acc + segs[i] || i === segs.length - 1) { idx = i; break; }
    acc += segs[i];
  }
  const local = Math.max(0, Math.min(segs[idx], s - acc));
  const u = segs[idx] > 0 ? local / segs[idx] : 0;
  switch (idx) {
    case 0: return [x + rr + straightW * u, y];                                  // 上边
    case 1: { const a = -Math.PI / 2 + u * Math.PI / 2; return [x + w - rr + Math.cos(a) * rr, y + rr + Math.sin(a) * rr]; }
    case 2: return [x + w, y + rr + straightH * u];                              // 右边
    case 3: { const a = 0 + u * Math.PI / 2; return [x + w - rr + Math.cos(a) * rr, y + h - rr + Math.sin(a) * rr]; }
    case 4: return [x + w - rr - straightW * u, y + h];                          // 下边
    case 5: { const a = Math.PI / 2 + u * Math.PI / 2; return [x + rr + Math.cos(a) * rr, y + h - rr + Math.sin(a) * rr]; }
    case 6: return [x, y + h - rr - straightH * u];                              // 左边
    default: { const a = Math.PI + u * Math.PI / 2; return [x + rr + Math.cos(a) * rr, y + rr + Math.sin(a) * rr]; }
  }
}

function drawParticles() {

const PIXEL_ICON_CACHE = new Map();
/* ⚠️ 缓存 key 必须含 size，且离屏**按目标尺寸**用 drawPixelGrid 渲染：
   先画 1:1 网格再用 drawImage 拉伸的做法，在非整数倍缩放下（金币 r=5 → 10px
   来自 8px 源 = 1.25×）会让相邻像素宽度不均（有的 1px 有的 2px），图标发虚。
   按目标尺寸烘好后 drawImage 是 1:1 贴图，与原先直接画到主 ctx **逐像素一致**。
   size 取值只有 r*2 的少数几种（芯片 8、金币 10），缓存条目不会膨胀。 */
function getPixelIcon(key, rows, palette, size) {
  let c = PIXEL_ICON_CACHE.get(key);
  if (!c) {
    const S = Math.max(1, Math.round(size));
    c = document.createElement('canvas');
    c.width = S; c.height = S;
    const g = c.getContext('2d');
    drawPixelGrid(g, rows, palette, S / 2, S / 2, S);
    PIXEL_ICON_CACHE.set(key, c);
  }
  return c;
}
function drawChipIcon(cx, cy, r, color) {
  const spr = getPixelIcon('chip|' + color + '|' + (r * 2), CHIP_ROWS, { '1': color, '2': 'rgba(4, 20, 34, 0.85)' }, r * 2);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(spr, Math.round(cx - r), Math.round(cy - r), r * 2, r * 2);
}
function drawCoinIcon(cx, cy, r) {
  const spr = getPixelIcon('coin|' + (r * 2), COIN_ROWS, { '1': '#ffd166', '2': '#a87a10' }, r * 2);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(spr, Math.round(cx - r), Math.round(cy - r), r * 2, r * 2);
}

/* ===== HUD 芯片 / 金币图标 =====
   两者原来都是**几个 fillRect 拼的方块**和 **arc 画的圆** ——
   在 HUD 顶部 4px 半径的尺寸下，圆会被抗锯齿糊成一团，芯片的四个引脚更是
   直接消失（2px 的引脚在缩放后不足半像素）。
   改 8×8 像素网格：引脚、币面竖条这些特征在极小尺寸下也保留得住。 */
const CHIP_ROWS = [
  '.....22.....', '.....22.....', '.1111111111.', '.1333333331.',
  '.1344444431.', '.1344554431.', '.1344554431.', '.1344444431.',
  '.1333333331.', '.1111111111.', '.....22.....', '.....22.....'
];
const COIN_ROWS = [
  '............', '....1111....', '..11333311..', '.1334444331.',
  '133444444331', '133445544331', '133445544331', '133444444331',
  '.1334444331.', '..11333311..', '....1111....', '............'
];
function drawItemBar() {
  /* 为什么：这一栏原来用"一圈道具色描边"说有没有货、用一层 sin 呼吸说满格、用一次
     lighter 加色把整条栏染青说"缓速在跑" —— 三条都在 MD3 的违禁清单上，而且第一、第三条
     换主题根本不会动。现在层级只由容器角色表达（空 surfaceContainerLow / 有货
     surfaceContainerHigh / 生效中 secondaryContainer + check），反馈只由状态层表达。
     格子矩形仍然只读 itemRect(i)：命中判定用的就是它，所以一格都没挪。 */
  if (state.mode !== MODE_PLAY || paused || upgradePanel.active) return;
  /* 键位字面与键盘分支一一对应（7/8/9/0/- 各一格）。旧写法是 String(i + 7)，
     第 4、5 格于是印出 "10""11" 两个根本不存在的键。 */
  const KEYS = ['7', '8', '9', '0', '-'];
  const labelH = mdType('label') + 1;      // 底部信息带：状态记号 + 数量角标
  const keyW = isTouch ? 0 : 6;            // 左侧键位条：触屏没有键盘要提示
  for (let i = 0; i < ITEM_N; i++) {
    const it = ITEM_SLOTS[i], r = itemRect(i);
    const n = itemCounts[i] > 0 ? itemCounts[i] : 0;
    const has = n > 0;
    const eff = it.k === 'slow' && slowT > 0;                       // 生效中 = 选中态
    const waste = has &&                                             // 按了也白费 = 不可用
      ((it.k === 'repair' && state.hp >= state.maxHp) ||
       (it.k === 'barrier' && player.shield >= SHIELD_MAX) ||
       (it.k === 'collect' && powerups.length === 0));
    const cRole = eff ? 'secondaryContainer' : (has ? 'surfaceContainerHigh' : 'surfaceContainerLow');
    const onRole = eff ? 'onSecondaryContainer' : (waste ? 'onSurfaceVariant' : 'onSurface');
    mdSurface(r.x, r.y, r.w, r.h, { role: cRole });
    const pa = mdPressA(r.x, r.y, r.w, r.h);
    if (pa > 0) mdStateLayer(r.x, r.y, r.w, r.h, SHAPE.sm, pa, onRole);
    /* 冷却/生效遮罩 = 状态层，浓度跟着剩余时间走。旧写法是给整条栏叠一层随 sin 呼吸的
       lighter 青色：五个格子一起变色，反而说不清到底是哪一个在生效。 */
    if (eff) mdStateLayer(r.x, r.y, r.w, r.h, SHAPE.sm, STATE.drag * mdClamp(slowT / SLOW_TIME, 0, 1), MD3.onSecondaryContainer);

    const iconH = r.h - labelH, iconW = r.w - keyW;
    const icS = Math.round(Math.min(iconW, iconH) - 1);
    const spr = it.k === 'bomb' ? SPR.bomb
      : it.k === 'slow' ? SPR.slowItem
      : it.k === 'repair' ? SPR.repairItem
      : it.k === 'collect' ? SPR.magnetItem
      : SPR.shieldItem;
    ctx.save();
    try {
      /* 像素精灵保持硬边放大（与武器条的矢量图标同一口径）。
         不可用只降内容不透明度是不够的（暗底上肉眼看不出来），所以另配一枚 error 记号。 */
      ctx.imageSmoothingEnabled = false;
      ctx.globalAlpha = has ? (waste ? 0.72 : 1) : STATE.disabledFg;
      ctx.drawImage(spr, Math.round(r.x + keyW + (iconW - icS) / 2), Math.round(r.y + (iconH - icS) / 2), icS, icS);
    } finally { ctx.restore(); }

    const bandY = r.y + iconH;
    if (!isTouch) {
      mdText(KEYS[i], r.x + 1, mdTextY(r.y, iconH, 'label'), 'label', 'onSurfaceVariant',
        { weight: 600, alpha: has ? 1 : STATE.disabledFg });
    }
    const mk = eff ? 'check' : (waste ? 'warning' : null);
    if (mk) mdIcon(mk, r.x + 5, bandY + labelH / 2, labelH - 1, eff ? 'onSecondaryContainer' : 'error');
    if (has) {
      /* 数量角标钳在信息带的实际余量里：记号占掉的那几像素是从同一份 labelH 算出来的，
         不在别处再写一遍宽度预算。 */
      const txt = itemCountText(n);
      mdText(mdEllipsis(txt, r.w - 2 - (mk ? labelH : 0), 'label', 600), r.x + r.w - 1.5,
        mdTextY(bandY, labelH, 'label'), 'label', onRole, { align: 'right', weight: 600 });
    }
  }
}

function drawWeaponBar() {
  /* 为什么：选中一把武器原来靠"武器色 1.8px 描边 + 一道横扫而过的白色高光带"，
     六格各发各颜色的光 —— 主题色描边当选中态与 sheen 两件违禁品一次占齐。
     MD3 的互斥选择是 secondaryContainer + check，条体本身是 mdBottomBar 的 tonal 面
     （surfaceContainer 比格子的 surfaceContainerHigh 低一级，阶梯才读得出来）。
     命中矩形 BUTTONS.weapon 由 layout 产出，这里一个字段都不写回。 */
  mdBottomBar(H - WB_H, WB_H);
  const labelH = mdType('label') + 1;
  for (let i = 0; i < WEAPON_COUNT; i++) {
    const btn = BUTTONS.weapon[i], w = WEAPONS[i];
    const active = player.weapon === i;
    mdSurface(btn.x, btn.y, btn.w, btn.h, { role: active ? 'secondaryContainer' : 'surfaceContainerHigh' });
    const pa = mdPressA(btn.x, btn.y, btn.w, btn.h);
    if (pa > 0) mdStateLayer(btn.x, btn.y, btn.w, btn.h, SHAPE.sm, pa, active ? MD3.onSecondaryContainer : MD3.onSurface);
    /* 图标是"这把武器长什么样"的样本（与图鉴同一口径），先经 mdLegacyTxt 把六个手写
       十六进制认回角色，切主题时整条栏才会跟着一起换；未选中降 alpha 而不是另配一种灰蓝。
       尺寸按格子反算并留出键位带，旧写法取 btn.w*0.7 让位图上下沿直接越出 26px 的槽。 */
    const iconH = btn.h - labelH;
    const wc = mdLegacyTxt(w.color);
    const ic = getWeaponIcon(i, Math.min(btn.w - 10, iconH - 1), active ? wc : hexA(wc, 0.55));
    ctx.drawImage(ic, Math.round(btn.x + btn.w / 2 - ic.width / 2), Math.round(btn.y + (iconH - ic.height) / 2));
    const bandY = btn.y + iconH;
    if (active) mdIcon('check', btn.x + 7, bandY + labelH / 2, labelH - 1, 'onSecondaryContainer');
    mdText(String(i + 1), btn.x + btn.w - 2, mdTextY(bandY, labelH, 'label'), 'label',
      active ? 'onSecondaryContainer' : 'onSurfaceVariant', { align: 'right', weight: 600 });
  }
}

/* ==================================================================
   UI 绘制基元（MD3）
   入口签名与旧版一致 —— 面板 / 分隔线 / 分区标题是 24 个界面的公共底座，
   在这里换掉实现，上层调用一处都不用改。
     · 底色 → tonal 层级（surfaceContainer…）：层级差靠色阶 + 实心阴影，不透背景
     · 描边 → 只在显式传入时画，且中性线一律 outlineVariant
     · 分隔线 → 1px 实心 hairline
   被删掉的装饰家族：halo 环境光晕 / glow 顶部内高光 / frameCorners 角标 /
   scanSweep 扫描带 / borderFlow 边框流光 / drawVolume 体积光 / sheenBand 流光 /
   drawNumGlow 数字辉光 / drawBarSheen 进度流光。
   M3 的"动"只有 state layer 一条通道，常态必须是静的 ——
   原来每帧常驻几十个 sin 呼吸和十几个渐变对象，结果所有元素都在轻微动，
   于是没有任何一个是重点。
   ================================================================== */
function panel(x, y, w, h, r, opt) {
  opt = opt || {};
  const a = opt.alpha === undefined ? 1 : opt.alpha;
  const bg = mdLegacySurface(opt.bg);
  const surf = bg.role ? mdRole(bg.role) : (bg.raw || MD3.surfaceContainer);
  const level = opt.level === undefined ? bg.level : opt.level | 0;
  /* 铺满整屏的面不叠阴影：它本身就是这一层的"地面"，
     阴影只会在屏幕边缘留下一圈脏边。 */
  const ground = w >= W - 2 && h >= H - 2;
  ctx.save();
  try {
    if (level > 0 && !ground) mdElev(x, y, w, h, r, level);
    ctx.globalAlpha = a;
    fillRoundRect(x, y, w, h, r, surf);
    if (bg.tint) fillRoundRect(x, y, w, h, r, bg.tint);
    if (opt.border) strokeRoundRect(x + 0.5, y + 0.5, w - 1, h - 1, r, mdLegacyLine(opt.border), opt.bw || 1);
  } finally { ctx.restore(); }
}

/* 分隔线：通宽 1px 实心。
   旧版是"两端淡出的渐变线" —— 每帧新建一个渐变对象，而且淡出不是 M3 语言。
   inset 保留：各页用它把线与内容左边距对齐。 */
function divider(y, color, inset) {
  inset = inset === undefined ? 26 : inset;
  mdDivider(inset, y, W - inset * 2, { color: mdLegacyLine(color) });
}

/* 分区标题：M3 用"字阶 + 颜色"分组，不用竖条和渐变尾线。
   字号仍取 label 档（8px）—— 旧 panelHeader 的 6 处调用都把它塞在 11px 高的槽里，
   换成 titleSm(12px) 会溢出。返回值沿用旧的高度，上层纵向排布不受影响。 */
function panelHeader(x, y, w, label, color, opt) {
  opt = opt || {};
  const h = opt.h === undefined ? 11 : opt.h;
  mdText(label, x, y + (h - mdType('label')) / 2, 'label', mdLegacyTxt(color),
    { alpha: opt.alpha === undefined ? 1 : opt.alpha, weight: 600 });
  return h;
}

/* ===== 动画引擎 =====
   之前每个动画都是手写插值，散落各处，时长和曲线全凭手感 ——
   所以按钮、弹窗、HUD 的节奏互不相干，整体显得"各自为政"。
   现在统一：四档时长 + 两条曲线 + 一个进度表。

   曲线只用两条，且**不用弹性曲线**（弹簧感在 UI 里显得廉价）：
     easeOutCubic  入场用：快速到位再慢下来 → 传达"浮现"
     easeInCubic   出场用：慢启动再加速离开 → 传达"让出位置"
   实际实现里出场复用 easeOutCubic(v) 但 v 递减 ——
   easeOut 在 v 大时变化慢，递减时正好是"先慢后快"，无需第二条曲线。

   入场与出场刻意不同形：入场是"进入存在"，出场是"让出位置"，
   用同一个缩放做来回会像橡皮。 */
const T_MICRO = 0.08;    // 按钮按下
const T_QUICK = 0.16;    // HUD 滑入、tab 滑动
const T_PAGE  = 0.24;    // 弹窗、列表项
const T_NARR  = 0.80;    // 新纪录、Boss 出场（叙事类可破例）

function easeOutCubic(t) { const u = 1 - t; return 1 - u * u * u; }

/* 数字滚动：分数从旧值滚到新值，而不是直接跳变。
   这是性价比最高的一处 —— 玩家会盯着数字滚完，注意力自然被留住。
   缓出曲线让末尾慢下来，读数更"稳"；差值过大时提速，避免滚太久。 */
const ROLL_STATE = new Map();
function rollNumber(key, target) {
  let r = ROLL_STATE.get(key);
  if (!r) { r = { v: target, target: target }; ROLL_STATE.set(key, r); return target; }
  r.target = target;
  return r.v;
}
function rollUpdate(dt) {
  for (const r of ROLL_STATE.values()) {
    if (r.v === r.target) continue;
    const diff = Math.abs(r.target - r.v);
    // 速度随差值增大：小差慢慢滚好看，大差必须快否则要滚好几秒
    const speed = Math.max(40, diff * 4.5) * dt * 60 / 60;
    const dir = r.target > r.v ? 1 : -1;
    const stepv = Math.max(1, Math.abs(speed)) * dir;
    r.v = (dir > 0) ? Math.min(r.target, r.v + stepv) : Math.max(r.target, r.v + stepv);
    if (Math.abs(r.target - r.v) < 1) r.v = r.target;
  }
}
function rollInstant(key) { const r = ROLL_STATE.get(key); if (r) r.v = r.target; }

/* HUD 滑入：血条从左、能量从右、波次从右，方向不同才不会被看成一坨。
   alpha 与位移同步，160ms（T_QUICK）走完。 */
function pushHudAnim(key, dx) {
  const e = easeOutCubic(Math.max(0, Math.min(1, animV(key))));
  ctx.save();
  if (e < 1) {
    ctx.globalAlpha = e;
    ctx.translate((1 - e) * dx, 0);
  }
  return e;
}
function popHudAnim() { ctx.restore(); ctx.globalAlpha = 1; }
function easeInCubic(t) { return t * t * t; }

const ANIMS = new Map();
/* 设定目标：0=关闭 1=打开。首次注册时从"已到位"的另一端起步，
   这样打开才有动画可看（而不是瞬间就位）。 */
function animSet(key, target, dur) {
  let a = ANIMS.get(key);
  if (!a) {
    a = { v: target >= 1 ? 0 : 1, target: target, dur: dur || T_PAGE };
    ANIMS.set(key, a);
  } else {
    a.target = target;
    if (dur) a.dur = dur;
  }
}
function animUpdate(dt) {
  for (const a of ANIMS.values()) {
    const sp = dt / (a.dur || T_PAGE);
    if (a.v < a.target) a.v = Math.min(a.target, a.v + sp);
    else if (a.v > a.target) a.v = Math.max(a.target, a.v - sp);
  }
  /* 补间引擎与 ANIMS 在同一时机推进：
     两套系统若各自挑时机更新，同一帧内可能出现"旧系统已到位、新系统还差一帧"的错位，
     表现为按钮按下去和弹回来不同步。 */
  Anim.update(dt);
}
function animV(key) { const a = ANIMS.get(key); return a ? a.v : 1; }
function animDone(key) { const a = ANIMS.get(key); return !a || a.v === a.target; }
// 打断：立刻跳到终态。任何动画都必须支持，否则中途按 ESC 会卡在半开状态
function animInstant(key) { const a = ANIMS.get(key); if (a) a.v = a.target; }

/* 弹窗进出场变换：调用方在绘制前后包一层。
   入场 96%→100% + 上移 8px —— 是"浮现"不是"生成"：
   从中心放大会让人觉得内容是后来才有的，而实际上它一直在。 */
function pushModalAnim(key, invert) {
  const v = Math.max(0, Math.min(1, animV(key)));
  const e = invert ? easeInCubic(v) : easeOutCubic(v);
  ctx.save();
  if (e < 1) {
    ctx.translate(W / 2, H / 2);
    const s = 0.96 + 0.04 * e;
    ctx.scale(s, s);
    ctx.translate(-W / 2, -H / 2 + (1 - e) * 8);
  }
  ctx.globalAlpha = e;
  return e;
}
function popModalAnim() { ctx.restore(); ctx.globalAlpha = 1; }


// 状态角标行：最多 4 枚 MD3 tonal chip，放不下从尾部丢弃（优先级已在入列时排好）
function drawStatusChips() {
  /* 为什么：状态角标在 M3 里就是 tonal chip —— 容器色 + onXxxContainer 文字。
     旧写法是"钉死暗底 + 状态色描边"：那圈边不随主题变，而且描边胶囊读起来是"被选中"，
     可状态不是选中项。容器家族按语义分派，一眼能分清"这是哪类东西"：
     环境规则 = secondary / 拾取增益 = primary / 拾取减益 = error / 道具 buff = tertiary。 */
  const chips = [];
  /* 护盾不进胶囊：HUD 血条下方已有护盾条显示同一数值，
     两处同时显示是同信息重复占位，还白占一个胶囊名额（上限 4 个）。 */
  /* 环境状态排**最前**：它常驻整个地带且直接改变打法（冰封要提前走位、熔炉要更保守），
     比 12 秒的临时状态更需要被先看到。 */
  const hz = envStatus();
  if (hz) chips.push({ t: hz.name, role: 'secondary' });
  /* ratio = 剩余时间比例，用于画环形消退。
     秒数在弹幕里几乎没人读（要看清得盯着数字），
     但"环还剩多少"是余光就能感知的 —— 这才是战斗中真正被读到的信息。 */
  if (statusId && statusT > 0) {
    const st = STATUSES.find(x => x.id === statusId);
    if (st) chips.push({ t: (st.good ? '+' : '-') + st.name,
      role: st.good ? 'primary' : 'error', ratio: statusT / STATUS_DUR });
  }
  if (player.spread > 0) chips.push({ t: '散射', role: 'tertiary', ratio: player.spread / 10 });
  if (magnet > 0)      chips.push({ t: '磁力', role: 'tertiary', ratio: magnet / 10 });
  if (drones.length)   chips.push({ t: '僚机', role: 'tertiary' });

  /* ===== 几何（Z4 行，仍占 HUD 右侧空档 x 90~215）=====
     minX/maxX/间距/上限 4 全部原样。只有行带从 22~34 上移到 20~32：
     旧带底 34 正好压在护盾行数值（x 91 起，字带 32~40）上，而 drawStatusChips
     排在 drawSubStatBar 之后 —— 吃到护盾时"还剩几点盾"会被 chip 盖掉半格。
     上移 2px 让开这一列，四条状态条的竖向对齐分账不受影响。
     STATUS_CHIP_BOTTOM 是本行唯一的对外出口（帧数面板按它排 y），随写回一起走。 */
  const y = 20, h = 12, minX = 90, maxX = 215, gap = 4;
  STATUS_CHIP_BOTTOM = y + h;
  /* **右对齐**：先算出所有放得下的 chip 总宽，再从 maxX 往左排。
     ⚠️ 溢出时从尾部丢弃（保留高优先级的）：chips 按重要性入列，
     所以先算宽度、放不下就停止累加 —— 右对齐不等于"优先保留最右边的"。 */
  const laid = [];
  let totalW = 0;
  for (let i = 0; i < chips.length && i < 4; i++) {
    const w = mdTextWidth(chips[i].t, 'label', 600) + 16;      // 16 = 左侧环位 10 + 右内边距 6
    if (laid.length && totalW + gap + w > maxX - minX) break;  // 放不下就丢后面的
    totalW += (laid.length ? gap : 0) + w;
    laid.push({ c: chips[i], w: w });
  }
  let x = maxX - totalW;
  for (let i = 0; i < laid.length; i++) {
    hudStatusChip(x, y, laid[i].w, h, laid[i].c.t, laid[i].c.ratio, laid[i].c.role);
    x += laid[i].w + gap;
  }
}

// 局内 HUD 重排版：
// 顶部单一信息条按「生命 / 波次 / 分数·金币」三区分栏，
// 每个区都有独立底座，避免原来所有文字直接压在半透明条上、弹幕密集时糊成一片
/* ==================================================================
   HUD 静态层离屏缓存
   ------------------------------------------------------------------
   HUD 底板（一层 tonal + 一条 hairline）每帧都要重画 —— 而它与游戏状态**完全无关**：
   除了分辨率和主题色，画出来永远一模一样。
   缓存成位图后每帧只需一次 drawImage。

   ⚠️ 缓存 key 必须包含 宽 / HUD_H / 主题色：三者任一变化都要重建，
   否则换主题或转屏后 HUD 底色还是旧的（这类 bug 表现为"颜色对不上"，
   极容易被当成渲染问题去查半天）。
   ================================================================== */
let HUD_STATIC = null;
function getHudStatic() {
  /* 为什么：这块底板与游戏状态完全无关（只随宽度 / HUD_H / 主题变），每帧重画是白花的
     帧成本 —— 所以离屏缓存保留；改的只是"缓存里必须只说 MD3 角色"。
     ⚠️ key 必须含 宽 / HUD_H / 底板两色：少一项都会表现为"换主题或转屏后底色还是旧的"，
     而那看起来像渲染 bug，能查半天。 */
  const plate = hudPlateRoles();
  const key = W + 'x' + HUD_H + '|' + plate.bg + plate.line;
  if (HUD_STATIC && HUD_STATIC.key === key) return HUD_STATIC.cv;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(W * dpr));
  cv.height = Math.max(1, Math.round(HUD_H * dpr));
  const c = cv.getContext('2d');
  if (!c) return null;                       // 极端环境拿不到 context：退回每帧直画（同一份角色）
  c.scale(dpr, dpr);                         // 内部按逻辑坐标画，输出按 dpr 放大 → 不模糊
  /* 常驻面 = 一层 tonal + 一条 1px hairline：没有渐变，也没有会发光的接缝。 */
  c.fillStyle = plate.bg; c.fillRect(0, 0, W, HUD_H);
  c.fillStyle = plate.line; c.fillRect(0, HUD_H - 1, W, 1);
  HUD_STATIC = { key: key, cv: cv };
  return cv;
}

/* ===== HUD 专用局部件 =====
   为什么写在这里而不是塞进 components.js：这两样都只被局内顶栏用（底板 / 状态角标），
   进组件库会让那一层长出只有 HUD 才有的 API。组件库真正缺的
   （buffer 型进度 mdProgressBuffered、带容器的 tonal chip 变体）记在交付报告里。 */
/* 顶栏底板的两个角色：离屏缓存与"拿不到离屏 context"的降级直画共用同一份。
   两处各写一遍颜色就是本作最高频的 bug 类（预算端与占位端各算一套）。
   取 surfaceContainer 而不是原来的 High：顶栏本质是一块 TopAppBar，而 mdTopAppBar
   用的就是这一档；让出更高两档给"轨道 / chip"，层级才拉得开。 */
function hudPlateRoles() { return { bg: MD3.surfaceContainer, line: MD3.outlineVariant }; }
/* 状态角标 = M3 tonal chip：容器色 + onXxxContainer 文字 + 同一色的消退环。
   role 传家族名（primary/secondary/tertiary/error），容器与文字按命名规律配对取，
   于是整枚 chip 只有一个色相来源 —— 切主题时不会一半跟着一半不动。 */
function hudStatusChip(x, y, w, h, label, ratio, role) {
  const cont = mdRole(role + 'Container'), fg = mdRole('on' + role + 'Container');
  ctx.save();
  try {
    fillRoundRect(x, y, w, h, h / 2, cont);
    const ccx = x + 5, ccy = y + h / 2;
    if (ratio === undefined) {
      /* 实心点 = 常驻、不消退（环境规则）；环 = 限时状态的剩余量。 */
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(ccx, ccy, 2, 0, Math.PI * 2); ctx.fill();
    } else {
      const rr = mdClamp(ratio, 0, 1);
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = hexA(fg, 0.25);          // 轨道是同一个 onContainer 的低浓度，不再钉一层死黑
      ctx.beginPath(); ctx.arc(ccx, ccy, 3, 0, Math.PI * 2); ctx.stroke();
      if (rr > 0.01) {
        ctx.strokeStyle = fg;
        ctx.beginPath(); ctx.arc(ccx, ccy, 3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * rr); ctx.stroke();
      }
    }
    mdText(label, x + 10, mdTextY(y, h, 'label'), 'label', fg, { weight: 600 });
  } finally { ctx.restore(); }
}
function drawHUD() {
  /* 为什么：这是全局唯一的战斗顶栏，旧版在它内部混着 20 个钉死 hex、一块假玻璃 panel()、
     主题色描边当强调、一处 shadowBlur 辉光 —— 换主题只有描边跟着动，层级永远不动。
     现在整块只说 MD3 的三种话：tonal 层级（图底 surfaceContainer → 轨道 Highest →
     chip 用容器家族）、真实 elevation（连击徽标 elev2）、state layer（受伤 / 低血 / 就绪）。 */
  const hudStatic = getHudStatic();
  if (hudStatic) {
    ctx.drawImage(hudStatic, 0, 0, W, HUD_H);        // 静态底板：一次贴图
  } else {
    const plate = hudPlateRoles();                   // 没有离屏 context：直画同一份角色，两条路径不许分叉
    ctx.save();
    try {
      ctx.fillStyle = plate.bg; ctx.fillRect(0, 0, W, HUD_H);
      ctx.fillStyle = plate.line; ctx.fillRect(0, HUD_H - 1, W, 1);
    } finally { ctx.restore(); }
  }

  /* 分区（几何原样，只换画法）
       Z1 信息行 (y 2~16)  波次 chip 6 起 → 芯片 → 金币，分数右对齐到 208，暂停键 214~232
       行1 (y 22~28) 生命   行2 (y 34~38) 护盾   行3 (y 44~48) 过载   行4 (y 54~58) 敌人
       —— 四条的标签 8~30 / 条 30~87 / 数值 91 起 严格竖向对齐（列分账在 drawSubStatBar 内单点定义）
       Z4 状态行 (y 20~32, x 90~215) 与血条同带：它在右侧、血条在左侧
     ⚠️ 分数右对齐到 **208** 而不是 W-9：右上角 214~232 是暂停键，两者都是高频注视点。
     ⚠️ 生命条不显示 "100/100"：横向没有余位，而条长 + 颜色阶梯已经把"还能挨几下"编码清楚了。 */

  // --- 行1：生命（复用 drawSubStatBar，与下方三条完全同构）---
  {
    const hpR = mdClamp(state.hp / state.maxHp, 0, 1);
    const hurt = state.hpFlash > 0;
    /* 三段危险阶梯保留（success → coin → hpLow），但三个值全换成角色：
       hpLow 就是 error（不随主题，玩家对"红=要死了"的条件反射不能被换肤打断）。
       受伤时不再把条刷成白色，改由 opt.flash 走 state layer。 */
    drawSubStatBar(22, '生命', hpR, '',
      hpR > 0.6 ? 'success' : (hpR > 0.3 ? 'coin' : 'hpLow'),
      true, state.lowHp && !hurt, { main: true, flash: hurt });
  }

  drawPauseButton();

  /* Z7（武器指示器）已整体移除：底部武器条已完整显示"图标 + 名称 + 弹药"，
     HUD 里再放一个只装图标的框是纯装饰性空盒子。这块区域现在留白给弹幕。 */

  // --- 行2：护盾（剩余点数 / SHIELD_MAX 满格）---
  drawSubStatBar(32, '护盾', player.shield / SHIELD_MAX,
    String(Math.ceil(Math.max(0, player.shield))),
    'shield', player.shield > 0, player.shield >= SHIELD_MAX);

  // --- 行3：过载（能量蓄能；满了可释放）---
  /* 冷却条：填充度随剩余时间递减到 0 再涨满（1 - ultCd/ULT_CD），数值显示剩余秒数；
     与护盾相反 —— 护盾是"剩余量越多越好"，冷却是"剩余时间越少越好"，
     方向必须反过来，否则玩家会把快结束的冷却看成"快没能量了"。 */
  const ultReady = ultCd <= 0;
  const ultRatio = ultCd > 0 ? 1 - ultCd / ULT_CD : 1;
  drawSubStatBar(42, '过载', ultRatio,
    ultReady ? '就绪' : Math.ceil(ultCd) + 's',
    ultReady ? 'coin' : 'ult', true, ultReady);

  // --- 行4：剩余敌人 ---
  /* 剩余 = 还在排队的 + 已经在场的，分母是本波总数 waveTotal（见定义处说明）。
     Boss 波没有"剩余"概念（只有一只），此时显示"首领"并把条填满，
     避免玩家看到一条空条以为出了 bug。 */
  {
    let ratio = 0, val = '—', col = 'onSurfaceVariant', act = false;
    if (boss && !boss.entering) {
      ratio = mdClamp(boss.hp / boss.maxhp, 0, 1); val = '首领'; col = 'enemy'; act = true;
    } else if (waveTotal > 0) {
      const left = waveQueue.length + enemies.length;
      ratio = mdClamp(left / waveTotal, 0, 1);
      val = left + '/' + waveTotal;
      col = left === 0 ? 'success' : 'warning';
      act = left > 0;
    }
    drawSubStatBar(52, '敌人', ratio, val, col, act, false);
  }

  /* ===== Z1 顶部信息行 =====
     波次 / 芯片 / 金币 / 分数 一字排开在**顶部**，暂停键在右上（214~232），
     于是自上而下是单一纵向流：Z1 信息行 → Z4 状态行 → 四条状态条。
     波次用 assist chip（容器 + hairline），不再套一块 panel() 假玻璃。
     ⚠️ 右侧三项按**量出来的字宽**从左往右排：旧写法把数字钉在 80 / 148 两个 x 上，
     金币从 3 位涨到 5 位就会一路顶到分数的左边界（208 - 39 = 169）。 */
  {
    const chipStr = String(progress.chips);
    const coinStr = String(state.coins);
    /* 分数滚动：从旧值滚到新值而不是直接跳变（玩家会盯着数字滚完）。
       宽度按"6 位"固定算，滚动过程中字宽变化不会把右侧元素推得抖。 */
    const scoreVal = Math.round(rollNumber('score', state.score));
    const scoreStr = String(scoreVal).padStart(6, '0');
    const rowY = 2, rowH = 14, nOpt = { weight: 600 };
    const wave = mdChip(6, rowY, '第 ' + state.wave + ' 波', { h: rowH, radius: rowH / 2 });
    let ix = 6 + wave.w + LAYOUT.padSm();
    /* 芯片=方、金币=圆：低头看弹幕的间隙里要靠轮廓分清"哪个是钱、哪个是芯片"，
       所以这两个 8px 像素图标保留（离屏缓存，每帧各一次 drawImage）。 */
    drawChipIcon(ix + 5, rowY + rowH / 2, 5, MD3.chip);
    ix += 12;
    mdText(chipStr, ix, mdTextY(rowY, rowH, 'body'), 'body', 'coin', nOpt);
    ix += mdTextWidth(chipStr, 'body', 600) + LAYOUT.padSm();
    drawCoinIcon(ix + 5, rowY + rowH / 2, 5);
    ix += 12;
    mdText(coinStr, ix, mdTextY(rowY, rowH, 'body'), 'body', 'coin', nOpt);
    /* 分数是全局最重要的数字 → bodyLg（其余数字 body），色用 onSurface：
       它是读数不是资源，不该跟着金币一起染成 coin。 */
    mdText(scoreStr, 208, mdTextY(rowY, rowH, 'bodyLg'), 'bodyLg', 'onSurface',
      { align: 'right', weight: 700 });
  }

  /* ===== 连击徽标 =====
     为什么：旧版靠 shadowBlur=10 的辉光把 "X12" 从弹幕里捞出来 —— 那是 MD3 没有的通道，
     而且辉光不随主题变。替代做法是"把字放进一层不透明 tonal 面里"（M3 对"浮在画面上的一次性
     读数"的标准答案就是一张 elevation 2 的面）。三行的落位（top / +18 / +30）与衰减条节奏
     原样保留：这块带子与 Boss 血条（HUD_H+10 起）是协商过的。 */
  if (combo >= 2 && comboTimer > 0) {
    const big = combo >= 20;
    const tRole = big ? 'headSm' : 'titleSm';
    const top = big ? HUD_H + 6 : HUD_H + 8;
    const label = 'X' + combo;
    const showWord = combo >= 5;
    const innerW = Math.max(mdTextWidth(label, tRole, 700),
      showWord ? mdTextWidth('COMBO', 'label', 600) : 0);
    const pad = LAYOUT.padSm();
    const barY = top + (showWord ? 30 : 18);
    const bw = Math.max(34, innerW) + pad * 2, bx = (W - bw) / 2;
    ctx.save();
    try {
      ctx.globalAlpha = Math.min(1, comboTimer / 0.6);        // 只剩 0.6s 时整块一起淡出
      mdCard(bx, top - 3, bw, barY + 4 - top + 6, { role: 'surfaceContainerHigh', elev: 2, tint: false });
      mdText(label, W / 2, top, tRole, 'coin', { align: 'center', weight: 700 });
      if (showWord) mdText('COMBO', W / 2, top + 18, 'label', 'warning', { align: 'center', weight: 600 });
      mdProgress(bx + pad, barY, bw - pad * 2, 4, comboTimer / COMBO_WINDOW,
        { trackRole: 'surfaceContainerHighest', role: 'coin' });
    } finally { ctx.restore(); }
  }

  // 引导条：在 HUD 与特效之上、弹窗之下
  drawTutorial();

  /* FPS 面板**不在这里画**：它排在本函数之内会让 Boss 血条整块盖掉它，
     已移到 render() 最后统一调用（见 drawFps 内注释）。
     它按 STATUS_CHIP_BOTTOM 让位，所以 Z4 行带上移时帧数面板自动跟。 */

  // 状态胶囊：只显示"当前激活"的状态，未激活不占位 —— 比原来一排无字色块更详细也更干净
  drawStatusChips();
  drawItemBar();
  drawToasts();

  /* --- 右下：当前武器名 / 回旋镖计数 / 火力等级 ---（局内武器条之上的三行辅助读数）
     火力等级改成 mdSegments 离散格：旧写法每级加一根 5px 小方块，玩家看不出上限在哪；
     四格定死后"Lv.4 满"这件事第一次变得可见（player.power 的硬上限就是 4）。 */
  const sy = H - WB_H - 12;
  if (player.weapon === 5) mdText('回旋镖 x' + player.boomCount, W - 6, sy - 18, 'label', 'tertiary', { align: 'right', weight: 600 });
  mdText(WEAPONS[player.weapon].name, W - 6, sy - 5, 'label', mdLegacyTxt(WEAPONS[player.weapon].color), { align: 'right', weight: 600 });
  mdSegments(W - 6 - 26, sy + 4, 26, 3, 4, { filled: player.power, role: 'primary', gap: 2 });
}

function drawBossHealth() {
  /* 为什么：原条 = 一块手写暗底 + 三条硬刻痕 + 末端一枚 lighter 锐光 + 半血一圈白描边。
     锐光与白边是违禁通道，刻痕读起来像尺子而不像"还剩几管"。
     现在：条体 mdProgress、"分几管" mdSegments（两段共用它反推出的同一份 cw/gap，
     不在这里再乘一遍宽度），半血升阶用一次性状态层衰减。
     bx / bw / by 三个锚点表达式逐字保留 —— 本函数不产出命中区，改它们只会去抢顶栏的地方。 */
  if (!boss) return;
  const ratio = mdClamp(boss.hp / boss.maxhp, 0, 1);
  const bw = W - 52, bx = 26, by = HUD_H + 10;
  const BH = 8;
  /* PH = 2 不是审美选择：首领只有二阶段（boss.phase2 在血量 50% 处翻转，见 boss AI 段），
     所以"两管"就是"两个阶段"，一格对应一次升阶。 */
  const PH = 2;
  /* 三段阈值沿用旧分档（60% / 30%），但换成语义角色：生命=primary、警戒=warning、濒危=error。
     旧第一段直接吃 boss.color —— 那是三只首领各一枚的钉死色，切主题纹丝不动。 */
  const hpRole = ratio > 0.6 ? 'primary' : (ratio > 0.3 ? 'warning' : 'error');
  const seg = mdSegments(bx, by, bw, BH, PH, { gap: 3, filled: 0, emptyRole: 'surfaceContainerHighest' });
  const tubes = seg ? PH : 1, cw = seg ? seg.cw : bw, gap = seg ? seg.gap : 0;
  for (let i = 0; i < tubes; i++) {
    /* 第 i 管管 [i/PH,(i+1)/PH] 那一段：右管先空、左管后空 ——
       条长答"还剩多少"，空掉几管答"打过了几个阶段"。 */
    mdProgress(bx + i * (cw + gap), by, cw, BH, mdClamp((ratio - i / tubes) * tubes, 0, 1),
      { role: hpRole, trackRole: 'surfaceContainerHighest' });
  }
  if (boss.phaseFlash > 0) {
    /* 升阶是一次性事件（0.3 秒衰减），所以用状态层而不是描边：MD3 里没有"白边闪一下"。 */
    mdStateLayer(bx, by, bw, BH, SHAPE.xs, STATE.drag * mdClamp(boss.phaseFlash / 0.3, 0, 1), MD3.onSurface);
  }
  /* 名称与读数并成一行放在条子下面。旧写法把名称画在 by - 12（=62），
     正压在 HUD 的下沿上（HUD_H=64 有一条 hairline），换字阶后更会把那条线糊掉。
     左右各占半行、中央让出一格：那一格是顶栏连击徽标的地盘。**这 18 不是审美值**，
     是实测出来的（combo=12 强开、drawHUD 真画一遍后的墨迹边界）：
       "X12"  x108.1→131.9 y72→83（压在条带里，见 leftover）
       "COMBO" x103.2→136.8 y90→98  ← 与本行同带，右沿距中心 16.9
       衰减条 x90→150 y102→106（在本行之下）
     取 18 = 16.9 + 呼吸。半宽从同一份 bw 反推，不在别处再乘一遍：两个宿主在同一行里
     各写各的 x 就是"预算端与占位端各写一遍"。实测本行左沿 86.9 / 右沿 144.4，
     与徽标留 16.3 / 7.6 的空隙。
     装不下四位血量的"绝对值 · 百分比"时退回只显示百分比 —— 宁可少一个数字，
     也不让读数被徽标切成半截。 */
  const rowY = by + BH + 3, rowH = mdType('titleSm');
  const slotHalf = 18;                       // 中央让给顶栏徽标的半宽，来源见上
  const halfW = Math.max(10, (bx + bw) - (W / 2 + slotHalf));
  const pct = Math.round(ratio * 100) + '%';
  const full = Math.ceil(Math.max(0, boss.hp)) + '/' + boss.maxhp + ' · ' + pct;
  const val = mdTextWidth(full, 'label', 600) <= halfW ? full : pct;
  mdText(mdEllipsis('首领 · ' + boss.name, halfW, 'titleSm', 600),
    bx, rowY, 'titleSm', 'onSurface', { weight: 600 });
  mdText(val, bx + bw, mdTextY(rowY, rowH, 'label'), 'label', 'onSurfaceVariant',
    { align: 'right', weight: 600 });
}
/* ==================================================================
   左下角状态提示（toast）
   ==================================================================
   拾取道具 / 超载就绪这类"发生了什么"的事件，需要一个不打断操作的位置。
   banner 在屏幕正中偏上（HUD 下方），是给**波次切换**这种全屏级事件用的 ——
   吃个血包也用 banner 会把弹幕挡住，而且玩家根本不会抬头去看。
   左下角是弹幕游戏里视线余光能覆盖、又几乎不会挡住来敌的位置。

   设计要点：
     · 3 秒自动消失，不需要玩家处理（不是弹窗，没有"关闭"）
     · **最新在底部**：新提示出现的位置固定，眼睛不用重新找
     · 同名提示刷新计时并累加次数（连吃三个血包显示"×3"而不是刷三行）
     · 最多 4 条，超出丢最旧的 —— 连续事件不该把屏幕堆满 */
const TOAST_LIFE = 3, TOAST_MAX = 4;
let toasts = [];
function pushToast(text, sub, color) {
  const last = toasts[toasts.length - 1];
  if (last && last.text === text) {
    last.life = TOAST_LIFE;                    // 同名刷新，避免刷屏
    last.count = (last.count || 1) + 1;
    last.sub = sub || last.sub;
    return;
  }
  toasts.push({ text: text, sub: sub || '', color: color || '#8ab4d8',
    life: TOAST_LIFE, max: TOAST_LIFE, count: 1, born: state.time });
  if (toasts.length > TOAST_MAX) toasts.shift();
}
function updateToasts(dt) {
  for (let i = toasts.length - 1; i >= 0; i--) {
    toasts[i].life -= dt;
    if (toasts[i].life <= 0) toasts.splice(i, 1);
  }
}
/* toast = 底部轨道上的一叠 mdSurface 容器（neutral/success/warning/error 四档 tone），
   正文 + 副行 + mdBadge 计数，宽度逐条实量。
   为什么：旧版每块都是 rgba(8,18,30,.88) 的钉死暗玻璃 + hexA(t.color,.5) 的主题色描边 +
   左端 3px 色条 —— 三层"颜色自己解释自己"，切主题只有那圈描边会动。现在语义只由容器角色
   表达（危险=errorContainer），文字一律配对的 onXxx，落点与引导气泡同一条轨道所以不再叠字。 */
function drawToasts() {
  if (!toasts.length) return;
  if (state.mode !== MODE_PLAY || paused || upgradePanel.active) return;
  const h = hintToastH(), gap = hintGap(), pad = LAYOUT.padSm();
  /* 装不下就明说"+N 条"（H8 禁止静默丢内容）：H=320 且横幅/成就弹条都在时，
     顶部轨道与引导气泡之间只剩三行的缝，旧版是继续往上堆、直接压到横幅上。 */
  const ceil = hintTopBottom();
  const labelH = mdType('label');
  /* slot 0 贴底（引导气泡正上方），越靠上越早 —— MD3 底部锚定的 snackbar 叠法：
     新的一条落在锚点上，把旧的往上推。旧版是反的（新的往上冒、最旧的停在锚点被先吃掉），
     于是"最新一条"的位置每来一条都在动。 */
  const shownFits = (n) => hintToastY(n - 1, h) >= ceil &&
    (n === toasts.length || hintToastY(n - 1, h) - gap - labelH >= ceil);
  let vis = toasts.length;
  while (vis > 1 && !shownFits(vis)) vis--;
  if (vis < toasts.length) {
    /* 与 toast 栈同一条左基线：这条说明是栈的一部分，右对齐会飘成一句无关的旁白 */
    mdText('更早 ' + (toasts.length - vis) + ' 条', hintSafeL(),
      hintToastY(vis - 1, h) - gap - labelH, 'label', 'onSurfaceVariant', { weight: 400 });
  }
  for (let i = toasts.length - vis; i < toasts.length; i++) {
    const t = toasts[i];
    const slot = toasts.length - 1 - i;                 // 最新（数组末尾）在 slot 0 = 最下
    const y = hintToastY(slot, h);
    /* 入场滑入 / 退场淡出：进度仍由 toasts[].life 这份调用方状态算出来 */
    const inT = mdClamp((TOAST_LIFE - t.life) / 0.18, 0, 1);
    const ease = 1 - Math.pow(1 - inT, 3);
    const alpha = mdClamp(t.life / 0.4, 0, 1) * ease;
    if (alpha <= 0) continue;
    const tone = HINT_TONE[hintTone(t.color)];
    const countS = t.count > 1 ? 'x' + t.count : '';
    /* badgeW 镜像 mdBadge 自己的度量（max(12, 文字宽 + 6)）：组件不返回矩形，
       调用方只能按同一式子预留 —— 已写进 componentRequests。 */
    const badgeW = countS ? Math.max(12, mdTextWidth(countS, 'label', 600) + 6) : 0;
    const inner = Math.max(20, hintMaxW() - pad * 2 - (badgeW ? badgeW + 4 : 0));
    const textS = mdEllipsis(t.text, inner, 'body', 500);
    const textW = mdTextWidth(textS, 'body', 500);
    const subS = t.sub ? mdEllipsis(t.sub, Math.max(10, inner - textW - 4), 'label', 400) : '';
    const subW = subS ? mdTextWidth(subS, 'label', 400) + 4 : 0;
    const w = Math.min(hintMaxW(), pad * 2 + textW + subW + (badgeW ? badgeW + 4 : 0));
    const x = hintSafeL();
    ctx.save();
    try {
      ctx.globalAlpha = alpha;
      ctx.translate((1 - ease) * -LAYOUT.pad(), 0);     // 从左滑入（旧版 -14 = LAYOUT.pad()）
      mdSurface(x, y, w, h, { role: tone.bg, radius: SHAPE.xs });
      mdText(textS, x + pad, mdTextY(y, h, 'body'), 'body', tone.fg, { weight: 500 });
      if (subS) {
        /* 副行的弱化用 hexA(role,.78) 而不是 opt.alpha：外层已经压了整条 toast 的
           globalAlpha，opt.alpha 会把它**覆盖**成固定值，淡出时副行会掉队。 */
        mdText(subS, x + pad + textW + 4, mdTextY(y, h, 'label'), 'label',
          hexA(mdRole(tone.fg), 0.78), { weight: 400 });
      }
      if (badgeW) mdBadge(x + w - pad - badgeW / 2, y + h / 2, countS, 'tertiaryContainer');
    } finally { ctx.restore(); }
  }
}

/* 波次横幅 = mdBanner（tonal 容器 + 图标 + 正文/副行），落点是本包顶部轨道第一格。
   为什么：旧版是"没有容器的两行大字"，字号走 scale=2 的旧体系、颜色是四个调用点各写死的
