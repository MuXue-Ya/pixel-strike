/* 左栏：累计统计卡（只读）。
   主菜单战绩已改为监护屏（drawMonitorPanel），这里**仍用卡片**：
    设置页是只读存档统计，不是一台正在监测的仪器 —— 硬套监护仪会显得噪音过多。 */
function drawSettingsStat(zone, items) {
  const C = SET_CTRL;
  const n = items.length;
  mdCard(22, zone.y, W - 44, zone.h, { role: 'surfaceContainer', radius: SHAPE.lg, elev: 1 });
  if (!n) return zone.y + zone.h + 8;
  const minTile = mdType('bodyLg') + 4;
  let headH = Math.max(mdType('label') + 5, Math.min(22, zone.h * 0.18));
  /* 区高连"标题 + 两行两列"都放不下时，让标题先走。
     丢四个数里的三个（旧行为：break 掉行）会让玩家以为没记录；
     丢一个分组标题不会 —— 这一屏本来就钉在「设置」标题栏下面。 */
  if (zone.h < headH + minTile * 2 + C.GAP + 10) headH = 0;
  if (headH) mdText('本机数据', 22 + LAYOUT.pad(), zone.y + (headH - mdType('label')) / 2, 'label', 'primary', { weight: 600 });
  const padT = zone.y + headH + (headH ? 0 : 4);
  const innerH = zone.y + zone.h - 6 - padT;
  const needTile = mdType('body') + 3;
  let cols = (innerH - C.GAP * (n - 1)) / n >= needTile ? 1 : 2;
  const rows = Math.ceil(n / cols);
  /* 两列时每格的横向预算本来就紧：卡片再缩进 12，「最高分」就会被六位数的
     分数挤成「最…」。窄格把缩进收到 8 —— 少 8px 空白换回三个能读的字。 */
  const inset = cols === 1 ? 12 : 8;
  const fullW = W - 44 - inset * 2;
  const cardW = cols === 1 ? fullW : Math.floor((fullW - 6) / 2);
  let gap = cols === 1 ? C.GAP : Math.min(C.GAP, 6);
  /* 高度**照实分**，不套下限：套了下限就会把最后一行顶出分区，
     然后被 break 丢弃——矮屏上"少一行数据"就是这么来的。
     真放不下就先收行距，行距比数据值钱。 */
  let cardH = (innerH - gap * (rows - 1)) / rows;
  if (cardH < needTile && rows > 1) {
    gap = Math.max(2, (innerH - needTile * rows) / (rows - 1));
    cardH = (innerH - gap * (rows - 1)) / rows;
  }
  for (let i = 0; i < n; i++) {
    const col = cols === 1 ? 0 : i % 2, row = cols === 1 ? i : (i / 2) | 0;
    const y = padT + row * (cardH + gap);
    if (y + Math.min(cardH, needTile) > zone.y + zone.h - 2) break;
    drawSetStatRow(22 + inset + col * (cardW + gap), y, cardW, cardH, items[i][0], items[i][1], items[i][2]);
  }
  return zone.y + zone.h + 8;
}

/* 单行统计：标签暗压在左，数值亮浮在右，中间渐变线衔接。
   竖排四张卡比横排四列更适合"设置页里的附属信息"——它不该抢走整屏宽度。 */
function drawSetStatRow(x, y, w, h, label, value, color) {
  /* 只读统计行 = 一层容器 + 左标签 + 右数值。竖色条/渐变接缝/端点辉光都已删：
     MD3 的分组靠 tonal 层级，不靠颜色噪音。数值颜色经 mdLegacyTxt 认回角色，
     于是它跟着主题走，而不是钉死在某个十六进制上。 */
  mdSurface(x, y, w, h, { role: 'surfaceContainerHigh', radius: SHAPE.sm });
  /* 数值用大一号是有条件的：窄格里「000000」能吃掉 44px，
     留给标签的就不够三个字了 —— 挤的时候标签与数值同字号。 */
  const vRole = (h >= 14 && w >= 100) ? 'bodyLg' : 'body';
  const vw = mdTextWidth(String(value), vRole, 600);
  const lw = Math.max(10, w - LAYOUT.padSm() * 2 - vw - 6);
  mdText(mdEllipsis(label, lw, 'body', 400), x + LAYOUT.padSm(), mdTextY(y, h, 'body'), 'body', 'onSurfaceVariant', { weight: 400 });
  mdText(value, x + w - LAYOUT.padSm(), mdTextY(y, h, vRole), vRole, color ? mdLegacyTxt(color) : MD3.onSurface, { align: 'right', weight: 600 });
}

/* 拨动开关：布尔设置的正确控件。
   之前静音用填充条（drawSetRow）表达开/关 —— 那是"程度"的控件，
   拿来显示布尔值时，开和关两态长得几乎一样（满条 vs 空条），
   玩家既看不出当前状态，也看不出"这里可以点"。
   开关有三段结构：轨道 + 滑块 + 状态色，位置和颜色双重编码，一眼可读。 */
/* 滑块动画进度 0(关) → 1(开)，两个开关各持一份：
   共用一个变量会让它们互相"拽着走"—— 拨动静音时 FPS 的滑块也会跟着滑。 */
let muteSwK = 0, fpsSwK = 0;

/* 右栏：控件行 + 主题色块。
   静音用拨动开关，音量用可拖动填充条，FPS 用填充条；
   主题色块保留选中态外描边 + 内部扫描光带。 */
function drawSettingsControls(z, y0) {
  const C = SET_CTRL;
  const muted = Audio.isMuted;
  const vol = muted ? 0 : Audio.volume;
  /* 行 y 与行高直接取布局算好的 SET_RIGHT（排布只有一个真相来源）。
     兜底值仅在 z.rows 缺失的异常布局下才用，正常路径不会走到。 */
  const rowY = (SET_RIGHT.rows && SET_RIGHT.rows.length === 5)
    ? SET_RIGHT.rows : [y0, y0 + C.ROW_H + 4, y0 + (C.ROW_H + 4) * 2, y0 + (C.ROW_H + 4) * 3, y0 + (C.ROW_H + 4) * 4 + 6];
  const rowH = SET_RIGHT.rowH || C.ROW_H;
  const RX = 22, RW = W - 44;
  /* 一行 = 一层容器 + 左标签。MD3 的列表行**不描边**：
     分组靠 surfaceContainer 与 surfaceContainerHigh 的层级差，不靠线。 */
  const row = (y, role) => mdSurface(RX, y, RW, rowH, { role: role || 'surfaceContainer', radius: SHAPE.sm });
  const rowLabel = (y, s, role) => mdText(s, RX + C.LABEL.pad, mdTextY(y, rowH, 'body'), 'body', role || 'onSurfaceVariant');
  /* 开关不随行高压扁到不可用：按 LAYOUT.control 的比例给，最小也够拇指认出来。 */
  const swAt = (y, on, k, role) => {
    const sh = Math.max(14, Math.min(22, rowH - 2)), sw = Math.round(sh * 2);
    return mdSwitch(RX + RW - 10 - sw, y + (rowH - sh) / 2, on, { w: sw, h: sh, k: k, role: role });
  };

  /* --- 第 1 行 用户名：改名入口唯一化在这里，整行可点 --- */
  {
    const ny = rowY[0];
    row(ny);
    rowLabel(ny, '用户名');
    const penX = RX + RW - 12;
    const maxW = Math.max(20, penX - 16 - (RX + C.LABEL.pad + mdTextWidth('用户名', 'body') + 8));
    mdText(mdEllipsis(username, maxW, 'body', 500), penX - 16, mdTextY(ny, rowH, 'body'), 'body', 'onSurface', { align: 'right', weight: 500 });
    mdIcon('edit', penX - 5, ny + rowH / 2, Math.min(12, rowH - 6), 'primary', { lw: 1.5 });
  }

  /* --- 第 2 行 静音：布尔用开关，不用"程度条" ---
     静音是危险态：整行升到 errorContainer，开关走 error。
     进度 muteSwK / fpsSwK 各持一份 —— 共用一个变量会让两个开关互相"拽着走"。 */
  muteSwK += ((muted ? 1 : 0) - muteSwK) * Math.min(1, 0.25);
  {
    const y = rowY[1];
    row(y, muted ? 'errorContainer' : 'surfaceContainer');
    rowLabel(y, '静音', muted ? 'onErrorContainer' : 'onSurfaceVariant');
    swAt(y, muted, muteSwK, 'error');
  }

  /* --- 第 3 行 音量 --- */
  {
    const y = rowY[2];
    row(y);
    drawSetRow(y, '音量', vol, { rowH: rowH, disabled: muted });
  }

  /* --- 第 4 行 FPS：与静音同一套开关，但语义色是 success（信息增强，不是危险） --- */
  fpsSwK += ((showFps ? 1 : 0) - fpsSwK) * Math.min(1, 0.25);
  {
    const y = rowY[3];
    row(y);
    rowLabel(y, 'FPS 显示');
    swAt(y, showFps, fpsSwK, 'success');
  }

  /* --- 第 5 行 画质档位：四态互斥用分段按钮，把选项全部摊开 ---
     分段矩形读 SET_BTN.qseg（布局算好的），画完再写回：
     绘制端与命中端必须读同一份坐标，两边各算一遍必然对不上，
     结果就是"点第二格选中的是第三格"。 */
  {
    const y = rowY[4];
    row(y);
    rowLabel(y, '画质', qualityMode !== 0 ? 'primary' : 'onSurfaceVariant');
    const q = SET_BTN.qseg, n = q.length;
    if (n) {
      const gx = q[0].x, gw = q[n - 1].x + q[n - 1].w - gx;
      const rects = mdSegmented(gx, q[0].y, gw, q[0].h, QUALITY_MODES.map(m => m.name), qualityMode, {});
      for (let i = 0; i < n && i < rects.length; i++) {
        q[i].x = rects[i].x; q[i].y = rects[i].y; q[i].w = rects[i].w; q[i].h = rects[i].h;
      }
    }
  }

  /* --- 主题色：六个预设 ---
     选中 = secondaryContainer + 勾；未选中 = surfaceContainerHighest。
     原来的"主题色 2px 外描边 + 内部扫描光带"删掉：
     描边跟着主题变粗，看着像选中其实只是边框；选中态要有一次勾，不要一圈光。
     圆点保留：它是**主题身份的样本色**（内容），不是装饰。 */
  {
    const y = z.theme.y;
    mdCard(RX, y, RW, z.theme.h, { role: 'surfaceContainer', radius: SHAPE.lg, elev: 1 });
    mdText('主题色', RX + LAYOUT.pad(), y + ((SET_RIGHT.themeHeaderPad || 20) - mdType('label')) / 2, 'label', 'primary', { weight: 600 });
    for (let i = 0; i < THEMES.length; i++) {
      const sw = SET_BTN.theme[i], th = THEMES[i], on = i === themeIdx;
      mdSurface(sw.x, sw.y, sw.w, sw.h, { role: on ? 'secondaryContainer' : 'surfaceContainerHighest', radius: SHAPE.sm });
      const cy = sw.y + sw.h / 2;
      ctx.fillStyle = th.color;
      ctx.beginPath(); ctx.arc(sw.x + 9, cy, Math.max(3, Math.min(4, sw.h * 0.18)), 0, Math.PI * 2); ctx.fill();
      mdText(mdEllipsis(th.name, Math.max(0, sw.w - 30), 'label', 500), sw.x + 16, mdTextY(sw.y, sw.h, 'label'), 'label',
        on ? 'onSecondaryContainer' : 'onSurfaceVariant', { weight: 500 });
      if (on) mdIcon('check', sw.x + sw.w - 9, cy, Math.min(11, sw.h * 0.5), 'onSecondaryContainer', { lw: 1.7 });
    }
  }

  /* --- 数据：清除本地存档（危险操作）--- */
  const rb = SET_BTN.reset;
  mdButton(rb.x, rb.y, rb.w, rb.h, resetConfirm ? '再点一次确认清除' : '清除本地存档',
    resetConfirm ? 'destructive' : 'outlined');

  /* 页脚 y 跟随清除行，不能写死 H-62：写死的页脚在所有分辨率下都会压进清除行里
     （H=320 时页脚 258 / 清除行 261~278）。主题区已按 FOOTER_H 让出这段高度。 */
  mdText('AGPL-3.0 开源 · 单文件零依赖', W / 2, rb.y - 14, 'label', 'onSurfaceVariant', { align: 'center' });

  const b = SET_BTN.back;
  mdButton(b.x, b.y, b.w, b.h, '返回', 'tonal');
}

/* 游戏结束界面：分阶段揭示（阈值与缓动是设计的一部分，别顺手改成一次性砸出来）
   0.0-0.9s 死亡定格（残影消散，世界还在）→ 0.55s 标题落位 → 0.9s 分隔线展开
   → 1.05s 分数 → 1.45s 纪录判定 → 1.55s 综合评级（总评条生长）→ 1.75s 起五维逐格
   → 1.9s 起四张数据卡依次弹入 → 2.5s 成就进度 → 2.7s 对比上局 → 3.2s 按钮（防误触窗口）
   视觉一律走组件层：压暗 = mdScrim，层级 = tonal 容器 + elevation，反馈 = state layer。 */
function drawGameOver() {
  // 为什么：这屏的"氛围"原本由 4 处 shadowBlur + 每帧一个 radial 渐变撑着（H3/H7 双违），
  // 压暗层又是钉死的 rgba(4,8,14) —— 换主题它不变，而 blur 在低端机上是驻留即上千次卷积。
  const T = goAnim;
  const dim = Math.min(1, Math.max(0, (T - 0.25) / 0.9));   // 定格期仍能看到战场，之后才压暗
  mdScrim('modal', (0.35 + dim * 0.6) / SCRIM.modal);       // 浓度曲线与旧算法同形

  // 死亡定格：残影在原位置缓慢放大消散（世界层的表现，不属于 UI 视觉语言，保留）
  if (deathT > 0) {
    const k = deathT / 0.9;
    ctx.save();
    try {
      ctx.globalAlpha = k * 0.85;
      ctx.translate(player.x, player.y);
      ctx.scale(1 + (1 - k) * 0.8, 1 + (1 - k) * 0.8);
      ctx.drawImage(SPR.player, -4, -4);
      ctx.globalAlpha = k * 0.4;
      ctx.drawImage(SPR.playerWhite || SPR.player, -4, -4);
    } finally { ctx.restore(); }
  }
  if (T < 0.55) return;                       // 定格期不显示结算 UI

  const easeOut = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  /* 内容得坐在"已知的面"上：卡片直接压在弹幕上时，surfaceContainer 比背景亮多少
     每帧都在变，tonal 层级就读不出来。整屏 surface 随标题一起淡入，不加描边。 */
  mdSurface(0, 0, W, H, { role: 'surface', radius: 0, alpha: Math.min(0.94, easeOut((T - 0.5) / 0.7)) });

  const GX = 20, GW = W - 40;                                  // 卡片区（旧 20.5 / W-41 那份几何）
  const isNew = state.score >= state.hi && state.score > 0;
  const scoreStr = String(state.score).padStart(6, '0');
  /* 分数用 headMd，不再用 2.2~2.8 那种"按位数缩放的魔法字号"：
     位数变长时降到 TYPE 里的下一档，字阶表不会因此多出第 41 种字号。 */
  let numRole = 'headMd';
  for (const cand of ['headMd', 'title', 'titleSm']) {
    numRole = cand;
    if (mdTextWidth(scoreStr, cand, 700) <= GW - LAYOUT.pad() * 2) break;
  }

  /* ===== 纵向节奏 =====
     块高 = max(旧锚点高 × s, 字阶算出的最小高)，块间距 = 旧间距 × s。
     s=1 时逐块落回旧锚点：分隔线 74 / 分数卡 84 / 综合评级 152 / 五维 192 /
     数据卡 234 / 成就 282 / 对比上局 308（竖屏一个像素都没挪）。
     横屏与极限小屏（H=320 → DENSE）把整段压到 0.7：旧锚点在那儿会让数据卡(234)
     与成就行(282)压在重试按钮(H-60=260)上，属于 H8 缺降级路径 —— 压节奏而不是丢内容。
     重试/返回的矩形仍然只有 layoutOverButtons 一个主人，这里只读不写。
     s 只负责**收缩**。撑不满时另有一条反向的分配规则（见下面"生长"），
     所以上面那串锚点是**基准**，不是竖屏的实际落点。 */
  const btnTop = OVER_BTN.retry.h > 0 ? OVER_BTN.retry.y : H - 60;
  /* 缝的基准总量。八条缝是"相对节奏"的载体（新纪录紧贴分数卡、成就行离数据卡最远），
     所以下面 g() 的实参必须与此逐项对上 —— 少一项，生长就会把差值凭空补到别处。 */
  const GO_GAPS = 18 + 9 + 5 + 5 + 6 + 8 + 10 + 8;
  const GO_GAP_MAX = 2;    // 缝最多长到基准的 2 倍：八条缝全到 32dp 时分组关系就抹平了
  const GO_END_MIN = 16;   // 内容末端与操作条之间保底留白
  const goRhythm = (s, gm, padTop, padEnd) => {
    const r = (v) => v * s;          // 块高锚点：只有矮屏会压缩它
    const g = (v) => v * s * gm;     // 缝：两个方向都可调
    const twoLine = mdType('label') + mdType('bodyLg') + 6;         // 小格内容的安身高度
    const topY = padTop + r(40);
    const divY = topY + mdType('headSm') + g(18);
    const scoreY = divY + 1 + g(9);
    const scoreH = 6 + mdType('label') + 2 + mdType(numRole) + 6;   // 旧版这里写死 34 会露字
    const recY = scoreY + scoreH + g(5);
    const recH = Math.max(r(16), mdType('label') + 8);
    const grY = recY + recH + g(5);
    const grH = Math.max(r(34), mdType('headMd') + 12);
    const dimY = grY + grH + g(6);
    const dimH = Math.max(r(34), twoLine);
    const cardsY = dimY + dimH + g(8);
    const cardsH = Math.max(r(38), twoLine);
    const achY = cardsY + cardsH + g(10);
    const achH = Math.max(r(18), mdType('body') + 4 + r(5));
    /* 对比上局卡：以前绘制端手写 46、预算端再手写一遍 +46，改一处就错开一格。
       现在高度由"标题 + 分隔线 + 两行"的同一组量算出，绘制端只读 L.cmp*。 */
    const cmpPad = 5, cmpRowGap = 4;
    const cmpLine = cmpPad + mdType('label') + cmpRowGap;        // 分隔线那一 px 的位置
    const cmpBodyTop = cmpLine + 1 + cmpRowGap;
    const cmpRow = mdType('label') + cmpRowGap;
    const cmpH = cmpBodyTop + cmpRow + mdType('label') + cmpPad;
    return { r: r, g: g, topY: topY, divY: divY, scoreY: scoreY, scoreH: scoreH,
      recY: recY, recH: recH, grY: grY, grH: grH, dimY: dimY, dimH: dimH,
      cardsY: cardsY, cardsH: cardsH, achY: achY, achH: achH,
      cmpY: achY + achH + g(8), cmpPad: cmpPad, cmpRowGap: cmpRowGap, cmpLine: cmpLine,
      cmpBodyTop: cmpBodyTop, cmpRow: cmpRow, cmpH: cmpH,
      bot: (H >= 400 ? achY + achH + g(8) + cmpH : achY + achH) + padEnd };
  };
  let RY = DENSE ? 0.7 : 1, GMY = 1, PAD_TOP = 0, PAD_END = 0;
  const goFit = () => goRhythm(RY, GMY, PAD_TOP, PAD_END);
  let L = goFit();
  for (let guard = 0; guard < 6 && L.bot > btnTop - 8 && RY > 0.45; guard++) { RY -= 0.05; L = goFit(); }
  /* 生长：负空间**先撑缝、后留白**。
     撑缝保住七段间距的相对比例；块高一律不跟着长，否则就是暂停页修过的同一种"虚胖"
     （一格 24px 的内容住在 47px 的盒子里）。缝到顶后剩下的余量上下平分，
     内容组于是在"屏顶到操作条"这段里光学居中 —— 空洞挪到组的外面，
     读起来像页边距，而不是中间漏了一屏。 */
  const goFree = Math.max(0, btnTop - GO_END_MIN - L.bot);
  if (goFree > 0.5) {
    const goSlack = GO_GAPS * RY;
    GMY = 1 + Math.min(GO_GAP_MAX - 1, goFree / goSlack);
    const goRest = Math.max(0, goFree - (GMY - 1) * goSlack);
    PAD_TOP = goRest / 2; PAD_END = goRest / 2;
    L = goFit();
  }

  /* --- 标题（0.55s 砸入）：位移与淡入保留，16px 红色 shadowBlur 删除。
     "游戏结束"在 MD3 里是终止/错误语义，用 error 角色（暗底模式下是浅红）表达即可。 --- */
  const tIn = easeOut((T - 0.55) / 0.35);
  ctx.save();
  try {
    ctx.globalAlpha = tIn;
    mdTextC('游戏结束', W / 2, L.topY - (1 - tIn) * L.r(34), 'headSm', 'error');
  } finally { ctx.restore(); }

  // --- 分隔线（0.9s）---
  if (T > 0.9) {
    const lw = easeOut((T - 0.9) / 0.4) * (W - 80);   // 展开动画与旧版同式
    mdDivider(W / 2 - lw / 2, L.divY, lw);            // 两端渐隐的霓虹渐变线 → 1px hairline
  }

  /* --- 分数（1.05s）：卡片是 surfaceContainerHigh + elevation，
     旧版"金色 sin 呼吸边框 / outline 描边"删掉 —— MD3 的分组靠色层，不靠一圈亮边。 --- */
  if (T > 1.05) {
    const sIn = easeOut((T - 1.05) / 0.45);
    ctx.save();
    try {
      ctx.globalAlpha = sIn;
      mdCard(GX, L.scoreY, GW, L.scoreH, { role: 'surfaceContainerHigh', radius: SHAPE.lg, elev: 1 });
      mdTextC('本局分数', W / 2, L.scoreY + 6, 'label', 'onSurfaceVariant');
      mdTextC(scoreStr, W / 2, L.scoreY + 6 + mdType('label') + 2, numRole, 'onSurface');
    } finally { ctx.restore(); }
  }

  /* --- 纪录判定（1.45s）：旧版每两帧闪一次 + 6px 金色 blur，是"常态循环动画"。
     MD3 里常态零动画：新纪录用一枚静态 tertiaryContainer 徽标，没破纪录就退回次要文字。 --- */
  if (T > 1.45) {
    ctx.save();
    try {
      if (isNew) {
        const txt = '新纪录';
        const bw = mdTextWidth(txt, 'label', 600) + 16;
        mdSurface(W / 2 - bw / 2, L.recY, bw, L.recH, { role: 'tertiaryContainer', radius: L.recH / 2 });
        mdTextC(txt, W / 2, mdTextY(L.recY, L.recH, 'label'), 'label', 'onTertiaryContainer', { weight: 600 });
      } else {
        mdTextC('历史最高 ' + String(state.hi).padStart(6, '0'), W / 2,
          mdTextY(L.recY, L.recH, 'label'), 'label', 'onSurfaceVariant');
      }
    } finally { ctx.restore(); }
  }

  /* --- 分段评级（1.55s）：综合评级 = 这一屏的第二个视觉高潮。
     大字号（headMd）+ primaryContainer 容器，而不是"大字 + shadowBlur"。 --- */
  const dims = gradeDims(state.wave, runKills, runTime, ultUses, maxCombo);
  const total = gradeTotal(dims);
  const letter = gradeLetter(total);
  if (T > 1.55) {
    const k = easeOut((T - 1.55) / 0.45);
    const pad = LAYOUT.pad();
    ctx.save();
    try {
      ctx.globalAlpha = k;
      mdCard(GX, L.grY, GW, L.grH, { role: 'primaryContainer', radius: SHAPE.lg, elev: 1 });
      const lwTxt = '综合评级';
      const lw = mdTextWidth(lwTxt, 'label', 600);
      const letterW = mdTextWidth(letter, 'headMd', 700);
      mdText(lwTxt, GX + pad, mdTextY(L.grY, L.grH, 'label'), 'label', 'onPrimaryContainer', { weight: 600, alpha: 0.8 });
      mdText(letter, GX + GW - pad, mdTextY(L.grY, L.grH, 'headMd'), 'headMd', 'onPrimaryContainer', { align: 'right' });
      /* 总评条从标签后长到字母前：留一条能扫读的轨道，"离下一档还差多少"靠长度而不是颜色；
         生长量 total*k 是揭示动画，保留。
         轨道不能是实色 primary —— 挂在 primaryContainer 上时它和"已填充"一样响，
         读起来像一条满格进度。M3 在容器上的进度是同一角色分强弱：
         已填充 = onPrimaryContainer，未填充 = 同色 22%。 */
      mdProgress(GX + pad + lw + 6, L.grY + (L.grH - 4) / 2,
        Math.max(8, GW - pad * 2 - lw - letterW - 12), 4, total * k,
        { role: 'onPrimaryContainer', trackRole: hexA(MD3.onPrimaryContainer, 0.22) });
    } finally { ctx.restore(); }
  }

  // --- 五维评级（1.75s 起逐格 +0.08）：彩色描边删除，格子靠 tonal，等级字母才带色 ---
  if (T > 1.75) {
    const dw = 30, dgap = 4;                    // 格宽/缝距/整行居中都是旧几何
    const dx0 = (W - (GRADE_DIMS.length * dw + (GRADE_DIMS.length - 1) * dgap)) / 2;
    for (let i = 0; i < GRADE_DIMS.length; i++) {
      const delay = 1.75 + i * 0.08;
      if (T < delay) continue;
      const k = easeOut((T - delay) / 0.3);
      const d = GRADE_DIMS[i];
      const lv = gradeLetter(dims[d.id]);
      const x = dx0 + i * (dw + dgap), y = L.dimY + (1 - k) * L.r(10);
      ctx.save();
      try {
        ctx.globalAlpha = k;
        mdSurface(x, y, dw, L.dimH, { role: 'surfaceContainer', radius: SHAPE.sm });
        const blockH = mdType('label') + 2 + mdType('bodyLg');
        const ty = y + (L.dimH - blockH) / 2;
        mdTextC(d.label, x + dw / 2, ty, 'label', 'onSurfaceVariant');
        mdTextC(lv, x + dw / 2, ty + mdType('label') + 2, 'bodyLg', mdLegacyTxt(GRADE_COLOR[lv]));
      } finally { ctx.restore(); }
    }
  }

  // --- 数据卡（1.9s 起逐张 +0.12）：一行四张的横向几何原样保留 ---
  const cw = (W - 44 - 10 * 3) / 4, gap = 10, cx0 = 22;
  const cards = [
    { label: '到达波次', value: String(state.wave),  color: TH() },
    { label: '最高连击', value: 'X' + maxCombo,      color: MD3.chip },
    { label: '本局击杀', value: String(runKills),    color: MD3.secondary },
    { label: '获得金币', value: String(state.coins), color: MD3.coin }
  ];
  for (let i = 0; i < cards.length; i++) {
    const delay = 1.9 + i * 0.12;
    if (T < delay) continue;
    const k = easeOut((T - delay) / 0.35);
    const c = cards[i];
    const x = cx0 + i * (cw + gap), y = L.cardsY + (1 - k) * L.r(12);
    const avail = Math.max(12, cw - 6);
    /* 窄卡（41.5 逻辑px）里"137500"这类长数值会顶穿边框：按 TYPE 档位往下降，
       降到 label 还装不下才省略 —— 省略号是兜底，不是默认的截断策略。 */
    let vRole = 'bodyLg';
    if (mdTextWidth(c.value, vRole, 600) > avail) vRole = 'body';
    if (mdTextWidth(c.value, vRole, 600) > avail) vRole = 'label';
    ctx.save();
    try {
      ctx.globalAlpha = k;
      mdSurface(x, y, cw, L.cardsH, { role: 'surfaceContainer', radius: SHAPE.sm });
      const blockH = mdType('label') + 3 + mdType(vRole);
      const ty = y + (L.cardsH - blockH) / 2;
      mdTextC(mdEllipsis(c.label, avail, 'label'), x + cw / 2, ty, 'label', 'onSurfaceVariant');
      /* 顶部 2px 色条删除：MD3 不用色条声明"这张卡是金币卡"，数值本身的颜色已经够了 */
      mdTextC(mdEllipsis(c.value, avail, vRole, 600), x + cw / 2, ty + mdType('label') + 3, vRole,
        mdLegacyTxt(c.color), { weight: 600 });
    } finally { ctx.restore(); }
  }

  // --- 成就进度（2.5s）：文字行 + 4px 轨道，生长动画保留 ---
  if (T > 2.5) {
    let done = 0; for (const a of ACHIEVEMENTS) if (achievements[a.id]) done++;
    const k = easeOut((T - 2.5) / 0.6);
    ctx.save();
    try {
      ctx.globalAlpha = Math.min(1, k * 1.4);
      mdText('成就进度', 22, L.achY, 'body', 'onSurfaceVariant');
      mdText(done + ' / ' + ACHIEVEMENTS.length, W - 22, L.achY, 'body', 'tertiary', { align: 'right' });
      mdProgress(22, L.achY + mdType('body') + 5, W - 44, 4, (done / ACHIEVEMENTS.length) * k,
        { role: 'tertiary', trackRole: 'surfaceContainerHighest' });
    } finally { ctx.restore(); }
  }

  /* --- 对比上局（2.7s）：涨绿跌红的三个钉死色经 mdLegacyTxt 认回角色，
     于是"↑18420"跟着主题走，而不是永远停在某支绿上。矮屏仍然让位（H<400 不放）。 --- */
  if (T > 2.7 && H >= 400) {
    const k = easeOut((T - 2.7) / 0.5);
    const diffs = [
      ['分数', runDiff(state.score, prevRun && prevRun.score)],
      ['波次', runDiff(state.wave, prevRun && prevRun.wave)],
      ['击杀', runDiff(runKills, prevRun && prevRun.kills)],
      ['连击', runDiff(maxCombo, prevRun && prevRun.combo)]
    ];
    const colX2 = [26, 128];                                 // 双列两行：横向几何不变
    ctx.save();
    try {
      ctx.globalAlpha = k;
      mdCard(16, L.cmpY, W - 32, L.cmpH, { role: 'surfaceContainer', radius: SHAPE.lg, elev: 1 });
      mdText('对比上局', 24, L.cmpY + L.cmpPad, 'label', 'onSurfaceVariant');
      mdDivider(24, L.cmpY + L.cmpLine, W - 48);
      for (let i = 0; i < diffs.length; i++) {
        const x = colX2[i % 2], y = L.cmpY + L.cmpBodyTop + ((i / 2) | 0) * L.cmpRow;
        mdText(diffs[i][0], x, y, 'label', 'onSurfaceVariant');
        mdText(diffs[i][1].t, x + 84, y, 'label', mdLegacyTxt(diffs[i][1].c), { align: 'right', weight: 600 });
      }
    } finally { ctx.restore(); }
  }

  /* --- 底部按钮（3.2s 防误触窗口）：主次靠 filled / outlined 两种按钮区分，
     旧的 pulse 呼吸底色 + scanSweep 扫描高光都是循环动画，删；淡入 k 保留。 --- */
  if (T > 3.2) {
    const k = easeOut((T - 3.2) / 0.4);
    layoutOverButtons();                 // 命中矩形唯一主人，绘制端只读不回写
    const rb = OVER_BTN.retry, hb = OVER_BTN.home;
    ctx.save();
    try {
      ctx.globalAlpha = k;
      mdButton(rb.x, rb.y, rb.w, rb.h, isTouch ? '重试' : '重试 (空格)', 'filled');
      mdButton(hb.x, hb.y, hb.w, hb.h, '返回菜单', 'outlined');
    } finally { ctx.restore(); }
  }
}

/* ==================================================================
   暂停菜单
   ================================================================== */

function drawPause() {
  /* 为什么：旧版这一屏的"暗"是自己刷的 rgba(4,8,14,.78) 死黑 + 一圈主题色发光边 +
     一个每帧新建的 radial 辉光（H7 违例）。MD3 只有三条层次通道：scrim、tonal 阶梯、
     elevation —— 遮罩交还 mdScrim，面板交还 mdCard，辉光整段删掉不再补替代物。 */
  const ptIn = Math.min(1, Math.max(0, pauseT));
  const easeIn = 1 - Math.pow(1 - ptIn, 3);
  /* 0.78 是"战况数据压在弹幕上仍可读"的经验下限（旧注释里的硬要求），但浓度只能由
     mdScrim 单点定义：这里按 SCRIM.dialog 折算成倍率传进去，于是"改一档 dialog 遮罩"
     仍然只改组件库那一处，而不是回到各页面各写一个 alpha。 */
  mdScrim('dialog', easeIn * (0.78 / SCRIM.dialog));

  // 子页面打开时整页让出，避免两层信息叠在一起
  if (settingsPageActive) { drawSettingsPage(); return; }
  if (achPageActive) { drawAchPage(); return; }

  /* 标题区：headSm 字阶 + 一行键位提示 + M3 hairline 分隔线。
     键位提示原来画在 H-6，而出口行下沿是 H-10（layoutButtons 定的）—— 8px 的字被
     屏幕底边切掉半截（截图实测只剩上半）。它不是命中矩形，挪进标题带下方的空档
     （32~46 之间本来就没人用）不影响任何点击判定。 */
  ctx.save();
  try {
    ctx.globalAlpha = easeIn;
    ctx.translate(0, (1 - easeIn) * -12);
    mdText('暂 停 中', W / 2, 16, 'headSm', 'primary', { align: 'center' });
    /* 提示行落在"标题盒子下沿 → 分隔线"这一段的正中间：写死 y 会在 DENSE（headSm 14.1）
       下把 3px 的余量一次性吃掉，字就贴上分隔线了。 */
    const tBot = 16 + mdType('headSm');
    mdText(isTouch ? '点击按钮操作' : 'P 继续 · R 重开 · M 音效', W / 2,
      mdTextY(tBot, 46 - tBot, 'label'), 'label', 'onSurfaceVariant', { align: 'center' });
  } finally { ctx.restore(); }
  ctx.save();
  try {
    ctx.globalAlpha = easeIn;
    mdDivider(40, 46, W - 80);
  } finally { ctx.restore(); }

  /* ===== 战术面板 =====
     整块面板 = 一张 mdCard（surfaceContainer + SHAPE.lg + elev3）：
     分组靠 surfaceContainer → surfaceContainerHigh 的层级差，不靠描边、不靠透背景。
     旧的"装置边框 + 标题栏 + 主题色 1.5px 边"三样一起删 —— 那圈边切主题会跟着变色，
     看起来永远像"被选中"，而它其实只是个框。
     毛玻璃仍然不做：canvas 没有 backdrop-filter，代价与收益不成比例。 */
  const pt = pauseT;
  const ease = 1 - Math.pow(1 - Math.min(1, Math.max(0, pt)), 3);   // easeOutCubic
  /* 落位弹跳保留：入场是一次性过渡（M3 emphasized enter），不是常态呼吸动画。
     c1 取 1.2（标准值 1.70158 太弹，暂停菜单要的是稳，不是俏）。 */
  const easeBack = (t) => {
    const c1 = 1.2, c3 = c1 + 1;
    const u = Math.min(1, Math.max(0, t)) - 1;
    return 1 + c3 * u * u * u + c1 * u * u;
  };

  /* 面板几何的唯一真相来源仍是 PAUSE_BUTTONS.resume.y（layoutButtons 算好的）：
     这里只读它，不另算一套，否则"面板底边"与"继续按钮顶边"会各自漂移。 */
  const PX = 16, PW = W - 32;
  const PY = 52;
  const PBot = PAUSE_BUTTONS.resume.y - 12;
  const PH = Math.max(70, PBot - PY);
  const yOff = (1 - easeBack(pt)) * -28;

  ctx.save();
  try {
    ctx.translate(0, yOff);
    ctx.globalAlpha = Math.min(1, ease * 1.4);
    /* tint:false 是必须的，不是风格选择：mdCard 默认按 elevation 给面叠 5~14% 主色，
       而 elev3 的 11% 主色已经把 surfaceContainer 抬到比卡片的 surfaceContainerHigh 还亮
       （实测 #1f353c vs #222b2f）—— 容器与内容的 tonal 阶梯会整个倒过来。
       关掉着色后浮起感只由 mdElev 的黑色分层投影表达，阶梯恢复 图底 < 面板 < 卡片。 */
    mdCard(PX, PY, PW, PH, { role: 'surfaceContainer', radius: SHAPE.lg, elev: 3, tint: false });
    /* 面板标题走 titleSm + primary（与设置页「本机数据」同一口径），落在原来
       panelHeader 的 20px 带里 —— gridTop = PY + 20 这个分账没有动。 */
    mdText('战 术 休 整', PX + LAYOUT.pad(), mdTextY(PY + 4, 16, 'titleSm'), 'titleSm', 'primary');

    // --- 战况数据 ---
    const acc = runShots > 0 ? Math.round(runHits / runShots * 100) : null;
    const dps = runTime > 0.5 ? Math.round(runKills * 100 / runTime) / 100 : 0;
    const mmss = (sec) => {
      const s = Math.max(0, Math.floor(sec));
      return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    };
    /* 数值颜色一律改成角色名（原来是 11 个钉死的十六进制）：'success' 表达"击杀/道具"、
       'coin' 表达"资源型好结果"、'warning' 表达"命中率偏低"，切主题整屏跟着换。 */
    const cells = [
      ['存活', mmss(runTime), 'onSurface'],
      ['击杀', String(runKills), 'success'],
      ['DPS', dps.toFixed(2), dps > 3 ? 'coin' : 'onSurfaceVariant'],
      ['波次', String(state.wave), 'primary'],
      ['命中率', acc === null ? '—' : acc + '%',
        acc === null ? 'onSurfaceVariant' : (acc >= 60 ? 'success' : (acc >= 35 ? 'coin' : 'warning'))],
      ['道具', String(runPowerups), 'success'],
      ['连击', 'X' + maxCombo, 'coin'],
      ['分数', String(state.score).padStart(6, '0'), 'onSurface']
    ];
    const gridTop = PY + 20;
    const gridBot = PY + PH - 8;
    const avail = gridBot - gridTop;

    /* ===== 纵向分账：列表定节奏，图表吃富余 =====
       面板高度是**从上一个区块剩下的**，两块内容按可用空间分账，不能各自写死高度 ——
       矮屏（H=320，面板仅 138px）写死就会互相压。
       旧顺序是"图钳在 42~62，四行把剩下的均摊"：竖屏摊到 57px 一行，而每行的内容带
       只有 26px（八块小板砖中间 31px 空腔），图却被压在 62px —— 该紧的松、该松的紧。
       新顺序反过来：行距封顶 ROW_PITCH_MAX（带 34 + 缝 8，本作 240px 逻辑宽下约等于
       MD3 单行列表项 56dp 的节奏），带子随槽位一起长到封顶为止而不是钉死 26 ——
       缝恒定 8，长的是容器不是空腔。折线图拿行距不要的全部高度（上限 96），
       最后剩下的才对称地摊成上下留白。
       矮屏上 (avail - gap - CHART_MIN)/4 本来就小于 ROW_PITCH_MAX，公式退化回旧行为。 */
    const CHART_MIN = 42, CHART_MAX = 96;
    const BAND_MIN = 26;                     // 带子的最小舒适高，也是封顶行的基准
    const ROW_GAP = 8;
    const ROW_PITCH_MAX = 42;
    const chartGap = 6;
    const rowH = Math.max(14, Math.min((avail - chartGap - CHART_MIN) / 4, ROW_PITCH_MAX));
    const rowsH = rowH * 4;
    const chartH = Math.max(CHART_MIN, Math.min(CHART_MAX, avail - chartGap - rowsH));
    const bodyPad = Math.max(0, (avail - chartGap - rowsH - chartH) / 2);
    const bodyTop = gridTop + bodyPad;
    const gridTopC = bodyTop + chartH + chartGap;
    const colW = (PW - 30) / 2;
    const cardGap = 4;

    /* ===== ① 趋势指标切换 + 折线图 =====
       三个 tab 是**互斥枚举**，所以是 SegmentedButton 而不是一排小胶囊：
       整组共用一圈外框、段间 1px 竖线，选中 = secondaryContainer + 勾。
       旧写法每段各描一圈主题色边（选中态=亮边，切主题就"失联"），且 4px 缝把三段
       推成三个独立控件 —— 那是 chip 组的形态，回答不了"这是同一个设置器"。 */
    /* 分段条顶边从 gridTop 再往下 5px、自身从 12 加高到 14：
       面板标题带（PY+4 起 16px）的下沿原本离分段只剩 2px，两行字读成一坨；
       12px 的段也是全作最小的命中档，点"生命"经常滑到隔壁。
       加高只从折线图身上扣（图底 gridTop+chartH 这条线不动，改成按它反算 cH），
       所以数据区的 4 行分账（gridTopC 用的是 chartH）一格都没挪。 */
    const chX = PX + 12, chW = PW - 24, chY = bodyTop + 5;
    const TAB_H = 14, TAB_GAP = 2;
    const cY = chY + TAB_H + TAB_GAP;
    const cH = Math.max(18, bodyTop + chartH - cY);
    {
      const segs = mdSegmented(chX, chY, chW, TAB_H,
        TREND_METRICS.map(function (m) { return m.name; }), trendMetric);
      /* 命中矩形仍由绘制端写回 PAUSE_TREND_TABS（点击端读的就是这一份）。
         分段控件没有段间缝，所以每段比旧的 tabW 宽 4/3px、高 10→12 —— 越点越准的方向。 */
      for (let i = 0; i < PAUSE_TREND_TABS.length && i < segs.length; i++) {
        PAUSE_TREND_TABS[i].x = segs[i].x; PAUSE_TREND_TABS[i].y = segs[i].y;
        PAUSE_TREND_TABS[i].w = segs[i].w; PAUSE_TREND_TABS[i].h = segs[i].h;
      }
      /* 图底 = 面板里凹下去的一层（surfaceContainerLow 比面板低一级）。
         旧的 rgba(6,14,26,.6) 是"透到背景弹幕上"的黑底，换主题不动且会透出战场。 */
      mdSurface(chX, cY, chW, cH, { role: 'surfaceContainerLow', radius: SHAPE.sm });

      const n = runTrend.length;
      if (n < 2) {
        /* 数据不足时明确说"采样中"，而不是画一条平的假线 ——
           开局 1 秒内暂停，画出来的直线会让玩家以为"我这局一直没击杀"。 */
        mdText('采样中…', chX + chW / 2, mdTextY(cY, cH, 'body'), 'body', 'onSurfaceVariant', { align: 'center' });
      } else {
        let vMax = 0;
        for (let i = 0; i < n; i++) vMax = Math.max(vMax, trendValueAt(i));
        /* 纵轴上限留 15% 余量且至少为 1：不留余量时最高点正好贴顶看不出是峰值；
           全零时上限取 1，避免除零画出 NaN 坐标。 */
        const yMax = Math.max(1, vMax * 1.15);
        // 指标色仍是 TREND_METRICS 里的存量 hex（数据区，不在本包改动范围），经 mdLegacyTxt 认回角色
        const trendCol = mdLegacyTxt(TREND_METRICS[trendMetric].color);
        /* 绘图区左右各让 3/4px、底边让 5px：零值折线（开局没击杀时整条贴底）原本会把
           末点标记甩到 SHAPE.sm 圆角之外，看着像面板上蹭了个噪点。 */
        const plotX = chX + 3, plotW = chW - 7, baseY = cY + cH - 5;
        const mapY = (v) => baseY - (v / yMax) * (cH - 9);
        /* 折线本体是**数据**不是装饰，所以保留面积填充 + 描边 + 末点标记；
           删掉的只有它外面那层辉光。面积用 hexA(role,.16) 而不是渐变。 */
        ctx.beginPath();
        ctx.moveTo(plotX, baseY);
        for (let i = 0; i < n; i++) {
          ctx.lineTo(plotX + (i / (n - 1)) * plotW, mapY(trendValueAt(i)));
        }
        ctx.lineTo(plotX + plotW, baseY);
        ctx.closePath();
        ctx.fillStyle = hexA(trendCol, 0.16); ctx.fill();
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
          const px2 = plotX + (i / (n - 1)) * plotW, py2 = mapY(trendValueAt(i));
          if (i === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
        }
        ctx.strokeStyle = trendCol; ctx.lineWidth = 1.2; ctx.stroke();
        const lastV = trendValueAt(n - 1);
        ctx.fillStyle = trendCol;
        ctx.beginPath(); ctx.arc(plotX + plotW, mapY(lastV), 1.8, 0, Math.PI * 2); ctx.fill();
        mdText(String(Math.round(lastV * 100) / 100), chX + LAYOUT.padSm(), cY + 2, 'label', trendCol);
      }
    }

    /* ===== ② 战况数据：2 列 × 4 行 =====
       八张卡直接复用设置页已验收的 drawSetStatRow（一层 surfaceContainerHigh +
       左标签右数值）—— 同一种"只读数据行"在本作里只该有一份实现。
       卡片描边删掉：面板已经是另一级 tonal，卡再高一级就分得开了。 */
    for (let i = 0; i < 8; i++) {
      const cc = i % 2, row = Math.floor(i / 2);
      const cx = PX + 14 + cc * (colW + 10);
      const cy = gridTopC + row * rowH;
      const cH2 = Math.max(12, rowH - cardGap);
      /* 逐行浮现：整块一起出现是"信息墙"，错峰才有节奏（一次性入场，非常态动画）。 */
      const rp = Math.min(1, Math.max(0, (pt - 0.10 - row * 0.06) / 0.4));
      PAUSE_CARD_RECTS[i].x = cx; PAUSE_CARD_RECTS[i].y = cy;
      PAUSE_CARD_RECTS[i].w = colW; PAUSE_CARD_RECTS[i].h = cH2;
      /* 带子随槽位长到 BAND_MIN 以上、但永远留 ROW_GAP 的缝，并在格内竖直居中：
         旧写法是"槽位 57、带子钉死 26"，多出来的 31px 全落在行间 —— 那不是列表节奏，
         是八块小板砖漂在空腔里。现在长的是容器（封顶 34 ≈ MD3 单行列表项），
         缝始终是 8。槽位矩形（PAUSE_CARD_RECTS）仍按分账写回，带子的中线就是格子的
         中线，所以字的水平轴一点没动。 */
      const bandH = Math.min(cH2, Math.max(BAND_MIN, rowH - ROW_GAP));
      const bandY = cy + (cH2 - bandH) / 2;
      ctx.save();
      try {
        ctx.globalAlpha = rp;
        drawSetStatRow(cx, bandY, colW, bandH, cells[i][0], cells[i][1], cells[i][2]);
      } finally { ctx.restore(); }
    }
  } finally { ctx.restore(); }

  /* --- 按钮：一律 mdButton，四级语义各用一种标准按钮 ---
     继续 = filled（唯一实色主操作）/ 成就 = tonal / 设置 = outlined /
     重开 = tonal / 返回主菜单 = destructive（errorContainer，全场唯一不可逆出口）。
     旧的"ghost + 主题色文字 + 绿/蓝/红手写字色"删掉：颜色不再由各按钮自己挑，
     于是"退出"在六个主题下都是同一个 error 家族。
     级联浮现（btnA0/1/2）保留 —— 那是一次性入场节奏，不是常态呼吸。 */
  const clamp01 = (v) => Math.min(1, Math.max(0, v));
  const btnA0 = clamp01((pt - 0.28) / 0.4);
  const btnA1 = clamp01((pt - 0.36) / 0.4);
  const btnA2 = clamp01((pt - 0.44) / 0.4);
  const B = PAUSE_BUTTONS;

  ctx.save();
  try {
    ctx.globalAlpha = btnA0;
    mdButton(B.resume.x, B.resume.y, B.resume.w, B.resume.h, '继 续 作 战', 'filled', { role: 'bodyLg' });
  } finally { ctx.restore(); }

  ctx.save();
  try {
    ctx.globalAlpha = btnA1;
    mdButton(B.ach.x, B.ach.y, B.ach.w, B.ach.h, '成 就', 'tonal');
    mdButton(B.settings.x, B.settings.y, B.settings.w, B.settings.h, '设 置', 'outlined');
  } finally { ctx.restore(); }

  ctx.save();
  try {
    ctx.globalAlpha = btnA2;
    mdButton(B.restart.x, B.restart.y, B.restart.w, B.restart.h, '重 开', 'tonal');
    mdButton(B.home.x, B.home.y, B.home.w, B.home.h, '返回主菜单', 'destructive');
  } finally { ctx.restore(); }
}

/* 成就页：mdTabs 分类 + tonal 层级/图标 alpha 区分达成态 + mdProgress 进度。
   为什么：旧版这一屏的颜色全是钉死的（rgba(4,8,14,.97) 死黑底 / #4ade80 标题与进度 /
   '#22384d' 灰徽章 / rgba(74,222,128,.6) 描边当达成态），换主题一动不动，而达成态用
   描边表达正是简报点名的非 MD3 语言。现在层级=tonal（containerHigh vs containerLow）、
   状态=图标 alpha、进度=mdProgress、奖励数值=MD3.chip / MD3.coin 角色，全屏随主题走。
   行高按列表区实际高度反算（照 drawHelpContent 的做法），H=320 装不下的部分明说
   "+N 项"，不再 break 静默丢行（H8）。命中只有页签，且仍由 layout 那一份数据说话。 */
function drawAchPage() {
  pushModalAnim('ach');
  const a = mdClamp(animV('ach'), 0, 1);
  mdScrim('modal', a);
  /* 淡入 = scrim + 一层 surface（与设置/图鉴页同法）：整页的 tonal 层级要有底座，
     而这块底座必须跟主题走 —— 旧版那层死黑就是"换主题整页不变"的元凶。 */
  ctx.save();
  try {
    ctx.globalAlpha = a;
    mdSurface(0, 0, W, H, { role: 'surface', radius: 0 });
  } finally { ctx.restore(); }

  /* 顶栏高度读 ACH_TAB.y（layoutButtons 定的那份），不在这里抄第二遍同一个数 */
  mdTopAppBar(0, ACH_TAB.y, { title: '成就' });
  const tabRects = mdTabs(ACH_TAB.x, ACH_TAB.y, ACH_TAB.w, ACH_TAB.h,
    ['全部', '已达成', '未达成'], achFilter);
  for (let i = 0; i < ACH_TAB_BTN.length && i < tabRects.length; i++) {
    ACH_TAB_BTN[i].x = tabRects[i].x; ACH_TAB_BTN[i].y = tabRects[i].y;
    ACH_TAB_BTN[i].w = tabRects[i].w; ACH_TAB_BTN[i].h = tabRects[i].h;
  }
  // 分隔线是页签带与内容区的分界（M3 hairline），不是页签自己的描边
  mdDivider(ACH_TAB.x, ACH_TAB.y + ACH_TAB.h, ACH_TAB.w, { role: 'outlineVariant' });

  let done = 0;
  for (const t of ACHIEVEMENTS) if (achievements[t.id]) done++;
  const total = ACHIEVEMENTS.length;
  const LX = 22, LW = W - 44, ip = LAYOUT.padSm();
  const sumY = ACH_TAB.y + ACH_TAB.h + 8;
  const barH = 4;
  /* 汇总卡高度由字阶现算（不是写死的 40）：DENSE 下字阶 ×0.88，
     写死的卡在横屏会把第三行顶出卡外，正好复现设置页统计卡那个老毛病。 */
  const lineH = Math.max(mdType('bodyLg'), mdType('label'));
  const sumH = ip * 2 + lineH + 3 + barH;
  mdCard(LX, sumY, LW, sumH, { role: 'surfaceContainerLow', radius: SHAPE.lg, elev: 1 });
  const ix = LX + ip, iw = LW - ip * 2;
  const sy = sumY + ip;
  const lbl = '已达成';
  mdText(lbl, ix, mdTextY(sy, lineH, 'body'), 'body', 'onSurfaceVariant');
  mdText(done + ' / ' + total, ix + mdTextWidth(lbl, 'body') + 6, mdTextY(sy, lineH, 'bodyLg'),
    'bodyLg', 'onSurface', { weight: 600 });
  /* 奖励数值靠右：芯片是局外成长的通货（progress.chips，成长树就扣它），
     金币是本局所得（state.coins）。颜色走 MD3.chip / MD3.coin 这两个**固定资源角色**
     （契约 §3.3：切主题不能动摇玩家对资源的识别），而不是在这里再抄一遍 '#ffd166'。 */
  const coinS = '金币 ' + state.coins, chipS = '芯片 ' + progress.chips;
  const coinW = mdTextWidth(coinS, 'label', 500);
  mdText(coinS, ix + iw, mdTextY(sy, lineH, 'label'), 'label', 'coin', { align: 'right' });
  mdText(chipS, ix + iw - coinW - 8, mdTextY(sy, lineH, 'label'), 'label', 'chip', { align: 'right' });
  mdProgress(ix, sy + lineH + 3, iw, barH, total > 0 ? done / total : 0,
    { role: 'success', trackRole: 'surfaceContainerHighest' });

  const list = [];
  for (const t of ACHIEVEMENTS) {
    const got = !!achievements[t.id];
    if (achFilter === 1 && !got) continue;
    if (achFilter === 2 && got) continue;
    list.push({ t: t, got: got });
  }
  const top = sumY + sumH + 8;
  const bottomLimit = H - 44;          // 与旧版列表底线同值：关闭按钮那一带不参与列表分配
  const gap = 2;
  const area = Math.max(0, bottomLimit - top);
  const twoH = Math.floor(mdType('bodyLg') + mdType('label') + 6);   // 两行（名称+描述）行盒下限
  const n = list.length;
  if (!n) {
    /* 空筛选给一句明话，不给一片空白 —— 空白会被读成"页面坏了" */
    mdTextC(achFilter === 1 ? '还没有已达成的成就，去打一局吧' : '全部成就已达成',
      W / 2, top + 14, 'body', 'onSurfaceVariant');
  } else {
    const rowH = Math.min(LAYOUT.listItem(), Math.max(twoH, Math.floor((area - gap * (n - 1)) / n)));
    const step = rowH + gap;
    /* 先按整区算放得下几行；放不下就把"+N 项"那一行的预算从列表区里扣出来 ——
       mdScrollList 默认把提示画在容器右下角，正好压在末行的尾部文本上。
       列表高给"整行数的确切值"而不是"区高减去一行"：组件的 per 是 floor((h+gap)/step)，
       末行行顶只要没越过容器底就会照画，于是它会探出容器底、压到关闭按钮那一代。 */
    let per = Math.max(1, Math.floor((area + gap) / step));
    let showPlus = 0;
    if (per < n) {
      per = Math.max(1, Math.floor((area - (mdType('label') + 3) + gap) / step));
      showPlus = n - per;
    }
    const listH = Math.min(per, n) * step - gap;
    mdScrollList(LX, top, LW, listH, {
      rows: n, rowH: rowH, gap: gap, scroll: 0, overflowLabel: false,
      renderRow: function (i, rx, ry, rw, rh) {
        const it = list[i];
        /* 达成/未达成只用 MD3 自己的两种语言：
           ① tonal 层级（surfaceContainerHigh vs surfaceContainerLow）
           ② 状态图标的 alpha（1 vs 0.55）
           旧版那圈 rgba(74,222,128,.6) 描边（border 当状态）整条删掉。
           leading 给图标本身的宽度：mdListItem 已经加了两个 padSm，
           再按"图标+padSm"预留会让正文比视觉需要的位置右移 8px。 */
        mdSurface(rx, ry, rw, rh, {
          role: it.got ? 'surfaceContainerHigh' : 'surfaceContainerLow', radius: SHAPE.sm
        });
        const bs = Math.max(12, Math.min(20, rh - 8));
        mdIcon(it.got ? 'check' : 'lock', rx + ip + bs / 2, ry + rh / 2, bs,
          it.got ? 'success' : 'onSurfaceVariant', { alpha: it.got ? 1 : 0.55 });
        mdListItem(rx, ry, rw, rh, {
          leading: bs, radius: SHAPE.sm,
          title: it.t.name, supporting: it.t.desc,
          trailingText: it.got ? '已达成' : '未解锁',
          trailingRole: it.got ? 'success' : hexA(MD3.onSurfaceVariant, 0.7)
        });
      }
    });
    if (showPlus > 0) {
      mdText('+' + showPlus + ' 项', LX + LW - 2, top + listH + 3, 'label', 'onSurfaceVariant',
        { align: 'right' });
    }
  }

  /* 关闭 affordance：矩形与旧版逐字同式（120×26，居中，y = H-34）——重写绘制不动几何；
     命中行为也没挪，整页仍是"点任意处返回"，这颗按钮只是它的可见 affordance。 */
  const bw2 = 120, bh2 = 26, bx2 = (W - bw2) / 2, by2 = H - 34;
  mdButton(bx2, by2, bw2, bh2, '点 击 返 回', 'tonal');
  popModalAnim();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#05060a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(viewScale, 0, 0, viewScale, viewOffsetX, viewOffsetY);
  ctx.save();
  if (state.shake > 0.3) ctx.translate(Math.round((Math.random() - 0.5) * state.shake), Math.round((Math.random() - 0.5) * state.shake));
  drawBackground();
  if (state.mode === MODE_PLAY && !upgradePanel.active && combo >= 10) {
    const a = 0.035 + Math.sin(state.time * 8) * 0.015;
    ctx.fillStyle = combo >= 25 ? 'rgba(255,209,102,' + a + ')' : 'rgba(58,209,255,' + a + ')'; ctx.fillRect(0, 0, W, H);
  }
  if (state.mode === MODE_PLAY || state.mode === MODE_OVER) {
    drawPowerups(); drawEnemies(); drawBoss(); drawDrones(); drawBullets(); drawFXEntity();
    drawPlayerAura();      // 环画在飞机之前：它是底衬，不能遮住飞机本体
    drawPlayer();
    drawFX(); drawUltBeam();
  }
  ctx.restore();
  if (flashScreen > 0) {
    ctx.globalAlpha = Math.min(0.7, flashScreen);
    ctx.fillStyle = flashColor;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  /* 色差冲击：大爆炸时整屏短暂"重影 + 边缘色散"。
     真·逐像素 RGB 分离在 canvas2d 上要多次全屏重绘，代价太高；
     这里用"整屏加性残影 + 左右红/青边缘渐变"近似，视觉冲击力接近而只需一次 drawImage。
     只在 chroma 明显时触发，且受 quality 限制（低端机跳过残影只留边缘色）。 */
  if (chroma > 0.03) {
    const k = Math.min(1, chroma);
    if (quality > 0.5) {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);              // 自绘需回到设备坐标系
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = k * 0.28;
      const off = 2 + k * 5;
      ctx.drawImage(canvas, off, 0);
      ctx.drawImage(canvas, -off, 0);
      ctx.restore();
      ctx.setTransform(viewScale, 0, 0, viewScale, viewOffsetX, viewOffsetY);
    }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const edge = 26 + k * 22;
    let g = ctx.createLinearGradient(0, 0, edge, 0);
    g.addColorStop(0, 'rgba(255, 32, 96, ' + (k * 0.22) + ')');
    g.addColorStop(1, 'rgba(255, 32, 96, 0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, edge, H);
    g = ctx.createLinearGradient(W, 0, W - edge, 0);
    g.addColorStop(0, 'rgba(32, 224, 255, ' + (k * 0.22) + ')');
    g.addColorStop(1, 'rgba(32, 224, 255, 0)');
    ctx.fillStyle = g; ctx.fillRect(W - edge, 0, edge, H);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  /* 危险脉冲：血量越低，屏边红光越强、心跳越快。
     原来低血只有一层固定强度的红光 —— 30% 血和 5% 血看起来一样，
     紧迫感没有梯度。现在频率和强度都随血量逼近 0 而上升。 */
  if (state.lowHp && state.mode === MODE_PLAY) {
    const danger = 1 - Math.max(0, state.hp / state.maxHp) / 0.5;   // 0(50%) → 1(0%)
    const beat = 6 + danger * 7;                                    // 心跳频率 6 → 13
    const pulse = (0.18 + danger * 0.26) + Math.sin(state.time * beat) * (0.10 + danger * 0.16);
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.28, W / 2, H / 2, Math.max(W, H) * 0.62);
    vg.addColorStop(0, 'rgba(255, 77, 109, 0)');
    vg.addColorStop(1, 'rgba(255, 77, 109, ' + Math.max(0, pulse) + ')');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  if (state.mode === MODE_MENU) drawMenu();
  else if (state.mode === MODE_PLAY) {
    /* 暂停 = 模态屏：战场 HUD、武器条、Boss 血条一起收起。
       三条理由：
       ① 暂停面板的标题带（16→46）与 HUD 顶栏 + 子状态条（0→64）是叠在同一段像素上的，
          遮罩压暗只是把"两层字"变成"一层暗字底上一层亮字"，读起来还是糊的；
       ② 面板那八格（存活/击杀/DPS/波次/命中率/道具/连击/分数）本来就是 HUD 读数的超集，
          同屏两份只会让玩家对不上号；
       ③ 武器条那六个槽正好在「重开 / 返回主菜单」下面，退场行压在槽位上。
       drawTutorial（新手提示气泡）是 drawHUD 调的，所以它跟着收 —— 这才是它被面板
       下沿切掉半截的正解：不是把气泡挪位，而是暂停时它本就不该在。
       paused 在退场动画期间仍为 true（pauseT 退回 0 才复位，见 update() 的 paused 分支），
       所以 HUD 与面板是同一帧交接，不会出现两块都空的中间态。 */
    if (!paused) { drawHUD(); drawBossHealth(); drawWeaponBar(); }
    drawBanner(); drawAchPopup();
    drawMenuCollapse();
    drawLockMark(); drawThreatArrows();
    if (upgradePanel.active) drawUpgradePanel();
    if (paused) drawPause();
  } else if (state.mode === MODE_OVER) {
    /* 与暂停页同一条规则：结算页是模态屏，HUD / 武器条一起收。
       drawGameOver 自己会铺一层整屏 surface，但它只到 0.94 alpha（要留住死亡定格的残影），
       所以底下那两层**不是看不见，是以 6% 灰影贴在空带上** —— 换主题时 HUD 的颜色在变，
       灰影跟着变，看着像渲染 bug。结算页的五张卡本来就是 HUD 读数的超集。
       drawAchPopup 留着：成就可能在致命一击那一帧刚弹出，删了它就没有"这局拿到了什么"的闭环。 */
    drawGameOver(); drawAchPopup();
  }
  /* 帧数面板：画在**所有 UI 之上**（HUD / Boss 血条 / 道具栏 / 横幅 / 弹窗都在其下）。
     它是调试层，被任何一块 UI 盖住就失去意义 —— Boss 血条尤其致命，
     因为 Boss 战满屏弹幕、正是最容易掉帧、最需要看曲线的时刻。
     排在重开淡入遮罩**之前**：转场遮罩该盖住一切，包括调试层。 */
  drawFps();

  /* 重开淡入：盖在**所有游戏内容之上**（HUD 也在内），从全黑淡到透明。
     放在最后而不是 HUD 之前：淡入是"整个画面出现"的过程，
     如果 HUD 不参与，会看到数据条先亮、战场后亮，层次被拆成两段。 */
  if (restartFade < 1 && state.mode === MODE_PLAY) {
    ctx.save();
    ctx.globalAlpha = 1 - restartFade;
    ctx.fillStyle = '#05060a';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

/* ==================================================================
   流程控制
   ================================================================== */
function resetGame() {
  playerFace = -Math.PI / 2; pxPrev = player.x; pyPrev = player.y;
  lockTarget = null; lockT = 0;
  state.score = 0; state.maxHp = MAX_HP_BASE; state.hp = MAX_HP_BASE; state.wave = 0; state.coins = 0; state.shake = 0; state.time = 0; state.waveDelay = 0;
  state.hpFlash = 0; state.lowHp = false; weaponGlow = 0; deathT = 0; goAnim = 0;
  hitstop = 0;
  bullets = []; ebullets = []; enemies = []; particles = []; shockwaves = []; powerups = []; arcs = []; waveQueue = [];
  waveClock = 0; boss = null; flashScreen = 0; enemyIdCounter = 0; clearGameTimers();
  combo = 0; comboTimer = 0; maxCombo = 0; drones = [];
  ultCd = 0; ultActive = 0; ultScanY = H; magnet = 0; floatTexts = []; droneHitCount = 0; lastZoneIdx = 0;
  /* ⚠️ 事件计时器必须在这里全部清零：它们独立于波次状态，
     不清零会残留到下一局，表现为"刚开局就被吸向中心 / 视野是暗的"。
     这类 bug 只在连续两局且第一局末尾正好触发事件时才出现，极难复现。 */
  feverT = 0; stasisT = 0; ultJamT = 0; gravityT = 0; blackoutT = 0;
  meteorT = 0; meteorClock = 0; purgeArmed = false;
  itemCounts = [0, 0, 0, 0, 0]; slowT = 0; dmgMul = 1; statusId = null; statusT = 0; dodgeCd = 0; muzzles = [];
  resetHpGhost();
  player.x = W / 2; player.y = H - 60; player.cool = 0; player.inv = 1.5; player.alive = true; player.respawn = 0;
  player.power = 1; player.shield = 0; player.spread = 0; player.weapon = 0; player.boomCount = 1;
  upgradePanel.active = false; upgradePanel.options = [];

    if (menuFall < 1) menuFall = Math.min(1, menuFall + delta / FALL_DUR);
    uiTime += delta;
    animUpdate(delta); tutUpdate(delta); rollUpdate(delta); uiSyncClose();
    render(); return;
  }
  /* hit-stop：世界完全冻结，但**震屏继续衰减** —— 定格的画面在震动，
     这才是"重击"。如果震屏也停了，看起来就像掉帧而不是被打中。 */
  if (hitstop > 0) {
    hitstop = Math.max(0, hitstop - delta);
    if (state.shake > 0) state.shake = Math.max(0, state.shake - delta * 42);
    accumulator = 0;
    render(); return;
  }
  pauseT = 0;
  state.time += delta; uiTime += delta;
  accumulator += delta; let guard = 0;
  // 时间缓动：缩放的是推进量而非真实时间，slowmo 用 delta（真实）递减
  const tScale = slowmo > 0 ? 0.4 : 1;
  while (accumulator >= STEP && guard < 6) { update(STEP * tScale); accumulator -= STEP; guard++; }
  if (guard >= 6) accumulator = 0;
  if (slowmo > 0) slowmo = Math.max(0, slowmo - delta);
  render();
}
/* 成长进度在这里统一加载：它写 progress 又刷新 SHIELD_MAX，
   两者/相关函数都定义在文件中部 —— 在声明前调用会撞 TDZ。 */
loadProgress();
refreshShieldMax();

/* 画质档位在这里统一加载（而非定义处）：
   loadQualityMode 会读 QUALITY_MODES 并写 quality，两者都定义在文件中部 ——
   在定义之前调用会撞 const/let 的暂时性死区（TDZ），直接抛
   "Cannot access ... before initialization"，整个脚本静默失效。
   放在末尾、resize() 之前：此时所有声明已完成，且早于第一帧。 */
loadQualityMode();
resize();
requestAnimationFrame(loop);

})();
</script>
