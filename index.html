      mdText(label, W / 2, top, tRole, 'coin', { align: 'center', weight: 700 });
      if (showWord) mdText('COMBO', W / 2, top + 18, 'label', 'warning', { align: 'center', weight: 600 });
      mdProgress(bx + pad, barY, bw - pad * 2, 4, comboTimer / COMBO_WINDOW,
        { trackRole: 'surfaceContainerHighest', role: 'coin' });
    } finally { ctx.restore(); }
  }

  // 引导条：在 HUD 与特效之上、弹窗之下
  drawTutorial();

  /* FPS 面板**不在这里画**：它排在本函数之内会让 Boss 血条整块盖掉它，
     已移到 render() 最后统一调用（见 drawFps 内注释）。
     它按 STATUS_CHIP_BOTTOM 让位，所以 Z4 行带上移时帧数面板自动跟。 */

  // 状态胶囊：只显示"当前激活"的状态，未激活不占位 —— 比原来一排无字色块更详细也更干净
  drawStatusChips();
  drawItemBar();
  drawToasts();

  /* --- 右下：当前武器名 / 回旋镖计数 / 火力等级 ---（局内武器条之上的三行辅助读数）
     火力等级改成 mdSegments 离散格：旧写法每级加一根 5px 小方块，玩家看不出上限在哪；
     四格定死后"Lv.4 满"这件事第一次变得可见（player.power 的硬上限就是 4）。 */
  const sy = H - WB_H - 12;
  if (player.weapon === 5) mdText('回旋镖 x' + player.boomCount, W - 6, sy - 18, 'label', 'tertiary', { align: 'right', weight: 600 });
  mdText(WEAPONS[player.weapon].name, W - 6, sy - 5, 'label', mdSeed(WEAPONS[player.weapon].color), { align: 'right', weight: 600 });
  mdSegments(W - 6 - 26, sy + 4, 26, 3, 4, { filled: player.power, role: 'primary', gap: 2 });
  if (hudAnim) ctx.restore();   // [v1.7c] 开局滑入结束
}

function drawBossHealth() {
  /* 为什么：原条 = 一块手写暗底 + 三条硬刻痕 + 末端一枚 lighter 锐光 + 半血一圈白描边。
     锐光与白边是违禁通道，刻痕读起来像尺子而不像"还剩几管"。
     现在：条体 mdProgress、"分几管" mdSegments（两段共用它反推出的同一份 cw/gap，
     不在这里再乘一遍宽度），半血升阶用一次性状态层衰减。
     bx / bw / by 三个锚点表达式逐字保留 —— 本函数不产出命中区，改它们只会去抢顶栏的地方。 */
  if (!boss) return;
  const ratio = mdClamp(boss.hp / boss.maxhp, 0, 1);
  const bw = W - 52, bx = 26, by = HUD_H + BOSS_BAR_DY;
  const BH = BOSS_BAR_H;
  /* PH = 2 不是审美选择：首领只有二阶段（boss.phase2 在血量 50% 处翻转，见 boss AI 段），
     所以"两管"就是"两个阶段"，一格对应一次升阶。 */
  const PH = 2;
  /* 三段阈值沿用旧分档（60% / 30%），但换成语义角色：生命=primary、警戒=warning、濒危=error。
     旧第一段直接吃 boss.color —— 那是三只首领各一枚的钉死色，切主题纹丝不动。 */
  const hpRole = ratio > 0.6 ? 'primary' : (ratio > 0.3 ? 'warning' : 'error');
  const seg = mdSegments(bx, by, bw, BH, PH, { gap: 3, filled: 0, emptyRole: 'surfaceContainerHighest' });
  const tubes = seg ? PH : 1, cw = seg ? seg.cw : bw, gap = seg ? seg.gap : 0;
  for (let i = 0; i < tubes; i++) {
    /* 第 i 管管 [i/PH,(i+1)/PH] 那一段：右管先空、左管后空 ——
       条长答"还剩多少"，空掉几管答"打过了几个阶段"。 */
    mdProgress(bx + i * (cw + gap), by, cw, BH, mdClamp((ratio - i / tubes) * tubes, 0, 1),
      { role: hpRole, trackRole: 'surfaceContainerHighest' });
  }
  if (boss.phaseFlash > 0) {
    /* 升阶是一次性事件（0.3 秒衰减），所以用状态层而不是描边：MD3 里没有"白边闪一下"。 */
    mdStateLayer(bx, by, bw, BH, SHAPE.xs, STATE.drag * mdClamp(boss.phaseFlash / 0.3, 0, 1), MD3.onSurface);
  }
  /* 名称与读数并成一行放在条子下面。旧写法把名称画在 by - 12（=62），
     正压在 HUD 的下沿上（HUD_H=64 有一条 hairline），换字阶后更会把那条线糊掉。
     左右各占半行、中央让出一格：那一格是顶栏连击徽标的地盘。**这 18 不是审美值**，
     是实测出来的（combo=12 强开、drawHUD 真画一遍后的墨迹边界）：
       "X12"  x108.1→131.9 y72→83（压在条带里，见 leftover）
       "COMBO" x103.2→136.8 y90→98  ← 与本行同带，右沿距中心 16.9
       衰减条 x90→150 y102→106（在本行之下）
     取 18 = 16.9 + 呼吸。半宽从同一份 bw 反推，不在别处再乘一遍：两个宿主在同一行里
     各写各的 x 就是"预算端与占位端各写一遍"。实测本行左沿 86.9 / 右沿 144.4，
     与徽标留 16.3 / 7.6 的空隙。
     装不下四位血量的"绝对值 · 百分比"时退回只显示百分比 —— 宁可少一个数字，
     也不让读数被徽标切成半截。 */
  const rowY = by + BH + 3, rowH = mdType('titleSm');
  const slotHalf = 18;                       // 中央让给顶栏徽标的半宽，来源见上
  const halfW = Math.max(10, (bx + bw) - (W / 2 + slotHalf));
  const pct = Math.round(ratio * 100) + '%';
  const full = Math.ceil(Math.max(0, boss.hp)) + '/' + boss.maxhp + ' · ' + pct;
  const val = mdTextWidth(full, 'label', 600) <= halfW ? full : pct;
  mdText(mdEllipsis('首领 · ' + boss.name, halfW, 'titleSm', 600),
    bx, rowY, 'titleSm', 'onSurface', { weight: 600 });
  mdText(val, bx + bw, mdTextY(rowY, rowH, 'label'), 'label', 'onSurfaceVariant',
    { align: 'right', weight: 600 });
}
/* ==================================================================
   左下角状态提示（toast）
   ==================================================================
   拾取道具 / 超载就绪这类"发生了什么"的事件，需要一个不打断操作的位置。
   banner 在屏幕正中偏上（HUD 下方），是给**波次切换**这种全屏级事件用的 ——
   吃个血包也用 banner 会把弹幕挡住，而且玩家根本不会抬头去看。
   左下角是弹幕游戏里视线余光能覆盖、又几乎不会挡住来敌的位置。

   设计要点：
     · 3 秒自动消失，不需要玩家处理（不是弹窗，没有"关闭"）
     · **最新在底部**：新提示出现的位置固定，眼睛不用重新找
     · 同名提示刷新计时并累加次数（连吃三个血包显示"×3"而不是刷三行）
     · 最多 4 条，超出丢最旧的 —— 连续事件不该把屏幕堆满 */
const TOAST_LIFE = 3, TOAST_MAX = 4;
let toasts = [];
function pushToast(text, sub, color) {
  const last = toasts[toasts.length - 1];
  if (last && last.text === text) {
    last.life = TOAST_LIFE;                    // 同名刷新，避免刷屏
    last.count = (last.count || 1) + 1;
    last.sub = sub || last.sub;
    return;
  }
  toasts.push({ text: text, sub: sub || '', color: color || 'onSurfaceVariant',
    life: TOAST_LIFE, max: TOAST_LIFE, count: 1, born: state.time,
    bornMs: Date.now() });   // [v1.7p] 入场用真实时钟：暂停时 life 冻结也能算入场进度
  if (toasts.length > TOAST_MAX) toasts.shift();
}
function updateToasts(dt) {
  for (let i = toasts.length - 1; i >= 0; i--) {
    toasts[i].life -= dt;
    if (toasts[i].life <= 0) toasts.splice(i, 1);
  }
}
/* toast = 底部轨道上的一叠 mdSurface 容器（neutral/success/warning/error 四档 tone），
   正文 + 副行 + mdBadge 计数，宽度逐条实量。
   为什么：旧版每块都是 rgba(8,18,30,.88) 的钉死暗玻璃 + hexA(t.color,.5) 的主题色描边 +
   左端 3px 色条 —— 三层"颜色自己解释自己"，切主题只有那圈描边会动。现在语义只由容器角色
   表达（危险=errorContainer），文字一律配对的 onXxx，落点与引导气泡同一条轨道所以不再叠字。 */
function drawToasts() {
  if (!toasts.length) return;
  /* [v1.7p] paused 从 gate 移除：drawPause 尾部也调本函数（重生拒绝等
     暂停面板上的即时反馈）；drawHUD 路径只在非暂停跑，不受影响；
     upgradePanel 的 9 秒决策窗保持不画（那窗口本来就该极简）。 */
  if (state.mode !== MODE_PLAY || upgradePanel.active) return;
  const h = hintToastH(), gap = hintGap(), pad = LAYOUT.padSm();
  /* 装不下就明说"+N 条"（H8 禁止静默丢内容）：H=320 且横幅/成就弹条都在时，
     顶部轨道与引导气泡之间只剩三行的缝，旧版是继续往上堆、直接压到横幅上。 */
  const ceil = hintTopBottom();
  const labelH = mdType('label');
  /* slot 0 贴底（引导气泡正上方），越靠上越早 —— MD3 底部锚定的 snackbar 叠法：
     新的一条落在锚点上，把旧的往上推。旧版是反的（新的往上冒、最旧的停在锚点被先吃掉），
     于是"最新一条"的位置每来一条都在动。 */
  const shownFits = (n) => hintToastY(n - 1, h) >= ceil &&
    (n === toasts.length || hintToastY(n - 1, h) - gap - labelH >= ceil);
  let vis = toasts.length;
  while (vis > 1 && !shownFits(vis)) vis--;
  if (vis < toasts.length) {
    /* 与 toast 栈同一条左基线：这条说明是栈的一部分，右对齐会飘成一句无关的旁白 */
    mdText('更早 ' + (toasts.length - vis) + ' 条', hintSafeL(),
      hintToastY(vis - 1, h) - gap - labelH, 'label', 'onSurfaceVariant', { weight: 500 });
  }
  for (let i = toasts.length - vis; i < toasts.length; i++) {
    const t = toasts[i];
    const slot = toasts.length - 1 - i;                 // 最新（数组末尾）在 slot 0 = 最下
    const y = hintToastY(slot, h);
    /* 入场滑入 / 退场淡出：进度仍由 toasts[].life 这份调用方状态算出来 */
    /* [v1.7p] 入场进度改用真实时钟（bornMs）：原来用 TOAST_LIFE - life 推算，
       而 life 只在 update 里衰减、暂停时 update 停 —— 暂停面板上入队的
       toast（如重生被拒）alpha 恒 0，永远不显示。真实时钟不受暂停影响；
       退场淡出仍用 life（暂停时 toast 保持显示，语义正确）。 */
    const inT = mdClamp((Date.now() - (t.bornMs || 0)) / 180, 0, 1);
    const ease = 1 - Math.pow(1 - inT, 3);
    const alpha = mdClamp(t.life / 0.4, 0, 1) * ease;
    if (alpha <= 0) continue;
    const tone = HINT_TONE[hintTone(t.color)];
    const countS = t.count > 1 ? 'x' + t.count : '';
    /* badgeW 镜像 mdBadge 自己的度量（max(12, 文字宽 + 6)）：组件不返回矩形，
       调用方只能按同一式子预留 —— 已写进 componentRequests。 */
    const badgeW = countS ? Math.max(12, mdTextWidth(countS, 'label', 600) + 6) : 0;
    const inner = Math.max(20, hintMaxW() - pad * 2 - (badgeW ? badgeW + 4 : 0));
    const textS = mdEllipsis(t.text, inner, 'body', 500);
    const textW = mdTextWidth(textS, 'body', 500);
    const subS = t.sub ? mdEllipsis(t.sub, Math.max(10, inner - textW - 4), 'label', 500) : '';
    const subW = subS ? mdTextWidth(subS, 'label', 500) + 4 : 0;
    const w = Math.min(hintMaxW(), pad * 2 + textW + subW + (badgeW ? badgeW + 4 : 0));
    const x = hintSafeL();
    ctx.save();
    try {
      ctx.globalAlpha = alpha;
      ctx.translate((1 - ease) * -LAYOUT.pad(), 0);     // 从左滑入（旧版 -14 = LAYOUT.pad()）
      mdSurface(x, y, w, h, { role: tone.bg, radius: SHAPE.xs });
      mdText(textS, x + pad, mdTextY(y, h, 'body'), 'body', tone.fg, { weight: 500 });
      if (subS) {
        /* 副行的弱化用 hexA(role,.78) 而不是 opt.alpha：外层已经压了整条 toast 的
           globalAlpha，opt.alpha 会把它**覆盖**成固定值，淡出时副行会掉队。 */
        mdText(subS, x + pad + textW + 4, mdTextY(y, h, 'label'), 'label',
          hexA(mdRole(tone.fg), 0.78), { weight: 500 });
      }
      if (badgeW) mdBadge(x + w - pad - badgeW / 2, y + h / 2, countS, 'tertiaryContainer');
    } finally { ctx.restore(); }
  }
}

/* 波次横幅 = mdBanner（tonal 容器 + 图标 + 正文/副行），落点是本包顶部轨道第一格。
   为什么：旧版是"没有容器的两行大字"，字号走 scale=2 的旧体系、颜色是四个调用点各写死的
   '#3ad1ff'/'#ffd166'/type.color，而 HUD_H+30 这一格正和成就弹条（HUD_H+20 起 26 高）互相盖。
   计时曲线只有收尾的 0.35 淡出照抄旧版；入场改成"从这条横幅出现那一刻起算 0.3 秒"。
   旧版把入场窗口钉死在 t∈(1.5,1.8]，而调用方给的总时长是 1.5/1.8/2.4 三种 ——
   2.4 秒的首领横幅要先空等 0.6 秒才浮出来（玩家以为没触发）。总时长记回 banner 这份
   调用方数据里（进度住在数据、组件只画当前帧），不新增任何模块级状态。 */
function drawBanner() {
  if (banner.t <= 0) return;
  const t = banner.t;
  if (banner.text !== banner.introText || !(banner.intro > 0) || t > banner.intro) {
    banner.introText = banner.text; banner.intro = t;    // 认作刚出现，记住它的总时长
  }
  const inT = mdClamp((banner.intro - t) / 0.3, 0, 1);   // 入场：出现后 0.3s 内淡入并落地
  let alpha = inT;
  if (t < 0.35) alpha = Math.min(alpha, t / 0.35);       // 收尾淡出
  alpha = mdClamp(alpha, 0, 1);
  if (alpha <= 0) return;
  const grow = 1.06 - 0.06 * inT;                        // 一次性 emphasized 入场，非常态呼吸
  const tone = hintTone(banner.color);
  const hasSub = !!banner.sub;
  const h = hintBannerH(hasSub), y = hintTopY();
  /* 40 = mdBanner 自己的左右开销（左 inset 10 + 图标带 22 + 右留 8）；
     宽度按实量文案给，所以短句不会撑成一条通栏。 */
  const inner = Math.max(20, hintMaxW() - 40);
  const textS = mdEllipsis(banner.text, inner, 'body', 500);
  const subS = hasSub ? mdEllipsis(banner.sub, inner, 'label', 500) : '';
  const w = Math.min(hintMaxW(), 40 + Math.max(mdTextWidth(textS, 'body', 500),
    mdTextWidth(subS, 'label', 500)));
  const x = hintCX() - w / 2;
  ctx.save();
  try {
    ctx.globalAlpha = alpha;
    const cx = hintCX(), cy = y + h / 2;
    ctx.translate(cx, cy); ctx.scale(grow, grow); ctx.translate(-cx, -cy);
    mdBanner(x, y, w, textS, {
      sub: subS, tone: tone, h: h,
      /* 图标只说"这一档是什么"：危险=warning，收获=trophy，其余是"出击" */
      icon: tone === 'error' ? 'warning' : tone === 'warning' ? 'trophy' : 'play'
    });
  } finally { ctx.restore(); }
}
/* 成就弹条 = mdCard(tertiaryContainer) + mdIcon('trophy') + 标题/描述两行。
   为什么：旧版是 rgba(6,14,24,.94) 死黑底 + '#ffd166' 描边 + 两行旧字号居中，落点 HUD_H+20
   正好压在横幅那两行字上。奖励一档在本包全程用 tertiaryContainer（危险才用 errorContainer），
   三段（图标 / 标题 / 描述）的度量全部派生自 TYPE 与 LAYOUT，宽度按最长文案实量。 */
function drawAchPopup() {
  if (achPopup.t <= 0) return;
  const alpha = mdClamp(achPopup.t / 0.5, 0, 1);
  if (alpha <= 0) return;
  const pad = LAYOUT.padSm();
  const h = hintAchH();
  /* 排在横幅下面那一格：击破首领时"首领击破"横幅与成就同时到，两件事都要看得见 */
  const y = hintTopY() + (banner.t > 0 ? hintBannerH(!!banner.sub) + hintGap() : 0);
  const icS = Math.min(20, h - pad * 2);
  const inner = Math.max(20, hintMaxW() - pad * 2 - icS - pad);
  const nameS = mdEllipsis(achPopup.text, inner, 'bodyLg', 500);
  const overS = mdEllipsis('成就解锁', inner, 'label', 500);
  const w = Math.min(hintMaxW(), pad * 2 + icS + pad +
    Math.max(mdTextWidth(nameS, 'bodyLg', 500), mdTextWidth(overS, 'label', 500)));
  const x = hintCX() - w / 2;
  ctx.save();
  try {
    ctx.globalAlpha = alpha;
    ctx.translate(0, (1 - alpha) * -LAYOUT.padSm());   // 从上面落进来（淡入即位移，不另存进度）
    mdCard(x, y, w, h, { role: 'tertiaryContainer', radius: SHAPE.md, elev: 2 });
    mdIcon('trophy', x + pad + icS / 2, y + h / 2, icS, 'onTertiaryContainer');
    const tx = x + pad + icS + pad;
    const blockH = mdType('bodyLg') + 2 + mdType('label');
    const top = y + (h - blockH) / 2;
    mdText(nameS, tx, top, 'bodyLg', 'onTertiaryContainer', { weight: 500 });
    mdText(overS, tx, top + mdType('bodyLg') + 2, 'label', hexA(MD3.onTertiaryContainer, 0.8),
      { weight: 500 });
  } finally { ctx.restore(); }
}
function drawUpgradePanel() {
  /* 为什么整块重写而不是逐行换色：这一屏同时踩了自写遮罩、sheen、彩色描边当
     affordance、legacy 字号倍率、sin 常驻呼吸、绘制/命中不同源六类问题，
     逐行换色会把"界面只描述内容与布局、外观一律问组件"的契约留在原地不动。 */
  if (!upgradePanel.active) return;
  /* 遮罩唯一入口 mdScrim：旧写法 rgba(4,8,14,0.9) 是 6 种自写浓度里最深的一档，
     且色相钉死、切主题纹丝不动。 */
  mdScrim('modal', UP_SCRIM_SCALE);
  upLayout();   // 卡片高度/起始 y/入场位移都在 layout 产出，下面全部只读
  UP_SKIP_BTN.y = upSkipY();   // 卡数可能不足 3，y 必须在绘制前同步（且跟着 y0 一起位移）

  /* [v1.7] 顶部节奏收紧：HUD_H+8 标题 / HUD_H+28 金币行带 / HUD_H+44 计时条，
     卡片区起点仍是 upLayout 的 HUD_H+52（命中矩形零改动）。
     mdText 的 y 是"字阶盒子上沿"、按 em 中心落笔（旧 textBaseline='top' 会把
     CJK 墨迹压低 2~5px）。HUD_H+4 的通栏 sheen 已删：顶栏与内容区的分界由 HUD
     自己的 hairline 负责，不需要第二条线。 */
  mdTextC('升级商店', W / 2, HUD_H + 8, 'title', 'primary');
  const bandY = HUD_H + 28, bandH = mdType('body');
  /* 金币是契约 §3.3 里**固定**的资源色（切主题不能动摇对资源的识别），
     但值只能经 MD3.coin 拿，不能再在这里手写第二次金币色。 */
  mdTextC('金币 ' + state.coins, W / 2, bandY, 'body', MD3.coin);
  /* 「剩余 N 秒」与金币同一行带，所以它的 y 由带高反推（mdTextY），不再各写 40/41。
     右端内缩从硬编码 W-22 改成 W-LAYOUT.pad()（竖屏 14 / 矮屏 10）。
     这一行**没有命中**：handleUpgradeTap 只测卡片与跳过按钮，其余坐标一律走
     "点空白关闭"，所以内缩不挪走任何玩家点得到的东西。 */
  mdText('剩余 ' + Math.ceil(upgradePanel.timer) + ' 秒', W - LAYOUT.pad(),
    mdTextY(bandY, bandH, 'label'), 'label', 'onSurfaceVariant', { align: 'right' });
  /* [v1.7] 计时条：剩余比例 = timer / UP_INTRO.total。升级商店是限时决策场景，
     "还剩多久"从右上角一行 label 升为一根主色进度条 —— 图标与文字之外多一条
     不用读数就能感知的通道。轨道用 Highest（scrim 之上最响的静态层）。 */
  mdProgress(22, HUD_H + 44, W - 44, 4, Math.max(0, upgradePanel.timer) / UP_INTRO.total,
    { role: 'primary', trackRole: 'surfaceContainerHighest' });

  /* 卡片四样：图标 + 名字 + 核心数字 + 效果说明（tip）。
     买得起 / 买不起在 MD3 里不是"描边颜色不同"，而是**同一层级 + disabled 去饱和**：
     旧的 opt.color 1.4px 彩色描边属于"主题色描边当 affordance"（删除清单），
     而组件契约本来就是"默认不描边、分组靠 tonal 层级"。 */
  const padSm = LAYOUT.padSm();
  const tileS = 30, tileX = UP_PANEL.x + 6;          // 图标格与改造前同尺寸同左内缩
  const textX = tileX + tileS + padSm;               // 图标格右缘 + 一个 padSm（旧值硬编码 x+42）
  const rightX = UP_PANEL.x + UP_PANEL.w - LAYOUT.pad();
  const rowGap = 2;                                  // 两行小字的行距，与 mdListItem 同一条
  for (let i = 0; i < upgradePanel.options.length; i++) {
    const opt = upgradePanel.options[i];
    /* [v1.7c] 卡片级联：每张卡自己的 intro（per=0.14），落位到静止位 UP_PANEL.rest ——
       命中判定（handleUpgradeTap）始终读静止位，入场 0.28s 内点击与原统一位移同一口径。 */
    const cp = easeOutCubic(staggerV(UP_PANEL.intro, i, 0.14));
    const y = UP_PANEL.rest + i * (UP_PANEL.h + UP_PANEL.gap) + Math.round((1 - cp) * UP_PANEL.slide);
    const CH = UP_PANEL.h;
    const cost = upgCostOf(opt);
    const affordable = state.coins >= cost;
    /* 身份色：UPGRADES 表里的 hex 是"读形状"用的，经 mdSeed 落到当前主题的色相槽位，
       只发给图标与强调文字（名字/核心数字），不再拿它去描卡片的边。 */
    const seed = mdSeed(opt.color);
    let coreStr;
    try { coreStr = typeof opt.core === 'function' ? opt.core() : opt.core; } catch (e) { coreStr = ''; }
    if (coreStr === undefined || coreStr === null) coreStr = '';
    coreStr = String(coreStr);
    const costStr = cost + 'C';
    /* 效果说明：矮屏（卡片 < 58）时省略，优先保证上面三样清晰。
       无 tip 位置时才画键盘序号 —— 两行小字叠在一起会糊。 */
    const hasTip = upShowTip && !!opt.tip;
    const sub = hasTip ? opt.tip : (isTouch ? '' : (i + 1) + ' 键');
    /* 右列宽度按实量文本给，左列才有可信的截断预算：
       旧写法直接 drawText 不限宽，'子弹伤害 +20%（最多叠到 +150%）' 这种长 tip
       在 200 宽的卡上是会一路画出卡片右缘的。 */
    const rightW = Math.max(mdTextWidth(coreStr, 'bodyLg', 700), mdTextWidth(costStr, 'label', 500));
    const maxW = Math.max(10, rightX - rightW - padSm - textX);
    ctx.save();
    try {
      /* [v1.7c] 入场淡入：每张卡自己的级联进度（面与阴影一起），静止时恒为 1。 */
      ctx.globalAlpha = cp;
      mdCard(UP_PANEL.x, y, UP_PANEL.w, CH,
        { role: 'surfaceContainerHigh', elev: 1, radius: SHAPE.md });
      /* 可买的信号换成"点得动"：按压 state layer。买不起时连按压都不给 ——
         按压反馈是在承诺"点我得动"，与 mdButton 的禁用态同一条理由。 */
      const pa = affordable ? mdPressA(UP_PANEL.x, y, UP_PANEL.w, CH) : 0;
      if (pa > 0) mdStateLayer(UP_PANEL.x, y, UP_PANEL.w, CH, SHAPE.md, pa, 'onSurface');
      ctx.save();
      try {
        /* 内容（图标+三行字）单独走 disabledFg 一档：面保持同一层级不去色，
           只有前景淡掉 —— 这才是 M3 的 disabled（fg 38% / bg 12%），
           而不是旧写法"整块换个钉死的暗底"。 */
        ctx.globalAlpha = UP_PANEL.intro * (affordable ? 1 : STATE.disabledFg);
        /* 图标格：surfaceContainerLowest 的凹陷小台，不描边（旧 rgba(6,14,26,.9) +
           hexA(opt.color,.6) 边框是同一处"彩色描边当 affordance"）。
           drawUpgradeIcon 的签名 (kind,cx,cy,r,color) 冻结，实现由 icons 包并行替换。 */
        mdSurface(tileX, y + (CH - tileS) / 2, tileS, tileS,
          { role: 'surfaceContainerLowest', radius: SHAPE.sm });
        drawUpgradeIcon(opt.icon, tileX + tileS / 2, y + CH / 2, 9, seed);
        /* 字号倍率全部落 TYPE 档：名字 1.0→body、核心数字 1.15→bodyLg、
           价格 0.72 / tip 0.58 / "N 键" 0.6 → label。
           垂直方向不再写 y+7/+8/+22/+34 这四个魔法数，改成两列各自在卡高内居中。 */
        const leftBlock = mdType('body') + (sub ? rowGap + mdType('label') : 0);
        const leftTop = y + (CH - leftBlock) / 2;
        mdText(mdEllipsis(opt.name, maxW, 'body', 500), textX, leftTop, 'body', seed, { weight: 500 });
        if (sub) {
          mdText(mdEllipsis(sub, maxW, 'label', 500), textX,
            leftTop + mdType('body') + rowGap, 'label', 'onSurfaceVariant', { weight: 500 });
        }
        const rightTop = y + (CH - (mdType('bodyLg') + rowGap + mdType('label'))) / 2;
        mdText(coreStr, rightX, rightTop, 'bodyLg', seed, { align: 'right', weight: 700 });
        /* 买不起时价格不带 coin：coin 这个记号在本屏只代表"你付得起" */
        mdText(costStr, rightX, rightTop + mdType('bodyLg') + rowGap, 'label',
          affordable ? MD3.coin : 'onSurfaceVariant', { align: 'right', weight: 500 });
      } finally { ctx.restore(); }
    } finally { ctx.restore(); }
  }

  /* 跳过按钮：原来是一圈 sin 呼吸的发光描边（border alpha 0.4→0.7、线宽 1→1.3
     都由 sin(state.time*2)*0.5 每帧驱动）—— 删除清单上的两项叠在同一个控件上。
     MD3 里"放弃这次升级"就是一个 outlined 按钮：静态外框 + 按压 state layer。
     几何仍读 UP_SKIP_BTN（y 由 upSkipY() 拥有），mdButton 原样返回同一个矩形。 */
  const sk = UP_SKIP_BTN;
  mdButton(sk.x, sk.y, sk.w, sk.h, '跳 过（放弃本次升级）', 'outlined');

  /* 底部只留一行操作提示 —— 「剩余 N 秒」已在顶部金币行右侧。
     H-30 这个 y 同时是 upLayout 的 botLimit 依据（H-30-10），所以不许改。 */
  mdTextC(isTouch ? '点击卡片购买' : '按 1-3 购买 · 空格跳过', W / 2, H - 30, 'label',
    'onSurfaceVariant');
}

/* 细状态条（护盾 / 过载）：标签 + 细条 + 数值，一行 8px。
   抽成通用函数是因为两条结构完全一样，只有颜色/文案/比例不同 ——
   写两份的话改间距、改圆角时必然漏改一处，两条就会悄悄错位。

   与血条的区别：血条是"生命线"要给足高度，这两条是"剩余时长/蓄能"，
   属于辅助读数 —— 给 4px 高就够，做太重会抢血条的视觉权重。
   未激活时（护盾 0）仍然画出空槽：栏位固定，玩家不用每帧重新找位置。 */
/* 血条拖尾残影：受击时不直接掉到新值，而是先留一段灰色残影再收缩。
   直接变短的话，"掉了多少血"这件事要玩家自己比对前后长度才看得出来；
   留一段残影，掉血的量就是那段残影的长度 —— 一眼可读。
   治疗时反过来：残影低于真实值 → 绿色微涨，同样可读。 */
let hpGhost = 1;
function updateHpGhost(dt) {
  const cur = Math.max(0, Math.min(1, state.hp / state.maxHp));
  // 残影追真实值：受伤后约 0.45s 收完，足够看清又不拖沓
  const speed = dt / 0.45;
  if (hpGhost > cur) hpGhost = Math.max(cur, hpGhost - speed);
  else if (hpGhost < cur) hpGhost = Math.min(cur, hpGhost + speed);
  else hpGhost = cur;
}
function resetHpGhost() { hpGhost = 1; }

function drawStatCell(x, y, w, h, icon, ratio, valueText, fillRole, active, pulse, opt) {
  /* [v1.7 排版 2.0] 旧 drawSubStatBar 是"文字标签 + 57px 短条 + 数值"四行竖排，
     占满顶栏左半 —— 标签是文字而不是记号，四行的高度全部花在"读标签"上。
     资源格化：一张 surfaceContainerHigh 小卡（比顶栏底板高一档，卡才浮得出），
     内部三段式 = 矢量图标（life/shield/ult/target，MD_ICON_PATHS 现成四枚）
     + 数值右对齐 + 底部微型条。文字标签退役：图标的形状就是标签（§3.3 同源），
     "生命/护盾/过载/敌人"四个词在这一格里第一次不再是必读项。 */
  opt = opt || {};
  /* main = 生命格：唯一"掉了就要死"的读数，微型条 3px vs 2px，权重靠厚度差。 */
  const barH = opt.main ? 3 : 2;
  const barY = y + h - barH - 2, bx = x + 3, bw = w - 6;
  const v = mdClamp(ratio, 0, 1);
  /* 未激活（护盾打空 / 本波清空）整格退 onSurfaceVariant，图标与条同源同退。 */
  const fill = active ? fillRole : 'onSurfaceVariant';
  /* 文字行：图标行在条上方，label(8px) 恰好装进 8~9px 行高。 */
  const rowB = barY - 2, rowH = rowB - y - 2;
  const icS = Math.min(9, rowH);
  mdIcon(icon, Math.round(x + 4 + icS / 2), Math.round(y + 2 + rowH / 2), icS, fill,
    { alpha: active ? 1 : 0.7 });
  if (valueText) {
    mdText(mdEllipsis(valueText, w - 6 - icS - 6, 'label', 600),
      x + w - 4, mdTextY(y + 2, rowH, 'label'), 'label',
      active ? 'onSurface' : 'onSurfaceVariant', { align: 'right', weight: 600 });
  }
  /* 轨道压在小卡（surfaceContainerHigh）上取 Highest 仍高两档，空槽与图底分得开。 */
  mdProgress(bx, barY, bw, barH, v, { trackRole: 'surfaceContainerHighest', role: fill });
  if (opt.main) {
    /* 残影 = M3 buffer 型进度的"次进度"：掉掉的那一段停在原地慢慢收，
       一眼读得出"刚才掉了多少"。颜色与真值同族（同一 active 色的低浓度）。 */
    const g = mdClamp(hpGhost, 0, 1);
    if (g > v + 0.004) {
      ctx.save();
      try {
        fillRoundRect(bx + bw * v, barY, Math.max(barH, bw * (g - v)), barH, barH / 2, hexA(mdRole(fill), 0.34));
      } finally { ctx.restore(); }
    }
    /* 受伤响应 = 一次 onSurface 状态层扫过整格（旧版把整条刷白）。 */
    if (opt.flash) mdStateLayer(x, y, w, h, SHAPE.sm, STATE.drag, 'onSurface');
  }
  if (pulse && v > 0) {
    /* pulse = "这格值得多看一眼"：一次性满浓度状态层，不带 sin 调制（常态必须静）。
       四个调用点里生命(低血)/护盾(满)/过载(就绪)会命中。 */
    mdStateLayer(x, y, w, h, SHAPE.sm, STATE.selected, opt.main ? 'hpLow' : 'onSurface');
  }
}

/* ==================================================================
   主菜单
   ================================================================== */
/* 迷你趋势图（sparkline）：数据卡底部的一条折线。
   不是统计报表 —— 玩家要的是"最近在涨还是在跌"，一眼能看出来就行。
   少于 2 个点不画（一条线画不出趋势）；全平也不画（无信息量）。
   返回是否绘制，便于调用方决定是否要让出这块高度。 */
/* ===== 结算页分段评级 =====
   单一总分没有成就感，也没法指导改进。分成五维后玩家会记住
   "生存 S、效率 B"，然后针对性地再开一局 —— 这是留存的关键。
   五维各自归一到 0~1，再按权重合成总分换字母。
   阈值按"中等水平玩家"标定，不是按满分标定 ——
   评级要能区分普通发挥和高光时刻，全给 S 就没有意义了。 */
const GRADE_DIMS = [
  { id: 'surv',  label: '生存', weight: 0.25 },
  { id: 'kill',  label: '击杀', weight: 0.25 },
  { id: 'eff',   label: '效率', weight: 0.20 },
  { id: 'ult',   label: '超载', weight: 0.15 },
  { id: 'style', label: '风格', weight: 0.15 }
];
// 各维度：达到 cap 即满分（超出不额外加分，避免刷分）
// eff 的 cap 按实测标定：典型一局 250 杀 / 180 秒 ≈ 1.4 杀/秒，
// 高手能到 2。原来定 3.5 导致"效率"永远是 D，评级失去区分度
const GRADE_CAP = { surv: 15, kill: 250, eff: 1.8, ult: 6, style: 60 };
function gradeDims(wave, kills, secs, ults, combo) {
  const raw = {
    surv: wave,
    kill: kills,
    eff: secs > 0 ? kills / secs : 0,        // 每秒击杀
    ult: ults,
    style: combo
  };
  const out = {};
  for (const d of GRADE_DIMS) {
    out[d.id] = Math.max(0, Math.min(1, raw[d.id] / GRADE_CAP[d.id]));
  }
  return out;
}
function gradeLetter(v) {
  if (v >= 0.92) return 'S';
  if (v >= 0.80) return 'A';
  if (v >= 0.66) return 'B';
  if (v >= 0.50) return 'C';
  if (v >= 0.32) return 'D';
  return 'E';
}
/* 六个评级是**语义分档**（奖励/良好/一般/平庸/告警/失败），不是身份色 —— 所以键值直接
   写角色名，而不是"以旧霓虹青调色板字面量为键、再由 mdLegacyTxt 认回角色"。
   原来 #3ad1ff 同时是 MD_LEGACY_TXT 的键、THEMES[0].color 和某个 role 的兜底值，
   B 档字母的颜色来自一次表优先的巧合而不是声明；报告点名的就是这个。
   消费点 mdLegacyTxt(GRADE_COLOR[lv]) 对角色名是原样透传，不用改。 */
const GRADE_COLOR = {
  S: 'coin', A: 'success', B: 'primary', C: 'onSurfaceVariant', D: 'warning', E: 'error'
};
function gradeTotal(dims) {
  let s = 0;
  for (const d of GRADE_DIMS) s += (dims[d.id] || 0) * d.weight;
  return Math.max(0, Math.min(1, s));
}

/* 升级卡图标：11 种，纯几何绘制。
   图标比文字快 —— 玩家扫一眼形状就知道是"回血"还是"加火力"，
   不用逐字读。全部用 fillRect / 简单 path，不额外预渲染。 */
function drawUpgradeIcon(kind, cx, cy, r, color) {
  /* 一屏一套图标语言（任务书第 2 条：它和 mdIcon 并存 = 同一屏两套体系）。
     签名 (kind,cx,cy,r,color) 一个字不改（upgrade 包在并行调它）。
     旧实现每一格都画在 cx±r / cy±r 的方框里，所以 size = r*2 与原包围盒同格，
     外面那层 30×30 的 panel 槽（drawUpgradePanel）一寸没动 —— 墨盒实测见探针 C 段。
     颜色是 UPGRADES 表里的身份 hex，按 HOTFIX §2 走 mdSeed：旧版把它直接塞进
     fillStyle，于是切主题时 9 种卡色一个都不动（钉死）；mdSeed 让它随主题旋转，
     认不出的值也只会原样返回，不会抛。
     kind 不在表里（新增升级忘配图标）退 warning 而不是静默画空 —— 缺图标要能在截图上看见。
     判断用 hasOwnProperty 而不是真值：'constructor' 这类继承键是 truthy 但不是图标。 */
  const key = Object.prototype.hasOwnProperty.call(MD_ICON_PATHS, kind) ? kind : 'warning';
  mdIcon(key, cx, cy, r * 2, mdSeed(color));
}

/* 六维雷达图：把武器属性画成形状而不是列表。
   形状比数字更好比较 —— 两把武器叠在一起看轮廓差异，一眼就知道各自擅长什么。
   支持 overlay：传入第二把武器做半透明对比叠图。 */
function drawRadar(cx, cy, r, st, color, opt) {
  /* 为什么：六条轴名原先画在半径 r+8 之外（超出调用方给的矩形）且颜色钉死 '#5b7fa3'，
     于是图鉴页干脆把标签关了。现在标签带由**实量字宽**反推、整体收进 [cx±r, cy±r] 且不压网格；
     字面按实量分档：全名会把网格压到半径 62% 以下就整体退成轴首字，再放不下按实量截断，
     一个字都塞不进去就画 warning 记号而不是静默丢。 */
  opt = opt || {};
  const n = WSTAT_KEYS.length;
  if (!(n > 0) || !(r > 0) || !isFinite(cx) || !isFinite(cy)) return;

  /* 调用方仍把"这把武器的颜色"传进来：先认回当前主题里的角色（#3ad1ff→primary），
     填充/描边/顶点全部由它派生 —— 丢弃它会让调用方白传，写死覆盖它会让六把武器同一个色。
     认不出合法 hex 就退回 primary：hexA 只吃 #rrggbb，喂回已合成的 rgba 只会拿到兜底色（H1）。 */
  const col0 = mdLegacyTxt(mdRole(color, MD3.primary));
  const base = (typeof col0 === 'string' && col0[0] === '#') ? col0 : MD3.primary;
  const baseRole = mdRoleByHex().get(base) || 'primary';
  /* 顶点内芯要压得住基色：onXxx 只有**压在 Xxx 上**才成立。coin/chip 是固定资源色、
     没有 on- 令牌，mdOn 会退到 onSurface —— 亮黄底上一颗浅灰点等于没画，所以退到所在面的色。 */
  const onTok = MD3['on' + baseRole.charAt(0).toUpperCase() + baseRole.slice(1)];
  const onBase = (typeof onTok === 'string' && onTok.charAt(0) === '#') ? onTok : mdRole('surfaceContainer');
  const grid0 = mdLegacyTxt(mdRole(opt.gridColor, MD3.outlineVariant));
  const gridCol = (typeof grid0 === 'string' && grid0.charAt(0) === '#') ? grid0 : MD3.outlineVariant;

  const ang = (i) => -Math.PI / 2 + (Math.PI * 2 / n) * i;          // 从正上方起
  const rawOf = (src, i) => { const v = Number(src && src[WSTAT_KEYS[i]]); return isFinite(v) ? v : 0; };
  const normOf = (v) => mdClamp(v, 0, WSTAT_MAX) / WSTAT_MAX;       // 越界先钳进量程，另外用 error 说出来
  const vals = [], oob = [];
  for (let i = 0; i < n; i++) { const v = rawOf(st, i); vals[i] = normOf(v); oob[i] = (v < 0 || v > WSTAT_MAX); }
  const ovVals = [];
  if (opt.overlay) for (let i = 0; i < n; i++) ovVals[i] = normOf(rawOf(opt.overlay, i));

  /* 半径全部由**给定的 r** 反推，函数里不写死的半径常量。
     关掉标签（图鉴当前的真实口径）时 ringR = r，与改版前的网格半径逐像素相同 ——
     调用方按 radarAreaH/2-2 预算的就是这个 r，占位端不能再自己缩一圈。
     开标签时 ringR 由"每一维标签的实量宽"倒推（见下），网格退到标签带内侧：
     旧写法把标签画在 r+8 上，不压网格但伸出容器 —— 两头都要，就得让网格让地方。 */
  const showLabels = opt.labels !== false;
  const labFs = mdType('label');
  const labGap = Math.max(1, Math.round(labFs * 0.25));   // 标签与网格外沿的径向间隙，由字阶给
  let ringR = r;
  let oneChar = false;
  if (showLabels) {
    /* 某一档字面（全名 / 只留首字）下，六条轴各自能容忍的最大网格半径，取最小值。 */
    const fitWith = (short) => {
      let fit = r;
      for (let i = 0; i < n; i++) {
        const sux = Math.abs(Math.cos(ang(i)));
        const name = String(WSTAT_LABELS[i] || '');
        const w = mdTextWidth(short ? name.slice(0, 1) : name, 'label', 500);
        /* 正上/正下的轴让出"一行字高"，其余轴让出"一个字宽"（都沿各自的轴方向量） */
        const bound = sux < 0.25 ? (r - labGap - labFs) : ((r - labGap - w) / sux);
        if (bound < fit) fit = bound;
      }
      return Math.max(r * 0.3, fit);
    };
    const fitFull = fitWith(false);
    /* 横屏 DENSE 下 r 只有 ~25，全名会把网格压到半径的三成 —— 图还在但读不出形状。
       所以给网格留一条 62% 的底：全名守不住就整体换轴首字（六维名都是两个字，
       首字仍互不相同），首字也守不住才继续缩网格。 */
    oneChar = false;
    if (fitFull < r * 0.62) {
      const fitShort = fitWith(true);
      if (fitShort > fitFull) oneChar = true;
      ringR = oneChar ? fitShort : fitFull;
    } else ringR = fitFull;
  }
  const poly = (rr, f) => {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = ang(i), k = rr * (f ? f(i) : 1);
      const x = cx + Math.cos(a) * k, y = cy + Math.sin(a) * k;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  };

  /* 底 + 网格：一块 surfaceContainer 的多边形面（层级差替代原来"透到背景"的黑底），
     网格/轴线一律 outlineVariant 1px 实线（M3 hairline），无渐变、无辉光。 */
  ctx.save();
  try {
    poly(ringR); ctx.fillStyle = mdRole('surfaceContainer'); ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = hexA(gridCol, 0.32);
    for (let ring = 1; ring <= 2; ring++) { poly(ringR * ring / 3); ctx.stroke(); }
    ctx.strokeStyle = hexA(gridCol, 0.6);
    poly(ringR); ctx.stroke();
    ctx.strokeStyle = hexA(gridCol, 0.28);
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = ang(i);
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * ringR, cy + Math.sin(a) * ringR);
    }
    ctx.stroke();
  } finally { ctx.restore(); }

  /* 对比叠图（先画，压在主图之下）：只降 alpha，不描顶点。 */
  if (opt.overlay) {
    const oc0 = mdLegacyTxt(mdRole(opt.overlayColor, MD3.tertiary));
    const oc = (typeof oc0 === 'string' && oc0.charAt(0) === '#') ? oc0 : MD3.tertiary;
    ctx.save();
    try {
      poly(ringR, (i) => ovVals[i]);
      ctx.fillStyle = hexA(oc, 0.16); ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = hexA(oc, 0.8); ctx.stroke();
    } finally { ctx.restore(); }
  }

  ctx.save();
  try {
    poly(ringR, (i) => vals[i]);
    ctx.fillStyle = hexA(base, 0.2);            // primary 系半透明填充
    ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = base;  // 1px 实线：不发光、不做阴影
    ctx.stroke();
    /* 顶点 = 基色圆 + onXxx 内芯（onPrimary 只有压在 primary 上才成立）。
       量程外的哪一维整颗换成 error/onError —— 数据非法要说出来，不是悄悄钳进量程。 */
    const dot = Math.max(1.6, labFs * 0.3);
    for (let i = 0; i < n; i++) {
      const a = ang(i), k = ringR * vals[i];
      const x = cx + Math.cos(a) * k, y = cy + Math.sin(a) * k;
      ctx.fillStyle = oob[i] ? mdRole('error') : base;
      ctx.beginPath(); ctx.arc(x, y, dot, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = oob[i] ? mdRole('onError') : onBase;
      ctx.beginPath(); ctx.arc(x, y, Math.max(0.7, dot * 0.45), 0, Math.PI * 2); ctx.fill();
    }
  } finally { ctx.restore(); }

  if (!showLabels) return;
  /* 标签收口按**实量**：文字盒沿各自的轴方向从网格外沿往外长，径向间隙 + 盒宽 ≤ r - ringR
     （ringR 已由上面的 bound 反推出来，所以这一步只是复核）。左右用 align=left/right、
     正上/正下用 center。字面由上面按实量选定（全名 / 轴首字），仍放不下先 mdEllipsis 截断、
     再放不下退到轴首字，一个字都塞不进去就画 warning 记号（H8 禁止静默丢内容）。
     强弱不再用颜色编码（旧写法 val>=0.6 才用武器色），信息全部由多边形本身承担。 */
  const half = labFs / 2;
  for (let i = 0; i < n; i++) {
    const a = ang(i), ux = Math.cos(a), uy = Math.sin(a), sux = Math.abs(ux);
    const vertical = sux < 0.25;
    const name = String(WSTAT_LABELS[i] || '');
    const full = oneChar ? name.slice(0, 1) : name;   // 整体字面：全名 or 只留轴首字
    const avail = vertical ? 2 * Math.max(0, r - ringR - labGap) : Math.max(0, r - sux * ringR - labGap);
    let txt = mdEllipsis(full, avail, 'label', 500);
    let cut = txt !== full;
    if (!txt) {
      txt = full.slice(0, 1);                     // 只留轴首字
      if (mdTextWidth(txt, 'label', 500) > avail) txt = '';
      cut = true;
    }
    const bx = vertical ? cx : cx + ux * ringR + (ux > 0 ? labGap : -labGap);
    const by = mdClamp(vertical ? cy + (uy < 0 ? -1 : 1) * (ringR + labGap + half) : cy + uy * ringR,
      cy - r + half, cy + r - half);
    if (!txt) { mdIcon('warning', bx, by, labFs, 'warning'); continue; }
    mdText(txt, bx, by - half, 'label', oob[i] ? 'error' : (cut ? 'warning' : 'onSurfaceVariant'),
      { align: vertical ? 'center' : (ux > 0 ? 'left' : 'right'), weight: 500 });
  }
}

function drawSparkline(x, y, w, h, data, color) {
  /* 为什么：折线原来铺满整个 [y, y+h]，末点那颗 1.6px 实心圆会把墨迹戳出数据槽的上下沿。
     现在绘图区按线宽与点径内收，n 个点严格落在调用方给的矩形里。 */
  if (!data || data.length < 2 || !(w > 0) || !(h > 0)) return false;
  const nums = [];
  for (let i = 0; i < data.length; i++) { const v = Number(data[i]); nums.push(isFinite(v) ? v : 0); }
  const n = nums.length;
  const lo = Math.min.apply(null, nums), hi = Math.max.apply(null, nums), span = hi - lo;
  if (span <= 0) return false;                 // 全部相同：没有趋势可表达，交给调用方的 mdProgress

  /* 颜色仍由调用方给（drawStatCard 的 mdLegacyTxt 结果）：认回角色后再取当前主题的 hex，
     于是换肤这条走势线跟着变；rgba 认不出就退回 primary（hexA 只吃 #rrggbb，H1）。 */
  const col0 = mdLegacyTxt(mdRole(color, MD3.primary));
  const base = (typeof col0 === 'string' && col0.charAt(0) === '#') ? col0 : MD3.primary;
  const baseRole = mdRoleByHex().get(base) || 'primary';
  /* 与雷达顶点同一处坑：coin（金币/连击这类资源数值走的就是它）没有 on- 令牌，
     退到卡片所在面 surfaceContainerHigh，末点才读得出"这是个空心点"而不是脏了个像素。 */
  const onTok = MD3['on' + baseRole.charAt(0).toUpperCase() + baseRole.slice(1)];
  const onBase = (typeof onTok === 'string' && onTok.charAt(0) === '#') ? onTok : mdRole('surfaceContainerHigh');

  /* 1~2 逻辑px 实线，点径跟着线宽走；内收量 = 点径 + 半个线宽，于是**描边外沿**（不只是折点）
     也留在矩形内。极端矮槽里由 30% 的上下限兜住，宁可压扁一点也不让墨迹戳出卡片。 */
  const lw = Math.max(1, Math.min(2, h * 0.12));
  const dot = Math.max(lw * 0.9, 1.2);
  const pad = Math.min(dot + lw, h * 0.3, w * 0.3);
  const px = (i) => x + pad + ((w - pad * 2) * i) / (n - 1);
  const py = (v) => y + h - pad - ((v - lo) / span) * (h - pad * 2);

  ctx.save();
  try {
    /* 走势面积：一层半透明基色（不是渐变、不是发光），让"这一段在涨"读得出来。 */
    ctx.beginPath();
    ctx.moveTo(px(0), y + h - pad);
    for (let i = 0; i < n; i++) ctx.lineTo(px(i), py(nums[i]));
    ctx.lineTo(px(n - 1), y + h - pad);
    ctx.closePath();
    ctx.fillStyle = hexA(base, 0.14); ctx.fill();

    ctx.beginPath();
    for (let i = 0; i < n; i++) { const sx = px(i), sy = py(nums[i]); if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy); }
    ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = base; ctx.stroke();

    /* 历史点用实心小圆：点距小于两个点径时不画中间点 —— 分辨不出来的点只会糊成一条粗线，
       末点（最近一局）永远保留，它才是这块数据要说的话。 */
    const step = (w - pad * 2) / (n - 1);
    if (step >= dot * 2.4) {
      ctx.fillStyle = hexA(base, 0.7);
      for (let i = 0; i < n - 1; i++) {
        ctx.beginPath(); ctx.arc(px(i), py(nums[i]), dot * 0.8, 0, Math.PI * 2); ctx.fill();
      }
    }
    /* 末点 = 与雷达顶点同一套记号：基色圆 + onXxx 内芯。 */
    const ex = px(n - 1), ey = py(nums[n - 1]);
    ctx.fillStyle = base;
    ctx.beginPath(); ctx.arc(ex, ey, dot, 0, Math.PI * 2); ctx.fill();
    if (dot >= 1.6) {
      ctx.fillStyle = onBase;
      ctx.beginPath(); ctx.arc(ex, ey, dot * 0.45, 0, Math.PI * 2); ctx.fill();
    }
  } finally { ctx.restore(); }
  return true;
}






/* 战绩区：一块容器 + 若干同规格数据卡（卡数 = items 数）。
   少画一项会让"四项战绩"缺一块，所以这里不做"放得下才画"的静默丢弃。 */
function drawMonitorPanel(x, y, w, h, items) {
  /* 旧的"监护仪"整块删：屏底渐变、ECG 网格纹、通道分隔亮线、数值下的 lighter
     光斑、1.15Hz 心跳呼吸。战绩是只读统计，MD3 的分组语言就是容器层级差。 */
  const n = items.length;
  if (!n) return;
  mdSurface(x, y, w, h, { role: 'surfaceContainerLow', radius: SHAPE.lg, elev: 1 });
  const gap = LAYOUT.padSm();
  const ix = x + gap, iw = w - gap * 2, iy = y + gap, ih = h - gap * 2;
  if (iw <= 0 || ih <= 0) return;
  /* 2 列而不是 4 列：4 列每列只有 39px，6 位补零的最高分被压到 8px 才放得下；
     2 列每张 86px 宽，数值能升到 headSm —— 版式跟着可读性走，不跟着旧屏的通道数走。 */
  const cols = (n >= 2 && iw >= 2 * 70 + gap) ? 2 : 1;
  const rows = Math.ceil(n / cols);
  const cw = (iw - gap * (cols - 1)) / cols;
  const ch = (ih - gap * (rows - 1)) / rows;
  for (let i = 0; i < n; i++) {
    const it = items[i];
    drawStatCard(ix + (i % cols) * (cw + gap), iy + Math.floor(i / cols) * (ch + gap),
      cw, ch, it[0], it[1], it[2], { hist: it[3] });
  }
}

function drawStatCard(x, y, w, h, label, value, color, opt) {
  /* 这张卡由 drawMonitorPanel 驱动。一块卡 = 一层容器 + 标签 + 数值 + 底部数据槽；
     微渐变底、主题色描边、竖色条、发光数码管、刻度基准一并删掉。 */
  opt = opt || {};
  const fg = color ? mdLegacyTxt(color) : MD3.onSurface;
  const padX = w >= 56 ? LAYOUT.padSm() : Math.round(LAYOUT.padSm() / 2);
  const padY = Math.max(3, Math.round(LAYOUT.padSm() / 2));
  const availW = Math.max(8, w - padX * 2);
  mdSurface(x, y, w, h, { role: opt.role || 'surfaceContainerHigh', radius: SHAPE.sm });
  const vText = String(value);
  const hist = opt.hist;
  const hasHist = !!hist && hist.length >= 2;
  let ratio = opt.ratio;
  if (ratio === undefined && hasHist) {
    /* ⚠️ 分子分母必须同源（HF-6）：vText 是**累计 / 历史最高**口径
       （最高分 123456 · 最高波次 13 · 总击杀 880），而 hist 是**每局**的序列
       （[100,400,250,900,600,1200,800]）。拿累计值去除以"每局最大值"，
       商恒 >> 1，被 mdClamp 一律压成 1 —— 三张卡的槽于是场场填满，
       mdProgress 画出来就是 77×3 的一整条纯色：**那不是进度条，是一块色块**
       （用户报的"成绩那一列横线变成色块"）。
       正确口径：分子取 hist 的**末项**（最近一局），分母取 hist 的最大值 ——
       "最近这一局离个人最好成绩多远"是这条 3px 槽唯一说得清的信息，
       而且它天然不会恒满：只有最近一局恰好就是历史最好时才满格，
       而那一刻的满格是有意义的反馈（刚破纪录），不是噪声。
       ⚠️ 别改成把 vText 并进分母 —— 那样"最高分"卡依然恒满
       （当前值本来就等于历史最大值），等于没修。 */
    const hi = Math.max.apply(null, hist.concat([0]));
    const last = Number(hist[hist.length - 1]);
    ratio = hi > 0 ? mdClamp((isFinite(last) ? last : 0) / hi, 0, 1) : 0.5;
  }
  if (h < 30) {
    /* 矮到放不下两行：标签与数值并排同一行，各自在行盒里居中 ——
       宁可字号降一档，也不让两行字叠在一起。 */
    const vw = mdTextWidth(vText, 'label', 600);
    mdText(mdEllipsis(label, Math.max(10, availW - vw - 6), 'label', 500), x + padX,
      mdTextY(y, h, 'label'), 'label', 'onSurfaceVariant', { weight: 500 });
    mdText(vText, x + w - padX, mdTextY(y, h, 'label'), 'label', fg, { align: 'right', weight: 600 });
    return;
  }
  /* 底部数据槽：够高给折线（走势），否则只给 3px 进度（相对历史最高的位置）。 */
  const slotH = (hasHist && h >= 56) ? Math.min(12, mdType('bodyLg')) : (ratio !== undefined ? 3 : 0);
  const slotY = y + h - padY - slotH;
  const topPad = y + padY;
  const boxBot = slotH > 0 ? slotY - 2 : y + h - padY;
  const valBoxH = Math.max(0, boxBot - 2 - topPad);
  /* 数值字号由盒子倒推：从大到小取第一档**同时**放得下高度与宽度的，
     补零位数变长时自动降档，而不是把 6 位数字硬塞进固定字号里。 */
  const ROLES = ['headSm', 'titleSm', 'bodyLg', 'body', 'label'];
  let vr = 'label';
  for (let i = 0; i < ROLES.length; i++) {
    if (mdType(ROLES[i]) <= valBoxH && mdTextWidth(vText, ROLES[i], 600) <= availW) { vr = ROLES[i]; break; }
  }
  /* 标签 + 数值是一个整体，在「卡顶内边距 → 数据槽」这段里垂直居中。
     居中必须在字号定档之后算，否则盒子高度变了内容还是钉在顶上。 */
  let cy = topPad + Math.max(0, (boxBot - topPad - (mdType('label') + 2 + mdType(vr))) / 2);
  mdText(mdEllipsis(label, availW, 'label', 500), x + padX, cy, 'label', 'onSurfaceVariant', { weight: 500 });
  cy += mdType('label') + 2;
  mdText(mdEllipsis(vText, availW, vr, 600), x + padX, cy, vr, fg, { weight: 600 });
  if (slotH > 0) {
    let drew = false;
    if (slotH >= 8 && hasHist) drew = drawSparkline(x + padX, slotY, availW, slotH, hist, fg);
    if (!drew && ratio !== undefined) {
      mdProgress(x + padX, slotY + (slotH - 3) / 2, availW, 3, ratio,
        { role: fg, trackRole: 'surfaceContainerHighest' });
    }
  }
}

// 主菜单分区重写：
//   ① 标题区    PIXEL RAIDER + 副标题
//   ② 指挥官区  用户名卡片（点击改名）
//   ③ 主行动区  开始游戏（唯一的主按钮，视觉权重最高）
//   ④ 数据区    四张战绩卡
//   ⑤ 功能区    操作说明 / 武器图鉴 / 设置 三个入口
//   ⑥ 页脚      成就进度 + 版权
// 原来音量条裸放在底部、武器格堆在数据卡上方，主线被淹没；现在主线只剩两件事。
/* 主菜单标签切换器（MD3 Tabs）。
   放在内容区上方而不是屏幕最底部：底部已被功能区与页脚占用，
   硬塞一个 NavBar 会让三者在矮屏互相压。Tabs 语义等价、且贴合现有纵向流。 */
/* 页签带本体高度（本包内的唯一真相）。报告 §D/§F 都指向同一个问题：同一个尺寸写三遍，
   改一处就"预算与占位分家"。预算端 MENU_TAB_BAND 在布局区，等主线改成 MENU_TAB_H + 1。 */
const MENU_TAB_H = 15;
function drawMenuTabs(x, y, w, tabH) {
  /* 选中态交给 mdTabs 的 indicator（宽=标签宽）+ 文字升 onSurface，按压走 state layer：
     原来"主题色文字 + 底部一条短线"是主题色当选中记号，切主题时整条页签一起失联。
     命中矩形照旧**只向上扩 8px**（向下扩会吃掉成长树节点顶边 = 最难受的误触），
     画完把同一份 rect 写回 menuTabRect，绘制端与命中端仍然是同一个真相。 */
  const h = tabH || MENU_TAB_H;
  const n = MENU_TABS.length;
  const hitTop = Math.max(0, y - 8);
  const rects = mdTabs(x, y, w, h, MENU_TABS.map(function (tt) { return tt.name; }), menuPage);
  for (let i = 0; i < n && i < rects.length; i++) {
    menuTabRect[i].x = rects[i].x; menuTabRect[i].y = hitTop;
    menuTabRect[i].w = rects[i].w; menuTabRect[i].h = (y + h) - hitTop;
  }
  // 分隔线是 Tab 与内容区的分界（M3 hairline），不是 Tab 自己的描边
  mdDivider(x, y + h, w, { role: 'outlineVariant' });
}

/* 成长树节点：网格里的一格，也就是"一个可买的升级"。
   两行：名称+等级 / 说明+价格；格高不够就只剩第一行。 */
function drawUpgradeNode(x, y, w, h, u) {
  const lv = upgLevel(u.id);
  const maxed = lv >= u.max;
  const cost = maxed ? 0 : upgCost(u, lv);
  const afford = !maxed && progress.chips >= cost;
  /* 三态只靠 tonal 层级 + 文字角色：能买的最高还浮起（elev1），满级的沉一级，
     买不起的**不画底** —— 它已经在 drawGrowthTree 那张卡里了，行自己不需要容器；
     八格都描一个盒子时相邻层级只有 1.07:1，等于一片没有内容的空框。
     旧版那圈随主题变粗的 u.color 描边看着像"选中"其实只是边框，回答不了状态问题，已删。 */
  const role = afford ? 'surfaceContainerHigh' : (maxed ? 'surfaceContainer' : null);
  const rr = mdRadius(w, h);
  if (role) mdSurface(x, y, w, h, { role: role, radius: rr, elev: afford ? 1 : 0 });
  /* 购买确认原来是 lighter 混合的扩散光环（非 MD3 语言且打断合批），
     现在和按压共用 state layer 这一条通道。 */
  const ft = nodeFlashT[u.id];
  let flashA = 0;
  if (ft !== undefined) {
    const k = (uiTime - ft) / NODE_FLASH;
    if (k >= 0 && k < 1) flashA = (1 - k) * STATE.selected;
  }
  const pressA = Math.max(mdPressA(x, y, w, h), flashA);
  if (pressA > 0) mdStateLayer(x, y, w, h, rr, pressA, afford ? 'primary' : 'onSurface');

  const padX = LAYOUT.padSm();
  const availW = Math.max(8, w - padX * 2);
  /* 禁用态只给"买不起"：满级是**完成**（次要文字 + check），不是不可用，
     一起压到 disabledFg 会让玩家以为这格坏了。 */
  const disA = (maxed || afford) ? 1 : STATE.disabledFg;
  const lineMin = mdType('label');
  /* 两行怎么分：第一行优先给到 12（mdBadge 固定 12px 高，对半切只有 10.8 必然出界），
     但**只有第二行还装得下一行 label 字时才借**；借不动就退回对半切 ——
     两行都各占一个 em 盒、各自居中，压不出重叠。剩一行都放不下时才只画名称。
     "行高写死而字号不跟着缩"是这次重叠的根因，这里反过来：行高派生，字号跟行高。 */
  const want1 = Math.max(h / 2, 12);
  const row1H = (h - want1 >= lineMin) ? want1 : (h >= 2 * lineMin ? h / 2 : h);
  const row2H = h - row1H;
  const twoLine = row2H >= lineMin;
  /* 名称档位由**第一行的盒高**倒推（不是由格高）：盒高一降字号跟着降，
     这才是"行高走 LAYOUT 派生值"在本包里的实际形态（本包是 2×4 网格不是列表，
     LAYOUT.listItem() 恒 52 会把命中矩形推出成长区，见文件头说明）。 */
  const nameRole = row1H >= mdType('bodyLg') + 2 ? 'bodyLg'
    : (row1H >= mdType('body') ? 'body' : 'label');
  const rightEdge = x + w - padX;
  /* 一格只塞得下四样东西（名称 / 等级 / 说明 / 价格）。再加一枚前导图标就会
     把名称与说明挤成省略号 —— 图标只用在"已满"这一态，且它**替代**等级徽标：
     check + secondaryContainer 正是 MD3 的完成态，等级已经不需要文字。 */
  const lvText = lv + '/' + u.max;
  const lvW = Math.min(availW, Math.max(12, mdTextWidth(lvText, 'label', 600)));
  const badgeW = Math.min(availW, lvW + 6);
  /* mdBadge 高固定 12：第一行盒放不下就退回普通文字，宁可少一层皮也不压字 */
  const showBadge = afford && row1H >= 12;
  const bs = Math.min(16, row1H);
  const trailW = maxed ? bs : (showBadge ? badgeW : lvW);
  /* 同行两组信息之间的固定间距：预算与判据必须用同一个数，
     否则"判据认为放得下、截断又按更宽的间距留位"，差 1px 也会挤出省略号。 */
  const colGap = 3;
  mdText(mdEllipsis(u.name, Math.max(10, availW - trailW - colGap), nameRole, 500), x + padX,
    mdTextY(y, row1H, nameRole), nameRole,
    afford ? 'onSurface' : 'onSurfaceVariant', { weight: 500, alpha: disA });
  if (maxed) {
    mdSurface(rightEdge - bs, y + (row1H - bs) / 2, bs, bs, { role: 'secondaryContainer', radius: SHAPE.xs });
    mdIcon('check', rightEdge - bs / 2, y + row1H / 2, bs * 0.66, 'onSecondaryContainer', { lw: 1.4 });
  } else if (showBadge) {
    mdBadge(rightEdge - badgeW / 2, y + row1H / 2, lvText, 'tertiaryContainer');
  } else {
    /* 放不下徽标就退回纯文字：它背后是 surfaceContainer 系而不是 tertiary 容器，
       所以配 onSurfaceVariant 而非 onTertiaryContainer —— 文字角色跟着它压在哪个容器上走。 */
    mdText(lvText, rightEdge, mdTextY(y, row1H, 'label'), 'label',
      'onSurfaceVariant', { align: 'right', weight: 600, alpha: disA });
  }
  /* 第二行 = 效果说明 + 价格。两行各自在自己的盒子里按 em 居中（mdTextY），
     所以格高多少都不会互相压字 —— 旧版点阵画在 y+h-8、说明画在 y+11，
     26px 的格子里两者必然叠成一团"00000000"。 */
  if (twoLine) {
    const descW = mdTextWidth(u.desc, 'label', 500);
    /* 尾标优先"9 芯片"，装不下就退成"9"（金币色 + 行尾位置已经说明它是价格）——
       该被让位的是价格后缀，不是"这一级加多少"的效果说明。 */
    let priceText = maxed ? '' : cost + ' 芯片';
    if (priceText && descW + colGap + mdTextWidth(priceText, 'label', 600) > availW) priceText = String(cost);
    const priceW = priceText ? Math.max(10, mdTextWidth(priceText, 'label', 600)) : 0;
    mdText(mdEllipsis(u.desc, Math.max(10, availW - priceW - colGap), 'label', 500), x + padX,
      mdTextY(y + row1H, row2H, 'label'), 'label', 'onSurfaceVariant', { weight: 500, alpha: disA });
    /* 价格是芯片（coin 固定色，不随主题 —— 玩家对资源的识别不该被换肤动摇） */
    if (priceText) {
      mdText(priceText, rightEdge, mdTextY(y + row1H, row2H, 'label'), 'label', 'coin',
        { align: 'right', weight: 600, alpha: disA });
    }
  }
}

function drawGrowthTree(x, y, w, h) {
  const n = TREE_UPGRADES.length;
  /* 行距读布局端的同一个令牌：预算函数 statsBlockH 用的就是 MENU_NODE_GAP(=5)，
     这里以前重抄一遍字面量，于是"改一次行距"要改两处、漏一处就让预算与占位分家。
     值没动（5 → 5）：格子矩形由这里算、由点击端读（menuNodeRect），逐条与改前同值。 */
  const gap = MENU_NODE_GAP;
  /* 列数只看宽度：退成 1 列会让行数翻倍、每行反而更矮（2 列行高恒大于 1 列）。 */
  const cols = (w >= 100) ? 2 : 1;
  const rows = Math.ceil(n / cols);
  const pad = LAYOUT.padSm();
  /* 横向只让半个 pad：节点自己还有 padSm 的内缩，两层加起来要等于 MD3 "列表文字离
     卡片边缘 16dp"（本作 240 逻辑宽下约 10px）。整 pad 会让到 13px，实测多出来的 3px
     正好把价格后缀"芯片"挤没 —— 省下的空白不该是内容。 */
  const padX = Math.round(pad / 2);
  /* 纵向内缩是有条件的：横屏一行只有 18px，正好等于两行的最小高（menuNodeMinH），
     再让出 2×pad 就会把"说明 + 价格"那一行整个挤掉 —— 内缩是礼貌，价格才是内容。
     判据用同一个 menuNodeMinH()，不另抄一份"18"。 */
  const needRows = menuNodeMinH() * rows + gap * (rows - 1);
  const padY = (h - pad * 2 >= needRows) ? pad : 0;
  /* tint:false：mdCard 默认按 elevation 叠一层主色，八格"买不起"的容器会跟着变亮，
     于是"能不能买"这个状态被一层与状态无关的着色污染。浮起只交给投影。 */
  mdCard(x, y, w, h, { role: 'surfaceContainerLow', radius: SHAPE.lg, elev: 1, tint: false });
  x += padX; y += padY; w -= padX * 2; h -= padY * 2;
  const cw = (w - gap * (cols - 1)) / cols;
  const ch = (h - gap * (rows - 1)) / rows;
  for (let i = 0; i < n; i++) {
    const cx = x + (i % cols) * (cw + gap);
    const cy = y + Math.floor(i / cols) * (ch + gap);
    const r = menuNodeRect[i];
    r.x = cx; r.y = cy; r.w = cw; r.h = ch;
    drawUpgradeNode(cx, cy, cw, ch, TREE_UPGRADES[i]);
  }
}

function drawMenu() {
  const t = state.time;
  /* [v1.7c] 主菜单入场：首次载入惰性注册（0→1），返回主菜单用 animReplay 重播。
     分组级联：顶栏 → 情境文案 → 页签+内容区 → 主按钮 → 页脚。
     位移只做绘制层（≤8px、T_PAGE 档）—— 命中区全程静止，M3 的 container enter。 */
  if (!ANIMS.has('menuIn')) animSet('menuIn', 1, T_PAGE);
  const BAR_H = MENU_BAR_H;   // 提升到分组外：第 1 档（情境文案）也读它，闭包内声明会隔离
  const menuGrp = (i2, fn) => {
    const p = easeOutCubic(staggerV(animV('menuIn'), i2, 0.12));
    if (p >= 1) { fn(); return; }
    ctx.save();
    try { ctx.globalAlpha *= p; ctx.translate(0, (1 - p) * 8); fn(); }
    finally { ctx.restore(); }
  };
  mdSyncMetaTheme();   // 主菜单是换主题后必然被画到的那一帧，meta 在这里跟上

  // 子页面打开时整页让出，避免两层信息叠在一起
  if (codexPage.active) { drawCodexPage(); return; }
  if (settingsPageActive) { drawSettingsPage(); return; }

  /* 页面先铺一层自己的 surface：原来标题和卡片直接浮在星场上，星云一亮就把文字压没
     —— M3 的 tonal 层级必须从"有一块面"开始。
     为什么去掉 alpha: 0.82：mdSurface 函数头自己写着"层级靠色阶，不靠透明度透背景"；
     82% 的面等于把世界层永久留在 UI 底下 —— MODE_MENU 里 update() 照样每帧推进星点
     （s.y += s.v * dt）与星云横滚，静止帧之间有差，正是本轮 §3 的判据要杀的东西。
     要保留太空感的正解是在 SCRIM 旁边加一档具名令牌（令牌层，已报主线），不是抄一个 0.82。 */
  mdSurface(0, 0, W, H, { role: 'surface', radius: 0 });

  /* [v1.7c] 入场第 0 档：顶栏（品牌字 + 图标入口） */
  menuGrp(0, () => {
    // ===== ① [v1.7] 标题区 = 48px 紧凑 app bar（MENU_BAR_H）：品牌字一行 + 两枚图标按钮 =====
    mdSurface(0, 0, W, BAR_H, { role: 'surfaceContainer', radius: 0 });
    /* 旧版是两行 headMd 大标题 + 左右胶囊的"海报式"排版，标题区占到 116px ——
       小屏上 23% 的纵向空间给了静态标题，内容区（成长树）反而被挤。
       现在品牌左对齐（app bar 的标准形态），图鉴/设置两枚低频入口收进右侧图标位。 */
    mdText('PIXEL RAIDER', 22, mdTextY(0, BAR_H, 'titleSm'), 'titleSm', 'onSurface', { weight: 700 });
    /* 两颗图标按钮：图鉴（book）与设置（tune）。
       tonal 档让它们在 surfaceContainer 的 bar 上浮起一层可点的"容器"，
       按压反馈由 mdIconButton 自己的 state layer 出。 */
    const cbIc = MENU_CODEX_BTN, gbIc = MENU_SETTINGS_BTN;
    mdIconButton(cbIc.x + cbIc.w / 2, cbIc.y + cbIc.h / 2, 'book', { tonal: true });
    mdIconButton(gbIc.x + gbIc.w / 2, gbIc.y + gbIc.h / 2, 'settings', { tonal: true });
    // app bar 与内容区的分界：hairline 画在带的下沿
    mdDivider(0, BAR_H - 1, W, { role: 'outlineVariant' });
  });

  /* 情境文案：给主菜单一句"你在哪里、这是第几次出航"。打字机是内容节奏，不是装饰。
     [v1.7] 指挥官胶囊整块移除（改名入口本就唯一化在设置页，胶囊是纯展示），
     用户名并入这一行 —— 身份与情境合为一句，胶囊省下的顶栏宽度全给品牌字。 */
  /* [v1.7c] 入场第 1 档：情境文案（打字机行） */
  menuGrp(1, () => {
    const tagline = '第 ' + (stats.gamesPlayed + 1) + ' 次出航 · ' + username;
    // 文案不变时不重置进度，否则每帧重置会导致永远只显示第一个字
    if (tagline !== menuType.tag) { menuType.tag = tagline; menuType.t0 = t; }
    const tEl = t - menuType.t0;
    const CPS = 18;                                  // 每秒 18 字
    const shown = Math.min(tagline.length, Math.floor(tEl * CPS));
    const typing = tEl < tagline.length / CPS + 1.2;  // 打完再停 1.2s
    const caret = typing && Math.floor(t * 2.5) % 2 === 0;
    const tagStr = tagline.slice(0, shown) + (caret ? '_' : '');
    mdTextC(tagStr, W / 2, BAR_H + 4, 'label', 'onSurfaceVariant');
  });

  // ===== ④ 数据区：页签 + 当前页内容（成长树 / 监护仪由各自的包负责绘制） =====
  const sa = MENU_STATS_AREA;
  const cardH = menuStatsRowsH();
  /* Tab 画在内容区**内部**顶部：画到外面等于凭空多占 15px，而布局预算里没有这块，
     结果同时压住上方的按钮与下方的节点。纵向分配保持原样（TAB_H 与 cY 未动）。 */
  const TAB_H = MENU_TAB_H;              // 与 drawMenuTabs 的兜底同一个名字，不再各写一遍
  /* [v1.7c] 入场第 2 档：页签带 + 内容区（成长树 / 监护仪） */
  menuGrp(2, () => {
    drawMenuTabs(sa.x, sa.y, sa.w, TAB_H);
    const cY = sa.y + TAB_H + 1;          // +1 让开分隔线
    const cH = Math.max(24, cardH - TAB_H - 1);

    if (menuPage === 0) {
      // ===== 成长页 =====
      drawGrowthTree(sa.x, cY, sa.w, cH);
    } else {
      // ===== 战绩页：监护仪（四项 = 四个监测通道） =====
      /* 为什么传角色名而不是旧 hex：这四个值今天能跟主题，只是因为 MD_LEGACY_TXT 里
         恰好有它们四条键；那张表是"改完一批就该短一截"的债清单，任何一条被删掉，
         mdLegacyTxt 就把原始 hex 原样交回 fillStyle —— 那一格从此永久钉死且没有提示。
         菜单包属于"已改完的一批"，不该再把存量色当参数往下传。逐个对应现有换算结果：
         #8ab4d8→onSurfaceVariant / #ffd166→coin（资源识别固定）/ #ff9f43→warning /
         #4ade80→success。探针 6 套主题 × 4 个值逐一比对 mdRole 输出，见报告。 */
      const statItems = [
        ['次数', String(stats.gamesPlayed), 'onSurfaceVariant', null],
        ['最高分', String(state.hi).padStart(6, '0'), 'coin', stats.histScore],
        ['波次', String(stats.maxWave), 'warning', stats.histWave],
        ['击杀', String(stats.totalKills), 'success', stats.histKills]
      ];
      drawMonitorPanel(sa.x, cY, sa.w, cH, statItems);
    }
  });

  /* ===== ⑤ [v1.7] 动作行：开始游戏全宽独占（图鉴已升入顶栏图标位） =====
     主菜单的主线只剩一件事；主操作不再与次要入口分食一行宽度。 */
  /* [v1.7c] 入场第 3 档：主按钮（开始游戏） */
  menuGrp(3, () => {
    const sb = MENU_START_BTN;
    mdButton(sb.x, sb.y, sb.w, sb.h, '开 始 游 戏', 'filled', { role: 'bodyLg' });
  });

  // ===== ⑥ 页脚：成就进度（分区标题用字阶，进度条 3px 轨道 + success 已达成段） =====
  /* [v1.7c] 入场第 4 档：页脚（成就进度 + 版权） */
  menuGrp(4, () => {
    let done = 0; for (const a of ACHIEVEMENTS) if (achievements[a.id]) done++;
    /* 三个 y 全读 MENU_LAYOUT —— 命中区、预算、绘制同一套坐标。
       绘制端自己 -14 / +12 的旧写法是"预算里没有标题带和条"的直接原因。 */
    const ML = MENU_LAYOUT;
    mdSection(22, ML.footTop, W - 44, '成 就 进 度');
    const fw2 = 90, fx2 = (W - fw2) / 2;
    mdProgress(fx2, ML.footBarY, fw2, 3, ACHIEVEMENTS.length ? done / ACHIEVEMENTS.length : 0,
      { role: 'success', trackRole: 'surfaceContainerHighest' });
    mdTextC('成就 ' + done + '/' + ACHIEVEMENTS.length, W / 2, ML.footY, 'label', 'success');
    // 版权标识：右下角最底部一行。AGPL 要求保留版权声明
    mdText('© 2026 B站UP主：慕雪QnQ · AGPL-3.0', W - 8, H - 13, 'label', 'onSurfaceVariant',
      { align: 'right', alpha: 0.8 });
  });
}

function drawCodexPage() {
  // 为什么：旧版这层是钉死的 rgba(4,8,14,0.97) 死黑 + 主题色描边胶囊当选中态 —— 那层黑不跟主题，
  // 而 MD3 的选中是 indicator/container，不是一圈亮边。
  pushModalAnim('codex');
  const a = Math.max(0, Math.min(1, animV('codex')));
  mdScrim('modal', a);
  ctx.save();
  try {
    ctx.globalAlpha = a;
    mdSurface(0, 0, W, H, { role: 'surface', radius: 0 });
  } finally { ctx.restore(); }
  /* 顶栏高度读 CODEX_TAB_BTN[0].y（layoutButtons 定的）而不是再抄一遍常量：同一个数写在两处，
     布局一改顶栏就会压在 tab 上。标题不带手工空格，与样板设置页的「设置」同一口径。 */
  mdTopAppBar(0, CODEX_TAB_BTN[0].y, { title: '图鉴' });
  /* 一条连续的 mdTabs（成就页 11170 已经是这个写法，两屏来回切页签不该两种口径）。
     旧写法是两次 n=1，注释的理由是"8px 缝也是命中的分界"——但命中端的真实行为是
     两格都判不中 → uiCloseTop() → 整张图鉴关掉：缝不是分界，是页面关闭区。
     现在整条带通铺、两等分交给 mdTabs 自己算，它返回的 tabRects **写回同一份数据**
     CODEX_TAB_BTN（命中端读的还是这个数组），带的位置 y 与带高 h 仍归 layoutButtons 拥有。 */
  const band0 = CODEX_TAB_BTN[0], bandN = CODEX_TAB_BTN[CODEX_TAB_BTN.length - 1];
  const codexTabRects = mdTabs(band0.x, band0.y, (bandN.x + bandN.w) - band0.x, band0.h,
    CODEX_TABS.map(function (tt) { return tt.text; }), codexPage.tab);
  for (let i = 0; i < CODEX_TAB_BTN.length && i < codexTabRects.length; i++) {
    const b = CODEX_TAB_BTN[i];
    b.x = codexTabRects[i].x; b.y = codexTabRects[i].y;
    b.w = codexTabRects[i].w; b.h = codexTabRects[i].h;
  }

  if (codexPage.tab === 0) drawHelpContent();
  else drawWeaponContent();

  const b = SET_BTN.back;
  mdButton(b.x, b.y, b.w, b.h, '返回', 'tonal');
  popModalAnim();
}

function drawHelpContent() {
  // 为什么：旧版三行颜色全是钉死的（分组标题 coin/success、正文 #8ab4d8），换主题整页不变；
  // 行距写死 18/15px 与字阶脱钩。现在颜色走 role，行距由容器高度反算，
  // 真放不下时由 mdScrollList 明说"+N 项"（H8：不许静默丢行）。
  const groups = [
    { title: '电脑端操作：', lines: ['W A S D / 方向键 移动', '空格 / 鼠标左键 射击（长按）', 'X 释放超载（冷却 30 秒）', '1-6 切换武器', '7 8 9 0 - 使用道具', 'P 暂停 / M 静音'] },
    { title: '手机端操作：', lines: ['拖动屏幕 移动战机', '双击屏幕 释放超载', '点击底部图标 切换武器', '点击右侧格子 使用道具'] }
  ];
  const rows = [];
  for (const g of groups) {
    rows.push({ head: g.title });
    for (const ln of g.lines) rows.push({ text: ln });
  }
  const x = 22, w = W - 44;
  const top = CODEX_TAB_BTN[0].y + CODEX_TAB_BTN[0].h + 10;   // [v1.7] = 86：跟随页签带
  const cardH = Math.max(48, (SET_BTN.back.y - 12) - top);
  mdCard(x, top, w, cardH, { role: 'surfaceContainer', radius: SHAPE.lg, elev: 1 });
  const pad = LAYOUT.pad(), gap = 2;
  const ih = cardH - pad * 2;
  /* 行高按容器实际高度算：高屏给到 28（接近 M3 单行列表项），矮屏收到 12 也仍容得下
     mdType('body') 的字。写死行高的代价就是某一档视口必然溢出。 */
  const rowH = mdClamp(Math.floor((ih - gap * (rows.length - 1)) / rows.length), 12, LAYOUT.listItem());
  mdScrollList(x + pad, top + pad, w - pad * 2, ih, {
    rows: rows.length, rowH: rowH, gap: gap, scroll: 0,
    renderRow: function (i, rx, ry, rw, rh) {
      const r = rows[i];
      /* 分组标题走 bodyLg 而不是 label：正文行经 mdListItem 用的是 body，
         标题比它管的正文还小就是层级倒挂；M3 用字阶+primary 分组，不再画竖条和渐变尾线。 */
      if (r.head) { mdText(r.head, rx, mdTextY(ry, rh, 'bodyLg'), 'bodyLg', 'primary', { weight: 600 }); return; }
      /* trailing 传 2：mdListItem 即使没有尾部文本也按 46px 预留，
         正文行因此会被截成"空格 / 鼠标左键 射击…"，键位表少了后半句就等于没说 */
      mdListItem(rx, ry, rw, rh, { title: r.text, radius: SHAPE.sm, trailing: 2 });
    }
  });
}

/* 齿轮图标：外圈 + 8 个齿 + 中心孔，纯 Path 绘制。
   转速随呼吸做极缓慢摆动，静止时不转（转太快会像加载动画，反而误导）。 */


/* 铅笔图标：橡皮 + 笔身 + 笔尖，纯 Path 绘制。
   整体旋转 45° 让笔尖朝左下，符合常见"编辑"图标的书写方向。 */

const CODEX_WEAPON_TABS = [];    // 六个选择格的命中区
function drawWeaponContent() {
  // 为什么：旧版数值两行式靠 8.5px 步进配 8px 字（墨迹只差 0.5px 就贴字），强弱又用三个
  // 钉死的颜色（武器色 / #8ab4d8 / #3f5f7d）编码 —— 换主题这一整块都不动。
  // 现在行距由 mdType('body') 给，分值改 mdProgress 轨道，颜色一律走 role。
  const n = WEAPON_COUNT;
  const sel = Math.max(0, Math.min(n - 1, codexPage.weaponSel | 0));
  const wp = WEAPONS[sel], info = WEAPON_INFO[sel];
  const bottomLimit = SET_BTN.back.y - 12;
  const left = 22, contentW = W - 44;

  /* --- ① 武器页签组：命中矩形仍由这里产出，x/y/w/h 与原式逐字段同值 ---
     一格一次 mdTabs（n=1）：六格之间 4px 缝就是命中的分界，整条 mdTabs 会把
     "画出的一格"与"点得到的一格"错开半格缝。选中态从武器色描边换成 primary indicator。 */
  const tabH = 30, tabGap = 4, tabY = CODEX_TAB_BTN[0].y + CODEX_TAB_BTN[0].h + 6;   // [v1.7] = 82：跟随子页统一页签带（52+24+6），不再抄旧版常数
  const tabW = (contentW - (n - 1) * tabGap) / n;
  for (let i = 0; i < n; i++) CODEX_WEAPON_TABS[i] = { x: left + i * (tabW + tabGap), y: tabY, w: tabW, h: tabH };
  /* mdTabs 还不会画 M3 的 icon+label tab（没有 opt.icon），只能把格子的下半截当矩形传进去：
     矩形底边仍是 tabY+tabH，于是 indicator 落回 tabY+tabH-3（旧手画实心条在 tabY+tabH-2.5）。
     30px 的格子要塞 图标 + 标签 + 指示条，三个量是一起定的（墨迹按实渲染量出）：
     图标 size 10 → 位图 16、pad 3，贴格子顶画时墨迹落在 82..91；标签带 [90,108] 的中线 99，
     字阶锁 label(8px) 不随密度变 → 选中态上提 1.5px 后与图标还隔 2.5px，与指示条还隔 2px。 */
  const ICON_S = 10, labY = tabY + 12, labH = tabH - 12;
  for (let i = 0; i < n; i++) {
    const b = CODEX_WEAPON_TABS[i], wi = WEAPONS[i], on = i === sel;
    /* 图标是"这把武器长什么样"的样本（内容），主色仍用武器自己的颜色；
       未选中只降不透明度（M3 用 alpha 表达次要态），不再另配一种灰蓝。 */
    /* 为什么：wi.color 直接进 getWeaponIcon 有两层坏 ——
       ① 钉死 hex 画进 UI，切主题这一整排一格都不动（同屏雷达与 HUD 武器栏却是动的）；
       ② 未选中传的是 hexA(...) 合成出来的 rgba，而 iconPalette 靠 shadeHex 分五档，
          shadeHex 遇到非 '#' 开头**原样返回**，于是五档塌成同一层，图标糊成一片。
       现在：颜色一律 mdSeed(wi.color)（六把武器 → 六个不同的派生值，探针逐主题验过），
       未选中只降 globalAlpha（M3 用 alpha 表达次要态，本来就不该另配一种色），
       缓存 key 含 color ⇒ 换主题自动换血，不会复用旧位图。 */
    const micColor = mdSeed(wi.color);
    /* 命中区是整格 30px，mdTabs 只会给下半截标签带铺状态层：按图标那一半本来没有任何反馈。
       这里按**同一份 CODEX_WEAPON_TABS** 给整格补一层，圆角与 mdTabs 一致（SHAPE.sm），
       强度仍由 mdPressA 算，不新增计时器、不改任何矩形数值。 */
    mdStateLayer(b.x, b.y, b.w, b.h, SHAPE.sm, mdPressA(b.x, b.y, b.w, b.h), MD3.onSurface);
    /* 与武器条同一口径：矢量族 + 未选中降 alpha。
       +3 是旧位图那圈 pad 留下的偏移（图标原本画在离屏 canvas 的中心），
       去掉它会让图鉴这一排比武器条高一截，两处对不齐。 */
    mdIcon(WEAPON_ICON[i], Math.round(b.x + b.w / 2), Math.round(tabY + 3 + ICON_S / 2), ICON_S, micColor,
      { alpha: on ? 1 : 0.45 });
    mdTabs(b.x, labY, b.w, labH, [wi.name], on ? 0 : -1, { role: 'label' });
    /* 键位还给"每一把"武器：标签带给了名字之后，只剩"射速…键 N"那行说选中这把，
       玩家想知道"激光是几键"就得逐格点着试。格子右上角是唯一还空着的 8px 位。 */
    mdText(WEAPON_INFO[i].key, b.x + b.w - 1, tabY + 1, 'label', on ? 'onSurface' : 'onSurfaceVariant',
      { align: 'right', weight: 600 });
  }

  /* --- ② 竖向分配：雷达拿余量并封顶 120（半径上限 46，再高只是空转），
         数值卡按内容取高，多出来的高度整块垂直居中 ---
         旧写法把余量全灌进数值卡：H=640 时那是一张 108px 的空卡。
         降级顺序（H8 要求 H<400 有降级路径）：先单列→两列，再放弃雷达本体。 */
  const infoTop = tabY + tabH + 6;
  const pad = LAYOUT.pad(), padSm = LAYOUT.padSm();
  const lineGap = 3, rowGap = 2, TRACK_H = 3, TRACK_MIN = 24;
  const RADAR_MIN = 40, RADAR_MAX = 120, GAP_ID = 4, GAP_STAT = 10;
  const idH = mdType('titleSm') + lineGap + mdType('label');
  const total = bottomLimit - infoTop;
  const lwMax = Math.ceil(mdTextWidth(WSTAT_LABELS[0], 'body')) + 2;
  const vwMax = Math.ceil(mdTextWidth(WSTAT_MAX + ' / ' + WSTAT_MAX, 'body')) + 2;
  const colWOf = (cols) => (contentW - pad * 2 - (cols - 1) * 8) / cols;
  const oneLineOf = (cols) => colWOf(cols) - padSm * 2 - lwMax - vwMax - 12 >= TRACK_MIN;
  const rowHOf = (cols) => oneLineOf(cols) ? 12 : Math.ceil(mdType('body') + TRACK_H + 4);
  const statHOf = (cols) => {
    const rows = Math.ceil(WSTAT_KEYS.length / cols);
    return rows * rowHOf(cols) + (rows - 1) * rowGap + pad * 2;
  };
  const fixedH = GAP_ID + idH + GAP_STAT;
  const wantOf = (cols) => total - fixedH - statHOf(cols);
  const cols = wantOf(1) >= RADAR_MIN ? 1 : 2;
  const statCardH = statHOf(cols);
  const radarAreaH = wantOf(cols) >= RADAR_MIN ? Math.min(RADAR_MAX, wantOf(cols)) : 0;
  const y0 = infoTop + Math.max(0, total - (radarAreaH + fixedH + statCardH)) / 2;
  if (radarAreaH) {
    /* 轴标签关掉：drawRadar 的轴标走 drawText（fontStr(0.55) + textBaseline='top'）且颜色钉死
       '#5b7fa3'，绕开 mdText 的 em 中心约定，换主题不变；六维名在下面的数值卡里按同序
       （rate/dmg/area/homing/pierce/burst）逐行给出，关掉不丢信息。网格色有 opt，就给令牌。 */
    drawRadar(W / 2, y0 + radarAreaH / 2, mdClamp(radarAreaH / 2 - 2, 16, 46), wp.st, wp.color,
      { labels: false, gridColor: MD3.outlineVariant });
  }

  /* --- ③ 身份说明：名称与特性同排（两种字阶按中线对齐），第二行给射速与键位 ---
     逐行按 mdType(role) + lineGap 推进；三样并一行又必然被 mdEllipsis 截掉"键 N"。 */
  const idY = y0 + radarAreaH + GAP_ID;
  const nameW = mdTextWidth(wp.name, 'titleSm', 600);
  const traitW = mdTextWidth(info.trait, 'label', 500);
  const gx = (W - (nameW + 6 + traitW)) / 2;
  mdText(wp.name, gx, idY, 'titleSm', 'onSurface', { weight: 600 });
  mdText(mdEllipsis(info.trait, contentW - nameW - 12, 'label', 500), gx + nameW + 6,
    idY + (mdType('titleSm') - mdType('label')) / 2, 'label', 'onSurfaceVariant', { weight: 500 });
  mdTextC('射速 ' + (1 / wp.cool).toFixed(1) + ' 发/秒 · 键 ' + info.key, W / 2,
    idY + mdType('titleSm') + lineGap, 'label', 'onSurfaceVariant', { weight: 500 });

  /* --- ④ 六维数值：每行 = mdListItem（名 + 值）+ mdProgress 轨道 ---
     轨道两端用同一次 measure 出的 label/value 宽度定位，画与量共用一个真相；
     行高固定为 rowHOf（不再被容器拉扯），真放不下时 mdScrollList 自己报"+N 项"。 */
  const statTop = idY + idH + GAP_STAT;
  const cardH = Math.min(statCardH, Math.max(1, bottomLimit - statTop));
  mdCard(left, statTop, contentW, cardH, { role: 'surfaceContainer', radius: SHAPE.lg, elev: 1 });
  const rowsN = Math.ceil(WSTAT_KEYS.length / cols);
  const innerH = cardH - pad * 2, colGap = 8;
  const colW = colWOf(cols);
  const oneLine = oneLineOf(cols);
  const rowH = rowHOf(cols);
  for (let c = 0; c < cols; c++) {
    const base = c * rowsN;
    const rowsHere = Math.min(rowsN, WSTAT_KEYS.length - base);
    mdScrollList(left + pad + c * (colW + colGap), statTop + pad, colW, innerH, {
      rows: rowsHere, rowH: rowH, gap: rowGap, scroll: 0,
      renderRow: function (i, rx, ry, rw, rh) {
        const k = base + i;
        const label = WSTAT_LABELS[k], val = wp.st[WSTAT_KEYS[k]] || 0;
        const vt = val + ' / ' + WSTAT_MAX;
        const lw = mdTextWidth(label, 'body'), vw = mdTextWidth(vt, 'body');
        const textH = oneLine ? rh : rh - (TRACK_H + 2);
        mdListItem(rx, ry, rw, textH, { title: label, trailingText: vt, radius: SHAPE.sm, trailing: vw + 6 });
        mdProgress(oneLine ? rx + padSm + lw + 6 : rx + padSm,
          oneLine ? ry + (rh - TRACK_H) / 2 : ry + rh - TRACK_H,
          Math.max(8, oneLine ? rw - padSm * 2 - lw - vw - 12 : rw - padSm * 2),
          TRACK_H, val / WSTAT_MAX,
          { role: 'primary', trackRole: 'surfaceContainerHighest' });
      }
    });
  }
}

/* 设置页：音量 / 静音 / 清除存档。
   原来音量条裸放在主菜单底部，既占地方又容易被误拖；收进设置页后主菜单清爽了。 */
/* 音量轨道矩形的唯一来源。绘制端画它、命中端按它换算，两边不再各抄一套数字。
   （报告 §D：画出来的行程是 122~206 的 84px，值映射却按 126~188 的 62px 算，
     滑块领先手指最多 18px、轨道右端 18px 是死区 —— 两套公式的典型后果。） */
function setVolTrack(y, rowH, label) {
  const C = SET_CTRL, v = SET_BTN.vol, w = W - 44;
  const tw = Math.max(30, Math.min(84, w - C.LABEL.pad - 22 - mdTextWidth(label || '音量', 'body')));
  return {
    x: 22 + w - 12 - tw, w: tw,
    y: y === undefined ? v.y : y,
    h: rowH === undefined ? (v.h || C.ROW_H) : rowH
  };
}

function drawSetRow(y, label, fillRatio, opts) {
  /* 程度类设置 = MD3 Slider：原来是"10 段刻度 + 填充 + 端点 lighter 锐光"，
     lighter 混合在 MD3 里没有对应语言，整段换成轨道 + 滑块。
     为什么在这里写回 SET_BTN.vol.track：整行矩形（x/y/w/h）由 setLayoutSettings 拥有，
     本函数一个字段都不动，只补上轨道那一段 —— 命中端与绘制端读的是同一份数据。 */
  opts = opts || {};
  const C = SET_CTRL;
  const RH = opts.rowH || C.ROW_H;
  const x = 22, w = W - 44;
  mdText(label, x + C.LABEL.pad, mdTextY(y, RH, 'body'), 'body', 'onSurfaceVariant');
  const t = setVolTrack(y, RH, label);
  SET_BTN.vol.track = t;
  mdSlider(t.x, y + RH / 2, t.w, fillRatio, { disabled: !!opts.disabled });
}

function drawSettingsPage() {
  pushModalAnim('settings');
  /* 淡入 = scrim + 一层 surface。以前是"整屏刷一层 97% 的死黑"，
     换主题时那一层永远是同一个颜色，主题色进不来。 */
  const a = Math.max(0, Math.min(1, animV('settings')));
  mdScrim('modal', a);
  ctx.save();
  /* 与图鉴/成就页同法：淡入的整页 surface 包一层 try/finally。
     裸写法在 mdSurface 抛时会把 globalAlpha 留在淡入中途，之后整片界面都是半透明。 */
  try {
    ctx.globalAlpha = a;
    mdSurface(0, 0, W, H, { role: 'surface', radius: 0 });
  } finally { ctx.restore(); }
  mdTopAppBar(0, PAGE_TOP_H, { title: '设置' });

  // 数据源：本机存档统计，与主菜单战绩卡同源但只取"历史累计"
  const statItems = [
    /* 同 GRADE_COLOR：这四枚是给 drawSetStatRow 的语义档，直接写角色名，
       不再让"迁移账"（MD_LEGACY_TXT）当运行时契约。消费点对角色名原样透传。 */
    ['游戏次数', String(stats.gamesPlayed), 'onSurfaceVariant'],
    ['最高分', String(state.hi).padStart(6, '0'), 'coin'],
    ['最高波次', String(stats.maxWave), 'warning'],
    ['总击杀', String(stats.totalKills), 'success']
  ];
  const z = {}; for (const q of SET_ZONES) z[q.key] = q;
  /* [v1.7] 四分区纵向流：可调项置顶、只读数据沉底。
     分区标题（mdSection）由各区块自己在卡上方画 —— DENSE 下自动退场。 */
  /* [v1.7c] 分区级联入场：面板 fade（a）之后五块分区依次落位，
     per=0.1 → 末块在 a>0.4 后启动、a=1 全部到位 —— 一次性，播完即静止。 */
  const setStag = (i2, fn) => {
    const p = easeOutCubic(staggerV(a, i2, 0.1));
    if (p >= 1) { fn(); return; }
    ctx.save();
    try { ctx.globalAlpha *= p; ctx.translate(0, (1 - p) * 6); fn(); }
    finally { ctx.restore(); }
  };
  setStag(0, () => drawSettingsPers(z));                    // 个性化：用户名行 + 主题色块
  setStag(1, () => drawSettingsSnd(z));                     // 音效：静音开关 + 音量滑块
  setStag(2, () => drawSettingsDisp(z));                    // 画面：FPS 开关 + 画质分段
  setStag(3, () => drawSettingsStat(z.stat, statItems));    // 本机数据：2×2 统计格（DENSE 为空区）
  setStag(4, () => drawSettingsDanger(z));                  // 清除存档 + 页脚 + 返回
  popModalAnim();
}

/* 左栏：累计统计卡（只读）。
   主菜单战绩已改为监护屏（drawMonitorPanel），这里**仍用卡片**：
    设置页是只读存档统计，不是一台正在监测的仪器 —— 硬套监护仪会显得噪音过多。 */
function drawSettingsStat(zone, items) {
  /* [v1.7] 本机数据区：一张卡 + 2×2 统计格，沉底 —— 设置页里最不需要
     被先看到的是只读数据；DENSE 横屏该区高度为 0（数据在主菜单战绩页
     与暂停面板都有），砍它不砍控件。 */
  if (!zone || !zone.h) return;
  setSection(zone, '本机数据');          // 分区标题（DENSE 下与本区一起退场）
  mdCard(22, zone.y, W - 44, zone.h, { role: 'surfaceContainer', radius: SHAPE.lg, elev: 1 });
  const n = items.length;
  const pad = 3, gap = 4;
  const cw = Math.floor((W - 44 - pad * 2 - gap) / 2);
  const chH = (zone.h - pad * 2 - gap) / 2;
  for (let i = 0; i < n; i++) {
    const col = i % 2, row = (i / 2) | 0;
    drawSetStatRow(22 + pad + col * (cw + gap), zone.y + pad + row * (chH + gap),
      cw, chH, items[i][0], items[i][1], items[i][2]);
  }
}

/* 单行统计：标签暗压在左，数值亮浮在右，中间渐变线衔接。
   竖排四张卡比横排四列更适合"设置页里的附属信息"——它不该抢走整屏宽度。 */
function drawSetStatRow(x, y, w, h, label, value, color) {
  /* 只读统计行 = 一层容器 + 左标签 + 右数值。竖色条/渐变接缝/端点辉光都已删：
     MD3 的分组靠 tonal 层级，不靠颜色噪音。数值颜色经 mdLegacyTxt 认回角色，
     于是它跟着主题走，而不是钉死在某个十六进制上。 */
  mdSurface(x, y, w, h, { role: 'surfaceContainerHigh', radius: SHAPE.sm });
  /* 数值用大一号是有条件的：窄格里「000000」能吃掉 44px，
     留给标签的就不够三个字了 —— 挤的时候标签与数值同字号。 */
  const vRole = (h >= 14 && w >= 100) ? 'bodyLg' : 'body';
  const vw = mdTextWidth(String(value), vRole, 600);
  const lw = Math.max(10, w - LAYOUT.padSm() * 2 - vw - 6);
  mdText(mdEllipsis(label, lw, 'body', 500), x + LAYOUT.padSm(), mdTextY(y, h, 'body'), 'body', 'onSurfaceVariant', { weight: 500 });
  mdText(value, x + w - LAYOUT.padSm(), mdTextY(y, h, vRole), vRole, color ? mdLegacyTxt(color) : MD3.onSurface, { align: 'right', weight: 600 });
}

/* 拨动开关：布尔设置的正确控件。
   之前静音用填充条（drawSetRow）表达开/关 —— 那是"程度"的控件，
   拿来显示布尔值时，开和关两态长得几乎一样（满条 vs 空条），
   玩家既看不出当前状态，也看不出"这里可以点"。
   开关有三段结构：轨道 + 滑块 + 状态色，位置和颜色双重编码，一眼可读。 */
/* 滑块动画进度改走 ANIMS（键名 muteSw / fpsSw，两个开关各持一键，
   共用一个键会让它们互相"拽着走"）。为什么不是本屏私有的两个 let：
   见 setKit() 里的 swKey()。 */

/* [v1.7] 右栏已重组为"个性化 / 音效 / 画面"三张分区卡（setKit +
   drawSettingsPers/Snd/Disp）：静音与 FPS 用拨动开关，音量用可拖动填充条，
   画质用分段按钮，主题色块 = 容器 + 勾。 */
/* ===== [v1.7] 设置页分区块 =====
   五个控件行分属 3 张卡（个性化/音效/画面），行矩形仍读 SET_RIGHT.rows ——
   行的语义下标没变（0=用户名 1=静音 2=音量 3=FPS 4=画质），只是各归其卡。
   row/rowLabel/swAt/swKey 四个小工具抽成 setKit()：三个区块共用，不再复制。 */
function setKit() {
  const C = SET_CTRL;
  const rowH = SET_RIGHT.rowH || C.ROW_H;
  const RX = 22, RW = W - 44;
  /* 行落在 mdCard(surfaceContainer) 内：行容器用 High 才有"行感"
     —— 同色相叠等于没有行。静音行的 errorContainer 危险态语义不变。 */
  const row = (y, role) => {
    mdSurface(RX, y, RW, rowH, { role: role || 'surfaceContainerHigh', radius: SHAPE.sm });
    const a = mdPressA(RX, y, RW, rowH);
    if (a > 0) mdStateLayer(RX, y, RW, rowH, SHAPE.sm, a,
      role === 'errorContainer' ? 'onErrorContainer' : 'onSurface');
  };
  const rowLabel = (y, s, role) => mdText(s, RX + C.LABEL.pad, mdTextY(y, rowH, 'body'), 'body', role || 'onSurfaceVariant');
  /* 视觉高度钳在 14..22：横屏 rowH=18 时开关不再被压成细条。
     命中带不在这里决定 —— 整行命中由 SET_BTN.mute/fps 的行矩形负责。 */
  const swAt = (y, on, k, role) => {
    const sh = Math.max(14, Math.min(22, rowH - 2)), sw = Math.round(sh * 2);
    return mdSwitch(RX + RW - 10 - sw, y + (rowH - sh) / 2, on, { w: sw, h: sh, k: k, role: role });
  };
  /* 开关进度走补间引擎（ANIMS）：两个键各持一份，共用会互相"拽着走"。 */
  const swKey = (key, on) => {
    if (!ANIMS.has(key)) { animSet(key, on ? 1 : 0); animInstant(key); }
    else animSet(key, on ? 1 : 0, MOTION.medium / 1000);
    return animV(key);
  };
  return { C: C, rowH: rowH, RX: RX, RW: RW, row: row, rowLabel: rowLabel, swAt: swAt, swKey: swKey };
}
/* 分区标题带：DENSE（横屏）下退场 —— 布局端 showHeads=false 与这里同一条判据。 */
function setSection(z, label) {
  if (DENSE) return;
  mdSection(22, z.y - (mdType('titleSm') + 4), W - 44, label);
}

/* 个性化：用户名（改名入口唯一化在这一行）+ 主题色块。 */
function drawSettingsPers(z) {
  /* 玩家就是在这六个色块上切主题的：这屏画到之前状态栏不该还挂上一套肤的颜色。 */
  mdSyncMetaTheme();
  const k = setKit();
  setSection(z.pers, '个性化');
  mdCard(22, z.pers.y, W - 44, z.pers.h, { role: 'surfaceContainer', radius: SHAPE.lg, elev: 1 });
  {
    const ny = SET_RIGHT.rows[0];
    k.row(ny);
    k.rowLabel(ny, '用户名');
    const penX = k.RX + k.RW - 12;
    const maxW = Math.max(20, penX - 16 - (k.RX + k.C.LABEL.pad + mdTextWidth('用户名', 'body') + 8));
    mdText(mdEllipsis(username, maxW, 'body', 500), penX - 16, mdTextY(ny, k.rowH, 'body'), 'body', 'onSurface', { align: 'right', weight: 500 });
    mdIcon('edit', penX - 5, ny + k.rowH / 2, Math.min(12, k.rowH - 6), 'primary', { lw: 1.5 });
  }
  /* 主题色块（状态语言同旧版：选中 = secondaryContainer + 勾；未选 = Highest；
     圆点是**主题身份的样本色**（内容），不是装饰）。位置读布局写回的 SET_BTN.theme。 */
  mdText('主题色', k.RX + LAYOUT.pad(),
    mdTextY(SET_RIGHT.themeLblY, mdType('label') + 4, 'label'), 'label', 'primary', { weight: 600 });
  for (let i = 0; i < THEMES.length; i++) {
    const sw = SET_BTN.theme[i], th = THEMES[i], on = i === themeIdx;
    mdSurface(sw.x, sw.y, sw.w, sw.h, { role: on ? 'secondaryContainer' : 'surfaceContainerHighest', radius: SHAPE.sm });
    /* 色块是可点的：选中色差表达"选没选"，按压 state layer 表达"按没按"，两回事。 */
    const swA = mdPressA(sw.x, sw.y, sw.w, sw.h);
    if (swA > 0) mdStateLayer(sw.x, sw.y, sw.w, sw.h, SHAPE.sm, swA,
      on ? 'onSecondaryContainer' : 'onSurface');
    const cy = sw.y + sw.h / 2;
    ctx.fillStyle = th.color;
    ctx.beginPath(); ctx.arc(sw.x + 9, cy, Math.max(3, Math.min(4, sw.h * 0.18)), 0, Math.PI * 2); ctx.fill();
    mdText(mdEllipsis(th.name, Math.max(0, sw.w - 30), 'label', 500), sw.x + 16, mdTextY(sw.y, sw.h, 'label'), 'label',
      on ? 'onSecondaryContainer' : 'onSurfaceVariant', { weight: 500 });
    if (on) mdIcon('check', sw.x + sw.w - 9, cy, Math.min(11, sw.h * 0.5), 'onSecondaryContainer', { lw: 1.7 });
  }
}
