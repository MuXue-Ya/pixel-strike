       ① 主操作"继续作战"独占一行，视觉权重最高（渐变底 + 发光 + 边框流光）
       ② 战况数据用双列网格，一眼看完，不用上下扫
       ③ 四个次要操作横排一行，危险操作（重开 / 返回）用红色

     **毛玻璃不做**：canvas 没有 backdrop-filter，模糊要自己 drawImage + 卷积，
     面板占屏一半就是几十万像素，移动端会明显掉帧 ——
     为暂停菜单付不起这个代价。物件感靠装置边框和标题栏拿，不靠模糊。 */
  const pt = pauseT;
  const ease = 1 - Math.pow(1 - Math.min(1, Math.max(0, pt)), 3);   // easeOutCubic
  /* 落位弹跳：easeOutBack 轻微过冲再回弹，比纯 easeOutCubic 多一层"物件落下"的实感。
     c1 取 1.2（标准值 1.70158 太弹，暂停菜单要的是稳，不是俏）。 */
  const easeBack = (t) => {
    const c1 = 1.2, c3 = c1 + 1;
    const u = Math.min(1, Math.max(0, t)) - 1;
    return 1 + c3 * u * u * u + c1 * u * u;
  };

  const PX = 16, PW = W - 32;
  const PY = 52;
  const PBot = PAUSE_BUTTONS.resume.y - 12;
  const PH = Math.max(70, PBot - PY);
  // 位移 -14 → -28：配上半透明背景，滑入距离才撑得起"菜单落下来"的观感
  const yOff = (1 - easeBack(pt)) * -28;

  ctx.save();
  ctx.translate(0, yOff);
  ctx.globalAlpha = Math.min(1, ease * 1.4);

  panel(PX, PY, PW, PH, 8, { bg: 'rgba(10, 20, 34, 0.92)', border: hexA(TH(), 0.28), bw: 1.5, glow: TH() });
  frameCorners(PX, PY, PW, PH, 7, TH(), 0.32, 1);
  panelHeader(PX + 6, PY + 5, PW - 12, '战 术 休 整', TH());

  // --- 战况数据：双列网格 ---
  const acc = runShots > 0 ? Math.round(runHits / runShots * 100) : null;
  const dps = runTime > 0.5 ? Math.round(runKills * 100 / runTime) / 100 : 0;
  const mmss = (sec) => {
    const s = Math.max(0, Math.floor(sec));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  };
  /* 数值三级字号：击杀 / 分数最大（玩家最关心"打了多少"），
     存活 / 波次 / DPS / 命中率中等，连击 / 道具最小。
     统一用"暗标签 + 亮数值"，标签压暗后数值自然浮出来。 */
  const cells = [
    ['存活', mmss(runTime), '#8ab4d8', 0.95],
    ['击杀', String(runKills), '#4ade80', 1.05],
    ['DPS', dps.toFixed(2), dps > 3 ? '#ffd166' : '#8ab4d8', 0.9],
    ['波次', String(state.wave), TH(), 0.95],
    ['命中率', acc === null ? '—' : acc + '%',
      acc === null ? '#3f5f7d' : (acc >= 60 ? '#4ade80' : (acc >= 35 ? '#ffd166' : '#ff9f43')), 0.9],
    ['道具', String(runPowerups), '#4ade80', 0.8],
    ['连击', 'X' + maxCombo, '#ffd166', 0.85],
    ['分数', String(state.score).padStart(6, '0'), '#eafcff', 1.0]
  ];
  const gridTop = PY + 20;
  const gridBot = PY + PH - 8;
  /* 行高上限 34：高屏上面板很高（H=800 时面板 618px），
     不设上限的话 4 行数据被均摊到每行 147px —— 文字贴在行顶，底下全是空白，
     这才是"中间大框框难看"的真正来源（不是框本身，是框里的空洞）。
     限高后数据块在面板内垂直居中，上下留白均匀，才像一块真正的数据板。 */
  const rowH = Math.max(15, Math.min(34, (gridBot - gridTop) / 4));
  const gridTopC = gridTop + Math.max(0, (gridBot - gridTop - rowH * 4) / 2);
  const colW = (PW - 30) / 2;
  for (let i = 0; i < 8; i++) {
    const col = i % 2, row = Math.floor(i / 2);
    const cx = PX + 14 + col * (colW + 10);
    const cy = gridTopC + row * rowH;
    /* 逐行浮现：整块一起出现是"信息墙"，错峰才有节奏。
       节奏比原先略快（0.07→0.06 间隔、0.45→0.4 时长）：
       8 项数据是玩家暂停时真正要读的，动画不能让他等。 */
    const rp = Math.min(1, Math.max(0, (pt - 0.10 - row * 0.06) / 0.4));
    ctx.globalAlpha = rp;
    const ty = cy + Math.max(0, (rowH - 8) / 2);
    drawText(cells[i][0], cx, ty, '#3f5f7d', 0.6);
    drawTextRight(cells[i][1], cx + colW, ty, cells[i][2], cells[i][3]);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  /* --- 按钮：三级分层 + 级联浮现 ---
     继续作战（primary，独占一行）→ 成就/设置（ghost 横排）→ 重开/返回（ghost 横排）。
     每级延后 0.08s 浮现：一次性整体淡入是"贴图弹出"，分级才有"逐层落位"的节奏。 */
  const clamp01 = (v) => Math.min(1, Math.max(0, v));
  const btnA0 = clamp01((pt - 0.28) / 0.4);
  const btnA1 = clamp01((pt - 0.36) / 0.4);
  const btnA2 = clamp01((pt - 0.44) / 0.4);
  const B = PAUSE_BUTTONS;

  ctx.save();
  ctx.globalAlpha = btnA0;
  drawActionButton(B.resume.x, B.resume.y, B.resume.w, B.resume.h,
    '继 续 作 战', TH(), 'primary', { r: 8, fs: 1.15, speed: 3, t: uiTime });
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = btnA1;
  drawActionButton(B.ach.x, B.ach.y, B.ach.w, B.ach.h, '成 就', '#4ade80', 'ghost', { r: 5, fs: 0.68, t: uiTime });
  drawActionButton(B.settings.x, B.settings.y, B.settings.w, B.settings.h, '设 置', '#8ab4d8', 'ghost', { r: 5, fs: 0.68, t: uiTime });
  ctx.restore();

  /* 出口行放在最底部：它是"离开"的语义，离主操作越远越不容易误触。
     返回主菜单用红色 —— 全场唯一不可逆出口，不看文字也能认出"这个会丢进度"。 */
  ctx.save();
  ctx.globalAlpha = btnA2;
  drawActionButton(B.restart.x, B.restart.y, B.restart.w, B.restart.h,
    '重 开', '#8ab4d8', 'ghost', { r: 5, fs: 0.68, t: uiTime });
  drawActionButton(B.home.x, B.home.y, B.home.w, B.home.h,
    '返回主菜单', '#ff4d6d', 'ghost', { r: 5, fs: 0.68, t: uiTime });
  ctx.restore();

  drawTextCenter(isTouch ? '点击按钮操作' : 'P 继续 · R 重开 · M 音效', H - 6, '#1e3549', 0.65);
}

/* 成就页：单列大格，每行显示 名称 + 描述 + 状态（原来主面板里 16px 小格根本看不清） */
function drawAchPage() {
  pushModalAnim('ach');
  ctx.fillStyle = 'rgba(4, 8, 14, ' + (0.97 * Math.max(0, Math.min(1, animV('ach')))) + ')'; ctx.fillRect(0, 0, W, H);

  let done = 0;
  for (const a of ACHIEVEMENTS) if (achievements[a.id]) done++;

  drawTextCenter('成 就 一 览', 14, '#4ade80', 1.8);
  divider(40, '#4ade80', 40);

  drawText('已达成', 22, 48, '#5b7fa3', 0.75);
  drawTextRight(done + ' / ' + ACHIEVEMENTS.length, W - 22, 48, '#4ade80', 0.85);
  fillRoundRect(22, 62, W - 44, 5, 2.5, '#1e3549');
  fillRoundRect(22, 62, (W - 44) * (done / ACHIEVEMENTS.length), 5, 2.5, '#4ade80');

  // 单列大格：行高按可用空间自适应，但设下限，避免又变成小格
  const top = 76;
  const bottomLimit = H - 44;
  const gap = 5;
  const n = ACHIEVEMENTS.length;
  const cellH = Math.max(26, Math.min(38, (bottomLimit - top - (n - 1) * gap) / n));

  for (let i = 0; i < n; i++) {
    const a = ACHIEVEMENTS[i];
    const got = !!achievements[a.id];
    const y = top + i * (cellH + gap);
    if (y + cellH > bottomLimit) break;

    panel(22, y, W - 44, cellH, 7, {
      bg: got ? 'rgba(74, 222, 128, 0.12)' : 'rgba(12, 24, 40, 0.8)',
      border: got ? 'rgba(74, 222, 128, 0.6)' : 'rgba(30, 53, 73, 0.9)',
      bw: 1.2
    });

    // 左侧状态徽章
    const bx = 22 + 15, by = y + cellH / 2;
    ctx.fillStyle = got ? '#4ade80' : '#22384d';
    ctx.beginPath(); ctx.arc(bx, by, 6, 0, Math.PI * 2); ctx.fill();
    if (got) {
      ctx.strokeStyle = '#0d2b1a'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(bx - 2.5, by); ctx.lineTo(bx - 0.5, by + 2.5); ctx.lineTo(bx + 3.5, by - 3); ctx.stroke();
    } else {
      ctx.fillStyle = '#3f5f7d'; ctx.font = fontStr(0.7); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', bx, by + 1); ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    }

    drawText(a.name, 22 + 28, y + 5, got ? '#4ade80' : '#8ab4d8', 0.8);
    drawText(a.desc, 22 + 28, y + 16, got ? '#5b7fa3' : '#3f5f7d', 0.62);
    drawTextRight(got ? '已达成' : '未解锁', W - 30, y + (cellH - 8) / 2, got ? '#4ade80' : '#2b4a66', 0.62);
  }

  // 关闭按钮
  const bw2 = 120, bh2 = 26, bx2 = (W - bw2) / 2, by2 = H - 34;
  panel(bx2, by2, bw2, bh2, 8, { bg: THa(0.15), border: TH(), bw: 1.4 });
  drawTextCenter('点 击 返 回', by2 + 7, TH(), 0.95);
  popModalAnim();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#05060a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(viewScale, 0, 0, viewScale, viewOffsetX, viewOffsetY);
  ctx.save();
  if (state.shake > 0.3) ctx.translate(Math.round((Math.random() - 0.5) * state.shake), Math.round((Math.random() - 0.5) * state.shake));
  drawBackground();
  if (state.mode === MODE_PLAY && !upgradePanel.active && combo >= 10) {
    const a = 0.035 + Math.sin(state.time * 8) * 0.015;
    ctx.fillStyle = combo >= 25 ? 'rgba(255,209,102,' + a + ')' : 'rgba(58,209,255,' + a + ')'; ctx.fillRect(0, 0, W, H);
  }
  if (state.mode === MODE_PLAY || state.mode === MODE_OVER) {
    drawPowerups(); drawEnemies(); drawBoss(); drawDrones(); drawBullets(); drawMuzzles(); drawArcs();
    drawPlayerAura();      // 环画在飞机之前：它是底衬，不能遮住飞机本体
    drawPlayer();
    drawShockwaves(); drawNovas(); drawFlashes(); drawParticles(); drawEmbers(); drawDebris(); drawSparks(); drawFloatTexts(); drawUltBeam();
  }
  ctx.restore();
  if (flashScreen > 0) {
    ctx.globalAlpha = Math.min(0.7, flashScreen);
    ctx.fillStyle = flashColor;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  /* 色差冲击：大爆炸时整屏短暂"重影 + 边缘色散"。
     真·逐像素 RGB 分离在 canvas2d 上要多次全屏重绘，代价太高；
     这里用"整屏加性残影 + 左右红/青边缘渐变"近似，视觉冲击力接近而只需一次 drawImage。
     只在 chroma 明显时触发，且受 quality 限制（低端机跳过残影只留边缘色）。 */
  if (chroma > 0.03) {
    const k = Math.min(1, chroma);
    if (quality > 0.5) {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);              // 自绘需回到设备坐标系
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = k * 0.28;
      const off = 2 + k * 5;
      ctx.drawImage(canvas, off, 0);
      ctx.drawImage(canvas, -off, 0);
      ctx.restore();
      ctx.setTransform(viewScale, 0, 0, viewScale, viewOffsetX, viewOffsetY);
    }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const edge = 26 + k * 22;
    let g = ctx.createLinearGradient(0, 0, edge, 0);
    g.addColorStop(0, 'rgba(255, 32, 96, ' + (k * 0.22) + ')');
    g.addColorStop(1, 'rgba(255, 32, 96, 0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, edge, H);
    g = ctx.createLinearGradient(W, 0, W - edge, 0);
    g.addColorStop(0, 'rgba(32, 224, 255, ' + (k * 0.22) + ')');
    g.addColorStop(1, 'rgba(32, 224, 255, 0)');
    ctx.fillStyle = g; ctx.fillRect(W - edge, 0, edge, H);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  /* 危险脉冲：血量越低，屏边红光越强、心跳越快。
     原来低血只有一层固定强度的红光 —— 30% 血和 5% 血看起来一样，
     紧迫感没有梯度。现在频率和强度都随血量逼近 0 而上升。 */
  if (state.lowHp && state.mode === MODE_PLAY) {
    const danger = 1 - Math.max(0, state.hp / state.maxHp) / 0.5;   // 0(50%) → 1(0%)
    const beat = 6 + danger * 7;                                    // 心跳频率 6 → 13
    const pulse = (0.18 + danger * 0.26) + Math.sin(state.time * beat) * (0.10 + danger * 0.16);
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.28, W / 2, H / 2, Math.max(W, H) * 0.62);
    vg.addColorStop(0, 'rgba(255, 77, 109, 0)');
    vg.addColorStop(1, 'rgba(255, 77, 109, ' + Math.max(0, pulse) + ')');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  if (state.mode === MODE_MENU) drawMenu();
  else if (state.mode === MODE_PLAY) {
    drawHUD(); drawBossHealth(); drawBanner(); drawAchPopup(); drawWeaponBar();
    drawMenuCollapse();
    drawLockMark(); drawThreatArrows();
    if (upgradePanel.active) drawUpgradePanel();
    if (paused) drawPause();
  } else if (state.mode === MODE_OVER) {
    drawHUD(); drawWeaponBar(); drawGameOver(); drawAchPopup();
  }
}

/* ==================================================================
   流程控制
   ================================================================== */
function resetGame() {
  playerFace = -Math.PI / 2; pxPrev = player.x; pyPrev = player.y;
  lockTarget = null; lockT = 0;
  state.score = 0; state.maxHp = MAX_HP_BASE; state.hp = MAX_HP_BASE; state.wave = 0; state.coins = 0; state.shake = 0; state.time = 0; state.waveDelay = 0;
  state.hpFlash = 0; state.lowHp = false; weaponGlow = 0; deathT = 0; goAnim = 0;
  hitstop = 0;
  bullets = []; ebullets = []; enemies = []; particles = []; shockwaves = []; powerups = []; arcs = []; waveQueue = [];
  waveClock = 0; boss = null; flashScreen = 0; enemyIdCounter = 0; clearGameTimers();
  combo = 0; comboTimer = 0; maxCombo = 0; drones = [];
  ultCd = 0; ultActive = 0; ultScanY = H; magnet = 0; floatTexts = [];
  itemCounts = [0, 0, 0, 0, 0]; slowT = 0; dmgMul = 1; statusId = null; statusT = 0; muzzles = [];
  player.x = W / 2; player.y = H - 60; player.cool = 0; player.inv = 1.5; player.alive = true; player.respawn = 0;
  player.power = 1; player.shield = 0; player.spread = 0; player.weapon = 0; player.boomCount = 1;
  upgradePanel.active = false; upgradePanel.options = [];
  // 子页面状态：startGame 走的是 resetGame，之前只加在 returnToMenu 里，
  // 导致"图鉴页 tab=1 时直接开始游戏"会带着旧 tab 进下一局
  achPageActive = false; codexPage.active = false; codexPage.tab = 0;
  settingsPageActive = false; resetConfirm = false;
  codexClosing = settingsClosing = achClosing = false;
  animInstant('codex'); animInstant('settings'); animInstant('ach');
  uiStack.length = 0;
  banner.text = ''; banner.sub = ''; banner.t = 0; pointer.active = false; paused = false; pauseClosing = false; pauseT = 0;
  debris = []; runKills = 0; muzzles = []; menuFall = 1; pauseClosing = false; itemCounts = [0, 0, 0, 0, 0]; slowT = 0; dmgMul = 1; statusId = null; statusT = 0;
  runShots = 0; runHits = 0; runPowerups = 0; runSwitches = 0;
  runTime = 0; ultUses = 0;
  flashes = []; sparks = []; embers = []; novas = []; chroma = 0; slowmo = 0; hitstop = 0;
  stats.gamesPlayed++;
  saveStats();
  startWave(1);
}
function startGame() {
  /* 从主菜单进入才垮：结算页"再来一局"、暂停里"重开"都没有主菜单可垮，
     那些场景播这个动画会变成凭空掉下来一块菜单。
     ⚠️ 必须在 resetGame() 之前读 state.mode —— 它在函数末尾才被改成 MODE_PLAY。 */
  const fromMenu = state.mode === MODE_MENU;
  animSet('hud', 1, T_QUICK);      // 每局开始时 HUD 滑入
  rollInstant('score');            // 分数从本局初值起步，不继承上局残留
  /* 首局引导：只教移动和射击两件事。
     一次性灌六个概念等于没教 —— 其余靠自然提示在遇到时才浮出。 */
  showTutorial('move', isTouch ? '拖动屏幕移动飞船' : 'WASD / 方向键 移动',
    '', 3.4);
  showTutorial('shoot', isTouch ? '自动开火，专心闪避弹幕' : '空格 / 鼠标左键 射击',
    '', 3.4);
  Audio.init(); Audio.resume(); Audio.startBGM();
  resetGame(); state.mode = MODE_PLAY;
  /* 垮掉在 resetGame() **之后**启动：resetGame 里也把 menuFall 重置为 1，
     写在它之前会被覆盖，动画永远不播。 */
  if (fromMenu) {
    menuFall = 0;
    Audio.init(); Audio.resume();
    Audio.play(180, 0.26, 'sawtooth', 0.05, 60);            // 一记闷响：塌了
    scheduleAfter(0.16, () => Audio.play(240, 0.14, 'square', 0.035, 90));
    scheduleAfter(0.34, () => Audio.play(160, 0.18, 'triangle', 0.03, 50));
  } else menuFall = 1;
}
let deathT = 0;   // 死亡定格计时：残影缓慢消散，替代原来的瞬切
let goAnim = 0;   // 结算页动画进度（秒），驱动分阶段揭示，避免信息一次性砸出来
function gameOver() {
  state.mode = MODE_OVER; state.time = 0; deathT = 0.9; goAnim = 0;
  Audio.stopBGM();
  if (state.score > state.hi) { state.hi = state.score; localStorage.setItem('pixelraider_hi', String(state.hi)); }
  if (state.wave > stats.maxWave) stats.maxWave = state.wave;
  // 先快照"上一局"供结算页对比，再把本局写入 lastRun —— 顺序反了就会拿自己跟自己比
  prevRun = lastRun ? { score: lastRun.score, wave: lastRun.wave, kills: lastRun.kills, combo: lastRun.combo } : null;
  lastRun = { score: state.score, wave: state.wave, kills: runKills, combo: maxCombo };
  // 追加本局战绩到历史序列（数据卡的趋势图数据源）。
  // 必须在 saveStats 之前 —— 否则本次成绩不会进存档
  pushHistory(state.score, state.wave, runKills);
  saveStats(); saveLastRun();
  explode(player.x, player.y, '#3ad1ff', 30, 150); explode(player.x, player.y, '#ffffff', 14, 90); state.shake = 14;
}
function returnToMenu() {
  if (state.score > state.hi) { state.hi = state.score; localStorage.setItem('pixelraider_hi', String(state.hi)); }
  if (state.wave > stats.maxWave) stats.maxWave = state.wave;
  saveStats();
  Audio.stopBGM();
  paused = false;
  state.mode = MODE_MENU;
  state.time = 0;
  bullets = []; ebullets = []; enemies = []; particles = []; shockwaves = []; powerups = []; arcs = []; waveQueue = [];
  boss = null; drones = []; clearGameTimers();
  combo = 0; comboTimer = 0;
  upgradePanel.active = false; upgradePanel.options = [];
  achPageActive = false; codexPage.active = false; codexPage.tab = 0;
  settingsPageActive = false; resetConfirm = false;
  codexClosing = settingsClosing = achClosing = false;
  animInstant('codex'); animInstant('settings'); animInstant('ach');
  uiStack.length = 0;
  banner.t = 0; achPopup.t = 0; flashScreen = 0;
  pointer.active = false;
  MENU_VOL_CTRL.dragging = false;
  debris = [];
  flashes = []; sparks = []; embers = []; novas = []; chroma = 0; slowmo = 0; hitstop = 0;
  runShots = 0; runHits = 0; runPowerups = 0; runSwitches = 0;
}

/* ==================================================================
   输入
   ================================================================== */
function toGameCoords(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  const px = (clientX - r.left) / r.width * canvas.width;
  const py = (clientY - r.top) / r.height * canvas.height;
  return { x: (px - viewOffsetX) / viewScale, y: (py - viewOffsetY) / viewScale };
}
function checkAllWeapons() { if (weaponUsed.every(v => v)) checkAchievement('all_weapons'); }

window.addEventListener('keydown', (e) => {
  if (nameInputOpen) return;
  const k = e.key.toLowerCase();
  if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' '].includes(k)) e.preventDefault();
  keys[k] = true;
  if (k === 'arrowleft' || k === 'arrowright' || k === 'a' || k === 'd' ||
        k === 'arrowup' || k === 'arrowdown' || k === 'w' || k === 's') pointer.active = false;
  if (upgradePanel.active) { if (k === '1') buyUpgrade(0); if (k === '2') buyUpgrade(1); if (k === '3') buyUpgrade(2); if (k === ' ') closeUpgradePanel(); return; }
  // 键盘重试同样等结算动画演到 1.4s，与点击/触屏行为一致
  if (k === ' ') {
    Audio.init(); Audio.resume();
    if (state.mode === MODE_MENU) startGame();
    else if (state.mode === MODE_OVER) { if (state.time > 1.4) startGame(); }
  }
  if (k === 'f3') { toggleFps(); return; }
  if (k === 'p' || k === 'escape') {
    if (state.mode === MODE_PLAY) {
      if (settingsPageActive) { uiCloseTop(); return; }   // 先退设置页，再谈继续游戏
      if (achPageActive) { uiCloseTop(); return; }         // 先退成就页，再谈继续游戏
      if (pauseClosing) { pauseClosing = false; return; }   // 退场途中再按 = 取消，别把状态搞乱
      if (paused) resumeGame(); else { paused = true; Audio.stopBGM(); Audio.play(500, 0.06, 'square', 0.02, 700); }
    }
  }
  // R 键：一步重开（出口已一级化，与点击「重开」行为一致）
  if (k === 'r' && state.mode === MODE_PLAY && paused) {
    Audio.play(500, 0.1, 'square', 0.03, 400); paused = false; startGame();
  }
  if (k === 'm') Audio.toggleMute();
  if (k === 'x') triggerUlt();
  if (state.mode === MODE_PLAY && !paused) {
    if (k >= '1' && k <= String(WEAPON_COUNT)) selectWeapon(parseInt(k, 10) - 1);
    if (k === 'q') selectWeapon((player.weapon + WEAPON_COUNT - 1) % WEAPON_COUNT);
    if (k === 'e') selectWeapon((player.weapon + 1) % WEAPON_COUNT);
    // 7/8/9 用道具：与武器 1-6 顺延，位置也和屏幕上竖排的三格一致
    if (k === '7') useItem(0);
    if (k === '8') useItem(1);
    if (k === '9') useItem(2);
    if (k === '0') useItem(3);
    if (k === '-') useItem(4);
  }
});
window.addEventListener('keyup', (e) => { if (nameInputOpen) return; keys[e.key.toLowerCase()] = false; });

let pointerDown = false; const activePointers = new Map();
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault(); Audio.init(); Audio.resume();
  // pen（手写笔）按触屏处理：它没有 hover、操作方式与手指一致。
  // 原来只判 touch / mouse，pen 会落到 else 分支被忽略，
  // 导致"用笔玩"时提示文案与跟随速度错误地沿用桌面逻辑。
  if (e.pointerType === 'touch' || e.pointerType === 'pen') isTouch = true;
  else if (e.pointerType === 'mouse') isTouch = false;
  if (nameInputOpen) return;
  const p = toGameCoords(e.clientX, e.clientY);
  if (upgradePanel.active) { handleUpgradeTap(p.x, p.y); return; }
  if (paused && state.mode === MODE_PLAY) {
    if (handleButtonPress(p.x, p.y)) { activePointers.set(e.pointerId, { isButton: true }); return; }
    return;
  }
  if (state.mode === MODE_MENU) {
    // 返回 'drag' 表示按在音量滑块上，需要交给 pointermove 继续拖动
    if (handleMenuTap(p.x, p.y) === 'drag') activePointers.set(e.pointerId, { isButton: true });
    return;
  }
  if (handleButtonPress(p.x, p.y)) { activePointers.set(e.pointerId, { isButton: true }); return; }
  if (paused) return;
  /* 垮掉期间不接管指针：否则按下就会激活拖拽/双击判定，
     菜单还在掉的时候飞船已经在响应手势了。 */
  if (menuFall < 1) return;
  // 至少让死亡定格 + 标题砸入 + 分数放大演完（1.4s），避免手快直接跳过整段结算动画
  if (state.mode === MODE_OVER) { if (state.time > 1.4) startGame(); return; }
  if (isTouch && activePointers.size === 0) {
    /* 双击 = 释放过载。
       过载是一局里少数几次的爆发点，触屏原先只能靠右下角圆形按钮释放 ——
       那个按钮占着右手拇指区（弹幕游戏最该留给走位的地方），且不在血条视线内。
       现在过载条画在血条正下方，双击即放，视线不离开战况区。

       ⚠️ 只在"这是第一根落下的手指"时判定，避免双指同时按下被误判成双击。 */
    const now = performance.now() / 1000;
    if (now - lastTapTime < 0.32 && Math.hypot(p.x - lastTapX, p.y - lastTapY) < 34) triggerUlt();
    lastTapTime = now; lastTapX = p.x; lastTapY = p.y;
  }
  activePointers.set(e.pointerId, { isButton: false });
  pointerDown = true; pointer.active = true; pointer.x = p.x; pointer.y = p.y;
  canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (nameInputOpen) return;
  // pen（手写笔）按触屏处理：它没有 hover、操作方式与手指一致。
  // 原来只判 touch / mouse，pen 会落到 else 分支被忽略，
  // 导致"用笔玩"时提示文案与跟随速度错误地沿用桌面逻辑。
  if (e.pointerType === 'touch' || e.pointerType === 'pen') isTouch = true;
  else if (e.pointerType === 'mouse') isTouch = false;
  const p = toGameCoords(e.clientX, e.clientY);
  if (MENU_VOL_CTRL.dragging) { updateVolumeFromX(p.x); return; }
  if (setVolDragging && settingsPageActive) { setVolumeFromPointer(p.x); return; }
  const info = activePointers.get(e.pointerId);
  if (isTouch) { if (info && !info.isButton) { pointer.active = true; pointer.x = p.x; pointer.y = p.y; } return; }
  if (e.pointerType === 'mouse' && !paused && state.mode === MODE_PLAY) { if (pointerDown) { pointer.active = true; pointer.x = p.x; pointer.y = p.y; } }
});
canvas.addEventListener('pointerup', (e) => {
  MENU_VOL_CTRL.dragging = false;
  setVolDragging = false;
  activePointers.delete(e.pointerId);
  if (activePointers.size === 0) { pointerDown = false; pointer.active = false; }
  else {
    let hasNonButton = false;
    for (const v of activePointers.values()) if (!v.isButton) hasNonButton = true;
    if (!hasNonButton) { pointerDown = false; pointer.active = false; }
  }
});
canvas.addEventListener('pointercancel', (e) => {
  MENU_VOL_CTRL.dragging = false;
  activePointers.delete(e.pointerId);
  if (activePointers.size === 0) { pointerDown = false; pointer.active = false; }
});
canvas.addEventListener('pointerleave', (e) => {
  if (e.pointerType === 'mouse') { activePointers.delete(e.pointerId); pointerDown = false; pointer.active = false; }
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state.mode === MODE_PLAY) { paused = true; Audio.stopBGM(); }
  if (document.hidden && nameInputOpen) closeNameInput();
});
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());

/* ==================================================================
   动态适配
   ================================================================== */
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
  canvas.style.width = vw + 'px'; canvas.style.height = vh + 'px';

  const screenAspect = canvas.height / canvas.width;
  const minAspect = 320 / 240;
  // 竖屏：逻辑高度向下延展铺满屏幕；横屏/方形：保持最小高度 320
  H = Math.round(W * Math.max(screenAspect, minAspect));

  // 取较小缩放比，保证整个逻辑画布都在视口内（横屏时左右留黑边）
  viewScale = Math.min(canvas.width / W, canvas.height / H);
  viewOffsetX = (canvas.width - W * viewScale) / 2;
  viewOffsetY = (canvas.height - H * viewScale) / 2;

  layoutButtons();
  initStars();
  if (planet) planet.y = Math.min(planet.y, H * 0.5);
  if (player) player.y = H - 60;
  ultScanY = H;
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => { setTimeout(resize, 120); });

/* ==================================================================
   主循环
   ================================================================== */
const STEP = 1 / 60;
let lastTime = performance.now(), accumulator = 0;
let lastDtMs = 16.7;   // 上一帧真实耗时（毫秒），供 FPS 采样
function loop(now) {
  requestAnimationFrame(loop);
  let delta = (now - lastTime) / 1000;
  lastDtMs = now - lastTime;      // FPS 采样用原始毫秒（delta 被 clamp 到 0.25，不能反推真实帧率）
  lastTime = now;
  if (delta > 0.25) delta = 0.25;
  sfxBudget = 0; updateQuality(delta);
  if (state.mode === MODE_PLAY) runTime += delta;   // 本局时长（分段评级的"效率"维度要用）
  /* 暂停时跳过游戏逻辑，但**必须继续推进 UI 动画**：
     弹窗的出场动画、HUD 滑入、数字滚动都挂在 update() 上，
     整个跳过会导致"点关闭后弹窗永远关不掉"（动画播不完 → 标记不复位）。
     游戏逻辑（敌人/子弹/碰撞）仍然冻结，只有界面动。 */
  if (paused && state.mode === MODE_PLAY) {
    accumulator = 0;
    if (pauseClosing) {
      pauseT = Math.max(0, pauseT - delta / PAUSE_OUT_DUR);
      /* 播完才真正恢复：提前置 paused=false 会让菜单在动画中途被跳过。
         同时清 hitstop —— 暂停期间可能残余定格，恢复时不该再吃一次。 */
      if (pauseT <= 0) { paused = false; pauseClosing = false; pauseT = 0; hitstop = 0; }
    } else {
      pauseT = Math.min(1, pauseT + delta / 0.35);
    }
    /* 垮掉期间暂停也要继续推进：否则 menuFall 永远停在中间值，
       而 handleButtonPress 在 menuFall<1 时吞掉所有点击 —— 菜单恢复后点什么都没反应。 */
    if (menuFall < 1) menuFall = Math.min(1, menuFall + delta / FALL_DUR);
    uiTime += delta;
    animUpdate(delta); tutUpdate(delta); rollUpdate(delta); uiSyncClose();
    render(); return;
  }
  /* hit-stop：世界完全冻结，但**震屏继续衰减** —— 定格的画面在震动，
     这才是"重击"。如果震屏也停了，看起来就像掉帧而不是被打中。 */
  if (hitstop > 0) {
    hitstop = Math.max(0, hitstop - delta);
    if (state.shake > 0) state.shake = Math.max(0, state.shake - delta * 42);
    accumulator = 0;
    render(); return;
  }
  pauseT = 0;
  state.time += delta; uiTime += delta;
  accumulator += delta; let guard = 0;
  // 时间缓动：缩放的是推进量而非真实时间，slowmo 用 delta（真实）递减
  const tScale = slowmo > 0 ? 0.4 : 1;
  while (accumulator >= STEP && guard < 6) { update(STEP * tScale); accumulator -= STEP; guard++; }
  if (guard >= 6) accumulator = 0;
  if (slowmo > 0) slowmo = Math.max(0, slowmo - delta);
  render();
}
/* 画质档位在这里统一加载（而非定义处）：
   loadQualityMode 会读 QUALITY_MODES 并写 quality，两者都定义在文件中部 ——
   在定义之前调用会撞 const/let 的暂时性死区（TDZ），直接抛
   "Cannot access ... before initialization"，整个脚本静默失效。
   放在末尾、resize() 之前：此时所有声明已完成，且早于第一帧。 */
loadQualityMode();
resize();
requestAnimationFrame(loop);

})();
</script>
