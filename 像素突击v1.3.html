  ============================================================
  像素突击 PIXEL RAIDER · 优化版（基于原版 XiangSuSheJi.html）
  ------------------------------------------------------------
  【暂停菜单「结束本局」确认弹窗】（上一轮，已被本轮取代）
  · 移除了原来带内联二次确认的「重开 / 返回主菜单」两个按钮 ——
    "点一次变'确认'再点生效"状态藏得太深，玩家第一次必懵
  · 出口决策合并为一个「结束本局 ›」半透明文字链（弱化权重，不抢"继续作战"视觉）
  · 点击弹出独立确认弹窗，内含「重开」与「返回主菜单」两个明确出口按钮
  · 弹窗随主题色（边框 / 标题走 TH()），"返回主菜单"用红色危险色，不可逆出口一目了然
  · 弹窗打开时：点击弹窗外一律不关闭（避免误触直接丢失进度）；P/Esc 关闭弹窗而非直接继续
  · R 键：弹窗已开 = 确认重开（明确的二次动作）；弹窗未开 = 打开弹窗，不再绕过确认
  · layoutButtons 的面板保高 while 增加 MH 下限守卫，消除原版只减 mh 的潜在死循环

  【暂停按钮动画修复 / 设置页注释精简 / 武器特效重改】（本轮）
  · **暂停菜单按钮僵住**：drawActionButton 的呼吸 / 扫描光带 / 边框流动都挂 state.time，
    而暂停时 state.time 是**冻结**的（游戏逻辑本就该停）—— 结果按钮完全定格，
    且定格在哪个相位取决于"按下暂停的那一刻"，每次开菜单外观都不一样。
    新增独立 UI 时钟 uiTime：暂停时照常推进，世界时间照常冻结，两者分离
  · drawActionButton 新增 opt.t 注入时钟，暂停菜单四个按钮全部传 uiTime
  · **设置页去掉三处脚注**：「F3 快捷开关 · 不写入存档」「仅改变界面配色…」
    「将重置高分 / 统计 / 成就」。前两处是说明性脚注，占版面且玩家不读；
    第三处删掉后「清除本地存档」改为垂直居中（原 y+7 是给副标题留的位置，
    只剩一行时不居中会贴着按钮顶显得空）
  · **武器弹幕特效重改**：旧版六种武器都是"一个竖着的彩色矩形"，只差颜色和尺寸 ——
    弹幕游戏里同屏几十发在飞，玩家没有余裕分辨颜色，形态必须先于颜色被识别。
    现在脉冲=尖锥 / 激光=长刃+强拖尾 / 散射=小扇形粒 / 导弹=带翼弹头 /
    回旋=旋转十字刃 / 电弧=链式分叉闪电；拖尾按速度矢量拉**楔形**（非矩形），
    复用 GLOW_KINDS 发光分层；新增枪口闪光；拖尾(≥0.7)与发光(≥0.5)过画质门限

  【HUD 改五行：生命加标签 / 去数值 / 新增敌人条 / 局内去玩家名】
  · **生命条加「生命」标签**，与护盾 / 过载 / 敌人**竖向严格对齐**（同标签位、同条位）：
    这四条是玩家除暂停外唯一会反复扫视的读数，对齐成一列后视线直线上下移动
  · **生命条去掉 "100/100" 数值**：加标签后横向没有余位；且激战时没人有空读精确数字
    —— 条长 + 颜色（绿/黄/红）已把"危险程度"编码清楚，精确值反而是噪音
  · 生命条保留视觉权重：drawSubStatBar 新增 main 模式（条高 6px + 体积光 + 末端锐光），
    通用条只有 4px —— 血条是唯一"掉了就要死"的读数，不能和护盾一样细
  · **新增「敌人」条**：剩余 = 排队未刷出的 + 已在场的，分母是本波总数 waveTotal。
    旧版那条用硬编码 20 当分母（total/20），而敌人数实为 5+n*3（第 1 波 8、第 10 波 35），
    高波次永远满格、低波次永远填不满，等于没用
  · Boss 波没有"剩余"概念（只有一只），此时显示「首领」并复用 Boss 血量填充
    —— 显示一条空条会被当成 bug
  · **局内不再绘制玩家名**（drawPlayerName 整块删除）：战斗中没有看自己名字的需求，
    它飘在飞船上方还占一块屏幕、会压 HUD
  · HUD_H 54 → 64，波次/金币/分数行下移到 48~62。
    ⚠️ H=320 横屏下可玩区从 226px(71%) 降到 198px(62%)
  · **hexA 加非法输入防御**：非法颜色直接返回安全青色而非抛异常。
    canvas 里颜色非法**不会静默失败** —— addColorStop 收到 NaN/undefined 抛 SyntaxError，
    而它常在 render 中途被调用，结果是**整帧中断**（之前 divider 传 rgba 就出过）。
    一处颜色画错只是那处不好看，整帧中断则是白屏

  【设置新增画质档位 / 僚机弹追踪 + 三连引爆】（本轮）
  · **画质档位**：自动 / 低 / 中 / 高 四档分段按钮（设置页新增一行控件）。
    ⚠️ 保留"自动"而非只给低/中/高：帧率自适应本就是在这三个值之间调，
    只留手动的话弱机玩家一旦选"高"就会一路掉到 20fps 且没有任何回退，
    等于把已有的保护机制整个删掉。默认停在"自动"，手动只是覆盖
  · 手动档**完全跳过自适应**：玩家已明确选档，再偷偷把"高"降成"中"是违背显式指令
  · 画质偏好写入 localStorage，与主题色同属"偏好"，清档时保留
  · ⚠️ loadQualityMode() 必须在文件末尾调用（不能在定义处）：
    它读 QUALITY_MODES 又写 quality，两者都定义在文件中部 ——
    在声明之前调用会撞 const/let 的 TDZ，抛"Cannot access ... before initialization"
  · ⚠️ **档名文字画到了屏幕外**：drawTextCenter2 签名是 (text, cx, y)，上一版把中心 x 和 y 写反，
    四个档位看着就是四个空方块，玩家分不清哪个是高哪个是低。
    只测「文字存在」抓不到这类错误，必须测「文字落在自己那一格内」。
    段高下限同时从 9 提到 11 —— fontPx 有 8px 硬下限，段高 9 时字会顶满上下边
  · 分段按钮矩形在 setLayoutSettings 里算好写回 SET_BTN.qseg，
    绘制端与命中端读同一份（与主题色块同一套做法），两边各算一遍必然对不上
  · **僚机弹追踪**：复用导弹的 homing（逐帧把速度往目标插值），
    转向率 12 比导弹 9 更灵敏 —— 僚机弹初速快，转慢了会绕圈。
    拖尾粒子概率降到 0.18 且改绿色：一局上百发，满屏橙迹会盖住弹幕
  · 两架僚机**共用一个目标**（玩家正前方最近的），各找最近的会四散像散兵不像护卫
  · **三连引爆**：敌人被僚机弹打中 3 下 → 半径 26、2 点伤害的爆炸。
    计数记在**敌人身上**而非子弹上（子弹命中即消失，记不住）。
    ⚠️ 击杀时必须清 dMark：对象池可能复用对象，脏标记会让新敌人第一下就炸

  【主菜单垮掉式入场 / 暂停退场动画】
  · **移除飞船飞入进场**：那是"游戏内"的进场，玩家看到的是"飞船来了"而不是"菜单走了"
    —— 画面上菜单仍然是瞬间消失的，切换依旧生硬
  · **改为主菜单垮掉**：菜单按水平方向切成若干条带，从上往下依次坠落 + 旋转 + 压扁，
    掉出屏幕后露出下面**已经在跑**的游戏画面。
    "离开菜单"和"进入游戏"变成同一个动作的两面，转场才有因果
  · 两个关键实现细节：
    ① **不用 globalAlpha 淡出** —— drawMenu 内部多处直接给 ctx.globalAlpha 赋值
       （标题呼吸/图标脉冲），外层设的 alpha 会被覆盖。改为靠"掉出屏幕"自然消失，
       也更像真的塌下来
    ② **clip 必须在变换之后** —— 先 translate/rotate/scale 再 clip，窗口才跟着带掉落。
       设在变换之前的话 clip 固定在屏幕空间，带内容下移时会从自己的窗口里滑出去，
       看着像错位而不是塌方
  · 相邻带朝相反方向倾斜（dir = ±1）：塌得乱而不齐，整齐下滑像"卷帘门"不像垮
  · 带数随画质 6/4/3：每条带都要整份重绘一次菜单，低配少切几刀；完成后完全停止绘制
  · 只在**从主菜单进入**时播（fromMenu 判断，必须在 resetGame 之前读 state.mode）——
    结算页"再来一局"、暂停里"重开"都没有菜单可垮，播了就是凭空掉下一块菜单
  · 垮掉期间锁移动、禁开火、吞掉点击（此时状态已是 MODE_PLAY，不挡会命中下面暂停按钮）
  · **暂停菜单退场动画**：原本瞬间消失（paused=false 一设，下一帧菜单就没了）。
    现在点继续不直接恢复，而是标记 pauseClosing 让 pauseT 从 1 退回 0，
    复用入场同一条时间轴反向播放，播完才真正恢复。退场(0.26s)比入场(0.35s)快：
    离开要干脆，进入可以从容。退场途中再按 P = 取消并重新展开

  【护盾改点数制 / 移除冲刺 / 三条缩短对齐】
  · **护盾 8 秒 → 100 点**（SHIELD_MAX）：与血量同构的第二管血，先扣护盾、扣完才扣血，
    不再随时间衰减。原实现是"有盾就完全免疫这一次伤害并清零"——
    那等于 1 点护盾也能挡下 Boss 一发重击，与"100 点"的数值完全脱节
  · 破碎只在护盾真正归零时触发（+0.5s 短无敌作为"盾没了"的反馈），
    中途挨打只播放吸收特效，不再每次都给 1 秒无敌
  · 来源改点数：护盾道具 +35 / 血包溢出 +25 / 大血包 +50 / 升级项 +50（均受 100 上限截断，
    增量提示显示**实际**增加量，避免满盾时谎报 +35）
  · **冲刺系统整体移除**：DASH_TIME/CD/SPEED、doDash、dashCd/dashing/dashX/dashY/
    dashCdMul/dashCount/dashGhosts、updateGhosts、drawDashGhosts、Shift 键、
    「引擎过载」升级项、「疾风者」成就、状态胶囊里的冲刺项，全部清理
  · 三条缩短并统一对齐：血条 98→76，护盾/过载条 140→57 且右端与血条齐平（x=87），
    数值列统一从 x=91 左对齐（原为右对齐到屏幕边，条空时那片空白像"没显示"）

  【5 格道具栏 / 伤害强化卡 / 事件与状态系统】
  · **道具栏 3 → 5 格**，新增两个**辅助向**道具：
     ④ 磁力吸引（瞬间吸取全屏掉落，弹幕密时不用冒险去捡）
     ⑤ 护盾发生器（立即 +50 护盾点数）
    没做"增伤""无敌"类：前者与伤害强化卡重复，后者会盖过缓速的定位
  · **清屏升级卡改为"给 3 枚炸弹"**：商店出现时场上常常没敌人（波次刚清完），
    立即清屏等于花 55 金币炸了个寂寞 —— 与炸弹入道具栏是同一条逻辑
  · **新增伤害强化卡**（cost 40）：每级 +2%，可重复购买，总上限 +10%。
    做成可叠加而非单张给满，是为了让它在卡池里多次出现时不至于后面全是废牌
  · **8 种好/坏状态**（狂热/迟滞、铁壁/脆化、幸运/贫瘠、迅捷/粘滞），12 秒。
    同时只保留一个（新的顶掉旧的）—— 叠加后玩家要心算多个乘数，
    弹幕游戏里没人有这个余裕，一个状态一眼读完才有用
  · **5 种随机事件**，第 3 波起 20% 在波次开始时触发（补给空投/能量涌动/
    幸运星尘/恒星耀斑/重力异常）。选波次开始而非进行中：
    中途弹事件会在最需要专注时打断操作，且"这波变难了"必须提前知道
  · 键盘道具键扩展到 7 8 9 0 -（对应竖排五格）
  · **修：磁力吸引 / 护盾发生器捡不到**。新增道具需要同步三处：
    ITEM_SLOTS（道具槽）+ randomPowerupType（掉落池）+ applyPowerup（拾取结算），
    上一轮只改了第一处 —— 后两处漏了，结果它俩只能靠事件的"补给空投"极低概率拿到。
    现在五个槽位各 7% 掉落（即时增益 65% / 入栏道具 35%），
    并在测试里加了三处对齐的静态检查，防止再漏

  【超载改冷却制 / 左下角状态提示】（上一轮）
  · **超载：击杀蓄能 → 30 秒冷却**（ENERGY_MAX/energy 全部换成 ULT_CD/ultCd）。
    蓄能制下"能不能放"取决于杀了多少敌人，玩家无法规划；
    冷却制把它变成可预期的节奏点 —— 每 30 秒一次清场，可以留着等弹幕密集时用
  · 冷却条填充方向**与护盾相反**（1 - ultCd/ULT_CD，从空涨到满）：
    护盾是"剩越多越好"，冷却是"剩越少越好"，方向反过来才不会读错
  · 玩家光环同步改为冷却进度；冷却结束自动弹"超载就绪"提示
  · **新增左下角 toast 系统**（pushToast / updateToasts / drawToasts，3 秒消失）：
    拾取道具、护盾破碎、超载释放/就绪都走这里。
    选左下角的理由：banner 在屏幕正中偏上，是给波次切换这种全屏级事件用的，
    吃个血包也用 banner 会挡住弹幕，且玩家不会抬头看；
    左下角是视线余光能覆盖、又几乎不挡来敌的位置
  · 同名 toast 刷新计时并累加 ×N（连吃三个血包显示"×3"而不是刷三行），最多 4 条
  · 道具反馈从 banner 改为 toast，banner 只保留波次/首领/成就等大事件

  【HUD：护盾条 / 过载条上移，移除过载圆圈，双击改释放过载】（上一轮）
  · HUD_H 40 → 54，四行布局：生命 / 护盾 / 过载 / 波次·分数·金币
  · **血条正下方新增两条细状态条**（通用函数 drawSubStatBar）：
      护盾 = 剩余秒数 / 8s 满格；过载 = 能量蓄能 %，满时转金色并呼吸 + 显示"就绪"
    放在血条正下方是因为这三条是玩家唯一反复扫视的读数，竖向成列后视线直线上下移动
  · **移除右下角过载圆形按钮**（drawUltButton / hitUltButton / BUTTONS.ult 全部清理）：
      ① 它占着右手拇指区，弹幕游戏这块最该留给走位
      ② 能量进度与血条不在同一视觉层，要来回扫视才知道能不能放
      ③ 触屏原先只能靠它放大招，点不到就永远放不了 —— 这是它能被 HUD 条取代的根本原因
  · **触屏双击：冲刺 → 释放过载**。过载是一局里少数几次的爆发点，值得占这个手势；
    冲刺改回纯键盘（Shift）。拖拽移动的触屏玩家不再需要额外手势去冲刺
  · 护盾不再进底部状态胶囊：HUD 已有护盾条显示同一数值，两处显示是重复占位
  · 操作说明页文案同步：删"双指同时点击 释放冲刺"/"点击右下角按钮 释放超载"，改"双击屏幕 释放过载"
  · 升级面板 upLayout 增加矮屏三级收缩（卡高 → 间距 → 硬下限 42）：
    HUD 变高 14px 后 H=320 的升级面板会溢出约 10px，跳过按钮底贴到底部提示

  【升级卡片：加效果说明 + 修矮屏重叠】（本轮）
  · UPGRADES 新增 tip 字段（**有啥用**），与 core（**能得到多少**）、name 分工明确。
    原 desc 只是把 core 换个说法再说一遍（"护盾 8 秒" / "8 秒"），
    显示它等于同句重复两遍 —— 这正是它当初被砍掉的原因。
    真正缺的是效果解释：僚机=多一台副机自动射击、磁力场=自动吸取掉落物、散射=一次射多发
  · desc 字段保留但 UI 不显示（避免与 core 重复造成信息噪音）
  · 卡片布局改为按可用区间反推（upLayout）：卡片高度/起始 y 自适应，高屏垂直居中
  · **修矮屏重叠（既有 bug）**：原写死 y0=110/h=48，H=320 下第三张卡 222~270
    而「剩余 N 秒」画在 H-60=260，压在卡片上；跳过按钮 282~308 与 H-42 提示又压一次。

  【玩家能量环 + 机头朝向】之前能量只是头顶一条 26x3 的横条 —— 抽象，且和"这是我的飞机"无关
  · 超载冷却做成绕在玩家身上的环：弧形填充度 = 冷却进度，从正上方顺时针
  · 满时环呼吸外扩 + 转金色 —— 超载就绪是**技能标识**，不跟主题色走
  · 受伤时整环闪红 —— 危险反馈落在玩家身上，比让 HUD 自己闪更直觉

  · 环半径 16 与玩家名字协商：名字块底必须落在环顶之上 2px，贴顶部时干脆不画名字（压 HUD 更糟）
  · 头顶旧横条已移除，避免同一份能量显示两次

  【HUD 信息带材质化】之前顶部/底部只有一条实线、数字是普通小字
  · drawEdgeLine() 渐变边线（两端淡出中间亮）—— 实线像"硬边"，渐变线才像"面板与世界的接缝"。
    抽成函数是因为顶部 HUD 与底部武器栏各需要一条，之前两处各写一遍且颜色写死
  · 血条 3 层发光：体积光垫底（有厚度）+ 实心填充 + **锐光打在填充末端**。
    末端锐光是关键 —— 眼睛会被"当前血量的位置"吸住，而不是看整条
  · 数值发光用**预渲染 spark 贴图**，不用 shadowBlur：后者每帧重算模糊，手机上很贵
  · 波次/分数字号加大（0.9→1.0/1.05），分数是全局最重要的数字
  · 行2 卡片间加渐变分隔 + 端点方块：硬实线会让两块黏得更死，渐变线两端自然消失只留分界感
  · 底部武器栏选中格加体积光，与主按钮同一套材质语言

  · 威胁箭头：屏幕外飞来的敌弹在**对应边缘**画红三角指向它。

  【hit-stop 命中定格】重击瞬间**完全冻结**世界 30~50ms（2~3 帧）
  · 与 slowmo 的区别：slowmo 是"慢放"（血条还在动），hit-stop 是"定格"（全停），两者不叠加
  · 定格期间**震屏继续衰减** —— 定格的画面在震动才是"重击"；
    震屏也停了就变成"掉帧"而不是"被打中"
  · 只在**玩家自己挨打**时触发，时长随伤害递增：撞机(50) 50ms / 中等(15~30) 35ms / 小伤害 0
  · 必须稀缺：每次击杀都定格会让游戏一卡一卡，反而廉价

  【音频双总线】之前所有音效共用一条 sfxGain，"我开枪"和"敌人爆炸"是同一层声音
  · player 总线：直达 sfxGain，清脆不闷（玩家射击 / 受伤 / 超载 / UI 音）
  · world  总线：经 lowpass 2600Hz 再进 sfxGain，刻意闷一点（敌人爆炸等）
  · 玩家自己的枪声永远"在前"，世界的声音"在后" —— 这是"我在掌控"的感觉来源
  · 人耳比人眼快（音频 5ms 响应 vs 视觉 16ms 一帧），听觉分层比视觉分层更易被感知

  【UI 动态元素】静态界面看着就是简陋，UI 上必须有"活的东西"

    骨架常驻 alpha 0.22、峰值只到 0.57 —— 骨架要满、光要稀缺
  · 数字微动 liveNumber()：明度呼吸 0.72~1.0，**不做位移抖动** ——
    drawText 内部有 Math.round(x)，±0.5px 会被取整抹掉，且像素字体本就该对齐像素网格
  · 进度条流光 drawBarSheen()：只在**已填充段**内跑，40 个相位实测 0 越界
    （高光跑出填充段会让人误判进度）

  【暂停菜单重构：战术面板】之前是五个等大长方形一字排开 —— 那是"功能列表"不是"暂停菜单"，
  玩家要花时间找"继续"。现在所有内容装进一整块面板（装置边框 + 标题栏），像座舱里拉下的战术数据板：
  · ① 主操作"继 续 作 战"独占一行（宽 76%），渐变底 + 发光 + 边框流光，视觉权重最高
  · ② 战况数据用**双列网格**（8 项），一眼看完不用上下扫。数值三级字号：

  · ③ 四个次要操作横排一行，危险操作（重开/返回）用红色

  · 入场动画 0.35s（easeOutCubic + 面板下滑 14px + 数据逐行错峰）。

  · 返回主菜单二次确认：一局打到一半，误触就没了。点一次变"确认"并转主推样式，再点才执行

    移除后面板多出 34px 可用高度，四行数据不再挤

  【主题色系统】之前整个界面全是硬编码色值 —— 没有"主题色"这回事，改一处要动几十个地方
  · 6 个预设：霓虹青 / 量子紫 / 熔岩橙 / 翡翠绿 / 绯红 / 月白，存 localStorage，即时生效
  · **只管界面，不改战斗特效**：界面是"机舱"，特效是"能量"，本来就是两层
  · 绝不跟随主题（NEVER_THEME）：受伤警告红、治疗绿、伤害数字、超载青脉冲、战斗特效
    这些是全局约定，跟着主题走玩家会看不懂
  · 不做取色器：自由取色玩家必选纯黑或荧光绿，一定丑；预设能保证好看且色块即预览
  · 清除存档**保留**主题 —— 清档是给"想重来一遍"的人用的，不该顺手把挑的颜色也清掉
  · 设置页分区高度自适应：横屏 800x400（逻辑高仅 320）时四个分区整体压缩，下限 0.6

  【击杀特效分级】之前所有击杀走 explode(count=14)，而 explode 的"大爆炸"分支
  要求 count>=16 —— 于是 nova 光条 / 整屏色差 / 余烬 / 副环**一次都没触发过**，
  玩家看到的永远是"粒子 + 一个向外扩散的环"，也就是那个椭圆扩散。
  · 现在按"因果形态"分三级，每级一套独立仪式：
    杂兵 —— 只给极短火花 + 向下方抛射的物质，**不给光环**（它是"掉下去的"）
    精英 —— nova 光条 + 辐条环 + 整屏色差（它是"被轰开的"）
    首领 —— 先向内塌陷 0.2s 再爆开 + 0.3s 慢动作 + 敌方子弹同时消散
  · 杂兵不给光环是核心：之前满屏都在扩散椭圆，等于没有爆炸，稀缺性才造得出冲击力
  · 受伤只出火花、死亡才出爆炸（之前两套共用 explode，反馈叠在一起是浪费）
  · 同屏 nova 限 2 个（限额写在 addNova 内，任何调用点都必须遵守），
    15 波敌机密集时不会糊住视线；超出则降级为普通爆炸，物质和环照给
  · 首领主爆原本**立即**执行，与塌陷同帧发生 —— 仪式根本没演出来，
    现已延后到 +200ms，塌陷演完才炸开

  【引导系统】之前完全没有引导，玩家第一次打开就是满屏文字和六个区块
  · 首局只教两件事：移动、射击（一次性灌六个概念等于没教）
  · 其余靠自然提示浮出：首次拾道具 → "切换武器"；首次受伤 → "超载反击"
  · 每条同 id 只出现一次（localStorage 记录），队列同时只显示一条
  · 提示条贴在屏幕下方 1/4 处，避开战斗中心区，用 panel + 标题栏语言

  · 四档时长：T_MICRO 80ms / T_QUICK 160ms / T_PAGE 240ms / T_NARR 800ms
  · 两条曲线：easeOutCubic（入场）/ easeInCubic（出场），不用弹性曲线

  等开关散落全局，互相不知道对方存在，"点空白关闭""ESC 关闭"要各写一遍

  · 比战斗音效更短更轻，避免与弹幕爆炸声糊在一起

  【呼吸高亮】主菜单指挥官卡 / 操作说明按钮、暂停菜单主按钮，均有呼吸式描边

  【特效重构】原来只有"粒子 + 碎片 + 单层圆环"，现在分 6 层，各有独立寿命与运动规律：
  · 闪核（0.12s）：爆炸瞬间的高亮核心，白核 + 本色光晕，补足"炸开的那一下"

  · 余烬（1.4s）：暗色缓慢飘散，寿命是粒子的 2 倍，给爆炸留"余味"

  · 新增【nova 放射光条】第 7 层：9 条长短交错的光束从爆点炸开，

  · 冲击波：环上长 8 根辐条并缓慢自转，环不再是一根光秃秃的线（rx>16 才画）

  · 余烬：加独立 seed 相位闪烁（0.72±0.28），火星明灭不同步
  · 容量：nova 接入 quality（10/6/4），重置清空所有新层

  【结构件三件套】（视觉密度第 6 步）
  之前的界面是"一个平面"：标题、按钮、卡片同一亮度同一套描边，
  看着像系统设置页而不是游戏。缺的是"中远层"。三件套全部静态不发光，
  只撑骨架 —— 结构可以满，光必须稀缺：
    · frameCorners(x,y,w,h,len,color,alpha)  四角 L 形刻度线（8 段一次描边）。
      主菜单内容区用它把整屏"框"成装置，alpha 仅 0.22（骨架不能比按钮显眼）
    · panelHeader(x,y,w,label,color)         分组标题栏：左 2px 竖条 + 标签 +
      右侧淡出延伸线。不是装饰，是"分组信号"。返回栏高便于排布；
      标签超长时延伸线自动不为负宽
    · dividerMarked(y,color,inset)           divider 增强版：渐变线 + 一对端点方块
  已接入：战绩区/功能区/页脚三处标题栏，统一靠左基线（原居中标签与两侧脱节），
  均位于 gap 内部不挤压纵向流

  【发光材质拆分】（视觉密度第 5 步，所有界面视觉的前置）
  之前所有发光共用一张径向渐变贴图，所以白核、按钮、标题、火花
  发的是同一种光 —— 这是"简陋"的根源之一。现在拆成四种：
    halo   光晕  R16 大/软/低频，中心不实(0.40) → 面板环境光、背景氛围
    spark  锐光  R8  小/硬/高频，中心实心(1.0)  → 火花、关键指示
    volume 体积光 R12 中频(0.90)，靠 3 层叠加出厚度 → 主按钮、能量槽
    sheen  流光  非径向！方向性线性光带 → 进度条流动、边框能量
  原则：结构可以满，光必须稀缺。四材质是让"仅有的光"各有职责，
  不是让更多东西发光。缓存 key 为 `kind|color`，同参数不重复生成。
  已接入：主按钮(volume+halo)、成就进度条(sheen)、能量条(sheen)、
  粒子/nova/闪核(spark)
  · 低画质（quality<=0.5）跳过整屏残影，只保留边缘色散
  · 战绩区 h 之前写死成 H-y-40（虚高），改用实际内容高 statsBlockH()

  【修复"太挤"】上一版为了垂直居中把上下留白压到 8/5px，整屏塞满 —— 这是错的：
  · 留白是设计的一部分，不是浪费。改为"先扣留白，再算间隙"，
    预留 padTop 18 / padBot 20，空间不够时先压内容、再压间隙、留白最后才让
  · 间隙上限 26 → 38，实测四处处处 33px（原来 26px）
  · 战绩卡 2x2（占 94px 高）改横排四张（占 44px）：省 50px 全给留白，
    这是拥挤的根源 —— 空间不够要压缩"内容本身"，而不是牺牲留白
  · 填充率从接近 100% 降到 62%
  · 窄卡（约 45px 宽）：内边距收窄、左侧色条改顶部细条，
    标签与数值按字数自动缩字，8 位高分也不溢出
  · 两个功能按钮间距 8px → 18px（原来两块视觉上黏在一起）
  · 指挥官显示并入左上角胶囊：【头像 + 用户名 + 铅笔】，整体即改名按钮。
    原来 188x40 的大指挥官卡整块删除，纵向流少一块 + 一个间隙，
    省下的 73px 全给留白（上下留白 18/17 → 47/46，填充率 62% → 50%）。
    胶囊宽固定 76（不随用户名变），改名后无需重算布局、命中区稳定；
    用户名过长先缩字、字号有 8px 下限仍放不下则截断加省略号
  · 标题区左右两枚对等胶囊：左【头像+用户名+铅笔】= 用户，右【齿轮+设置】= 设置。
    原来右侧只是 26x26 无文字齿轮方块，左右视觉不对等。现在两枚都是 70x26、
    同 y、左右边距都是 22，内部文字偏移也统一（图标 +9、文字 +20）。
    宽度取 70 而非 76：副标题"像素突击"占位 100.5~139.5，
    76 会把间距压到 2.5px，70 则两侧各留 8.8px
  · 改名入口：原来是"点整张指挥官卡 + 卡内右侧 14px 小方框提示"，
    入口不明确还占整张卡片。现在改成左上角 26x26 小正方形铅笔按钮，
    与右上角齿轮同高对称（左 x=22 / 右 x=192，同 y=88）；
    指挥官卡不再触发改名（入口唯一），卡内编辑提示同步移除
  · 进一步合并：操作说明 + 武器图鉴 → 一个全宽「图鉴 / 说明」按钮，
    进页后顶部两个 tab 切换。入口更少、不再有并列的黏连感，内容一点没丢
    （原来是两个独立开关 helpPanelActive / weaponPageActive，
     现在统一为 codexPage { active, tab }，绘制拆成
     drawCodexPage 容器 + drawHelpContent / drawWeaponContent 两个内容函数）

  【GameOver 动画】分阶段揭示，信息不再一次性砸出来
    0.0-0.9s 死亡定格（残影消散，战场仍可见）

<script>
(() => {
'use strict';

/* ==================================================================
   基础常量
   ================================================================== */
const W = 240;
let H = 320;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
if (!ctx) {
  /* 极端环境（浏览器禁用 canvas、GPU 进程异常）下 getContext 返回 null。
     不拦住的话后面几百处 ctx.xxx 会连续抛错 —— 页面全白且没有任何可读提示，
     玩家只会以为"游戏坏了"。这里给出明确文案并终止初始化。 */
  document.body.innerHTML =
    '<div style="color:#eafcff;font:700 14px sans-serif;padding:24px;line-height:1.7">' +
    '当前环境不支持 Canvas 2D，无法运行《像素突击》。<br>' +
    '请更换浏览器，或在设置中开启硬件加速后重试。</div>';
  throw new Error('Canvas 2D context unavailable');
}
const nameInput = document.getElementById('nameInput');
let viewScale = 1, viewOffsetX = 0, viewOffsetY = 0;

// 嗅探结果对"带触屏的笔记本"会误判；这里按实际 pointer 类型动态修正，
// 影响跟随速度、双击释放过载与所有操作提示文案
let isTouch = !!('ontouchstart' in window || (navigator.maxTouchPoints && navigator.maxTouchPoints > 0));

/* ==================================================================
   字体
   ================================================================== */
const FONT_FAMILY = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif';
function fontStr(scale) { return '700 ' + Math.max(8, Math.round(9 * scale)) + 'px ' + FONT_FAMILY; }
function drawText(text, x, y, color, scale = 1, align = 'left') {
  ctx.font = fontStr(scale); ctx.textBaseline = 'top'; ctx.textAlign = align;
  ctx.fillStyle = color; ctx.fillText(String(text), Math.round(x), Math.round(y)); ctx.textAlign = 'left';
}
function textWidth(text, scale = 1) { ctx.font = fontStr(scale); return ctx.measureText(String(text)).width; }
function drawTextCenter(text, y, color, scale = 1) { drawText(text, W / 2, y, color, scale, 'center'); }
function drawTextRight(text, rightX, y, color, scale = 1) { drawText(text, rightX, y, color, scale, 'right'); }
// 在指定水平区间内居中（drawTextCenter 只能按整屏居中，分区场景需要这个）
function drawTextCenter2(text, cx, y, color, scale = 1) { drawText(text, cx, y, color, scale, 'center'); }

// 字号对应的像素高度（与 fontStr 保持一致：9 * scale，最小 8）
function fontPx(scale) { return Math.max(8, Math.round(9 * (scale || 1))); }
// 自适应字号：文字宽度超过 maxWidth 时按比例缩小。
// 用于分数这类位数会变长的文本 —— 否则 7 位以上的分数会撑破边框甚至溢出屏幕
function fitTextScale(text, maxWidth, scale) {
  const s0 = scale;
  const w = textWidth(text, s0);
  if (w > maxWidth && w > 0) return Math.max(0.8, s0 * (maxWidth / w));
  return s0;
}
function drawTextAt(text, x, y, color, scale = 1) {
  ctx.font = fontStr(scale); ctx.textBaseline = 'top'; ctx.textAlign = 'center';
  ctx.fillStyle = color; ctx.fillText(String(text), Math.round(x), Math.round(y)); ctx.textAlign = 'left';
}

/* ==================================================================
   圆角矩形
   ================================================================== */
function roundRectPath(x, y, w, h, r) {
  if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2;
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

function drawWeaponIconTo(g, idx, cx, cy, size, color) {
  g.save();

  g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round';

      g.beginPath();
      g.moveTo(0, -s * 0.45); g.lineTo(s * 0.28, s * 0.05);
      g.lineTo(s * 0.1, s * 0.05); g.lineTo(s * 0.1, s * 0.42);
      g.lineTo(-s * 0.1, s * 0.42); g.lineTo(-s * 0.1, s * 0.05);
      g.lineTo(-s * 0.28, s * 0.05); g.closePath(); g.fill();
      break;
    case 1:
      g.beginPath();
      g.moveTo(-s * 0.45, 0); g.lineTo(s * 0.45, 0);
      g.moveTo(s * 0.45, 0); g.lineTo(s * 0.24, -s * 0.18);
      g.moveTo(s * 0.45, 0); g.lineTo(s * 0.24, s * 0.18);
      g.moveTo(-s * 0.45, 0); g.lineTo(-s * 0.24, -s * 0.18);
      g.moveTo(-s * 0.45, 0); g.lineTo(-s * 0.24, s * 0.18);
      g.stroke();
      break;
    case 2:
      for (let i = -1; i <= 1; i++) {
        g.beginPath();
        g.moveTo(i * s * 0.22, s * 0.42); g.lineTo(i * s * 0.4, -s * 0.42); g.stroke();
      }
      g.beginPath(); g.moveTo(-s * 0.3, s * 0.42); g.lineTo(s * 0.3, s * 0.42); g.stroke();
      break;
    case 3:
      g.beginPath();
      g.moveTo(0, -s * 0.5); g.lineTo(s * 0.22, s * 0.05);
      g.lineTo(s * 0.1, s * 0.05); g.lineTo(s * 0.1, s * 0.32);
      g.lineTo(-s * 0.1, s * 0.32); g.lineTo(-s * 0.1, s * 0.05);
      g.lineTo(-s * 0.22, s * 0.05); g.closePath(); g.fill();

      g.beginPath();
      g.moveTo(-s * 0.4, -s * 0.4); g.lineTo(-s * 0.05, -s * 0.1);
      g.lineTo(-s * 0.18, s * 0.04); g.lineTo(s * 0.4, s * 0.4);

    case 5:
      g.beginPath(); g.arc(0, 0, s * 0.34, -Math.PI * 0.72, Math.PI * 0.72); g.stroke();
      g.beginPath();
      g.moveTo(s * 0.24, -s * 0.24); g.lineTo(s * 0.44, -s * 0.4);
      g.moveTo(s * 0.24, s * 0.24); g.lineTo(s * 0.44, s * 0.4);

const WEAPON_ICON_CACHE = new Map();
function getWeaponIcon(idx, size, color) {
  const key = idx + '|' + Math.round(size) + '|' + color;
  let c = WEAPON_ICON_CACHE.get(key);
  if (!c) {
    const pad = 3, ss = Math.max(4, Math.round(size));

}

  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const col = palette[rows[y][x]]; if (!col) continue;
    g.fillStyle = col; g.fillRect(x, y, 1, 1);

}

let quality = 1;                                  // 1 / 0.6 / 0.35 三档
/* 画质档位：0=自动（默认） 1=低 2=中 3=高。
   ⚠️ 保留"自动"而不是只给低/中/高：帧率自适应是为了保护低端机 ——
   自适应档位实际就是 1/0.6/0.35 这三个值。若只留手动三档，
   弱机玩家一旦选了"高"就会一路掉到 20fps 且没有任何回退，
   等于把已有的保护机制整个删掉。默认停在"自动"，手动只是覆盖。 */
const QUALITY_KEY = 'pixelraider_quality';
const QUALITY_MODES = [
  { id: 0, name: '自动', val: null },
  { id: 1, name: '低',   val: 0.35 },
  { id: 2, name: '中',   val: 0.6 },
  { id: 3, name: '高',   val: 1 }
];
let qualityMode = 0;
function loadQualityMode() {
  const v = parseInt(localStorage.getItem(QUALITY_KEY) || '0', 10);
  qualityMode = (v >= 0 && v <= 3) ? v : 0;
  applyQualityMode();
}
function saveQualityMode() { try { localStorage.setItem(QUALITY_KEY, String(qualityMode)); } catch (e) {} }
function applyQualityMode() {
  /* 手动档直接钉死 quality；自动档不动 —— 交给 updateQuality 按帧率调，
     但要把当前值对齐到最近的档位，避免从"手动低"切回自动时
     停在一个自适应不会产生的中间值上。 */
  const m = QUALITY_MODES[qualityMode];
  if (m && m.val !== null) { quality = m.val; return; }
  quality = quality >= 0.8 ? 1 : (quality >= 0.48 ? 0.6 : 0.35);
}
function cycleQuality() {
  qualityMode = (qualityMode + 1) % QUALITY_MODES.length;
  applyQualityMode(); saveQualityMode();
}
function setQualityMode(i) {
  if (i < 0 || i >= QUALITY_MODES.length || i === qualityMode) return;
  qualityMode = i; applyQualityMode(); saveQualityMode();
}
let sfxBudget = 0;                                // 每帧音效配额，防止爆音与卡顿
function particleCap() { return Math.round(480 * quality); }
function debrisCap() { return Math.round(100 * quality); }
let frameAcc = 0, frameCount = 0;
let qualityCooldown = 0;
function updateQuality(delta) {
  /* 手动档（低/中/高）完全跳过自适应：玩家已经明确选了档位，
     再偷偷把他的"高"降到"中"是在违背显式指令 ——
     哪怕掉帧也该由他自己看到后改，而不是系统自作主张。 */
  if (QUALITY_MODES[qualityMode] && QUALITY_MODES[qualityMode].val !== null) return;
  frameAcc += delta; frameCount++;
  if (qualityCooldown > 0) qualityCooldown -= delta;
  if (frameAcc >= 1) {
    const avg = frameAcc / frameCount;
    frameAcc = 0; frameCount = 0;
    /* 变档冷却（迟滞）：原来升/降两个阈值只差 0.008s，
       帧率在临界抖动时会每秒来回切档，画面"忽清晰忽模糊"——
       比稳定停在低画质更难看。变档后强制观察 1.5s 再评估。 */
    if (qualityCooldown > 0) return;
    if (avg > 0.027) { quality = Math.max(0.35, quality - 0.3); qualityCooldown = 1.5; }
    else if (avg < 0.019) { quality = Math.min(1, quality + 0.2); qualityCooldown = 1.5; }
  }
}

/* ==================================================================
   音频
   ================================================================== */
const Audio = {
  ctx: null, masterGain: null, bgmGain: null, sfxGain: null,
  isMuted: false, bgmTimer: null, isBgmPlaying: false,
  volume: 0.6,

  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      try {
        const sv = localStorage.getItem('pixelraider_vol');
        if (sv !== null) {
          const v = parseFloat(sv);
          if (!isNaN(v)) this.volume = Math.max(0, Math.min(1, v));
        }
      } catch (e) {}
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = this.isMuted ? 0 : this.volume;
      this.masterGain.connect(this.ctx.destination);
      this.bgmGain = this.ctx.createGain(); this.bgmGain.gain.value = 0.22;
      this.bgmGain.connect(this.masterGain);
      this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 0.5;
      this.sfxGain.connect(this.masterGain);
      /* ===== 双总线 =====
         之前所有音效共用一条 sfxGain，所以"我开枪"和"敌人爆炸"是同一层声音，
         混战时分不清哪个是自己造成的 —— 打击感的一半就没了。

         现在分两条：
           player 玩家总线：直达 sfxGain，清脆不闷
           world  世界总线：经 lowpass（2600Hz）再进 sfxGain，刻意闷一点
         这样玩家自己的枪声永远"在前"，世界的爆炸声"在后"。

         注意：人耳比人眼快（音频 5ms 响应 vs 视觉 16ms 一帧），
         所以听觉上的分层比视觉上的分层更容易被感知。 */
      this.playerGain = this.ctx.createGain(); this.playerGain.gain.value = 0.9;
      this.playerGain.connect(this.sfxGain);
      this.worldGain = this.ctx.createGain(); this.worldGain.gain.value = 0.8;
      this.worldFilter = this.ctx.createBiquadFilter();
      this.worldFilter.type = 'lowpass'; this.worldFilter.frequency.value = 2600;
      this.worldGain.connect(this.worldFilter); this.worldFilter.connect(this.sfxGain);
    } catch (e) {}
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  applyVolume() { if (this.masterGain) this.masterGain.gain.value = this.isMuted ? 0 : this.volume; },
  setVolume(v) {
    this.volume = Math.max(0, Math.min(1, v));
    this.applyVolume();
    try { localStorage.setItem('pixelraider_vol', String(this.volume)); } catch (e) {}
  },
  toggleMute() { this.isMuted = !this.isMuted; this.applyVolume(); return this.isMuted; },
  // bus: 'player' = 玩家自己的声音（清脆）；'world' = 世界/敌人的声音（略闷）。默认 world
  play(freq, dur, type = 'square', vol = 0.035, slideTo = null, bus = 'world') {
    if (!this.ctx || this.isMuted || sfxBudget >= 10) return;
    sfxBudget++;
    try {
      const t = this.ctx.currentTime;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(bus === 'player' ? this.playerGain : this.worldGain);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  },
  playNoise(dur, vol = 0.05, bus = 'world') {
    if (!this.ctx || this.isMuted || sfxBudget >= 10) return;
    sfxBudget++;
    try {
      const t = this.ctx.currentTime;
      const bufferSize = this.ctx.sampleRate * dur;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource(); src.buffer = buffer;
      const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 800;
      const g = this.ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(filter); filter.connect(g);
      g.connect(bus === 'player' ? this.playerGain : this.worldGain); src.start(t);
    } catch (e) {}
  },
  // 用 AudioContext 时钟提前 200ms 预调度音符：setInterval 只负责"喂料"，
  // 不再直接决定发声时刻，因此卡顿或后台节流都不会让节拍走音、堆积
  startBGM() {
    if (!this.ctx || this.isBgmPlaying) return;
    this.isBgmPlaying = true;
    const bpm = 130, stepDur = 60 / bpm / 2;
    let step = 0;
    let nextTime = this.ctx.currentTime + 0.08;
    const bassSeq = [55, 0, 55, 0, 65.4, 0, 55, 0, 49, 0, 49, 0, 58.3, 0, 55, 0];
    const padSeq  = [220, 0, 0, 0, 261.6, 0, 0, 0, 196, 0, 0, 0, 233.1, 0, 0, 0];
    const leadSeq = [440, 0, 523.3, 0, 659.3, 0, 523.3, 0, 392, 0, 440, 0, 523.3, 0, 392, 0];
    const self = this;
    const scheduleStep = (s, t) => {
      const ac = self.ctx; if (!ac) return;
      if (bassSeq[s]) {
        const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = bassSeq[s];
        const g = ac.createGain(); g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + stepDur * 2);
        const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 200;
        o.connect(f); f.connect(g); g.connect(self.bgmGain); o.start(t); o.stop(t + stepDur * 2);
      }
      if (padSeq[s]) {
        const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = padSeq[s];
        const g = ac.createGain(); g.gain.setValueAtTime(0.03, t); g.gain.exponentialRampToValueAtTime(0.001, t + stepDur * 4);
        o.connect(g); g.connect(self.bgmGain); o.start(t); o.stop(t + stepDur * 4);
      }
      if (leadSeq[s] && Math.random() < 0.7) {
        const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = leadSeq[s];
        const g = ac.createGain(); g.gain.setValueAtTime(0.02, t); g.gain.exponentialRampToValueAtTime(0.001, t + stepDur * 1.5);
        o.connect(g); g.connect(self.bgmGain); o.start(t); o.stop(t + stepDur * 1.5);
      }
    };
    const feed = () => {
      const ac = self.ctx; if (!ac) return;
      const now = ac.currentTime;
      if (self.isMuted) { nextTime = Math.max(nextTime, now + 0.05); return; }
      if (nextTime < now) nextTime = now + 0.05;   // 卡顿后重新对齐，不补发堆积的音符
      while (nextTime < now + 0.2) { scheduleStep(step % 16, nextTime); nextTime += stepDur; step++; }
    };
    feed();
    this.bgmTimer = setInterval(feed, 40);
  },
  stopBGM() { if (this.bgmTimer) { clearInterval(this.bgmTimer); this.bgmTimer = null; } this.isBgmPlaying = false; }
};

/* stats 增加三条历史序列，供数据卡的迷你趋势图使用。
   只保留最近 8 局 —— 趋势图不是统计报表，够看"最近走势"就行，
   而且存档体积必须小（localStorage 有 5MB 上限且是同步写入）。 */
const HIST_LEN = 8;
let stats = { gamesPlayed: 0, totalKills: 0, maxWave: 0, histScore: [], histWave: [], histKills: [] };
try {
  const raw = localStorage.getItem('pixelraider_stats');
  if (raw) {
    const s = JSON.parse(raw);
    stats.gamesPlayed = parseInt(s.gamesPlayed, 10) || 0;
    stats.totalKills = parseInt(s.totalKills, 10) || 0;
    stats.maxWave = parseInt(s.maxWave, 10) || 0;
    // 历史序列：只接受数字数组，防止旧存档/脏数据导致绘制崩溃
    const arr = (v) => (Array.isArray(v) ? v.filter(n => typeof n === 'number' && isFinite(n)) : []);
    stats.histScore = arr(s.histScore).slice(-HIST_LEN);
    stats.histWave = arr(s.histWave).slice(-HIST_LEN);
    stats.histKills = arr(s.histKills).slice(-HIST_LEN);
  }
} catch (e) {}

// 追加一局战绩到历史序列（各处统一调用，避免忘记裁剪）
function pushHistory(score, wave, kills) {
  const add = (a, v) => { a.push(v); if (a.length > HIST_LEN) a.shift(); };
  add(stats.histScore, score);
  add(stats.histWave, wave);
  add(stats.histKills, kills);
}

/* UI 音效：30ms 方波极短"滴"，用于所有界面切换与按钮反馈。
   与游戏音效分开 —— 战斗音效已经在放，UI 音必须更短更轻才不会糊在一起。 */
Audio.ui = function (freq) {
  if (!this.ctx || this.isMuted) return;
  try {
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(freq || 900, t);
    g.gain.setValueAtTime(0.05 * (this.volume === undefined ? 0.6 : this.volume), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    o.connect(g); g.connect(this.playerGain || this.sfxGain || this.masterGain);

   主菜单垮掉式入场
   ==================================================================
   原来的"飞船从下方飞入"被换掉了：那是**游戏内**的进场，玩家看到的是
   "飞船来了"，而不是"菜单走了" —— 画面上菜单是瞬间消失的，切换依然生硬。

   现在让**菜单自己垮掉**：把主菜单按水平方向切成若干条带，从上往下依次
   坠落 + 旋转 + 压扁，掉出屏幕后露出下面已经在跑的游戏画面。
   这样"离开菜单"和"进入游戏"是同一个动作的两面，转场才有因果。

   两个关键实现细节：
   ① **不用 globalAlpha 淡出** —— drawMenu 内部多处直接给 ctx.globalAlpha 赋值
      （标题呼吸、图标脉冲等），外层设的 alpha 会被它覆盖掉。
      改为靠"掉出屏幕"自然消失，也更像真的塌下来。
   ② **clip 必须设在变换之后** —— 先 translate/rotate/scale 再 clip，
      clip 矩形才会跟着带一起掉落。设在变换之前的话 clip 固定在屏幕空间，
      带内容下移时会从自己的窗口里"滑出去"，看着像错位而不是塌方。 */
const FALL_DUR = 0.72;          // 总时长：够看清垮的过程，又不至于拖慢开局
const FALL_BAND_DELAY = 0.07;   // 相邻带的启动间隔：错峰才有"依次塌"的层次
let menuFall = 1;               // 1 = 已完成（非菜单进入时不播）

function menuFallBands() {
  // 带数随画质：每条带都要整份重绘一次菜单，低配少切几刀
  if (quality >= 0.7) return 6;
  if (quality >= 0.5) return 4;
  return 3;
}

function drawMenuCollapse() {
  if (menuFall >= 1) return;
  const bands = menuFallBands();
  const bandH = H / bands;
  const span = 1 - (bands - 1) * FALL_BAND_DELAY;   // 每条带自己的动画时长占比

  for (let i = 0; i < bands; i++) {
    const p = Math.min(1, Math.max(0, (menuFall - i * FALL_BAND_DELAY) / span));
    if (p <= 0) {                                   // 还没轮到这条带：原样画
      ctx.save();
      ctx.beginPath(); ctx.rect(0, i * bandH, W, bandH); ctx.clip();
      drawMenu();
      ctx.restore();
      continue;
    }
    const dir = i % 2 === 0 ? 1 : -1;               // 相邻带朝相反方向倾斜：塌得乱而不齐
    const fall = p * p * (H * 1.25);                // 二次加速 = 重力感
    const rot = p * 0.07 * dir;
    const sy = 1 - p * 0.14;                        // 轻微压扁：塌下来的东西会被压
    const dx = p * 4 * dir;

    ctx.save();
    ctx.translate(W / 2 + dx, i * bandH + fall);
    ctx.rotate(rot);
    ctx.scale(1, sy);
    ctx.translate(-W / 2, -i * bandH);
    // clip 在变换之后：窗口跟着带一起走
    ctx.beginPath(); ctx.rect(0, i * bandH, W, bandH); ctx.clip();
    drawMenu();
    ctx.restore();
  }

  /* 灰尘：带砸下去时从底部扬起一层薄雾。
     只画一次、只画最底部，避免每带都加导致开销翻倍。 */
  const dp = Math.min(1, Math.max(0, menuFall));
  if (dp < 0.85) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = (1 - dp / 0.85) * 0.16;
    const g = ctx.createLinearGradient(0, H - 70, 0, H);
    g.addColorStop(0, hexA(TH(), 0));
    g.addColorStop(1, hexA(TH(), 0.6));
    ctx.fillStyle = g; ctx.fillRect(0, H - 70, W, 70);
    ctx.restore();
  }
}

    doClose: () => { animSet('ach', 0, T_PAGE); achClosing = true; }
  },
  name: {
    animKey: null,            // DOM 输入框，无进出场动画
    isOpen: () => nameInputOpen,
    doOpen: () => openNameInput(),
    doClose: () => closeNameInput()
  }
};

// 栈中当前打开的弹窗 id，按打开顺序排列
const uiStack = [];
function uiOpen(id) {
  const m = UI_MODALS[id]; if (!m) return false;
  if (uiStack.indexOf(id) < 0) uiStack.push(id);
  m.doOpen();
  if (m.animKey) animSet(m.animKey, 1, T_PAGE);
  return true;
}
function uiTop() {
  // 从栈顶往回找第一个仍然打开的（关闭中的不算，避免关到一半又被当成顶层）
  for (let i = uiStack.length - 1; i >= 0; i--) {
    const id = uiStack[i], m = UI_MODALS[id];
    if (m && m.isOpen()) return id;
    uiStack.splice(i, 1);
  }
  return null;
}
function uiCloseTop() {
  const id = uiTop(); if (!id) return false;
  const m = UI_MODALS[id];
  m.doClose();
  uiStack.splice(uiStack.indexOf(id), 1);
  return true;
}
function uiCloseAll() {
  /* 同步彻底关闭：uiCloseAll 用于重置/返回主菜单，必须立刻生效，
     不能等出场动画播完（否则下一帧仍会画出旧弹窗）。
     动画进度也一并 instant 到 0，避免残留半透明状态。 */
  uiStack.length = 0;
  for (const k in UI_MODALS) {
    const m = UI_MODALS[k];
    if (m.isOpen()) {
      m.doClose();
      // doClose 走的是"播完动画再 inactive"，这里直接补上最终态
      if (k === 'codex') codexPage.active = false;
      if (k === 'settings') { settingsPageActive = false; resetConfirm = false; }
      if (k === 'ach') achPageActive = false;
    }
    if (m.animKey) animInstant(m.animKey);
  }
  codexClosing = settingsClosing = achClosing = false;
}

/* 出场动画播完 → 真正 inactive。
   抽成独立函数是因为它在两处都要调：正常 update()，以及**暂停时**的
   UI 专用推进（暂停会跳过 update，漏了这里弹窗就永远关不掉）。
   取消关闭由"重新打开"时显式置 false（见 uiOpen），
   这里只认 v<=0 —— 之前用 `v > 0` 判断会把刚启动的关闭立刻取消。 */
function uiSyncClose() {
  if (codexClosing && animV('codex') <= 0) { codexClosing = false; codexPage.active = false; }
  if (settingsClosing && animV('settings') <= 0) { settingsClosing = false; settingsPageActive = false; resetConfirm = false; }
  if (achClosing && animV('ach') <= 0) { achClosing = false; achPageActive = false; }
}

// 引导提示队列：同时最多显示一条，避免叠在一起

let tutTimer = 0;

/* 触发一条引导。id 为空表示不记录（可重复）；否则同 id 只触发一次。 */
function showTutorial(id, text, sub, dur) {
  if (id) {
    if (tutDone[id]) return false;
    tutDone[id] = 1; saveTut();
  }
  tutQueue.push({ text: text, sub: sub || '', t: 0, total: dur || 3.2 });
  return true;
}
function tutUpdate(dt) {
  if (tutCur) {
    tutCur.t += dt;
    if (tutCur.t >= tutCur.total) tutCur = null;

function drawTutorial() {
  if (!tutCur) return;
  const k = Math.max(0, Math.min(1, tutCur.t / 0.25));          // 入场
  const out = Math.max(0, Math.min(1, (tutCur.total - tutCur.t) / 0.35)); // 出场
  const a = Math.min(k, out);
  const y = H * 0.72;

  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(0, (1 - k) * 8);      // 轻微上浮入场
  panel(x, y, w, h, 7, { bg: 'rgba(8, 18, 32, 0.92)', border: '#3ad1ff', bw: 1.2 });

  ctx.restore();

}

  const PX = 16, PW = W - 32;
  const botPad = 10;                  // 出口行到底部的留白
  const PANEL_MIN = 92;               // 战术面板最小高度（8 格战况数据的安身之处）
  let mh = 26, MH = 32, gp = 12, eh = 26;

  /* 从底部往上排：出口行（重开/返回）→ 次要行（成就/设置）→ 主按钮（继续作战）。
     出口行放最底部：它是"离开"的语义，离主操作越远越不容易误触。
     抽成函数是因为压缩循环要反复重排 —— 四个尺寸变量每次都在变，
     手写成一串赋值就得在循环里再抄一遍，抄漏一处就是命中区和绘制错位。 */
  function placePauseButtons() {
    const halfW = (PW - gp) / 2;
    const exitY = H - botPad - eh;
    const minorY = exitY - gp - mh;
    const resumeY = minorY - gp - MH;

    PAUSE_BUTTONS.restart.x = PX;                   PAUSE_BUTTONS.restart.y = exitY;
    PAUSE_BUTTONS.restart.w = halfW;                PAUSE_BUTTONS.restart.h = eh;
    PAUSE_BUTTONS.home.x = PX + halfW + gp;         PAUSE_BUTTONS.home.y = exitY;
    PAUSE_BUTTONS.home.w = halfW;                   PAUSE_BUTTONS.home.h = eh;

    PAUSE_BUTTONS.ach.x = PX;                       PAUSE_BUTTONS.ach.y = minorY;
    PAUSE_BUTTONS.ach.w = halfW;                    PAUSE_BUTTONS.ach.h = mh;
    PAUSE_BUTTONS.settings.x = PX + halfW + gp;     PAUSE_BUTTONS.settings.y = minorY;
    PAUSE_BUTTONS.settings.w = halfW;               PAUSE_BUTTONS.settings.h = mh;

    const mw = PW * 0.76;
    PAUSE_BUTTONS.resume.x = PX + (PW - mw) / 2;
    PAUSE_BUTTONS.resume.y = resumeY;
    PAUSE_BUTTONS.resume.w = mw;                    PAUSE_BUTTONS.resume.h = MH;
    return resumeY;
  }

  /* 空间不足时逐级让：先收间距 → 再压次要行/出口行高度 → 最后才压主按钮。
     收敛条件必须覆盖**所有**可变项，否则某一项触底后其余继续减会变成死循环。 */
  while (placePauseButtons() - 12 - 52 < PANEL_MIN &&
         (gp > 6 || mh > 20 || eh > 20 || MH > 24)) {
    if (gp > 6) gp -= 1;
    else if (mh > 20) mh -= 1;
    else if (eh > 20) eh -= 1;
    else MH = Math.max(24, MH - 1);
  }
  placePauseButtons();

  // 可用垂直区间：标题区分隔线下方 → 版权行上方
  // 可用垂直区间：标题区分隔线下方 → 版权行上方
  const L = MENU_LAYOUT;
  const topY = 116, botY = H - 30;
  const avail = botY - topY;
  // 指挥官显示已并入左上角胶囊（标题区，不参与纵向流），这里不再计入 cardH
  const rawH = L.startH + statsBlockH() + L.funcH + L.footH;

  // 先扣掉上下留白，剩下的才分给间隙 —— 留白优先，不被间隙挤占
  const inner = avail - L.padTop - L.padBot;
  // 3 个间隙（原为 4 个，指挥官卡移出后少了一处）
  let gap = Math.max(L.gapMin, Math.min(L.gapMax, (inner - rawH) / 3));
  // 矮屏（如横屏 800x400 → 逻辑高仅 320）连最小留白都保不住时，
  // 先收留白再收间隙，最后才等比压缩内容
  let scale = 1, padTop = L.padTop, padBot = L.padBot;
  if (rawH + gap * 3 > inner) {
    const over = rawH + gap * 3 - inner;
    const padCut = Math.min(over, (padTop + padBot) * 0.6);
    padTop -= padCut / 2; padBot -= padCut / 2;
    gap = L.gapMin;
    if (rawH + gap * 3 > avail - padTop - padBot) {
      padTop = padBot = 0;
      // 上限钳到 1：空间富余时只增大留白，不放大元素（否则矮屏反而被撑出屏）
      scale = Math.min(1, Math.max(0.6, (avail - gap * 3) / rawH));
    }
  }
  L.gap = gap; L.scale = scale;
  const sH = L.startH * scale;   // 指挥官卡已并入左上角胶囊，不再有 cH
  const stH = L.statH * scale, stG = L.statGap * scale;
  const fH = L.funcH * scale;
  L._stH = stH; L._stG = stG;

  let y = topY + padTop + Math.max(0, (inner - (rawH * scale + gap * 3)) / 2);

  MENU_START_BTN.x = 40; MENU_START_BTN.w = W - 80; MENU_START_BTN.h = sH;
  MENU_START_BTN.y = y;                       y += sH + gap;

  MENU_STATS_AREA.x = 22; MENU_STATS_AREA.w = W - 44;
  MENU_STATS_AREA.y = y;
  MENU_STATS_AREA.h = stH;                    y += stH + gap;   // 横排只占一行

  MENU_VOL_CTRL.x = 22; MENU_VOL_CTRL.w = W - 44; MENU_VOL_CTRL.h = 22;
  MENU_VOL_CTRL.y = H - 40;   // 音量仍保留，但只在设置页显示

  // 标题区左右两枚胶囊：用户（左）/ 设置（右）。
  // 同宽同高同 y，中间让给居中的"像素突击"副标题（x 101~139）
  MENU_COMMANDER_BTN.w = MENU_CAP_W; MENU_COMMANDER_BTN.h = MENU_CAP_H;
  MENU_COMMANDER_BTN.x = 22;
  MENU_COMMANDER_BTN.y = 88;

  MENU_SETTINGS_BTN.w = MENU_CAP_W; MENU_SETTINGS_BTN.h = MENU_CAP_H;
  MENU_SETTINGS_BTN.x = W - 22 - MENU_CAP_W;
  MENU_SETTINGS_BTN.y = 88;

  // 功能按钮：合并成一个全宽入口（原来两格，间距不够会黏在一起）
  MENU_FUNC_BTN[0].x = 22; MENU_FUNC_BTN[0].y = y;
  MENU_FUNC_BTN[0].w = W - 44; MENU_FUNC_BTN[0].h = fH;
  MENU_FUNC_BTN[1].w = 0; MENU_FUNC_BTN[1].h = 0;    // 废弃，防误命中
  MENU_FUNC_BTN[2].w = 0; MENU_FUNC_BTN[2].h = 0;
  y += fH + gap;
  L.footY = y;   // 页脚（成就行）位置

  // 图鉴页两个 tab（横排，位于标题下方）
  const tw = (W - 44 - 8) / 2;
  for (let i = 0; i < 2; i++) {
    CODEX_TAB_BTN[i].x = 22 + i * (tw + 8);
    CODEX_TAB_BTN[i].y = 44;
    CODEX_TAB_BTN[i].w = tw;
    CODEX_TAB_BTN[i].h = 24;
  }

  // 设置页控件
  SET_BTN.mute.x = 22; SET_BTN.mute.w = W - 44; SET_BTN.mute.y = 112; SET_BTN.mute.h = 24;
  /* 设置页分区高度自适应。
     横屏 800x400 → 逻辑高仅 320，四个分区自然高度加起来 300+ 会顶穿返回按钮。
     所以先算自然高度，再按可用空间等比压缩（下限 0.6），
     和主菜单的压缩思路一致：空间不够就压内容，而不是牺牲留白或溢出屏幕。 */
  SET_BTN.back.w = 110; SET_BTN.back.h = 26;
  SET_BTN.back.x = (W - 110) / 2; SET_BTN.back.y = H - 36;
  setLayoutSettings();
}

/* 设置页分区排布：左栏「本机数据」+ 右栏「控件行 + 主题色」。
   原来是音效/画面/主题/数据四区平铺——四个分区等长一栏下来，是"设置列表"
   不是"设置页"；且"数据"是只读统计，和"开关/滑块"混在同一列很别扭。
   现在：
     · 左栏只占顶段：4 张累计统计卡（只读），和主菜单战绩卡同源
     · 右栏续接：静音 / 音量 / FPS 三个统一控件行 + 主题六色
     · 危险操作（清除存档）单独成行，远离其他控件
   横屏（逻辑高仅 320）时整体等比压缩，下限 0.6。 */
let SET_ZONES = [];
/* 右栏三个控件行的 y 与行高单独存放，不塞进 SET_ZONES：
   绘制端拿到的是由 SET_ZONES 重建的 key→zone 映射（drawSettingsPage 里现搭的），
   挂在 z 上的自定义字段会被这一层映射丢掉，绘制只能退回兜底值 ——
   兜底一旦生效，布局就算白算了。独立对象才能原样传到绘制端。 */
let SET_RIGHT = { rows: [], rowH: 0 };
function setLayoutSettings() {
  const C = SET_CTRL;
  const top = 52;
  const bot = SET_BTN.back.y - 10;

  /* ===== 右栏（控件行 + 主题色 + 清除存档）=====
     之前右栏是"自然高度随便长"：色块高度写死 24、主题区高写死 30，
     长出来的部分不管不问。实测结果是两处越界，且**所有分辨率都越界**：
       · 主题色块第二行底部超出主题面板约 46px（色块掉到面板外面）
       · H<=384 时「清除存档」行压住「返回」按钮，H=320 甚至超出屏幕 17px

     现在改为：先算右栏自然总高，再按可用空间整体等比压缩（下限 0.6）——
     与主菜单一致的思路：空间不够就压"内容本身"，而不是让它溢出。
     压缩因子 scale 同时作用于行高、间距、色块高，三者同步缩小，不会互相错位。 */
  const RESET_H = 26;
  // 主题区自然高度 = 标题栏 20 + 两行色块 24×2 + 行距 4 + 底部留白 6。
  // 原代码这里写 30，而内容需要 72 —— 面板天生比内容小一半，色块必然溢出。
  const THEME_NAT = 20 + 24 * 2 + 4 + 6;
  const NATURAL = C.ROW_H * 4 + 4 * 4 + 12 + 16 + THEME_NAT + 10 + RESET_H;

  /* 左栏占比自适应：极矮屏（H=320）右栏连 0.6 压缩都放不下时，
     让"本机数据"区让出纵向空间，而不是让右栏溢出或压住返回按钮。
     从 42% 逐步下调到 22% 为止。 */
  let statShare = 0.42, y1 = top, colTop = top, scale = 1;
  for (;;) {
    y1 = top + Math.round((bot - top) * statShare);
    colTop = y1 + 8;
    scale = Math.min(1, (bot - colTop) / NATURAL);
    if (scale >= 0.62 || statShare <= 0.22) break;
    statShare -= 0.04;
  }
  scale = Math.max(0.6, Math.min(1, scale));

  const statH = y1 - top;
  const z = { stat: { key: 'stat', y: top, h: statH } };

  const rowH = Math.round(C.ROW_H * scale);
  const rowGap = Math.round(4 * scale);
  const themePad = Math.round(16 * scale);        // 行区与主题区之间的间隔
  const resetH = Math.round(RESET_H * scale);
  const dataGap = Math.round(10 * scale);

  /* 四个控件行：静音 / 音量 / FPS / 画质。行 y 记进 z.rows，绘制端直接取用，
     不再自己另算一遍累加（排布只应有一个真相来源）。
     画质是最后一行，所以"下方多留一行"的间距跟在第 4 行之后。 */
  const rows = [];
  let y = colTop;
  for (let i = 0; i < 4; i++) {
    rows.push(y);
    y += rowH + rowGap;
    if (i === 3) y += Math.round(12 * scale);     // 末行下方多留一行，与主题区间隔
  }
  z.rows = rows;
  z.rowH = rowH;
  SET_RIGHT.rows = rows;
  SET_RIGHT.rowH = rowH;

  /* 清除存档行钉在返回按钮上方 —— 两个危险出口绝不能叠在一起，
     叠了就是"误触清档"的直通车。它是硬约束，不参与压缩计算。 */
  const resetY = SET_BTN.back.y - resetH - 6;
  const themeTop = y + themePad;
  /* 页脚（版权行）也占预算：它钉在清除行上方，主题区必须让出这段高度，
     否则主题面板底会压到页脚文字上。 */
  const FOOTER_H = 14;
  const themeBottom = resetY - dataGap - FOOTER_H;

  /* 主题区高度由**剩余空间反推**，而不是写死一个值再让内容去挤。
     色块高度是最后一步的因变量：先定面板能有多大，再决定色块多大，
     这样"色块掉出面板"在数学上就不可能发生。 */
  const headerPad = Math.round(20 * scale);
  const swGap = Math.round(4 * scale);
  const themeBotPad = Math.round(6 * scale);
  let swH = Math.round(24 * scale);
  let themeH = headerPad + swH * 2 + swGap + themeBotPad;
  if (themeTop + themeH > themeBottom) {
    const inner = themeBottom - themeTop - headerPad - swGap - themeBotPad;
    swH = Math.max(10, Math.floor(inner / 2));
    themeH = headerPad + swH * 2 + swGap + themeBotPad;
  }
  // 压缩到下限仍放不下（极端比例）：面板上提，但绝不越过右栏起点
  const themeY = Math.min(themeTop, Math.max(colTop, themeBottom - themeH));
  z.theme = { key: 'theme', y: themeY, h: themeH };
  z.data = { key: 'data', y: resetY, h: resetH };
  SET_ZONES = [z.stat, z.theme, z.data];

  /* 画质分段按钮：四个（自动 / 低 / 中 / 高）横排在末行右侧。
     位置在布局里算好并写回 SET_BTN.qseg —— 与主题色块同一套做法：
     绘制端和命中端读同一个矩形，绝不各算一遍。 */
  {
    const qy = rows[3];
    const n = QUALITY_MODES.length;
    const segH = Math.max(11, Math.min(16, rowH - 10));
    const segGap = 3;
    // 右端与开关行对齐：末行右侧留 14，宽度按可用空间均分
    const right = 22 + (W - 44) - 8;
    const left = 22 + C.LABEL.pad + 30;           // 标签「画质」之后起排
    const totalW = right - left;
    const segW = Math.max(18, Math.floor((totalW - segGap * (n - 1)) / n));
    const segY = qy + (rowH - segH) / 2;
    for (let i = 0; i < n; i++) {
      SET_BTN.qseg[i].x = left + i * (segW + segGap);
      SET_BTN.qseg[i].y = segY;
      SET_BTN.qseg[i].w = segW;
      SET_BTN.qseg[i].h = segH;
    }
  }

  // 主题色块：两行三列，位置由面板高度反推得出
  const sw = Math.round(((W - 44) - 2 * 6) / 3);
  const swatchTop = themeY + headerPad;
  for (let i = 0; i < 6; i++) {
    const col = i % 3, row = (i / 3) | 0;
    SET_BTN.theme[i].x = 22 + col * (sw + 6);
    SET_BTN.theme[i].y = swatchTop + row * (swH + swGap);
    SET_BTN.theme[i].w = sw; SET_BTN.theme[i].h = swH;
  }
  SET_BTN.reset.x = 22; SET_BTN.reset.w = W - 44; SET_BTN.reset.h = resetH;
  SET_BTN.reset.y = resetY;

  /* 三个控件行的命中矩形必须跟着真实行位置走。
     之前 mute.y 写死 112、fps.y 从未赋值（恒为 0）——
     行是画在 rows[] 上的，命中区却在另一个坐标：
       · FPS 开关的命中区落在 y 0~24（屏幕最顶上），点设置页顶部会误触它
       · 静音行的命中区固定在 112，而实际行在 y1+8，两者根本不重合
     这就是"设置页点了没反应 / 点错地方"的来源。
     现在统一由布局写入：画在哪，就点哪。 */
  SET_BTN.mute.y = rows[0]; SET_BTN.mute.h = rowH;
  SET_BTN.vol.y = rows[1];  SET_BTN.vol.h = rowH;
  SET_BTN.fps.y = rows[2];  SET_BTN.fps.h = rowH;
  SET_BTN.mute.x = 22; SET_BTN.mute.w = W - 44;
  SET_BTN.vol.x = 22;  SET_BTN.vol.w = W - 44;
  SET_BTN.fps.x = 22;  SET_BTN.fps.w = W - 44;
}

/* 主菜单点击分发（抽成函数，避免逻辑埋在事件回调里难以复用与验证）。
   子页面优先：各自控件先处理，点空白则返回主菜单。
   返回 'drag' 表示命中音量滑块，需要后续 pointermove 继续拖动。 */
/* 设置页点击处理（主菜单与暂停态共用）。
   抽成独立函数是因为设置页有**两个入口**：主菜单右上角胶囊、暂停面板的「设置」按钮。
   原先只有 handleMenuTap 里写了这套逻辑，暂停态的 handleButtonPress 直接一句
   "设置页打开就 uiCloseTop()" —— 结果暂停中打开设置页后，
   **任何点击都只是把页面关掉**，静音开关/音量条/FPS/主题色块/清除存档全部点不动。

   返回值语义（调用方据此决定后续动作）：
     'drag' → 命中音量滑块，需要后续 pointermove 继续拖动
     true   → 命中了某个控件，本次点击已消费
     false  → 未命中任何控件（视为点空白，由调用方决定是否关闭页面） */
function handleSettingsTap(x, y, fromPause) {
  if (hitSetVolumeArea(x, y)) { setVolDragging = true; setVolumeFromPointer(x); return 'drag'; }
  if (hitTest(SET_BTN.mute, x, y)) { Audio.toggleMute(); Audio.ui(700); return true; }
  if (hitTest(SET_BTN.fps, x, y)) { toggleFps(); return true; }
  // 画质：点某一档直接切换；点行内空白不做任何事（避免误触改档）
  if (hitTest({ x: 22, y: SET_BTN.qseg[0].y - 6, w: W - 44, h: SET_BTN.qseg[0].h + 12 }, x, y)) {
    for (let i = 0; i < SET_BTN.qseg.length; i++) {
      if (hitTest(SET_BTN.qseg[i], x, y)) { setQualityMode(i); Audio.ui(820 + i * 70); return true; }
    }
    return true;   // 命中行但没命中分段：消费掉，别穿透关页面
  }
  // 主题色块：即时生效，不用确认按钮。色块自身就是预览
  for (let i = 0; i < SET_BTN.theme.length; i++) {
    if (hitTest(SET_BTN.theme[i], x, y)) { if (setTheme(i)) Audio.ui(900 + i * 90); return true; }
  }
  if (hitTest(SET_BTN.reset, x, y)) {
    // 二次确认：清除存档不可撤销，防误触
    if (resetConfirm) { clearAllData(); resetConfirm = false; Audio.ui(300); }
    else { resetConfirm = true; Audio.ui(500); }
    return true;
  }
  // 点空白：只关设置页，绝不穿透到下层（暂停态下尤其危险 —— 不能顺手把游戏继续了）
  uiCloseTop();
  if (fromPause) Audio.play(600, 0.07, 'square', 0.03, 900);
  else Audio.ui(600);
  return true;
}

function handleMenuTap(x, y) {
  // 图鉴页：先判 tab，其余位置一律返回主菜单（与设置页一致的交互）
  if (codexPage.active) {
  // 武器选择条：点格子切换选中武器（切 tab 之外的新交互）
  if (codexPage.active && codexPage.tab === 1) {
    for (let i = 0; i < CODEX_WEAPON_TABS.length; i++) {
      const tb = CODEX_WEAPON_TABS[i];
      if (tb && hitTest(tb, x, y)) {
        if (codexPage.weaponSel !== i) { codexPage.weaponSel = i; Audio.ui(1000); }
        return true;
      }
    }
  }
    if (hitTest(CODEX_TAB_BTN[0], x, y)) { codexPage.tab = 0; Audio.ui(800); return true; }
    if (hitTest(CODEX_TAB_BTN[1], x, y)) { codexPage.tab = 1; Audio.ui(800); return true; }
    // 点空白关闭：交给栈顶处理（栈决定关谁，不用在这里写死）
    uiCloseTop(); Audio.ui(600); return true;
  }
  if (settingsPageActive) return handleSettingsTap(x, y, false);
  if (hitTest(MENU_SETTINGS_BTN, x, y)) { uiOpen('settings'); Audio.ui(1000); return true; }
  if (hitTest(MENU_COMMANDER_BTN, x, y)) { Audio.ui(900); uiOpen('name'); return true; }
  if (hitTest(MENU_FUNC_BTN[0], x, y)) { uiOpen('codex'); Audio.ui(1000); return true; }
  startGame();
  return true;
}

function hitTest(btn, x, y) { return x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h; }
/* 设置页音量控件行的可拖动区：右端 78px 宽的轨道。
   与旧版独立滑块不同——音量现在嵌在控件行里（和静音开关同一行高），
   拖动区只是该行右侧的条带，点一下就跳到对应比例，拖着走可连续调节。 */
function hitSetVolumeArea(x, y) {
  const tx = W - 22 - 86;
  if (x < tx - 6 || x > tx + 72 || Audio.isMuted) return false;
  /* 命中区直接读 SET_BTN.vol —— 它的 y/h 由 setLayoutSettings 同步成真实行位置。
     原来这里用"mute.y + h + 4"现算下一行，而 mute.y 本身是写死的 112，
     算出来的位置和实际绘制的音量行差了一截，拖动条根本点不中。 */
  const v = SET_BTN.vol;
  if (y >= v.y - 2 && y <= v.y + v.h + 2) { setVolRowY = v.y; return true; }
  return false;
}
let setVolRowY = 0;
let setVolDragging = false;
function setVolumeFromPointer(px) {
  const tx = W - 22 - 86;
  const ratio = Math.max(0, Math.min(1, (px - (tx - 6)) / 62));
  Audio.setVolume(ratio);
}

function updateVolumeFromX(x) {
  const trackX = 46, trackW = W - 92;
  const ratio = Math.max(0, Math.min(1, (x - trackX) / trackW));
  Audio.setVolume(ratio);
}

let weaponGlow = 0;   // 武器切换流光计时
function selectWeapon(i) {
  if (i < 0 || i >= WEAPON_COUNT) return;
  // 放在越界检查之后：无效索引不该计入战况统计
  if (i !== player.weapon) { runSwitches++; weaponGlow = 0.5; Audio.ui(1050); }
  player.weapon = i;
  if (!weaponUsed[i]) { weaponUsed[i] = true; checkAllWeapons(); }
}

function handleButtonPress(x, y) {
  /* 主菜单垮掉期间吞掉所有点击：此时菜单还在往下掉，
     但状态已经是 MODE_PLAY —— 不挡的话玩家点一下就会命中下面的暂停按钮或道具栏，
     在"菜单还没走完"的时候触发游戏内操作，观感很割裂。 */
  if (menuFall < 1) return true;
  if (paused && state.mode === MODE_PLAY) {
    // 暂停时点击右上角暂停按钮同样可以恢复
    if (hitTest(BUTTONS.pause, x, y)) { resumeGame(); return true; }
    /* 设置页打开时：走与主菜单**同一套**控件处理，不能一律当"点空白关页面"。
       原来这里无条件 uiCloseTop()，导致暂停中打开设置页后所有控件都点不动
       （静音/音量/FPS/主题色块/清除存档全部失效，只有关闭页面这一个效果）。
       'drag' 需向上传递，让 pointermove 能继续拖动音量滑块。 */
    if (settingsPageActive) return handleSettingsTap(x, y, true);
    // 成就页打开时：任意点击都返回主暂停面板
    if (achPageActive) {
      uiCloseTop(); Audio.play(600, 0.07, 'square', 0.03, 900);
      return true;
    }
    if (hitTest(PAUSE_BUTTONS.resume, x, y)) { resumeGame(); return true; }
    if (hitTest(PAUSE_BUTTONS.ach, x, y)) {
      uiOpen('ach'); Audio.play(700, 0.08, 'square', 0.03, 1100);
      return true;
    }
    if (hitTest(PAUSE_BUTTONS.settings, x, y)) {
      uiOpen('settings'); Audio.play(700, 0.08, 'square', 0.03, 1000);
      return true;
    }
    /* 出口一级化：重开 / 返回主菜单都在面板上直接生效，不再走二次确认弹窗。
       返回主菜单原先藏在「结束本局 ›」文字链 → 弹窗的二级路径里，
       玩家在暂停面板上根本看不到入口 —— 这才是"返回缺失"的真正原因。 */
    if (hitTest(PAUSE_BUTTONS.restart, x, y)) {
      Audio.play(500, 0.1, 'square', 0.03, 400);
      paused = false; startGame();
      return true;
    }
    if (hitTest(PAUSE_BUTTONS.home, x, y)) {
      Audio.play(400, 0.1, 'square', 0.03, 300);
      uiCloseAll(); returnToMenu();
      return true;
    }
    return true;
  }
  // 道具栏优先于暂停按钮之外的所有判定：它占的是可玩区，点它不该顺带移动飞机
  if (state.mode === MODE_PLAY && !paused) {
    for (let i = 0; i < ITEM_N; i++) {
      if (hitTest(itemRect(i), x, y)) { useItem(i); return true; }
    }
  }
  if (hitTest(BUTTONS.pause, x, y)) {
    if (state.mode === MODE_PLAY) {
      paused = !paused; Audio.play(500, 0.06, 'square', 0.02, 700);
      if (paused) Audio.stopBGM(); else Audio.startBGM();
    }
    return true;
  }
  if (paused) return false;
  if (state.mode !== MODE_PLAY) return false;
  if (upgradePanel.active) return false;
  for (let i = 0; i < WEAPON_COUNT; i++) {
    if (hitTest(BUTTONS.weapon[i], x, y)) { selectWeapon(i); Audio.play(600, 0.04, 'square', 0.02, 800); return true; }
  }
  return false;
}

const UP_PANEL = { x: 20, w: W - 40, y0: 110, h: 48, gap: 8 };
// 跳过按钮：三张卡下方。位置由卡数推导（卡池可能不足 3 张）
const UP_SKIP_BTN = { x: 20, w: W - 40, y: 0, h: 26 };

/* 升级面板布局：卡片高度与起始 y 按屏幕高度自适应。
   原写死 y0=110 / h=48 / gap=8，在横屏（H=320）下**必然重叠**：
     第三张卡占 222~270，而「剩余 N 秒」画在 H-60=260 —— 压在卡片上；
     跳过按钮 282~308，「点击卡片购买」画在 H-42=278 —— 又压一次。
   现在改为按可用区间反推：先算能分多少高度，再决定卡片多高、从哪开始。

   两个副作用是**有意为之**：
     · 卡片高度不够 58 时不显示 tip（矮屏优先保证名字/数字/价格可读）
     · 高屏上卡片区垂直居中，不再全堆在顶部留一大片空 */
let upShowTip = true;
function upLayout() {
  const n = Math.max(1, upgradePanel.options.length || 3);
  const top = HUD_H + 52;                 // 标题 + 金币行之下
  /* 底部提示画在 H-30，文字高约 7px —— 再留 10px 间隙，
     否则跳过按钮底会正好贴在提示文字顶上（H=320 时两者都是 290，紧贴无呼吸）。 */
  const botLimit = H - 30 - 10;
  let gap = 8; const skipH = 26, skipGap = 4;   // gap 会在矮屏被压缩，不能是 const
  const avail = botLimit - skipH - skipGap - top;
  /* 每张卡高度：带 tip 需 58+，纯数字下限 46（再矮图标和两行文字就打架了）。
     上限 62 —— 再高只会让卡片之间空得像分隔线，不增加信息。 */
  let h = Math.floor((avail - gap * (n - 1)) / n);
  h = Math.max(46, Math.min(62, h));
  /* 矮屏三级收缩：卡高触底后先收**间距**，仍放不下才允许降到硬下限 42。
     只有第一级（压卡高）时 H=320 会溢出约 10px，跳过按钮底正好贴到底部提示。
     顺序不能反：先压卡高会让三张卡都变得难读，而间距从 8 收到 4 视觉代价小得多。 */
  let blockH = n * h + gap * (n - 1);
  while (blockH > avail && gap > 4) { gap -= 1; blockH = n * h + gap * (n - 1); }
  if (blockH > avail) {
    h = Math.max(42, Math.floor((avail - gap * (n - 1)) / n));
    blockH = n * h + gap * (n - 1);
  }
  upShowTip = h >= 58;
  UP_PANEL.h = h;
  UP_PANEL.gap = gap;
  UP_PANEL.y0 = Math.round(top + Math.max(0, (avail - blockH) / 2));
}
function upSkipY() {
  const n = upgradePanel.options.length;
  /* 原式 n*(h+gap) 比卡片区实际底部多算了一个 gap（最后一张卡后面没有间隙），
     把跳过按钮白白往下推 8px —— 矮屏上这点余量正好被提示文字吃掉。 */
  return UP_PANEL.y0 + n * UP_PANEL.h + (n - 1) * UP_PANEL.gap + 4;
}
/* 道具槽矩形。绘制与命中判定共用同一份 ——
   HUD 那次"命中区写死、绘制算出来"导致全屏点不动的教训不能再犯。 */
function itemRect(i) {
  const top = HUD_H + 6, bot = H - WB_H - 6;
  const y0 = Math.round((top + bot) / 2 - ITEM_TOTAL / 2);
  return { x: ITEM_X, y: y0 + i * (ITEM_S + ITEM_GAP), w: ITEM_S, h: ITEM_S };
}

// 拾取道具入栏。返回是否收下（满则丢弃并提示，不让掉落白费）
function addItem(k) {
  const idx = ITEM_SLOTS.findIndex(t => t.k === k);
  if (idx < 0) return false;
  if (itemCounts[idx] >= ITEM_MAX) {
    pushToast(ITEM_SLOTS[idx].name + '已满', '上限 ' + ITEM_MAX, ITEM_SLOTS[idx].color);
    return false;
  }
  itemCounts[idx]++;
  return true;
}

function useItem(i) {
  if (i < 0 || i >= ITEM_SLOTS.length) return;
  if (state.mode !== MODE_PLAY || paused || upgradePanel.active || !player.alive) return;
  if (itemCounts[i] <= 0) { Audio.play(180, 0.08, 'square', 0.02, 120); return; }
  const it = ITEM_SLOTS[i];
  itemCounts[i]--;
  Audio.ui(760);
  switch (it.k) {
    case 'bomb': bombBlast(); break;
    case 'slow':
      slowT = SLOW_TIME;
      flashScreen = Math.max(flashScreen, 0.2); flashColor = '#7be9ff';
      pushToast('时间缓速', SLOW_TIME + ' 秒', '#7be9ff');
      break;
    case 'repair': {
      const before = state.hp;
      state.hp = Math.min(state.maxHp, state.hp + REPAIR_HEAL);
      pushToast('应急维修', '+' + Math.round(state.hp - before) + ' 生命', '#4ade80');
      explode(player.x, player.y, '#4ade80', 10, 70);
      break;
    }
    case 'collect': {
      /* 逐个 applyPowerup 而不是直接给分：掉落的可能是道具也可能是增益，
         走同一条结算路径才不会漏掉"满栏折算""成就触发"这些副作用。 */
      const n = powerups.length;
      const list = powerups.slice();
      powerups.length = 0;
      for (const p of list) { applyPowerup(p.type, p.x, p.y); explode(p.x, p.y, '#ff7be9', 5, 50); }
      pushToast('磁力吸引', n > 0 ? '吸取 ' + n + ' 个' : '场上无掉落', '#ff7be9');
      break;
    }
    case 'barrier': {
      const before = player.shield;
      player.shield = Math.min(SHIELD_MAX, player.shield + SHIELD_ITEM_AMT);
      pushToast('护盾发生器', '+' + Math.round(player.shield - before) + ' 点', '#7be9ff');
      explode(player.x, player.y, '#7be9ff', 10, 70);
      break;
    }
  }
}

function handleUpgradeTap(x, y) {
  for (let i = 0; i < upgradePanel.options.length; i++) {
    const oy = UP_PANEL.y0 + i * (UP_PANEL.h + UP_PANEL.gap);
    if (x >= UP_PANEL.x && x <= UP_PANEL.x + UP_PANEL.w && y >= oy && y <= oy + UP_PANEL.h) { buyUpgrade(i); return; }
  }
  // 跳过按钮优先于"点空白关闭"：明确的入口不该被空白点击抢走
  const sk = UP_SKIP_BTN; sk.y = upSkipY();
  if (x >= sk.x && x <= sk.x + sk.w && y >= sk.y && y <= sk.y + sk.h) { closeUpgradePanel(); return; }
  closeUpgradePanel();
}

/* ==================================================================
   星空 & 敌人
   ================================================================== */
/* ==================================================================
   太空背景：星区配色 / 气辉 / 星云 / 5 层视差星场 / 天体锚点
   原则：全部生成式绘制 + 离屏缓存，运行时只做位移，不进热路径重算
   ================================================================== */

// 星区主题：随波次推进，色相缓慢漂移，让"旅程在前进"被感觉到
const STAR_ZONES = [
  { name:'猎户边境', top:'#070b1a', bot:'#0b1228', neb:['#2a4d8f', '#3a7bd5', '#1c3f7a'], nebA:0.15 },
  { name:'玫瑰星云', top:'#0d0818', bot:'#1a0a26', neb:['#8b2f6f', '#5a1f5e', '#c04a8a'], nebA:0.19 },
  { name:'麒麟暗域', top:'#04120f', bot:'#071a18', neb:['#1f6f5c', '#2a8f70', '#12463f'], nebA:0.15 },
  { name:'赤色深空', top:'#12060c', bot:'#1e0810', neb:['#8f2436', '#c03a2f', '#5c1a26'], nebA:0.20 }
];
function zoneIndexForWave(wave) { return Math.min(STAR_ZONES.length - 1, Math.max(0, Math.floor((wave - 1) / 5))); }

// 确定性随机：星云/行星必须每次生成同一结果，方便缓存与复用
function makeRnd(seed) {
  let s = (seed >>> 0) || 1;
  return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

// 星云：多个径向渐变团块叠加成不规则云团（比噪声实现更快，且不依赖 ImageData）
function makeNebula(size, seed, colors) {
  const rnd = makeRnd(seed);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 34; i++) {
    const cx = rnd() * size, cy = rnd() * size;
    const r = size * (0.10 + rnd() * 0.26);
    const col = colors[Math.floor(rnd() * colors.length)];
    const grad = g.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, hexA(col, 0.5));
    grad.addColorStop(1, hexA(col, 0));
    g.fillStyle = grad;
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  }
  return c;
}
// 行星：统一光照（光来自左上 45°），右下自动变暗，建立可信光源逻辑
function makePlanet(r, colors) {
  const c = document.createElement('canvas'); c.width = c.height = r * 2;
  const g = c.getContext('2d');
  const lx = r * 0.62, ly = r * 0.62;
  const grad = g.createRadialGradient(lx, ly, r * 0.08, r, r, r);
  grad.addColorStop(0, colors[1]);
  grad.addColorStop(0.5, colors[0]);
  grad.addColorStop(1, '#05070f');
  g.fillStyle = grad; g.beginPath(); g.arc(r, r, r - 1, 0, Math.PI * 2); g.fill();
  g.globalCompositeOperation = 'lighter';
  g.strokeStyle = hexA(colors[2], 0.5); g.lineWidth = 1.5;   // 大气散射 rim light
  g.beginPath(); g.arc(r, r, r - 1.5, 0, Math.PI * 2); g.stroke();
  g.globalAlpha = 0.25; g.fillStyle = colors[2];
  g.beginPath(); g.arc(r, r, r - 1, -Math.PI * 0.9, -Math.PI * 0.1); g.fill();  // 晨昏线高光
  return c;
}

let NEBULA_CACHE = [];      // 每星区一张预渲染星云
let PLANET_CACHE = [];      // 行星离屏图缓存
const PLANET_COLORS = [
  ['#3a5f8f', '#8ab4d8', '#3ad1ff'],
  ['#6f4a8a', '#c9a7e8', '#e879f9'],
  ['#8f5a3a', '#e8b48a', '#ff9f43'],
  ['#3a7f6a', '#8ae8c9', '#4ade80']
];

// 5 层视差：速度比 1 : 0.6 : 0.35 : 0.18 : 0.08
// 原版三层"同向同速、只有大小不同"等于没做视差，速度感完全缺失
const STAR_LAYERS = [
  { px: 0.08, v: 6,  s: 1, c: '#3f5872', n: 22 },  // 最远：银河背景辐射，几乎不动
  { px: 0.18, v: 13, s: 1, c: '#5b7fa3', n: 20 },
  { px: 0.35, v: 27, s: 1, c: '#8ab4d8', n: 18 },
  { px: 0.60, v: 47, s: 1, c: '#cfe6ff', n: 14 },
  { px: 1.00, v: 78, s: 2, c: '#ffffff', n: 8  }   // 最近
];

const stars = [];
let bgT = 0;
/* 动态环境元素：流星与尘埃带。
   这两个是"稀有但高辨识度"的元素 —— 出现频率必须低，
   否则会干扰弹幕可读性；但完全没有的话太空就少了生气。 */
let meteors = [];
let meteorTimer = 6 + Math.random() * 8;
let dustBand = null;      // 斜向尘埃带，缓慢扫过
let dustTimer = 20 + Math.random() * 20;

function spawnMeteor() {
  // 从上方/侧上方进入，斜向高速掠过，带拖尾
  const fromLeft = Math.random() < 0.5;
  const speed = 180 + Math.random() * 140;
  const ang = (fromLeft ? 0.35 : -0.35) + (Math.random() - 0.5) * 0.2;
  meteors.push({
    x: fromLeft ? -10 : W + 10,
    y: Math.random() * H * 0.55,
    vx: Math.cos(ang) * speed * (fromLeft ? 1 : -1),
    vy: Math.sin(ang) * speed + 60,
    len: 14 + Math.random() * 22,
    life: 0,
    c: Math.random() < 0.3 ? '#ffd166' : (Math.random() < 0.5 ? '#7be9ff' : '#eafcff')
  });
}
function spawnDustBand() {
  dustBand = {
    y: H * (0.15 + Math.random() * 0.6),
    h: 18 + Math.random() * 26,
    tilt: (Math.random() - 0.5) * 0.35,
    life: 0,
    dur: 14 + Math.random() * 10,
    c: Math.random() < 0.5 ? '#3ad1ff' : '#b06bff'
  };
}
function updateEnvironment(dt) {
  // 低端档位关闭流星，保证弱机帧率
  meteorTimer -= dt;
  if (meteorTimer <= 0 && quality >= 0.7) {
    spawnMeteor();
    meteorTimer = (state.mode === MODE_PLAY ? 5 : 3) + Math.random() * 8;
  }
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.x += m.vx * dt; m.y += m.vy * dt; m.life += dt;
    if (m.x < -60 || m.x > W + 60 || m.y > H + 40) { i === meteors.length - 1 ? meteors.pop() : meteors.splice(i, 1); }
  }
  if (dustBand) {
    dustBand.life += dt;
    dustBand.y -= dt * 6;                       // 缓慢上移，制造穿越感
    if (dustBand.life > dustBand.dur) { dustBand = null; dustTimer = 18 + Math.random() * 22; }
  } else {
    dustTimer -= dt;
    if (dustTimer <= 0 && quality >= 0.7) spawnDustBand();
  }
}
let planet = null;          // 当前天体锚点
let auraSprite = null;      // 气辉噪声纹理

function makeAura(size, seed) {
  const rnd = makeRnd(seed);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 14; i++) {
    const cx = rnd() * size, cy = rnd() * size, r = size * (0.2 + rnd() * 0.35);
    const col = rnd() < 0.5 ? '#1b3a5c' : '#2a2050';
    const grad = g.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, hexA(col, 0.35)); grad.addColorStop(1, hexA(col, 0));
    g.fillStyle = grad; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  }
  return c;
}

function initStars() {
  stars.length = 0;
  const nScale = 0.55 + quality * 0.45;   // 低端设备减少星数
  for (const L of STAR_LAYERS) {
    const n = Math.max(4, Math.round(L.n * nScale));
    for (let i = 0; i < n; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H, s: L.s, c: L.c, v: L.v * (0.85 + Math.random() * 0.3), px: L.px });
    }
  }
  stars.sort((a, b) => (a.c < b.c ? -1 : a.c > b.c ? 1 : 0)); // 同色相邻，绘制时少切换 fillStyle
}

function initBackground() {
  NEBULA_CACHE = STAR_ZONES.map((z, i) => makeNebula(160, 1000 + i * 137, z.neb));
  PLANET_CACHE = PLANET_COLORS.map((c, i) => makePlanet(48, c));
  auraSprite = makeAura(160, 77);
}
initBackground();
initStars();

function spawnPlanet(wave) {
  const idx = (wave + Math.floor(Math.random() * 3)) % PLANET_CACHE.length;
  const sprite = PLANET_CACHE[idx];
  const r = sprite.width / 2;
  planet = {
    sprite, r,
    x: (Math.random() < 0.5 ? -1 : 1) * 30 + W / 2 + (Math.random() - 0.5) * W * 0.5,
    y: HUD_H + 30 + Math.random() * (H * 0.35),
    vx: (Math.random() < 0.5 ? -1 : 1) * (5 + Math.random() * 7),
    depth: 0.22
  };
}

function drawBackground() {
  const zone = STAR_ZONES[zoneIndexForWave(state.wave)];

  // --- 第 1 层：深空气辉（替换纯黑底，色相随星区漂移）---
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, zone.top);
  grad.addColorStop(1, zone.bot);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  if (auraSprite) {
    const as = W * 1.6;
    const ox = -(bgT * 3) % as, oy = -(bgT * 2) % as;
    ctx.globalAlpha = 0.5;
    ctx.drawImage(auraSprite, ox, oy, as, as);
    ctx.drawImage(auraSprite, ox + as, oy, as, as);
    ctx.globalAlpha = 1;
  }

  // --- 第 2 层：星云（lighter 叠加，双图不同速横向滚动）---
  const neb = NEBULA_CACHE[zoneIndexForWave(state.wave)];
  if (neb) {
    const nw = W * 1.4;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = zone.nebA * quality;
    const ox1 = -(bgT * 4) % nw;
    ctx.drawImage(neb, ox1, -H * 0.1, nw, H * 1.2);
    ctx.drawImage(neb, ox1 + nw, -H * 0.1, nw, H * 1.2);
    ctx.restore();
  }

  // --- 第 4 层：天体锚点（行星），放在星场之前，确立景深 ---
  if (planet) {
    const px = planet.x + (player.x - W / 2) * -planet.depth * 0.4;
    const py = planet.y + bgT * 1.5;
    ctx.globalAlpha = 0.85;
    ctx.drawImage(planet.sprite, Math.round(px - planet.r), Math.round(py - planet.r));
    ctx.globalAlpha = 1;
  }

  // --- 第 3 层：5 层视差星场 ---
  // 速度感来源：纵向恒定下落 + 横向随玩家移动产生视差偏移
  const parX = (player.x - W / 2);
  const stretch = ultActive > 0;   // 超载时星星拉成线，经典超光速视觉语言
  let lastC = '';
  for (const s of stars) {
    if (s.c !== lastC) { ctx.fillStyle = s.c; lastC = s.c; }
    const x = s.x - parX * s.px * 0.35;
    const xi = ((x % W) + W) % W;
    if (stretch) ctx.fillRect(xi | 0, s.y | 0, s.s, s.s * 4);
    else ctx.fillRect(xi | 0, s.y | 0, s.s, s.s);
  }

  // --- 第 5 层：尘埃带（极淡的斜向光带，只在穿过时可见）---
  if (dustBand) {
    const d = dustBand;
    const fade = Math.min(1, Math.min(d.life, d.dur - d.life) / 2.5);   // 两端淡入淡出
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.13 * fade * quality;
    const g = ctx.createLinearGradient(0, d.y - d.h / 2, 0, d.y + d.h / 2);
    g.addColorStop(0, hexA(d.c, 0)); g.addColorStop(0.5, d.c); g.addColorStop(1, hexA(d.c, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, d.y - d.h / 2 + W * d.tilt);
    ctx.lineTo(W, d.y - d.h / 2);
    ctx.lineTo(W, d.y + d.h / 2);
    ctx.lineTo(0, d.y + d.h / 2 + W * d.tilt);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // --- 第 6 层：流星（高速掠过 + 拖尾，稀有出现）---
  if (meteors.length) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const m of meteors) {
      const nx = m.vx, ny = m.vy;
      const nl = Math.hypot(nx, ny) || 1;
      const tx = (nx / nl) * m.len, ty = (ny / nl) * m.len;
      const g = ctx.createLinearGradient(m.x, m.y, m.x - tx, m.y - ty);
      g.addColorStop(0, m.c); g.addColorStop(1, hexA(m.c, 0));
      ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - tx, m.y - ty); ctx.stroke();
      ctx.fillStyle = m.c; ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.arc(m.x, m.y, 1.1, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
}

const ENEMY_DEFS = [
  { sprite: SPR.e0, white: SPR.e0w, w: 7, h: 6, hp: 1, vy: 30, score: 10, color: '#ff4d6d' },
  { sprite: SPR.e1, white: SPR.e1w, w: 8, h: 6, hp: 2, vy: 24, score: 20, color: '#b06bff' },
  { sprite: SPR.e2, white: SPR.e2w, w: 9, h: 8, hp: 3, vy: 17, score: 40, color: '#ff9f43' },
  { sprite: SPR.e3, white: SPR.e3w, w: 8, h: 7, hp: 2, vy: 62, score: 30, color: '#4ade80' },
  { sprite: SPR.e4, white: SPR.e4w, w: 10, h: 8, hp: 4, vy: 15, score: 55, color: '#e879f9' },
  { sprite: SPR.e5, white: SPR.e5w, w: 8, h: 8, hp: 2, vy: 44, score: 25, color: '#ff3355', suicidal: true }
];

function spawnEnemy(type) {
  const d = ENEMY_DEFS[type];
  const x = 16 + Math.random() * (W - 32);
  enemies.push({
    id: enemyIdCounter++, type, x, bx: x, y: -12, w: d.w, h: d.h,
    hp: d.hp + (type >= 2 ? Math.floor(state.wave / 2.5) : 0), maxhp: d.hp,
    vy: d.vy + state.wave * 2.0 + Math.random() * 8,
    score: d.score, color: d.color,
    sprite: d.sprite, white: d.white, t: 0, ph: Math.random() * Math.PI * 2,
    flash: 0, fire: 1.0 + Math.random() * 1.5
  });
}

// 难度曲线：基础小怪权重随波次衰减，高级怪逐步接管，
// 避免打到十几波还是满屏 1 血小怪、难度曲线走平
function pickEnemyType(wave) {
  const w = [0, 0, 0, 0, 0, 0];
  w[0] = Math.max(10, 46 - wave * 3.5);
  if (wave >= 2) w[1] = 18 + Math.min(16, wave * 1.2);
  if (wave >= 2) w[2] = 14 + Math.min(22, wave * 1.6);
  if (wave >= 3) w[3] = 12 + Math.min(16, wave * 1.1);
  if (wave >= 4) w[4] = 10 + Math.min(24, wave * 1.8);
  if (wave >= 3) w[5] = 10 + Math.min(14, wave * 0.9);
  let total = 0;
  for (let i = 0; i < 6; i++) total += w[i];
  let x = Math.random() * total;
  for (let i = 0; i < 6; i++) if ((x -= w[i]) < 0) return i;
  return 0;
}

function randomPowerupType() {
  const r = Math.random();
  let t;
  /* 概率分配（合计 100%）：即时增益 65% / 入栏道具 35%。
     五个道具槽各 7% —— 均分而不是给某几个更高权重，
     因为它们的价值都取决于"什么时候用"，没有谁天然更值得掉。
     ⚠️ 新增道具必须同时改这里 + applyPowerup 的 switch + ITEM_SLOTS，
     三处缺一就会掉出来却捡不到（collect/barrier 就漏过一次）。 */
  if (r < 0.15) t = 'power'; else if (r < 0.27) t = 'heal'; else if (r < 0.38) t = 'shield';
  else if (r < 0.45) t = 'bomb'; else if (r < 0.52) t = 'slow'; else if (r < 0.59) t = 'repair';
  else if (r < 0.66) t = 'collect'; else if (r < 0.73) t = 'barrier';
  else if (r < 0.83) t = 'spread'; else if (r < 0.91) t = 'magnet'; else t = 'drone';
  // 满血时不让血包浪费（溢出只转 3 秒盾，收益太低），改为掉落即时战力道具
  if (t === 'heal' && state.hp >= state.maxHp) t = Math.random() < 0.5 ? 'shield' : 'spread';
  if (t === 'drone' && drones.length >= MAX_DRONES) t = 'power';
  return t;
}

/* ==================================================================
   波次 & Boss
   ================================================================== */
function startWave(n) {
  state.wave = n; waveClock = 0; waveQueue = []; state.waveDelay = 2.2;
  if (n % 5 === 0) { state.waveDelay = 3.6; spawnBoss(n); waveTotal = 0; return; }
  const count = 5 + n * 3;
  waveTotal = count;
  const gap = Math.max(0.14, 0.55 - n * 0.032);
  for (let i = 0; i < count; i++) waveQueue.push({ t: i * gap, type: pickEnemyType(n) });
  if (n % 5 === 0) planet = null;
  if (n >= 2 && !planet && Math.random() < 0.55) spawnPlanet(n);
  banner.text = '第 ' + n + ' 波'; banner.sub = n === 1 ? '准备迎战' : (STAR_ZONES[zoneIndexForWave(n)].name); banner.t = 1.8; banner.color = '#3ad1ff';
  // 第 3 波起 20% 概率触发随机事件（放在波次开始，让玩家提前知道这波的变数）
  if (n >= 3 && Math.random() < 0.20) triggerEvent();
  if (n === 10) checkAchievement('wave_10');
  Audio.play(520, 0.09, 'square', 0.03, 780);
  setTimeout(() => Audio.play(700, 0.12, 'square', 0.03, 980), 110);
}

function spawnBoss(wave) {
  const typeIndex = Math.floor((wave - 1) / 5) % BOSS_TYPES.length;
  const type = BOSS_TYPES[typeIndex];
  const spr = BOSS_SPRITES[typeIndex];
  const hp = Math.round((180 + wave * 42) * type.hpMul);
  boss = {
    typeIndex, x: W / 2, y: -40, w: type.w, h: type.h, hp, maxhp: hp, vx: 0, vy: 0, t: 0,
    entering: true, targetY: HUD_H + 30, flash: 0, attackTimer: 1.6, atkMul: type.atkMul,
    sprite: spr.sprite, white: spr.white, color: type.color, accent: type.accent, name: type.name
  };
  banner.text = '首领'; banner.sub = type.name; banner.color = type.color; banner.t = 2.4;
  Audio.play(120, 0.6, 'sawtooth', 0.06, 60);
  setTimeout(() => Audio.play(80, 0.8, 'square', 0.05, 40), 200);
}

function bossAttack(b) {
  const hpRatio = b.hp / b.maxhp;
  const extra = hpRatio < 0.4 ? 1 : 0;
  const pat = Math.floor(Math.random() * 3);
  if (pat === 0) {
    const n = Math.round((4 + extra) * b.atkMul);
    const spread = 0.9;
    for (let i = 0; i < n; i++) {
      const a = Math.PI / 2 + (i - (n - 1) / 2) * (spread / n);
      ebullets.push({ x: b.x, y: b.y + b.h / 2, vx: Math.cos(a) * 130, vy: Math.sin(a) * 130, boss: true, color: b.accent });
    }
    Audio.play(180, 0.12, 'square', 0.025, 100);
  } else if (pat === 1) {
    if (player.alive) {
      const dx = player.x - b.x, dy = player.y - (b.y + b.h / 2);
      const base = Math.atan2(dy, dx);
      const n = Math.round((3 + extra) * b.atkMul);
      for (let i = 0; i < n; i++) {
        const a = base + (i - (n - 1) / 2) * 0.2;
        ebullets.push({ x: b.x, y: b.y + b.h / 2, vx: Math.cos(a) * 190, vy: Math.sin(a) * 190, boss: true, color: b.accent });
      }
      Audio.play(250, 0.08, 'square', 0.02, 160);
    }
  } else {
    const n = Math.round((6 + extra * 2) * b.atkMul);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + b.t * 2.2;
      ebullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * 105, vy: Math.sin(a) * 105, boss: true, color: b.accent });
    }
    Audio.play(300, 0.1, 'triangle', 0.02, 150);
  }
}

function updateBoss(rawDt) {
  const dt = enemyDt(rawDt);   // Boss 与敌弹同步减速
  if (!boss) return; const b = boss; b.t += dt; if (b.flash > 0) b.flash -= dt;
  const MIN_X = 26, MAX_X = W - 26, MIN_Y = HUD_H + 20, MAX_Y = H - WB_H - 14;
  if (b.entering) {
    b.y += 58 * dt;
    if (b.y >= b.targetY) {
      b.y = b.targetY; b.entering = false;
      b.vx = (Math.random() < 0.5 ? -1 : 1) * (42 + Math.random() * 24);
      b.vy = (Math.random() < 0.5 ? -1 : 1) * (26 + Math.random() * 20);
    }
    return;
  }
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  if (b.x < MIN_X) { b.x = MIN_X; b.vx = Math.abs(b.vx); }
  if (b.x > MAX_X) { b.x = MAX_X; b.vx = -Math.abs(b.vx); }
  if (b.y < MIN_Y) { b.y = MIN_Y; b.vy = Math.abs(b.vy); }
  if (b.y > MAX_Y) { b.y = MAX_Y; b.vy = -Math.abs(b.vy); }
  if (Math.random() < dt * 0.5) {
    b.vx += (Math.random() - 0.5) * 60;
    b.vy += (Math.random() - 0.5) * 50;
    if (Math.abs(b.vx) < 30) b.vx = Math.sign(b.vx || 1) * 30;
    if (Math.abs(b.vx) > 90) b.vx = Math.sign(b.vx) * 90;
    if (Math.abs(b.vy) < 18) b.vy = Math.sign(b.vy || 1) * 18;
    if (Math.abs(b.vy) > 60) b.vy = Math.sign(b.vy) * 60;
  }
  if (!b.entering && particles.length < particleCap() && Math.random() < dt * 2.5) {
    particles.push({
      x: b.x + (Math.random() - 0.5) * b.w,
      y: b.y + (Math.random() - 0.5) * b.h,
      vx: (Math.random() - 0.5) * 16,
      vy: (Math.random() - 0.5) * 16,
      life: 0.3 + Math.random() * 0.2, max: 0.5,
      color: b.accent, size: 2, glow: true
    });
  }
  b.attackTimer -= dt;
  if (b.attackTimer <= 0) {
    addShockwave(b.x, b.y, b.accent, 6, 70);
    bossAttack(b);
    const base = Math.max(0.6, 1.3 - state.wave * 0.03);
    b.attackTimer = base / b.atkMul;
  }
}

/* 内爆：从四周向中心塌缩的粒子，表现"能量被抽走"。
   首领死亡要先向内塌陷 0.2s 再爆开 —— 直接炸开是"碎了"，
   先塌陷再炸开才是"被抽干后崩解"，仪式感完全不同。 */
function addImplosion(x, y, color, count = 14) {
  const cap = particleCap();
  for (let i = 0; i < count && particles.length < cap; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 34 + Math.random() * 30;      // 从远处出发
    const sp = 90 + Math.random() * 60;     // 朝中心飞（速度反向）
    particles.push({
      x: x + Math.cos(a) * r, y: y + Math.sin(a) * r,
      px: x + Math.cos(a) * r, py: y + Math.sin(a) * r,
      vx: -Math.cos(a) * sp, vy: -Math.sin(a) * sp,
      life: 0.2, max: 0.2, color, size: 1, glow: true
    });
  }
  addShockwave(x, y, color, 20, 30);        // 一道快速内收的细环
}

function killBoss() {
  if (!boss) return; const bx = boss.x, by = boss.y, bColor = boss.color, bAccent = boss.accent; boss = null;
  /* 首领死亡仪式：塌陷 0.2s → 爆开。
     时间缓动让这一下"被看见"：0.3s 内全局 0.4 倍速，配合塌陷与爆开。 */
  addImplosion(bx, by, bColor, 16);
  addImplosion(bx, by, '#ffffff', 6);
  slowmo = 0.3;
  for (let i = 0; i < 7; i++) {
    scheduleAfter((i * 85 + 200) / 1000, () => {
      if (state.mode !== MODE_PLAY) return;
      const ox = bx + (Math.random() - 0.5) * 34, oy = by + (Math.random() - 0.5) * 26;
      explode(ox, oy, '#ff9f43', 18, 145); explode(ox, oy, '#ffffff', 8, 90);
      state.shake = Math.max(state.shake, 8);
    });      // +200ms：等塌陷演完再开始爆
  }
  const bonus = 300 + state.wave * 50;
  state.score += bonus;
  state.coins += 35 + state.wave * 3;
  state.shake = 6;    // 塌陷阶段只轻微震动，主爆的强震延后到 +200ms
  for (const b of ebullets) explode(b.x, b.y, bAccent, 3, 40);
  ebullets.length = 0;
  const drops = ['power', 'medkitBig', 'heal', 'drone'];
  if (drones.length >= MAX_DRONES) drops[3] = 'spread';
  for (let i = 0; i < 4; i++) powerups.push({ x: bx + (i - 1.5) * 22, y: by, vy: 58, t: 0, type: drops[i] });
  banner.text = '首领击破'; banner.sub = '+' + bonus; banner.color = '#ffd166'; banner.t = 2.4;
  checkAchievement('boss_1');
  Audio.play(90, 0.9, 'sawtooth', 0.07, 30);
  scheduleAfter(0.15, () => Audio.play(140, 0.5, 'square', 0.05, 40));
  scheduleAfter(0.32, () => Audio.play(200, 0.4, 'triangle', 0.04, 60));
  /* 主爆延后到 +200ms：塌陷演完才炸开。
     之前主爆是**立即**执行的，和塌陷同帧发生 —— 于是"先塌陷再爆开"
     这个仪式根本没演出来，玩家只看到一团东西同时出现。 */
  scheduleAfter(0.2, () => {
    if (state.mode !== MODE_PLAY) return;
    explode(bx, by, bColor, 22, 130);
    addNova(bx, by, bColor, 9, 44);
    addChroma(0.5);
    state.shake = Math.max(state.shake, 16);
    flashScreen = 0.45; flashColor = '#ffd166';
  });
}

/* ==================================================================
   成就 / 爆炸 / 飘字
   ================================================================== */
function checkAchievement(id) {
  if (achievements[id]) return;
  achievements[id] = true; localStorage.setItem('pixelraider_ach', JSON.stringify(achievements));
  const ach = ACHIEVEMENTS.find(a => a.id === id);
  if (ach) { achPopup.text = ach.name; achPopup.t = 2.5; Audio.play(800, 0.15, 'triangle', 0.04, 1400); }
}
// 倒序遍历时使用：把末位元素搬到 i 再 pop，O(1) 删除，避免 splice 的整体搬移
function swapRemove(arr, i) {
  const last = arr.length - 1;
  if (i !== last) arr[i] = arr[last];
  arr.pop();
}
/* 爆炸分三档，越大的爆炸层次越多：
     小 (<8)   仅粒子
     中 (8-15) 粒子 + 闪核 + 单环 + 少量碎片
     大 (>=16) 粒子 + 闪核 + 双环(副环延迟) + 余烬 + 更多碎片
   这样小击杀不会满屏特效糊视线，Boss 死亡才给足仪式感。 */
function explode(x, y, color, count = 12, speed = 90) {
  const big = count >= 16, mid = count >= 8;

  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, sp = speed * (0.25 + Math.random());
    particles.push({
      x, y, px: x, py: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.28 + Math.random() * 0.45, max: 0.73,
      color: Math.random() < 0.35 ? '#ffffff' : color, size: Math.random() < 0.28 ? 2 : 1,
      glow: true
    });
  }

  if (mid) {
    addFlash(x, y, color, big ? 12 : 7);
    addShockwave(x, y, color, count, speed);
    if (big) {
      // 副环：延迟出发、更快更细，形成"双层冲击"的层次
      addShockwave(x, y, '#ffffff', count * 0.6, speed * 1.35, 0.06);
      addEmbers(x, y, color, Math.min(8, Math.round(count * 0.35)));
      // 新星光条 + 整屏色差：大爆炸的"重击感"来源
      addNova(x, y, color, 9, 26 + Math.min(30, count * 0.9));
      addChroma(0.35 + Math.min(0.3, count * 0.012));
    }
  }
  const pCap = particleCap();
  if (particles.length > pCap) particles.splice(0, particles.length - pCap);

  // 逐个检查 + 收尾裁剪：批量生成时只在开头判一次会撑破上限
  const dCap = debrisCap();
  const debrisCount = Math.min(count, big ? 12 : 8);
  for (let i = 0; i < debrisCount && debris.length < dCap; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = speed * (0.3 + Math.random() * 0.8);
    debris.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.5 + Math.random() * 0.5, max: 1.0,
      color: Math.random() < 0.3 ? '#ffffff' : color,
      size: 2 + Math.random() * 3,
      rot: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 10
    });
  }
  if (debris.length > dCap) debris.splice(0, debris.length - dCap);
}
/* 闪核：爆炸瞬间的高亮核心。
   没有它的话爆炸只是"一堆往外飞的点"，缺少"炸开的那一下"的重量感。 */
function addFlash(x, y, color, size) {
  if (flashes.length >= flashCap()) return;
  flashes.push({ x, y, color, r: size || 8, life: 0.12, max: 0.12 });
}
/* 新星放射光条：从爆点向外射出的长条光束。
   冲击波是"环"、粒子是"点"、新星是"线" —— 三种形态叠加才有炸裂感，
   只有线能表达"往外炸开"的方向性。仅大爆炸触发，避免糊屏。 */
function addNova(x, y, color, rays = 8, len = 40) {
  /* 同屏限额：nova 是最抢眼的一层，15 波敌机密集时全铺开会糊住视线。
     限额放在这里（而不是调用方）是因为它是 nova 自身的属性 ——
     任何调用点都必须遵守，包括 explode() 内部的 big 分支。 */
  const lim = Math.min(2, novaCap());
  if (novas.length >= lim) return;
  const off = Math.random() * Math.PI;
  novas.push({ x, y, color, rays, len, off, life: 0.28, max: 0.28 });
}
function updateNovas(dt) {
  for (let i = novas.length - 1; i >= 0; i--) {
    const n = novas[i]; n.life -= dt;
    if (n.life <= 0) swapRemove(novas, i);
  }
}
function drawNovas() {
  if (!novas.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const n of novas) {
    const p = 1 - n.life / n.max;
    const a = Math.max(0, 1 - p);
    const grow = Math.sin(Math.min(1, p * 1.3) * Math.PI * 0.5);
    const L = n.len * grow;
    ctx.globalAlpha = a * 0.85;
    ctx.strokeStyle = n.color;
    for (let i = 0; i < n.rays; i++) {
      const ang = n.off + (Math.PI * 2 / n.rays) * i;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const l = L * (i % 2 === 0 ? 1 : 0.62);
      ctx.lineWidth = (i % 2 === 0 ? 2.2 : 1.2) * (1 - p * 0.5);
      ctx.beginPath();
      ctx.moveTo(n.x + ca * L * 0.12, n.y + sa * L * 0.12);
      ctx.lineTo(n.x + ca * l, n.y + sa * l);
      ctx.stroke();
    }
    ctx.globalAlpha = a * a;
    const gw = getGlowSprite('#ffffff', 'spark'), d = n.len * 0.5 * (1 - p * 0.6);
    ctx.drawImage(gw, n.x - d / 2, n.y - d / 2, d, d);
  }
  ctx.restore();
}

/* 击中火花：子弹命中敌人时的六芒星。
   弹幕游戏里命中反馈必须"脆"，玩家靠这个确认自己打中了。
   六芒星（3 条主轴双向）比原来两条线更像"迸溅"，且带一层微环收束。 */
function addSpark(x, y, color, scale = 1) {
  if (sparks.length >= sparkCap()) return;
  const a = Math.random() * Math.PI;
  sparks.push({ x, y, color, len: (6 + Math.random() * 5) * scale, ang: a, life: 0.12, max: 0.12 });
}
/* 余烬：爆炸后缓慢飘散的暗色碎光。
   寿命比粒子长 3 倍，让爆炸不是"啪一下就没了"，而是有余味。 */
function addEmbers(x, y, color, count = 4) {
  for (let i = 0; i < count; i++) {
    // 逐个检查：批量生成时只在函数开头判一次会撑破上限
    if (embers.length >= emberCap()) return;
    const a = Math.random() * Math.PI * 2, sp = 12 + Math.random() * 26;
    embers.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 10,
      life: 0.7 + Math.random() * 0.7, max: 1.4,
      color, size: 1 + Math.random() * 1.5,
      seed: Math.random() * 6.28
    });
  }
}
function updateFlashes(dt) {
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i]; f.life -= dt;
    if (f.life <= 0) swapRemove(flashes, i);
  }
}
function updateSparks(dt) {
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.life -= dt;
