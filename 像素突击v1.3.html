    drawText(String(i + 1), btn.x + btn.w - 5, btn.y + btn.h - 8, active ? w.color : '#2b4a66', 0.6, 'center');
  }
}

/* ==================================================================
   UI 绘制基元：磨砂面板 / 分隔线 / 扫描高光
   统一视觉语言，避免各处临时手写圆角与渐变导致风格不一致
   ================================================================== */
function panel(x, y, w, h, r, opt) {
  opt = opt || {};
  const a = opt.alpha === undefined ? 1 : opt.alpha;
  ctx.save(); ctx.globalAlpha = a;
  // 环境光晕：面板背后一层大而软的光，让卡片"浮"在背景上而不是贴上去。
  // 只在指定 halo 时画 —— 光必须稀缺，不是所有面板都有
  if (opt.halo) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a * 0.16;
    const hs = getGlowSprite(opt.halo, 'halo');
    ctx.drawImage(hs, x - w * 0.18, y - h * 0.55, w * 1.36, h * 2.1);
    ctx.restore();
  }
  fillRoundRect(x, y, w, h, r, opt.bg || 'rgba(10, 20, 34, 0.88)');
  strokeRoundRect(x + 0.5, y + 0.5, w - 1, h - 1, r, opt.border || 'rgba(90, 140, 180, 0.35)', opt.bw || 1);
  if (opt.glow) {                                  // 顶部内高光，暗色太空里更立体
    ctx.globalAlpha = a * 0.18; ctx.fillStyle = opt.glow;
    fillRoundRect(x + 2, y + 2, w - 4, Math.max(2, h * 0.28), Math.max(1, r - 2), opt.glow);
  }
  ctx.restore();
}

// 渐变分隔线：替代硬边 1px 线，两端淡出
function divider(y, color, inset) {
  inset = inset === undefined ? 26 : inset;
  const g = ctx.createLinearGradient(inset, 0, W - inset, 0);
  g.addColorStop(0, hexA(color, 0)); g.addColorStop(0.5, hexA(color, 0.7)); g.addColorStop(1, hexA(color, 0));
  ctx.fillStyle = g; ctx.fillRect(inset, y, W - inset * 2, 1);
}

/* ===== 结构件三件套 =====
   之前的界面是"一个平面"：标题、按钮、卡片全是同一亮度同一套描边，
   所以看着像系统设置页而不是游戏。缺的是"中远层"——
   结构件（面板标题栏 / 分隔线 / 边角标记）撑起密度，但全部静态不发光。

   原则：结构可以满，光必须稀缺。这三件套都不动不闪，
   只是让界面"有骨架"，把 10% 的光留给真正关键的东西。 */

/* 边角标记：四角各一个 L 形刻度线。
   赛博/机甲 UI 最便宜也最有效的语言 —— 成本就是 8 条线，
   但立刻把"一个方块"变成"一台装置"。 */
function frameCorners(x, y, w, h, len, color, alpha, lw) {
  const L = len === undefined ? 5 : len;
  const a = alpha === undefined ? 0.5 : alpha;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.strokeStyle = color;
  ctx.lineWidth = lw === undefined ? 1 : lw;
  ctx.beginPath();
  // 左上
  ctx.moveTo(x, y + L); ctx.lineTo(x, y); ctx.lineTo(x + L, y);
  // 右上
  ctx.moveTo(x + w - L, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + L);
  // 右下
  ctx.moveTo(x + w, y + h - L); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - L, y + h);
  // 左下
  ctx.moveTo(x + L, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - L);
  ctx.stroke();
  ctx.restore();
}

/* 面板标题栏：区域顶部一根横向标签带。
   不是装饰 —— 是"分组信号"，玩家一眼知道哪些信息属于一组。
   返回标题栏总高，方便调用方做纵向排布。 */
function panelHeader(x, y, w, label, color, opt) {
  opt = opt || {};
  const h = opt.h === undefined ? 11 : opt.h;
  const a = opt.alpha === undefined ? 1 : opt.alpha;
  ctx.save();
  ctx.globalAlpha = a;
  // 左侧竖条：视觉起点，比纯文字更容易"抓住"分组开头
  ctx.fillStyle = color;
  ctx.fillRect(x, y + 1, 2, h - 2);
  // 标签文字
  drawText(label, x + 6, y + (h - fontPx(0.62)) / 2, color, 0.62);
  // 右侧延伸线：从左条一路淡出到右边界，把整组"框"住
  const lw = textWidth(label, 0.62);
  const gx = x + 6 + lw + 4;
  if (gx < x + w - 2) {
    const g = ctx.createLinearGradient(gx, 0, x + w, 0);
    g.addColorStop(0, hexA(color, 0.45));
    g.addColorStop(1, hexA(color, 0));
    ctx.fillStyle = g;
    ctx.fillRect(gx, y + h / 2 - 0.5, x + w - gx, 1);
  }
  ctx.restore();
  return h;
}

/* 带端点方块的分隔线：比纯渐变线多一对端点，像仪表刻度基准。
   divider 的增强版，两者共存 —— 轻量处用 divider，分组处用这个。 */
function dividerMarked(y, color, inset, opt) {
  opt = opt || {};
  const ins = inset === undefined ? 26 : inset;
  const a = opt.alpha === undefined ? 0.7 : opt.alpha;
  const g = ctx.createLinearGradient(ins, 0, W - ins, 0);
  g.addColorStop(0, hexA(color, 0));
  g.addColorStop(0.5, hexA(color, a));
  g.addColorStop(1, hexA(color, 0));
  ctx.fillStyle = g;
  ctx.fillRect(ins, y, W - ins * 2, 1);
  if (opt.marks !== false) {
    ctx.save();
    ctx.globalAlpha = a * 0.9;
    ctx.fillStyle = color;
    ctx.fillRect(ins - 4, y - 1, 3, 3);
    ctx.fillRect(W - ins + 1, y - 1, 3, 3);
    ctx.restore();
  }
}

/* ===== 动画引擎 =====
   之前每个动画都是手写插值，散落各处，时长和曲线全凭手感 ——
   所以按钮、弹窗、HUD 的节奏互不相干，整体显得"各自为政"。
   现在统一：四档时长 + 两条曲线 + 一个进度表。

   曲线只用两条，且**不用弹性曲线**（弹簧感在 UI 里显得廉价）：
     easeOutCubic  入场用：快速到位再慢下来 → 传达"浮现"
     easeInCubic   出场用：慢启动再加速离开 → 传达"让出位置"
   实际实现里出场复用 easeOutCubic(v) 但 v 递减 ——
   easeOut 在 v 大时变化慢，递减时正好是"先慢后快"，无需第二条曲线。

   入场与出场刻意不同形：入场是"进入存在"，出场是"让出位置"，
   用同一个缩放做来回会像橡皮。 */
const T_MICRO = 0.08;    // 按钮按下
const T_QUICK = 0.16;    // HUD 滑入、tab 滑动
const T_PAGE  = 0.24;    // 弹窗、列表项
const T_NARR  = 0.80;    // 新纪录、Boss 出场（叙事类可破例）

function easeOutCubic(t) { const u = 1 - t; return 1 - u * u * u; }

/* 数字滚动：分数从旧值滚到新值，而不是直接跳变。
   这是性价比最高的一处 —— 玩家会盯着数字滚完，注意力自然被留住。
   缓出曲线让末尾慢下来，读数更"稳"；差值过大时提速，避免滚太久。 */
const ROLL_STATE = new Map();
function rollNumber(key, target) {
  let r = ROLL_STATE.get(key);
  if (!r) { r = { v: target, target: target }; ROLL_STATE.set(key, r); return target; }
  r.target = target;
  return r.v;
}
function rollUpdate(dt) {
  for (const r of ROLL_STATE.values()) {
    if (r.v === r.target) continue;
    const diff = Math.abs(r.target - r.v);
    // 速度随差值增大：小差慢慢滚好看，大差必须快否则要滚好几秒
    const speed = Math.max(40, diff * 4.5) * dt * 60 / 60;
    const dir = r.target > r.v ? 1 : -1;
    const stepv = Math.max(1, Math.abs(speed)) * dir;
    r.v = (dir > 0) ? Math.min(r.target, r.v + stepv) : Math.max(r.target, r.v + stepv);
    if (Math.abs(r.target - r.v) < 1) r.v = r.target;
  }
}
function rollInstant(key) { const r = ROLL_STATE.get(key); if (r) r.v = r.target; }

/* HUD 滑入：血条从左、能量从右、波次从右，方向不同才不会被看成一坨。
   alpha 与位移同步，160ms（T_QUICK）走完。 */
function pushHudAnim(key, dx) {
  const e = easeOutCubic(Math.max(0, Math.min(1, animV(key))));
  ctx.save();
  if (e < 1) {
    ctx.globalAlpha = e;
    ctx.translate((1 - e) * dx, 0);
  }
  return e;
}
function popHudAnim() { ctx.restore(); ctx.globalAlpha = 1; }
function easeInCubic(t) { return t * t * t; }

const ANIMS = new Map();
/* 设定目标：0=关闭 1=打开。首次注册时从"已到位"的另一端起步，
   这样打开才有动画可看（而不是瞬间就位）。 */
function animSet(key, target, dur) {
  let a = ANIMS.get(key);
  if (!a) {
    a = { v: target >= 1 ? 0 : 1, target: target, dur: dur || T_PAGE };
    ANIMS.set(key, a);
  } else {
    a.target = target;
    if (dur) a.dur = dur;
  }
}
function animUpdate(dt) {
  for (const a of ANIMS.values()) {
    const sp = dt / (a.dur || T_PAGE);
    if (a.v < a.target) a.v = Math.min(a.target, a.v + sp);
    else if (a.v > a.target) a.v = Math.max(a.target, a.v - sp);
  }
}
function animV(key) { const a = ANIMS.get(key); return a ? a.v : 1; }
function animDone(key) { const a = ANIMS.get(key); return !a || a.v === a.target; }
// 打断：立刻跳到终态。任何动画都必须支持，否则中途按 ESC 会卡在半开状态
function animInstant(key) { const a = ANIMS.get(key); if (a) a.v = a.target; }

/* 弹窗进出场变换：调用方在绘制前后包一层。
   入场 96%→100% + 上移 8px —— 是"浮现"不是"生成"：
   从中心放大会让人觉得内容是后来才有的，而实际上它一直在。 */
function pushModalAnim(key, invert) {
  const v = Math.max(0, Math.min(1, animV(key)));
  const e = invert ? easeInCubic(v) : easeOutCubic(v);
  ctx.save();
  if (e < 1) {
    ctx.translate(W / 2, H / 2);
    const s = 0.96 + 0.04 * e;
    ctx.scale(s, s);
    ctx.translate(-W / 2, -H / 2 + (1 - e) * 8);
  }
  ctx.globalAlpha = e;
  return e;
}
function popModalAnim() { ctx.restore(); ctx.globalAlpha = 1; }

// 扫描高光：一条缓慢扫过元素的亮带，用于按钮与重要卡片
function scanSweep(x, y, w, h, r, phase, color, alpha) {
  const px = ((phase % 1) + 1) % 1;
  const sx = x + px * (w + 16) - 16;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = alpha === undefined ? 0.22 : alpha;
  const g = ctx.createLinearGradient(sx, 0, sx + 16, 0);
  g.addColorStop(0, hexA(color, 0)); g.addColorStop(0.5, color); g.addColorStop(1, hexA(color, 0));
  ctx.fillStyle = g;
  fillRoundRect(Math.max(x, sx), y, Math.min(16, x + w - Math.max(x, sx)), h, r, color);
  ctx.restore();
}

// 血条：连续填充 + 分段刻度 + 受伤闪白 + 低血量脉动
// 刻度与读数保留"还能挨几下"的直觉信息，避免连续血量把掉血信号变弱
// 状态胶囊条：色点 + 名称 + 具体数值，最多显示 4 个，超出省略
function drawStatusChips() {
  const chips = [];
  /* 护盾不再进胶囊：HUD 血条下方已有护盾条显示同一数值，
     两处同时显示是同信息重复占位，还白占一个胶囊名额（上限 4 个）。 */
  /* 好/坏状态排第一：它是限时的、且直接影响这波怎么打，
     比"有僚机"这类常驻信息更需要被先看到。 */
  if (statusId && statusT > 0) {
    const st = STATUSES.find(x => x.id === statusId);
    if (st) chips.push({ c: st.color, t: (st.good ? '+' : '-') + st.name, v: Math.ceil(statusT) + 's' });
  }
  if (player.spread > 0) chips.push({ c: '#ffd166', t: '散射', v: player.spread.toFixed(1) + 's' });
  if (magnet > 0)      chips.push({ c: '#ff7be9', t: '磁力', v: magnet.toFixed(1) + 's' });
  if (drones.length)   chips.push({ c: '#4ade80', t: '僚机', v: 'x' + drones.length });

  const y = H - WB_H - 20, h = 12;
  let x = 6;
  const maxX = W - 70;                       // 给右侧武器名留位置
  for (let i = 0; i < chips.length && i < 4; i++) {
    const c = chips[i];
    const w = textWidth(c.t, 0.62) + textWidth(c.v, 0.62) + 14;
    if (x + w > maxX) break;
    fillRoundRect(x, y, w, h, 6, 'rgba(8, 18, 30, 0.85)');
    strokeRoundRect(x + 0.5, y + 0.5, w - 1, h - 1, 6, hexA(c.c, 0.45), 1);
    ctx.fillStyle = c.c;
    ctx.beginPath(); ctx.arc(x + 5, y + h / 2, 2, 0, Math.PI * 2); ctx.fill();
    drawText(c.t, x + 10, y + 2, c.c, 0.62);
    drawText(c.v, x + 10 + textWidth(c.t, 0.62) + 3, y + 2, '#eafcff', 0.62);
    x += w + 4;
  }
}

// 局内 HUD 重排版：
// 顶部单一信息条按「生命 / 波次 / 分数·金币」三区分栏，
// 每个区都有独立底座，避免原来所有文字直接压在半透明条上、弹幕密集时糊成一片
function drawHUD() {
  const hudGrad = ctx.createLinearGradient(0, 0, 0, HUD_H);
  hudGrad.addColorStop(0, 'rgba(6, 16, 28, 0.96)');
  hudGrad.addColorStop(1, 'rgba(6, 16, 28, 0.72)');
  ctx.fillStyle = hudGrad; ctx.fillRect(0, 0, W, HUD_H);
  drawEdgeLine(HUD_H - 1.5, TH(), 0.55);

  /* 五行布局，各分区在 240 逻辑宽度内互不重叠：
     行1 (y  3~15) 生命条   标签 8~30   条 30~87
     行2 (y 19~27) 护盾条   标签 8~30   条 30~87   数值 91 起
     行3 (y 28~36) 过载条   同上
     行4 (y 37~45) 剩余敌人 标签 8~30   条 30~87   数值 91 起
     行5 (y 48~62) 波次 6~76      金币 175~201   分数 205~234
                                                   暂停按钮 214~232

     ⚠️ 生命/护盾/过载/敌人四条**竖向严格对齐**（同标签位、同条位、同数值位）：
     这四条是玩家除暂停外唯一会反复扫视的读数，对齐成一列后视线是直线上下移动，
     不用横跳。（过载原先是右下角一个圆形按钮，得单独扫一眼才知道能不能放。）

     生命条不再显示 "100/100"：加了"生命"标签后横向没有余位，
     而且激战时没人有空读精确数字 —— 条长 + 颜色（绿/黄/红）已经把
     "危险程度"编码得足够清楚，精确值反而是噪音。 */

  // --- 行1：生命（复用 drawSubStatBar，与下方三条完全同构）---
  {
    const hpR = Math.max(0, Math.min(1, state.hp / state.maxHp));
    const hurt = state.hpFlash > 0;
    drawSubStatBar(3, '生命', hpR, '',
      hurt ? '#ffffff' : (hpR > 0.6 ? '#4ade80' : (hpR > 0.3 ? '#ffd166' : '#ff4d6d')),
      true, state.lowHp && !hurt, { main: true });
  }

  drawPauseButton();

  // --- 行2：护盾（剩余秒数 / 8s 满格）---
  drawSubStatBar(19, '护盾', player.shield / SHIELD_MAX,
    String(Math.ceil(Math.max(0, player.shield))),
    '#7be9ff', player.shield > 0, player.shield >= SHIELD_MAX);

  // --- 行3：过载（能量蓄能；满了可释放）---
  /* 冷却条：冷却中填充度随剩余时间递减到 0 再涨满（1 - ultCd/ULT_CD），
     数值显示剩余秒数；冷却结束显示"就绪"并转金色。
     与护盾条相反 —— 护盾是"剩余量越多越好"，冷却是"剩余时间越少越好"，
     所以填充方向必须反过来，否则玩家会把快结束的冷却看成"快没能量了"。 */
  const ultReady = ultCd <= 0;
  const ultRatio = ultCd > 0 ? 1 - ultCd / ULT_CD : 1;
  drawSubStatBar(28, '过载', ultRatio,
    ultReady ? '就绪' : Math.ceil(ultCd) + 's',
    ultReady ? '#ffd166' : '#7be9ff', true, ultReady);

  // --- 行4：剩余敌人 ---
  /* 剩余 = 还在排队的 + 已经在场的。分母是本波总数（waveTotal），
     不是硬编码值 —— 详见 waveTotal 定义处的说明。
     Boss 波没有"剩余"概念（只有一只），此时显示"首领"并把条填满，
     避免玩家看到一条空条以为出了 bug。 */
  {
    let ratio = 0, val = '—', col = '#8ab4d8', act = false;
    if (boss && !boss.entering) {
      ratio = Math.max(0, Math.min(1, boss.hp / boss.maxhp)); val = '首领'; col = '#ff4d6d'; act = true;
    } else if (waveTotal > 0) {
      const left = waveQueue.length + enemies.length;
      ratio = waveTotal > 0 ? left / waveTotal : 0;
      val = left + '/' + waveTotal;
      col = left === 0 ? '#4ade80' : '#ff9f43';
      act = left > 0;
    }
    drawSubStatBar(37, '敌人', ratio, val, col, act, false);
  }

  // --- 行5：波次（左） / 金币（中右） / 分数（右）---
  const coinStr = String(state.coins);
  /* 分数滚动：从旧值滚到新值而不是直接跳变。
     玩家会盯着数字滚完，注意力自然被留住 —— 这是性价比最高的一处动画。
     宽度按"6 位"固定计算，避免滚动过程中字宽变化导致右侧元素抖动。 */
  const scoreVal = Math.round(rollNumber('score', state.score));
  const scoreStr = String(scoreVal).padStart(6, '0');
  const scoreW = textWidth('000000', 0.95);
  const coinW = textWidth(coinStr, 0.95);

  panel(6, 48, 70, 14, 4, { bg: 'rgba(8, 18, 30, 0.72)', border: THa(0.3) });
  // 波次数值：大字号 + 锐光垫底，是"当前进度"而不是一行辅助文字
  drawNumGlow(41, 55, 34, TH(), 0.2);
  drawTextCenter2('第 ' + state.wave + ' 波', 41, 51, '#eafcff', 1.0);

  /* 卡片间渐变分隔 + 端点方块：复用结构件的视觉语言。
     行2 三块间距本来就紧（波次 6~76 / 金币 175~201 / 分数 205~234），
     硬加实线会让两块黏得更死，渐变线在两端自然消失则只是"分界感"。 */
  {
    const gy = 55;
    const g1 = ctx.createLinearGradient(78, 0, 158, 0);
    g1.addColorStop(0, THa(0)); g1.addColorStop(0.5, THa(0.22)); g1.addColorStop(1, THa(0));
    ctx.fillStyle = g1; ctx.fillRect(78, gy, 80, 1);
    ctx.fillStyle = THa(0.3); ctx.fillRect(78, gy - 1, 1.5, 3); ctx.fillRect(156.5, gy - 1, 1.5, 3);
  }

  panel(162, 48, 72, 14, 4, { bg: 'rgba(8, 18, 30, 0.72)', border: 'rgba(255, 209, 102, 0.28)' });
  drawCoinIcon(W - 8 - scoreW - 8 - coinW - 5, 55, 5);
  drawText(coinStr, W - 8 - scoreW - 8 - coinW, 51, '#ffd166', 1.0);
  // 分数是全局最重要的数字：最大号 + 锐光
  drawNumGlow(W - 9 - scoreW / 2, 55, scoreW, '#eafcff', 0.24);
  drawTextRight(scoreStr, W - 9, 51, '#ffffff', 1.05);

  if (combo >= 2 && comboTimer > 0) {
    const cScale = combo >= 20 ? 2.0 : 1.2;
    const cy = combo >= 20 ? HUD_H + 6 : HUD_H + 8;
    const alpha = Math.min(1, comboTimer / 0.6); ctx.globalAlpha = alpha;
    ctx.save(); ctx.shadowBlur = 10; ctx.shadowColor = '#ffd166';
    drawTextCenter('X' + combo, cy, '#ffd166', cScale);
    ctx.restore();
    if (combo >= 5) drawTextCenter('COMBO', cy + 18, '#ff9f43', 0.8);
    const bw = 60, bx = (W - bw) / 2;
    const byy = cy + (combo >= 5 ? 30 : 18);
    fillRoundRect(bx, byy, bw, 4, 2, '#1e3549');
    fillRoundRect(bx, byy, Math.max(2, bw * (comboTimer / COMBO_WINDOW)), 4, 2, '#ffd166');
    ctx.globalAlpha = 1;
  }

  // 引导条：在 HUD 与特效之上、弹窗之下
  drawTutorial();

  // FPS：右上角、HUD 下方。独立于主信息带，不污染"关键/辅助/背景"层级
  drawFps();

  // 状态胶囊：只显示"当前激活"的状态，未激活不占位 —— 比原来一排无字色块更详细也更干净
  drawStatusChips();
  drawItemBar();
  drawToasts();

  const sy = H - WB_H - 12;
  if (player.weapon === 5) drawTextRight('回旋镖 x' + player.boomCount, W - 6, sy - 18, '#b06bff', 0.75);
  drawTextRight(WEAPONS[player.weapon].name, W - 6, sy - 5, WEAPONS[player.weapon].color, 0.8);
  const pw = 30;
  for (let i = 0; i < player.power; i++) {
    ctx.fillStyle = TH();
    ctx.fillRect(W - 6 - pw + i * 7, sy + 4, 5, 3);
  }
}

function drawBossHealth() {
  if (!boss) return;
  const ratio = Math.max(0, boss.hp / boss.maxhp);
  const bw = W - 52, bx = 26, by = HUD_H + 10;
  fillRoundRect(bx - 2, by - 2, bw + 4, 11, 4, 'rgba(8, 18, 30, 0.9)');
  fillRoundRect(bx, by, bw, 7, 3, '#1e3549');
  const col = ratio > 0.6 ? boss.color : (ratio > 0.3 ? '#ff9f43' : '#ffd166');
  /* 分段刻度：每 25% 一条。没有刻度的话玩家只能凭长度估"还剩多少"，
     而 Boss 战的关键是判断"再打几轮能过"。 */
  for (let i = 1; i < 4; i++) {
    const sx = bx + bw * (i / 4);
    ctx.fillStyle = 'rgba(8, 18, 30, 0.85)'; ctx.fillRect(sx, by, 1, 7);
  }
  const fw = Math.max(2, bw * ratio);
  fillRoundRect(bx, by, fw, 7, 3, col);
  ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(bx + 3, by + 1, Math.max(0, fw - 6), 1);
  // 锐光打在血量末端：和 HUD 血条同一套语言
  {
    const gs = getGlowSprite(col, 'spark');
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.4;
    ctx.drawImage(gs, bx + fw - 5, by + 3.5 - 5, 10, 10);
    ctx.restore();
  }
  /* 二阶段停顿：血量过半时血条闪烁 + 停顿 0.3s。
     这是一次"仪式"而不是持续状态 —— 只做一次，之后恢复正常。 */
  if (boss.phaseFlash > 0) {
    const fk = boss.phaseFlash / 0.3;
    ctx.save();
    ctx.globalAlpha = fk * 0.9;
    strokeRoundRect(bx - 2.5, by - 2.5, bw + 5, 12, 4, '#ffffff', 1.6);
    ctx.restore();
  }
  drawTextCenter('首领 · ' + boss.name, by - 12, boss.color, 0.9);
  drawTextRight(Math.ceil(boss.hp) + ' / ' + boss.maxhp, bx + bw, by + 11, '#5b7fa3', 0.75);
}
/* ==================================================================
   左下角状态提示（toast）
   ==================================================================
   拾取道具 / 超载就绪这类"发生了什么"的事件，需要一个不打断操作的位置。
   banner 在屏幕正中偏上（HUD 下方），是给**波次切换**这种全屏级事件用的 ——
   吃个血包也用 banner 会把弹幕挡住，而且玩家根本不会抬头去看。
   左下角是弹幕游戏里视线余光能覆盖、又几乎不会挡住来敌的位置。

   设计要点：
     · 3 秒自动消失，不需要玩家处理（不是弹窗，没有"关闭"）
     · **最新在底部**：新提示出现的位置固定，眼睛不用重新找
     · 同名提示刷新计时并累加次数（连吃三个血包显示"×3"而不是刷三行）
     · 最多 4 条，超出丢最旧的 —— 连续事件不该把屏幕堆满 */
const TOAST_LIFE = 3, TOAST_MAX = 4;
let toasts = [];
function pushToast(text, sub, color) {
  const last = toasts[toasts.length - 1];
  if (last && last.text === text) {
    last.life = TOAST_LIFE;                    // 同名刷新，避免刷屏
    last.count = (last.count || 1) + 1;
    last.sub = sub || last.sub;
    return;
  }
  toasts.push({ text: text, sub: sub || '', color: color || '#8ab4d8',
    life: TOAST_LIFE, max: TOAST_LIFE, count: 1, born: state.time });
  if (toasts.length > TOAST_MAX) toasts.shift();
}
function updateToasts(dt) {
  for (let i = toasts.length - 1; i >= 0; i--) {
    toasts[i].life -= dt;
    if (toasts[i].life <= 0) toasts.splice(i, 1);
  }
}
function drawToasts() {
  if (!toasts.length) return;
  if (state.mode !== MODE_PLAY || paused || upgradePanel.active) return;
  const h = 15, gap = 3;
  /* 底部基准线：状态胶囊（H - WB_H - 20）之上，再留 6px 呼吸。
     必须放在胶囊上方而不是下方 —— 下方是武器条，会被完全遮住。 */
  const baseY = H - WB_H - 26 - h;
  for (let i = 0; i < toasts.length; i++) {
    const t = toasts[i];
    const fromBottom = toasts.length - 1 - i;     // 最新（末尾）贴底
    const y = baseY - fromBottom * (h + gap);
    // 入场：从左滑入 + 淡入；退场：最后 0.4s 淡出
    const inT = Math.min(1, (TOAST_LIFE - t.life) / 0.18);
    const ease = 1 - Math.pow(1 - Math.max(0, inT), 3);
    const alpha = Math.min(1, t.life / 0.4) * ease;
    const xOff = (1 - ease) * -14;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(xOff, 0);

    // 左侧色条 + 半透明底：与状态胶囊同一语言，但更轻（不吃道具时的对比度更低）
    const w = Math.min(W - 16, textWidth(t.text, 0.68) + (t.sub ? textWidth(t.sub, 0.58) + 8 : 0) +
      (t.count > 1 ? textWidth('x' + t.count, 0.62) + 4 : 0) + 20);
    fillRoundRect(8, y, w, h, 7, 'rgba(8, 18, 30, 0.88)');
    strokeRoundRect(8.5, y + 0.5, w - 1, h - 1, 7, hexA(t.color, 0.5), 1);
    // 左端色块：形状先于文字被识别，扫一眼就知道"这是增益还是危险"
    ctx.fillStyle = t.color;
    fillRoundRect(8, y + 3, 3, h - 6, 1.5, t.color);

    drawText(t.text, 15, y + 3, t.color, 0.68);
    let tx = 15 + textWidth(t.text, 0.68) + 5;
    if (t.sub) { drawText(t.sub, tx, y + 4, '#8ab4d8', 0.58); tx += textWidth(t.sub, 0.58) + 4; }
    if (t.count > 1) drawText('x' + t.count, tx, y + 3, '#ffd166', 0.62);
    ctx.restore();
  }
}

function drawBanner() {
  if (banner.t <= 0) return;
  const t = banner.t; let alpha = 1;
  if (t < 0.35) alpha = t / 0.35; else if (t > 1.5) alpha = (1.8 - t) / 0.3;
  alpha = Math.max(0, Math.min(1, alpha)); ctx.globalAlpha = alpha;
  // 弹出：刚出现时略大再回落到正常，给波次切换一个"落地"的重量感
  let sc = 2;
  if (t > 1.5) sc = 2 + (t - 1.5) * 1.2;
  drawTextCenter(banner.text, HUD_H + 30, banner.color, sc);
  if (banner.sub) drawTextCenter(banner.sub, HUD_H + 52, '#5b7fa3', 1);
  ctx.globalAlpha = 1;
}
function drawAchPopup() {
  if (achPopup.t <= 0) return;
  const alpha = Math.min(1, achPopup.t / 0.5); ctx.globalAlpha = alpha;
  fillRoundRect(24, HUD_H + 20, W - 48, 26, 6, 'rgba(6, 14, 24, 0.94)');
  strokeRoundRect(24.5, HUD_H + 20.5, W - 49, 25, 6, '#ffd166', 1.2);
  drawTextCenter('成就解锁', HUD_H + 24, '#ffd166', 0.75);
  drawTextCenter(achPopup.text, HUD_H + 33, '#ffffff', 1);
  ctx.globalAlpha = 1;
}
function drawUpgradePanel() {
  if (!upgradePanel.active) return;
  ctx.fillStyle = 'rgba(4, 8, 14, 0.9)'; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 0.15 + Math.sin(state.time * 4) * 0.08; ctx.fillStyle = TH(); ctx.fillRect(0, HUD_H + 4, W, 1.5); ctx.globalAlpha = 1;
  drawTextCenter('升级商店', HUD_H + 14, TH(), 1.8);
  upLayout();   // 卡片高度/起始 y 必须在绘制前算好（命中判定读同一份值）
  drawTextCenter('金币 ' + state.coins, HUD_H + 40, '#ffd166', 1);
  /* 「剩余 N 秒」从底部移到这里，与金币同行的右端。
     原来底部有两行提示（H-60 剩余秒数 / H-42 操作说明），
     在 H=320 下第二行会压住跳过按钮 —— 合并后底部只占一行，冲突自然消失。 */
  drawTextRight('剩余 ' + Math.ceil(upgradePanel.timer) + ' 秒', W - 22, HUD_H + 41, '#3f5f7d', 0.85);
  // 入场：卡片带 0.28s 的 ease-out 位移 + 淡入，替代原来的硬弹出
  const introRaw = Math.min(1, (9 - upgradePanel.timer) / 0.28);
  const intro = 1 - Math.pow(1 - introRaw, 3);
  UP_SKIP_BTN.y = upSkipY();   // 卡数可能不足 3，y 必须在绘制前同步

  /* 卡片四样：图标 + 名字 + 核心数字 + 效果说明（tip）。
     原来图标+名字+描述+价格四行，弹窗糊一脸，玩家根本不读描述 ——
     信息过载时人只会扫一眼数字就决定。
     现在 desc（数值复述，与 core 重复）不再显示，
     改成 tip（效果解释）：回答"这东西到底有啥用"，新手才不会瞎买。
     价格放在核心数字下方，仍是决策必需，但不再是视觉主角。 */
  for (let i = 0; i < upgradePanel.options.length; i++) {
    const opt = upgradePanel.options[i];
    const y = UP_PANEL.y0 + i * (UP_PANEL.h + UP_PANEL.gap) + (1 - intro) * 22;
    const affordable = state.coins >= opt.cost;
    const CH = UP_PANEL.h;
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, intro));

    fillRoundRect(UP_PANEL.x, y, UP_PANEL.w, CH, 8, affordable ? 'rgba(14, 30, 48, 0.95)' : 'rgba(10, 16, 24, 0.95)');
    strokeRoundRect(UP_PANEL.x + 0.5, y + 0.5, UP_PANEL.w - 1, CH - 1, 8, affordable ? opt.color : '#1e3549', 1.4);

    // ① 图标格（左）：形状比文字快
    const icx = UP_PANEL.x + 24, icy = y + CH / 2;
    panel(UP_PANEL.x + 6, y + (CH - 30) / 2, 30, 30, 5,
      { bg: 'rgba(6, 14, 26, 0.9)', border: hexA(affordable ? opt.color : '#2b4a66', 0.6), bw: 1 });
    drawUpgradeIcon(opt.icon, icx, icy, 9, affordable ? opt.color : '#2b4a66');

    // ② 名字（中）
    const tx = UP_PANEL.x + 42;
    drawText(opt.name, tx, y + 8, affordable ? opt.color : '#3f5f7d', 1.0);

    // ③ 核心数字（右下，最大最亮）+ 价格（其下方，次要）
    let coreStr;
    try { coreStr = typeof opt.core === 'function' ? opt.core() : opt.core; } catch (e) { coreStr = ''; }
    if (coreStr === undefined || coreStr === null) coreStr = '';
    drawTextRight(String(coreStr), UP_PANEL.x + UP_PANEL.w - 12, y + 7,
      affordable ? opt.color : '#2b4a66', 1.15);
    drawTextRight(opt.cost + 'C', UP_PANEL.x + UP_PANEL.w - 12, y + 22,
      affordable ? '#ffd166' : '#3f5f7d', 0.72);

    /* ④ 效果说明：矮屏（卡片 < 58）时省略，优先保证上面三样清晰。
       无 tip 位置时才画键盘序号 —— 两行小字叠在一起会糊。 */
    if (upShowTip && opt.tip) {
      drawText(opt.tip, tx, y + 34, affordable ? '#8ab4d8' : '#2b4a66', 0.58);
    } else if (!isTouch) {
      drawText((i + 1) + ' 键', tx, y + 26, '#3f5f7d', 0.6);
    }
    ctx.restore();
  }

  /* 跳过按钮：原来只能"点空白/按空格跳过"，没有明确的入口。
     允许放弃升级换继续推进 —— 没有跳过，升级面板就成了强制广告。 */
  // 幽灵按钮：透明底 + 发光描边。与主菜单功能按钮同一语言
  const sk = UP_SKIP_BTN;
  const skPulse = 0.5 + Math.sin(state.time * 2) * 0.5;
  panel(sk.x, sk.y, sk.w, sk.h, 6, {
    bg: 'rgba(12, 24, 40, 0.85)',
    border: hexA('#8ab4d8', 0.4 + skPulse * 0.3), bw: 1 + skPulse * 0.3
  });
  scanSweep(sk.x, sk.y, sk.w, sk.h, 6, state.time * 0.25, '#8ab4d8', 0.1 + skPulse * 0.08);
  drawTextCenter2('跳 过（放弃本次升级）', sk.x + sk.w / 2,
    sk.y + (sk.h - fontPx(0.68)) / 2, '#8ab4d8', 0.68);

  /* 底部只留一行操作提示 —— 「剩余 N 秒」已移到顶部金币行右侧。
     原来这里两行（H-60 / H-42），H=320 下第二行正好压在跳过按钮上。 */
  drawTextCenter(isTouch ? '点击卡片购买' : '按 1-3 购买 · 空格跳过', H - 30, '#8ab4d8', 0.8);
}

/* 细状态条（护盾 / 过载）：标签 + 细条 + 数值，一行 8px。
   抽成通用函数是因为两条结构完全一样，只有颜色/文案/比例不同 ——
   写两份的话改间距、改圆角时必然漏改一处，两条就会悄悄错位。

   与血条的区别：血条是"生命线"要给足高度和发光，这两条是"剩余时长/蓄能"，
   属于辅助读数 —— 给 4px 高就够，做太重会抢血条的视觉权重。
   未激活时（护盾 0）仍然画出空槽：栏位固定，玩家不用每帧重新找位置。 */
function drawSubStatBar(y, label, ratio, valueText, color, active, pulse, opt) {
  opt = opt || {};
  /* main = 生命条：通用条只有 4px 高，血条原本是 6px + 体积光 + 锐光端点，
     直接套用会让它和护盾/过载一样细 —— 血条是 HUD 里唯一"掉了就要死"的读数，
     视觉权重必须高于其余三条。 */
  const barH = opt.main ? 6 : 4;
  /* 三条（生命/护盾/过载）右端统一收到 x=87，数值统一从 x=91 起左对齐。
     原护盾条宽 140 占屏 58%，与血条（98）差了一大截，看着像两个不同量级的东西；
     现在三行右端与数值各成一列，视线上下扫读时不会跳动。
     ⚠️ 数值用 drawText 而非 drawTextRight(W-8)：右对齐到屏幕边会让数值离条很远，
     条空时那片空白看着像"没显示"。 */
  const lx = 8, lw = 22;
  const bx = lx + lw, bw = 57, bh = barH;
  const by = y + 2 - (opt.main ? 1 : 0);
  drawText(label, lx, y - 1, active ? color : '#2b4a66', opt.main ? 0.62 : 0.58);

  fillRoundRect(bx, by, bw, bh, 2, 'rgba(6, 12, 22, 0.85)');
  strokeRoundRect(bx + 0.5, by + 0.5, bw - 1, bh - 1, 2,
    active ? hexA(color, 0.5) : 'rgba(90, 140, 180, 0.18)', 1);

  const fw = bw * Math.max(0, Math.min(1, ratio));
  if (fw > 0.5) {
    if (opt.main) {
      // 体积光垫底 + 实心填充：血条要有"厚度"，否则看着像贴了张半透明纸
      drawVolume(bx + fw / 2, by + bh / 2, fw, bh + 4, color, 0.42);
    }
    fillRoundRect(bx, by, fw, bh, 2, color);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.3;
    fillRoundRect(bx + 0.5, by + 0.5, Math.max(0, fw - 1), bh - 1, 1.5, color);
    ctx.restore();
    if (opt.main) {
      // 顶部高光 + 末端锐光：眼睛会被"当前血量的位置"吸住，而不是看整条
      ctx.globalAlpha = 0.35; ctx.fillStyle = '#ffffff';
      ctx.fillRect(bx + 1, by + 1, Math.max(0, fw - 2), 1);
      ctx.globalAlpha = 1;
      const gs = getGlowSprite(color, 'spark'), gr = 4;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.4;
      ctx.drawImage(gs, bx + fw - gr, by + bh / 2 - gr, gr * 2, gr * 2);
      ctx.restore();
    }
    if (pulse) {                       // 满蓄能：整条呼吸，提示"可以放了"
      ctx.globalAlpha = 0.22 + Math.sin(state.time * 6) * 0.14;
      fillRoundRect(bx, by, fw, bh, 2, '#ffffff');
      ctx.globalAlpha = 1;
    }
  }
  drawText(valueText, bx + bw + 4, y - 1, active ? '#eafcff' : '#2b4a66', 0.62);
}

/* ==================================================================
   主菜单
   ================================================================== */
/* 迷你趋势图（sparkline）：数据卡底部的一条折线。
   不是统计报表 —— 玩家要的是"最近在涨还是在跌"，一眼能看出来就行。
   少于 2 个点不画（一条线画不出趋势）；全平也不画（无信息量）。
   返回是否绘制，便于调用方决定是否要让出这块高度。 */
/* ===== 结算页分段评级 =====
   单一总分没有成就感，也没法指导改进。分成五维后玩家会记住
   "生存 S、效率 B"，然后针对性地再开一局 —— 这是留存的关键。
   五维各自归一到 0~1，再按权重合成总分换字母。
   阈值按"中等水平玩家"标定，不是按满分标定 ——
   评级要能区分普通发挥和高光时刻，全给 S 就没有意义了。 */
const GRADE_DIMS = [
  { id: 'surv',  label: '生存', weight: 0.25 },
  { id: 'kill',  label: '击杀', weight: 0.25 },
  { id: 'eff',   label: '效率', weight: 0.20 },
  { id: 'ult',   label: '超载', weight: 0.15 },
  { id: 'style', label: '风格', weight: 0.15 }
];
// 各维度：达到 cap 即满分（超出不额外加分，避免刷分）
// eff 的 cap 按实测标定：典型一局 250 杀 / 180 秒 ≈ 1.4 杀/秒，
// 高手能到 2。原来定 3.5 导致"效率"永远是 D，评级失去区分度
const GRADE_CAP = { surv: 15, kill: 250, eff: 1.8, ult: 6, style: 60 };
function gradeDims(wave, kills, secs, ults, combo) {
  const raw = {
    surv: wave,
    kill: kills,
    eff: secs > 0 ? kills / secs : 0,        // 每秒击杀
    ult: ults,
    style: combo
  };
  const out = {};
  for (const d of GRADE_DIMS) {
    out[d.id] = Math.max(0, Math.min(1, raw[d.id] / GRADE_CAP[d.id]));
  }
  return out;
}
function gradeLetter(v) {
  if (v >= 0.92) return 'S';
  if (v >= 0.80) return 'A';
  if (v >= 0.66) return 'B';
  if (v >= 0.50) return 'C';
  if (v >= 0.32) return 'D';
  return 'E';
}
const GRADE_COLOR = {
  S: '#ffd166', A: '#4ade80', B: '#3ad1ff', C: '#8ab4d8', D: '#ff9f43', E: '#ff4d6d'
};
function gradeTotal(dims) {
  let s = 0;
  for (const d of GRADE_DIMS) s += (dims[d.id] || 0) * d.weight;
  return Math.max(0, Math.min(1, s));
}

/* 升级卡图标：11 种，纯几何绘制。
   图标比文字快 —— 玩家扫一眼形状就知道是"回血"还是"加火力"，
   不用逐字读。全部用 fillRect / 简单 path，不额外预渲染。 */
function drawUpgradeIcon(kind, cx, cy, r, color) {
  ctx.save();
  ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = 1.2;
  switch (kind) {
    case 'power':      // 向上箭头：等级提升
      ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r * 0.8, cy + r * 0.2);
      ctx.lineTo(cx + r * 0.3, cy + r * 0.2); ctx.lineTo(cx + r * 0.3, cy + r);
      ctx.lineTo(cx - r * 0.3, cy + r); ctx.lineTo(cx - r * 0.3, cy + r * 0.2);
      ctx.lineTo(cx - r * 0.8, cy + r * 0.2); ctx.closePath(); ctx.fill(); break;
    case 'life':       // 心形（两个方块 + 一个三角，像素风）
      ctx.fillRect(cx - r * 0.8, cy - r * 0.7, r * 0.7, r * 0.7);
      ctx.fillRect(cx + r * 0.1, cy - r * 0.7, r * 0.7, r * 0.7);
      ctx.beginPath(); ctx.moveTo(cx - r * 0.85, cy - r * 0.05);
      ctx.lineTo(cx + r * 0.85, cy - r * 0.05); ctx.lineTo(cx, cy + r * 0.9);
      ctx.closePath(); ctx.fill(); break;
    case 'heal':       // 十字
      ctx.fillRect(cx - r * 0.28, cy - r * 0.85, r * 0.56, r * 1.7);
      ctx.fillRect(cx - r * 0.85, cy - r * 0.28, r * 1.7, r * 0.56); break;
    case 'drone':      // 两个小僚机
      ctx.beginPath(); ctx.arc(cx - r * 0.42, cy + r * 0.25, r * 0.42, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + r * 0.42, cy + r * 0.25, r * 0.42, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(cx - r * 0.5, cy - r * 0.85, r, r * 0.4); break;
    case 'shield':     // 盾形
      ctx.beginPath(); ctx.moveTo(cx, cy - r);
      ctx.lineTo(cx + r * 0.8, cy - r * 0.55); ctx.lineTo(cx + r * 0.62, cy + r * 0.5);
      ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r * 0.62, cy + r * 0.5);
      ctx.lineTo(cx - r * 0.8, cy - r * 0.55); ctx.closePath(); ctx.fill(); break;
    case 'boom':       // 回旋镖（V 形 + 两端圆点）
      ctx.beginPath(); ctx.moveTo(cx - r * 0.8, cy - r * 0.5);
      ctx.lineTo(cx, cy + r * 0.6); ctx.lineTo(cx + r * 0.8, cy - r * 0.5); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx - r * 0.8, cy - r * 0.5, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + r * 0.8, cy - r * 0.5, r * 0.22, 0, Math.PI * 2); ctx.fill(); break;
    case 'spread':     // 扇形三点
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.arc(cx + i * r * 0.62, cy + r * (0.5 - Math.abs(i) * 0.45), r * 0.26, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillRect(cx - r * 0.18, cy - r * 0.9, r * 0.36, r * 0.5); break;
    case 'magnet':     // U 形磁铁
      ctx.beginPath(); ctx.moveTo(cx - r * 0.75, cy - r * 0.5);
      ctx.lineTo(cx - r * 0.75, cy + r * 0.35); ctx.lineTo(cx + r * 0.75, cy + r * 0.35);
      ctx.lineTo(cx + r * 0.75, cy - r * 0.5); ctx.stroke();
      ctx.fillRect(cx - r * 0.95, cy + r * 0.35, r * 0.4, r * 0.45);
      ctx.fillRect(cx + r * 0.55, cy + r * 0.35, r * 0.4, r * 0.45); break;
    case 'bomb':       // 炸弹（圆 + 引线）
      ctx.beginPath(); ctx.arc(cx, cy + r * 0.22, r * 0.62, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx + r * 0.4, cy - r * 0.38);
      ctx.quadraticCurveTo(cx + r * 0.9, cy - r * 0.75, cx + r * 0.55, cy - r); ctx.stroke(); break;
    case 'ult':        // 闪电
      ctx.beginPath(); ctx.moveTo(cx + r * 0.25, cy - r);
      ctx.lineTo(cx - r * 0.55, cy + r * 0.1); ctx.lineTo(cx + r * 0.05, cy + r * 0.1);
      ctx.lineTo(cx - r * 0.25, cy + r); ctx.lineTo(cx + r * 0.6, cy - r * 0.15);
      ctx.lineTo(cx, cy - r * 0.15); ctx.closePath(); ctx.fill(); break;
    default:           // 兜底：实心圆
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.7, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

/* 六维雷达图：把武器属性画成形状而不是列表。
   形状比数字更好比较 —— 两把武器叠在一起看轮廓差异，一眼就知道各自擅长什么。
   支持 overlay：传入第二把武器做半透明对比叠图。 */
function drawRadar(cx, cy, r, st, color, opt) {
  opt = opt || {};
  const n = WSTAT_KEYS.length;
  const ang = (i) => -Math.PI / 2 + (Math.PI * 2 / n) * i;   // 从正上方起
  const val = (i) => Math.max(0, Math.min(WSTAT_MAX, (st[WSTAT_KEYS[i]] || 0))) / WSTAT_MAX;

  // 背景网格：3 圈同心多边形 + 轴线。没有网格的雷达图读不出数值
  ctx.save();
  for (let ring = 1; ring <= 3; ring++) {
    const rr = r * ring / 3;
    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = opt.gridColor || '#3f5f7d';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = ang(i), x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.stroke();
  }
  ctx.globalAlpha = 0.2;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = ang(i);
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
  }
  ctx.stroke();
  ctx.restore();

  // 对比叠图（先画，压在主图之下）
  if (opt.overlay) {
    const ov = opt.overlay, oc = opt.overlayColor || '#8ab4d8';
    const ovVal = (i) => Math.max(0, Math.min(WSTAT_MAX, (ov[WSTAT_KEYS[i]] || 0))) / WSTAT_MAX;
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = oc;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = ang(i), rr = r * ovVal(i);
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // 主图：填充 + 描边 + 顶点小方块
  ctx.save();
  ctx.globalAlpha = 0.32;
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = ang(i), rr = r * val(i);
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill();

  ctx.globalAlpha = 0.95;
  ctx.strokeStyle = color; ctx.lineWidth = 1.4;
  ctx.stroke();

  ctx.globalAlpha = 1;
  ctx.fillStyle = color;
  for (let i = 0; i < n; i++) {
    const a = ang(i), rr = r * val(i);
    ctx.fillRect(cx + Math.cos(a) * rr - 1.5, cy + Math.sin(a) * rr - 1.5, 3, 3);
  }
  ctx.restore();

  // 轴标签
  if (opt.labels !== false) {
    ctx.save();
    ctx.globalAlpha = 0.85;
    for (let i = 0; i < n; i++) {
      const a = ang(i), lr = r + 8;
      const x = cx + Math.cos(a) * lr, y = cy + Math.sin(a) * lr - fontPx(0.55) / 2;
      drawTextCenter2(WSTAT_LABELS[i], x, y, val(i) >= 0.6 ? color : '#5b7fa3', 0.55);
    }
    ctx.restore();
  }
}

function drawSparkline(x, y, w, h, data, color) {
  if (!data || data.length < 2) return false;
  const lo = Math.min(...data), hi = Math.max(...data);
  const span = hi - lo;
  if (span <= 0) return false;                 // 全部相同：没有趋势可表达
  const n = data.length;
  const px = (i) => x + (n === 1 ? w / 2 : (w * i) / (n - 1));
  const py = (v) => y + h - ((v - lo) / span) * h;
  ctx.save();
  // 折线本身
  ctx.strokeStyle = hexA(color, 0.75);
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const cx = px(i), cy = py(data[i]);
    if (i === 0) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
  }
  ctx.stroke();
  // 末点加重：最近一局是玩家最关心的，给个实心点
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(px(n - 1), py(data[n - 1]), 1.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  return true;
}

/* 刻度基准：卡片底部一排细刻度，按比例亮起。
   和数据卡上的数字配合 —— 数字给精确值，刻度给"大致位置"的直觉。 */
function drawTickScale(x, y, w, count, ratio, color, activeColor) {
  const c = Math.max(2, count | 0);
  const gap = w / c;
  const tw = Math.max(1, gap * 0.55);
  const on = Math.round(Math.max(0, Math.min(1, ratio)) * c);
  for (let i = 0; i < c; i++) {
    ctx.fillStyle = i < on ? activeColor : color;
    ctx.fillRect(x + i * gap, y, tw, 1);
  }
}

/* 数据卡：从"标签 + 数字"升级成真正的仪表。
   之前四个卡全是同一套描边和小字号，看着像表格而不像仪表盘。现在：
     ① 微渐变底（上暗下亮）—— 有体积感，不再是一块死色
     ② 大号发光数字 —— 数值才是主角，标签压小压暗
     ③ 底部刻度基准 —— 给"大致位置"的直觉
     ④ 迷你趋势图 —— 最近 8 局走势（有历史数据的卡才有）
   四项都不动不闪。光只给数字（volume 材质），保持"光稀缺"。 */
/* ==================================================================
   监护仪风格战绩屏
   ==================================================================
   原来四张战绩卡是四块独立的圆角矩形 —— 那是"卡片列表"，不是"一台仪器"。
   改成一整块监护屏 + 四个通道：深色屏底、ECG 图纸网格、每通道一条波形 +
   发光数值 + 扫描光点。四通道共用一台机器，"这四项是同一组生命体征"才立得住。

   三个关键设计点：
   ① **波形用真实历史数据**（histScore / histWave / histKills），不用随机噪声。
      随机线看着像故障；真数据的起伏才让人觉得"这台机器在监测我的战绩"
   ② **阶梯画法**：平走一段再陡变，而不是在两点间直接连线。
      直接连线是平滑折线，而监护仪的标志是"一段基线 + 骤起的尖峰"
   ③ **游戏次数没有历史序列**（它本身就是累计值，趋势无意义），
      用基于数值的**确定性**伪波形填充 ——
      必须是确定性的：用 Math.random 的话波形每帧都在抖，看着像信号丢失

   心跳节奏：整屏统一 1.15Hz（约 69 BPM），四通道同拍。
   各通道若各按各的拍子，就像四台坏了不同步的机器。 */
function monitorBeat() {
  const b = (state.time * 1.15) % 1;
  // 收缩期尖峰：只在周期头 18% 亮起，其余平缓 —— 心跳是"一下"，不是"一段"
  return b < 0.18 ? Math.pow(1 - b / 0.18, 2) : 0;
}

/* 确定性伪波形：同一 seed 永远得到同一条线。
   用数值本身做 seed，这样战绩变化时波形才会变，而不是每帧乱抖。 */
function pseudoWave(seed, n) {
  const out = [];
  let s2 = (Math.abs(seed) * 2654435761) >>> 0 || 1;
  for (let i = 0; i < n; i++) {
    s2 = (s2 * 1103515245 + 12345) & 0x7fffffff;
    out.push((s2 % 1000) / 1000);
  }
  // 首尾向内收，避免波形贴着通道上下边缘
  return out.map((v, i) => {
    const edge = Math.min(i, n - 1 - i) / Math.max(1, (n - 1) / 2);
    return 0.12 + v * 0.76 * Math.min(1, 0.35 + edge);
  });
}

function normWave(hist, n) {
  if (!hist || hist.length < 2) return null;
  const arr = hist.slice(-n);
  if (arr.length < 2) return null;
  let mn = Infinity, mx = -Infinity;
  for (const v of arr) { if (v < mn) mn = v; if (v > mx) mx = v; }
  const span = mx - mn;
  /* 全平序列（比如每局都打到同一波次）**如实画成中线**，不伪造起伏 ——
     数据确实没波动时造一条抖动的线是在骗人。
     "这台机器还活着"由末端光点的心跳脉冲来表达，而不是靠编造数据。 */
  return arr.map(v => span < 1e-6 ? 0.5 : 0.15 + (v - mn) / span * 0.72);
}

/* 单通道波形：阶梯画法（平走 → 陡变）+ 末端扫描光点。 */
function drawMonitorWave(x, y, w, h, data, color, beat) {
  const n = data.length;
  if (n < 2 || w < 8 || h < 4) return;
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // ① 外发光：监护仪的线是荧光笔迹，实心细线没有那个辉光感
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.30 + beat * 0.3;
  ctx.strokeStyle = color; ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let i = 0; i < n - 1; i++) {
    const px = x + (i / (n - 1)) * w, nx = x + ((i + 1) / (n - 1)) * w;
    const py = y + h - data[i] * h, ny = y + h - data[i + 1] * h;
    const midX = px + (nx - px) * 0.62;
    ctx.moveTo(px, py); ctx.lineTo(midX, py); ctx.lineTo(nx, ny);
  }
  ctx.stroke();
  // ② 主线
  ctx.globalAlpha = 0.95;
  ctx.strokeStyle = color; ctx.lineWidth = 1.1;
  ctx.beginPath();
  for (let i = 0; i < n - 1; i++) {
    const px = x + (i / (n - 1)) * w, nx = x + ((i + 1) / (n - 1)) * w;
    const py = y + h - data[i] * h, ny = y + h - data[i + 1] * h;
    const midX = px + (nx - px) * 0.62;
    ctx.moveTo(px, py); ctx.lineTo(midX, py); ctx.lineTo(nx, ny);
  }
  ctx.stroke();
  // ③ 末端扫描光点：最新数据的位置。跟着心跳一起亮，是"这台机器活着"的落点
  const lx = x + w, ly = y + h - data[n - 1] * h;
  const r = 1.6 + beat * 1.8;
  const gs = getGlowSprite(color, 'spark');
  ctx.globalAlpha = 0.5 + beat * 0.5;
  ctx.drawImage(gs, lx - r * 2, ly - r * 2, r * 4, r * 4);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(Math.round(lx) - 1, Math.round(ly) - 1, 2, 2);
  ctx.restore();
}

/* 监护屏：一整块机器面板 + 网格 + 四通道。
   通道数固定 4（与战绩项一一对应），不随画质变化 ——
   少画一个通道会让"四项战绩"看起来缺了一块。 */
function drawMonitorPanel(x, y, w, h, items) {
  const beat = monitorBeat();

  // ① 屏底：比卡片更暗更"实"，监护仪的屏是深黑不是半透明蓝
  const bgGrad = ctx.createLinearGradient(0, y, 0, y + h);
  bgGrad.addColorStop(0, 'rgba(4, 10, 18, 0.96)');
  bgGrad.addColorStop(1, 'rgba(8, 18, 30, 0.93)');
  fillRoundRect(x, y, w, h, 6, bgGrad);

  // ② ECG 图纸网格：细到几乎看不见，但少了它就不像监护仪
  ctx.save();
  ctx.beginPath(); ctx.rect(x + 1, y + 1, w - 2, h - 2); ctx.clip();
  ctx.strokeStyle = 'rgba(58, 209, 255, 0.07)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let gx = x + 6; gx < x + w; gx += 6) { ctx.moveTo(Math.round(gx) + 0.5, y); ctx.lineTo(Math.round(gx) + 0.5, y + h); }
  for (let gy = y + 6; gy < y + h; gy += 6) { ctx.moveTo(x, Math.round(gy) + 0.5); ctx.lineTo(x + w, Math.round(gy) + 0.5); }
  ctx.stroke();
  ctx.restore();

  strokeRoundRect(x + 0.5, y + 0.5, w - 1, h - 1, 6, hexA(TH(), 0.3), 1);
  frameCorners(x, y, w, h, 5, TH(), 0.28, 1);

  // ③ 通道
  const n = items.length;
  const cw = w / n;
  // 波形区：屏下方约 40%，但至少 8px 才画得出来
  const waveH = Math.max(0, Math.min(14, h * 0.4));
  const showWave = waveH >= 8;
  const labelY = y + 3;
  const valueY = y + (showWave ? (h - waveH) * 0.34 : (h - fontPx(1.05)) / 2);
  const waveY = y + h - waveH - 3;

  for (let i = 0; i < n; i++) {
    const [label, value, color, hist] = items[i];
    const cx = x + i * cw;
    // 通道分隔竖线（最后一列不画，否则压在边框上）
    if (i > 0) {
      ctx.fillStyle = 'rgba(58, 209, 255, 0.14)';
      ctx.fillRect(Math.round(cx), y + 5, 1, h - 10);
    }

    // 标签：极小写不下就缩，绝不溢出通道
    let ls = 0.52;
    const lw = textWidth(label, ls);
    if (lw > cw - 6) ls = Math.max(0.4, ls * (cw - 6) / lw);
    drawText(label, cx + 3, labelY, '#4a6c8c', ls);

    // 数值：发光数码管感
    let vs = 1.05;
    const vw2 = textWidth(String(value), vs);
    if (vw2 > cw - 6) vs = Math.max(0.62, vs * (cw - 6) / vw2);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.16 + beat * 0.16;
    const gs2 = getGlowSprite(color, 'volume');
    ctx.drawImage(gs2, cx + cw / 2 - cw * 0.4, valueY - 2, cw * 0.8, fontPx(vs) * 1.6);
    ctx.restore();
    liveNumber(String(value), cx + 3, valueY, color, vs, cx);

    // 波形
    if (showWave) {
      const wv = normWave(hist, 14) ||
                 pseudoWave(parseInt(String(value).replace(/\D/g, ''), 10) || (i + 1) * 97, 14);
      drawMonitorWave(cx + 2, waveY, cw - 5, waveH, wv, color, beat);
    }
  }
}

function drawStatCard(x, y, w, h, label, value, color, opt) {
  opt = opt || {};
  // 字号随卡片高度缩放：矮屏卡片被压缩后，固定字号会捅出卡片
  const k = Math.max(0.72, Math.min(1, h / 44));
  const narrow = w < 70;
  const padX = narrow ? 4 : 12;

  // ① 微渐变底：上暗下亮。纯色是"贴纸"，渐变才有厚度
  const bgGrad = ctx.createLinearGradient(0, y, 0, y + h);
  bgGrad.addColorStop(0, 'rgba(10, 18, 30, 0.92)');
  bgGrad.addColorStop(1, 'rgba(20, 36, 56, 0.88)');
  fillRoundRect(x, y, w, h, 7, bgGrad);
  strokeRoundRect(x + 0.5, y + 0.5, w - 1, h - 1, 7, hexA(color, 0.22), 1);

  // 顶部色条：保留配色识别（窄卡用顶部细条，不占横向空间）
  if (narrow) {
    fillRoundRect(x + 4, y + 3, Math.max(3, w - 8), 2, 1, color);
  } else {
    fillRoundRect(x + 5, y + 8 * k, 3, Math.max(4, h - 16 * k), 2, color);
  }

  // 标签：压小压暗，它是配角
  let ls = 0.65 * k;
  if (narrow) ls = Math.min(ls, (w - padX * 2) / (String(label).length * 5.0));
  drawText(label, x + padX, y + (narrow ? 7 : 5) * k, '#5b7fa3', ls);

  // ② 数值：大号 + 发光。数值是这张卡的主角
  let vs = 1.25 * k;                      // 比原来的 1.05 更大
  if (narrow) vs = Math.min(vs, (w - padX * 2) / (String(value).length * 5.0));
  const vText = String(value);
  const vY = y + (narrow ? 20 : 17) * k;
  // 光晕垫在数字之下：只用 volume 材质且很淡，绝不能盖住数字本身
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.22;
  const gs = getGlowSprite(color, 'volume');
  ctx.drawImage(gs, x + w / 2 - w * 0.42, vY - 2, w * 0.84, fontPx(vs) * 1.7);
  ctx.restore();
  // 数值用 liveNumber：明度呼吸让数据卡"活着"。
  // seed 用卡片 x 坐标，保证四张卡相位不同（同步呼吸看起来像故障）
  liveNumber(vText, x + padX, vY, color, vs, x);

  // ④ 迷你趋势图：有历史数据才画，占底部左侧一小条
  const hist = opt.hist;
  const hasHist = hist && hist.length >= 2;

  // ③ 刻度基准：底部一排细刻度，按比例亮起。
  // 没有精确 ratio 时用"当前值/历史最大值"估算，至少给出相对位置
  let ratio = opt.ratio;
  if (ratio === undefined && hist && hist.length) {
    const hi = Math.max(...hist, 0);
    ratio = hi > 0 ? Math.max(0, Math.min(1, (parseFloat(value) || 0) / hi)) : 0.5;
  }
  if (ratio !== undefined) {
    const tickW = hasHist ? w * 0.45 : w * 0.72;
    drawTickScale(x + padX, y + h - 5 * k, Math.max(6, tickW - padX), 8, ratio, 'rgba(91, 127, 163, 0.28)', color);
  }
  if (hasHist) {
    drawSparkline(x + w * 0.5, y + h - 13 * k, w * 0.42, 8 * k, hist, color);
  }
}

// 主菜单分区重写：
//   ① 标题区    PIXEL RAIDER + 副标题
//   ② 指挥官区  用户名卡片（点击改名）
//   ③ 主行动区  开始游戏（唯一的主按钮，视觉权重最高）
//   ④ 数据区    四张战绩卡
//   ⑤ 功能区    操作说明 / 武器图鉴 / 设置 三个入口
//   ⑥ 页脚      成就进度 + 版权
// 原来音量条裸放在底部、武器格堆在数据卡上方，主线被淹没；现在主线只剩两件事。
function drawMenu() {
  const t = state.time;

  // 子页面打开时整页让出，避免两层信息叠在一起
  if (codexPage.active) { drawCodexPage(); return; }
  if (settingsPageActive) { drawSettingsPage(); return; }

  // ===== ① 标题区 =====
  const glow = 0.75 + Math.sin(t * 2) * 0.25;
  const jit = Math.sin(t * 11) * 0.6;
  ctx.globalAlpha = glow * 0.5;
  drawTextAt('PIXEL', W / 2 - 0.9 + jit, 26, '#ff2060', 3.4);
  drawTextAt('PIXEL', W / 2 + 0.9 - jit, 26, '#20e0ff', 3.4);
  drawTextAt('RAIDER', W / 2 - 0.9 - jit, 58, '#20e0ff', 3.4);
  drawTextAt('RAIDER', W / 2 + 0.9 + jit, 58, '#ff2060', 3.4);
  ctx.globalAlpha = glow;
  drawTextCenter('PIXEL', 26, TH(), 3.4);
  drawTextCenter('RAIDER', 58, '#ff4d6d', 3.4);
  ctx.globalAlpha = 1;
  drawTextCenter('像 素 突 击', 92, '#eafcff', 1.15);
  // 带端点方块的分隔线：装置感来自"端点"，而不是再加一条装饰线
  // （标题两侧空间被左右胶囊占满，硬加装饰线会压住胶囊）
  dividerMarked(108, TH(), 30);

    // 情境文案：给主菜单一句"你在哪里、这是第几次出航"。
  // 这是叙事入口，成本近乎为零，但辨识度比一个 shader 还高。
  // 只显示"第 N 次出航"：加上星区名会超过 100px，撞到右侧胶囊（x148）
  const tagline = '第 ' + (stats.gamesPlayed + 1) + ' 次出航';
  // 打字机：逐字浮出，播完停留一会儿再换。只有文案变化时才重置进度，
  // 否则每帧重置会导致永远只显示第一个字
  if (tagline !== menuType.tag) { menuType.tag = tagline; menuType.t0 = t; }
  const tEl = t - menuType.t0;
  const CPS = 18;                                  // 每秒 18 字
  const shown = Math.min(tagline.length, Math.floor(tEl * CPS));
  const typing = tEl < tagline.length / CPS + 1.2;  // 打完再停 1.2s
  const caret = typing && Math.floor(t * 2.5) % 2 === 0;
  const tagStr = tagline.slice(0, shown) + (caret ? '_' : '');
  // y=114：在分隔线(108)下方、胶囊底(114)之下，纵向与胶囊错开
  drawTextCenter(tagStr, 114, '#5b7fa3', 0.68);

  // 设置胶囊：右上角。齿轮 + "设置"文字，与左侧"用户"胶囊对等。
  // 齿轮仍是呼吸摆动而非旋转 —— 转太快会被误认为"加载中"
  const gb = MENU_SETTINGS_BTN;
  const gPulse = 0.5 + Math.sin(t * 1.7) * 0.5;
  panel(gb.x, gb.y, gb.w, gb.h, 7, {
    bg: 'rgba(12, 24, 40, 0.88)',
    border: hexA('#ffd166', 0.4 + gPulse * 0.4), bw: 1 + gPulse * 0.3,
    glow: '#ffd166'
  });
  scanSweep(gb.x, gb.y, gb.w, gb.h, 7, t * 0.28, '#ffd166', 0.1 + gPulse * 0.08);
  // 图标 x 偏移与左侧头像一致（+9），保证两枚胶囊内部结构对齐
  drawGearIcon(gb.x + 9, gb.y + gb.h / 2, 7,
    gPulse > 0.5 ? '#ffe8a8' : '#ffd166', Math.sin(t * 0.8) * 0.18);
  drawText('设 置', gb.x + 20, gb.y + (gb.h - fontPx(0.85)) / 2,
    gPulse > 0.5 ? '#fff4d0' : '#ffd166', 0.85);

  // 指挥官胶囊：左上角，与齿轮对称。青色（指挥官主色）区分于齿轮的金色。
  // 头像 + 用户名 + 铅笔图标，整体点击改名
  const cb = MENU_COMMANDER_BTN;
  const cPulse = 0.5 + Math.sin(t * 1.7 + Math.PI) * 0.5;   // 与齿轮反相，错开呼吸
  panel(cb.x, cb.y, cb.w, cb.h, 7, {
    bg: 'rgba(12, 24, 40, 0.88)',
    border: THa(0.4 + cPulse * 0.4), bw: 1 + cPulse * 0.3,
    glow: TH()
  });
  scanSweep(cb.x, cb.y, cb.w, cb.h, 7, t * 0.28, TH(), 0.1 + cPulse * 0.08);

  // 头像（圆形人像，比文字更快识别"这是你"）
  const avCX = cb.x + 9, avCY = cb.y + cb.h / 2, avR = 6.5;
  ctx.fillStyle = 'rgba(58, 209, 255, 0.2)'; ctx.beginPath(); ctx.arc(avCX, avCY, avR, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = TH(); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(avCX, avCY, avR, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = TH();
  ctx.beginPath(); ctx.arc(avCX, avCY - 1.6, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(avCX - 3.2, avCY + 4.4);
  ctx.quadraticCurveTo(avCX, avCY + 0.6, avCX + 3.2, avCY + 4.4); ctx.closePath(); ctx.fill();

  // 用户名：可用宽度固定，位数多时先缩字、仍放不下再截断加省略号，绝不撑破胶囊
  const nameX = cb.x + 20;   // 与右侧「设置」文字同一偏移，两枚胶囊内部结构对齐
  const nameMaxW = cb.x + cb.w - 12 - nameX;    // 右侧给铅笔图标留 12px
  let nameScale = fitTextScale(username, nameMaxW, 0.85);
  let nameStr = username;
  // fontStr 字号有 8px 下限，缩到极限后超长名字仍会溢出 —— 此时截断
  if (textWidth(nameStr, nameScale) > nameMaxW) {
    while (nameStr.length > 1 && textWidth(nameStr + '…', nameScale) > nameMaxW) {
      nameStr = nameStr.slice(0, -1);
    }
    nameStr += '…';
  }
  drawText(nameStr, nameX, cb.y + (cb.h - fontPx(nameScale)) / 2,
    cPulse > 0.5 ? '#eafcff' : '#bdefff', nameScale);

  // 铅笔图标：暗示"可点击改名"
  drawPencilIcon(cb.x + cb.w - 6, cb.y + cb.h / 2, 5,
    cPulse > 0.5 ? '#bdefff' : 'rgba(58, 209, 255, 0.75)');

  // ===== ② 指挥官：已并入左上角胶囊（见上方标题区），这里不再单独占一块 =====

  // ===== ③ 主行动区 =====
  // 内容区边角标记：把整屏"框"成一台装置。
  // 只在主菜单画（局内会挡战斗视野），且用极低透明度 ——
  // 它是骨架不是焦点，绝不能比按钮显眼
  // 装置边框用流动版：静止骨架 + 微光巡游，UI 上终于有"活的东西"
  frameCornersFlow(14, 118, W - 28, MENU_LAYOUT.footY + 27 - 118, 7, TH(), 0.22, 1, t);

  const sb = MENU_START_BTN;
  // 主推按钮：全屏唯一，视觉权重最高（见 drawActionButton 'primary'）
  drawActionButton(sb.x, sb.y, sb.w, sb.h, '开 始 游 戏', TH(), 'primary',
    { r: 10, fs: 1.3, speed: 3 });

  // ===== ④ 数据区 =====
  // 战绩卡改横排四张：原来 2x2 占 94px 高，是整屏拥挤的根源；
  // 横排只占一行（44px），省下的 50px 全部变成间隙和留白
  const sa = MENU_STATS_AREA;
  const cardH = MENU_LAYOUT._stH;
  // 分组标题栏：告诉玩家这四张卡是一组"战绩"。
  // 位于卡片上方 5px，占 gap 内部空间，不额外挤压纵向流
  panelHeader(sa.x, sa.y - 15, sa.w, '战 绩 监 护', '#5b7fa3');
  /* 监护仪：四项战绩 = 四个监测通道。
     历史序列只给"有走势可言"的三项（次数本身就是累计值，趋势无意义），
     它的通道由 pseudoWave 用数值生成确定性波形 —— 见该函数说明。 */
  const statItems = [
    ['次数', String(stats.gamesPlayed), '#8ab4d8', null],
    ['最高分', String(state.hi).padStart(6, '0'), '#ffd166', stats.histScore],
    ['波次', String(stats.maxWave), '#ff9f43', stats.histWave],
    ['击杀', String(stats.totalKills), '#4ade80', stats.histKills]
  ];
  drawMonitorPanel(sa.x, sa.y, sa.w, cardH, statItems);

  // ===== ⑤ 功能区：三个入口 =====
  const fy = MENU_FUNC_BTN[0].y;
  // 原来的居中标签 + 分隔线换成标题栏：靠左对齐才能和上方战绩区、
  // 下方页脚形成一致的左基线，居中反而和两侧脱节
  panelHeader(MENU_FUNC_BTN[0].x, fy - 16, MENU_FUNC_BTN[0].w, '功 能', '#5b7fa3');
  // 幽灵按钮：轻但有存在感。加书本图标（图标 + 文字并排比纯文字好认）
  const fb = MENU_FUNC_BTN[0];
  drawIconButton(fb.x, fb.y, fb.w, fb.h, '图 鉴 / 说 明', '#8ab4d8', 'ghost',
    (cx, cy) => drawBookIcon(cx, cy, 6, '#8ab4d8'),
    { r: 6, fs: 0.72, speed: 2.2 });

  // ===== ⑥ 页脚 =====
  let done = 0; for (const a of ACHIEVEMENTS) if (achievements[a.id]) done++;
  const footY = MENU_LAYOUT.footY;
  // 页脚也用标题栏起头，和战绩区、功能区共用同一套分组语言
  panelHeader(22, footY - 15, W - 44, '成 就 进 度', '#5b7fa3');
  // 成就进度条：与文字同排，比纯文字更像"进度"
  const fw2 = 90, fx2 = (W - fw2) / 2, fy2 = footY + 12;
  fillRoundRect(fx2, fy2, fw2, 3, 1.5, '#1e3549');
  const achW = fw2 * (done / ACHIEVEMENTS.length);
  fillRoundRect(fx2, fy2, achW, 3, 1.5, '#4ade80');
  // 流光只在已填充段跑：高光跑出填充区会让人误判进度
  drawBarSheen(fx2, fy2, achW, 3, '#ffffff', state.time, 0.22);
  drawTextCenter('成就 ' + done + '/' + ACHIEVEMENTS.length, footY, '#4ade80', 0.75);
  // 版权标识：右下角最底部一行。AGPL 要求保留版权声明
  drawTextRight('© 2026 B站UP主：慕雪QnQ · AGPL-3.0', W - 8, H - 13, '#2b4a66', 0.58);

}

/* 图鉴页容器：顶部两个 tab 切换"操作说明 / 武器图鉴"。
   原来这是两个并列入口的独立弹窗，既占主菜单两格又显得重复；
   合并后入口只有一个，内容靠 tab 组织。 */
function drawCodexPage() {
  pushModalAnim('codex');
  ctx.fillStyle = 'rgba(4, 8, 14, ' + (0.97 * Math.max(0, Math.min(1, animV('codex')))) + ')'; ctx.fillRect(0, 0, W, H);
  drawTextCenter('图 鉴', 12, TH(), 1.8);
  divider(32, TH(), 30);

  for (let i = 0; i < 2; i++) {
    const b = CODEX_TAB_BTN[i], m = CODEX_TABS[i];
    const on = codexPage.tab === i;
    panel(b.x, b.y, b.w, b.h, 6, {
      bg: on ? hexA(m.color, 0.18) : 'rgba(12, 24, 40, 0.85)',
      border: on ? m.color : hexA(m.color, 0.3), bw: on ? 1.6 : 1,
      glow: on ? m.color : null
    });
    drawTextCenter(m.text, b.y + (b.h - 7) / 2, on ? '#eafcff' : m.color, 0.78);
  }

  if (codexPage.tab === 0) drawHelpContent();
  else drawWeaponContent();

  const b = SET_BTN.back;
  panel(b.x, b.y, b.w, b.h, 8, { bg: THa(0.15), border: TH(), bw: 1.4 });
  drawTextCenter('点 击 返 回', b.y + 7, TH(), 0.95);
  popModalAnim();
}

/* 操作说明内容（tab 0）：只画内容，背景/标题/返回由 drawCodexPage 负责 */
function drawHelpContent() {
  const helpTexts = [
    { title: '电脑端操作：', color: '#ffd166', lines: ['W A S D / 方向键 移动', '空格 / 鼠标左键 射击（长按）', 'X 释放超载（冷却 30 秒）', '1-6 切换武器', '7 8 9 0 - 使用道具', 'P 暂停 / M 静音'] },
    { title: '手机端操作：', color: '#4ade80', lines: ['拖动屏幕 移动战机', '双击屏幕 释放超载', '点击底部图标 切换武器', '点击右侧格子 使用道具'] }
  ];
  let textY = 78;
  for (const group of helpTexts) {
    drawText(group.title, 26, textY, group.color, 1);
    textY += 18;
    for (const line of group.lines) {
      drawText('· ' + line, 30, textY, '#8ab4d8', 0.8);
      textY += 15;
    }
    textY += 10;
  }
}

/* 齿轮图标：外圈 + 8 个齿 + 中心孔，纯 Path 绘制。
   转速随呼吸做极缓慢摆动，静止时不转（转太快会像加载动画，反而误导）。 */
function drawGearIcon(cx, cy, r, color, rot) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot || 0);
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 1.2;

  // 齿：8 个小方块沿圆周分布
  const teeth = 8, tw = 2.2, th = 3.2;
  for (let i = 0; i < teeth; i++) {
    const a = (Math.PI * 2 / teeth) * i;
    const tx = Math.cos(a) * (r * 0.78), ty = Math.sin(a) * (r * 0.78);
    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(a);
    ctx.fillRect(-th / 2, -tw / 2, th, tw);
    ctx.restore();
  }
  // 外圈
  ctx.beginPath(); ctx.arc(0, 0, r * 0.66, 0, Math.PI * 2); ctx.stroke();
  // 中心孔
  ctx.beginPath(); ctx.arc(0, 0, r * 0.26, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

/* 书本图标：两页展开，用于"图鉴/说明"按钮。 */
function drawBookIcon(cx, cy, r, color) {
  ctx.save();
  ctx.fillStyle = color;
  const w = r * 1.5, h = r * 1.15, sp = r * 0.16;
  // 左页
  ctx.fillRect(cx - w / 2 - sp / 2, cy - h / 2, w / 2, h);
  // 右页
  ctx.fillRect(cx + sp / 2, cy - h / 2, w / 2, h);
  // 书脊
  ctx.fillRect(cx - sp / 2, cy - h / 2, sp, h);
  ctx.restore();
}

/* 铅笔图标：橡皮 + 笔身 + 笔尖，纯 Path 绘制。
   整体旋转 45° 让笔尖朝左下，符合常见"编辑"图标的书写方向。 */
function drawPencilIcon(cx, cy, r, color) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(Math.PI / 4);
  ctx.fillStyle = color;
  const w = r * 0.32, h = r * 1.05;
  const bodyTop = -h * 0.5, erasH = h * 0.16, tipBase = h * 0.10, tipY = h * 0.5;
  // 橡皮（顶部，半透明区分材质）
  ctx.globalAlpha = 0.55;
  ctx.fillRect(-w, bodyTop, w * 2, erasH);
  ctx.globalAlpha = 1;
  // 笔身
  ctx.fillRect(-w, bodyTop + erasH + 1, w * 2, tipBase - bodyTop - erasH - 1);
  // 笔尖
  ctx.beginPath();
  ctx.moveTo(-w, tipBase); ctx.lineTo(w, tipBase); ctx.lineTo(0, tipY);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* 武器图鉴页：六种武器单列大格。
   原来主菜单底部只有一排 18px 小图标格子，看不出各武器区别，
   现在每行显示 图标 + 名称 + 特性 + 射速 + 按键。 */
/* 武器图鉴内容（tab 1）：只画六行卡片，背景/标题/返回由 drawCodexPage 负责 */
/* 武器 tab 重做：原来六行"图标 + 描述 + 射速"，读完也不知道该选哪把。
   现在上半是六个武器选择格，下半是选中武器的六维雷达图 + 数值清单。
   雷达图让差异变成形状 —— 脉冲是射速尖刺、散射是覆盖扇形、激光是穿透长条，
   比逐行读文字快得多，也真正回答了"为什么选它"。 */
const CODEX_WEAPON_TABS = [];    // 六个选择格的命中区
function drawWeaponContent() {
  const n = WEAPON_COUNT;
  const sel = Math.max(0, Math.min(n - 1, codexPage.weaponSel | 0));
  const w = WEAPONS[sel], info = WEAPON_INFO[sel];
  const bottomLimit = SET_BTN.back.y - 12;
  const left = 22, contentW = W - 44;

  // --- ① 武器选择条：六个格子横排 ---
  const tabH = 30, tabGap = 4;
  const tabW = (contentW - (n - 1) * tabGap) / n;
  const tabY = 78;
  for (let i = 0; i < n; i++) {
    const x = left + i * (tabW + tabGap);
    CODEX_WEAPON_TABS[i] = { x: x, y: tabY, w: tabW, h: tabH };
    const wi = WEAPONS[i], act = i === sel;
    ctx.save();
    fillRoundRect(x, tabY, tabW, tabH, 5, act ? hexA(wi.color, 0.22) : 'rgba(10, 20, 34, 0.8)');
    strokeRoundRect(x + 0.5, tabY + 0.5, tabW - 1, tabH - 1, 5,
      hexA(wi.color, act ? 0.95 : 0.3), act ? 1.5 : 1);
    // 激活态底部实心条
    if (act) { ctx.fillStyle = wi.color; ctx.fillRect(x + 3, tabY + tabH - 2.5, tabW - 6, 1.5); }
    ctx.restore();
    const mic = getWeaponIcon(i, 18, act ? wi.color : hexA(wi.color, 0.55));
    ctx.drawImage(mic, Math.round(x + tabW / 2 - mic.width / 2), Math.round(tabY + 3));
    // 键位提示
    drawTextCenter2(info0Key(i), x + tabW / 2, tabY + 21,
      act ? '#eafcff' : '#3f5f7d', 0.55);
  }

  // --- ② 雷达图：居中，半径按剩余高度自适应 ---
  const infoTop = tabY + tabH + 6;
  const radarAreaH = Math.max(60, Math.min(120, bottomLimit - infoTop - 62));
  const radarCY = infoTop + radarAreaH / 2;
  const radarR = Math.max(26, Math.min(46, radarAreaH / 2 - 14));
  drawRadar(W / 2, radarCY, radarR, w.st, w.color, { labels: true });

  // --- ③ 选中武器信息：名称 + 特性 + 六维数值 ---
  const listY = infoTop + radarAreaH + 2;
  drawTextCenter(w.name, listY, w.color, 1.1);
  drawTextCenter(info.trait, listY + 12, '#8ab4d8', 0.62);
  // 射速仍给出真实值（cool 推出），比 0~5 的抽象分更具体
  drawTextCenter('射速 ' + (1 / w.cool).toFixed(1) + ' 发/秒 · 键 ' + info.key,
    listY + 22, '#5b7fa3', 0.6);

  // 六维数值：两列三行，与雷达图对应
  const rowH = 8.5, colX = [left + 4, left + contentW / 2 + 4];
  for (let i = 0; i < WSTAT_KEYS.length; i++) {
    const col = i % 2, row = Math.floor(i / 2);
    const v = w.st[WSTAT_KEYS[i]] || 0;
    const x = colX[col], y = listY + 32 + row * rowH;
    if (y + 7 > bottomLimit) break;
    drawText(WSTAT_LABELS[i], x, y, '#3f5f7d', 0.55);
    // 分值时用颜色深浅表达强弱，比纯数字更易扫
    drawTextRight(v + ' / ' + WSTAT_MAX, x + 52, y,
      v >= 4 ? w.color : (v >= 2 ? '#8ab4d8' : '#3f5f7d'), 0.6);
  }
}
function info0Key(i) { return WEAPON_INFO[i].key; }

/* 设置页：音量 / 静音 / 清除存档。
   原来音量条裸放在主菜单底部，既占地方又容易被误拖；收进设置页后主菜单清爽了。 */
function drawSetRow(y, label, fillRatio, opts) {
  /* 统一控件行：左侧标签 + 右侧实心填充条 + 状态色。
     所有"是/否""程度"类设置共用同一套视觉语言，不再各自为政。
     fillRatio ∈ [0,1]：0 = 关闭/最小，1 = 开启/最大。
     opts.muted：静音时整条走红色系；opts.color：自定义激活色。 */
  opts = opts || {};
  const C = SET_CTRL;
  const t = state.time;
  const x = C.LABEL.x, w = W - x * 2;
  /* 行高取传入的压缩值（矮屏上整栏被压扁）。
     原来这里直接读常量 C.ROW_H，和面板实际高度对不上 ——
     面板被压到 20px 时，控件仍按 30px 居中，文字和轨道会戳出面板上下边。 */
  const RH = opts.rowH || C.ROW_H;
  const H2 = C.TRACK_H, ty = y + (RH - 8) / 2;

  drawText(label, x + C.LABEL.pad, ty, '#5b7fa3', C.LABEL.scale);

  const tx = x + w - 86;                       // 文字基准 x
  const tw = textWidth('已开启', 0.75);

  ctx.save();
  ctx.globalAlpha = 0.55 + Math.sin(t * 1.6) * 0.12;
  ctx.fillStyle = 'rgba(8, 16, 28, 0.9)';
  fillRoundRect(tx - 8, y + (RH - H2 - 8) / 2, 78, H2 + 8, (H2 + 8) / 2, 'rgba(8, 16, 28, 0.9)');
  ctx.restore();

  // 轨道底色
  fillRoundRect(tx - 6, y + (RH - H2) / 2, 62, H2, H2 / 2, '#16283c');
  // 分段刻度：让"程度"可读
  for (let i = 1; i < 10; i++) {
    const sx = tx - 6 + (62 * i / 10);
    ctx.fillStyle = i / 10 <= fillRatio ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.35)';
    ctx.fillRect(sx - 0.5, y + (RH - H2) / 2 + 1, 1, H2 - 2);
  }
  // 填充
  const fw = Math.max(0, Math.min(1, fillRatio)) * 62;
  if (fw > 0.5) {
    let col = opts.color || TH();
    if (opts.muted) col = '#ff4d6d';
    fillRoundRect(tx - 6, y + (RH - H2) / 2, fw, H2, H2 / 2, hexA(col, 0.85));
    // 端点锐光：和血条、能量条同一语言
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = col;
    ctx.fillRect(tx - 6 + fw - H2, y + (RH - H2) / 2, H2, H2);
    ctx.restore();
  }
  // 状态文字：仅三种语义色，避免五颜六色
  let st, sc;
  if (opts.muted) { st = '已静音'; sc = '#ff4d6d'; }
  else if (opts.on) { st = '已开启'; sc = '#4ade80'; }
  else if (opts.off) { st = '已关闭'; sc = '#5b7fa3'; }
  else { st = '—'; sc = '#3f5f7d'; }
  drawText(st, tx + 62 - tw + 2, ty, sc, 0.75);
}

function drawSettingsPage() {
  pushModalAnim('settings');
  ctx.fillStyle = 'rgba(4, 8, 14, ' + (0.97 * Math.max(0, Math.min(1, animV('settings')))) + ')'; ctx.fillRect(0, 0, W, H);
  drawTextCenter('设 置', 14, '#ffd166', 1.8);
  divider(40, '#ffd166', 40);

  // --- 分区排布：左栏统计卡（只读） + 右栏控件行（可调） ---
  // 数据源：本机存档统计，与主菜单战绩卡同源但只取"历史累计"
  const statItems = [
    ['游戏次数', String(stats.gamesPlayed), '#8ab4d8', null],
    ['最高分', String(state.hi).padStart(6, '0'), '#ffd166', null],
    ['最高波次', String(stats.maxWave), '#ff9f43', null],
    ['总击杀', String(stats.totalKills), '#4ade80', null]
  ];
  const z = {}; for (const q of SET_ZONES) z[q.key] = q;
  const C = SET_CTRL;
  const y0 = drawSettingsStat(z.stat, statItems);       // 左栏：4 张累计统计卡
  drawSettingsControls(z, y0);                          // 右栏：控件行 + 主题色块
  popModalAnim();
}

/* 左栏：累计统计卡（只读）。
   主菜单战绩已改为监护屏（drawMonitorPanel），这里**仍用卡片**：
    设置页是只读存档统计，不是一台正在监测的仪器 —— 硬套监护仪会显得噪音过多。 */
function drawSettingsStat(zone, items) {
  const C = SET_CTRL;
  /* 标题栏高度也自适应：整区只有 ~58px（H=320，左栏被压到 26%）时，
     固定 22px 的标题栏 + 12px 内边距会吃掉 34px，只剩 24px 分给 4 张卡。
     高屏上 zone.h 足够大，min 取到 22，与原来完全一致 —— 只有矮屏才压缩。

     ⚠️ headerH 必须**先于** panelHeader 定义：下面那行要用 headerH 定位标题栏，
     而 const 存在暂时性死区（TDZ）—— 定义在引用之后会直接抛
     "Cannot access 'headerH' before initialization"，render() 当场中断，
     玩家看到的就是"设置页一片空白"。 */
  const headerH = Math.min(22, zone.h * 0.18);
  panel(22, zone.y, W - 44, zone.h, 8, { bg: 'rgba(10, 20, 34, 0.75)', border: 'rgba(90, 140, 180, 0.28)' });
  panelHeader(28, zone.y + Math.max(2, headerH * 0.3), W - 56, '本 机 数 据', '#5b7fa3');
  const padT = zone.y + headerH;
  const innerH = zone.h - headerH - 12;
  /* 卡片高度下限 32 → 16：32 的下限会让 4 张卡需要 140px，
     58px 的区里循环 break 后只剩 1 张，等于把统计信息全丢了。
     降到 16 后同样空间能放下 2 张；drawSetStatRow 内部 k 有 0.72 的下限保护，
     字号不会跟着缩到看不清。放不下的卡仍由下面的 break 丢弃，绝不溢出面板。 */
  const cardH = Math.max(16, (innerH - C.GAP * 3) / 4);
  const cardW = W - 44 - 24;            // 整行一张卡：标签在左，数值在右，比挤成四列更易读
  const baseX = 34;
  for (let i = 0; i < items.length; i++) {
    const y = padT + i * (cardH + C.GAP);
    if (y + cardH > zone.y + zone.h - 8) break;
    drawSetStatRow(baseX, y, cardW, cardH, items[i][0], items[i][1], items[i][2]);
  }
  return zone.y + zone.h + 8;           // 返回下一个可用 y，供右栏续接
}

/* 单行统计：标签暗压在左，数值亮浮在右，中间渐变线衔接。
   竖排四张卡比横排四列更适合"设置页里的附属信息"——它不该抢走整屏宽度。 */
function drawSetStatRow(x, y, w, h, label, value, color) {
  const k = Math.max(0.72, Math.min(1, h / 36));
  fillRoundRect(x, y, w, h, 6, 'rgba(10, 18, 30, 0.92)');
  strokeRoundRect(x + 0.5, y + 0.5, w - 1, h - 1, 6, hexA(color, 0.22), 1);
  // 左侧细色条（窄卡用顶部条，这里高度够用侧条）
  fillRoundRect(x + 4, y + h * 0.22, 2, h * 0.56, 1, color);
  const ls = 0.6 * k;
  drawText(label, x + 11, y + (h - fontPx(ls)) / 2, '#5b7fa3', ls);
  // 中间衔接线：标签与数值之间的"接缝"，避免左右两块脱节
  const gx = x + textWidth(label, ls) + 15;
  if (gx < x + w - 60) {
    const g = ctx.createLinearGradient(gx, 0, x + w - 60, 0);
    g.addColorStop(0, hexA(color, 0.35)); g.addColorStop(1, hexA(color, 0));
    ctx.fillStyle = g; ctx.fillRect(gx, y + h / 2 - 0.5, x + w - 60 - gx, 1);
  }
  const vs = 1.1 * k;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.2;
  const gs = getGlowSprite(color, 'volume');
  ctx.drawImage(gs, x + w - 12 - w * 0.36, y + h * 0.52 - 2, w * 0.72, fontPx(vs) * 1.6);
  ctx.restore();
  drawTextRight(value, x + w - 12, y + (h - fontPx(vs)) / 2, color, vs);
}

/* 拨动开关：布尔设置的正确控件。
   之前静音用填充条（drawSetRow）表达开/关 —— 那是"程度"的控件，
   拿来显示布尔值时，开和关两态长得几乎一样（满条 vs 空条），
   玩家既看不出当前状态，也看不出"这里可以点"。
   开关有三段结构：轨道 + 滑块 + 状态色，位置和颜色双重编码，一眼可读。 */
/* 滑块动画进度 0(关) → 1(开)，两个开关各持一份：
   共用一个变量会让它们互相"拽着走"—— 拨动静音时 FPS 的滑块也会跟着滑。 */
let muteSwK = 0, fpsSwK = 0;
/* 进度 k 由调用方传入，函数本身不持有状态。 */
function drawToggleSwitch(x, y, w, h, isOn, accent, k) {
  const col = isOn ? (accent || '#4ade80') : '#5b7fa3';
  const r = h / 2;
  // 轨道：开启时透出激活色底，关闭时是暗槽
  fillRoundRect(x, y, w, h, r, isOn ? hexA(col, 0.26) : 'rgba(8, 16, 28, 0.92)');
  strokeRoundRect(x + 0.5, y + 0.5, w - 1, h - 1, r,
    isOn ? col : 'rgba(90, 140, 180, 0.4)', isOn ? 1.4 : 1);

  const pad = Math.max(1.5, h * 0.16);
  const d = h - pad * 2;                       // 滑块直径
  const travel = Math.max(0, w - pad * 2 - d);
  const sx = x + pad + travel * (k === undefined ? (isOn ? 1 : 0) : k);
  // 滑块本体
  fillRoundRect(sx, y + pad, d, d, d / 2, isOn ? col : '#8ab4d8');
  if (isOn) {
    // 开启态加一点辉光，让"当前有效"这件事有存在感
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.35;
    const gs = getGlowSprite(col, 'halo');
    ctx.drawImage(gs, sx - d * 0.5, y + pad - d * 0.4, d * 2, d * 1.8);
    ctx.restore();
  }
}

/* 右栏：控件行 + 主题色块。
   静音用拨动开关，音量用可拖动填充条，FPS 用填充条；
   主题色块保留选中态外描边 + 内部扫描光带。 */
function drawSettingsControls(z, y0) {
  const C = SET_CTRL;
  const t = state.time;
  const muted = Audio.isMuted;
  const vol = muted ? 0 : Audio.volume;
  const on = { on: true }, off = { off: true };

  // --- 音效：静音开关 + 音量条 ---
  // 三行 y 直接取 setLayoutSettings 算好的 z.rows（排布只有一个真相来源）。
  // 兜底值仅在 z.rows 缺失时（异常布局）才用，正常路径不会走到。
  // 行 y 与行高直接取布局算好的 SET_RIGHT，绘制端不再另算一遍累加
  // （排布只应有一个真相来源）。兜底值仅在极端异常布局下才可能用到。
  const rowY = (SET_RIGHT.rows && SET_RIGHT.rows.length === 4)
    ? SET_RIGHT.rows : [y0, y0 + C.ROW_H + 4, y0 + (C.ROW_H + 4) * 2, y0 + (C.ROW_H + 4) * 3 + 6];
  // 行高也取压缩值：矮屏上行被压扁，面板必须跟着压，
  // 否则面板底会越过下一行的顶，三行糊成一坨。
  const rowH = SET_RIGHT.rowH || C.ROW_H;
  let y = rowY[0];
  /* 静音改成拨动开关：整行仍可点（触摸友好），但状态由右侧开关表达。
     静音是"危险态"，开启时整行走红 —— 开关本身也走红，双重提示。 */
  muteSwK += ((muted ? 1 : 0) - muteSwK) * Math.min(1, 0.25);   // 滑块缓动
  panel(22, y, W - 44, rowH, 6, {
    bg: muted ? 'rgba(255, 77, 109, 0.12)' : 'rgba(12, 24, 40, 0.8)',
    border: muted ? 'rgba(255, 77, 109, 0.6)' : 'rgba(90, 140, 180, 0.35)', bw: 1.2
  });
  {
    const C2 = SET_CTRL;
    const ty = y + (rowH - 8) / 2;
    drawText('静音', C2.LABEL.x + C2.LABEL.pad, ty, muted ? '#ff8fa3' : '#5b7fa3', C2.LABEL.scale);
    // 开关：贴右端，高度随行高压扁
    const swH = Math.max(9, Math.min(16, rowH - 10));
    const swW = Math.round(swH * 1.85);
    const swX = 22 + (W - 44) - 14 - swW;
    const swY = y + (rowH - swH) / 2;
    drawToggleSwitch(swX, swY, swW, swH, muted, '#ff4d6d', muteSwK);
    // 状态文字放开关左侧，避免和开关抢位置
    const stTxt = muted ? '已静音' : '开启';
    const stCol = muted ? '#ff4d6d' : '#4ade80';
    drawTextRight(stTxt, swX - 6, y + (rowH - fontPx(0.7)) / 2, stCol, 0.7);
  }
  y = rowY[1];
  panel(22, y, W - 44, rowH, 6, { bg: 'rgba(12, 24, 40, 0.8)', border: 'rgba(90, 140, 180, 0.35)', bw: 1.2 });
  drawSetRow(y, '音量', vol, { color: muted ? '#3f5f7d' : TH(), rowH: rowH });

  /* --- 画面：FPS 显示开关 ---
     与静音共用同一个 drawToggleSwitch，但**各持一份动画进度**（fpsSwK / muteSwK）：
     两个开关若共用一个进度变量，拨动其中一个时另一个的滑块会被"拽着走"。
     开启色用绿：FPS 是"信息增强"而非危险态，不该和静音的红色混淆。 */
  fpsSwK += ((showFps ? 1 : 0) - fpsSwK) * Math.min(1, 0.25);
  y = rowY[2];
  panel(22, y, W - 44, rowH, 6, {
    bg: showFps ? 'rgba(74, 222, 128, 0.1)' : 'rgba(12, 24, 40, 0.8)',
    border: showFps ? 'rgba(74, 222, 128, 0.6)' : 'rgba(90, 140, 180, 0.35)', bw: 1.2
  });
  {
    const C2 = SET_CTRL;
    const ty = y + (rowH - 8) / 2;
    drawText('FPS 显示', C2.LABEL.x + C2.LABEL.pad, ty, showFps ? '#8ef2b4' : '#5b7fa3', C2.LABEL.scale);
    const swH = Math.max(9, Math.min(16, rowH - 10));
    const swW = Math.round(swH * 1.85);
    const swX = 22 + (W - 44) - 14 - swW;
    const swY = y + (rowH - swH) / 2;
    drawToggleSwitch(swX, swY, swW, swH, showFps, '#4ade80', fpsSwK);
    // 状态文字：与静音行保持同一位置与语义色体系
    drawTextRight(showFps ? '已开启' : '已关闭', swX - 6,
      y + (rowH - fontPx(0.7)) / 2, showFps ? '#4ade80' : '#5b7fa3', 0.7);
  }

  /* --- 画面：画质档位（自动 / 低 / 中 / 高）---
     用分段按钮而不是拨动开关：三态以上用开关表达不清"当前是哪档"，
     分段按钮把四个选项全部摊开，一眼能看到"我在哪、还能选什么"。

     ⚠️ 分段矩形读 SET_BTN.qseg（布局算好的），不在这里现算 ——
     命中端读的是同一个矩形，两边各算一遍必然对不上，
     结果就是"点第二格选中的是第三格"。 */
  y = rowY[3];
  panel(22, y, W - 44, rowH, 6, {
    bg: qualityMode !== 0 ? 'rgba(58, 209, 255, 0.1)' : 'rgba(12, 24, 40, 0.8)',
    border: qualityMode !== 0 ? THa(0.6) : 'rgba(90, 140, 180, 0.35)', bw: 1.2
  });
  {
    const C2 = SET_CTRL;
    const ty = y + (rowH - 8) / 2;
    drawText('画质', C2.LABEL.x + C2.LABEL.pad, ty,
      qualityMode !== 0 ? TH() : '#5b7fa3', C2.LABEL.scale);
    for (let i = 0; i < QUALITY_MODES.length; i++) {
      const m = QUALITY_MODES[i], sg = SET_BTN.qseg[i], on = i === qualityMode;
      // 选中：主色实心 + 白字；未选中：暗底 + 灰字。四个都可见才叫"能选"
      fillRoundRect(sg.x, sg.y, sg.w, sg.h, 3, on ? THa(0.85) : 'rgba(10, 20, 34, 0.9)');
      strokeRoundRect(sg.x + 0.5, sg.y + 0.5, sg.w - 1, sg.h - 1, 3,
        on ? '#eafcff' : 'rgba(90, 140, 180, 0.32)', on ? 1.2 : 1);
      /* ⚠️ drawTextCenter2 的签名是 (text, cx, y, ...) —— 中心 x 在前、y 在后。
         上一版把两个参数写反了，文字被画到 x=段y、y=段x 的位置，
         跑到屏幕外，四个档位看着就是四个空方块，完全分不清哪个是高哪个是低。 */
      const fs2 = Math.min(0.7, (sg.w - 3) / (m.name.length * 5.2));
      drawTextCenter2(m.name, sg.x + sg.w / 2, sg.y + (sg.h - fontPx(fs2)) / 2,
        on ? '#04121c' : '#8ab4d8', fs2);
    }
  }

  // --- 主题色：六个预设，选中态描边 + 扫描光带 + 名称高亮 ---
  // 面板 y 用 z.theme.y，与主题色块（setLayoutSettings 按 z.theme.y 排）严格对齐
  y = z.theme.y;
  panel(22, y, W - 44, z.theme.h, 8, { bg: 'rgba(10, 20, 34, 0.75)', border: 'rgba(90, 140, 180, 0.28)' });
  panelHeader(28, y + 6, W - 56, '主 题 色', '#5b7fa3');
  for (let i = 0; i < THEMES.length; i++) {
    const sw = SET_BTN.theme[i], th = THEMES[i], on = i === themeIdx;
    // 选中：外描边 2px + 内部扫描光带 + 名称亮色；未选中：细边 + 暗名
    panel(sw.x, sw.y, sw.w, sw.h, 6, {
      bg: on ? hexA(th.color, 0.24) : 'rgba(12, 24, 40, 0.8)',
      border: th.color, bw: on ? 2 : 1
    });
    if (on) {
      scanSweep(sw.x, sw.y, sw.w, sw.h, 6, t * 0.35, th.color, 0.18);
      // 外发光：选中色块"浮"起来
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.28;
      const gs = getGlowSprite(th.color, 'halo');
      ctx.drawImage(gs, sw.x - sw.w * 0.18, sw.y - sw.h * 0.5, sw.w * 1.36, sw.h * 2.0);
      ctx.restore();
    }
    ctx.fillStyle = th.color;
    ctx.beginPath(); ctx.arc(sw.x + 10, sw.y + sw.h / 2, 3.5, 0, Math.PI * 2); ctx.fill();
    drawText(th.name, sw.x + 18, sw.y + sw.h / 2 - 4,
      on ? '#eafcff' : '#6b8aa8', Math.min(0.62, sw.w / 60));
  }

  // --- 数据：清除本地存档（危险操作） ---
  const rb = SET_BTN.reset;
  panel(rb.x, rb.y, rb.w, rb.h, 6, {
    bg: resetConfirm ? 'rgba(255, 77, 109, 0.18)' : 'rgba(12, 24, 40, 0.8)',
    border: resetConfirm ? '#ff4d6d' : 'rgba(90, 140, 180, 0.35)', bw: resetConfirm ? 1.8 : 1.2
  });
  /* 副说明删掉后主文字垂直居中：原来 y+7 是给第二行留的位置，
     现在只有一行，不居中会贴着按钮顶部显得空。 */
  drawTextCenter2(resetConfirm ? '再点一次确认清除' : '清除本地存档',
    rb.x + rb.w / 2, rb.y + (rb.h - fontPx(0.8)) / 2,
    resetConfirm ? '#ff4d6d' : '#8ab4d8', 0.8);

  // --- 关于 ---
  /* 页脚 y 必须跟随清除行，不能写死 H-62。
     清除行的 y 是跟着返回按钮浮动的（矮屏整页压缩时它会整体上移），
     写死的页脚会在**所有分辨率**下都压进清除行里：
     H=320 时页脚 258 / 清除行 261~278，H=520 时 458 / 452~478 —— 必然重叠。
     现在钉在清除行上方，并让主题区让出这段高度（见 setLayoutSettings 的 FOOTER_H）。 */
  drawTextCenter('AGPL-3.0 开源 · 单文件零依赖', rb.y - 14, '#2b4a66', 0.6);

  const b = SET_BTN.back;
  panel(b.x, b.y, b.w, b.h, 8, { bg: THa(0.15), border: TH(), bw: 1.4 });
  drawTextCenter('点 击 返 回', b.y + 7, TH(), 0.95);
}

/* 游戏结束界面：分阶段揭示
   0.0-0.9s 死亡定格（残影消散，世界还在）
   0.9s     标题从上方砸入 + 屏震
   1.1s     分隔线展开
   1.3s     分数放大定格（带发光）
   1.7s     纪录判定
   2.0s+    四张数据卡依次弹入
   2.8s+    成就进度条生长
   3.2s+    重试按钮呼吸出现
   信息不再一次性砸出来，玩家有时间逐项消化 */
function drawGameOver() {
  const T = goAnim;
  // 阶段 0：定格期仍能看到战场，之后才压暗
  const dim = Math.min(1, Math.max(0, (T - 0.25) / 0.9));
  ctx.fillStyle = 'rgba(4, 8, 14, ' + (0.35 + dim * 0.6) + ')'; ctx.fillRect(0, 0, W, H);

  const glowGrad = ctx.createRadialGradient(W / 2, 46, 0, W / 2, 46, 130);
  glowGrad.addColorStop(0, 'rgba(255, 77, 109, ' + (0.3 * dim) + ')');
  glowGrad.addColorStop(1, 'rgba(255, 77, 109, 0)');
  ctx.fillStyle = glowGrad; ctx.fillRect(0, 0, W, 160);

  // 死亡定格：残影在原位置缓慢放大消散
  if (deathT > 0) {
    const k = deathT / 0.9;
    ctx.save();
    ctx.globalAlpha = k * 0.85;
    ctx.translate(player.x, player.y);
    ctx.scale(1 + (1 - k) * 0.8, 1 + (1 - k) * 0.8);
    ctx.drawImage(SPR.player, -4, -4);
    ctx.globalAlpha = k * 0.4;
    ctx.drawImage(SPR.playerWhite || SPR.player, -4, -4);
    ctx.restore();
  }
  if (T < 0.55) return;                       // 定格期不显示结算 UI

  const easeOut = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);

  // --- 标题砸入 ---
  const tIn = easeOut((T - 0.55) / 0.35);
  const titleY = 40 - (1 - tIn) * 34;
  ctx.save();
  ctx.globalAlpha = tIn;
  ctx.shadowBlur = 16; ctx.shadowColor = '#ff4d6d';
  drawTextCenter('游 戏 结 束', titleY, '#ff4d6d', 2.4 * (0.85 + tIn * 0.15));
  ctx.restore();

  // --- 分隔线展开 ---
  if (T > 0.9) {
    const lw = easeOut((T - 0.9) / 0.4) * (W - 80);
    const g = ctx.createLinearGradient(W / 2 - lw / 2, 0, W / 2 + lw / 2, 0);
    g.addColorStop(0, 'rgba(255, 77, 109, 0)');
    g.addColorStop(0.5, 'rgba(255, 77, 109, 0.8)');
    g.addColorStop(1, 'rgba(255, 77, 109, 0)');
    ctx.fillStyle = g; ctx.fillRect(W / 2 - lw / 2, 74, lw, 1);
  }

  // --- 分数放大定格 ---
  // 分数卡的高度按"实际字号"算出来，而不是写死 —— 之前写死 34px，
  // 而分数字号最大 2.8（≈25px）从 y=106 起算，底部到 131，直接捅出边框
  const scoreStr = String(state.score).padStart(6, '0');
  const scoreCardY = 84;
  let scoreCardH = 0;

  if (T > 1.05) {
    const sIn = easeOut((T - 1.05) / 0.45);
    ctx.save(); ctx.globalAlpha = sIn;
    drawTextCenter('本 局 分 数', 90, '#5b7fa3', 0.85);
    // 宽度自适应：位数变多时自动缩字，绝不撑破卡片或屏幕
    const sScale = fitTextScale(scoreStr, W - 56, 2.2 + sIn * 0.6);
    ctx.shadowBlur = 15; ctx.shadowColor = TH();
    drawTextCenter(scoreStr, 104, '#eafcff', sScale);
    ctx.restore();
    scoreCardH = (104 + fontPx(sScale) + 7) - scoreCardY;
  }

  // --- 纪录判定 ---
  if (T > 1.45) {
    const isNew = state.score >= state.hi && state.score > 0;

    // 分数卡边框：新纪录金色闪烁，否则低调描边。高度跟随实际文字，不会再露出去
    if (scoreCardH > 0) {
      ctx.save();
      if (isNew) {
        ctx.globalAlpha = 0.35 + Math.sin(state.time * 5) * 0.2;
        strokeRoundRect(20.5, scoreCardY + 0.5, W - 41, scoreCardH - 1, 8, '#ffd166', 1.2);
      } else {
        ctx.globalAlpha = 0.5;
        strokeRoundRect(20.5, scoreCardY + 0.5, W - 41, scoreCardH - 1, 8, 'rgba(90, 140, 180, 0.3)', 1);
      }
      ctx.restore();
    }

    const recY = scoreCardY + scoreCardH + 5;
    if (isNew) {
      if (Math.floor(state.time * 3) % 2 === 0) {
        ctx.save(); ctx.shadowBlur = 12; ctx.shadowColor = '#ffd166';
        drawTextCenter('★ 新 纪 录 ★', recY, '#ffd166', 1.1);
        ctx.restore();
      }
    } else {
      drawTextCenter('历史最高 ' + String(state.hi).padStart(6, '0'), recY, '#3f5f7d', 0.9);
    }
  }

  /* --- 分段评级（插在分数与数据卡之间）---
     单一分数没有成就感也没法指导改进。五维评级让玩家记住
     "生存 S、效率 B"，然后针对性再开一局 —— 这是留存的关键。 */
  const dims = gradeDims(state.wave, runKills, runTime, ultUses, maxCombo);
  const total = gradeTotal(dims);
  const letter = gradeLetter(total);
  const gCol = GRADE_COLOR[letter];

  const grY = 152;
  if (T > 1.55) {
    const k = easeOut((T - 1.55) / 0.45);
    ctx.save(); ctx.globalAlpha = k;
    // 综合评级：大字 + 发光，是这一屏的第二个视觉高潮（第一个是分数）
    drawText('综合评级', 22, grY + 6, '#5b7fa3', 0.72);
    ctx.save();
    ctx.shadowBlur = 10; ctx.shadowColor = gCol;
    drawTextRight(letter, W - 22, grY - 2, gCol, 2.0);
    ctx.restore();
    // 总评进度条：给出"离下一档还差多少"的直觉
    const gbY = grY + 30, gbW = W - 44;
    fillRoundRect(22, gbY, gbW, 3, 1.5, '#1e3549');
    fillRoundRect(22, gbY, Math.max(2, gbW * total * k), 3, 1.5, gCol);
    drawBarSheen(22, gbY, Math.max(2, gbW * total * k), 3, '#ffffff', state.time, 0.3);
    ctx.restore();
  }

  // --- 五维评级：一行五个小格 ---
  const dimY = grY + 40;
  if (T > 1.75) {
    const dw = 30, dh = 34, dgap = 4;
    const dx0 = (W - (GRADE_DIMS.length * dw + (GRADE_DIMS.length - 1) * dgap)) / 2;
    for (let i = 0; i < GRADE_DIMS.length; i++) {
      const delay = 1.75 + i * 0.08;
      if (T < delay) continue;
      const k = easeOut((T - delay) / 0.3);
      const d = GRADE_DIMS[i];
      const lv = gradeLetter(dims[d.id]);
      const lc = GRADE_COLOR[lv];
      const x = dx0 + i * (dw + dgap), y = dimY + (1 - k) * 10;
      ctx.save(); ctx.globalAlpha = k;
      panel(x, y, dw, dh, 5, { bg: 'rgba(12, 24, 40, 0.9)', border: hexA(lc, 0.4), bw: 1 });
      drawTextCenter2(d.label, x + dw / 2, y + 4, '#5b7fa3', 0.55);
      drawTextCenter2(lv, x + dw / 2, y + 13, lc, 1.15);
      ctx.restore();
    }
  }

  // --- 数据卡：改一行四张（原来 2x2 占 94px，一行只占 38px）---
  const cw = (W - 44 - 10 * 3) / 4, ch = 38, gap = 10, cx0 = 22, cy0 = dimY + 42;
  const cards = [
    { label: '到达波次', value: String(state.wave),              color: TH() },
    { label: '最高连击', value: 'X' + maxCombo,                  color: '#ffd166' },
    { label: '本局击杀', value: String(runKills),                color: '#4ade80' },
    { label: '获得金币', value: String(state.coins),             color: '#ffd166' }
  ];
  for (let i = 0; i < cards.length; i++) {
    const delay = 1.9 + i * 0.12;
    if (T < delay) continue;
    const k = easeOut((T - delay) / 0.35);
    const c = cards[i];
    // 一行四张：col = i，不再有 row
    const x = cx0 + i * (cw + gap), y = cy0 + (1 - k) * 12;
    ctx.save(); ctx.globalAlpha = k;
    panel(x, y, cw, ch, 6, { bg: 'rgba(12, 24, 40, 0.92)', border: hexA(c.color, 0.35), bw: 1.2 });
    // 窄卡用顶部细色条代替左侧竖条（左侧竖条会吃掉横向空间）
    fillRoundRect(x + 4, y + 3, Math.max(3, cw - 8), 2, 1, c.color);
    // 标签与数值都按卡宽自动缩字，绝不撑破窄卡
    const lsc = Math.min(0.62, (cw - 6) / (String(c.label).length * 5.0));
    const vsc = Math.min(1.05, (cw - 6) / (String(c.value).length * 5.0));
    drawText(c.label, x + 3, y + 8, '#5b7fa3', lsc);
    drawText(c.value, x + 3, y + 19, c.color, vsc);
    ctx.restore();
  }

  // --- 成就进度条生长 ---
  const achY = cy0 + ch + 10;
  if (T > 2.5) {
    let done = 0; for (const a of ACHIEVEMENTS) if (achievements[a.id]) done++;
    const k = easeOut((T - 2.5) / 0.6);
    ctx.save(); ctx.globalAlpha = Math.min(1, k * 1.4);
    drawText('成就进度', 22, achY, '#5b7fa3', 0.85);
    drawTextRight(done + ' / ' + ACHIEVEMENTS.length, W - 22, achY, '#4ade80', 0.85);
    fillRoundRect(22, achY + 14, W - 44, 4, 2, '#1e3549');
    fillRoundRect(22, achY + 14, (W - 44) * (done / ACHIEVEMENTS.length) * k, 4, 2, '#4ade80');
    ctx.restore();
  }

  // --- 对比上局：涨绿跌红，让玩家知道这局打得比上次好还是差 ---
  const cmpY = achY + 26;
  // 矮屏（H<400）隐藏"对比上局"：它是锦上添花，不能挤掉重试按钮。
  // 结算页核心是分数 + 评级 + 数据，对比可以没有
  if (T > 2.7 && H >= 400) {
    const k = easeOut((T - 2.7) / 0.5);
    ctx.save(); ctx.globalAlpha = k;
    panel(16, cmpY, W - 32, 46, 8, { bg: 'rgba(10, 20, 34, 0.72)', border: 'rgba(90, 140, 180, 0.28)' });
    drawText('对 比 上 局', 24, cmpY + 5, '#8ab4d8', 0.72);
    divider(cmpY + 17, '#3f5f7d', 24);

    const diffs = [
      ['分数', runDiff(state.score, prevRun && prevRun.score)],
      ['波次', runDiff(state.wave, prevRun && prevRun.wave)],
      ['击杀', runDiff(runKills, prevRun && prevRun.kills)],
      ['连击', runDiff(maxCombo, prevRun && prevRun.combo)]
    ];
    const colX2 = [26, 128], rowH2 = 12, top2 = cmpY + 21;
    for (let i = 0; i < diffs.length; i++) {
      const col = i % 2, row = Math.floor(i / 2);
      const x = colX2[col], y = top2 + row * rowH2;
      drawText(diffs[i][0], x, y, '#3f5f7d', 0.62);
      drawTextRight(diffs[i][1].t, x + 84, y, diffs[i][1].c, 0.7);
    }
    ctx.restore();
  }

  // --- 重试按钮：呼吸 + 扫描高光，3.2s 后才出现（避免死亡瞬间误触重开）---
  if (T > 3.2) {
    const k = easeOut((T - 3.2) / 0.4);
    const btnW = 150, btnH = 36, btnX = (W - btnW) / 2, btnY = H - 65;
    const pulse = 0.5 + Math.sin(state.time * 3) * 0.5;
    ctx.save(); ctx.globalAlpha = k;
    ctx.shadowBlur = 12; ctx.shadowColor = TH();
    panel(btnX, btnY, btnW, btnH, 10, { bg: 'rgba(58, 209, 255, ' + (0.14 + pulse * 0.12) + ')', border: '#3ad1ff', bw: 1.8 });
    ctx.restore();
    scanSweep(btnX, btnY, btnW, btnH, 10, state.time * 0.45, '#ffffff', 0.25);
    ctx.save(); ctx.globalAlpha = k;
    drawTextCenter(isTouch ? '点击屏幕重试' : '按空格 / 点击重试', btnY + 10, '#eafcff', 1.05);
    ctx.restore();
  }
}

/* ==================================================================
   暂停菜单
   ================================================================== */
function drawPauseMenuButton(btn, text, textColor, bgColor, strokeColor, textScale) {
  // 呼吸高亮：主按钮（继续）幅度大、其余小，主次分明
  const pulse = 0.5 + Math.sin(state.time * (text === '继 续 游 戏' ? 3 : 1.8)) * 0.5;
  const primary = text === '继 续 游 戏';
  fillRoundRect(btn.x, btn.y, btn.w, btn.h, 8, bgColor);
  strokeRoundRect(btn.x + 0.5, btn.y + 0.5, btn.w - 1, btn.h - 1, 8,
    strokeColor, primary ? 1.4 + pulse * 0.8 : 1.4);
  if (primary) scanSweep(btn.x, btn.y, btn.w, btn.h, 8, state.time * 0.4, '#ffffff', 0.16 + pulse * 0.1);
  drawTextCenter(text, btn.y + (btn.h - 11) / 2, textColor, textScale || 1);
}

function drawPause() {
  /* 暂停遮罩：0.94 实色 → 0.78 半透明，且**随入场动画渐暗**。
     之前是全屏近乎全黑的实色，一帧盖死 —— 玩家看到的是"画面突然黑了"，
     而不是"菜单滑进来了"，后面那套 0.35s 入场动画等于白做。
     现在保留 22% 的战场可见度：能看清为什么暂停（弹幕到哪了 / 该换武器了），
     动画也有了层次。浓度再乘 ease，让"暗下来"本身成为过渡的一部分。
     ⚠️ 浓度不能低于 0.7：再透，8 格战况数据的浅色文字会压在弹幕上看不清。 */
  const ptIn = Math.min(1, Math.max(0, pauseT));
  const easeIn = 1 - Math.pow(1 - ptIn, 3);
  ctx.fillStyle = 'rgba(4, 8, 14, ' + (0.78 * easeIn) + ')'; ctx.fillRect(0, 0, W, H);

  // 子页面打开时整页让出，避免两层信息叠在一起
  if (settingsPageActive) { drawSettingsPage(); return; }
  if (achPageActive) { drawAchPage(); return; }

  const glowGrad = ctx.createRadialGradient(W / 2, 40, 0, W / 2, 40, 120);
  glowGrad.addColorStop(0, hexA(TH(), 0.2 * easeIn));
  glowGrad.addColorStop(1, hexA(TH(), 0));
  ctx.fillStyle = glowGrad; ctx.fillRect(0, 0, W, 150);

  /* 标题随动画下沉淡入，字号 2.0 → 1.7。
     2.0 在 240px 宽的画布上顶到边，"暂停中"三个字撑满整行反而压迫；
     1.7 留出两侧呼吸，也更符合它"状态提示"而非"主标题"的定位。 */
  ctx.save();
  ctx.globalAlpha = easeIn;
  ctx.translate(0, (1 - easeIn) * -12);
  drawTextCenter('暂 停 中', 16, TH(), 1.7);
  ctx.restore();
  /* ⚠️ divider 的第 2 个参数必须是 **hex**（'#3ad1ff'），不能传 hexA() 的结果。
     divider 内部自己会调 hexA(color, 0 / 0.7) 生成渐变端点，
     传进 rgba 字符串会被二次解析：'rgba(58,209,255,0.5)'.slice(1,3)='gb'→NaN，
     得到 'rgba(NaN,10,88,0)' —— 浏览器 addColorStop 收到非法颜色直接抛
     SyntaxError，drawPause 当场中断，结果就是"只剩标题、面板和按钮全没了"。
     淡入改用 globalAlpha，效果等价且不碰颜色格式。 */
  ctx.save();
  ctx.globalAlpha = easeIn;
  divider(46, TH(), 40);
  ctx.restore();

  /* ===== 战术面板 =====
     之前是五个等大长方形一字排开 —— 那是"功能列表"不是"暂停菜单"，
     玩家要花时间找"继续"。现在所有内容装进一整块面板（装置边框 + 标题栏），
     像座舱里拉下来的一块战术数据板：
