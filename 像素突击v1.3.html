    if (s.life <= 0) swapRemove(sparks, i);
  }
}
function updateEmbers(dt) {
  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i]; e.life -= dt;
    if (e.life <= 0) { swapRemove(embers, i); continue; }
    e.x += e.vx * dt; e.y += e.vy * dt;
    e.vx *= 0.97; e.vy *= 0.97; e.vy += 8 * dt;   // 几乎无重力，缓慢飘
  }
}
function drawFlashes() {
  if (!flashes.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const f of flashes) {
    const p = 1 - f.life / f.max;                  // 0→1
    const a = Math.max(0, 1 - p);                  // 快速衰减
    const d = f.r * (0.5 + p * 1.8);               // 同时膨胀
    ctx.globalAlpha = a * 0.9;
    const gs = getGlowSprite(f.color, 'spark'), dd = d * 2;
    ctx.drawImage(gs, f.x - dd / 2, f.y - dd / 2, dd, dd);
    ctx.globalAlpha = a;                           // 中心白核
    const gw = getGlowSprite('#ffffff'), dw = d * 0.9;
    ctx.drawImage(gw, f.x - dw / 2, f.y - dw / 2, dw, dw);
    // 色差双环：红/青各偏移 1~2px 描一圈，是"高级感"最廉价的做法。
    // 只在膨胀中段（p 0.35~0.9）画，出现得太早或太晚都看不出来
    if (p > 0.3 && p < 0.95 && d > 4) {
      const off = 1 + (1 - p) * 1.8;
      ctx.globalAlpha = a * 0.55;
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = '#ff2060';
      ctx.beginPath(); ctx.arc(f.x - off, f.y, d, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#20e0ff';
      ctx.beginPath(); ctx.arc(f.x + off, f.y, d, 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.restore();
}
function drawSparks() {
  if (!sparks.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const s of sparks) {
    const a = Math.max(0, s.life / s.max);
    const L = s.len * (0.4 + a * 0.6);             // 收缩
    ctx.globalAlpha = a;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 1 + a * 0.8;
    // 六芒星：3 条主轴双向辐射，比两条线的十字更像迸溅
    ctx.lineWidth = 1.2 + a * 1.2;
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const ang = s.ang + (Math.PI / 3) * i;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      // 三条主轴长度不等，避免过于规整像雪花
      const l = L * (i === 0 ? 1 : (i === 1 ? 0.8 : 0.6));
      ctx.moveTo(s.x - ca * l, s.y - sa * l);
      ctx.lineTo(s.x + ca * l, s.y + sa * l);
    }
    ctx.stroke();
    // 微环：一圈快速收缩的细环，给星芒一个"收束"的尾巴
    const rr = L * (1 - a) * 0.9 + 1;
    ctx.globalAlpha = a * 0.6;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(s.x, s.y, rr, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}
function drawEmbers() {
  if (!embers.length) return;
  ctx.save();
  for (const e of embers) {
    const a = Math.max(0, e.life / e.max);
    // 余烬不发光，只是暗色余味；加一点点闪烁模拟火星明灭，
    // 后期渐隐到几乎透明（用 e.seed 让每颗闪的相位不同，避免同步闪烁）
    const tw = 0.72 + Math.sin(state.time * 9 + e.seed) * 0.28;
    ctx.globalAlpha = a * a * 0.55 * tw;
    ctx.fillStyle = e.color;
    const s = Math.max(1, Math.round(e.size));
    ctx.fillRect(Math.round(e.x), Math.round(e.y), s, s);
  }
  ctx.restore();
}

// kind: 'score' 普通得分 / 'crit' 暴击 / 'kill' 击杀
function addFloatText(x, y, text, color, scale = 1, kind = 'score') {
  if (floatTexts.length > 40) floatTexts.shift();
  floatTexts.push({ x, y, text: String(text), color, scale, kind, life: 0.6, max: 0.6, vy: -42 });
}
// delay：延迟出发（副环用）；椭圆略扁模拟透视，比正圆更有空间感
function addShockwave(x, y, color, power = 1, speed = 90, delay = 0) {
  if (shockwaves.length > 40) return;
  shockwaves.push({
    x, y, color, r: 3, delay: delay || 0,
    maxR: 14 + Math.min(44, power * 0.5 + speed * 0.08),
    life: 0.35 + (delay || 0), max: 0.35 + (delay || 0),
    spin: Math.random() * Math.PI * 2
  });
}
function updateShockwaves(dt) {
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const s = shockwaves[i]; s.life -= dt;
    if (s.life <= 0) { swapRemove(shockwaves, i); continue; }
    const p = 1 - Math.max(0, s.life - s.delay) / s.max;
    s.r = s.maxR * (1 - Math.pow(1 - Math.max(0, p), 3));
  }
}
function drawShockwaves() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const s of shockwaves) {
    if (s.life - s.delay <= 0) continue;             // 延迟未到，不画
    const a = Math.max(0, (s.life - s.delay) / s.max) * 0.8;
    const rx = Math.round(s.r), ry = Math.round(s.r * 0.82);   // 略扁
    if (rx <= 0) continue;
    ctx.globalAlpha = a;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2 + a * 2;
    ctx.beginPath(); ctx.ellipse(Math.round(s.x), Math.round(s.y), rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
    // 外沿亮边：让环有"厚度"，而不是一根细线
    ctx.globalAlpha = a * 0.5;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(Math.round(s.x), Math.round(s.y), Math.max(1, rx - 1), Math.max(1, ry - 1), 0, 0, Math.PI * 2); ctx.stroke();
    // 辐条：环上长出几根短刺 + 整体缓慢自转，环不再是一根"光秃秃的线"。
    // 只在环够大时画（小爆炸省掉，避免弹幕密集时满屏刺）
    if (rx > 16) {
      const spokes = 8;
      const rot = s.spin + rx * 0.012;
      ctx.globalAlpha = a * 0.4;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < spokes; i++) {
        const ang = rot + (Math.PI * 2 / spokes) * i;
        const ca = Math.cos(ang), sa = Math.sin(ang);
        const r0 = rx * 0.94, r1 = rx * 1.14;
        ctx.moveTo(s.x + ca * r0, s.y + sa * r0 * 0.82);
        ctx.lineTo(s.x + ca * r1, s.y + sa * r1 * 0.82);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = Math.max(0, a * 0.25);
    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.ellipse(Math.round(s.x), Math.round(s.y), Math.max(1, Math.round(s.r * 0.85)), Math.max(1, Math.round(s.r * 0.85 * 0.82)), 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

/* ==================================================================
   射击
   ================================================================== */
function shoot() {
  runShots++;          // 命中率分母：发射一发计数一次（散射按实际弹丸数更准，见下）
  if (player.cool > 0) return;
  const w = WEAPONS[player.weapon]; player.cool = w.cool;
  const x = player.x, y = player.y - 5, lv = player.power;
  if (particles.length < particleCap()) {
    for (let i = 0; i < 2; i++) {
      particles.push({
        x: x + (Math.random() - 0.5) * 3, y: y - 2,
        vx: (Math.random() - 0.5) * 26, vy: -36 - Math.random() * 42,
        life: 0.1 + Math.random() * 0.12, max: 0.22,
        color: w.color || '#7be9ff', size: 2, glow: true
      });
    }
  }
  /* 枪口闪光放在武器分支**之前**统一触发：六种武器都需要，
     写进各自 case 会重复六遍且容易漏。位置在机头 ——
     与子弹出生点同一处，视觉上才对得上"从这里打出去"。 */
  if (quality >= 0.5) spawnMuzzle(x, y - 2, w.color || '#7be9ff', 1);

  switch (player.weapon) {
    case 0: {
      const crit = Math.random() < 0.15;
      const push = (dx, dy) => bullets.push({ x: x + dx, y: y + dy, vx: 0, vy: -355, dmg: 1, crit });
      if (lv === 1) push(0, 0); else if (lv === 2) { push(-3, 0); push(3, 0); }
      else if (lv === 3) { push(0, -3); push(-4, 1); push(4, 1); }
      else { push(-4, -1); push(-1.5, -3); push(1.5, -3); push(4, -1); }
      Audio.play(760 + lv * 40, 0.045, 'square', 0.018, 420, 'player'); break;
    }
    case 1:
      bullets.push({ x, y, vx: 0, vy: -430, dmg: 6, pierce: true, laser: true, hitIds: new Set(), crit: Math.random() < 0.20 });
      Audio.play(320, 0.08, 'sawtooth', 0.025, 180, 'player'); break;
    case 2: {
      const crit = Math.random() < 0.22; const n = 3 + Math.min(2, lv - 1);
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (i - (n - 1) / 2) * 0.25;
        bullets.push({ x, y, vx: Math.cos(a) * 300, vy: Math.sin(a) * 300, dmg: 1, crit, scatter: true });
      }
      Audio.play(500, 0.04, 'square', 0.014, 300, 'player'); break;
    }
    case 3: {
      const n = 1 + Math.min(1, Math.floor((lv - 1) / 2));
      for (let i = 0; i < n; i++) {
        const off = n === 1 ? 0 : (i - 0.5) * 10;
        bullets.push({ x: x + off, y, vx: off * 3, vy: -150, dmg: 5, homing: true, target: null, life: 2.6, crit: false });
      }
      Audio.play(300, 0.1, 'triangle', 0.026, 520, 'player'); break;
    }
    case 4: fireArc(x, y, 1 + Math.floor(lv / 2), 2); Audio.play(880, 0.06, 'sawtooth', 0.03, 400, 'player'); break;
    case 5: {
      for (let i = 0; i < player.boomCount; i++) {
        const crit = Math.random() < 0.18;
        const off = player.boomCount === 1 ? 0 : (i - (player.boomCount - 1) / 2) * 8;
        bullets.push({ x: x + off, y, vx: off * 2, vy: -320, dmg: 5, boomerang: true, t: 0, phase: 'out', hitIds: new Set(), crit });
      }
      Audio.play(420, 0.12, 'triangle', 0.03, 720, 'player'); break;
    }
  }
  // 散射道具：额外发射两发偏角弹（独立于当前武器）
  if (player.spread > 0) {
    for (const a of [-0.24, 0.24]) {
      bullets.push({
        x, y,
        vx: Math.sin(a) * 300,
        vy: -Math.cos(a) * 300,
        dmg: 1, crit: false, spreadShot: true
      });
    }
  }
}

function fireArc(sx, sy, maxJumps, baseDmg) {
  const hit = new Set(); let cx = sx, cy = sy; const pts = [{ x: cx, y: cy }]; let dmg = baseDmg;
  for (let j = 0; j <= maxJumps; j++) {
    let best = null, bd = Infinity;
    for (const e of enemies) {
      if (hit.has(e.id)) continue;
      const d = (e.x - cx) ** 2 + (e.y - cy) ** 2;
      if (d < bd) { bd = d; best = e; }
    }
    let isBoss = false;
    if (boss && !boss.entering && !hit.has('boss')) {
      const d = (boss.x - cx) ** 2 + (boss.y - cy) ** 2;
      if (d < bd) { bd = d; best = boss; isBoss = true; }
    }
    if (!best || bd > 130 * 130) break;
    hit.add(isBoss ? 'boss' : best.id); pts.push({ x: best.x, y: best.y - 2 }); cx = best.x; cy = best.y;
    if (isBoss) {
      boss.hp -= dmg; boss.flash = 0.1; explode(best.x, best.y, '#7be9ff', 5, 70);
    // 二阶段：血量首次过半时触发一次闪烁（boss.phase2 标记只做一次）
    if (!boss.phase2 && boss.hp <= boss.maxhp * 0.5) { boss.phase2 = true; boss.phaseFlash = 0.3; }
      if (boss.hp <= 0) { killBoss(); break; }
    } else {
      best.hp -= dmg; best.flash = 0.1;
      if (best.hp <= 0) { const idx = enemies.indexOf(best); if (idx >= 0) killEnemy(best, idx); }
      else explode(best.x, best.y, '#7be9ff', 5, 70);
    }
    dmg = Math.max(1, dmg - 0.6);
  }
  if (pts.length > 1) arcs.push({ pts, life: 0.16, max: 0.16 });
}

/* ==================================================================
   玩家 / 受伤
   ================================================================== */

/* 锁定标记的维持：射击时刷新，不射击则自然消退。
   放在 update 里而不是 draw 里 —— 绘制函数不该改状态。 */
function updateLockMark(dt) {
  if (lockT > 0) lockT -= dt;
  if (state.mode === MODE_PLAY && player.alive && !paused) {
    const t = findNearestEnemy(player.x, player.y);
    if (t) { lockTarget = t; lockT = LOCK_HOLD; }
  }
}

function updatePlayer(dt) {
  if (!player.alive) {
    player.respawn -= dt;
    if (player.respawn <= 0) {
      player.alive = true; player.inv = 2.2; player.x = W / 2; player.cool = 0.2;
      Audio.play(400, 0.12, 'triangle', 0.03, 800);
      // 复活后位置被重置，必须同步基准点，否则下一帧会算出巨大位移导致朝向乱转
      pxPrev = player.x; pyPrev = player.y; playerFace = -Math.PI / 2;
    }
    return;
  }
  if (player.inv > 0) player.inv -= dt;
  if (player.spread > 0) player.spread -= dt;

  let dx = 0, dy = 0;
  if (keys['arrowleft'] || keys['a']) dx -= 1;
  if (keys['arrowright'] || keys['d']) dx += 1;
  if (keys['arrowup'] || keys['w']) dy -= 1;
  if (keys['arrowdown'] || keys['s']) dy += 1;

  if (pointer.active) {
    const speed = isTouch ? 36 : 22;
    player.x += (pointer.x - player.x) * Math.min(1, speed * dt);
    player.y += (pointer.y - player.y) * Math.min(1, speed * dt);
    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      player.x += dx / len * 130 * dt * moveMul();
      player.y += dy / len * 130 * dt * moveMul();
    }
  } else if (dx !== 0 || dy !== 0) {
    const len = Math.hypot(dx, dy);
    player.x += dx / len * 155 * dt * moveMul();
    player.y += dy / len * 155 * dt * moveMul();
  }

  player.x = Math.max(9, Math.min(PLAYER_MAX_X, player.x));
  // 主菜单垮掉期间锁住操作：菜单还在往下掉，此时让玩家动会很割裂
  if (menuFall < 1) return;
  player.y = Math.max(HUD_H + 12, Math.min(H - WB_H - 6, player.y));

  /* 机头朝向：位移超过阈值才更新，静止时保持上一朝向（否则会抖）。
     平滑插值而非直接跳变 —— 直接赋值会显得生硬。 */
  {
    const mdx = player.x - pxPrev, mdy = player.y - pyPrev;
    if (Math.hypot(mdx, mdy) > 0.25) {
      const target = Math.atan2(mdy, mdx);
      let d = target - playerFace;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      playerFace += d * Math.min(1, dt * 14);
    }
  }
  pxPrev = player.x; pyPrev = player.y;

  if (particles.length < particleCap() && Math.random() < 0.55) {
    const engineColors = ['#3ad1ff', '#ff9f43', '#ffffff'];
    particles.push({
      x: player.x + (Math.random() < 0.5 ? -3 : 3) + (Math.random() - 0.5) * 2,
      y: player.y + 5 + Math.random() * 2,
      vx: (Math.random() - 0.5) * 14,
      vy: 35 + Math.random() * 30,
      life: 0.22 + Math.random() * 0.2, max: 0.42,
      color: engineColors[Math.floor(Math.random() * engineColors.length)],
      size: Math.random() < 0.3 ? 2 : 1, glow: true
    });
  }

  player.cool -= dt;
  /* 转场期间不开火。不能只靠钳制 player.cool —— 它是每帧递减的，
     钳到 0.06 只是延后一帧，下一帧照样归零触发 shoot()。
     必须在开火点直接判断。 */
  if (player.cool <= 0 && menuFall >= 1) shoot();
}

function hurtPlayer(dmg) {
  // 第一次挨打才提示超载 —— 没挨过打时玩家不在乎"怎么反击"
  showTutorial('ult', '冷却结束后可释放超载，全屏清场',
    isTouch ? '双击屏幕' : '按 X 键', 3.6);
  if (!player.alive || player.inv > 0) return;
  if (!(dmg > 0)) dmg = DMG.ENEMY_BULLET;   // 缺省按小怪子弹计
  combo = 0; comboTimer = 0;
  /* 护盾点数制：先扣护盾，扣不完的部分才进血。
     原实现是"有盾就完全免疫这一次伤害并清零" —— 那等于 1 点护盾也能挡下 Boss 的一发重击，
     且与"100 点护盾"的数值完全脱节：玩家看着满格盾，实际只挡一下。
     破碎只在护盾真正归零时触发，并给 0.5s 短无敌作为"盾没了"的反馈。 */
  if (player.shield > 0) {
    const absorbed = Math.min(player.shield, dmg);
    player.shield -= absorbed;
    dmg -= absorbed;
    state.shake = Math.max(state.shake, 4);
    explode(player.x, player.y, '#7be9ff', 14, 90);
    Audio.play(520, 0.14, 'triangle', 0.035, 160, 'player');
    if (player.shield <= 0.001) {
      player.shield = 0; player.inv = Math.max(player.inv, 0.5);
      explode(player.x, player.y, '#ffffff', 10, 80);
      pushToast('护盾破碎', '', '#ff4d6d');
      Audio.play(420, 0.25, 'triangle', 0.045, 140, 'player');
    }
    if (dmg <= 0.001) return;      // 完全被护盾吸收
  }
  dmg = Math.round(dmg);
  state.hp -= dmg; state.hpFlash = 0.25;

  if (state.hp <= 0) {
    // 血空：才真正倒下，火力/散射在此重置（原版每掉一命就清零，现改为终局才清）
    state.hp = 0;
    /* respawn 用 Infinity：这是"本局终结、不再复活"的哨兵值。
       原来写 9999 是个魔法数字 —— 读代码的人无法判断它表示"很久"还是"永远"。
       updatePlayer 的复活判定是 respawn <= 0，Infinity 明确表达"永不触发"。 */
    player.alive = false; player.respawn = Infinity; player.power = 1; player.spread = 0;
    explode(player.x, player.y, '#3ad1ff', 26, 135); explode(player.x, player.y, '#ffffff', 10, 70);
    state.shake = 11; flashScreen = 0.25; flashColor = '#ff4d6d';
    Audio.play(150, 0.45, 'sawtooth', 0.055, 38);
    setTimeout(() => Audio.play(90, 0.35, 'square', 0.04, 30), 60);
    setTimeout(() => Audio.play(70, 0.5, 'sawtooth', 0.05, 30), 120);
    gameOver();
  } else {
    // 未死：只扣血 + 短无敌，玩家继续可控
    player.inv = Math.max(player.inv, HURT_INV);
    const heavy = dmg >= 25;                 // 重击：更大的爆炸、更强的震屏
    explode(player.x, player.y, '#3ad1ff', heavy ? 20 : 10, heavy ? 120 : 80);
    state.shake = Math.max(state.shake, heavy ? 10 : 6);
    /* hit-stop 只在玩家自己挨打时触发，且时长随伤害规模递增。
       撞机（50%）定格最久，子弹（12~20）几乎不定格 ——
       满屏都在定格等于没有定格，只有"大事"才配用。 */
    addHitstop(dmg >= 30 ? 0.05 : (dmg >= 15 ? 0.035 : 0));
    flashScreen = Math.max(flashScreen, heavy ? 0.22 : 0.12); flashColor = '#ff4d6d';
    addFloatText(player.x, player.y - 12, '-' + dmg, '#ff4d6d', heavy ? 1.5 : 1.1, 'dmg');
    Audio.play(heavy ? 180 : 230, heavy ? 0.14 : 0.1, 'square', heavy ? 0.04 : 0.03, heavy ? 90 : 110);
  }
}

/* ==================================================================
   僚机 / 道具 / 超载
   ================================================================== */
/* 僚机锁定目标：两架僚机**共用一个目标**，而不是各找最近的。
   各找最近的话两架会四散打不同敌人，看着像散兵不像护卫；
   锁同一个目标，弹道才是收拢的。
   取"玩家正前方最近"而非"离僚机最近"：僚机是护卫，
   它该打的是挡在主人前面那个，而不是自己身边那个。 */
let droneTarget = null;
function updateDroneTarget() {
  if (boss && !boss.entering) { droneTarget = boss; return; }
  let best = null, bd = Infinity;
  for (const e of enemies) {
    if (e.y > player.y) continue;                 // 只打玩家上方（前方）的
    const dx = Math.abs(e.x - player.x), dy = player.y - e.y;
    const d = dx * 1.6 + dy;                      // 横向权重更高：优先正前方
    if (d < bd) { bd = d; best = e; }
  }
  droneTarget = best;
}

function updateDrones(dt) {
  /* 目标每帧重算：目标死了、或更靠前的敌人出现，都能立刻改锁。
     若只在开火瞬间选一次，子弹会追着一个已经不存在的目标飞到底。 */
  if (player.alive) updateDroneTarget();
  for (const d of drones) {
    d.cool -= dt;
    if (d.cool <= 0 && player.alive) {
      d.cool = 0.30;
      bullets.push({
        x: player.x + d.offX, y: player.y + d.offY - 3,
        vx: 0, vy: -330, dmg: 1, drone: true,
        /* 追踪复用导弹那套 homing：逐帧把速度往目标方向插值。
           转向率 12 比导弹的 9 更灵敏 —— 僚机弹初速更快，
           转向慢了会绕着目标转圈而不是咬上去。 */
        homing: true, life: 2.6, target: droneTarget
      });
    }
  }
}

/* 僚机三连引爆：敌人被僚机弹打中 3 下后炸开。
   计数记在**敌人身上**而不是子弹上 —— 子弹命中即消失，记不住；
   而"这只已经被打了两下"本来就是敌人的状态。
   ⚠️ 必须在敌人死亡时清标记：对象池可能复用同一对象，
   留着脏标记会让新敌人一出场就带着 2 层，第一下就炸。 */
const DRONE_MARK_MAX = 3;
const DRONE_BLAST_R = 26;
const DRONE_BLAST_DMG = 2;
function droneBlast(x, y) {
  explode(x, y, '#4ade80', 12, 95);
  addShockwave(x, y, '#4ade80', 10, 80);
  state.shake = Math.min(7, state.shake + 1.8);
  Audio.play(300, 0.1, 'sawtooth', 0.03, 90);
  for (let k = enemies.length - 1; k >= 0; k--) {
    const o = enemies[k];
    if (Math.abs(o.x - x) > DRONE_BLAST_R || Math.abs(o.y - y) > DRONE_BLAST_R) continue;
    o.hp -= DRONE_BLAST_DMG; o.flash = 0.12;
    if (o.hp <= 0) killEnemy(o, k);
  }
  if (boss && !boss.entering) {
    const d = Math.max(Math.abs(boss.x - x), Math.abs(boss.y - y));
    if (d < DRONE_BLAST_R) { boss.hp -= DRONE_BLAST_DMG; boss.flash = 0.14; if (boss.hp <= 0) killBoss(); }
  }
}

function bombBlast() {
  for (const b of ebullets) explode(b.x, b.y, '#ff4d6d', 3, 45);
  ebullets.length = 0;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i]; e.hp -= 3; e.flash = 0.12;
    // 受伤只出火花，死亡才出爆炸 —— 之前两套共用 explode，
    // 同一次命中两种反馈叠在一起是浪费，也让"击杀"失去了辨识度
    if (e.hp <= 0) killEnemy(e, i); else addSpark(e.x, e.y, e.color, 0.8);
  }
  if (boss && !boss.entering) {
    boss.hp -= 25; boss.flash = 0.18; explode(boss.x, boss.y, '#ffffff', 12, 100);
    if (boss.hp <= 0) killBoss();
  }
  state.shake = 12; flashScreen = 0.4; flashColor = '#ffd166';
  Audio.playNoise(0.4, 0.1);
  Audio.play(110, 0.5, 'sawtooth', 0.06, 35);
}

function triggerUlt() {
  if (ultCd > 0 || state.mode !== MODE_PLAY || paused || upgradePanel.active || !player.alive) return;
  ultCd = ULT_CD; ultActive = 2.0; ultScanY = H; flashScreen = 0.35; flashColor = '#7be9ff';
  pushToast('超载释放', '冷却 ' + ULT_CD + ' 秒', '#7be9ff');
  ultUses++;
  state.shake = 12;
  checkAchievement('ult_1'); explode(player.x, player.y, '#7be9ff', 18, 110);
  Audio.play(280, 0.7, 'sawtooth', 0.06, 45);
  setTimeout(() => Audio.play(420, 0.5, 'square', 0.04, 60), 140);
}

function applyPowerup(type, x, y) {
  runPowerups++;       // 战况面板"吃道具数"
  // 自然提示：第一次拿到道具时才说"还能切换武器"—— 在这之前说等于白说
  showTutorial('weapon', isTouch ? '点下方图标切换武器' : '按 1-6 切换武器（六种各有特点）',
    '', 3.6);
  const col = POWERUP_COLORS[type] || '#3ad1ff';
  explode(x, y, col, 12, 80); flashScreen = Math.max(flashScreen, 0.12); flashColor = col;
  switch (type) {
    case 'power':
      if (player.power < 4) { player.power++; pushToast('火力提升', '等级 ' + player.power, '#3ad1ff'); }
      else { state.score += 100; pushToast('火力已满', '+100 分', '#ffd166'); }
      Audio.play(600, 0.08, 'square', 0.03, 1100); setTimeout(() => Audio.play(900, 0.1, 'square', 0.028, 1400), 70); break;
    case 'heal': {
      const healAmt = MEDKIT_HEAL;
      const before = state.hp;
      state.hp = Math.min(state.maxHp, state.hp + healAmt);
      const over = healAmt - (state.hp - before);
      // 溢出不浪费：超出上限的部分转为护盾，让"接近满血时吃血包"也有价值
      if (over > 0) {
        player.shield = Math.min(SHIELD_MAX, player.shield + 25);
        pushToast('生命 +' + (state.hp - before), '溢出转护盾', '#ff4d6d');
      } else {
        pushToast('生命 +' + healAmt, '', '#ff4d6d');
      }
      Audio.play(700, 0.09, 'triangle', 0.035, 1200); setTimeout(() => Audio.play(950, 0.1, 'triangle', 0.03, 1500), 70); break;
    }
    case 'medkitBig':
      const shB2 = player.shield;
      state.hp = state.maxHp; player.shield = Math.min(SHIELD_MAX, player.shield + 50);
      pushToast('生命全满', '护盾 +' + Math.round(player.shield - shB2), '#ffd166');
      Audio.play(600, 0.12, 'triangle', 0.04, 1000); setTimeout(() => Audio.play(900, 0.14, 'triangle', 0.035, 1500), 90);
      setTimeout(() => Audio.play(1200, 0.16, 'sine', 0.03, 1800), 180); break;
    case 'shield':
      /* 先记增量再显示：护盾接近上限时会被截断，
         写死 '+35' 会在只加了 12 点时仍显示 +35，与 HUD 条对不上。 */
      const shBefore = player.shield;
      player.shield = Math.min(SHIELD_MAX, player.shield + 35);
      pushToast('护盾', '+' + Math.round(player.shield - shBefore) + ' 点', '#7be9ff');
      Audio.play(500, 0.1, 'sine', 0.04, 900); setTimeout(() => Audio.play(750, 0.14, 'sine', 0.035, 1100), 80); break;
    case 'spread':
      player.spread = 10; pushToast('散射', '10 秒', '#ffd166');
      Audio.play(650, 0.07, 'square', 0.03, 950); setTimeout(() => Audio.play(820, 0.09, 'square', 0.028, 1200), 70); break;
    case 'slow':
      // 满栏时折成分数，不做静默丢弃 —— 掉落白费玩家会以为是 bug
      if (addItem('slow')) pushToast('拾取 时间缓速', '点击右侧使用', '#7be9ff');
      else { state.score += 60; pushToast('缓速已满', '+60 分', '#7be9ff'); }
      break;
    case 'repair':
      if (addItem('repair')) pushToast('拾取 应急维修', '点击右侧使用', '#4ade80');
      else { state.hp = Math.min(state.maxHp, state.hp + 15); pushToast('维修已满', '+15 生命', '#4ade80'); }
      break;
    case 'collect':
      if (addItem('collect')) pushToast('拾取 磁力吸引', '点击右侧使用', '#ff7be9');
      else { state.score += 60; pushToast('磁力已满', '+60 分', '#ff7be9'); }
      break;
    case 'barrier':
      if (addItem('barrier')) pushToast('拾取 护盾发生器', '点击右侧使用', '#7be9ff');
      else { player.shield = Math.min(SHIELD_MAX, player.shield + 20); pushToast('护盾已满', '+20 点', '#7be9ff'); }
      break;
    case 'magnet':
      magnet = 8; magnetPickups++; checkAchievement('magnet_1');
      pushToast('磁力场', '8 秒', '#ff7be9');
      Audio.play(640, 0.09, 'sine', 0.04, 1050); setTimeout(() => Audio.play(840, 0.1, 'sine', 0.035, 1300), 80); break;
    case 'drone':
      if (drones.length < MAX_DRONES) {
        drones.push({ offX: drones.length === 0 ? -13 : 13, offY: 4, cool: 0 });
        pushToast('僚机上线', drones.length + ' / ' + MAX_DRONES, '#4ade80');
        if (drones.length >= 2) checkAchievement('drones_2');
      } else { state.score += 200; pushToast('僚机已满', '+200 分', '#4ade80'); }
      Audio.play(560, 0.1, 'triangle', 0.035, 1000); setTimeout(() => Audio.play(840, 0.12, 'triangle', 0.03, 1300), 90); break;
    /* 炸弹不再拾取即炸：改为入道具栏，由玩家决定何时放。
       拾取即炸的话，只剩一两只杂兵时也会被白白用掉。 */
    case 'bomb': if (addItem('bomb')) pushToast('拾取 战术炸弹', '点击右侧使用', '#ff4d4d'); break;
  }
}

/* ==================================================================
   敌人 / 子弹 / 碰撞
   ================================================================== */
function updateEnemies(rawDt) {
  /* 缓速只作用于敌人与敌弹。这里整体用 edt 取代 dt，
     因为 updateEnemies 内部全部是敌人自身的位移与开火计时 —— 都该被减速。 */
  const dt = enemyDt(rawDt);
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i]; e.t += dt; if (e.flash > 0) e.flash -= dt;
    if (e.type === 0) { e.y += e.vy * dt; e.x += Math.sin(e.t * 3.2 + e.ph) * 46 * dt; }
    else if (e.type === 1) { e.y += e.vy * dt; e.x = e.bx + Math.sin(e.t * 2.1 + e.ph) * 38; }
    else if (e.type === 2) {
      e.y += e.vy * dt; e.x = e.bx + Math.sin(e.t * 0.9 + e.ph) * 14; e.fire -= dt;
      if (e.fire <= 0 && e.y > 8 && e.y < H - 60) {
        e.fire = 1.2 + Math.random() * 1.0 - Math.min(0.7, state.wave * 0.05);
        if (state.wave >= 3 && Math.random() < 0.5) { for (let k = -1; k <= 1; k++) ebullets.push({ x: e.x, y: e.y + 4, vx: k * 60, vy: 115 }); }
        else ebullets.push({ x: e.x, y: e.y + 4, vx: 0, vy: 130 });
        Audio.play(220, 0.05, 'square', 0.014, 150);
      }
    } else if (e.type === 3) {
      e.y += e.vy * dt;
      if (player.alive) { const dx = player.x - e.x; const step = 82 * dt; if (Math.abs(dx) > step) e.x += Math.sign(dx) * step; else e.x = player.x; }
      e.x += Math.sin(e.t * 9) * 0.7;
    } else if (e.type === 4) { e.y += e.vy * dt; e.x = e.bx + Math.sin(e.t * 1.2 + e.ph) * 22; }
    else if (e.type === 5) {
      e.y += e.vy * dt; e.x += Math.sin(e.t * 6 + e.ph) * 22 * dt;
      if (player.alive && e.y > player.y - 28 && e.y < player.y + 22 && Math.abs(e.x - player.x) < 15) {
        explode(e.x, e.y, '#ff3355', 24, 135); explode(e.x, e.y, '#ffd166', 10, 80);
        state.shake = Math.max(state.shake, 9); Audio.play(200, 0.25, 'sawtooth', 0.05, 50);
        swapRemove(enemies, i); hurtPlayer(dmgSuicide()); continue;
      }
    }
    e.x = Math.max(8, Math.min(W - 8, e.x));
    if (e.y > H + 14) swapRemove(enemies, i);
  }
}

/* ===== 击杀特效分级 =====
   之前所有击杀都走 explode(count=14)，而 explode 的"大爆炸"分支要求 count>=16，
   于是 nova 光条 / 整屏色差 / 余烬 / 副环**一次都没触发过** ——
   玩家看到的永远是"粒子 + 一个向外扩散的环"，也就是那个椭圆扩散。

   现在按"因果形态"分三级，每级一套独立仪式，不能叠加也不能打折：
   · 杂兵 —— 不给光环。只给极短火花 + 向下方抛射的物质（它是"掉下去的"）
   · 精英 —— nova 光条 + 辐条环 + 整屏色差（它是"被轰开的"）
   · 首领 —— 先向内塌陷（能量被抽走）再爆开，见 killBoss()

   稀缺性是这一改的核心：杂兵不给光环，精英/首领的爆炸才有冲击力。
   之前满屏都在扩散椭圆，等于没有爆炸。 */
function killFx(e) {
  const elite = !e.small && (e.maxhp >= 3 || e.type === 4);
  if (!elite) {
    /* 杂兵：只给火花 + 向下抛射的物质碎片，**不给光环**。
       这是最重要的一条 —— 杂兵再炫，等于没有爆炸。 */
    addSpark(e.x, e.y, e.color, 1);
    const cap = particleCap();
    for (let i = 0; i < 7 && particles.length < cap; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 30 + Math.random() * 55;
      // 向下偏置：它是"掉下去的"，不是"炸开的"
      particles.push({
        x: e.x, y: e.y, px: e.x, py: e.y,
        vx: Math.cos(a) * sp * 0.6, vy: Math.abs(Math.sin(a) * sp) + 40,
        life: 0.16 + Math.random() * 0.2, max: 0.36,
        color: Math.random() < 0.3 ? '#ffffff' : e.color,
        size: 1, glow: true
      });
    }
    return;
  }
  /* 精英：nova 光条 + 辐条环 + 整屏色差。
     同屏 nova 限 2 个 —— 15 波敌机密集时全铺开会糊住视线，
     超出则降级为普通爆炸（不给 nova，但物质和环照给）。 */
  /* explode(count>=16) 自带 nova。这里只在它**真的给出** nova 时才配色差 ——
     否则降级时也叠色差，会出现"没有光条却整屏抖动"的割裂感。
     之前 killFx 自己再 addNova 一次，导致同点叠两条光条，白白翻倍亮度。 */
  const nBefore = novas.length;
  explode(e.x, e.y, e.color, 16, 105);      // count>=16 才进 big 分支
  if (novas.length > nBefore) addChroma(0.3);
  else addShockwave(e.x, e.y, e.color, 12, 95);   // 降级：补一个环
  addEmbers(e.x, e.y, e.color, 4);
  state.shake = Math.min(7, state.shake + 3.2);
}

function killEnemy(e, index) {
  if (e.dMark) e.dMark = 0;   // 清标记：对象池可能复用该对象
  enemies.splice(index, 1); combo++; comboTimer = COMBO_WINDOW;
  if (combo > maxCombo) maxCombo = combo;
  if (combo >= 10) checkAchievement('combo_10');
  if (combo >= 25) checkAchievement('combo_25');
  checkAchievement('first_kill');
  const waveBonus = 1 + Math.floor((state.wave - 1) / 4);
  const gained = Math.round(e.score * waveBonus * comboMult());
  state.score += gained;
  addFloatText(e.x, e.y - 6, '+' + gained, '#ffd166', 1);
  if (!e.noDrop) state.coins += 2 + Math.floor(state.wave / 3);
  killFx(e);
  state.shake = Math.min(7, state.shake + (e.small ? 0.8 : 2.2));
  Audio.play(180, 0.16, 'sawtooth', 0.038, 55);
  stats.totalKills++; runKills++;
  runHits++;           // 命中率分子
  if (e.type === 5) { suicideKills++; if (suicideKills >= 5) checkAchievement('suicide_5'); }
  if (e.type === 4 && !e.small) {
    for (let k = 0; k < 2; k++) {
      const sx = e.x + (k === 0 ? -9 : 9);
      enemies.push({ id: enemyIdCounter++, type: 0, x: sx, bx: sx, y: e.y, w: 7, h: 6, hp: 1, maxhp: 1, vy: 55, score: 5, color: '#e879f9', sprite: SPR.e0, white: SPR.e0w, t: 0, ph: Math.random() * Math.PI * 2, flash: 0, fire: 999, noDrop: true, small: true });
    }
    Audio.play(420, 0.1, 'square', 0.02, 260);
  }
  if (e.noDrop) return;
  const dropChance = e.type === 2 ? 0.28 : e.type === 4 ? 0.42 : e.type === 3 ? 0.16 : e.type === 1 ? 0.14 : 0.08;
  if (Math.random() < dropChance) powerups.push({ x: e.x, y: e.y, vy: 55, t: 0, type: randomPowerupType() });
}

/* ===== 锁定标记 =====
   弹幕游戏最缺的是"目标感" —— 之前打谁都一样，玩家只是往上方倾泻火力。
   现在瞄准最近目标时，目标身上出现方框 + 四角刻度，持续 0.4s。

   四角刻度而不是实心框：实心框会盖住敌人本体（敌人只有 7~10px），
   四角刻度把"框住"和"看见"分开了。 */
let lockTarget = null, lockT = 0;
const LOCK_HOLD = 0.4;
/* ===== 威胁提示 =====
   弹幕游戏最怕"突然死" —— 从屏幕外/视野边缘飞来的子弹看不见就中弹。
   现在屏幕外的敌弹在**对应边缘**画一个红色箭头指向它。

   为什么是箭头而不是把子弹画出来：子弹在屏外，画出来等于凭空多一个点，
   玩家不知道它从哪来；箭头钉在边缘，方向即来源。
   红色不跟主题走（见 NEVER_THEME）—— 危险色是全局约定。 */
function drawThreatArrows() {
  if (state.mode !== MODE_PLAY || !player.alive) return;
  const M = 6;                      // 距边缘的判定余量
  const shown = [];
  for (const b of ebullets) {
    // 只提示"正在接近玩家"的：远离的子弹不构成威胁
    if (b.vy < 0 && b.y < player.y) continue;
    let ex = null, ey = null, ang = 0;
    if (b.y < HUD_H + M) {                       // 从上边缘进入
      ex = Math.max(10, Math.min(W - 10, b.x)); ey = HUD_H + 3; ang = Math.PI / 2;
    } else if (b.x < M) { ex = 5; ey = Math.max(HUD_H + 10, Math.min(H - WB_H - 10, b.y)); ang = 0; }
    else if (b.x > W - M) { ex = W - 5; ey = Math.max(HUD_H + 10, Math.min(H - WB_H - 10, b.y)); ang = Math.PI; }
    if (ex === null) continue;
    if (shown.length >= 4) break;                // 同屏最多 4 个，多了就是噪音
    shown.push({ ex, ey, ang });
  }
  if (!shown.length) return;
  const k = 0.55 + Math.sin(state.time * 8) * 0.25;
  ctx.save();
  ctx.globalAlpha = k;
  ctx.fillStyle = '#ff4d6d';
  for (const s of shown) {
    ctx.save();
    ctx.translate(s.ex, s.ey);
    ctx.rotate(s.ang);                           // 三角默认尖端朝右（+1,0）
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(-2.5, -3); ctx.lineTo(-2.5, 3); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawLockMark() {
  if (!lockTarget || lockT <= 0) return;
  const e = lockTarget;
  if (e.hp !== undefined && e.hp <= 0) { lockT = 0; return; }
  const k = Math.min(1, lockT / LOCK_HOLD);
  const r = (e.w || 8) / 2 + 5, ry = (e.h || 7) / 2 + 4;
  const cx = Math.round(e.x) + 0.5, cy = Math.round(e.y) + 0.5;
  ctx.save();
  ctx.globalAlpha = k * 0.9;
  ctx.strokeStyle = TH(); ctx.lineWidth = 1;
  // 四角 L 形刻度
  const L = Math.max(2.5, r * 0.42);
  const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
  for (const [sx, sy] of corners) {
    ctx.beginPath();
    ctx.moveTo(cx + sx * r, cy + sy * ry - sy * L);
    ctx.lineTo(cx + sx * r, cy + sy * ry);
    ctx.lineTo(cx + sx * r - sx * L, cy + sy * ry);
    ctx.stroke();
  }
  ctx.restore();
}

function findNearestEnemy(x, y) {
  let best = null, bd = Infinity;
  for (const e of enemies) { const d = (e.x - x) ** 2 + (e.y - y) ** 2; if (d < bd) { bd = d; best = e; } }
  if (boss && !boss.entering) { const d = (boss.x - x) ** 2 + (boss.y - y) ** 2; if (d < bd) { bd = d; best = boss; } }
  return best;
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.homing) {
      b.life -= dt; if (b.life <= 0) { swapRemove(bullets, i); continue; }
      if (!b.target || b.target.hp <= 0 || (b.target !== boss && enemies.indexOf(b.target) < 0)) b.target = findNearestEnemy(b.x, b.y);
      const speed = b.drone ? 330 : 250;
      // 转向率：僚机 12（弹速快，转慢了会绕圈），导弹 9
      const turn = b.drone ? 12 : 9;
      if (b.target) {
        const dx = b.target.x - b.x, dy = b.target.y - b.y, d = Math.hypot(dx, dy) || 1;
        b.vx += (dx / d * speed - b.vx) * Math.min(1, turn * dt); b.vy += (dy / d * speed - b.vy) * Math.min(1, turn * dt);
      } else b.vy -= 260 * dt;
      /* 拖尾粒子：僚机弹一局里能打出上百发，概率降到 0.18 且用绿色，
         否则满屏橙色残迹会盖住弹幕，反而看不清该躲什么。 */
      if (!b.drone && Math.random() < 0.5) particles.push({ x: b.x, y: b.y + 3, vx: (Math.random() - 0.5) * 18, vy: 26, life: 0.24, max: 0.24, color: '#ff9f43', size: 1 });
      else if (b.drone && Math.random() < 0.18) particles.push({ x: b.x, y: b.y + 2, vx: (Math.random() - 0.5) * 12, vy: 20, life: 0.18, max: 0.18, color: '#4ade80', size: 1 });
    } else if (b.boomerang) {
      b.t += dt;
      if (b.phase === 'out' && b.t > 0.42) { b.phase = 'back'; b.hitIds.clear(); }
      if (b.phase === 'back' && player.alive) {
        const dx = player.x - b.x, dy = player.y - b.y, d = Math.hypot(dx, dy) || 1, sp = 360;
        b.vx = dx / d * sp; b.vy = dy / d * sp;
        if (d < 12) { swapRemove(bullets, i); continue; }
      } else if (b.phase === 'back' && !player.alive) b.vy = 200;
      if (Math.random() < 0.4) particles.push({ x: b.x, y: b.y, vx: (Math.random() - 0.5) * 26, vy: (Math.random() - 0.5) * 26, life: 0.2, max: 0.2, color: '#b06bff', size: 1 });
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.laser && Math.random() < 0.5) {
      particles.push({
        x: b.x, y: b.y + 3,
        vx: (Math.random() - 0.5) * 10, vy: 22 + Math.random() * 12,
        life: 0.14 + Math.random() * 0.08, max: 0.22,
        color: '#ff4d6d', size: 2, glow: true
      });
    }
    if (b.y < -18 || b.y > H + 18 || b.x < -18 || b.x > W + 18) swapRemove(bullets, i);
  }
  const edt = enemyDt(dt);   // 缓速只影响敌人与敌弹，玩家与自机弹幕照常
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i]; b.x += b.vx * edt; b.y += b.vy * edt;
    if (b.y > H + 10 || b.y < -10 || b.x < -10 || b.x > W + 10) swapRemove(ebullets, i);
  }
}

function updateArcs(dt) { for (let i = arcs.length - 1; i >= 0; i--) { arcs[i].life -= dt; if (arcs[i].life <= 0) swapRemove(arcs, i); } }

function updatePowerups(dt) {
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i]; p.t += dt; p.y += p.vy * dt; p.x += Math.sin(p.t * 4) * 22 * dt;
    if (magnet > 0 && player.alive) {
      const dx = player.x - p.x, dy = player.y - p.y, d = Math.sqrt(dx * dx + dy * dy);
      if (d > 0.5) { p.x += dx / d * 165 * dt; p.y += dy / d * 165 * dt; }
    }
    if (p.y > H + 12) { swapRemove(powerups, i); continue; }
    if (player.alive && Math.abs(p.x - player.x) < 11 && Math.abs(p.y - player.y) < 11) { applyPowerup(p.type, p.x, p.y); swapRemove(powerups, i); }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt; if (p.life <= 0) { swapRemove(particles, i); continue; }
    p.px = p.x; p.py = p.y;                       // 记录上一帧位置，供拖尾绘制
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.vy += 30 * dt;
  }
}
function updateFloatTexts(dt) {
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const t = floatTexts[i]; t.life -= dt; t.y += t.vy * dt; t.vy *= 0.92;
    if (t.life <= 0) swapRemove(floatTexts, i);
  }
}

function updateDebris(dt) {
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i]; d.life -= dt;
    if (d.life <= 0) { swapRemove(debris, i); continue; }
    d.x += d.vx * dt; d.y += d.vy * dt;
    d.vy += 180 * dt; d.rot += d.rotSpeed * dt;
  }
}
function drawDebris() {
  for (const d of debris) {
    const t = Math.max(0, d.life / d.max);
    ctx.globalAlpha = t;
    // 白热：刚抛出时接近白色，随寿命衰减回本色 —— 碎片的"余温"
    ctx.fillStyle = t > 0.75 ? '#ffffff' : d.color;
    const sp = Math.hypot(d.vx, d.vy);
    ctx.save(); ctx.translate(Math.round(d.x), Math.round(d.y));
    if (sp > 40) {
      // 运动拉伸：高速时沿速度方向拉成条，像真实的抛射碎片
      const ang = Math.atan2(d.vy, d.vx);
      ctx.rotate(ang);
      const stretch = Math.min(4.5, 1 + sp / 62);
      ctx.fillRect(-d.size * stretch / 2, -d.size / 2, d.size * stretch, d.size);
      // 拖影：再画一段半透明的"前一段"，比单条矩形更像有速度
      ctx.globalAlpha = t * 0.35;
      ctx.fillRect(-d.size * stretch * 0.9, -d.size * 0.35, d.size * stretch * 0.8, d.size * 0.7);
    } else {
      ctx.rotate(d.rot);
      ctx.fillRect(-d.size/2, -d.size/2, d.size, d.size);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function checkCollisions() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i]; let removed = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      const cdy = b.y - e.y; if (cdy > e.h / 2 + 3 || cdy < -e.h / 2 - 3) continue;
      const cdx = b.x - e.x; if (cdx > e.w / 2 + 2 || cdx < -e.w / 2 - 2) continue;
      {
        let dmg = b.dmg || 1;
        // 命中火花：每次命中都给一次"脆"反馈，暴击时更大
        addSpark(b.x, b.y, b.crit ? '#ffd166' : (b.color || '#3ad1ff'), b.crit ? 1.5 : 1);
        if (b.crit) { dmg = Math.round(dmg * 2.5); critCount++; if (critCount >= 50) checkAchievement('crit_50'); addFloatText(e.x, e.y - 8, dmg + '!', '#ffd166', 1.3, 'crit'); }
        if (b.pierce || b.boomerang) { if (b.hitIds.has(e.id)) continue; b.hitIds.add(e.id); }
        else { swapRemove(bullets, i); removed = true; }
        if (b.homing && !b.drone) {
          explode(b.x, b.y, '#ff9f43', 10, 90);
          for (let k = enemies.length - 1; k >= 0; k--) {
            const o = enemies[k]; if (o === e) continue;
            if (Math.abs(o.x - e.x) < 14 && Math.abs(o.y - e.y) < 14) { o.hp -= 1; o.flash = 0.1; if (o.hp <= 0) killEnemy(o, k); }
          }
        }
        e.hp -= dmg; e.flash = 0.09;
        /* 僚机弹累计标记：满 3 下在敌人当前位置引爆。
           放在扣血之后、死亡判定之前 —— 顺序反了的话，
           已经被打死的敌人还会再触发一次爆炸。 */
        if (b.drone && e.hp > 0) {
          e.dMark = (e.dMark || 0) + 1;
          if (e.dMark >= DRONE_MARK_MAX) { e.dMark = 0; droneBlast(e.x, e.y); }
        }
        if (b.laser) {
          explode(b.x, b.y, b.crit ? '#ffd166' : '#ff4d6d', b.crit ? 10 : 5, b.crit ? 120 : 70);
          for (let k = 0; k < 4; k++) {
            particles.push({
              x: b.x, y: b.y,
              vx: (Math.random() - 0.5) * 180, vy: (Math.random() - 0.5) * 180,
              life: 0.2, max: 0.2,
              color: b.crit ? '#ffffff' : '#ff4d6d', size: 2, glow: true
            });
          }
        } else if (!b.homing || b.drone) {
          explode(b.x, b.y - 2, b.crit ? '#ffd166' : '#8ab4d8', b.crit ? 6 : 3, b.crit ? 70 : 45);
        }
        if (e.hp <= 0) killEnemy(e, j); else if (!b.homing || b.drone) Audio.play(340, 0.035, 'square', 0.018, 240);
        if (removed) break;
      }
    }
    if (removed) continue;
    if (boss && !boss.entering) {
      if (Math.abs(b.x - boss.x) < boss.w / 2 - 2 && Math.abs(b.y - boss.y) < boss.h / 2 - 2) {
        let dmg = b.dmg || 1;
        // Boss 命中同样给火花
        addSpark(b.x, b.y, b.crit ? '#ffd166' : (b.color || '#3ad1ff'), b.crit ? 1.6 : 1.1);
        if (b.crit) { dmg = Math.round(dmg * 2.5); critCount++; if (critCount >= 50) checkAchievement('crit_50'); addFloatText(b.x, b.y - 6, dmg + '!', '#ffd166', 1.3, 'crit'); }
        if (b.pierce || b.boomerang) { if (b.hitIds.has('boss')) continue; b.hitIds.add('boss'); }
        else swapRemove(bullets, i);
        if (b.homing) explode(b.x, b.y, '#ff9f43', 10, 90);
        boss.hp -= dmg; boss.flash = 0.08;
        if (!b.homing) explode(b.x, b.y, '#ffd166', 3, 45);
        if (boss.hp <= 0) killBoss(); else if (!b.homing) Audio.play(380, 0.03, 'square', 0.014, 260);
      }
    }
  }
  if (!player.alive || player.inv > 0) return;
  for (let j = enemies.length - 1; j >= 0; j--) {
    const e = enemies[j];
    if (Math.abs(e.x - player.x) < (e.w + player.w) / 2 - 2 && Math.abs(e.y - player.y) < (e.h + player.h) / 2 - 2) { killEnemy(e, j); hurtPlayer(dmgBody()); return; }
  }
  if (boss && !boss.entering) { if (Math.abs(boss.x - player.x) < boss.w / 2 + 3 && Math.abs(boss.y - player.y) < boss.h / 2 + 3) { hurtPlayer(dmgBossBody()); return; } }
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    if (Math.abs(b.x - player.x) < 5.5 && Math.abs(b.y - player.y) < 6) {
      swapRemove(ebullets, i);
      hurtPlayer(b.boss ? DMG.BOSS_BULLET : DMG.ENEMY_BULLET);
      return;
    }
  }
}

/* ==================================================================
   升级面板 & 波次
   ================================================================== */
function showUpgradePanel() {
  const pool = UPGRADES.filter(u => {
    if (u.id === 'drone' && drones.length >= MAX_DRONES) return false;
    if (u.id === 'power' && player.power >= 4) return false;
    if (u.id === 'life' && state.maxHp >= MAX_HP_CAP) return false;
    if (u.id === 'boom_count' && player.boomCount >= 5) return false;
    if (u.id === 'heal' && state.hp >= state.maxHp) return false;        // 满血时不浪费卡位
    if (u.id === 'spread' && player.spread > 6) return false;
    if (u.id === 'magnet' && magnet > 6) return false;
    if (u.id === 'ult_core' && ultCd <= 0) return false;                 // 冷却已好则不出现
    if (u.id === 'dmg' && dmgMul >= DMG_CAP - 1e-9) return false;        // 已到 +10% 上限
    return true;
  });
  if (pool.length === 0) { startWave(state.wave + 1); return; }
  /* 排序：按"当前最缺什么"排，而不是纯随机。
     快死了却抽到三张长线养成卡，玩家会觉得系统在为难他。
     做法是先按 prio 降序分档，档内再随机 —— 保证最需要的在前，
     又不至于每次顺序完全固定而失去变化。 */
  const scored = pool.map(u => {
    let p = 0;
    try { p = typeof u.prio === 'function' ? u.prio() : 0; } catch (e) { p = 0; }
    return { u: u, p: p, r: Math.random() };
  });
  scored.sort((a, b) => (b.p - a.p) || (a.r - b.r));
  upgradePanel.options = scored.slice(0, Math.min(3, scored.length)).map(s => s.u);
  upgradePanel.active = true; upgradePanel.timer = 9; Audio.ui(760);
  banner.text = '升级商店'; banner.sub = isTouch ? '点击购买' : '按 1-3'; banner.color = '#ffd166'; banner.t = 1.5;
}
function closeUpgradePanel() { upgradePanel.active = false; upgradePanel.options = []; Audio.ui(520); startWave(state.wave + 1); }
function buyUpgrade(index) {
  const opt = upgradePanel.options[index]; if (!opt) return;
  if (state.coins < opt.cost) { Audio.play(180, 0.1, 'square', 0.02, 120); return; }
  state.coins -= opt.cost;
  switch (opt.id) {
    case 'power': if (player.power < 4) player.power++; else state.score += 200; break;
    case 'life': state.maxHp = Math.min(MAX_HP_CAP, state.maxHp + 25); state.hp = state.maxHp; break;
    case 'drone': if (drones.length < MAX_DRONES) { drones.push({ offX: drones.length === 0 ? -13 : 13, offY: 4, cool: 0 }); if (drones.length >= 2) checkAchievement('drones_2'); } else state.score += 300; break;
    case 'shield': player.shield = Math.min(SHIELD_MAX, player.shield + 50); break;
    case 'boom_count': if (player.boomCount < 5) player.boomCount++; else state.score += 200; break;
    case 'heal': state.hp = Math.min(state.maxHp, state.hp + 50); break;
    case 'spread': player.spread = Math.max(player.spread, 10); break;
    case 'magnet': magnet = Math.max(magnet, 10); break;
    /* 给 3 个炸弹而非立即清屏：商店出现时场上常常没敌人（波次刚清完），
       立即清屏等于花 55 金币炸了个寂寞。持有才能真正"留到弹幕密集时再用"。 */
    case 'bomb':
      for (let i = 0; i < 3; i++) addItem('bomb');
      break;
    case 'ult_core': ultCd = 0; break;
    case 'dmg': dmgMul = Math.min(DMG_CAP, dmgMul + DMG_STEP); break;
  }
  Audio.play(600, 0.1, 'square', 0.03, 1100); explode(W / 2, H / 2, opt.color, 14, 90);
  upgradePanel.options.splice(index, 1); if (upgradePanel.options.length === 0) closeUpgradePanel();
}
function updateWave(dt) {
  if (boss) return; if (upgradePanel.active) return;
  waveClock += dt;
  while (waveQueue.length && waveQueue[0].t <= waveClock) spawnEnemy(waveQueue.shift().type);
  if (waveQueue.length === 0 && enemies.length === 0) { state.waveDelay -= dt; if (state.waveDelay <= 0) showUpgradePanel(); }
}

/* ==================================================================
   主更新
   ================================================================== */
function update(dt) {
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 42);
  if (banner.t > 0) banner.t -= dt; if (achPopup.t > 0) achPopup.t -= dt;
  if (flashScreen > 0) flashScreen = Math.max(0, flashScreen - dt * 2.5);
  if (state.hpFlash > 0) state.hpFlash = Math.max(0, state.hpFlash - dt);
  if (boss && boss.phaseFlash > 0) boss.phaseFlash = Math.max(0, boss.phaseFlash - dt);
  if (weaponGlow > 0) weaponGlow = Math.max(0, weaponGlow - dt);
  if (deathT > 0) deathT = Math.max(0, deathT - dt);
  if (state.mode === MODE_OVER) goAnim += dt;
  // 用 <= 而非 <：血量正好等于阈值时（撞一次后 hp=50%），下一次撞击就会死，必须警告
  state.lowHp = state.mode === MODE_PLAY && state.hp > 0 && (state.hp / state.maxHp) <= LOW_HP_RATIO;
  if (magnet > 0) magnet -= dt;
  if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }
  bgT += dt;
  updateEnvironment(dt);
  for (const s of stars) { s.y += s.v * dt; if (s.y > H) { s.y = -2; s.x = Math.random() * W; } }
  if (planet) { planet.x += planet.vx * dt; if (planet.x < -80 || planet.x > W + 80) planet = null; }
  updateParticles(dt); updateShockwaves(dt); updateFloatTexts(dt); updateArcs(dt);
  updateDebris(dt);
  updateFlashes(dt); updateSparks(dt); updateEmbers(dt); updateNovas(dt);
  animUpdate(dt); rollUpdate(dt); tutUpdate(dt);
  updateGameTimers(dt);
  updateLockMark(dt);
  // 出场动画播完 → 真正关闭。中途再次打开则取消关闭（可打断）
  uiSyncClose();
  if (chroma > 0) chroma = Math.max(0, chroma - dt * 2.6);   // 约 0.38s 衰减完

  if (state.mode === MODE_PLAY && !upgradePanel.active) {
    updatePlayer(dt); updateDrones(dt); updateEnemies(dt); updateBoss(dt); updateBullets(dt); updatePowerups(dt); checkCollisions(); updateWave(dt);
    if (ultActive > 0) {
      ultActive -= dt; ultScanY -= 230 * dt;
      if (ultScanY > -10 && ultScanY < H) {
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          if (Math.abs(e.y - ultScanY) < 8) { e.hp -= 2; e.flash = 0.12; if (e.hp <= 0) killEnemy(e, i); else addSpark(e.x, e.y, e.color, 0.6); }
        }
        if (boss && !boss.entering && Math.abs(boss.y - ultScanY) < boss.h / 2) { boss.hp -= 2; boss.flash = 0.12; if (boss.hp <= 0) killBoss(); }
      }
      if (ultScanY < -12) ultScanY = H;
    }
  }
  /* 超载冷却：递减到 0 时弹"就绪"提示。
     必须在这里检测"刚跨过 0"而不是每帧判断 ultCd <= 0 ——
     后者会在冷却结束后每帧都弹一次，把左下角刷爆。 */
  if (ultCd > 0) {
    ultCd -= dt;
    if (ultCd <= 0) { ultCd = 0; pushToast('超载就绪', isTouch ? '双击屏幕释放' : '按 X 释放', '#ffd166'); }
  }
  if (slowT > 0) slowT = Math.max(0, slowT - dt);
  if (statusT > 0) { statusT -= dt; if (statusT <= 0) { statusT = 0; statusId = null; } }
  if (menuFall < 1) menuFall = Math.min(1, menuFall + dt / FALL_DUR);
  updateMuzzles(dt);
  updateToasts(dt);
  if (upgradePanel.active) { upgradePanel.timer -= dt; if (upgradePanel.timer <= 0) closeUpgradePanel(); }
}

/* ==================================================================
   渲染
   ================================================================== */
function drawStars() {
  let lastC = '';
  for (const s of stars) {
    if (s.c !== lastC) { ctx.fillStyle = s.c; lastC = s.c; }
    ctx.fillRect(s.x | 0, s.y | 0, s.s, s.s);
  }
}

function drawPlayer() {
  if (!player.alive) return;
  if (player.inv > 0 && Math.floor(player.inv * 14) % 2 === 0) return;
  const px = Math.round(player.x) - 4, py = Math.round(player.y) - 4;
  const fx = Math.round(player.x), fy = py + 8, fh = 2 + Math.random() * 3.5;
  ctx.fillStyle = '#ff9f43'; ctx.fillRect(fx - 4, fy, 2, fh); ctx.fillRect(fx + 2, fy, 2, fh);
  ctx.fillStyle = '#fff3b0'; ctx.fillRect(fx - 4, fy, 2, fh * 0.45); ctx.fillRect(fx + 2, fy, 2, fh * 0.45);
  ctx.drawImage(SPR.player, px, py);
  if (player.shield > 0) {
    const r = 10 + Math.sin(state.time * 9) * 1.6;
    const blink = player.shield / SHIELD_MAX < 0.25 ? (Math.floor(state.time * 10) % 2 === 0) : true;
    if (blink) {
      ctx.globalAlpha = 0.40 + Math.sin(state.time * 11) * 0.18;
      ctx.strokeStyle = '#7be9ff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(Math.round(player.x) + 0.5, Math.round(player.y) + 0.5, r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 0.14; ctx.fillStyle = '#7be9ff';
      ctx.beginPath(); ctx.arc(Math.round(player.x) + 0.5, Math.round(player.y) + 0.5, r - 1, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}
function drawDrones() {
  if (!player.alive) return;
  for (const d of drones) {
    const x = Math.round(player.x + d.offX) - 2, y = Math.round(player.y + d.offY) - 2, bob = Math.sin(state.time * 8 + d.offX) * 1;
    ctx.globalAlpha = 0.28 + Math.sin(state.time * 6) * 0.10; ctx.fillStyle = '#4ade80'; ctx.fillRect(x - 1, y - 1 + bob, 7, 7);
    ctx.globalAlpha = 1; ctx.drawImage(SPR.drone, x, Math.round(y + bob));
  }
}
function drawEnemies() { for (const e of enemies) { const x = Math.round(e.x - e.w / 2), y = Math.round(e.y - e.h / 2); if (e.flash > 0) ctx.drawImage(e.white, x, y); else ctx.drawImage(e.sprite, x, y); } }
function drawBoss() {
  if (!boss) return; const b = boss;
  const x = Math.round(b.x - b.w / 2), y = Math.round(b.y - b.h / 2);
  ctx.globalAlpha = 0.18 + Math.sin(b.t * 6) * 0.07; ctx.fillStyle = b.color; ctx.fillRect(x - 4, y - 4, b.w + 8, b.h + 8); ctx.globalAlpha = 1;
  if (b.flash > 0) ctx.drawImage(b.white, x, y, b.w, b.h); else ctx.drawImage(b.sprite, x, y, b.w, b.h);
}
/* 电弧：三层叠加（外辉光 / 主弧 / 白芯）+ 分叉。
   旧版只有一条抖动的青色线 —— 在弹幕里几乎看不见，
   而电弧是"链式闪电"，视觉上必须比子弹更抢眼才能体现它的跳跃感。

   抖动是**沿线段法线方向**的，不是随机偏移圆心：
   沿法线抖才像电流在导体间窜动，随机偏移看着像画歪了。 */
function drawArcs() {
  const useGlow = glowOn();
  for (const a of arcs) {
    const alpha = Math.max(0, a.life / a.max);
    const pts = [];
    for (let i = 0; i < a.pts.length; i++) {
      const p = a.pts[i];
      if (i === 0) { pts.push({ x: p.x, y: p.y }); continue; }
      const prev = a.pts[i - 1];
      const dx = p.x - prev.x, dy = p.y - prev.y, d = Math.hypot(dx, dy) || 1;
      const nx = -dy / d, ny = dx / d;                       // 法线
      const j = (Math.random() - 0.5) * 5;
      pts.push({ x: p.x + nx * j, y: p.y + ny * j });
    }
    const path = () => {
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    };
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (useGlow) {                       // ① 外辉光：宽而软
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = hexA('#7be9ff', 0.30); ctx.lineWidth = 7; path(); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = '#7be9ff'; ctx.lineWidth = 2.5; path(); ctx.stroke();   // ② 主弧
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; path(); ctx.stroke();      // ③ 白芯
    // ④ 分叉：从每个节点甩出一小段，表现"链式"的分支
    if (useGlow && pts.length > 1) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = hexA('#7be9ff', 0.45); ctx.lineWidth = 1.2;
      for (let i = 1; i < pts.length; i++) {
        const ang = Math.random() * Math.PI * 2, len = 3 + Math.random() * 5;
        ctx.beginPath();
        ctx.moveTo(pts[i].x, pts[i].y);
        ctx.lineTo(pts[i].x + Math.cos(ang) * len, pts[i].y + Math.sin(ang) * len);
        ctx.stroke();
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}
/* ==================================================================
   武器弹幕特效
   ==================================================================
   旧实现的根本问题：六种武器**都是"一个竖着的彩色矩形"**，只差颜色和尺寸。
   弹幕游戏里同屏几十发在飞，玩家没有余裕去分辨颜色 —— 形态必须先于颜色被识别。

   重改的三条原则：
     ① **形态区分**：每种武器有独立轮廓（尖锥 / 长刃 / 扇形粒 / 带翼弹头 / 十字刃）
        不看颜色也能立刻认出"这是我当前那把枪在打"
     ② **运动拖尾**：按速度矢量把弹体向后拉伸。子弹速度 300~430px/s，
        画成静态贴纸就没有速度感 —— 而速度感是这个类型的核心手感
     ③ **发光分层**：复用现有 GLOW_KINDS 材质。暗色太空里发光才是"醒目"，
        实心色块会被背景吃掉

   ⚠️ 性能：拖尾与发光都过 quality 门限（见 trailOn / glowOn），
   低画质档退化为实心弹体。弹幕密集时同屏上百发，全特效会拖垮低端机。 */
function trailOn() { return quality >= 0.7; }     // 拖尾：低画质关闭
function glowOn()  { return quality >= 0.5; }     // 辉光：最低画质才关

/* 拖尾：沿速度反方向拉出一条渐隐的楔形。
   用 fillRect 拉伸而不是画多段残影 —— 后者在 100+ 子弹时是几十倍开销。 */
function drawTrail(x, y, vx, vy, len, w, color) {
  const sp = Math.hypot(vx, vy) || 1;
  const ux = -vx / sp, uy = -vy / sp;             // 单位反方向
  const ex = x + ux * len, ey = y + uy * len;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createLinearGradient(x, y, ex, ey);
  g.addColorStop(0, hexA(color, 0.55));
  g.addColorStop(0.55, hexA(color, 0.18));
  g.addColorStop(1, hexA(color, 0));
  ctx.fillStyle = g;
  /* 楔形而非矩形：根部宽、尾端尖。
     矩形拖尾看着像"后面贴了张纸"，楔形才有被拉长的速度感。 */
  ctx.beginPath();
  ctx.moveTo(x - uy * w, y + ux * w);
  ctx.lineTo(x + uy * w, y - ux * w);
  ctx.lineTo(ex, ey);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ===== 枪口闪光 =====
   发射瞬间在机头闪一下。
   旧版完全没有发射反馈 —— 听得到声音、看得到子弹出现，
   但"枪响了"这个瞬间在画面上没有落点，打击感因此弱一截。
   容量 12：连射武器射速 0.11s、闪光只活 0.1s，十来个足够覆盖。 */
const MUZZLE_CAP = 12;
let muzzles = [];
function spawnMuzzle(x, y, color, scale) {
  if (muzzles.length >= MUZZLE_CAP) muzzles.shift();
  muzzles.push({ x, y, color, life: 0.1, max: 0.1, scale: scale || 1 });
}
function updateMuzzles(dt) {
  for (let i = muzzles.length - 1; i >= 0; i--) {
    muzzles[i].life -= dt;
    if (muzzles[i].life <= 0) muzzles.splice(i, 1);
  }
}
function drawMuzzles() {
  if (!muzzles.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const m of muzzles) {
    const k = m.life / m.max;                 // 1 → 0
    const r = (3 + m.scale * 2.5) * (1.4 - k * 0.4);
    ctx.globalAlpha = k;
    ctx.drawImage(getGlowSprite(m.color, 'spark'), m.x - r, m.y - r, r * 2, r * 2);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawBullets() {
  const useTrail = trailOn(), useGlow = glowOn();
  for (const b of bullets) {
    const x = Math.round(b.x), y = Math.round(b.y);
    const crit = b.crit;

    if (b.laser) {
      /* 激光：细长刃 + 强拖尾。它是最快的（430px/s），
         拖尾要给足长度才对得上"穿透高伤"的定位。 */
      const col = crit ? '#ffffff' : '#ff4d6d';
      if (useTrail) drawTrail(x, y, b.vx, b.vy, 26, crit ? 3.4 : 2.6, col);
      if (useGlow) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.drawImage(getGlowSprite(col, 'spark'), x - 7, y - 8, 14, 16);
        ctx.restore();
      }
      ctx.fillStyle = col; ctx.fillRect(x - (crit ? 2 : 1.5), y - 8, crit ? 4 : 3, 17);
      ctx.fillStyle = '#ffd166'; ctx.fillRect(x - 1, y - 6, 2, 13);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y - 4, 1, 9);
    } else if (b.drone) {
      // 僚机弹：小菱形，不给拖尾（数量多，且是副火力不该抢视线）
      const col = '#4ade80';
      if (useGlow) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.drawImage(getGlowSprite(col, 'spark'), x - 3, y - 3, 6, 6);
        ctx.restore();
      }
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(x, y - 3); ctx.lineTo(x + 2, y); ctx.lineTo(x, y + 3); ctx.lineTo(x - 2, y);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 1, y - 1, 2, 2);
    } else if (b.homing) {
      /* 导弹：带翼弹头 + 橙色尾焰。
         翼（左右两个小三角）是它与其他弹最容易区分的特征。 */
      const col = crit ? '#ffffff' : '#ff9f43';
      if (useTrail) drawTrail(x, y, b.vx, b.vy, 16, 2.6, '#ff9f43');
      if (useGlow) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.drawImage(getGlowSprite('#ff9f43', 'spark'), x - 5, y - 5, 10, 10);
        ctx.restore();
      }
      // 翼：与速度垂直方向张开
      const sp = Math.hypot(b.vx, b.vy) || 1;
      const px = -b.vy / sp, py = b.vx / sp;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(x - px * 1 - py * 2, y - py * 1 + px * 2);
      ctx.lineTo(x - px * 4, y - py * 4);
      ctx.lineTo(x - px * 1 + py * 2, y - py * 1 - px * 2);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + px * 1 - py * 2, y + py * 1 + px * 2);
      ctx.lineTo(x + px * 4, y + py * 4);
      ctx.lineTo(x + px * 1 + py * 2, y + py * 1 - px * 2);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = col; ctx.fillRect(x - 2, y - 3, 4, 6);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 1, y - 3, 2, 3);
      // 尾焰：与速度反向
      ctx.fillStyle = '#ffd166'; ctx.fillRect(Math.round(x + b.vx / sp * -4) - 1, Math.round(y + b.vy / sp * -4) - 1, 2, 3);
    } else if (b.boomerang) {
      /* 回旋镖：旋转十字刃 + 紫色拖尾。
         旋转角由 b.t 驱动，让"去—回"两个阶段在视觉上可区分。 */
      const col = crit ? '#ffffff' : '#b06bff';
      if (useTrail) drawTrail(x, y, b.vx, b.vy, 14, 2.2, '#b06bff');
      if (useGlow) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.drawImage(getGlowSprite('#b06bff', 'spark'), x - 5, y - 5, 10, 10);
        ctx.restore();
      }
      ctx.save();
      ctx.translate(x + 0.5, y + 0.5);
      ctx.rotate((b.t || 0) * 14);                 // 旋转：十字刃转起来才像回旋镖
      ctx.fillStyle = col;
      ctx.fillRect(-3.5, -0.9, 7, 1.8);
      ctx.fillRect(-0.9, -3.5, 1.8, 7);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(-0.5, -0.5, 1.5, 1.5);
      ctx.restore();
    } else if (b.spreadShot || b.scatter) {
      /* 散射弹：小扇形粒。与脉冲的区别在**数量与扇形排布**，
         单颗刻意做小 —— 它的表现力来自一片而不是一颗。 */
      const col = crit ? '#ffffff' : '#ffd166';
      if (useTrail) drawTrail(x, y, b.vx, b.vy, 9, 1.6, '#ffd166');
      if (useGlow) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.drawImage(getGlowSprite('#ffd166', 'spark'), x - 3, y - 3, 6, 6);
        ctx.restore();
      }
      ctx.fillStyle = col; ctx.fillRect(x - 1, y - 2, 2, 4);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 1, y - 2, 1, 2);
    } else {
      /* 脉冲：尖锥（不是矩形）。
         尖端朝速度方向 —— 锥形的指向性让"往哪飞"在余光里就能读到。 */
      const col = crit ? '#ffffff' : '#3ad1ff';
      if (useTrail) drawTrail(x, y, b.vx, b.vy, 12, 2, '#3ad1ff');
      if (useGlow) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.drawImage(getGlowSprite('#3ad1ff', 'spark'), x - 4, y - 4, 8, 8);
        ctx.restore();
      }
      const sp = Math.hypot(b.vx, b.vy) || 1;
      const ux = b.vx / sp, uy = b.vy / sp;        // 速度单位向量
      const px = -uy, py = ux;                     // 垂直向量
      const L = crit ? 7 : 5.5, Wd = crit ? 2.4 : 1.8;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(x + ux * L, y + uy * L);                       // 尖端（朝前）
      ctx.lineTo(x - ux * 2 + px * Wd, y - uy * 2 + py * Wd);   // 尾左
      ctx.lineTo(x - ux * 2 - px * Wd, y - uy * 2 - py * Wd);   // 尾右
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 1, y - 2, 2, 2);
    }
  }
  for (const b of ebullets) {
    const x = Math.round(b.x), y = Math.round(b.y);
    if (b.boss) {
      ctx.fillStyle = b.color || '#ff9f43'; ctx.fillRect(x - 2, y - 2, 4, 4);
      ctx.fillStyle = '#fff3b0'; ctx.fillRect(x - 1, y - 1, 2, 2);
    } else {
      ctx.fillStyle = '#ff4d6d'; ctx.fillRect(x - 1, y - 2, 2, 4); ctx.fillRect(x - 2, y - 1, 4, 2);
      ctx.fillStyle = '#ffd166'; ctx.fillRect(x, y - 1, 1, 2);
    }
  }
}
function drawPowerups() {
  for (const p of powerups) {
    const spr = POWERUP_SPRITES[p.type] || SPR.power, col = POWERUP_COLORS[p.type] || '#3ad1ff';
    const bob = Math.sin(p.t * 6) * 1, x = Math.round(p.x - spr.width / 2), y = Math.round(p.y - spr.height / 2 + bob);
    ctx.globalAlpha = 0.22 + Math.sin(p.t * 8) * 0.12; ctx.fillStyle = col; ctx.fillRect(x - 2, y - 2, spr.width + 4, spr.height + 4); ctx.globalAlpha = 1; ctx.drawImage(spr, x, y);
  }
}
/* ===== 发光材质系统 =====
   之前所有发光共用一张径向渐变贴图，所以白核、按钮、标题、火花
   发的是同一种光 —— 这是界面"简陋"的根源之一。
   现在拆成四种材质，用同一套光但不同的衰减曲线与尺寸：
     halo   光晕：大、软、低频。中心都不实，用于面板环境光/背景氛围
     spark  锐光：小、硬、高频。中心实心、衰减陡，用于火花与关键指示
     volume 体积光：介于两者，靠多层叠加产生"厚度"，用于主按钮/能量槽
     sheen  流光：不是径向！方向性线性光带，用于进度条流动与边框能量

   原则：结构可以满，光必须稀缺。四种材质是为了让"仅有的光"各有职责，
   不是为了让更多东西发光。 */
const GLOW_KINDS = {
  //            [半径像素, [[停止点, alpha], ...]]
  halo:   [16, [[0, 0.40], [0.35, 0.17], [0.70, 0.05], [1, 0]]],
  spark:  [8,  [[0, 1], [0.20, 0.72], [0.45, 0.28], [0.75, 0.06], [1, 0]]],
  volume: [12, [[0, 0.90], [0.25, 0.46], [0.55, 0.13], [1, 0]]]
};
const GLOW_CACHE = new Map();
function getGlowSprite(color, kind) {
  kind = kind || 'spark';
  const key = kind + '|' + color;
  let c = GLOW_CACHE.get(key);
  if (!c) {
    const def = GLOW_KINDS[kind] || GLOW_KINDS.spark;
    const R = def[0];
    c = document.createElement('canvas'); c.width = c.height = R * 2;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(R, R, 0, R, R, R);
    for (const [stop, a] of def[1]) grad.addColorStop(stop, hexA(color, a));
    g.fillStyle = grad; g.fillRect(0, 0, R * 2, R * 2);
    // 容量守卫：key 由 (kind, color) 决定，正常只有几十种组合；
    // 但颜色一旦来自运行时拼接就有增长风险，超限整体清空重建。
    if (GLOW_CACHE.size > 96) GLOW_CACHE.clear();
    GLOW_CACHE.set(key, c);
  }
  return c;
}

/* 体积光：多层椭圆叠加。单层贴图是"一个亮点"，三层叠加才有"厚度"。
   用于主按钮背景、能量槽内芯 —— 这些地方需要光有体积，不能是贴纸。 */
function drawVolume(cx, cy, w, h, color, alpha, layers) {
  const ls = layers || [[1.0, 0.26], [0.66, 0.40], [0.34, 0.52]];
  const a = alpha === undefined ? 1 : alpha;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const s = getGlowSprite(color, 'volume');
  for (const [k, la] of ls) {
    ctx.globalAlpha = a * la;
    ctx.drawImage(s, cx - w * k / 2, cy - h * k / 2, w * k, h * k);
  }
  ctx.restore();
}

/* 流光：方向性线性光带，两端淡出。
   与 scanSweep 的区别：sheenBand 只返回渐变对象，调用方决定怎么用
   （填进度条、描边框、做扫光），不绑定圆角矩形。 */
function sheenBand(x, y, len, color, alpha, vertical) {
  const g = vertical
    ? ctx.createLinearGradient(0, y, 0, y + len)
    : ctx.createLinearGradient(x, 0, x + len, 0);
  const a = alpha === undefined ? 0.5 : alpha;
  g.addColorStop(0, hexA(color, 0));
  g.addColorStop(0.5, hexA(color, a));
  g.addColorStop(1, hexA(color, 0));
  return g;
}

/* ===== 按钮分级 =====
   之前所有按钮长得一样（圆角矩形 + 文字），所以"开始游戏"和"返回"
   视觉权重相同 —— 玩家第一眼看不出哪个是主操作。现在分三档：
     primary 主推：实色渐变底 + 外发光 + 内高光 + 体积光。全屏唯一主操作专用
     ghost   幽灵：透明底 + 发光描边，悬停/呼吸时描边渐亮。轻但有存在感
     quiet   安静：最低权重，用于次要/取消类操作
   三档共用同一套圆角与内距（栅格），所以看起来是"一个家族"。 */
function drawActionButton(x, y, w, h, text, color, kind, opt) {
  opt = opt || {};
  const k = kind || 'ghost';
  /* 时钟可由调用方注入：暂停界面必须传 uiTime（state.time 在暂停时是冻结的）。
     默认仍是 state.time —— 菜单页在非暂停态下用世界时间即可。 */
  const t = opt.t !== undefined ? opt.t : state.time;
  const pulse = 0.5 + Math.sin(t * (opt.speed || 3) + (opt.phase || 0)) * 0.5;
  const r = opt.r === undefined ? 6 : opt.r;
  // 文字按实际高度居中：按钮高度在矮屏会被压缩，写死偏移会偏
  const fs = opt.fs === undefined ? 0.78 : opt.fs;

  if (k === 'primary') {
    // 主推：实色渐变更重 + 环境光晕 + 体积光内芯，三重叠加才"重"得起来
    panel(x, y, w, h, r, {
      bg: hexA(color, 0.16 + pulse * 0.14),
      border: color, bw: 1.8,
      halo: color
    });
    drawVolume(x + w / 2, y + h * 0.62, w * 0.92, h * 1.5, color, 0.42 + pulse * 0.16);
    ctx.globalAlpha = 0.08;
    fillRoundRect(x + 3, y + 3, w - 6, h / 2 - 3, Math.max(1, r - 3), '#ffffff');
    ctx.globalAlpha = 1;
    scanSweep(x, y, w, h, r, t * 0.4, '#ffffff', 0.18 + pulse * 0.12);
    // 边框能量流动：主按钮是全屏唯一有"流动"的元素，光必须稀缺
    borderFlow(x, y, w, h, r, color, t, { speed: 0.26, alpha: 0.5, lw: 1.4 });
    drawTextCenter2(text, x + w / 2, y + (h - fontPx(fs)) / 2, '#eafcff', fs);
  } else if (k === 'quiet') {
    // 安静：几乎不描边，只有一层淡底，用于"取消/次要"
    fillRoundRect(x, y, w, h, r, 'rgba(14, 26, 42, 0.7)');
    strokeRoundRect(x + 0.5, y + 0.5, w - 1, h - 1, r, hexA(color, 0.22), 1);
    drawTextCenter2(text, x + w / 2, y + (h - fontPx(fs)) / 2, hexA(color, 0.85), fs);
  } else {
    // 幽灵：透明底 + 发光描边，呼吸时描边渐亮。轻，但有存在感
    panel(x, y, w, h, r, {
      bg: 'rgba(12, 24, 40, 0.85)',
      border: hexA(color, 0.4 + pulse * 0.35), bw: 1 + pulse * 0.3,
      glow: color
    });
    scanSweep(x, y, w, h, r, t * 0.3 + (opt.phase || 0), color, 0.1 + pulse * 0.08);
    drawTextCenter2(text, x + w / 2, y + (h - fontPx(fs)) / 2,
      pulse > 0.5 ? '#eafcff' : color, fs);
  }
}

/* 带图标的按钮：图标 + 文字并排，比纯文字更好认。
   图标用回调绘制（不同类型图标形态不同，不写死）。 */
function drawIconButton(x, y, w, h, text, color, kind, iconFn, opt) {
  drawActionButton(x, y, w, h, text, color, kind, opt);
  if (iconFn) {
    const o = opt || {};
    const fs = o.fs === undefined ? 0.78 : o.fs;
    // 图标在文字左侧，整体居中：先算文字宽，再反推图标位置
    const tw = textWidth(text, fs);
    const gap = 5;
    const iconCx = x + w / 2 - tw / 2 - gap - 3;
    iconFn(iconCx, y + h / 2);
  }
}

/* 边框能量流动：沿矩形边框跑一圈渐变光点。
   静态界面看着"死"，但发光一旦铺开就等于没有光 —— 所以只让
   最重要的元素（主按钮、选中项）有流动，且幅度很低。
   实现：把边框按周长分段，只在相位附近画一小段亮弧。 */
function borderFlow(x, y, w, h, r, color, t, opt) {
  opt = opt || {};
  const speed = opt.speed === undefined ? 0.22 : opt.speed;
  const segs = opt.segs === undefined ? 44 : opt.segs;
  const arcLen = opt.arcLen === undefined ? 0.16 : opt.arcLen;   // 亮弧占周长比例
  const alpha = opt.alpha === undefined ? 0.5 : opt.alpha;
  // 用圆角矩形的近似周长（圆角会略短，误差不影响观感）
  const per = 2 * (w + h) - 8 * r + 2 * Math.PI * r;
  const base = ((t * speed) % 1 + 1) % 1;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = opt.lw === undefined ? 1.4 : opt.lw;
  ctx.lineCap = 'round';
  for (let i = 0; i < segs; i++) {
    const p0 = i / segs;
    const p1 = (i + 1) / segs;
    // 与相位的环形距离（考虑首尾相接）
    let d = Math.abs(((p0 + p1) / 2 - base + 1) % 1);
    if (d > 0.5) d = 1 - d;
    if (d > arcLen) continue;
    const a = alpha * (1 - d / arcLen);
    ctx.globalAlpha = a;
    ctx.strokeStyle = color;
    // 把周长参数换成矩形上的点
    const pa = per * p0, pb = per * p1;
    const A = perimeterPoint(x, y, w, h, r, pa);
    const Bp = perimeterPoint(x, y, w, h, r, pb);
    ctx.beginPath();
    ctx.moveTo(A[0], A[1]);
    ctx.lineTo(Bp[0], Bp[1]);
    ctx.stroke();
  }
  ctx.restore();
}

/* 圆角矩形周长上的点：把周长参数 s 映射到四边 + 四角圆弧。
   borderFlow 靠它把"一圈"拆成可逐段绘制的线段。 */
function perimeterPoint(x, y, w, h, r, s) {
  const rr = Math.min(r, w / 2, h / 2);
  const straightW = w - 2 * rr, straightH = h - 2 * rr;
  const arcQ = (Math.PI * rr) / 2;              // 每个圆角弧长
  const segs = [straightW, arcQ, straightH, arcQ, straightW, arcQ, straightH, arcQ];
  let acc = 0, idx = 0;
  for (let i = 0; i < segs.length; i++) {
    if (s <= acc + segs[i] || i === segs.length - 1) { idx = i; break; }
    acc += segs[i];
  }
  const local = Math.max(0, Math.min(segs[idx], s - acc));
  const u = segs[idx] > 0 ? local / segs[idx] : 0;
  switch (idx) {
    case 0: return [x + rr + straightW * u, y];                                  // 上边
    case 1: { const a = -Math.PI / 2 + u * Math.PI / 2; return [x + w - rr + Math.cos(a) * rr, y + rr + Math.sin(a) * rr]; }
    case 2: return [x + w, y + rr + straightH * u];                              // 右边
    case 3: { const a = 0 + u * Math.PI / 2; return [x + w - rr + Math.cos(a) * rr, y + h - rr + Math.sin(a) * rr]; }
    case 4: return [x + w - rr - straightW * u, y + h];                          // 下边
    case 5: { const a = Math.PI / 2 + u * Math.PI / 2; return [x + rr + Math.cos(a) * rr, y + h - rr + Math.sin(a) * rr]; }
    case 6: return [x, y + h - rr - straightH * u];                              // 左边
    default: { const a = Math.PI + u * Math.PI / 2; return [x + rr + Math.cos(a) * rr, y + rr + Math.sin(a) * rr]; }
  }
}

/* 数字呼吸：让 UI 上的数字"活着"。
   注意：不做位移抖动 —— drawText 内部有 Math.round(x)，±0.5px 会被取整抹掉，
   而且像素字体本就该对齐像素网格，抖了反而糊。只做明度呼吸，既有效又干净。
   seed 用于错开相位，否则所有数字同步呼吸像故障。 */
function liveNumber(text, x, y, color, scale, seed, opt) {
  opt = opt || {};
  const t = state.time;
  const lo = opt.lo === undefined ? 0.72 : opt.lo;
  const hi = opt.hi === undefined ? 1.0 : opt.hi;
  const k = lo + (hi - lo) * (0.5 + Math.sin(t * 1.6 + (seed || 0) * 1.7) * 0.5);
  drawText(text, x, y, hexA(color, k), scale);
  return k;
}

/* 边框能量流动：四角 L 形刻度按对角线依次亮起。
   结构件本身是静止的骨架（alpha 0.22），流动只在这层骨架上做微光 ——
   骨架要满、光要稀缺，否则就变成"每个面板都在发光"，等于没发光。

   一圈 3.2s、单角峰值只加到 +0.35：这是"系统在待机"的暗示，
   不是"快看这里"。和 frameCorners 的区别是它接受时间参数并做相位错峰。 */
function frameCornersFlow(x, y, w, h, len, color, alpha, lw, t) {
  const L = len === undefined ? 5 : len;
  const a = alpha === undefined ? 0.22 : alpha;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = lw === undefined ? 1 : lw;
  const pts = [
    [x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]
  ];
  for (let i = 0; i < 4; i++) {
    const px = pts[i][0], py = pts[i][1], sx = pts[i][2], sy = pts[i][3];
    // 相位错开 0.25：沿 左上→右上→左下→右下 推进，一圈约 3.2s
    const ph = (((t * 0.31) + i * 0.25) % 1 + 1) % 1;
    const k = Math.sin(ph * Math.PI);            // 0→1→0 的钟形，起落都平滑
    ctx.globalAlpha = a + k * 0.35;
    ctx.beginPath();
    ctx.moveTo(px, py + sy * L); ctx.lineTo(px, py); ctx.lineTo(px + sx * L, py);
    ctx.stroke();
  }
  ctx.restore();
}

/* 进度条流光：在已填充段上跑一条高光带。
   注意只在"已填充"范围内跑 —— 高光跑出填充段会让人误判进度。 */
function drawBarSheen(x, y, w, h, color, t, speed) {
  if (w <= 2) return;
  const px = ((t * (speed || 0.28)) % 1 + 1) % 1;
  const bw = Math.max(6, w * 0.3);
  const sx = x + px * (w + bw) - bw;
  const x0 = Math.max(x, sx), x1 = Math.min(x + w, sx + bw);
  if (x1 - x0 <= 0.5) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = sheenBand(sx, 0, bw, color, 0.85);
  ctx.fillRect(x0, y, x1 - x0, h);
  ctx.restore();
}
function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    const a = Math.max(0, p.life / p.max);
    const s = p.size || 1;
    const x = Math.round(p.x), y = Math.round(p.y);
    if (p.glow) {
      ctx.globalAlpha = a * 0.35;
      const gs = getGlowSprite(p.color, 'spark'), d = s * 6;
      ctx.drawImage(gs, x - d / 2, y - d / 2, d, d);
    }
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    if (p.circle || p.glow) {
      ctx.beginPath(); ctx.arc(x, y, Math.max(1, s * 0.9), 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillRect(x - Math.ceil(s / 2), y - Math.ceil(s / 2), s, s);
    }
    // 速度拉伸拖尾：所有粒子都做（原来只对 size>=2 做）。
    // 用"上一帧位置"反推位移并延长 2.5 倍 —— 慢粒子位移小、自然不出尾，
    // 快粒子尾巴长，速度感靠这个区分，不需要额外字段。
    if (p.px !== undefined) {
      const dx = p.x - p.px, dy = p.y - p.py;
      if (dx * dx + dy * dy > 0.36) {
        ctx.globalAlpha = a * 0.5;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(1, s * 0.9);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.px - dx * 2.5, p.py - dy * 2.5);
        ctx.lineTo(x, y);
        ctx.stroke();
      }
    }
    if (p.ring) {
      ctx.globalAlpha = a * 0.8;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, s * 2 + a * 4, 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.restore();
}
// 飘字分级：普通白字小字 → 暴击黄字放大 → 击杀红字，让伤害反馈有层次
function drawFloatTexts() {
  for (const t of floatTexts) {
    const p = t.life / t.max;                 // 1 → 0
    const a = Math.max(0, p);
    let sc = t.scale || 1, col = t.color;
    if (t.kind === 'crit') {
      sc = (t.scale || 1) * (1 + Math.max(0, p - 0.55) * 1.6);   // 冒出时先放大再回落
      col = '#ffd166';
    } else if (t.kind === 'kill') {
      sc = (t.scale || 1) * (1 + Math.max(0, p - 0.6) * 1.2);
      col = '#ff9f43';
    } else if (t.kind === 'dmg') {
      col = '#ff4d6d';
    } else {
      col = '#eafcff';
    }
    ctx.globalAlpha = a;
    drawTextAt(t.text, t.x, t.y, col, sc);
    ctx.globalAlpha = 1;
  }
}
// 能量条跟随玩家头顶：能量是"你的资源"，跟着你走比固定在角落更直觉。
// 右下角圆圈按钮仍保留 —— 触屏需要一个稳定的点击热区，跟着飞反而难点。
/* 玩家能量环 + 机头朝向指示

   之前能量只是头顶一条 26x3 的横条 —— 抽象，且和"这是我的飞机"完全无关。
   现在把能量做成绕在玩家身上的环：
   · 弧形填充度 = 超载冷却进度（1 - ultCd/ULT_CD），从正上方顺时针
   · 满时外扩脉冲 + 转金色 —— 超载就绪是**技能标识**，不跟主题色走（见 NEVER_THEME）
   · 受伤时整环闪红 —— 危险反馈落在玩家身上而不是 HUD 上，比让 HUD 自己闪更直觉
   · 环外小三角指示移动方向，玩家立刻知道"我在往哪走"

   半径 16 是与玩家名字协商的结果：名字块底必须落在环顶之上 2px，
   否则环会压到飞船上方（玩家名标签已从局内移除，该处不再有内容）。 */
function drawPlayerAura() {
  if (state.mode !== MODE_PLAY || !player.alive || upgradePanel.active || paused) return;
  const R = 16;
  const cx = Math.round(player.x) + 0.5, cy = Math.round(player.y) + 0.5;
  const ratio = ultCd > 0 ? 1 - ultCd / ULT_CD : 1;   // 冷却中弧长递增，冷却好则满环
  const ready = ratio >= 1;
  const hurt = state.hpFlash > 0;
  // 满能量时环整体呼吸外扩，提示"可以释放超载了"
  const rr = R * (ready ? 1 + Math.sin(state.time * 6) * 0.10 : 1);

  // 底环：暗色轨道 + 细描边，让填充弧有参照
  ctx.strokeStyle = 'rgba(10, 22, 36, 0.75)'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = hurt ? '#ff4d6d' : 'rgba(90, 140, 180, 0.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.stroke();

  if (ratio > 0.01) {
    const col = hurt ? '#ffffff' : (ready ? '#ffd166' : TH());
    const a0 = -Math.PI / 2, a1 = a0 + Math.PI * 2 * ratio;
    ctx.save();                                  // 发光内芯：叠加一层更宽的弧
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = col; ctx.lineWidth = 2.8; ctx.globalAlpha = 0.45;
    ctx.beginPath(); ctx.arc(cx, cy, rr, a0, a1); ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = col; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(cx, cy, rr, a0, a1); ctx.stroke();
  }

  // 机头朝向三角：贴在环外侧，随移动方向偏转
  const fa = playerFace;
  ctx.save();
  ctx.translate(cx + Math.cos(fa) * (rr + 4), cy + Math.sin(fa) * (rr + 4));
  ctx.rotate(fa + Math.PI / 2);                  // 三角默认尖端朝上（0,-1）
  ctx.fillStyle = hurt ? '#ff4d6d' : (ready ? '#ffd166' : TH());
  ctx.beginPath(); ctx.moveTo(0, -3.5); ctx.lineTo(2.4, 2); ctx.lineTo(-2.4, 2); ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawUltBeam() {
  if (ultActive <= 0) return; const y = Math.round(ultScanY), pulse = 0.6 + Math.sin(state.time * 30) * 0.25;
  ctx.globalAlpha = Math.min(1, pulse); ctx.fillStyle = '#7be9ff'; ctx.fillRect(0, y - 2, W, 4);
  ctx.globalAlpha = 0.3; ctx.fillRect(0, y - 6, W, 12); ctx.globalAlpha = 1;
}

/* ==================================================================
   音量控制绘制
   ================================================================== */
function drawVolumeSlider(ctrl, compact) {
  const cy = ctrl.y + ctrl.h / 2;
  const iconX = ctrl.x + 3;
  const volColor = Audio.isMuted ? '#3f5f7d' : '#8ab4d8';

  ctx.fillStyle = volColor;
  ctx.beginPath();
  ctx.moveTo(iconX, cy - 3);
  ctx.lineTo(iconX + 3, cy - 3);
  ctx.lineTo(iconX + 7, cy - 6);
  ctx.lineTo(iconX + 7, cy + 6);
  ctx.lineTo(iconX + 3, cy + 3);
  ctx.lineTo(iconX, cy + 3);
  ctx.closePath();
  ctx.fill();

  if (Audio.isMuted) {
    ctx.strokeStyle = '#ff4d6d'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(iconX + 10, cy - 4); ctx.lineTo(iconX + 15, cy + 4);
    ctx.moveTo(iconX + 15, cy - 4); ctx.lineTo(iconX + 10, cy + 4);
    ctx.stroke();
  } else if (Audio.volume > 0.05) {
    ctx.strokeStyle = volColor; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(iconX + 7, cy, 2.5, -0.7, 0.7); ctx.stroke();
    if (Audio.volume > 0.5) { ctx.beginPath(); ctx.arc(iconX + 7, cy, 4.5, -0.7, 0.7); ctx.stroke(); }
  }

  const trackX = 46, trackW = W - 92, trackY = cy - 2;
  fillRoundRect(trackX, trackY, trackW, 4, 2, '#1e3549');
  const fillW = trackW * Audio.volume;
  if (fillW > 0.5) fillRoundRect(trackX, trackY, fillW, 4, 2, Audio.isMuted ? '#3f5f7d' : TH());

  const handleX = trackX + fillW;
  const handleR = compact ? 5 : 6;
  ctx.fillStyle = Audio.isMuted ? '#5b7fa3' : '#eafcff';
  ctx.beginPath(); ctx.arc(handleX, cy, handleR, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = Audio.isMuted ? '#3f5f7d' : TH();
  ctx.lineWidth = 1.5; ctx.stroke();

  const pct = Math.round(Audio.volume * 100) + '%';
  drawTextRight(pct, W - 22, cy - 5, Audio.isMuted ? '#3f5f7d' : '#8ab4d8', compact ? 0.7 : 0.75);
}

/* ==================================================================
   HUD
   ================================================================== */
/* 渐变边线：两端淡出、中间最亮。
   实线会像"一条硬边"，渐变线才像"面板与世界的接缝"。
   抽成函数是因为顶部 HUD 与底部武器栏各需要一条，之前两处各写一遍且颜色写死。 */
function drawEdgeLine(y, color, alpha, h) {
  const hh = h === undefined ? 1.5 : h;
  const g = ctx.createLinearGradient(0, 0, W, 0);
  const a = alpha === undefined ? 0.55 : alpha;
  g.addColorStop(0, hexA(color, 0));
  g.addColorStop(0.5, hexA(color, a));
  g.addColorStop(1, hexA(color, 0));
  ctx.fillStyle = g; ctx.fillRect(0, y, W, hh);
}

/* 数值发光：在数字后面垫一层锐光，而不是用 shadowBlur。
   shadowBlur 每帧要重算模糊，手机上很贵；
   预渲染的 spark 贴图只是一次 drawImage，且 HUD 上就 3 处数字。 */
function drawNumGlow(cx, cy, w, color, alpha) {
  const s = getGlowSprite(color, 'spark');
  const r = Math.max(6, w * 0.75);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = alpha === undefined ? 0.22 : alpha;
  ctx.drawImage(s, cx - r, cy - r * 0.7, r * 2, r * 1.4);
  ctx.restore();
}

function drawHUDBar() {
  ctx.fillStyle = 'rgba(8, 20, 34, 0.92)'; ctx.fillRect(0, 0, W, HUD_H);
  drawEdgeLine(HUD_H - 1, TH(), 0.2, 1);
}
function drawPauseButton() {
  const b = BUTTONS.pause;
  fillRoundRect(b.x, b.y, b.w, b.h, 6, paused ? 'rgba(58,209,255,0.22)' : 'rgba(20, 40, 60, 0.9)');
  strokeRoundRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1, 6, paused ? TH() : '#3f5f7d', 1);
  ctx.fillStyle = paused ? TH() : '#8ab4d8';
  if (paused) { ctx.fillRect(b.x + 6, b.y + 6, 2, 8); ctx.fillRect(b.x + 8, b.y + 7, 2, 6); ctx.fillRect(b.x + 10, b.y + 8, 2, 4); }
  else { ctx.fillRect(b.x + 6, b.y + 6, 3, 8); ctx.fillRect(b.x + 11, b.y + 6, 3, 8); }
}
function drawCoinIcon(cx, cy, r) {
  ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#a87a10'; ctx.beginPath(); ctx.arc(cx, cy, r * 0.62, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd166'; ctx.fillRect(cx - 1, cy - r * 0.55, 2, r * 1.1);
}
/* 道具栏：右侧竖排 3 格。
   空槽也画出来（暗框 + 灰图标）—— 栏位固定，玩家不用每帧重新找位置，
   也才能知道"这局有哪些道具可用"。
   数量显示在右下角，>1 时高亮；键盘提示 7/8/9 只在非触屏时显示。 */
function drawItemBar() {
  if (state.mode !== MODE_PLAY || paused || upgradePanel.active) return;
  for (let i = 0; i < ITEM_N; i++) {
    const it = ITEM_SLOTS[i], n = itemCounts[i], r = itemRect(i);
    const has = n > 0;
    fillRoundRect(r.x, r.y, r.w, r.h, 6, has ? 'rgba(14, 30, 48, 0.92)' : 'rgba(8, 14, 24, 0.72)');
    strokeRoundRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1, 6,
      has ? hexA(it.color, 0.75) : 'rgba(90, 140, 180, 0.22)', has ? 1.4 : 1);

    const spr = it.k === 'bomb' ? SPR.bomb
      : it.k === 'slow' ? SPR.slowItem
      : it.k === 'repair' ? SPR.repairItem
      : it.k === 'collect' ? SPR.magnetItem
      : SPR.shieldItem;
    ctx.save();
    if (!has) ctx.globalAlpha = 0.35;
    ctx.drawImage(spr, r.x + (r.w - spr.width) / 2, r.y + (r.h - spr.height) / 2 - 1);
    ctx.restore();

    if (has) {
      drawTextRight(String(n), r.x + r.w - 3, r.y + r.h - 9, '#eafcff', 0.62);
      if (n >= ITEM_MAX) {                     // 满格：描边轻脉动提示别再捡了
        ctx.globalAlpha = 0.2 + Math.sin(state.time * 5) * 0.12;
        fillRoundRect(r.x, r.y, r.w, r.h, 6, it.color);
        ctx.globalAlpha = 1;
      }
    }
    if (!isTouch) drawText(String(i + 7), r.x + 3, r.y + 1, has ? '#8ab4d8' : '#2b4a66', 0.52);
  }
  // 缓速生效中：整条栏染一层青色，让"为什么变慢了"有出处
  if (slowT > 0) {
    const r0 = itemRect(0);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.10 + Math.sin(state.time * 6) * 0.05;
    fillRoundRect(r0.x, r0.y, ITEM_S, ITEM_TOTAL, 6, '#7be9ff');
    ctx.restore();
  }
}

function drawWeaponBar() {
  ctx.fillStyle = 'rgba(8, 20, 34, 0.96)'; ctx.fillRect(0, H - WB_H, W, WB_H);
  drawEdgeLine(H - WB_H, TH(), 0.5, 1);
  for (let i = 0; i < WEAPON_COUNT; i++) {
    const btn = BUTTONS.weapon[i]; const w = WEAPONS[i]; const active = player.weapon === i;
    if (active) {
      drawVolume(btn.x + btn.w / 2, btn.y + btn.h / 2, btn.w, btn.h, w.color, 0.55);
      fillRoundRect(btn.x, btn.y, btn.w, btn.h, 6, hexA(w.color, 0.2));
      strokeRoundRect(btn.x + 0.5, btn.y + 0.5, btn.w - 1, btn.h - 1, 6, w.color, 1.8);
    } else {
      fillRoundRect(btn.x, btn.y, btn.w, btn.h, 6, 'rgba(14, 26, 42, 0.75)');
      strokeRoundRect(btn.x + 0.5, btn.y + 0.5, btn.w - 1, btn.h - 1, 6, '#1e3549', 1);
    }
    if (active && weaponGlow > 0) {
      const g = weaponGlow / 0.5;                 // 1 → 0
      ctx.save();
      ctx.globalAlpha = g * 0.85;
      strokeRoundRect(btn.x + 0.5, btn.y + 0.5, btn.w - 1, btn.h - 1, 6, '#ffffff', 1.8);
      const sweep = (1 - g) * (btn.w + 10) - 5;   // 高光从左到右扫过
      ctx.globalAlpha = g * 0.45;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(btn.x + sweep, btn.y + 1, 7, btn.h - 2);
      ctx.restore();
    }
    ctx.globalAlpha = active ? 1 : 0.55;
    const ic = getWeaponIcon(i, btn.w * 0.7, active ? w.color : '#8ab4d8');
    ctx.drawImage(ic, Math.round(btn.x + btn.w / 2 - ic.width / 2), Math.round(btn.y + btn.h / 2 - 2 - ic.height / 2));
    ctx.globalAlpha = 1;
